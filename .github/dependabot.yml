version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: bot
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: bot
    groups:
      actions:
        patterns: ["*"]
    # The tag names the Rust release it installs, so a "newer" tag is a
    # toolchain change (or one that does not exist), never an action update.
    ignore:
      - dependency-name: dtolnay/rust-toolchain
