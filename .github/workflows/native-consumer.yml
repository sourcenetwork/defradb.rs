name: Native consumer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vera_revision:
        description: Vera runtime commit (full SHA; blank uses the release qualification pin)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: native-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-consumer:
    name: Native ACP consumer
    runs-on: ubuntu-24.04
    # Full normal-release compilation is retained on a cache miss.
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      VERA_RUNTIME_REVISION: ${{ inputs.vera_revision || 'e48e1d8f9f701da94554a176d913131e2e6a5277' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check qualification driver
        run: python3 .github/scripts/test-native-consumer.py
      - name: Read pinned Vera runtime revision
        id: vera
        run: |
          revision="$(python3 .github/scripts/native-consumer.py --vera-ref --runtime-ref "$VERA_RUNTIME_REVISION")"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: sourcenetwork/vera.rs
          ref: ${{ steps.vera.outputs.revision }}
          path: .native/vera
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: .github/scripts/install-linux-ci-deps.sh
      - name: Free unused hosted SDKs for release builds
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-consumer-1.98
          cache-on-failure: true
          cache-targets: true
          cache-workspace-crates: true
          workspaces: . -> .native/consumer-cache/defra-target
      - name: Restore pinned Vera release runtime
        id: runtime
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .native/consumer-cache/vera-runtime
          key: native-consumer-vera-ubuntu24-rust1.98-${{ steps.vera.outputs.revision }}-${{ hashFiles('.github/scripts/native-consumer.py') }}
      - name: Qualify native provider and replicated authorization
        run: python3 .github/scripts/native-consumer.py --vera .native/vera --runtime-ref "$VERA_RUNTIME_REVISION" --cache-dir "$GITHUB_WORKSPACE/.native/consumer-cache"
      - name: Save successfully built Vera runtime
        if: always() && steps.runtime.outputs.cache-hit != 'true' && hashFiles('.native/consumer-cache/vera-runtime/manifest.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .native/consumer-cache/vera-runtime
          key: ${{ steps.runtime.outputs.cache-primary-key }}
      - name: Retain numeric qualification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-consumer-summary
          path: ${{ runner.temp }}/native-consumer-summary.json
          if-no-files-found: ignore
          retention-days: 7
