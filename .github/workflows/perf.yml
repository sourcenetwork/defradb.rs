name: Performance
on: workflow_dispatch
permissions:
  contents: read
jobs:
  document-create:
    runs-on: ${{ format('runs-on={0}-{1}/spot=false/family=c7i.4xlarge/env=v3/extras=s3-cache', github.run_id, github.run_attempt) }}
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: .github/scripts/install-linux-ci-deps.sh
      - run: cargo build --locked --profile release-fast -p benches --bin cid-phase
      - name: Measure creates on fresh fixtures
        run: |
          set -euo pipefail
          mkdir results
          bench=target/release-fast
          "$bench/cid-phase" 4 > results/phase-4.csv
      - uses: actions/upload-artifact@v7
        with:
          name: document-create-controls
          path: results
