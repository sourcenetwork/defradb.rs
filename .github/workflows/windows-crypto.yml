name: Windows cryptography

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/crypto/**
      - crates/defra-core/**
      - .github/workflows/windows-crypto.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/crypto/**
      - crates/defra-core/**
      - .github/workflows/windows-crypto.yml

permissions:
  contents: read

concurrency:
  group: windows-crypto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crypto:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Exercise the MSVC cryptography backend
        run: cargo test --locked -p crypto --lib
