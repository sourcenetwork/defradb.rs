name: Unit tests

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_SUPER_DEV_DEBUG: '0'

jobs:
  # Linux splits the workspace four ways across RunsOn runners. macOS runs it
  # as one job: the org has five macOS runners, so four jobs a run queued
  # behind each other, and each one compiled the shared dependencies again.
  unit-tests:
    name: ${{ inputs.os }}, ${{ matrix.group }}
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(startsWith(inputs.os, 'macos') && '["all"]' || '["core","data","network","surfaces"]') }}
    env:
      CORE: >-
        -p defra-core -p crdt -p storage -p blockstore -p schema
        -p document -p crypto -p cursor -p datastore -p keyring@0.5.0 -p kms
        -p path+file://${{ github.workspace }}/crates/identity -p path+file://${{ github.workspace }}/crates/zanzibar
        -p path+file://${{ github.workspace }}/crates/acp -p defra-version -p events -p lens
        -p replication-filter -p telemetry
      DATA: -p query -p db -p vera -p pg-compat
      NETWORK: -p p2p -p defra-p2p-adapter -p orbis
      SURFACES: >-
        -p defra-http -p embedded -p cli -p ffi -p defra-node
        -p lens-host -p defra-wasm -p benches -p ffi-test
    steps:
      - name: Pick the packages
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            all) packages="$CORE $DATA $NETWORK $SURFACES" ;;
            core) packages="$CORE" ;; data) packages="$DATA" ;;
            network) packages="$NETWORK" ;; surfaces) packages="$SURFACES" ;;
          esac
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-ci-deps.sh
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.group == 'surfaces' || matrix.group == 'all') }}
      - run: cargo nextest run --cargo-profile super-dev $PACKAGES
      - name: Check loopback gateway discovery listeners
        if: runner.os == 'macOS'
        run: cargo test --profile super-dev -p p2p --features iroh-transport --lib iroh::endpoint_config::bind_tests::loopback_endpoint_does_not_open_wildcard_gateway_discovery_listeners -- --exact --ignored
      # nextest does not run doctests.
      - run: cargo test --doc --profile super-dev $PACKAGES
