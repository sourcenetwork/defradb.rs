name: Unit tests

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_SUPER_DEV_DEBUG: '0'
  # A called workflow does not inherit its caller's env, so the sccache settings
  # are repeated from ci.yml. Only the RunsOn (Linux) jobs can reach the bucket.
  SCCACHE_BUCKET: defradb.rs.sscache-575155546886-us-east-2-an
  SCCACHE_REGION: us-east-2
  SCCACHE_S3_KEY_PREFIX: ci/
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
  SCCACHE_IDLE_TIMEOUT: '0'

jobs:
  # Linux splits the workspace five ways across RunsOn runners. macOS runs it
  # as one job: the org has five macOS runners, so four jobs a run queued
  # behind each other, and each one compiled the shared dependencies again.
  unit-tests:
    name: ${{ inputs.os }}, ${{ matrix.group }}
    # `linux` runs on RunsOn, like the rest of CI; any other value is a hosted label.
    runs-on: ${{ inputs.os == 'linux' && format('runs-on={0}-{1}-{2}/spot={3}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache', github.run_id, github.run_attempt, strategy.job-index, github.event_name == 'merge_group' && 'false' || 'pco') || inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(startsWith(inputs.os, 'macos') && '["all"]' || '["core","data","network","surfaces","node-p2p"]') }}
    env:
      CORE: >-
        -p defra-core -p crdt -p storage -p blockstore -p schema
        -p document -p crypto -p cursor -p datastore -p keyring@0.5.0 -p kms
        -p path+file://${{ github.workspace }}/crates/identity -p path+file://${{ github.workspace }}/crates/zanzibar
        -p path+file://${{ github.workspace }}/crates/acp -p defra-version -p events -p lens
        -p replication-filter -p telemetry
      DATA: -p query -p db -p vera -p pg-compat
      NETWORK: -p p2p -p defra-p2p-adapter -p orbis
      SURFACES: >-
        -p defra-http -p cli -p ffi -p defra-node
        -p lens-host -p defra-wasm -p benches -p ffi-test
      NODE_P2P: -p defra-node --features p2p,http,libp2p
    steps:
      - name: Pick the packages
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            all) packages="$CORE $DATA $NETWORK $SURFACES" ;;
            core) packages="$CORE" ;; data) packages="$DATA" ;;
            network) packages="$NETWORK" ;; surfaces) packages="$SURFACES" ;;
            node-p2p) packages="$NODE_P2P" ;;
          esac
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
      - if: inputs.os == 'linux'
        uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-ci-deps.sh
      - if: inputs.os == 'linux'
        uses: mozilla-actions/sccache-action@v0.0.11
      - if: inputs.os == 'linux'
        run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.group == 'surfaces' || matrix.group == 'all') }}
      - run: cargo nextest run --cargo-profile super-dev $PACKAGES
      # The node's P2P tests need features the workspace run leaves off.
      - if: matrix.group == 'all'
        run: cargo nextest run --cargo-profile super-dev $NODE_P2P
      - name: Check loopback gateway discovery listeners
        if: runner.os == 'macOS'
        run: cargo test --profile super-dev -p p2p --features iroh-transport --lib iroh::endpoint_config::bind_tests::loopback_endpoint_does_not_open_wildcard_gateway_discovery_listeners -- --exact --ignored
      # nextest does not run doctests.
      - run: cargo test --doc --profile super-dev $PACKAGES
