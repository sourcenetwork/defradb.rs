name: Unit tests

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_SUPER_DEV_DEBUG: '0'

jobs:
  unit-tests:
    name: ${{ inputs.os }}, ${{ matrix.group }}
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            packages: >-
              -p defra-core -p crdt -p storage -p blockstore -p schema
              -p document -p crypto -p cursor -p datastore -p keyring@0.5.0 -p kms
              -p "path+file://$PWD/crates/identity" -p "path+file://$PWD/crates/zanzibar"
              -p "path+file://$PWD/crates/acp" -p defra-version -p events -p lens
              -p replication-filter -p telemetry
          - group: data
            packages: -p query -p db -p vera -p pg-compat
          - group: network
            packages: -p p2p -p defra-p2p-adapter -p orbis
          - group: surfaces
            packages: >-
              -p defra-http -p embedded -p cli -p ffi -p defra-node
              -p lens-host -p defra-wasm -p benches -p ffi-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-ci-deps.sh
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unit
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.group == 'surfaces' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - run: cargo nextest run --profile ci --cargo-profile super-dev ${{ matrix.packages }}
      # Nextest does not run doctests.
      - run: cargo test --doc --profile super-dev ${{ matrix.packages }}
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-junit-${{ runner.os }}-${{ matrix.group }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore
