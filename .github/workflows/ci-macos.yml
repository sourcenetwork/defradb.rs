name: CI (macOS)

# Separate from CI so a CI run finishes when its Linux jobs do. RunsOn retries
# a Spot-interrupted job only once its whole run has finished, and hosted
# macOS runners can queue for half an hour.
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    name: Unit tests
    # Mirrors CI's heavy scope: the merge queue and main run it, a pull
    # request does not.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/unit-tests.yml
    with:
      os: macos-latest

  # The required check: a skipped reusable workflow reports under a different
  # name than a run one, so the merge queue waits on this job instead.
  macos:
    name: macOS
    needs: unit-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check macOS results
        env:
          EVENT: ${{ github.event_name }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            test "$UNIT_TESTS" = skipped
          else
            test "$UNIT_TESTS" = success
          fi
