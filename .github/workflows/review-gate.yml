name: Review gate

# A review or a title edit changes only whether Merge gate blocks (#3312), so it reruns that one
# job of the pull request's latest finished CI run. Merge gate reads the reviews
# itself; every other job keeps its result. A CI run still in progress reads the
# reviews when its Merge gate starts, so it needs nothing; a running Merge gate
# is rerun once it finishes. A fork's token cannot
# rerun jobs, so for a fork this run only succeeds a Fork relay job, and
# review-gate-relay.yml reruns Merge gate with the base repository's token.
on:
  pull_request_review:
    types: [submitted, dismissed]
  # A new title changes only whether the commit subject matches it (#3325).
  pull_request:
    types: [edited]

permissions:
  actions: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}

jobs:
  rerun-merge-gate:
    name: Rerun Merge gate
    if: (github.event_name == 'pull_request' && github.event.changes.title || github.event_name == 'pull_request_review' && github.event.review.state != 'commented') && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const head = context.payload.pull_request.head.sha;
            const runs = (await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: head, event: 'pull_request', per_page: 1,
            })).data.workflow_runs;
            const run = runs[0];
            if (!run) return core.info(`No CI run for ${head} yet.`);
            // A Merge gate that has not started reads the reviews and the title when it
            // starts. One that is running may have read them already, so wait for it to
            // finish and rerun it.
            let gate;
            for (let i = 0; ; i++) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
              });
              gate = jobs.find((j) => j.name === 'Merge gate');
              if (gate?.status === 'completed') break;
              if (gate?.status !== 'in_progress') {
                if (run.status !== 'completed') return core.info(`CI run ${run.id}'s Merge gate has not started; it reads the reviews and the title when it starts.`);
                return core.setFailed(`CI run ${run.id} has no finished Merge gate job.`);
              }
              if (i === 60) return core.setFailed(`Merge gate (job ${gate.id}) is still running after 10 minutes.`);
              await new Promise((r) => setTimeout(r, 10000));
            }
            await github.rest.actions.reRunJobForWorkflowRun({ ...context.repo, job_id: gate.id });
            core.info(`Reran Merge gate (job ${gate.id}) of CI run ${run.id}.`);

  fork-relay:
    name: Fork relay
    if: (github.event_name == 'pull_request' && github.event.changes.title || github.event_name == 'pull_request_review' && github.event.review.state != 'commented') && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "review-gate-relay.yml reruns Merge gate for this fork pull request."
