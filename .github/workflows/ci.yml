name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
    # labeled: adding a ci:* label runs the jobs it names.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  CARGO_INCREMENTAL: '0'
  # Standard hosted runners have 14 GB of storage. Keep test artifacts small
  # enough for a clean runner without changing runtime behavior.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_SUPER_DEV_DEBUG: '0'
  # One run's caches exceed the repository's cache quota, so caches saved from
  # pull requests evicted main's and every new pull request compiled from
  # scratch. Only main saves, and one job saves each shared key.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
  # Every RunsOn job shares compiled crates through this bucket. sccache refuses
  # to start when it cannot reach the bucket, so each job sets RUSTC_WRAPPER only
  # after the server is up, and compiles locally otherwise (#1429). The server
  # never idles out, since a restart while the bucket is unreachable fails the build.
  # CI owns the ci/ prefix: the runner role may only read and write there, and
  # other bucket users can read it but not write it.
  SCCACHE_BUCKET: defradb.rs.sscache-575155546886-us-east-2-an
  SCCACHE_REGION: us-east-2
  SCCACHE_S3_KEY_PREFIX: ci/
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
  SCCACHE_IDLE_TIMEOUT: '0'
  # A per-second build time in defra-node changed its compile inputs in every
  # job, so it and every crate above it missed sccache. CI builds share one.
  DEFRA_NODE_BUILD_TIME_OVERRIDE: ci

# RunsOn retries a job whose Spot instance is reclaimed, but a failed
# merge-queue run ejects the pull request before that retry, so merge-queue
# runs take on-demand instances.
jobs:
  ci-scope:
    name: CI scope
    runs-on: ubuntu-latest
    # In the queue it reads the head pull request's checks and runs.
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.decide.outputs.full }}
      reused: ${{ steps.decide.outputs.reused }}
      tree: ${{ steps.decide.outputs.tree }}
      heavy: ${{ steps.decide.outputs.heavy }}
      testo_clients: ${{ steps.decide.outputs.testo_clients }}
      testo_matrix: ${{ steps.decide.outputs.testo_matrix }}
      integration_matrix: ${{ steps.decide.outputs.integration_matrix }}
      io_variants: ${{ steps.decide.outputs.io_variants }}
      run: ${{ steps.decide.outputs.run }}
      testo: ${{ steps.decide.outputs.testo }}
    steps:
      - id: decide
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.eventName === 'pull_request';
            // A ci:<job> label on a pull request also runs that merge-queue job,
            // and ci:full runs all of them. queue-failure-labels.yml adds the
            // label of each job that ejected the pull request from the queue.
            const labels = pr ? context.payload.pull_request.labels.map((l) => l.name) : [];
            // The tree this run tests. A pull request run tests its head merged with
            // its base, which is not always the head's own tree.
            const tree = async (sha) => (await github.rest.git.getCommit({ ...context.repo, commit_sha: sha })).data.tree.sha;
            const tested = await tree(context.sha);
            core.setOutput('tree', tested);
            // A queue entry whose tree a pull request run already passed with the heavy
            // suite (`ci:full`) runs nothing but Merge gate: the queue would build and
            // test the same bytes again (#3315). That holds when the pull request is
            // rebased onto main and nothing is queued ahead of it.
            let reused = false;
            if (context.eventName === 'merge_group') {
              const number = (context.payload.merge_group.head_ref.match(/\/pr-(\d+)-[0-9a-f]+$/) || [])[1];
              if (number) {
                const head = (await github.rest.pulls.get({ ...context.repo, pull_number: Number(number) })).data.head.sha;
                // A stamp counts only on a job of this repository's own pull_request run of
                // the workflow, never on a check run another workflow or an app created.
                const passed = async (workflow, sha, name) => {
                  const runs = (await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: workflow, head_sha: sha, event: 'pull_request', per_page: 20 })).data.workflow_runs;
                  const jobs = [];
                  for (const run of runs) {
                    jobs.push(...(await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id: run.id, filter: 'latest', per_page: 100 }))
                      .filter((j) => j.name === name && j.conclusion === 'success'));
                  }
                  return jobs;
                };
                const gates = await passed('ci.yml', head, 'Merge gate');
                for (const gate of gates) {
                  const notes = await github.paginate(github.rest.checks.listAnnotations, { ...context.repo, check_run_id: gate.id });
                  if (notes.some((a) => a.title === 'Heavy suite passed' && a.message === `tree ${tested}`)) reused = true;
                }
                core.info(`queue entry #${number}: reuses its pull request run = ${reused}`);
              }
            }
            const heavy = !reused && (!pr || labels.includes('ci:full'));
            const want = (job) => heavy || labels.includes(`ci:${job}`);
            let full = !reused;
            // A labelled pull request runs its jobs wherever it sits in a stack.
            if (pr && !labels.some((l) => l.startsWith('ci:'))) {
              const stack = context.payload.pull_request && context.payload.pull_request.stack;
              if (stack) {
                const isTip = stack.position === stack.size;
                const isLowest = stack.base && stack.base.ref === context.payload.pull_request.base.ref;
                full = isTip || isLowest;
                core.info(`stack #${stack.number} pos ${stack.position}/${stack.size} full=${full}`);
              }
            }
            core.setOutput('full', full ? 'true' : 'false');
            core.setOutput('reused', reused ? 'true' : 'false');
            // A pull request runs the fast checks (lint, dependency checks, unit
            // tests, in-process testo); `ci:full` runs everything. The queue runs
            // everything unless its tree already passed on the pull request.
            core.setOutput('heavy', heavy ? 'true' : 'false');
            // Main only warms the caches pull requests restore: its commit is the exact
            // commit the queue or the pull request already tested. It runs the jobs that
            // save a cache and skips the ones that only test.
            const warm = context.eventName === 'push';
            core.setOutput('testo', warm ? 'false' : 'true');
            core.setOutput('run', JSON.stringify({
              feature_checks: want('feature-checks'),
              feature_tests: !warm && want('feature-tests'),
              wasm: want('wasm'),
              lean: want('lean'),
              conformance: !warm && want('conformance'),
              integration: want('integration'),
              p2p: !warm && want('p2p'),
            }));

            // A pull request runs testo through the in-process client, plain and
            // with every field indexed (the secondary-index multiplier), so a green
            // pull request has run the scenarios; the queue runs every client.
            const testoClients = ['in-process', 'in-process-secondary-index', ...['rust-http', 'go-http', 'cli', 'legacy']
              .filter((client) => want(`testo-${client}`))];
            core.setOutput('testo_clients', testoClients.join(','));
            core.setOutput('testo_matrix', JSON.stringify({
              include: testoClients.map((client) => ({
                client,
                defra_client: client === 'in-process-secondary-index' ? 'in-process' : client,
                multipliers: client === 'in-process-secondary-index' ? 'secondary-index' : '',
                shard: 1,
              })),
            }));

            const suites = [
              { suite: 'signed-docs', needs_go: false, multipliers: 'signed-docs' },
              { suite: 'go-compat', needs_go: true },
              { suite: 'iroh', needs_go: false },
              // The same data path on a pool of one worker.
              { suite: 'one-worker', needs_go: false },
            ];
            if (want('integration')) {
              suites.push({ suite: 'rust', needs_go: false });
            }
            // go-compat is the suite that saves the integration cache.
            core.setOutput('integration_matrix', JSON.stringify({ include: warm ? suites.filter((x) => x.suite === 'go-compat') : suites }));

            // The other nuclei io backends run in the merge queue and on main.
            const ioVariants = [{ name: '', suffix: '', backend: '', recv: '' }];
            if (want('io-variants')) {
              ioVariants.push({ name: ' (epoll)', suffix: '-epoll', backend: 'epoll', recv: '' });
              ioVariants.push({ name: ' (no receive buffers)', suffix: '-no-recv-buffers', backend: '', recv: '0' });
            }
            core.setOutput('io_variants', JSON.stringify(ioVariants));

  lint-default:
    name: Lint (default)
    needs: ci-scope
    if: needs.ci-scope.outputs.reused != 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - run: cargo clippy --all --all-targets -- -D warnings
      - name: Data path confinement
        env:
          CLIPPY_CONF_DIR: .github/clippy/data-path
        run: >-
          cargo clippy --lib --no-deps
          -p storage -p datastore -p blockstore -p crdt -p defra-core -p query -p db
          -p acp -p zanzibar -p lens -p kms -p events
          -- -A clippy::all -D clippy::disallowed_methods
      - name: Network edge confinement
        env:
          CLIPPY_CONF_DIR: .github/clippy/edge
        run: >-
          cargo clippy --lib --no-deps --workspace --exclude edge
          -- -A clippy::all -D clippy::disallowed_methods

  feature-checks:
    name: Feature checks (${{ matrix.group }})
    needs: ci-scope
    if: fromJson(needs.ci-scope.outputs.run).feature_checks
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: release
            commands: |
              cargo clippy -p cli --no-default-features --features release-full --all-targets -- -D warnings
              cargo clippy -p cli --no-default-features --all-targets -- -D warnings
          - group: optional
            commands: |
              cargo clippy -p telemetry --features otlp --all-targets -- -D warnings
              cargo clippy -p cli --features otel --all-targets -- -D warnings
              cargo clippy -p defra-node --features otel --all-targets -- -D warnings
              cargo clippy -p defra-node --features p2p --all-targets -- -D warnings
              cargo clippy -p vera-embedded --features node --all-targets -- -D warnings
              cargo clippy -p defra-node --features embedded-vera --all-targets -- -D warnings
              cargo clippy -p defra-node --features embedded-vera,p2p --all-targets -- -D warnings
              cargo clippy -p cli --features embedded-vera --all-targets -- -D warnings
              cargo clippy -p db --features p2p --all-targets -- -D warnings
              cargo clippy -p cli --features iroh,model-trace --all-targets -- -D warnings
          - group: minimal
            commands: |
              cargo clippy -p defra-node --no-default-features --features native --all-targets -- -D warnings
              cargo clippy -p defra-node --no-default-features --features native,p2p --all-targets -- -D warnings
              cargo clippy -p ffi --no-default-features --features native,libp2p --all-targets -- -D warnings
              cargo clippy -p ffi --no-default-features --features native --all-targets -- -D warnings
              cargo check -p ffi --no-default-features --features native,iroh
              cargo test -p ffi --no-default-features --features native --lib
              cargo check -p p2p --no-default-features --features iroh-transport
              cargo check -p db --no-default-features --features native
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature
          save-if: ${{ env.SAVE_CACHE == 'true' && matrix.group == 'release' }}
      - name: Run feature checks
        run: ${{ matrix.commands }}

  dependency-checks:
    name: Dependency checks
    needs: ci-scope
    if: needs.ci-scope.outputs.reused != 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Install cargo-machete
        run: command -v cargo-machete >/dev/null 2>&1 || cargo install cargo-machete --locked
      - name: Check unused dependencies
        run: cargo machete
      - name: Check defra-node feature graph
        run: bash .github/scripts/assert-defra-node-graph.sh

  # Mirrors `just doc`: a broken intra-doc link or malformed doc comment fails.
  docs:
    name: Docs
    needs: ci-scope
    if: needs.ci-scope.outputs.reused != 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build docs with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --keep-going

  # Mirrors `just check-c-api`: defra.h as this change generates it against the
  # one its base generates.
  c-api:
    name: C API compatibility
    needs: ci-scope
    if: needs.ci-scope.outputs.reused != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen,just
      - name: Test the checker
        run: python3 .github/scripts/test-check-c-api.py
      - name: Check the C API against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          git fetch --depth=1 origin "$BASE"
          bash .github/scripts/check-c-api.sh "$BASE"

  lint:
    name: Lint
    needs: [ci-scope, lint-default, feature-checks, dependency-checks, docs, c-api]
    # A queue entry that reuses its pull request run already passed lint there.
    if: always() && needs.ci-scope.outputs.reused != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check lint results
        env:
          RUN_FEATURES: ${{ fromJson(needs.ci-scope.outputs.run || '{}').feature_checks }}
          DEFAULT: ${{ needs.lint-default.result }}
          FEATURES: ${{ needs.feature-checks.result }}
          DEPENDENCIES: ${{ needs.dependency-checks.result }}
          DOCS: ${{ needs.docs.result }}
          C_API: ${{ needs.c-api.result }}
        run: |
          test "$DEFAULT" = success
          # Skipped on a pull request without its ci: label; the merge queue runs them. Only then: a
          # failed scope job also skips them, and leaves RUN_FEATURES empty.
          test "$FEATURES" = success || { test "$FEATURES" = skipped && test "$RUN_FEATURES" = false; }
          test "$DEPENDENCIES" = success
          test "$DOCS" = success
          test "$C_API" = success

  unit-tests:
    name: Unit tests
    needs: ci-scope
    if: needs.ci-scope.outputs.full == 'true'
    uses: ./.github/workflows/unit-tests.yml
    with:
      os: linux

  # The go-compat suite and the go-http testo client both run this binary, so a
  # run builds it at most once.
  go-defradb:
    name: Go DefraDB binary
    needs: ci-scope
    if: needs.ci-scope.outputs.full == 'true'
    outputs:
      pin: ${{ steps.prepare.outputs.pin }}
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - name: Restore Go DefraDB
        id: go-defradb
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/defra-harness
          key: go-defradb-${{ runner.os }}-${{ hashFiles('crates/foundation/defra-version/src/lib.rs') }}
      - name: Install Go toolchain
        if: steps.go-defradb.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          # The pinned GO_COMPAT_COMMIT declares `go 1.26.10`, so an older
          # toolchain cannot build it. Held at 1.26.10: Go 1.26.11 refuses the
          # LTO section in wasmtime-go's prebuilt libwasmtime.a
          go-version: '1.26.10'
      - name: Prepare Go DefraDB binary
        id: prepare
        run: |
          GO_REF=$(grep 'pub const GO_COMPAT_COMMIT' crates/foundation/defra-version/src/lib.rs | sed 's/.*"\(.*\)".*/\1/')
          GO_BRANCH=$(grep 'pub const GO_COMPAT_BRANCH' crates/foundation/defra-version/src/lib.rs | sed 's/.*"\(.*\)".*/\1/')
          GO_TAG=$(grep 'pub const GO_COMPAT_TAG' crates/foundation/defra-version/src/lib.rs | sed 's/.*"\(.*\)".*/\1/')

          if [ -n "$GO_TAG" ]; then
            VER_NUM="${GO_TAG#v}"
            ASSET="defradb_${VER_NUM}_linux_x86_64"
            CACHE_DIR="$HOME/.cache/defra-harness/${GO_TAG}"
            mkdir -p "$CACHE_DIR"
            if [ ! -x "$CACHE_DIR/defradb" ]; then
              curl -fSL -o "$CACHE_DIR/defradb" \
                "https://github.com/sourcenetwork/defradb/releases/download/${GO_TAG}/${ASSET}"
              chmod +x "$CACHE_DIR/defradb"
            fi
          else
            test -n "$GO_REF"
            test -n "$GO_BRANCH"
            CACHE_DIR="$HOME/.cache/defra-harness/${GO_REF}"
            mkdir -p "$CACHE_DIR"
            if [ ! -x "$CACHE_DIR/defradb" ]; then
              WORK_DIR="$RUNNER_TEMP/defradb-${GO_REF}"
              git clone --filter=blob:none --branch "$GO_BRANCH" https://github.com/sourcenetwork/defradb "$WORK_DIR"
              git -C "$WORK_DIR" checkout "$GO_REF"
              make -C "$WORK_DIR" build path="$CACHE_DIR/defradb"
              chmod +x "$CACHE_DIR/defradb"
            fi
          fi

          "$CACHE_DIR/defradb" version --format json
          echo "dir=$CACHE_DIR" >> "$GITHUB_OUTPUT"
          echo "pin=${GO_TAG:-$GO_REF}" >> "$GITHUB_OUTPUT"
          echo "branch=$GO_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Save Go DefraDB
        if: env.SAVE_CACHE == 'true' && steps.go-defradb.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/defra-harness
          key: ${{ steps.go-defradb.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: go-defradb
          path: ${{ steps.prepare.outputs.dir }}/defradb
          retention-days: 1

  build-binaries:
    name: Build integration binaries
    needs: ci-scope
    if: needs.ci-scope.outputs.full == 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-binaries
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build binaries
        run: |
          mkdir -p artifacts/ci
          cargo build -p cli --profile super-dev
          cp target/super-dev/defradb artifacts/ci/defradb
          cargo build -p cli --profile super-dev --features iroh
          cp target/super-dev/defradb artifacts/ci/defradb-iroh
          cargo build -p cli --profile super-dev --features iroh,model-trace
          cp target/super-dev/defradb artifacts/ci/defradb-trace
      - uses: actions/upload-artifact@v7
        with:
          name: defra-ci-binaries
          path: artifacts/ci
          retention-days: 1

  build:
    name: Build & Test
    needs: [ci-scope, unit-tests, build-binaries, feature-tests]
    if: always() && needs.ci-scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        env:
          RUN_FEATURE_TESTS: ${{ fromJson(needs.ci-scope.outputs.run || '{}').feature_tests }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          BINARIES: ${{ needs.build-binaries.result }}
          FEATURE_TESTS: ${{ needs.feature-tests.result }}
        run: |
          test "$UNIT_TESTS" = success
          test "$BINARIES" = success
          # Skipped on a pull request without its ci: label; the merge queue runs them.
          test "$FEATURE_TESTS" = success || { test "$FEATURE_TESTS" = skipped && test "$RUN_FEATURE_TESTS" = false; }

  feature-tests:
    name: Feature tests
    needs: ci-scope
    if: fromJson(needs.ci-scope.outputs.run).feature_tests
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-binaries
          save-if: false
      - run: cargo nextest run --cargo-profile super-dev -p telemetry --features otlp
      - run: cargo nextest run --cargo-profile super-dev -p cli --features otel --test telemetry_dedup
      - run: cargo nextest run --cargo-profile super-dev -p defra-node --features p2p
      - run: cargo nextest run --cargo-profile super-dev -p vera-embedded --features node --test hosted_node --test node_placement
      - run: cargo nextest run --cargo-profile super-dev -p defra-node --features embedded-vera,http --test embedded_vera
      - run: cargo nextest run --cargo-profile super-dev -p defra-node --features embedded-vera,p2p --test embedded_vera_replication
      - run: cargo nextest run --cargo-profile super-dev -p cli --features embedded-vera --test embedded_vera --test embedded_vera_config

  wasm-check:
    name: WASM Build Check
    needs: ci-scope
    if: fromJson(needs.ci-scope.outputs.run).wasm
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Isolate the WASM dependency graph
        run: sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml
      - name: Clippy (wasm32)
        run: cargo clippy -p defra-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Clippy (wasm32, no default features)
        run: cargo clippy -p defra-wasm --target wasm32-unknown-unknown --no-default-features --all-targets -- -D warnings
      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked
      - name: Build WASM
        run: >-
          CARGO_PROFILE_RELEASE_OPT_LEVEL=z
          wasm-pack build crates/surfaces/wasm --release --target web --out-dir ../../../pkg/wasm
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
      - uses: browser-actions/setup-geckodriver@eb8b0670366f719ca31703766a8cb7e3ea2c56ed # v0.0.0
        with:
          geckodriver-version: '0.37.1'
      - name: Install lockfile-matched wasm-bindgen-cli
        run: |
          VER="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[",]/,""); print $3; exit}' Cargo.lock)"
          test -n "$VER"
          cargo install wasm-bindgen-cli --version "$VER" --locked
      - name: Run wasm tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test -p defra-wasm --target wasm32-unknown-unknown --lib --tests 2>&1 | tee wasm-test.log
          if grep -q "running 0 tests" wasm-test.log; then
            echo "::error::a wasm test binary registered zero tests"
            exit 1
          fi
          grep -qE "^test result: ok\. [1-9][0-9]* passed" wasm-test.log
      - name: Browser peer replicates through a hosted relay
        run: tools/browser-p2p-e2e.sh

  lean-conformance:
    name: Lean Conformance
    needs: ci-scope
    if: fromJson(needs.ci-scope.outputs.run).lean
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    timeout-minutes: 20
    env:
      DEFRA_REQUIRE_LAKE: '1'
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check TLA ownership and convergence models
        run: proofs/tla/run-all.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lean-conformance
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build Lean proofs
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: proofs/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - name: Check client-signed create model cases
        run: python3 proofs/lean/test_client_signed_create.py
      # One build and one run for every model binding and the Lean-to-Rust
      # conformance tests: separate invocations resolve features per package
      # and rebuild the shared crates each time.
      - name: Check model bindings and Lean-to-Rust conformance
        run: |
          cargo nextest run --no-fail-fast --run-ignored all \
            -p query -p p2p -p db -p defra-http -p defra-node -p acp -p conformance \
            --features p2p/iroh-transport \
            --lib --test storage_failure --test block --test merge --test projection_scope --test parent_registration --test lean_conformance \
            -E '
              binary_id(query::storage_failure)
              | binary_id(p2p) & (
                test(=iroh::endpoint_config::bind_tests::native_bindings_match_executed_model)
                | test(=iroh::endpoint_config::bind_tests::native_port_mapping_configuration_matches_executed_model))
              | binary_id(db::block) & (
                test(=client_create_graph::trusted_create_graph_matches_model_and_rejects_unapproved_waves)
                | test(=client_create_graph::normalized_agent_intent_preserves_explicit_null_and_datetime)
                | test(=head_conformance::head_queries_match_executable_lean))
              | binary_id(db) & (
                test(=write::create::schema_binding_tests::prepared_create_checks_immutable_definition_even_when_version_is_unchanged)
                | test(=merge::gate_conformance_tests::the_acp_hook_matches_the_executed_gate_model)
                | test(=merge::governance::deferred_conformance_tests::the_index_matches_the_executed_model))
              | binary_id(defra-http) & (
                test(=client_signer_tests::admission_and_token_lifetime_match_the_model)
                | test(=server::router_transform_tests::forwarding_filter_matches_executed_model))
              | binary_id(db::merge) & (
                test(selected_document_transfers_match_executed_model)
                | test(=genesis_access::genesis_reader_matches_executed_lean_model))
              | binary_id(defra-node) & test(owner_observation_tests)
              | binary_id(acp::projection_scope)
              | binary_id(acp::parent_registration)
              | binary_id(conformance)
              | binary_id(conformance::lean_conformance)'

  conformance:
    name: Conformance${{ matrix.io.name }}
    strategy:
      fail-fast: false
      matrix:
        io: ${{ fromJson(needs.ci-scope.outputs.io_variants) }}
    needs: [ci-scope, build-binaries]
    if: fromJson(needs.ci-scope.outputs.run).conformance
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    timeout-minutes: 45
    env:
      DEFRA_CONFORMANCE_BINARY: ${{ github.workspace }}/target/ci/defradb
      DEFRA_CONFORMANCE_IROH_BINARY: ${{ github.workspace }}/target/ci/defradb-iroh
      DEFRA_WORKSPACE_ROOT: ${{ github.workspace }}
      DEFRA_E2E_KEEP: '1'
      RUST_LOG: info
      NUCLEI_BACKEND: ${{ matrix.io.backend }}
      DEFRA_NUCLEI_RECV_BUFFERS: ${{ matrix.io.recv }}
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration
          save-if: false
      - uses: actions/download-artifact@v8
        with:
          name: defra-ci-binaries
          path: target/ci
      - run: chmod +x target/ci/defradb target/ci/defradb-iroh target/ci/defradb-trace
      - name: Run conformance tests
        run: cargo nextest run --cargo-profile super-dev -p conformance --lib --test tla_conformance
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Replay recorded P2P delivery runs through TLC
        env:
          DEFRA_TRACE_BINARY: ${{ github.workspace }}/target/ci/defradb-trace
        run: >-
          cargo nextest run --cargo-profile super-dev -p conformance --test tla_conformance
          -- --ignored model_trace::
      - name: Upload harness node logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-e2e-logs${{ matrix.io.suffix }}
          path: |
            target/e2e/**/logs/*.log
            target/model-trace/**
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Integration (${{ matrix.suite }})
    needs: [ci-scope, build-binaries, go-defradb]
    if: fromJson(needs.ci-scope.outputs.run).integration
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.ci-scope.outputs.integration_matrix) }}
    env:
      DEFRA_RUST_BINARY: ${{ github.workspace }}/target/ci/defradb
      DEFRA_IROH_BINARY: ${{ github.workspace }}/target/ci/defradb-iroh
      DEFRA_MULTIPLIERS: ${{ matrix.multipliers || '' }}
      DEFRA_E2E_KEEP: '1'
      RUST_LOG: info
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration
          save-if: ${{ env.SAVE_CACHE == 'true' && matrix.suite == 'go-compat' }}
      - uses: actions/download-artifact@v8
        with:
          name: defra-ci-binaries
          path: target/ci
      - name: Check binaries
        run: |
          chmod +x target/ci/defradb target/ci/defradb-iroh
          target/ci/defradb version --format json
      - name: Install Go toolchain
        if: matrix.suite == 'go-compat'
        uses: actions/setup-go@v7
        with:
          # The pinned GO_COMPAT_COMMIT declares `go 1.26.10`, so an older
          # toolchain cannot build it.
          go-version: '1.26'
      - name: Download Go DefraDB
        if: matrix.needs_go
        uses: actions/download-artifact@v8
        with:
          name: go-defradb
          path: target/go
      # The cross-runtime harness looks for the binary under its pin in the cache.
      - name: Put Go DefraDB on the PATH
        if: matrix.needs_go
        env:
          PIN: ${{ needs.go-defradb.outputs.pin }}
        run: |
          DIR="$HOME/.cache/defra-harness/$PIN"
          mkdir -p "$DIR"
          install -m 755 target/go/defradb "$DIR/defradb"
          echo "$DIR" >> "$GITHUB_PATH"
          "$DIR/defradb" version --format json
      - name: Verify Go fixtures still match Rust constants
        if: matrix.suite == 'go-compat'
        run: |
          OUT=$(mktemp)
          (cd crates/database/p2p/testdata/gen_message_fixtures && go run .) >> "$OUT"
          (cd crates/database/p2p/testdata/gen_pubsub_rpc_fixture && go run .) >> "$OUT"
          HEXES=$(grep -Eo '\(([0-9]+)( bytes)?\): [0-9a-f]+' "$OUT" | awk '{print $NF}')
          test -n "$HEXES"
          while IFS= read -r H; do
            grep -qR --include='*.rs' -F "$H" crates/database/p2p/
          done <<< "$HEXES"
      - name: Verify the pinned rustffi client resolves
        if: matrix.suite == 'go-compat'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pin=$(sed -nE 's/^pub const GO_FFI_CLIENT_COMMIT: &str = "([0-9a-f]+)";/\1/p' crates/foundation/defra-version/src/lib.rs)
          test -n "$pin" || { echo "GO_FFI_CLIENT_COMMIT not found in crates/foundation/defra-version/src/lib.rs"; exit 1; }
          gh api "repos/sourcenetwork/defradb/commits/$pin" --jq .sha > /dev/null \
            || { echo "GO_FFI_CLIENT_COMMIT=$pin does not resolve on sourcenetwork/defradb"; exit 1; }
      - name: Run rust integration tests (basic)
        if: matrix.suite == 'rust' || matrix.suite == 'signed-docs'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^basic::/) & not test(/^[a-z0-9_]+::.*::go_/)'
      - name: Run rust integration tests (core suites)
        if: matrix.suite == 'rust' || matrix.suite == 'signed-docs'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E
          'test(/^(query|acp|nac|encryption|identity|backup|fts|vector|acp_replay_outage_repro|issue1211_repro|issue1294_bytes_json)::/) & not test(/^[a-z0-9_]+::.*::go_/)'
      - name: Run rust integration tests on a one-worker pool (basic, query)
        if: matrix.suite == 'one-worker'
        env:
          # Every node the suites start runs its data path on one worker.
          DEFRA_WORKERS: '1'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^(basic|query)::/) & not test(/^[a-z0-9_]+::.*::go_/)'
      - name: Run rust P2P integration tests
        if: matrix.suite == 'rust' || matrix.suite == 'signed-docs'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^p2p::/) & not test(/^[a-z0-9_]+::.*::go_/)'
      - name: Run go-compat integration tests
        if: matrix.suite == 'go-compat'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E
          'test(/^(basic|query|acp|nac|backup|p2p|identity|encryption|vera)::/)'
          -- go_
          --skip go_acp_link_collection_nonexistent_policy_reject
          --skip go_acp_link_collection_nonexistent_resource_reject
          --skip go_acp_link_collection_missing_read_perm_reject
          --skip go_acp_link_collection_missing_update_perm_reject
          --skip go_acp_link_collection_missing_delete_perm_reject
      - name: Run go-compat conformance parity
        if: matrix.suite == 'go-compat'
        env:
          DEFRA_CONFORMANCE_BINARY: ${{ github.workspace }}/target/ci/defradb
        run: >-
          cargo nextest run --cargo-profile super-dev -p conformance --test tla_conformance
          -- --ignored
          parity_counter_3node parity_counter_storm_go_go parity_delete_update
          parity_indexed_lww parity_mixed_fields_3node parity_lww_tie_partition
          parity_samedoc_mixed_restart
          parity_unique_twins_rust_rust parity_unique_twins_go_go parity_unique_twins_mixed
      - name: Run iroh integration tests
        if: matrix.suite == 'iroh'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^p2p_iroh::/)'
          -- connection::
          sync::version::initial_col_version sync::version::patch_version_of_
      - name: Run iroh sync ownership fences
        if: matrix.suite == 'iroh'
        run: |
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^p2p_iroh::/)' \
            peer::create::create_propagates_to_last_node_in_chain
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^p2p_iroh::/)' \
            peer::create::head_hint_fanout_above_car_worker_bound_quiesces
      - name: Upload harness node logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-${{ matrix.suite }}-e2e-logs
          path: target/e2e/**/logs/*.log
          retention-days: 7
          if-no-files-found: ignore

  p2p-linux:
    name: P2P Integration (Linux)${{ matrix.io.name }}
    strategy:
      fail-fast: false
      matrix:
        io: ${{ fromJson(needs.ci-scope.outputs.io_variants) }}
    needs: [ci-scope, build-binaries]
    if: fromJson(needs.ci-scope.outputs.run).p2p
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    timeout-minutes: 90
    env:
      DEFRA_RUST_BINARY: ${{ github.workspace }}/target/ci/defradb
      DEFRA_IROH_BINARY: ${{ github.workspace }}/target/ci/defradb-iroh
      DEFRA_WORKSPACE_ROOT: ${{ github.workspace }}
      DEFRA_E2E_KEEP: '1'
      RUST_LOG: info
      NUCLEI_BACKEND: ${{ matrix.io.backend }}
      DEFRA_NUCLEI_RECV_BUFFERS: ${{ matrix.io.recv }}
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration
          save-if: false
      - uses: actions/download-artifact@v8
        with:
          name: defra-ci-binaries
          path: target/ci
      - run: chmod +x target/ci/defradb target/ci/defradb-iroh
      - name: Run rust P2P integration tests
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^p2p::/) & not test(/^[a-z0-9_]+::.*::go_/)'
      - name: Run P2P ownership durability fences
        run: |
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^p2p_admission::/)'
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^p2p_admission_restart::/)'
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^p2p_admission_fairness::/)'
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^p2p_backlog::/)'
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^issue1154_repro::/)'
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^p2p_deep_catchup::/)'
          cargo nextest run --cargo-profile super-dev -p integration-test --test legacy -E 'test(/^p2p_push_storm::/)'
      # Not run: p2p_interop_bench, whose one test is an ignored benchmark that
      # prints latencies. p2p_push_storm's storm test stays ignored too: a
      # profiling harness whose gates are opt-in DEFRA_PUSH_STORM_* variables.
      - name: Upload harness node logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: p2p-linux-e2e-logs${{ matrix.io.suffix }}
          path: target/e2e/**/logs/*.log
          retention-days: 7
          if-no-files-found: ignore

  # Every testo scenario binary under every client, plus the legacy binaries no
  # other job runs. A test that stops at an action its client does not
  # implement counts as unsupported, not failed; testo-report.ts turns the JUnit
  # report into per-binary counts and fails on a failure missing from
  # .github/testo/known-failures/<client>.txt, or on a listed test that passes.
  # go-http also tolerates the failures .github/testo/divergences.txt
  # lists, and fails on one of those that passes.
  # The testo and legacy integration binaries, built once for every testo shard.
  testo-archive:
    name: Build testo archive
    needs: ci-scope
    if: needs.ci-scope.outputs.full == 'true' && needs.ci-scope.outputs.testo == 'true'
    timeout-minutes: 30
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration
          save-if: false
      - name: Archive the test binaries
        run: >-
          cargo nextest archive --cargo-profile super-dev -p integration-test
          --test testo --test legacy --archive-file testo.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: testo-archive
          path: testo.tar.zst
          retention-days: 1
          compression-level: 0

  testo:
    name: ${{ matrix.client == 'legacy' && 'Legacy integration binaries' || format('Testo ({0})', matrix.client) }}
    needs: [ci-scope, build-binaries, go-defradb, testo-archive]
    if: needs.ci-scope.outputs.full == 'true' && needs.ci-scope.outputs.testo == 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache+git-cache+apt-cache
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One job per client: with the binaries built once in testo-archive, each
      # client runs in a couple of minutes, so more shards only add runner
      # start-up. Raise it if a client's job grows past ~10 minutes.
      matrix: ${{ fromJson(needs.ci-scope.outputs.testo_matrix) }}
    env:
      DEFRA_RUST_BINARY: ${{ github.workspace }}/target/ci/defradb
      DEFRA_IROH_BINARY: ${{ github.workspace }}/target/ci/defradb-iroh
      DEFRA_MULTIPLIERS: ${{ matrix.multipliers || '' }}
      DEFRA_E2E_KEEP: '1'
      # A failing scenario shows its in-process nodes' P2P trace.
      DEFRA_TEST_TRACE: p2p=debug,defra_p2p_adapter=debug,warn
      TESTO_FILTER: binary(testo)
      # Not run anywhere: p2p_interop_bench, whose one test is an ignored
      # benchmark that prints latencies, and verars, whose cluster needs the
      # verad validator binary from vera.rs, which CI does not build.
      # c_rust_to_go_outage_replay (#2089) flips between runs: the Go receiver
      # sometimes misses the protected document written while it was down. A
      # known-failure entry would fail every run it passes, so the test is left
      # out here instead of listed; run it again once #2089 is fixed.
      LEGACY_FILTER: >-
        binary(legacy) & test(/^(http_contract|issue1194_repro|acp_replay_outage_cross_runtime)::/)
        & not test(=acp_replay_outage_cross_runtime::c_rust_to_go_outage_replay)
      # Go gives Foo the wrong ID beside FooBar only in some runs (#2528), so a
      # known-failure entry would fail the runs it passes; go-http leaves it out.
      # The Go node sometimes answers a query right after a migration with a
      # transaction conflict (#2392); go-http leaves that scenario out too.
      # Go answers the Commit introspection description in two forms between
      # runs (#2726); go-http leaves that scenario out too.
      GO_HTTP_FILTER: >-
        & not test(=collection::deterministic_ids::a_collection_beside_a_longer_namesake_gets_one_id)
        & not test(=collection_version::migrations::query::with_index::collection_migration_query_with_index_applied_after_migration_should_index_docs_on_latest_version)
        & not test(=query::schema_descriptions::introspection_shows_go_descriptions)
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v8
        with:
          name: testo-archive
      - uses: actions/download-artifact@v8
        with:
          name: defra-ci-binaries
          path: target/ci
      - uses: actions/download-artifact@v8
        with:
          name: go-defradb
          path: target/go
      - name: Build the lens modules
        # A stray CARGO_TARGET_DIR keeps --target-dir honest (#2350): without
        # the flag the modules land there and the lens tests can't find them.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/stray-lens-target
        run: cargo build --manifest-path tools/lenses/Cargo.toml --target wasm32-unknown-unknown --target-dir tools/lenses/target
      - name: Pick the tests
        env:
          CLIENT: ${{ matrix.client }}
          DEFRA_CLIENT_NAME: ${{ matrix.defra_client || matrix.client }}
          PIN: ${{ needs.go-defradb.outputs.pin }}
        run: |
          chmod +x target/ci/defradb target/ci/defradb-iroh
          DIR="$HOME/.cache/defra-harness/$PIN"
          mkdir -p "$DIR"
          install -m 755 target/go/defradb "$DIR/defradb"
          echo "$DIR" >> "$GITHUB_PATH"
          echo "DEFRA_GO_BINARY=$DIR/defradb" >> "$GITHUB_ENV"
          if [ "$CLIENT" = legacy ]; then
            echo "FILTER=$LEGACY_FILTER" >> "$GITHUB_ENV"
          else
            echo "DEFRA_CLIENT=$DEFRA_CLIENT_NAME" >> "$GITHUB_ENV"
            if [ "$CLIENT" = go-http ]; then
              echo "FILTER=($TESTO_FILTER) $GO_HTTP_FILTER" >> "$GITHUB_ENV"
            else
              echo "FILTER=$TESTO_FILTER" >> "$GITHUB_ENV"
            fi
          fi
      - name: Point the tests at the archive
        run: |
          mkdir -p "$RUNNER_TEMP/nextest"
          echo "ARCHIVE=--archive-file testo.tar.zst --workspace-remap . --extract-to $RUNNER_TEMP/nextest --extract-overwrite" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.6
      - name: Run the tests
        id: run
        run: |
          set +e
          cargo nextest run $ARCHIVE -E "$FILTER" \
            --partition hash:${{ matrix.shard }}/${{ matrix.shards || 1 }} --no-fail-fast
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Report
        if: always() && steps.run.outcome == 'success'
        env:
          CLIENT: ${{ matrix.client }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          mkdir -p testo-report
          JUNIT=$(find "$RUNNER_TEMP/nextest" target -path '*/nextest/ci/junit.xml' 2>/dev/null | head -1)
          test -n "$JUNIT"
          cp "$JUNIT" "testo-report/$CLIENT-${{ matrix.shard }}.xml"
          # JUnit leaves out skipped tests, so the list says what this shard selected.
          cargo nextest list $ARCHIVE -E "$FILTER" \
            --partition hash:${{ matrix.shard }}/${{ matrix.shards || 1 }} \
            --message-format json > target/nextest-list.json
          bun .github/scripts/testo-report.ts shard "$JUNIT" target/nextest-list.json \
            "$CLIENT" "${{ matrix.shard }}/${{ matrix.shards || 1 }}" \
            ".github/testo/known-failures/$CLIENT.txt" "testo-report/$CLIENT-${{ matrix.shard }}.json" \
            .github/testo/divergences.txt
          if [ "$STATUS" != 0 ] && ! grep -q '<failure' "$JUNIT"; then
            echo "::error::nextest exited $STATUS without a failing test"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testo-report-${{ matrix.client }}-${{ matrix.shard }}
          path: testo-report
          retention-days: 7
          if-no-files-found: ignore
          # A re-run replaces the first attempt's report, so the summary reads
          # only the latest result.
          overwrite: true

  testo-summary:
    name: Testo summary
    needs: [ci-scope, testo-archive, testo]
    # Runs whenever testo should have, so a failed archive build, which skips
    # every shard, still shows up here as a failed summary.
    if: always() && needs.ci-scope.outputs.full == 'true' && needs.ci-scope.outputs.testo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Require the testo archive
        if: needs.testo-archive.result != 'success'
        run: |
          echo "::error::Build testo archive was ${{ needs.testo-archive.result }}, so no testo shard ran"
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: testo-report-*
          path: testo-report
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.6
      - name: Check the known-failure lists and merge the reports
        env:
          GH_TOKEN: ${{ github.token }}
        # The report goes to a file first so the comment below can post it too.
        run: |
          status=0
          GITHUB_STEP_SUMMARY=testo-summary.md TESTO_CLIENTS=${{ needs.ci-scope.outputs.testo_clients }} bun .github/scripts/testo-report.ts summary testo-report .github/testo/known-failures .github/testo/divergences.txt || status=$?
          cat testo-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # A pull request from a fork runs with a read-only token, so the table
      # stays in the step summary there.
      - name: Comment on the pull request
        if: >-
          always() && hashFiles('testo-summary.md') != '' && (github.event_name == 'merge_group'
          || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/github-script@v9
        with:
          script: |
            const table = require('fs').readFileSync('testo-summary.md', 'utf8');
            const marker = '<!-- defradb-testo-summary -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // A queue run tests this pull request on top of the ones ahead of it;
            // its branch is gh-readonly-queue/main/pr-<number>-<base sha>. Its
            // full table replaces the pull request run's in-process one.
            const queue = context.eventName === 'merge_group';
            const issue_number = queue
              ? Number(/\/pr-(\d+)-/.exec(context.payload.merge_group.head_ref)[1])
              : context.payload.pull_request.number;
            const sha = queue ? context.payload.merge_group.head_sha : context.payload.pull_request.head.sha;
            const source = queue ? 'the merge queue run' : 'this pull request run (${{ needs.ci-scope.outputs.testo_clients }}; the merge queue runs every client)';
            const body = `${marker}\n# Testo summary\n\nFrom [${source}](${run}) on \`${sha.slice(0, 9)}\`.\n\n${table}`;
            const { owner, repo } = context.repo;
            const existing = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number }))
              .find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # The one required check besides Validate title. A job passes when it
  # succeeded, or was skipped and ci-scope did not ask for it; a job skipped
  # because a dependency failed is reported as well as that dependency.
  merge-gate:
    name: Merge gate
    needs:
      - ci-scope
      - lint-default
      - feature-checks
      - dependency-checks
      - docs
      - c-api
      - lint
      - unit-tests
      - go-defradb
      - build-binaries
      - build
      - feature-tests
      - wasm-check
      - lean-conformance
      - conformance
      - integration
      - p2p-linux
      - testo-archive
      - testo
      - testo-summary
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      # A changes request from a reviewer with write access blocks the merge until
      # it is approved or dismissed (#3312). The reviews are read when this job runs,
      # and review-gate.yml reruns this job alone on each review, so a review never
      # reruns the rest of CI.
      - id: reviews
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const decision = new Map();
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100,
            });
            // A reviewer's latest approving, blocking or dismissed review is their decision.
            for (const r of reviews) {
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) decision.set(r.user.login, r.state);
            }
            const blocking = [];
            for (const [login, state] of decision) {
              if (state !== 'CHANGES_REQUESTED') continue;
              // A reviewer whose permission can't be read still blocks.
              const level = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: login })
                .then((r) => r.data.permission, () => 'admin');
              if (['admin', 'maintain', 'write'].includes(level)) blocking.push(login);
            }
            core.setOutput('changes_requested', blocking.join(','));
      # The queue rebase-merges (#3325), so each commit of a pull request lands on
      # main as it is. A pull request with one commit lands it under its title. A
      # batch carries several approved pull requests, one commit each, and each
      # commit names the one it carries as "<title> (#N)".
      - id: commits
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            // A rerun keeps the payload of the event that started the run, so read the
            // current title.
            const pr = (await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number })).data;
            const commits = await github.paginate(github.rest.pulls.listCommits, { ...context.repo, pull_number: pr.number, per_page: 100 });
            const subject = (c) => c.commit.message.split('\n')[0];
            const problems = [];
            const batch = [];
            if (commits.length === 1) {
              const got = subject(commits[0]);
              if (got !== pr.title && got !== `${pr.title} (#${pr.number})`) problems.push(`the commit subject "${got}" is not the title "${pr.title}"`);
            } else {
              const seen = new Set();
              for (const c of commits) {
                const got = subject(c);
                const m = got.match(/^(.+) \(#(\d+)\)$/);
                if (!m) { problems.push(`${c.sha.slice(0, 9)} "${got}" names no pull request; squash to one commit, or end each subject with (#N)`); continue; }
                const [, title, n] = m;
                const number = Number(n);
                if (number === pr.number || seen.has(number)) { problems.push(`${c.sha.slice(0, 9)} repeats #${n}`); continue; }
                seen.add(number);
                const carried = await github.rest.pulls.get({ ...context.repo, pull_number: number }).then((r) => r.data, () => null);
                if (!carried || carried.state !== 'open') { problems.push(`#${n} is not an open pull request`); continue; }
                if (carried.title !== title) problems.push(`${c.sha.slice(0, 9)} title "${title}" is not #${n}'s "${carried.title}"`);
                const decision = new Map();
                for (const r of await github.paginate(github.rest.pulls.listReviews, { ...context.repo, pull_number: number, per_page: 100 })) {
                  if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) decision.set(r.user.login, r.state);
                }
                if (![...decision.values()].includes('APPROVED')) problems.push(`#${n} is not approved`);
                for (const [login, state] of decision) {
                  if (state !== 'CHANGES_REQUESTED') continue;
                  const level = await github.rest.repos.getCollaboratorPermissionLevel({ ...context.repo, username: login }).then((r) => r.data.permission, () => 'admin');
                  if (['admin', 'maintain', 'write'].includes(level)) problems.push(`#${n} has changes requested by ${login}`);
                }
                for (const check of ['Merge gate', 'Validate title']) {
                  const run = (await github.rest.checks.listForRef({ ...context.repo, ref: carried.head.sha, check_name: check, filter: 'latest' })).data.check_runs[0];
                  if (run?.conclusion !== 'success') problems.push(`#${n}'s ${check} is ${run?.conclusion ?? 'missing'}`);
                }
                batch.push({ sha: c.sha, number, base: carried.base.ref, head: carried.head.sha });
              }
            }
            core.setOutput('problems', problems.join('; '));
            core.setOutput('batch', batch.length ? JSON.stringify(batch) : '');
      # Each batch commit must carry exactly the change of the pull request it names:
      # replaying that pull request onto the commit's parent gives the commit's tree.
      # A clean rebase passes; an edit in the wrong place, a whitespace or
      # conflict-resolution edit, or an empty commit fails.
      - if: steps.commits.outputs.batch != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - id: content
        if: steps.commits.outputs.batch != ''
        env:
          BATCH: ${{ steps.commits.outputs.batch }}
        run: |
          set -euo pipefail
          problems=""
          while read -r row; do
            sha=$(jq -r .sha <<<"$row"); n=$(jq -r .number <<<"$row"); base=$(jq -r .base <<<"$row"); head=$(jq -r .head <<<"$row")
            git fetch -q --filter=blob:none origin "+refs/pull/$n/head:refs/carried/$n" "+refs/heads/$base:refs/carried/$n-base"
            if [ "$(git rev-parse "refs/carried/$n")" != "$head" ]; then
              problems="$problems${problems:+; }#$n moved after its Merge gate was checked"
              continue
            fi
            mb=$(git merge-base "refs/carried/$n-base" "refs/carried/$n")
            want=$(git merge-tree --write-tree --merge-base="$mb" "$sha^" "refs/carried/$n" | head -1) || want=""
            got=$(git rev-parse "$sha^{tree}")
            if [ -z "$want" ] || [ "$want" != "$got" ] || [ "$got" = "$(git rev-parse "$sha^^{tree}")" ]; then
              problems="$problems${problems:+; }${sha:0:9} does not carry exactly #$n's change"
            fi
          done < <(jq -c '.[]' <<<"$BATCH")
          echo "problems=$problems" >> "$GITHUB_OUTPUT"
      - name: Check every queue job
        env:
          FULL: ${{ needs.ci-scope.outputs.full }}
          FAST: ${{ needs.ci-scope.outputs.reused != 'true' }}
          HEAVY: ${{ needs.ci-scope.outputs.heavy }}
          TREE: ${{ needs.ci-scope.outputs.tree }}
          RUN_TESTO: ${{ needs.ci-scope.outputs.full == 'true' && needs.ci-scope.outputs.testo == 'true' }}
          CHANGES_REQUESTED: ${{ steps.reviews.outputs.changes_requested }}
          COMMIT_PROBLEMS: ${{ steps.commits.outputs.problems }}
          CONTENT_PROBLEMS: ${{ steps.content.outputs.problems }}
          RUN_FEATURE_CHECKS: ${{ fromJson(needs.ci-scope.outputs.run || '{}').feature_checks }}
          RUN_FEATURE_TESTS: ${{ fromJson(needs.ci-scope.outputs.run || '{}').feature_tests }}
          RUN_WASM: ${{ fromJson(needs.ci-scope.outputs.run || '{}').wasm }}
          RUN_LEAN: ${{ fromJson(needs.ci-scope.outputs.run || '{}').lean }}
          RUN_CONFORMANCE: ${{ fromJson(needs.ci-scope.outputs.run || '{}').conformance }}
          RUN_INTEGRATION: ${{ fromJson(needs.ci-scope.outputs.run || '{}').integration }}
          RUN_P2P: ${{ fromJson(needs.ci-scope.outputs.run || '{}').p2p }}
          CI_SCOPE: ${{ needs.ci-scope.result }}
          LINT_DEFAULT: ${{ needs.lint-default.result }}
          FEATURE_CHECKS: ${{ needs.feature-checks.result }}
          DEPENDENCY_CHECKS: ${{ needs.dependency-checks.result }}
          DOCS: ${{ needs.docs.result }}
          C_API: ${{ needs.c-api.result }}
          LINT: ${{ needs.lint.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          GO_DEFRADB: ${{ needs.go-defradb.result }}
          BUILD_BINARIES: ${{ needs.build-binaries.result }}
          BUILD: ${{ needs.build.result }}
          FEATURE_TESTS: ${{ needs.feature-tests.result }}
          WASM: ${{ needs.wasm-check.result }}
          LEAN: ${{ needs.lean-conformance.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
          INTEGRATION: ${{ needs.integration.result }}
          P2P: ${{ needs.p2p-linux.result }}
          TESTO_ARCHIVE: ${{ needs.testo-archive.result }}
          TESTO: ${{ needs.testo.result }}
          TESTO_SUMMARY: ${{ needs.testo-summary.result }}
        run: |
          set -euo pipefail

          failed=0
          check() {
            local name="$1" result="$2" expected="$3"
            if [ "$result" = success ] || { [ "$result" = skipped ] && [ "$expected" = false ]; }; then
              return 0
            fi
            echo "::error::$name was $result"
            failed=1
          }

          check "CI scope" "$CI_SCOPE" true
          check "Lint (default)" "$LINT_DEFAULT" "$FAST"
          check "Feature checks" "$FEATURE_CHECKS" "$RUN_FEATURE_CHECKS"
          check "Dependency checks" "$DEPENDENCY_CHECKS" "$FAST"
          check "Docs" "$DOCS" "$FAST"
          check "C API compatibility" "$C_API" "$FAST"
          check "Lint" "$LINT" "$FAST"
          check "Unit tests" "$UNIT_TESTS" "$FULL"
          check "Go DefraDB binary" "$GO_DEFRADB" "$FULL"
          check "Build integration binaries" "$BUILD_BINARIES" "$FULL"
          check "Build & Test" "$BUILD" "$FULL"
          check "Feature tests" "$FEATURE_TESTS" "$RUN_FEATURE_TESTS"
          check "WASM Build Check" "$WASM" "$RUN_WASM"
          check "Lean Conformance" "$LEAN" "$RUN_LEAN"
          check "Conformance" "$CONFORMANCE" "$RUN_CONFORMANCE"
          check "Integration" "$INTEGRATION" "$RUN_INTEGRATION"
          check "P2P Integration" "$P2P" "$RUN_P2P"
          check "Build testo archive" "$TESTO_ARCHIVE" "$RUN_TESTO"
          check "Testo" "$TESTO" "$RUN_TESTO"
          check "Testo summary" "$TESTO_SUMMARY" "$RUN_TESTO"
          if [ -n "$COMMIT_PROBLEMS" ]; then
            echo "::error::Commits can't be rebase-merged: $COMMIT_PROBLEMS"
            failed=1
          fi
          if [ -n "$CONTENT_PROBLEMS" ]; then
            echo "::error::Batch commits differ from the pull requests they name: $CONTENT_PROBLEMS"
            failed=1
          fi
          if [ -n "$CHANGES_REQUESTED" ]; then
            echo "::error::Changes requested by $CHANGES_REQUESTED; merging waits for their approval or a dismissal"
            failed=1
          fi
          # The notice names the tree this run tested; a queue entry with that tree skips the heavy suite.
          if [ "$failed" = 0 ] && [ "$HEAVY" = true ] && [ "$RUN_TESTO" = true ]; then
            echo "::notice title=Heavy suite passed::tree $TREE"
          fi
          exit "$failed"
