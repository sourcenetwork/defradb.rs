name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  CARGO_INCREMENTAL: '0'
  # Standard hosted runners have 14 GB of storage. Keep test artifacts small
  # enough for a clean runner without changing runtime behavior.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_SUPER_DEV_DEBUG: '0'
  # One run's caches exceed the repository's cache quota, so caches saved from
  # pull requests evicted main's and every new pull request compiled from
  # scratch. Only main saves, and one job saves each shared key.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}
  # Every RunsOn job shares compiled crates through this bucket. sccache refuses
  # to start when it cannot reach the bucket, so each job sets RUSTC_WRAPPER only
  # after the server is up, and compiles locally otherwise (#1429). The server
  # never idles out, since a restart while the bucket is unreachable fails the build.
  # CI owns the ci/ prefix: the runner role may only read and write there, and
  # other bucket users can read it but not write it.
  SCCACHE_BUCKET: defradb.rs.sscache-575155546886-us-east-2-an
  SCCACHE_REGION: us-east-2
  SCCACHE_S3_KEY_PREFIX: ci/
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
  SCCACHE_IDLE_TIMEOUT: '0'

# RunsOn retries a job whose Spot instance is reclaimed, but a failed
# merge-queue run ejects the pull request before that retry, so merge-queue
# runs take on-demand instances.
jobs:
  ci-scope:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.decide.outputs.full }}
      integration_matrix: ${{ steps.decide.outputs.integration_matrix }}
    steps:
      - id: decide
        uses: actions/github-script@v9
        with:
          script: |
            let full = true;
            if (context.eventName === 'pull_request') {
              const stack = context.payload.pull_request && context.payload.pull_request.stack;
              if (stack) {
                const isTip = stack.position === stack.size;
                const isLowest = stack.base && stack.base.ref === context.payload.pull_request.base.ref;
                full = isTip || isLowest;
                core.info(`stack #${stack.number} pos ${stack.position}/${stack.size} full=${full}`);
              }
            }
            core.setOutput('full', full ? 'true' : 'false');

            const suites = [
              { suite: 'signed-docs', needs_go: false, multipliers: 'signed-docs' },
              { suite: 'go-compat', needs_go: true },
              // Go Shinzo (GO_SHINZO_COMMIT): the go-shinzo client, mixed
              // Rust and Go Shinzo clusters, and the drift check.
              { suite: 'go-shinzo', needs_go: false },
              { suite: 'iroh', needs_go: false },
              // The same data path on a pool of one worker.
              { suite: 'one-worker', needs_go: false },
            ];
            if (context.eventName !== 'pull_request') {
              suites.push({ suite: 'rust', needs_go: false });
            }
            core.setOutput('integration_matrix', JSON.stringify({ include: suites }));

  lint-default:
    name: Lint (default)
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - run: cargo clippy --all --all-targets -- -D warnings
      - name: Data path confinement
        env:
          CLIPPY_CONF_DIR: .github/clippy/data-path
        run: >-
          cargo clippy --lib --no-deps
          -p storage -p datastore -p blockstore -p crdt -p defra-core -p query -p db
          -p acp -p zanzibar -p lens -p kms -p events
          -- -A clippy::all -D clippy::disallowed_methods

  feature-checks:
    name: Feature checks (${{ matrix.group }})
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: release
            commands: |
              cargo clippy -p cli --no-default-features --features release-full --all-targets -- -D warnings
              cargo clippy -p cli --no-default-features --all-targets -- -D warnings
          - group: optional
            commands: |
              cargo clippy -p telemetry --features otlp --all-targets -- -D warnings
              cargo clippy -p cli --features otel --all-targets -- -D warnings
              cargo clippy -p defra-node --features otel --all-targets -- -D warnings
              cargo clippy -p defra-node --features p2p --all-targets -- -D warnings
              cargo clippy -p db --features p2p --all-targets -- -D warnings
          - group: minimal
            commands: |
              cargo clippy -p defra-node --no-default-features --features native --all-targets -- -D warnings
              cargo clippy -p defra-node --no-default-features --features native,p2p --all-targets -- -D warnings
              cargo clippy -p ffi --no-default-features --features native,libp2p --all-targets -- -D warnings
              cargo clippy -p ffi --no-default-features --features native --all-targets -- -D warnings
              cargo check -p ffi --no-default-features --features native,iroh
              cargo test -p ffi --no-default-features --features native --lib
              cargo check -p p2p --no-default-features --features iroh-transport
              cargo check -p db --no-default-features --features native
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature
          save-if: ${{ env.SAVE_CACHE == 'true' && matrix.group == 'release' }}
      - name: Run feature checks
        run: ${{ matrix.commands }}

  dependency-checks:
    name: Dependency checks
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Install cargo-machete
        run: command -v cargo-machete >/dev/null 2>&1 || cargo install cargo-machete --locked
      - name: Check unused dependencies
        run: cargo machete
      - name: Check defra-node feature graph
        run: bash .github/scripts/assert-defra-node-graph.sh

  lint:
    name: Lint
    needs: [lint-default, feature-checks, dependency-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check lint results
        env:
          DEFAULT: ${{ needs.lint-default.result }}
          FEATURES: ${{ needs.feature-checks.result }}
          DEPENDENCIES: ${{ needs.dependency-checks.result }}
        run: |
          test "$DEFAULT" = success
          test "$FEATURES" = success
          test "$DEPENDENCIES" = success

  unit-tests:
    name: Unit tests
    needs: ci-scope
    if: needs.ci-scope.outputs.full == 'true'
    uses: ./.github/workflows/unit-tests.yml
    with:
      os: linux

  build-binaries:
    name: Build integration binaries
    needs: ci-scope
    if: needs.ci-scope.outputs.full == 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-binaries
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build binaries
        run: |
          mkdir -p artifacts/ci
          cargo build -p cli --profile super-dev
          cp target/super-dev/defra artifacts/ci/defra
          cargo build -p cli --profile super-dev --features iroh
          cp target/super-dev/defra artifacts/ci/defra-iroh
      - uses: actions/upload-artifact@v4
        with:
          name: defra-ci-binaries
          path: artifacts/ci
          retention-days: 1

  build:
    name: Build & Test
    needs: [ci-scope, unit-tests, build-binaries, feature-tests]
    if: always() && needs.ci-scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        env:
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          BINARIES: ${{ needs.build-binaries.result }}
          FEATURE_TESTS: ${{ needs.feature-tests.result }}
        run: |
          test "$UNIT_TESTS" = success
          test "$BINARIES" = success
          test "$FEATURE_TESTS" = success

  feature-tests:
    name: Feature tests
    needs: ci-scope
    if: needs.ci-scope.outputs.full == 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-binaries
          save-if: false
      - run: cargo nextest run --cargo-profile super-dev -p telemetry --features otlp
      - run: cargo nextest run --cargo-profile super-dev -p cli --features otel --test telemetry_dedup
      - run: cargo nextest run --cargo-profile super-dev -p defra-node --features p2p

  wasm-check:
    name: WASM Build Check
    needs: ci-scope
    if: needs.ci-scope.outputs.full == 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Isolate the WASM dependency graph
        run: sed -i '/"tools\/integration-test"/d; /"tools\/ffi-test"/d; /"proofs"/d' Cargo.toml
      - name: Clippy (wasm32)
        run: cargo clippy -p defra-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Clippy (wasm32, no default features)
        run: cargo clippy -p defra-wasm --target wasm32-unknown-unknown --no-default-features --all-targets -- -D warnings
      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked
      - name: Build WASM
        run: >-
          CARGO_PROFILE_RELEASE_OPT_LEVEL=z
          wasm-pack build crates/wasm --release --target web --out-dir ../../pkg/wasm
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
      - uses: browser-actions/setup-geckodriver@eb8b0670366f719ca31703766a8cb7e3ea2c56ed # v0.0.0
        with:
          geckodriver-version: '0.37.1'
      - name: Install lockfile-matched wasm-bindgen-cli
        run: |
          VER="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[",]/,""); print $3; exit}' Cargo.lock)"
          test -n "$VER"
          cargo install wasm-bindgen-cli --version "$VER" --locked
      - name: Run wasm tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test -p defra-wasm --target wasm32-unknown-unknown --lib --tests 2>&1 | tee wasm-test.log
          if grep -q "running 0 tests" wasm-test.log; then
            echo "::error::a wasm test binary registered zero tests"
            exit 1
          fi
          grep -qE "^test result: ok\. [1-9][0-9]* passed" wasm-test.log
      - name: Browser peer replicates through a hosted relay
        run: tools/browser-p2p-e2e.sh

  lean-conformance:
    name: Lean Conformance
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache
    timeout-minutes: 20
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check TLA ownership and convergence models
        run: proofs/tla/run-all.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lean-conformance
          save-if: ${{ env.SAVE_CACHE == 'true' }}
      - name: Build Lean proofs
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: proofs/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - name: Check storage failure model binding
        run: cargo test -p query --test storage_failure -- --ignored
      - name: Check native listener model binding
        run: cargo test -p p2p --features iroh-transport --lib iroh::endpoint_config::bind_tests::native_bindings_match_executed_model -- --exact --ignored
      - name: Check native port mapping model binding
        run: cargo test -p p2p --features iroh-transport --lib iroh::endpoint_config::bind_tests::native_port_mapping_configuration_matches_executed_model -- --exact --ignored
      - name: Check selected document push model binding
        run: cargo test -p db --test merge selected_document_transfers_match_executed_model -- --ignored
      - name: Check HTTP router composition model binding
        run: cargo test -p defra-http --lib server::router_transform_tests::forwarding_filter_matches_executed_model -- --exact --ignored
      - name: Check Lean-to-Rust conformance
        run: cargo nextest run -p conformance --lib --test lean_conformance

  conformance:
    name: Conformance
    needs: [ci-scope, build-binaries]
    if: needs.ci-scope.outputs.full == 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache
    timeout-minutes: 45
    env:
      DEFRA_CONFORMANCE_BINARY: ${{ github.workspace }}/target/ci/defra
      DEFRA_WORKSPACE_ROOT: ${{ github.workspace }}
      DEFRA_E2E_KEEP: '1'
      RUST_LOG: info
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          name: defra-ci-binaries
          path: target/ci
      - run: chmod +x target/ci/defra target/ci/defra-iroh
      - name: Run conformance tests
        run: cargo nextest run --cargo-profile super-dev -p conformance --lib --test tla_conformance
      - name: Upload harness node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-e2e-logs
          path: target/e2e/**/logs/*.log
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Integration (${{ matrix.suite }})
    needs: [ci-scope, build-binaries]
    if: needs.ci-scope.outputs.full == 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.ci-scope.outputs.integration_matrix) }}
    env:
      DEFRA_RUST_BINARY: ${{ github.workspace }}/target/ci/defra
      DEFRA_IROH_BINARY: ${{ github.workspace }}/target/ci/defra-iroh
      DEFRA_MULTIPLIERS: ${{ matrix.multipliers || '' }}
      DEFRA_E2E_KEEP: '1'
      RUST_LOG: info
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration
          save-if: ${{ env.SAVE_CACHE == 'true' && matrix.suite == 'go-compat' }}
      - uses: actions/download-artifact@v4
        with:
          name: defra-ci-binaries
          path: target/ci
      - name: Check binaries
        run: |
          chmod +x target/ci/defra target/ci/defra-iroh
          target/ci/defra version --format json
      - name: Install Go toolchain
        if: matrix.suite == 'go-compat' || matrix.suite == 'go-shinzo'
        uses: actions/setup-go@v5
        with:
          # The pinned GO_COMPAT_COMMIT declares `go 1.26.10`, so an older
          # toolchain cannot build it.
          go-version: '1.26'
      - name: Restore Go DefraDB
        id: go-defradb
        if: matrix.suite == 'go-compat'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/defra-harness
          key: go-defradb-${{ runner.os }}-${{ hashFiles('crates/defra-version/src/lib.rs') }}
      - name: Prepare Go DefraDB binary
        if: matrix.needs_go
        run: |
          GO_REF=$(grep 'pub const GO_COMPAT_COMMIT' crates/defra-version/src/lib.rs | sed 's/.*"\(.*\)".*/\1/')
          GO_BRANCH=$(grep 'pub const GO_COMPAT_BRANCH' crates/defra-version/src/lib.rs | sed 's/.*"\(.*\)".*/\1/')
          GO_TAG=$(grep 'pub const GO_COMPAT_TAG' crates/defra-version/src/lib.rs | sed 's/.*"\(.*\)".*/\1/')

          if [ -n "$GO_TAG" ]; then
            VER_NUM="${GO_TAG#v}"
            ASSET="defradb_${VER_NUM}_linux_x86_64"
            CACHE_DIR="$HOME/.cache/defra-harness/${GO_TAG}"
            mkdir -p "$CACHE_DIR"
            if [ ! -x "$CACHE_DIR/defradb" ]; then
              curl -fSL -o "$CACHE_DIR/defradb" \
                "https://github.com/sourcenetwork/defradb/releases/download/${GO_TAG}/${ASSET}"
              chmod +x "$CACHE_DIR/defradb"
            fi
          else
            test -n "$GO_REF"
            test -n "$GO_BRANCH"
            CACHE_DIR="$HOME/.cache/defra-harness/${GO_REF}"
            mkdir -p "$CACHE_DIR"
            if [ ! -x "$CACHE_DIR/defradb" ]; then
              WORK_DIR="$RUNNER_TEMP/defradb-${GO_REF}"
              git clone --filter=blob:none --branch "$GO_BRANCH" https://github.com/sourcenetwork/defradb "$WORK_DIR"
              git -C "$WORK_DIR" checkout "$GO_REF"
              make -C "$WORK_DIR" build path="$CACHE_DIR/defradb"
              chmod +x "$CACHE_DIR/defradb"
            fi
          fi

          echo "$CACHE_DIR" >> "$GITHUB_PATH"
          "$CACHE_DIR/defradb" version --format json
      - name: Save Go DefraDB
        if: matrix.suite == 'go-compat' && env.SAVE_CACHE == 'true' && steps.go-defradb.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/defra-harness
          key: ${{ steps.go-defradb.outputs.cache-primary-key }}
      - name: Restore Go Shinzo
        id: go-shinzo
        if: matrix.suite == 'go-shinzo'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/defra-shinzo
          key: go-shinzo-${{ runner.os }}-${{ hashFiles('crates/defra-version/src/lib.rs', 'tools/go-shinzo-kv/main.go') }}
      - name: Prepare Go Shinzo binary
        if: matrix.suite == 'go-shinzo'
        run: |
          SHINZO_REF=$(grep 'pub const GO_SHINZO_COMMIT' crates/defra-version/src/lib.rs | sed 's/.*"\(.*\)".*/\1/')
          SHINZO_BRANCH=$(grep 'pub const GO_SHINZO_BRANCH' crates/defra-version/src/lib.rs | sed 's/.*"\(.*\)".*/\1/')
          test -n "$SHINZO_REF"
          test -n "$SHINZO_BRANCH"
          CACHE_DIR="$HOME/.cache/defra-shinzo/${SHINZO_REF}"
          mkdir -p "$CACHE_DIR"
          # kvsnap runs Go Shinzo's KV snapshot export and import, which Go
          # reaches only in-process; it is built inside the pinned checkout.
          if [ ! -x "$CACHE_DIR/defradb" ] || [ ! -x "$CACHE_DIR/kvsnap" ]; then
            WORK_DIR="$RUNNER_TEMP/defradb-shinzo-${SHINZO_REF}"
            git clone --filter=blob:none --branch "$SHINZO_BRANCH" https://github.com/sourcenetwork/defradb "$WORK_DIR"
            git -C "$WORK_DIR" checkout "$SHINZO_REF"
            make -C "$WORK_DIR" build path="$CACHE_DIR/defradb"
            mkdir -p "$WORK_DIR/cmd/kvsnap"
            cp tools/go-shinzo-kv/main.go "$WORK_DIR/cmd/kvsnap/main.go"
            (cd "$WORK_DIR" && go build -o "$CACHE_DIR/kvsnap" ./cmd/kvsnap)
            chmod +x "$CACHE_DIR/defradb" "$CACHE_DIR/kvsnap"
          fi
          "$CACHE_DIR/defradb" version --format json
          echo "DEFRA_GO_SHINZO_KVSNAP=$CACHE_DIR/kvsnap" >> "$GITHUB_ENV"
          echo "DEFRA_GO_SHINZO_BINARY=$CACHE_DIR/defradb" >> "$GITHUB_ENV"

          # The drift check finds `defradb` on the PATH. This one is Go Shinzo,
          # kept on disk: its in-memory Badger keeps a 256-byte value threshold
          # and refuses a collection definition.
          SHIM_DIR="$RUNNER_TEMP/shinzo-as-defradb"
          mkdir -p "$SHIM_DIR"
          cat > "$SHIM_DIR/defradb" <<EOF
          #!/usr/bin/env bash
          args=(); prev=
          for a in "\$@"; do
            [ "\$prev" = "--store" ] && [ "\$a" = "memory" ] && a=badger
            [ "\$a" = "--store=memory" ] && a=--store=badger
            args+=("\$a"); prev=\$a
          done
          exec "$CACHE_DIR/defradb" "\${args[@]}"
          EOF
          chmod +x "$SHIM_DIR/defradb"
          echo "SHINZO_AS_DEFRADB=$SHIM_DIR" >> "$GITHUB_ENV"
      - name: Save Go Shinzo
        if: matrix.suite == 'go-shinzo' && env.SAVE_CACHE == 'true' && steps.go-shinzo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/defra-shinzo
          key: ${{ steps.go-shinzo.outputs.cache-primary-key }}
      - name: Verify Go fixtures still match Rust constants
        if: matrix.suite == 'go-compat'
        run: |
          OUT=$(mktemp)
          (cd crates/p2p/testdata/gen_message_fixtures && go run .) >> "$OUT"
          (cd crates/p2p/testdata/gen_pubsub_rpc_fixture && go run .) >> "$OUT"
          HEXES=$(grep -Eo '\(([0-9]+)( bytes)?\): [0-9a-f]+' "$OUT" | awk '{print $NF}')
          test -n "$HEXES"
          while IFS= read -r H; do
            grep -qR --include='*.rs' -F "$H" crates/p2p/
          done <<< "$HEXES"
      - name: Verify the pinned rustffi client resolves
        if: matrix.suite == 'go-compat'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pin=$(sed -nE 's/^pub const GO_FFI_CLIENT_COMMIT: &str = "([0-9a-f]+)";/\1/p' crates/defra-version/src/lib.rs)
          test -n "$pin" || { echo "GO_FFI_CLIENT_COMMIT not found in crates/defra-version/src/lib.rs"; exit 1; }
          gh api "repos/sourcenetwork/defradb/commits/$pin" --jq .sha > /dev/null \
            || { echo "GO_FFI_CLIENT_COMMIT=$pin does not resolve on sourcenetwork/defradb"; exit 1; }
      - name: Run rust integration tests (basic)
        if: matrix.suite == 'rust' || matrix.suite == 'signed-docs'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test basic
          -- --skip ::go_ --skip shinzo_
      - name: Run rust integration tests (core suites)
        if: matrix.suite == 'rust' || matrix.suite == 'signed-docs'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test
          --test query --test acp --test nac --test encryption --test identity
          --test backup --test fts --test vector --test acp_replay_outage_repro --test shinzo
          -- --skip ::go_ --skip shinzo_
      - name: Run rust integration tests on a one-worker pool (basic, query)
        if: matrix.suite == 'one-worker'
        env:
          # Every node the suites start runs its data path on one worker.
          DEFRA_WORKERS: '1'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test basic --test query
          -- --skip ::go_ --skip shinzo_
      - name: Run rust P2P integration tests
        if: matrix.suite == 'rust' || matrix.suite == 'signed-docs'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test p2p
          -- --skip ::go_ --skip shinzo_
      - name: Run go-compat integration tests
        if: matrix.suite == 'go-compat'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test
          --test basic --test query --test acp --test nac --test backup --test p2p --test identity
          --test encryption --test vera
          -- go_
          --skip go_acp_link_collection_nonexistent_policy_reject
          --skip go_acp_link_collection_nonexistent_resource_reject
          --skip go_acp_link_collection_missing_read_perm_reject
          --skip go_acp_link_collection_missing_update_perm_reject
          --skip go_acp_link_collection_missing_delete_perm_reject
      - name: Run go-compat conformance parity
        if: matrix.suite == 'go-compat'
        env:
          DEFRA_CONFORMANCE_BINARY: ${{ github.workspace }}/target/ci/defra
        run: >-
          cargo nextest run --cargo-profile super-dev -p conformance --test tla_conformance
          -- --ignored
          parity_counter_3node parity_counter_storm_go_go parity_delete_update
          parity_indexed_lww parity_mixed_fields_3node parity_lww_tie_partition
          parity_samedoc_mixed_restart
          parity_unique_twins_rust_rust parity_unique_twins_go_go parity_unique_twins_mixed
      - name: Run mixed Rust and Go Shinzo clusters
        if: matrix.suite == 'go-shinzo'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test p2p --test shinzo
          -- shinzo_
      - name: Run the go-shinzo client
        if: matrix.suite == 'go-shinzo'
        env:
          DEFRA_CLIENT: go-shinzo
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test p2p --test shinzo
          -- shinzo_
      - name: Check Go Shinzo for drift from Go develop (document IDs, block CIDs, P2P sync)
        if: matrix.suite == 'go-shinzo'
        run: |
          export PATH="$SHINZO_AS_DEFRADB:$PATH"
          cargo nextest run --cargo-profile super-dev -p integration-test \
            --test basic --test p2p -E 'test(/::go_/)'
      - name: Run iroh integration tests
        if: matrix.suite == 'iroh'
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test p2p_iroh
          -- connection::
          sync::version::initial_col_version sync::version::patch_version_of_
      - name: Run iroh sync ownership fences
        if: matrix.suite == 'iroh'
        run: |
          cargo nextest run --cargo-profile super-dev -p integration-test --test p2p_iroh \
            peer::create::create_propagates_to_last_node_in_chain
          cargo nextest run --cargo-profile super-dev -p integration-test --test p2p_iroh \
            peer::create::head_hint_fanout_above_car_worker_bound_quiesces
      - name: Upload harness node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.suite }}-e2e-logs
          path: target/e2e/**/logs/*.log
          retention-days: 7
          if-no-files-found: ignore

  p2p-linux:
    name: P2P Integration (Linux)
    needs: [ci-scope, build-binaries]
    if: needs.ci-scope.outputs.full == 'true'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/spot=${{ github.event_name == 'merge_group' && 'false' || 'pco' }}/cpu=16+32/family=c6*+c7*/volume=80gb/env=v3/extras=s3-cache
    timeout-minutes: 90
    env:
      DEFRA_RUST_BINARY: ${{ github.workspace }}/target/ci/defra
      DEFRA_IROH_BINARY: ${{ github.workspace }}/target/ci/defra-iroh
      DEFRA_WORKSPACE_ROOT: ${{ github.workspace }}
      DEFRA_E2E_KEEP: '1'
      RUST_LOG: info
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sccache --start-server && echo RUSTC_WRAPPER=sccache >> "$GITHUB_ENV" || true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          name: defra-ci-binaries
          path: target/ci
      - run: chmod +x target/ci/defra target/ci/defra-iroh
      - name: Run rust P2P integration tests
        run: >-
          cargo nextest run --cargo-profile super-dev -p integration-test --test p2p
          -- --skip ::go_ --skip shinzo_
      - name: Run P2P ownership durability fences
        run: |
          cargo nextest run --cargo-profile super-dev -p integration-test --test p2p_admission
          cargo nextest run --cargo-profile super-dev -p integration-test --test p2p_admission_restart
          cargo nextest run --cargo-profile super-dev -p integration-test --test p2p_admission_fairness
          cargo nextest run --cargo-profile super-dev -p integration-test --test p2p_backlog
          cargo nextest run --cargo-profile super-dev -p integration-test --test issue1154_repro
      - name: Upload harness node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p2p-linux-e2e-logs
          path: target/e2e/**/logs/*.log
          retention-days: 7
          if-no-files-found: ignore
