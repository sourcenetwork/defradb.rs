name: Check Vulnerabilities

# Advisories not yet fixable upstream are allowlisted in deny.toml, the
# counterpart of the Go repo's .github/known-vulnerabilities.txt.
on:
  pull_request:
    branches: [main]
    paths: [Cargo.lock, deny.toml, .github/workflows/check-vulnerabilities.yml]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-vulnerabilities:
    name: Check vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
