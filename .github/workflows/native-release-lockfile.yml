name: Native release lockfile

on:
  push:
    branches: ['iverc/native-release-*']
    paths:
      - Cargo.toml
      - crates/vera/Cargo.toml
      - tools/integration-test/Cargo.toml
      - .github/scripts/resolve-native-release.sh
      - .github/workflows/native-release-lockfile.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
      - name: Resolve the updated native release graph
        run: bash .github/scripts/resolve-native-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-release-lockfile-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
