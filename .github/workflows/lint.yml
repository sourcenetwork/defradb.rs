name: Code shape

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-shape-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'tip' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  DEFRA_NODE_BUILD_TIME_OVERRIDE: ci

jobs:
  code-shape:
    name: Code shape (compiler fixtures)
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}/cpu=4/family=c6*+c7*/volume=40gb/env=v3/extras=s3-cache+git-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v7
      - run: .github/scripts/install-linux-ci-deps.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: code-shape-preview
          key: ${{ hashFiles('tools/code-shape/Cargo.lock', 'tools/code-shape/rust-toolchain.toml') }}
          workspaces: '. -> target/code-shape'
          cache-directories: .tooling
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned lint tools
        run: .github/scripts/code-shape.sh setup
      - name: Check compiler fixtures before workspace enforcement
        run: .github/scripts/code-shape.sh preview
