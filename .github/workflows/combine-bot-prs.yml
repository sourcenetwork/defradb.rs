name: Combine Bot PRs

on:
  workflow_dispatch:
    inputs:
      branchPrefix:
        description: 'Branch prefix of the PRs to combine, eg: dependabot/cargo'
        required: true
        default: 'dependabot'
      mustBeGreen:
        description: 'Only combine PRs whose checks are all green'
        type: boolean
        required: true
        default: false
      combineBranchName:
        description: 'Prefix of the branch to combine PRs into (the run ID is appended)'
        required: true
        default: 'combined-bot-prs-branch'
      ignoreLabel:
        description: 'Exclude PRs with this label'
        required: true
        default: 'DO NOT MERGE'

permissions:
  contents: write
  pull-requests: write

jobs:
  combine-bot-prs:
    name: Combine bot PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          BRANCH_PREFIX: ${{ inputs.branchPrefix }}
          MUST_BE_GREEN: ${{ inputs.mustBeGreen }}
          COMBINE_BRANCH: ${{ inputs.combineBranchName }}
          IGNORE_LABEL: ${{ inputs.ignoreLabel }}
        with:
          script: |
            const { BRANCH_PREFIX, MUST_BE_GREEN, COMBINE_BRANCH, IGNORE_LABEL } = process.env;
            const { owner, repo } = context.repo;
            const baseRef = context.payload.repository.default_branch;
            const head = `${COMBINE_BRANCH}-${context.runId}`;

            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: baseRef });
            const picked = [];
            for (const pull of pulls) {
              const branch = pull.head.ref;
              const sha = pull.head.sha;
              if (!branch.startsWith(BRANCH_PREFIX)) continue;
              if (pull.labels.some(l => l.name === IGNORE_LABEL)) {
                console.log(`Skipping ${branch}: labelled ${IGNORE_LABEL}`);
                continue;
              }
              if (MUST_BE_GREEN === 'true') {
                const result = await github.graphql(`query($owner: String!, $repo: String!, $sha: GitObjectID!) {
                  repository(owner: $owner, name: $repo) {
                    object(oid: $sha) { ... on Commit { statusCheckRollup { state } } }
                  }
                }`, { owner, repo, sha });
                const state = result.repository.object?.statusCheckRollup?.state;
                if (state !== 'SUCCESS') {
                  console.log(`Skipping ${branch}@${sha}: status ${state}`);
                  continue;
                }
              }
              picked.push({ branch, sha, line: `#${pull.number} ${pull.title}` });
            }
            if (picked.length === 0) {
              core.setFailed(`No PRs targeting ${baseRef} matched criteria`);
              return;
            }

            const { data: baseBranch } = await github.rest.repos.getBranch({ owner, repo, branch: baseRef });
            await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${head}`, sha: baseBranch.commit.sha });

            try {
              const combined = [];
              const conflicted = [];
              // Merge the SHA that was checked, not the branch, which a bot may have moved since.
              for (const { branch, sha, line } of picked) {
                try {
                  await github.rest.repos.merge({ owner, repo, base: head, head: sha });
                  combined.push(line);
                } catch (error) {
                  console.log(`Failed to merge ${branch}@${sha}: ${error}`);
                  conflicted.push(line);
                }
              }
              if (combined.length === 0) throw new Error('Every selected PR conflicted');

              let body = '✅ This PR was created by combining the following PRs:\n' + combined.join('\n');
              if (conflicted.length > 0) {
                body += '\n\n⚠️ The following PRs were left out due to merge conflicts:\n' + conflicted.join('\n');
              }
              const date = new Date().toISOString().slice(0, 10);
              await github.rest.pulls.create({
                owner, repo,
                title: `bot: Combine ${BRANCH_PREFIX} PRs ${date}`,
                head,
                base: baseRef,
                body,
              });
            } catch (error) {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${head}` });
              core.setFailed(`Removed ${head}: ${error}`);
            }
