name: Review gate relay

# Reruns Merge gate for a fork pull request after Review gate's Fork relay job
# passed (#3312). workflow_run runs from main with the base repository's token,
# which a fork's own review event does not get. It checks out nothing from the
# fork: it only reruns a job by id.
on:
  workflow_run:
    workflows: [Review gate]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-merge-gate:
    name: Rerun Merge gate (fork)
    if: github.event.workflow_run.head_repository.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const trigger = context.payload.workflow_run;
            const relay = (await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: trigger.id, per_page: 100,
            })).find((j) => j.name === 'Fork relay');
            if (relay?.conclusion !== 'success') return core.info(`Review gate run ${trigger.id} asked for no rerun.`);
            const head = trigger.head_sha;
            const run = (await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: head, event: 'pull_request', per_page: 1,
            })).data.workflow_runs[0];
            if (!run) return core.info(`No CI run for ${head} yet.`);
            // A Merge gate that has not started reads the reviews and the title when it
            // starts. One that is running may have read them already, so wait for it to
            // finish and rerun it.
            let gate;
            for (let i = 0; ; i++) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
              });
              gate = jobs.find((j) => j.name === 'Merge gate');
              if (gate?.status === 'completed') break;
              if (gate?.status !== 'in_progress') {
                if (run.status !== 'completed') return core.info(`CI run ${run.id}'s Merge gate has not started; it reads the reviews and the title when it starts.`);
                return core.setFailed(`CI run ${run.id} has no finished Merge gate job.`);
              }
              if (i === 60) return core.setFailed(`Merge gate (job ${gate.id}) is still running after 10 minutes.`);
              await new Promise((r) => setTimeout(r, 10000));
            }
            await github.rest.actions.reRunJobForWorkflowRun({ ...context.repo, job_id: gate.id });
            core.info(`Reran Merge gate (job ${gate.id}) of CI run ${run.id}.`);
