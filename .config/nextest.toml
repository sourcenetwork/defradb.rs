experimental = ["setup-scripts"]

# Tests that start real nodes run in parallel, on binaries built once per run.
# The harness picks a port, frees it, then starts the node, so another test can
# take it in between. Such a test is rerun once and reported as flaky.
[test-groups]
nodes = { max-threads = "num-cpus" }

[scripts.setup.integration-binaries]
command = { command-line = ".config/build-test-binaries.sh integration", relative-to = "workspace-root" }

[scripts.setup.vera-binary]
command = { command-line = ".config/build-test-binaries.sh vera", relative-to = "workspace-root" }

[scripts.setup.conformance-binary]
command = { command-line = ".config/build-test-binaries.sh conformance", relative-to = "workspace-root" }

[profile.default]
slow-timeout = { period = "60s" }

[[profile.default.overrides]]
filter = "package(integration-test) | (package(conformance) & !binary(lean_conformance))"
test-group = "nodes"
retries = 1

[[profile.default.scripts]]
filter = "package(integration-test)"
setup = "integration-binaries"

[[profile.default.scripts]]
filter = "package(integration-test) & (binary(vera) | binary(verars))"
setup = "vera-binary"

[[profile.default.scripts]]
filter = "package(conformance) & kind(test) & !binary(lean_conformance)"
setup = "conformance-binary"

[profile.ci]
fail-fast = false
# A test still running after 20 minutes is hung: end it and name it.
slow-timeout = { period = "60s", terminate-after = 20 }

[profile.ci.junit]
path = "junit.xml"
