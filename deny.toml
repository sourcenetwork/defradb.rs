# Normal and build dependencies only: what ships. A crate's tests may use
# what its library may not (the data path's tests run on tokio test runtimes).
[graph]
exclude-dev = true

[advisories]
# Some ignored crates live in tools/ (excluded from CI workspace) so may not match
unused-ignored-advisory = "warn"
ignore = [
    # ------------------------------------------------------------------
    # Unmaintained crates pulled in via upstream ecosystems we don't
    # control. Each entry documents the pulling path and the condition
    # under which it can be removed. Narrowed as part of #705.
    # ------------------------------------------------------------------

    # derivative — unmaintained. Pulled by ark-ec 0.4 through decaf377 in
    # vera.rs (vera-crypto). Removable when decaf377 moves to ark-ec 0.5+.
    "RUSTSEC-2024-0388",

    # fxhash — unmaintained. Pulled by bm25 2.3.x (full-text search).
    # Our direct bm25 dep is already pinned to the latest workspace
    # version; upstream bm25 would need to switch its internal hasher
    # (e.g. to ahash) before this can be removed.
    "RUSTSEC-2025-0057",

    # paste — unmaintained. Pulled by alloy-primitives (backbone repo,
    # ACP light client). Removable when alloy migrates off paste; our
    # direct alloy pin is already at the latest workspace version.
    "RUSTSEC-2024-0436",

    # unsafe-libyaml — unmaintained. Pulled by serde_yaml 0.9, itself
    # deprecated, which acp reads policies with. Removable when acp moves to
    # a maintained YAML crate.
    "RUSTSEC-2024-0449",

    # atomic-polyfill — unmaintained. Pulled by heapless 0.7 through
    # postcard inside cranelift (wasmtime), only on targets without native
    # atomics. Removable when postcard moves to heapless 0.8+.
    "RUSTSEC-2023-0089",

    # ------------------------------------------------------------------
    # Vulnerabilities unreachable from our feature set, or blocked on an
    # upstream release. Tracked in #1874; each entry names the unblocking
    # condition.
    # ------------------------------------------------------------------

    # crypto-bigint 0.5.5 has no patched release in its 0.5 line. It is
    # required by elliptic-curve 0.13 through k256, libp2p-identity,
    # and alloy. The 0.7 dependency is patched in Cargo.lock.
    # Remove when these upstream consumers move to patched RustCrypto
    # releases; the remaining timing side-channel exposure is tracked in #2261.
    { id = "RUSTSEC-2026-0387", reason = "Unpatched crypto-bigint 0.5 dependency through elliptic-curve 0.13; upstream migration tracked in #2261" },

    # hickory-proto 0.25 — NSEC3 validation loop (DNSSEC, not enabled) and
    # O(n²) name compression when dialing /dns multiaddrs. Pulled by
    # libp2p-dns 0.44; removable with the libp2p 0.57 bump (#1875).
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",

    # zstd 0.13 and zstd-safe 7 — pulled only by commonware-storage from the
    # iverc/commonware-upstream fork, through vera.rs and backbone's
    # acp-light-client (pinned revs). It calls bulk::Decompressor (one-shot
    # DCtx::decompress) and CCtx, never stream::raw with_context (0391) or
    # DCtx::decompress_stream (0403). zstd-sys is already on the patched 2.1.2.
    # Remove when the fork moves to zstd 0.14.3 and vera.rs and backbone repin (#2298).
    { id = "RUSTSEC-2026-0391", reason = "commonware-storage fork still on zstd 0.13; unreachable call; #2298" },
    { id = "RUSTSEC-2026-0403", reason = "commonware-storage fork still on zstd-safe 7; no decompress_stream; #2298" },
    # hickory-proto 0.25.2 comes only through libp2p 0.56's libp2p-dns; the fix
    # (0.26.2) needs libp2p 0.57. 0487, 0489 and 0490 panic only when parsing
    # the text (zone file) form, which a resolver never does. 0491 is reachable:
    # a hostile DNS server answering a /dns multiaddr lookup can inflate
    # allocations. Remove all hickory IDs with the libp2p 0.57 bump (#2813).
    { id = "RUSTSEC-2026-0487", reason = "hickory-proto 0.25 via libp2p 0.56; zone-file text parsing only; #2813" },
    { id = "RUSTSEC-2026-0489", reason = "hickory-proto 0.25 via libp2p 0.56; zone-file text parsing only; #2813" },
    { id = "RUSTSEC-2026-0490", reason = "hickory-proto 0.25 via libp2p 0.56; zone-file lexer only; #2813" },
    { id = "RUSTSEC-2026-0491", reason = "hickory-proto 0.25 via libp2p 0.56; reachable via DNS answers; fix needs libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0504", reason = "hickory-proto 0.25 via libp2p 0.56; no safe upgrade until libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0505", reason = "hickory-proto 0.25 via libp2p 0.56; no safe upgrade until libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0511", reason = "hickory-proto 0.25 via libp2p 0.56; no safe upgrade until libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0512", reason = "hickory-proto 0.25 via libp2p 0.56; no safe upgrade until libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0514", reason = "hickory-proto 0.25 via libp2p 0.56; no safe upgrade until libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0530", reason = "hickory-proto 0.25 via libp2p 0.56; no safe upgrade until libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0531", reason = "hickory-proto 0.25 via libp2p 0.56; no safe upgrade until libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0532", reason = "hickory-proto 0.25 via libp2p 0.56; no safe upgrade until libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0534", reason = "libp2p-gossipsub 0.49 via libp2p 0.56; PRUNE backoff fix needs libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4 is unmaintained and pulled by the current schema/date ecosystem; migration tracked separately" },
    { id = "RUSTSEC-2026-0549", reason = "hickory-proto 0.25 via libp2p 0.56; no safe upgrade until libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0550", reason = "hickory-proto 0.25 via libp2p 0.56; no safe upgrade until libp2p 0.57; #2813" },
    { id = "RUSTSEC-2026-0551", reason = "hickory-proto 0.25 via libp2p 0.56; no safe upgrade until libp2p 0.57; #2813" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
allow = []
# dashmap is banned in this codebase: the concurrent map is
# regolith::sync::HopscotchMap (kovan's), plain maps are rapidhash's. No
# workspace crate names it. The copy in the graph comes in only through
# third-party crates, each allowed behind its own wrapper and removable only
# upstream: governor and commonware-parallel, pulled by commonware through
# vera.rs and backbone's acp-light-client (pinned revs), and iroh-relay, whose
# server feature (not one this workspace enables by default) uses it.
# No crate of ours depends on tokio: nuclei runs our tasks, timers and
# sockets, and a library that needs a tokio runtime is reached through
# `edge::compat` (async-compat and the runtime it enters, `edge`'s alone). tokio stays in the graph only
# under the third-party crates listed here, which bring it themselves.
# Regenerate the third-party list with
#   cargo tree -i tokio -e normal,build --depth 1 --workspace --target all
deny = [
    { name = "dashmap", wrappers = ["commonware-parallel", "governor", "iroh-relay"] },
    { name = "async-compat", wrappers = ["edge"] },
    { name = "tokio", wrappers = [
        # Third-party crates that are themselves network or runtime code.
        "acp-light-client", "async-compat", "axum", "backon", "commonware-macros",
        "commonware-runtime", "commonware-utils", "defra-harness", "edge", "h2", "hickory-proto",
        "hickory-resolver", "hyper", "hyper-rustls", "hyper-tls", "hyper-util", "if-watch",
        "igd-next", "iroh", "iroh-dns", "iroh-relay", "jsonrpsee-client-transport",
        "jsonrpsee-core", "jsonrpsee-server", "libp2p-quic", "libp2p-swarm", "libp2p-tcp",
        "n0-dns-resolver", "n0-future", "netlink-sys", "netwatch", "noq", "opentelemetry_sdk",
        "pgwire", "portmapper", "quinn", "reqwest", "rtnetlink",
        "test-infra", "tokio-native-tls", "tokio-rustls", "tokio-stream", "tokio-tungstenite",
        "tokio-util", "tokio-websockets", "tower", "vera-backend", "vera-client",
        "vera-consensus", "vera-harness", "vera-jsonrpc", "vera-node", "vera-support",
        "wasm-bindgen-futures",
    ] },
]
highlight = "lowest-version"

# ------------------------------------------------------------------
# Accepted duplicate versions, from the #1333 inventory. Each entry
# names the version we cannot remove, the path that pulls it, and the
# condition under which it disappears. Versions absent from this list
# are still reported as warnings.
#
# Measure duplicates per shipped artifact, not with `--workspace`:
# `--workspace` unifies features across every member including
# tools/integration-test. Count distinct names, because `cargo tree -d`
# double-lists some same-version packages:
#
#   cargo tree -d -e normal -p cli | grep -E '^[a-zA-Z0-9_-]+ v' \
#     | awk '{print $1}' | sort -u | wc -l
#
# `keyring v0.5.0` alongside `keyring v3.6.3` in that output is our own
# crates/foundation/keyring colliding with the crates.io name. Not a duplicate.
# ------------------------------------------------------------------
skip = [
    # sha2 0.11 — multihash-codetable 0.2.2 requires sha2 0.11 and sits
    # in the CID path via crates/engine/blockstore; ed25519-dalek 3, k256
    # 0.14 and p256 0.14 pull it too. The 0.10 floor is held by
    # libp2p-identity 0.2 (requires 0.10.8), and libp2p stays, so the
    # floor for sha2 is 2 versions.
    { crate = "sha2@0.11.1", reason = "multihash-codetable 0.2.2, ed25519-dalek 3, k256/p256 0.14 need 0.11; libp2p-identity 0.2 pins 0.10 — floor is 2" },

    # ed25519-dalek / curve25519-dalek 2.x / 4.x — crates/foundation/crypto
    # is on ed25519-dalek 3, with iroh and vera.rs, while libp2p-identity
    # 0.2 requires ed25519-dalek 2 and libp2p-noise 0.46 x25519-dalek 2.
    # Removable with the libp2p 0.57 bump (#1875).
    { crate = "ed25519-dalek@2.2.0", reason = "libp2p-identity 0.2 requires 2.x; ours is on 3 — removable with #1875" },
    { crate = "curve25519-dalek@4.1.3", reason = "ed25519-dalek 2 and x25519-dalek 2 under libp2p, and snow — removable with #1875" },

    # reqwest 0.12 — backbone's acp-light-client and defra-harness, and
    # vera.rs's vera-client and vera-harness (pinned revs). Ours is 0.13.
    { crate = "reqwest@0.12.28", reason = "acp-light-client, defra-harness, vera-client, vera-harness at their pinned revs" },

    # rand / getrandom — every major has third-party dependents that
    # pin it: libp2p and ring on getrandom 0.2 and rand 0.8, hickory,
    # yamux and opentelemetry_sdk on rand 0.9. The workspace is on rand
    # 0.10, with iroh, commonware and pgwire.
    { crate = "rand@0.8.8", reason = "libp2p 0.56, ark-std 0.4, and the vera.rs/backbone test harness" },
    { crate = "rand@0.9.5", reason = "hickory-proto 0.25, yamux 0.13, governor, opentelemetry_sdk, tungstenite 0.26" },
    { crate = "getrandom@0.2.17", reason = "ring, libp2p, rand_core 0.6, commonware" },
    { crate = "getrandom@0.3.4", reason = "rand_core 0.9 under ahash, governor" },

    # unsigned-varint 0.7 — multistream-select 0.13 inside libp2p.
    { crate = "unsigned-varint@0.7.2", reason = "multistream-select 0.13 inside libp2p" },

    # sysinfo 0.33 — libp2p-memory-connection-limits 0.5, in every
    # libp2p build. crates/database/p2p is on 0.39 with commonware-runtime.
    # The libp2p 0.57 line (#1875) moves it to 0.38, so it unifies only
    # once that release and commonware agree on one version.
    { crate = "sysinfo@0.33.1", reason = "libp2p-memory-connection-limits 0.5; ours follows commonware-runtime on 0.39" },

    # thiserror 1 — graphql-parser 0.4, jni 0.21, regolith 0.2, rtnetlink,
    # orbis-reporting and quick-protobuf-codec. No first-party crate
    # declares v1; the duplicate is entirely third-party.
    { crate = "thiserror@1.0.69", reason = "graphql-parser, jni, regolith, rtnetlink, orbis-reporting, quick-protobuf-codec; no first-party declaration remains" },
]
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/sourcenetwork/backbone",
]
