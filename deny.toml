# Normal and build dependencies only: what ships. A crate's tests may use
# what its library may not (the data path's tests run on tokio test runtimes).
[graph]
exclude-dev = true

[advisories]
# Some ignored crates live in tools/ (excluded from CI workspace) so may not match
unused-ignored-advisory = "warn"
ignore = [
    # ------------------------------------------------------------------
    # Unmaintained crates pulled in via upstream ecosystems we don't
    # control. Each entry documents the pulling path and the condition
    # under which it can be removed. Narrowed as part of #705.
    # ------------------------------------------------------------------

    # derivative — unmaintained. Pulled by ark-ec 0.4 through decaf377 in
    # vera.rs (vera-crypto). Removable when decaf377 moves to ark-ec 0.5+.
    "RUSTSEC-2024-0388",

    # fxhash — unmaintained. Pulled by bm25 2.3.x (full-text search).
    # Our direct bm25 dep is already pinned to the latest workspace
    # version; upstream bm25 would need to switch its internal hasher
    # (e.g. to ahash) before this can be removed.
    "RUSTSEC-2025-0057",

    # paste — unmaintained. Pulled by alloy-primitives (backbone repo,
    # ACP light client). Removable when alloy migrates off paste; our
    # direct alloy pin is already at the latest workspace version.
    "RUSTSEC-2024-0436",

    # rustls-pemfile 1.x — unmaintained (2.x is current). Pulled by
    # reqwest 0.11 inside tendermint-rpc 0.40.4 (vera's Cosmos client).
    # Removable when tendermint-rpc moves to reqwest 0.12.
    "RUSTSEC-2025-0134",

    # unsafe-libyaml — unmaintained. Pulled by serde_yaml 0.9, itself
    # deprecated, which acp reads policies with. Removable when acp moves to
    # a maintained YAML crate.
    "RUSTSEC-2024-0449",

    # atomic-polyfill — unmaintained. Pulled by heapless 0.7 through
    # postcard inside cranelift (wasmtime), only on targets without native
    # atomics. Removable when postcard moves to heapless 0.8+.
    "RUSTSEC-2023-0089",

    # ------------------------------------------------------------------
    # Vulnerabilities unreachable from our feature set, or blocked on an
    # upstream release. Tracked in #1874; each entry names the unblocking
    # condition.
    # ------------------------------------------------------------------

    # crypto-bigint 0.5.5 has no patched release in its 0.5 line. It is
    # required by elliptic-curve 0.13 through k256, alloy and cosmrs. The
    # 0.7 dependency is patched in Cargo.lock.
    # Remove when these upstream consumers move to patched RustCrypto
    # releases; the remaining timing side-channel exposure is tracked in #2261.
    { id = "RUSTSEC-2026-0387", reason = "Unpatched crypto-bigint 0.5 dependency through elliptic-curve 0.13; upstream migration tracked in #2261" },

    # h2 0.3 and rustls-webpki 0.101 — pulled by reqwest 0.11 inside
    # tendermint-rpc 0.40.4 (vera's Cosmos client), already the latest
    # release. Reached only over TLS to the configured Cosmos RPC endpoint.
    # Removable when tendermint-rpc moves to reqwest 0.12.
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # emSign intermediates: 0.101 has no fix; our direct 0.103 is on 0.103.16.
    "RUSTSEC-2026-0382",
    # rustls 0.21 from the same reqwest 0.11. 0346 needs a custom session
    # store that logs with Debug, which we don't have; 0349 is fixed only in
    # rustls 0.23.46, which our direct rustls is already on.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",

    # zstd 0.13 and zstd-safe 7 — pulled only by commonware-storage from the
    # iverc/commonware-upstream fork, through vera.rs and backbone's
    # acp-light-client (pinned revs). It calls bulk::Decompressor (one-shot
    # DCtx::decompress) and CCtx, never stream::raw with_context (0391) or
    # DCtx::decompress_stream (0403). zstd-sys is already on the patched 2.1.2.
    # Remove when the fork moves to zstd 0.14.3 and vera.rs and backbone repin (#2298).
    { id = "RUSTSEC-2026-0391", reason = "commonware-storage fork still on zstd 0.13; unreachable call; #2298" },
    { id = "RUSTSEC-2026-0403", reason = "commonware-storage fork still on zstd-safe 7; no decompress_stream; #2298" },
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4 is unmaintained and pulled by the current schema/date ecosystem; migration tracked separately" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
allow = []
# dashmap is banned in this codebase: the concurrent map is
# regolith::sync::HopscotchMap (kovan's), plain maps are rapidhash's. No
# workspace crate names it. The copy in the graph comes in only through
# third-party crates, each allowed behind its own wrapper and removable only
# upstream: governor and commonware-parallel, pulled by commonware through
# vera.rs and backbone's acp-light-client (pinned revs).
# No crate of ours depends on tokio: nuclei runs our tasks, timers and
# sockets, and a library that needs a tokio runtime is reached through
# `edge::compat` (async-compat and the runtime it enters, `edge`'s alone). tokio stays in the graph only
# under the third-party crates listed here, which bring it themselves.
# Regenerate the third-party list with
#   cargo tree -i tokio -e normal,build --depth 1 --workspace --target all
deny = [
    { name = "dashmap", wrappers = ["commonware-parallel", "governor"] },
    { name = "async-compat", wrappers = ["edge"] },
    # pinc is the only P2P transport; neither stack may come back.
    { name = "libp2p" },
    { name = "iroh" },
    { name = "tokio", wrappers = [
        # Third-party crates that are themselves network or runtime code.
        "acp-light-client", "async-compat", "axum", "commonware-macros",
        "commonware-runtime", "commonware-utils", "defra-harness", "edge", "h2",
        "hyper", "hyper-rustls", "hyper-tls", "hyper-util",
        "jsonrpsee-client-transport",
        "jsonrpsee-core", "jsonrpsee-server",
        "n0-future", "opentelemetry_sdk",
        "pgwire", "reqwest", "tendermint-rpc",
        "test-infra", "tokio-native-tls", "tokio-rustls", "tokio-stream", "tokio-tungstenite",
        "tokio-util", "tower", "vera-backend", "vera-client",
        "vera-consensus", "vera-executor", "vera-harness", "vera-jsonrpc", "vera-node",
        "vera-test-infra", "wasm-bindgen-futures",
    ] },
]
highlight = "lowest-version"

# ------------------------------------------------------------------
# Accepted duplicate versions, from the #1333 inventory. Each entry
# names the version we cannot remove, the path that pulls it, and the
# condition under which it disappears. Versions absent from this list
# are still reported as warnings.
#
# Measure duplicates per shipped artifact, not with `--workspace`:
# `--workspace` unifies features across every member including
# tools/integration-test. Count distinct names, because `cargo tree -d`
# double-lists some same-version packages:
#
#   cargo tree -d -e normal -p cli | grep -E '^[a-zA-Z0-9_-]+ v' \
#     | awk '{print $1}' | sort -u | wc -l
#
# `keyring v0.5.0` alongside `keyring v3.6.3` in that output is our own
# crates/foundation/keyring colliding with the crates.io name. Not a duplicate.
# ------------------------------------------------------------------
skip = [
    # prost 0.13 — cosmos-sdk-proto / tendermint / ics23 under cosmrs
    # 0.22 (crates/engine/vera), and jmt under acp-light-client.
    # Removable when that stack moves to prost 0.14.
    { crate = "prost@0.13.5", reason = "hard-pinned by the cosmrs 0.22 / tendermint 0.40 stack; not ours to move" },

    # sha2 0.9 — ed25519-consensus 2.1, via commonware-cryptography and
    # tendermint. Only present in vera/backbone builds.
    { crate = "sha2@0.9.9", reason = "ed25519-consensus 2.1 under commonware-cryptography and tendermint" },

    # reqwest 0.11 — one edge: tendermint-rpc 0.40.4 under cosmrs 0.22.
    # It carries hyper 0.14, h2 0.3, rustls 0.21, tokio-rustls 0.24,
    # hyper-rustls 0.24, rustls-webpki 0.101, system-configuration 0.5
    # and untrusted 0.7 with it. cosmrs gates tendermint-rpc behind an
    # optional `rpc` feature that is not in its defaults, so this may
    # be removable — tracked separately under #1327.
    { crate = "reqwest@0.11.27", reason = "tendermint-rpc 0.40.4 under cosmrs 0.22; cosmrs/rpc audit tracked under #1327" },

    # rand / getrandom — every major has third-party dependents that
    # pin it. crates/foundation/crypto and defra-core use rand 0.8 for key
    # generation, so our declaration does not move without a key-generation
    # review.
    { crate = "getrandom@0.3.4", reason = "rand_core 0.9 under ahash, fastbloom, governor" },

    # unsigned-varint 0.2 — reached only through multicodec 0.1 under
    # defra-core. Removed for free by #1330.
    { crate = "unsigned-varint@0.2.3", reason = "multicodec 0.1 under defra-core — removed by #1330" },

    # sysinfo 0.37 — commonware-runtime, i.e. vera/backbone builds
    # only. crates/database/p2p stays on 0.33; 0.37 would have unified with
    # commonware instead and left the default CLI on two versions.
    { crate = "sysinfo@0.37.2", reason = "commonware-runtime; vera/backbone builds only" },

    # thiserror 1 — graphql-parser 0.4, josekit 0.8, lark-kv,
    # cosmrs, jmt, tendermint-rpc,
    # proc-macro-crate 1.1 and quick-protobuf-codec. No first-party
    # crate declares v1 as of #1333; the duplicate is entirely
    # third-party.
    { crate = "thiserror@1.0.69", reason = "graphql-parser, josekit, lark-kv, cosmrs, jmt; no first-party declaration remains" },
]
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/sourcenetwork/backbone",
]
