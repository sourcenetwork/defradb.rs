\* run-all: LiveMarkerGeneration.tla RED
\* #3114: retired ack on the generation alone; with post-commit allocation the older head holds the newer generation and clears it (INV_LiveOwed)
\* RED: the retired branch acks on the generation alone, as on main. Writer 1 commits head 1, writer 2 commits head 2, then writer 2 allocates generation 1 and writer 1 generation 2, since generations are allocated after commit. Writer 2 writes marker 1; writer 1, not superseded, writes marker 2. Writer 1's push lands with the older head and its ack, at its own generation, clears marker 2; writer 2's push is lost. Head 2 is neither delivered nor marked (INV_LiveOwed).
SPECIFICATION Spec
CONSTANT LiveMode = "covered"
CONSTANT Fence = TRUE
CONSTANT HeadFence = FALSE
INVARIANTS INV_NoFalseFailure INV_LiveOwed
CHECK_DEADLOCK FALSE
