\* run-all: AcpOutbox.tla GREEN
\* the drainer takes its turns by itself: every committed change ends settled, refused or awaiting authority
\* GREEN: the drainer with what is promised to happen. The provider comes
\* back, a journaled request lands and is resolved by the drainer or by
\* another, a marked change is decided, fresh authority is supplied. Two
\* changes of the creator, signed with a delegation that expires once, one
\* crash or dropped wait. Every committed change ends settled, or parked as
\* refused or as awaiting authority.
SPECIFICATION SpecLiveJournaled
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c"}
  Auths                    = {"deleg"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 1
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = TRUE
  Note                     = TRUE
  Floor                    = TRUE
  Captured                 = TRUE
  Remote                   = FALSE
  ActorFromCredential      = TRUE
  RemoteCheck              = TRUE
  RemoteAuthority          = TRUE
  HeldKeys                 = {}
  MaxBatch                 = 2
  Isolate                  = TRUE
INVARIANT TypeOK
PROPERTY LIVE_Drains
CHECK_DEADLOCK FALSE
