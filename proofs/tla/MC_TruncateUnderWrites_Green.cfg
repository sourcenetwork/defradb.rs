\* GREEN: truncate under writes. Each listed document is deleted in its own
\* validated attempt, and the collection-level step leaves document data
\* alone. Every listed document goes, every fresh one stays, no delete leaves
\* an update behind, and no attempt runs out while writers write.
SPECIFICATION Spec
CONSTANTS
  Listed = {"d1", "d2"}
  Fresh = {"f1"}
  MaxAttempts = 2
  Enforced = {"perdoc", "keepfresh", "validated"}
INVARIANT TypeOK
INVARIANT INV_ListedGone
INVARIANT INV_FreshIntact
INVARIANT INV_NoOrphans
INVARIANT INV_NoExhaustion
CHECK_DEADLOCK FALSE
