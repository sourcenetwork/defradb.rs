\* GREEN: the code as written. Decisions are never served from memory, shutdown
\* drains requests before it stops the Vera node, waits for its thread up to a
\* deadline and closes its transports. No decision is given without Vera, no
\* admitted request is refused by the stop, the directory is free once the
\* node shut down, and shutdown returns even when Vera hangs.
