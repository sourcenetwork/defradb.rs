\* GREEN: the code as written. A remembered decision is repeated only while
\* the state it was read at is fresh, shutdown drains requests before it stops
\* the Vera node, waits for its thread up to a deadline and closes its
\* transports. No decision is given from a state past its freshness limit, the
\* stop refuses no admitted request but one the request drain gave up on, the
\* directory is free once the node shut down and the Vera node ended, and
\* shutdown returns even when Vera hangs. The next node's start over the same
\* directory starts, or fails at its deadline while a hung Vera node holds it.
SPECIFICATION Spec
CONSTANTS
  FreshDecisions    = TRUE
  StopAfterRequests = TRUE
  StopDeadline      = TRUE
  StartDeadline     = TRUE
  ClosesLink        = TRUE
INVARIANT TypeOK
INVARIANT INV_NoDecisionPastFreshness
INVARIANT INV_AdmittedRequestsDecided
INVARIANT INV_StoppedNodeFreesDirectory
PROPERTY LIVE_ShutdownReturns
PROPERTY LIVE_NextStartReturns
CHECK_DEADLOCK FALSE
