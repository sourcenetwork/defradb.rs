\* RED: decisions are remembered. After the Vera node stops, a request is
\* given the decision an earlier one got. Must fail INV_NoDecisionWithoutVera.
SPECIFICATION Spec
CONSTANTS
  NoDecisionCache   = FALSE
  StopAfterRequests = TRUE
  StopDeadline      = TRUE
  ClosesLink        = TRUE
INVARIANT INV_NoDecisionWithoutVera
CHECK_DEADLOCK FALSE
