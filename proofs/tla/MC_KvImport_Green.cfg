\* A signing Go snapshot: a merges whole without its signature blocks, b (no first version) and c (encrypted) are reported, a peer push without its signature block is refused, live writes and reruns keep everything.
SPECIFICATION Spec
CONSTANTS
  Filtered = {"a"}
  MaxRuns = 2
  StoreMode = "Before"
  GenesisMode = "Check"
  WriteMode = "Join"
  JudgeMode = "Restore"
  ReportMode = "Report"
  SigMode = "RestoreOnly"
  EncMode = "Check"
INVARIANTS INV_MergedHasBlocks INV_NoDocWithoutFirst INV_NoLostLiveWrite INV_NoUnsignedPush INV_NoUnreadableStored INV_Complete
CHECK_DEADLOCK FALSE
