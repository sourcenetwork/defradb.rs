\* A Go snapshot: a merges whole, b (no first version) is reported, live writes and reruns keep everything.
SPECIFICATION Spec
CONSTANTS
  Filtered = {"a"}
  MaxRuns = 2
  SnapMode = "Shallow"
  StoreMode = "Before"
  GenesisMode = "Check"
  WriteMode = "Join"
  JudgeMode = "Restore"
  ReportMode = "Report"
INVARIANTS INV_MergedHasBlocks INV_NoDocWithoutFirst INV_NoLostLiveWrite INV_Complete
CHECK_DEADLOCK FALSE
