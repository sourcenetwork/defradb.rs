\* run-all: StickyDisconnect.tla RED
\* the close code is ignored: the peer hung up on dials back from a late list (NoRedialAfterDeliberateClose)
\* RED: the peer hung up on ignores the close code (hung_up_on never
\* reads CLOSE_DISCONNECTED), so it keeps no memory of the hang-up, and a late
\* list naming the node has it dial back. Must fail
\* NoRedialAfterDeliberateClose.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = TRUE
  QuietUnlinked = TRUE
  RemoteQuiet = FALSE
  Unquiet = TRUE
  OnlyDiscoveryChecked = TRUE
  RecheckQuiet = TRUE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT NoRedialAfterDeliberateClose
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
