\* run-all: VeraPolicyCreate.tla RED
\* a nonce taken from a caller that is not the node's actor: its id comes from the actor's DID (INV_SuppliedIdIsCallers)
\* RED: a caller's nonce is taken from any caller. The provider creates as
\* the node's actor, so a caller that is not that actor gets back an id
\* derived from the actor's DID, not the one it computed from its own, and a
\* policy seeded under the caller is never found (INV_SuppliedIdIsCallers).
SPECIFICATION Spec
CONSTANTS
  Requests = {r1, r2}
  Creators = {c1, c2}
  Defs = {d1, d2}
  Nonces = {n1, n2}
  MaxSends = 2
  Enforced = {"reuse", "adopt", "check", "creator"}
INVARIANT INV_SuppliedIdIsCallers
CHECK_DEADLOCK FALSE
