\* RED: events of a topic the engine is not subscribed to are handed on. A
\* node joins a requester's reply topic only to publish a KMS reply, and its
\* engine gets that topic's messages and JOINED events, though it never
\* subscribed. Must fail INV_OnlyEngineTopics.
SPECIFICATION Spec
CONSTANTS
  Nodes         = {a, b}
  RawTopic      = TRUE
  Gate          = TRUE
  RawFirst      = TRUE
  SessionFilter = TRUE
  OwnerCheck    = TRUE
  EngineFilter  = FALSE
INVARIANT TypeOK
INVARIANT INV_OnlyEngineTopics
CHECK_DEADLOCK FALSE
