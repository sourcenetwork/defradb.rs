\* run-all: ProllyNodeCache.tla RED
\* the publishing transaction leaves the root's node pending (PublishedStored)
\* The bug: the transaction that publishes a root does not write the pending
\* nodes, so the root goes out while its node waits in memory. regolith does
\* not hold it, and a crash now loses it for good. PublishedStored fails.
SPECIFICATION Spec
CONSTANTS
  ReadPending = TRUE
  Evict = TRUE
  SkipHuge = TRUE
  KeepOnFail = TRUE
  NodesWithRoot = FALSE
  RefuseAfterFail = TRUE
INVARIANT PublishedStored
CHECK_DEADLOCK FALSE
