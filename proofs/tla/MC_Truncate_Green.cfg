\* GREEN: truncate. All five checks run in Go's order before the delete, which
\* takes every document without a filter and the committed matches with one,
\* and an unfiltered delete clears a view's cache. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  Enforced = {"nac", "chunk", "branchable", "txn", "shape", "viewcache"}
INVARIANT TypeOK
INVARIANT INV_NoRemovalWithoutPermission
INVARIANT INV_NoRemovalFromChunks
INVARIANT INV_FilteredNeverOnBranchable
INVARIANT INV_FilteredRemovesOnlyCommittedMatches
INVARIANT INV_BadFilterRemovesNothing
INVARIANT INV_UnfilteredRemovesAll
INVARIANT INV_UnfilteredEmptiesView
CHECK_DEADLOCK FALSE
