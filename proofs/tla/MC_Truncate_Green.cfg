\* GREEN: truncate. All five checks run in Go's order before the delete, which
\* takes every document without a filter and the committed matches with one,
\* read again before each page's purge, and an unfiltered delete clears a
\* view's cache and every search record. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  Enforced = {"nac", "chunk", "branchable", "txn", "shape", "reread", "viewcache", "progress", "seprefix", "sesamespace", "metaerror"}
INVARIANT TypeOK
INVARIANT INV_NoRemovalWithoutPermission
INVARIANT INV_NoRemovalFromChunks
INVARIANT INV_FilteredNeverOnBranchable
INVARIANT INV_FilteredRemovesOnlyCommittedMatches
INVARIANT INV_FilteredRemovesOnlyCurrentMatches
INVARIANT INV_BadFilterRemovesNothing
INVARIANT INV_RetryExhaustionKeepsProgress
INVARIANT INV_MetadataExhaustionRefused
INVARIANT INV_UnfilteredRemovesAll
INVARIANT INV_UnfilteredEmptiesView
INVARIANT INV_UnfilteredClearsSearchRecords
CHECK_DEADLOCK FALSE

\* A filtered request with no matching documents finishes immediately.
INVARIANT INV_EmptyFinishes
