\* GREEN: truncate. All four checks run in Go's order before the delete, which
\* takes every document without a filter and the committed matches with one.
\* Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  Enforced = {"nac", "branchable", "txn", "shape"}
INVARIANT TypeOK
INVARIANT INV_NoRemovalWithoutPermission
INVARIANT INV_FilteredNeverOnBranchable
INVARIANT INV_FilteredRemovesOnlyCommittedMatches
INVARIANT INV_BadFilterRemovesNothing
INVARIANT INV_UnfilteredRemovesAll
CHECK_DEADLOCK FALSE
