\* run-all: DocRelationship.tla RED
\* The core checks the arguments and the owner relation before the collection: a refusal names another check than Go's (INV_GoOrder)
\* RED: the core asks for the arguments and refuses the owner relation before
\* it looks the collection up. A request on a collection with no policy and
\* no document is refused for the missing argument, where Go says the
\* collection has no policy, so the client reads another error than Go's.
SPECIFICATION Spec
CONSTANTS
  Skipped = {}
  Swapped = TRUE
  ServerCopy = FALSE
  EventFirst = FALSE
  TxnSwapped = FALSE
INVARIANT INV_GoOrder
CHECK_DEADLOCK FALSE
