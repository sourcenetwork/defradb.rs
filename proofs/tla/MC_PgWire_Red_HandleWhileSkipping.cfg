\* RED: in AwaitingSync, dispatch handles every message as a ready connection
\* would, not only Sync. An extended message after the error is handled. Must
\* fail INV_SkipUntilSync.
SPECIFICATION Spec
CONSTANTS
  Limit              = 1
  MaxTime            = 0
  MaxMsgs            = 3
  PreMsgs            = {"anon"}
  PostMsgs           = {"ext", "sync"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = FALSE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_SkipUntilSync
CHECK_DEADLOCK FALSE
