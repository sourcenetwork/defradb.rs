\* RED: the write's own permission is checked first. Caller c, who holds
\* neither, is told it lacks the write's permission where Go says
\* get-collection (INV_RefusalNamesGoFirst).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  anon = anon
  node = node
  Bug = "OwnFirst"
INVARIANT TypeOK
INVARIANT INV_RefusalNamesGoFirst
CHECK_DEADLOCK FALSE
