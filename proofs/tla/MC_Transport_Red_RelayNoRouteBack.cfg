\* Go's two-stream reply is a fresh dial back to the sender.  Over a relay-only
\* path the origin is authenticated but not reverse-routable, so the request
\* lands and merges while no reply ever does: the sender never retires its
\* marker and retries forever.  Expect: LIVE_SenderQuiesces VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxHead <- mcMaxHead
  MaxLoss <- mcMaxLoss
  LinkMode     = "Reorder"
  DupMode      = "Dedup"
  ReplyMode    = "NewStream"
  RouteMode    = "RelayOnly"
  TimeoutMode  = "Ambiguous"
  RegisterMode = "HeadCurrent"
INVARIANT INV_TypeOK
PROPERTY LIVE_SenderQuiesces
