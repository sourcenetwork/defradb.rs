\* run-all: RetryRegistrationFence.tla RED
\* A failed batch retries a registration under a replacement incarnation.
\* ACT_RegistrationCannotCrossFence fails when that registration writes a marker.
SPECIFICATION Spec
CONSTANT Peers = {"p1", "p2"}
CONSTANT Background = 1
CONSTANT MaxEpoch = 2
CONSTANT Faults = TRUE
CONSTANT CheckEpoch = TRUE
CONSTANT CheckOrder = TRUE
CONSTANT KeepFallbackFence = FALSE
CONSTANT FanOut = "PerPeer"
INVARIANT TypeOK
PROPERTY ACT_RegistrationCannotCrossFence
INVARIANT INV_FanOutPeerLocal
PROPERTY LIVE_FanOutDecides
CHECK_DEADLOCK FALSE
