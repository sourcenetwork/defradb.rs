\* run-all: ChunkSigner.tla RED
\* a no-signing writer leaves its chunks unsigned and R refuses them (INV_WriterChunkKept)
\* RED: this is the documented consequence of opting out of signing. An
\* unsigned chunk names nobody who may update a protected article, so R's
\* check refuses the writer's chunk for good (INV_WriterChunkKept). Protected
\* chunk replication requires signing.
SPECIFICATION Spec
CONSTANTS
  CheckParent = TRUE
  Sign = FALSE
  WaitForParent = TRUE
  Provider = "Local"
  Rebuild = FALSE
  MaxFlips = 0
INVARIANT INV_WriterChunkKept
CHECK_DEADLOCK FALSE
