\* transaction (the process-wide cache, a fresh read transaction). It misses
\* a document the caller added earlier in the same transaction, so a removal
\* that should fail with "has documents" goes ahead (INV_SeesOwnWrites).
SPECIFICATION Spec
CONSTANTS
  ReadThroughTxn = FALSE
  WriteThroughTxn = TRUE
  FinishOnCommit = TRUE
  RetryHides = FALSE
INVARIANT INV_SeesOwnWrites
CHECK_DEADLOCK FALSE
