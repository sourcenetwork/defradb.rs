\* GREEN, mux 0.2: replies come back on the request's stream and every reply
\* stream is refused, so no reply stream is admitted at all, and every owed
\* reply is still handled.
SPECIFICATION Spec
CONSTANTS
  MaxReq = 3
  MatchMode = "Match"
  TakeMode = "Decrement"
  PruneMode = "ExpiredSerial"
  SendMode = "ExpectFirst"
  ExpiredMode = "Reset"
  Mux = "V2"
  ReplyMode = "RequestStream"
  RespMode = "Refuse"
INVARIANT INV_TypeOK
INVARIANT INV_NoUnsolicitedAdmitted
INVARIANT INV_SolicitedAdmitted
INVARIANT INV_NoReplyStreamOnV2
