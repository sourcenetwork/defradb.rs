\* run-all: RetryPeerSchedule.tla GREEN
\* The code as fixed: a scan that found no marker is validated, so a marker
\* committed into the range meanwhile aborts the acknowledgement or the clear,
\* which runs again and sees it; and the registration's row read is validated,
\* so an acknowledgement that deletes the row after the registration began
\* aborts the registration, whose re-run writes the row back. Every marker
\* keeps its schedule row.
SPECIFICATION Spec
CONSTANT ValidateEmptyScan = TRUE
CONSTANT ValidateRowRead = TRUE
INVARIANT TypeOK
INVARIANT INV_EveryMarkerScheduled
CHECK_DEADLOCK FALSE
