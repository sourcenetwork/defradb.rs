\* RED: the code as it stands. prune_finished_tasks never reads the shutdown
\* flag. A late spawn passes its first flag check before shutdown, the drain
\* then finds no pruner at work, and only after that does the pruner start: it
\* takes an early task's handle out, the drain takes the rest and returns, and
\* the pruner puts the handle back, still running, into a set nobody will drain
\* again. Must fail INV_NoLeak.
SPECIFICATION Spec
CONSTANTS
  Callers          = {"c1"}
  Tasks            = {"t1", "t2"}
  Late             = {"t2"}
  CanKill          = FALSE
  SwapFlag         = TRUE
  AtomicSpawn      = TRUE
  RunRefused       = TRUE
  DrainOwnsSender  = TRUE
  WaitForPruners   = TRUE
  PrunerChecksFlag = FALSE
  RecheckAfterPush = TRUE
  AbortAtDeadline  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoLeak
CHECK_DEADLOCK FALSE
