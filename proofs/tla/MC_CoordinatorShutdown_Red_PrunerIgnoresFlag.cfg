\* run-all: CoordinatorShutdown.tla RED
\* RED: an entrant ignores the shutdown flag and starts a task after the
\* drain has taken the queue. The drain returns with the task still live.
SPECIFICATION Spec
CONSTANTS
  Callers          = {"c1"}
  Tasks            = {"t1", "t2"}
  Late             = {"t2"}
  CanKill          = FALSE
  SwapFlag         = TRUE
  AtomicSpawn      = TRUE
  RunRefused       = TRUE
  DrainOwnsSender  = TRUE
  WaitForRegistry   = TRUE
  CheckRegistryFlag = FALSE
  KeepActive        = TRUE
  AbortAtDeadline  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoLeak
CHECK_DEADLOCK FALSE
