\* RED: libp2p lets a background dial through from a peer the recipient
\* deliberately disconnected. Its explicit dials are still refused, so only the
\* background half of INV_MarkedInboundRefused catches the link that forms.
SPECIFICATION Spec
CONSTANTS
  Nodes = {"a", "b", "c"}
  Half = "Libp2p"
  Bug = "AcceptsBackgroundInbound"
INVARIANT TypeOK
INVARIANT INV_NoRedialAfterDeliberateClose
INVARIANT INV_RemoteExplicitDialAccepted
INVARIANT INV_MarkedInboundRefused
CHECK_DEADLOCK FALSE
