\* GREEN: unified / conflict-checked RMW (Go's single value key, or a per-doc lock
\* spanning local-write + merge), the merged-set dedup guard ON, and the standalone
\* deferral ON. Two late increments may arrive standalone before the document has a
\* value, before or after their composites. The materialized value is EXACT in every
\* interleaving — no increment lost, none double-applied.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  LocalOps  = {l1, l2}
  RemoteOps = {r1}
  StoreMode = "Unified"
  Dedup     = "On"
  LateOps   = {s1, s2}
  Defer     = "On"
INVARIANT INV_TypeOK
INVARIANT INV_Exact
