\* run-all: AddView.tla RED
\* The sdl check is left out of the core: an SDL that does not parse still gets its views (INV_NoViewUnlessAllChecksPass)
\* RED: the core skips the sdl check, and both ways in forward to it, so
\* an SDL that does not parse is not refused and its views are created.
SPECIFICATION Spec
CONSTANTS
  Views = {"a", "b"}
  CoreChecks = {"nac", "one", "cid", "chunk", "downsample", "policy", "identity"}
  ServerChecks = {"nac", "one", "cid", "chunk", "downsample", "policy", "identity"}
  BuildFirst = FALSE
INVARIANT INV_NoViewUnlessAllChecksPass
CHECK_DEADLOCK FALSE
