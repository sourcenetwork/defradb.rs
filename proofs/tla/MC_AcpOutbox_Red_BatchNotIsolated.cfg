\* RED: a refused batch is parked whole. The owner stages a change, the
\* provider goes away, and an actor without authority stages an add in the
\* same transaction, unchecked. Both go in one request; the provider refuses
\* it for the second; the bug parks the owner's change as refused too,
\* though the provider would take it alone. Must fail INV_RefusedOnItsOwn.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"node"}
  Preexisting              = TRUE
  InitTuples               = {"g"}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = TRUE
  Note                     = TRUE
  Floor                    = TRUE
  Captured                 = TRUE
  Remote                   = FALSE
  ActorFromCredential      = TRUE
  RemoteCheck              = TRUE
  MaxBatch                 = 2
  Isolate                  = FALSE
INVARIANT INV_RefusedOnItsOwn
CHECK_DEADLOCK FALSE
