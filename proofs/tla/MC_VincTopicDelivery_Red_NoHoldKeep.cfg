\* RED: an unsubscribe leaves the topic though a publish still holds it. A
\* node subscribed to a document topic, published on it, then unsubscribed:
\* it is off the topic while its hold lasts, so it no longer hears who joins
\* and leaves the document it wrote. Must fail INV_HeldIsJoined.
SPECIFICATION Spec
CONSTANTS
  Nodes         = {a, b}
  RawTopic      = FALSE
  Gate          = TRUE
  RawFirst      = TRUE
  SessionFilter = TRUE
  OwnerCheck    = TRUE
  HoldKeep      = FALSE
  EngineFilter  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoDeliveryOffMesh
INVARIANT INV_RawNeverDecoded
INVARIANT INV_JoinedOnlyLinkedMembers
INVARIANT INV_EngineKeepsItsTopic
INVARIANT INV_OnlyEngineTopics
INVARIANT INV_HeldIsJoined
CHECK_DEADLOCK FALSE
