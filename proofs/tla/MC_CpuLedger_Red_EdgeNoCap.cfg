\* RED (j): the network runtime's claim loop has no cap. Pool 1 holds CPU 0
\* and keeps running; network runtime 2 plans on CPU 0 again after every lost
\* claim, loses again, and never gives up: the runtime's owner thread never
\* builds its runtime, so the process never gets a network. Must fail
\* LIVE_StartEnds.
\* Two CPUs, two slots living once each (Attempts is not used: the cap is
\* off): small, and still every interleaving of the scenario above.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 1
  Edges            = {2}
  Attempts         = 1
  AtomicTake       = TRUE
  RollBack         = TRUE
  InsertAfterWin   = TRUE
  ShareCounts      = TRUE
  AttemptCap       = FALSE
  KeepWhileRunning = TRUE
  ReleaseOnce      = TRUE
  RunOnHeld        = TRUE
  ReleaseAtEnd     = TRUE
INVARIANT TypeOK
PROPERTY LIVE_StartEnds
CHECK_DEADLOCK FALSE
