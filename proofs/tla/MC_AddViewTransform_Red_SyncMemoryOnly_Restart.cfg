\* RED: the code before #2724's fix. P2P sync puts a fetched lens in memory
\* only, and the view's check asks memory, so a view commits naming a lens
\* with no config, which a restart loses (INV_StoredTransformExists).
SPECIFICATION Spec
CONSTANTS
  CheckEmpty = TRUE
  CheckLens = TRUE
  StoreTransform = TRUE
  LensAt = "memory"
  NacAt = "txn"
  SyncPersists = FALSE
  MaxEnv = 2
INVARIANT INV_StoredTransformExists
CHECK_DEADLOCK FALSE
