\* RED: on_sync answers the Sync, but the state stays AwaitingSync, so the
\* connection drops every later message. Must fail INV_SyncResumes.
SPECIFICATION Spec
CONSTANTS
  Limit              = 1
  MaxTime            = 0
  MaxMsgs            = 3
  PreMsgs            = {"anon"}
  PostMsgs           = {"ext", "sync"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = FALSE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_SyncResumes
CHECK_DEADLOCK FALSE
