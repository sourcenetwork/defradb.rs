\* GREEN: the code as written, after the startup. An anonymous client sends
\* up to five queries, extended messages, Syncs and copy messages in any order;
\* every handler may succeed or fail, fatally or not, and a query may start a
\* copy, and so may an extended message. The clock stands still: the deadline
\* is the startup's, and this configuration is about AwaitingSync and the
\* copy. Every invariant and the liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  Limit              = 1
  MaxTime            = 0
  MaxMsgs            = 6
  PreMsgs            = {"anon"}
  PostMsgs           = {"query", "ext", "sync", "data", "done", "fail"}
  SimpleCopy         = TRUE
  ExtendedCopy       = TRUE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_StartupWithinDeadline
INVARIANT INV_StartedNeverTimedOut
INVARIANT INV_NoQueryBeforeStartup
INVARIANT INV_SkipUntilSync
INVARIANT INV_SyncResumes
INVARIANT INV_CopyEnds
INVARIANT INV_NothingAfterEnd
PROPERTY LIVE_Ends
CHECK_DEADLOCK FALSE
