\* RED: a read through a pinned old version stores the migrated document
\* back, as a read through the active version may. A request reads through
\* an old version and quietly rewrites the document at it. Must fail
\* INV_ReadNoSideEffect.
SPECIFICATION Spec
CONSTANTS
  Versions         = {v1, v2}
  None             = none
  MaxSteps         = 7
  ClearPin         = TRUE
  NoWriteBackOnPin = FALSE
INVARIANT INV_ReadNoSideEffect
CHECK_DEADLOCK FALSE
