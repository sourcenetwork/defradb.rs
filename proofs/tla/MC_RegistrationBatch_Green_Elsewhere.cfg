\* GREEN: the first document is a replica another node registered first to
\* its own owner. The settler finds it held, clears its record yielding to
\* that owner, and sends only the others.
SPECIFICATION Spec
CONSTANTS
  Obj          = {1, 2, 3}
  ByB          = {3}
  Bad          = {}
  Elsewhere    = {1}
  MaxLoss      = 1
  MaxOther     = 1
  Recheck      = TRUE
  AskOnRefusal = TRUE
  Fallback     = TRUE
  PerCreator   = TRUE
  InOrder      = TRUE
INVARIANT TypeOK
INVARIANT INV_ClearedOnlyHeld
INVARIANT INV_OwnerIsCreator
INVARIANT INV_RefusedOnlyIfBad
INVARIANT INV_NoResendOfKnownHeld
INVARIANT INV_HeldNotFailed
INVARIANT INV_Order
