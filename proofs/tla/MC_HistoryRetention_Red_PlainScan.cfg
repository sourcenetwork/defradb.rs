\* run-all: HistoryRetention.tla RED
\* #559: a block a merge adopts during the prune is deleted (INV_OwnedStored)
\* Bug planted: the owner scan deciding a delete is not validated. A merge of n adopts f2 after the attempt's snapshot, the commit does not conflict, and f2 is deleted while n owns it: INV_OwnedStored fails.
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Keep"
  FieldMode = "Keep"
  ScanMode = "Plain"
  MarkerMode = "Keep"
  WindowMode = "Exact"
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned
CHECK_DEADLOCK FALSE
