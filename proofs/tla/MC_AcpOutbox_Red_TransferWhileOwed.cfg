\* RED: the document changes owner on the provider while this node still
\* holds its owed registration. The creator's document is registered on the
\* provider, and before the node clears its record the creator gives the
\* document to another owner. The node still lets the creator read, by the
\* owed-registration rule, what the provider now gives to the new owner
\* alone. Must fail INV_NoWidening.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 1
  Subjects                 = {"g"}
  Actors                   = {"c"}
  Auths                    = {"node"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = FALSE
  AssumeNoTransferWhileOwed = FALSE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = FALSE
  Note                     = TRUE
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT INV_NoWidening
CHECK_DEADLOCK FALSE
