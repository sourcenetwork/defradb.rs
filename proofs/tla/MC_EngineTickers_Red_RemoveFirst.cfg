\* RED (guard: publish before LIVE.remove): the close takes the export out of
\* the map first and publishes after. In between, the export is gone from the
\* map with its last commit unclaimed, so a read that looks then misses it and
\* returns a total without it. One read, one export, one count. Must fail
\* INV_LeftClaimed.
SPECIFICATION Spec
CONSTANTS
  NS           = 1
  NR           = 1
  MaxCount     = 1
  Forward      = TRUE
  ClaimByCas   = TRUE
  Retry        = TRUE
  Refresh      = TRUE
  PublishFirst = FALSE
  HoldStats    = TRUE
  OnlyGrow     = TRUE
  OwnStats     = TRUE
  StopFirst    = TRUE
INVARIANT TypeOK
INVARIANT INV_LeftClaimed
CHECK_DEADLOCK FALSE
