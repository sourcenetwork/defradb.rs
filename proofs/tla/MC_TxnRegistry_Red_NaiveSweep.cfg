\* run-all: MC_TxnRegistry_Red_NaiveSweep.tla RED
\* naive sweep evicts a still-live txn
\* RED: naive sweep (no write-locked re-check) evicts a txn touched between collect & remove.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns    <- mcTxns
  MaxIdle = 1
  MaxTime = 4
  Recheck = "None"
INVARIANT INV_TypeOK
INVARIANT INV_LockExclusion
INVARIANT INV_NoLiveEvicted
