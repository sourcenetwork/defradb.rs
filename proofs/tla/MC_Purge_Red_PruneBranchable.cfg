\* Bug planted: the purge deletes the history in a @branchable collection too, as Go does.
\* The collection DAG still links the purged composites, so its `_commits` loses them and a syncing
\* peer cannot fetch them: INV_CollectionIntact fails.
SPECIFICATION Spec
CONSTANTS
  Branchable = TRUE
  HistoryMode = "Always"
  MaxActs = 0
  OwnerMode = "Checked"
  EdgeMode = "Drop"
  IndexMode = "Delete"
  CountMode = "Distinct"
  RetryMode = "Retry"
  ScanMode = "Validated"
INVARIANTS INV_OthersIntact INV_CollectionIntact INV_Gone INV_NoStaleOwner INV_Pruned INV_Count
PROPERTY PROP_Commits
CHECK_DEADLOCK FALSE
