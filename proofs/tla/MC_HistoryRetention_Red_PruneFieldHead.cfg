\* run-all: HistoryRetention.tla RED
\* #559: a field head only a pruned composite links is deleted (INV_FieldHeadsStored)
\* Bug planted: only the kept composites' links are retained. f1, the name field's head, is linked only by c1, which is pruned, so f1 is deleted: INV_FieldHeadsStored fails.
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Keep"
  FieldMode = "Prune"
  ScanMode = "Validated"
  MarkerMode = "Keep"
  WindowMode = "Exact"
  ReclaimMode = "Scan"
  ReadMode = "Refuse"
  MaxPrunes = 2
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned INV_Reclaimed INV_NoPartialRead
CHECK_DEADLOCK FALSE
