\* run-all: ChunkEmbedding.tla RED
\* no model or URL skips the vector and stores a chunk without one (INV_ListedChunkHasVector)
\* RED: the bug lets a node with no model or URL skip the embedding, as a
\* parent embedding does. The write commits its chunks with no vector, and
\* since a chunk is never written again, it never gets one
\* (INV_ListedChunkHasVector).
SPECIFICATION Spec
CONSTANTS
  KeyByText = TRUE
  WantOnlyMissing = TRUE
  ResolveOutside = TRUE
  WantEveryMiss = TRUE
  CommitNeedsVectors = TRUE
  Unconfigured = TRUE
  RefuseUnconfigured = FALSE
INVARIANT INV_ListedChunkHasVector
CHECK_DEADLOCK FALSE
