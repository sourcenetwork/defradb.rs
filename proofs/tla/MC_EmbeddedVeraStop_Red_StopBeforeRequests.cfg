\* RED: shutdown stops the Vera node while requests are still admitted. A
\* request the node took is refused for want of a decision. Must fail
\* INV_AdmittedRequestsDecided.
SPECIFICATION Spec
CONSTANTS
  NoDecisionCache   = TRUE
  StopAfterRequests = FALSE
  StopDeadline      = TRUE
  StartDeadline     = TRUE
  ClosesLink        = TRUE
INVARIANT INV_AdmittedRequestsDecided
CHECK_DEADLOCK FALSE
