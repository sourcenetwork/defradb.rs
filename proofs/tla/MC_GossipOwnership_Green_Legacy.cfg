\* GREEN: as Green, but r runs the older mux. A connection to r carries
\* every protocol but gossip, and it answers gossip's ask as a failed dial.
\* Every ask is still answered, and the healthy peer is still reached.
SPECIFICATION Spec
CONSTANTS
  Peers <- mcPeers
  Revocable <- mcRevocable
  Healthy = "h"
  Legacy <- mcLegacy
  MaxDrops = 1
  MaxForgets = 1
  ForgetBound = "Bounded"
  PathMode = "SharedMux"
  RecheckMode = "Recheck"
  ForgetMode = "DropSender"
  LegacyMode = "Answer"
INVARIANT INV_TypeOK
INVARIANT INV_RevokedHasNoGossip
INVARIANT INV_PathOnLiveConnection
INVARIANT INV_GossipNeverClosesShared
PROPERTY LIVE_HealthyReached
PROPERTY LIVE_AskAnswered
