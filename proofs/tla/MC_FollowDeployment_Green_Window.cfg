\* run-all: FollowDeployment.tla GREEN
\* a journal of one entry: a takeover that voids the pruned one fails closed
\* GREEN: as Green, but the journal retains one confirmation. A takeover that
\* voids the pruned one is noticed (its newest pruned entry is not held) and
\* the node fails closed instead of taking it as kept. Every property holds.
SPECIFICATION Spec
CONSTANTS
  Keep         = 1
  MaxTakeovers = 2
  Gate         = TRUE
  CacheByTerm  = TRUE
  Restage      = TRUE
  Taint        = TRUE
  CheckWindow  = TRUE
  MaxCrashes   = 1
  GateDelivery = TRUE
  Mark         = TRUE
  KeepBatch    = TRUE
INVARIANT TypeOK
INVARIANT INV_NoVoidDecision
INVARIANT INV_RevocationDenies
INVARIANT INV_NothingLost
PROPERTY LIVE_ResubmittedSettles
