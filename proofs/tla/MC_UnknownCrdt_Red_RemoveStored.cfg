\* RED: B, after storing a value of the custom type, is let start without
\* it. A whole-document rewrite then drops the value it cannot keep, and the
\* blocks that gave it are already merged, so building B with the type again
\* never brings it back. Must fail INV_ConvergeWhenDone.
SPECIFICATION Spec
CONSTANTS
  MaxBlocks = 2
  MaxVal    = 1
  Mode      = "RemoveStored"
INVARIANT INV_ConvergeWhenDone
CHECK_DEADLOCK FALSE
