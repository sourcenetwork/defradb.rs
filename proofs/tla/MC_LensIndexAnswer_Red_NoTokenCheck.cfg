\* RED: a rebuild clears whatever record stands. A merge that arrived after
\* the walk owed a new one, and the clear wipes it, so the stale entry
\* answers queries: INV_IndexMatchesReads fails.
SPECIFICATION Spec
CONSTANTS
  Gate = "owed"
  OweOnSchemaChange = TRUE
  OweOnMerge = TRUE
  SkipIfOwed = FALSE
  ClearChecksToken = FALSE
  MaxSteps = 6
INVARIANT TypeOK INV_IndexMatchesReads INV_SettledIndexAnswers
CHECK_DEADLOCK FALSE
