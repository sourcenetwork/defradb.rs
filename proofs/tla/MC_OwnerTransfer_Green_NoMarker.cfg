\* run-all: OwnerTransfer.tla GREEN
\* a provider without a journal sends a landed transfer again after a crash; the refusal is settled because the deployment names the new owner
\* GREEN: the provider keeps no journal, so after a crash between the
\* transfer taking effect and its record being deleted the drainer sends it
\* again. The deployment refuses the second transfer (the creator owns
\* nothing any more), and the node settles it because the deployment names
\* the new owner. The transfer is never reported refused after it took effect.
SPECIFICATION Spec
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = TRUE
  CommitConflict = TRUE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = FALSE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {}
  MaxFails       = 2
  MaxCrashes     = 1
  MaxLapses      = 1
  MaxAborts      = 1
  OwnTransfer    = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWidening
INVARIANT INV_EarlierUnderOwner
INVARIANT INV_LaterAfterTransfer
INVARIANT INV_QueueFollowsCommits
INVARIANT INV_RegistrationFirst
INVARIANT INV_TransferOnce
INVARIANT INV_RefusedTookNoEffect
INVARIANT INV_FailureReported
CHECK_DEADLOCK FALSE
