\* run-all: ClientUniqueAdmission.tla RED
\* the re-run keeps its first check (INV_AtMostOnePerNonNilValue)
\* RED: an autocommit write that lost its commit runs again but keeps its
\* first check ("no entry") instead of checking again. The re-run commits on
\* top of the winner and two documents hold "v" (INV_AtMostOnePerNonNilValue).
SPECIFICATION Spec
CONSTANTS
  Clients = {1, 2}
  Values = {"v"}
  Mode = "Autocommit"
  Indexed = TRUE
  EntryValidated = TRUE
  ScanDecides = FALSE
  FilterValidated = FALSE
  LoserLeaves = FALSE
  RerunReuses = TRUE
  NilChecked = FALSE
  MaxAttempts = 3
INVARIANT INV_AtMostOnePerNonNilValue
CHECK_DEADLOCK FALSE
