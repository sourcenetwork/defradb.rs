\* run-all: StorePurge.tla GREEN
\* an embedded node with or without a handler, both store kinds: wiped after close, opened after the wipe
\* GREEN: every guard in place. An embedded node, in development mode or
\* not, with or without a purge handler, on a persistent or a memory store,
\* no Vera node, with or without a second handle the application keeps, and
\* with or without the application calling Node::shutdown itself. Every
\* invariant holds and an accepted purge ends serving again or exited on an
\* error.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent", "Memory"}
  Veras    = {"None"}
  Developments = {TRUE, FALSE}
  Handlers = {TRUE, FALSE}
  HeldElsewhere = {TRUE, FALSE}
  OtherCallers  = {TRUE, FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
  SignerHeld               = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWipeWhileOpen
INVARIANT INV_NoOpenBeforeWipe
INVARIANT INV_NothingSurvives
INVARIANT INV_KeyringKept
INVARIANT INV_SignerSurvivesRestart
INVARIANT INV_RefusedPurgeTouchesNothing
INVARIANT INV_PurgeOnlyInDevelopment
INVARIANT INV_OnePurgePerRun
INVARIANT INV_NoRestartAfterFailedTeardown
PROPERTY LIVE_PurgeServesAgain
CHECK_DEADLOCK FALSE
