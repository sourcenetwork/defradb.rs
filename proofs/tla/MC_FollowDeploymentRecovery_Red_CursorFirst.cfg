\* RED: the cursor is written before the page is handed to the outbox. The
\* cursor says the page is done, so its lost records are never read again and
\* never owed. Must fail INV_NothingLost.
SPECIFICATION Spec
CONSTANTS
  Records       = 3
  Revoked       = {2, 3}
  PageSize      = 2
  MaxTakeovers  = 2
  MaxCrashes    = 1
  Gate          = TRUE
  HandOver      = TRUE
  OweFirst      = FALSE
  EndFromLedger = TRUE
  SaysDone      = TRUE
  TermFence     = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingLost
INVARIANT INV_RevocationDenies
PROPERTY LIVE_RecoveryEnds
