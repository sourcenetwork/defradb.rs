\* The bug: the hub's merge handler marks a merged head first, which
\* discharges the head's upstream pending record, and only then registers the
\* durable markers of the hub's own replicators. A restart or a failed forward
\* between the two leaves a head the downstream replicator lacks with nothing
\* left that owes it to it, so INV_ForwardObligationOwned is violated.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1}
  Cols           = {}
  MaxV           = 1
  Cap            = 1
  FetchCap       = 1
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "DischargeBeforeForward"
INVARIANT INV_TypeOK
INVARIANT INV_ForwardObligationOwned
