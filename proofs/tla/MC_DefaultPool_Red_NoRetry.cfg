\* RED (o): make_default tries its compare-and-swap once and answers "no" when
\* it fails (the loop at default.rs:89 removed). p1 and p2 both load the empty
\* slot; p1's swap works; c1 then stops p1, so p1 is closing; p2's swap fails
\* because the slot moved, and p2 answers "no" although no running pool holds
\* the slot: p2 could have been the default and is not. Two pools and one
\* caller (to stop p1). Must fail INV_MakeDefaultTellsTruth.
SPECIFICATION Spec
CONSTANTS
  NP                 = 2
  NC                 = 1
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = FALSE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_MakeDefaultTellsTruth
CHECK_DEADLOCK FALSE
