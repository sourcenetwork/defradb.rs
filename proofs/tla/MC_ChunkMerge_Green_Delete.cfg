\* GREEN: the article and its chunks can be deleted. A chunk delete, honest or
\* forged, waits while the article here is live or has not arrived, and merges
\* once the article's delete is here. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CheckEntry0 = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = TRUE
  DeleteRule = "wait"
INVARIANT TypeOK
INVARIANT INV_ReadsMatchText
INVARIANT INV_SettledPeersAgree
INVARIANT INV_NoForgedChunk
INVARIANT INV_ChunksNeverChange
INVARIANT INV_ListedChunksStay
INVARIANT INV_DeletesNotLost
CHECK_DEADLOCK FALSE
