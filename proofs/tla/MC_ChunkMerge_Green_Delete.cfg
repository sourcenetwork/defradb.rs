\* GREEN: the article and its chunks can be deleted. A chunk delete, honest or
\* forged, merges only after its chunk's first block, waits while the article
\* here has not arrived or is live and uses the chunk, and merges otherwise. A
\* text that uses a deleted chunk again makes it again. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = TRUE
  DeleteRule = "text"
  GenesisFirst = TRUE
  Regenerate = TRUE
  Rebuild = TRUE
  SameIds = TRUE
INVARIANT TypeOK
INVARIANT INV_ReadsMatchText
INVARIANT INV_SettledPeersAgree
INVARIANT INV_NoForgedChunk
INVARIANT INV_ChunksNeverChange
INVARIANT INV_ListedChunksStay
INVARIANT INV_DeletesNotLost
INVARIANT INV_TextChunksStored
INVARIANT INV_SettledListsAgree
INVARIANT INV_EachChunkOnce
CHECK_DEADLOCK FALSE
