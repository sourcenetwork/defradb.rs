\* RED: the bug plants a merge that holds back a chunk delete only while the
\* live article's text uses the chunk. A peer deletes a chunk the text does not
\* use yet, a later edit uses it again, and readers miss it (INV_UsedChunksStay).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = TRUE
  DeleteRule = "used"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = TRUE
  Encrypt = FALSE
  Ship = TRUE
INVARIANT INV_UsedChunksStay
CHECK_DEADLOCK FALSE
