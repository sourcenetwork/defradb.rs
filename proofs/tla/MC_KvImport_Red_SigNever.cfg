\* Bug: the restore refuses a block whose signature block is missing, as a
\* peer merge does, so a signing Go node's snapshot imports nothing and a
\* finished run has left a, which it carries whole, unmerged. Fails
\* INV_Complete.
SPECIFICATION Spec
CONSTANTS
  Filtered = {"a"}
  MaxRuns = 2
  StoreMode = "Before"
  GenesisMode = "Check"
  WriteMode = "Join"
  JudgeMode = "Restore"
  ReportMode = "Report"
  SigMode = "Never"
  EncMode = "Check"
INVARIANTS INV_MergedHasBlocks INV_NoDocWithoutFirst INV_NoLostLiveWrite INV_NoUnsignedPush INV_NoUnreadableStored INV_Complete
CHECK_DEADLOCK FALSE
