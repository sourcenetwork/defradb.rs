\* RED: the walk's put of the record never conflicts, as if the record were written
\* blind. A drain moves the entry after the walk read the record and before it
\* commits; the walk removes the old entry, not the drain's, and the drain's stays
\* behind with no record naming it (INV_NoOrphanEntry).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "On"
  WalkRecord = "Delete"
  WalkCheck = "None"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
INVARIANT INV_NoOrphanEntry
CHECK_DEADLOCK FALSE
