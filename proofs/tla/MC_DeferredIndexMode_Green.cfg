\* GREEN: two documents, starts that keep the index either way, writes and drains
\* between them, and crashes anywhere, a rebuild's pages included. The check at open
\* looks both ways, an inline index's rebuild removes its records and log, and
\* progress saved under the other way starts over. Every open node's index is what
\* its way accounts for, after an upgrade from an inline store too.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  MaxValue = 2
  MaxRestarts = 3
  StartModes = {"Inline", "Deferred"}
  Check = "Both"
  ClearRecords = "On"
  ProgressReset = "On"
INVARIANT INV_TypeOK INV_OpenMatchesMode
CHECK_DEADLOCK FALSE
