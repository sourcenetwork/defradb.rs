\* RED: the delete removes the document's access-control object, as the node
\* did before this fix. The history it keeps then reads as public, and the
\* foreign actor reads it. Must fail INV_NoUnintendedRead.
SPECIFICATION Spec
CONSTANTS
  KeepOnDelete   = FALSE
  ReleaseOnPurge = TRUE
  FenceRecreate  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoUnintendedRead
