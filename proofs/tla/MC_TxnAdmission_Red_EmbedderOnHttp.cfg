\* RED: embedder mode leaks into the HTTP registry, for example by becoming
\* the default. Bob sends a request naming a transaction alice began over
\* HTTP and reaches it. Must fail INV_HttpOwnerOnly.
SPECIFICATION Spec
CONSTANTS
  EmbedderMode  = TRUE
  IdentityKey   = FALSE
  ActsAsRequest = TRUE
INVARIANT INV_HttpOwnerOnly
CHECK_DEADLOCK FALSE
