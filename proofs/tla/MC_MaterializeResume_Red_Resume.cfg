\* RED: a materialization resumes the cursor of a settlement that stopped
\* after its first page. It starts after the first document, which the
\* settlement walked without saving it at the active version, so it reports
\* done with that document still at the older version:
\* INV_MaterializedAll fails.
SPECIFICATION Spec
CONSTANTS
  N = 3
  Resume = TRUE
INVARIANT TypeOK INV_MaterializedAll
CHECK_DEADLOCK FALSE
