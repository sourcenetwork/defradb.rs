\* run-all: OwnerTransfer.tla GREEN
\* every committed change is decided: applied, or refused and kept, while the deployment comes back
\* GREEN: liveness, with the transfer in the create's transaction and
\* without crashes, aborts or lapsed credentials, which the safety runs
\* cover (a lapsed credential's renewal is AcpOutbox.tla's LIVE_Drains). The
\* deployment comes back, the registration settles, the drainer takes its
\* turns: the grant, the transfer and the later grant each end applied, or
\* refused and kept.
SPECIFICATION SpecLive
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = TRUE
  CommitConflict = TRUE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {}
  MaxFails       = 2
  MaxCrashes     = 0
  MaxLapses      = 0
  MaxAborts      = 0
  OwnTransfer    = FALSE
PROPERTY LIVE_Decided
CHECK_DEADLOCK FALSE
