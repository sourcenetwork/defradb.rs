\* RED: a merge that stores the document off the active version across the
\* lens owes nothing (the merge path before this change). Its entry holds the
\* raw value while reads see the migrated one: INV_IndexMatchesReads fails.
SPECIFICATION Spec
CONSTANTS
  Gate = "owed"
  OweOnSchemaChange = TRUE
  OweOnMerge = FALSE
  SkipIfOwed = FALSE
  ClearChecksToken = TRUE
  MaxSteps = 6
INVARIANT TypeOK INV_IndexMatchesReads INV_SettledIndexAnswers
CHECK_DEADLOCK FALSE
