\* run-all: TruncateUnderWriters.tla RED
\* writers do not check the marker they read at commit (INV_NoWriteAfterMark)
\* RED: a writer reads the marker absent, the mark commits, and the writer
\* commits anyway because nothing checks that read. Its update lands on a
\* document already marked deleted, and could still refuse the purge
\* (INV_NoWriteAfterMark).
SPECIFICATION Spec
CONSTANTS
  Docs = {"d1", "d2"}
  Writers = {"w1", "w2"}
  MaxCommits = 3
  MaxAttempts = 2
  Enforced = {"mark", "split", "markall"}
INVARIANT INV_NoWriteAfterMark
CHECK_DEADLOCK FALSE
