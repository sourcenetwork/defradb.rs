\* FINDING, no planted bug: the receiver GREEN with one global fetch permit,
\* as many as advisory pull fetches can hold. Pull fetches take permits
\* with no slot and no durable obligation, and the limiter serves whoever
\* asks while a permit is free. A pull fetch can hold the permit, or end and
\* start again before the clock looks, every time x is due, so x is never
\* dispatched. No rule of the target contract gives a due durable root the
\* permit ahead of an advisory fetch. The code's limiter has 4 global and 3
\* per-provider permits, so pulls from two providers can take them all.
\* Fails LIVE_HeadDelivered.
