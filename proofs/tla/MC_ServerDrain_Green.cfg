\* GREEN: the code as written. The server's tasks are drained edge tasks, a connection looks at closing only between requests and does look, a subscription stream ends once closing began, and the drain has a deadline. Of the three connections one may hang and one carries a subscription stream. Every invariant and the liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  Conns        = {c1, c2, c3}
  Hangs        = {c2}
  Streams      = {c3}
  Drained      = TRUE
  BetweenOnly  = TRUE
  CheckClosing = TRUE
  Deadline     = TRUE
  EndStreams   = TRUE
INVARIANT TypeOK
INVARIANT INV_NoDropBeforeDeadline
INVARIANT INV_NoNewWorkWhenClosing
INVARIANT INV_DeadlineCutsOnlyStuck
PROPERTY LIVE_ServerReturns
CHECK_DEADLOCK FALSE
