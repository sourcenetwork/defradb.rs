\* GREEN: the code as written. The server's tasks are drained edge tasks, a connection looks at closing only between requests and does look, and the drain has a deadline. One of the two connections may hang. Every invariant and the liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  Conns        = {c1, c2}
  Hangs        = {c2}
  Drained      = TRUE
  BetweenOnly  = TRUE
  CheckClosing = TRUE
  Deadline     = TRUE
INVARIANT TypeOK
INVARIANT INV_NoDropBeforeDeadline
INVARIANT INV_NoNewWorkWhenClosing
PROPERTY LIVE_ServerReturns
CHECK_DEADLOCK FALSE
