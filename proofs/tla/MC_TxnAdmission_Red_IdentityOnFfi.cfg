\* RED: the embedded node keeps the default identity mode, the code before
\* the fix for #2335. The embedding process begins a transaction with no
\* identity, then sends a request acting as alice, and is told the
\* transaction does not exist. Must fail INV_FfiReaches.
SPECIFICATION Spec
CONSTANTS
  EmbedderMode  = FALSE
  IdentityKey   = TRUE
  ActsAsRequest = TRUE
INVARIANT INV_FfiReaches
CHECK_DEADLOCK FALSE
