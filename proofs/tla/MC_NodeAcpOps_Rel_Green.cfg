\* GREEN: a relationship change races a disable. The client reads "NAC on" in
\* its write, so a disable that commits first fails that commit; the decision
\* runs again, sees NAC off, and the client hears Go's "ACP not available".
SPECIFICATION RelSpec
CONSTANTS
  Enforced = {"configured", "already", "nac", "stored", "acp", "identity", "relation", "target"}
  LiveReEnable = FALSE
  StartReEnables = FALSE
  AlreadyFirst = FALSE
  SplitScope = FALSE
  OutsideGuard = FALSE
  NoRetry = FALSE
  RelOutsideGuard = FALSE
INVARIANT RelTypeOK INV_RelNoChangeWhileOff INV_RelOffHearsGo
CHECK_DEADLOCK FALSE
