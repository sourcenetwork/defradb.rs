\* GREEN: the code as written. Two pool slots, each running two pools one
\* after another, on two CPUs, with two claims alone before a pool shares. This
\* covers every interleaving of two claims over two CPUs, alone or shared: a
\* claim of both CPUs that wins the first and loses the second and gives the
\* first back, a pool planning again after a lost claim and then sharing, a
\* share on top of a CPU held alone that keeps it held after the pool that
\* held it alone is gone, and a later pool in the same slot finding the CPUs
\* its predecessor gave back. Every invariant and the liveness property must
\* hold. Larger machines are the Lean laws' (proofs/lean/CpuLedger), which
\* hold for any number of CPUs and pools.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 2
  Edges            = {}
  Attempts         = 2
  AtomicTake       = TRUE
  RollBack         = TRUE
  InsertAfterWin   = TRUE
  ShareCounts      = TRUE
  AttemptCap       = TRUE
  KeepWhileRunning = TRUE
  ReleaseOnce      = TRUE
  RunOnHeld        = TRUE
  ReleaseAtEnd     = TRUE
INVARIANT TypeOK
INVARIANT INV_AloneTakesDisjoint
INVARIANT INV_AloneRunsAlone
INVARIANT INV_TakenAlone
INVARIANT INV_AllOrNothing
INVARIANT INV_HeldNeverFree
INVARIANT INV_CountExact
INVARIANT INV_DoneLeavesNothing
PROPERTY LIVE_StartEnds
CHECK_DEADLOCK FALSE
