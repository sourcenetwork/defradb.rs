\* The bug: the hub forwards a merged root in its terminal step only while the
\* running process remembers merging it. A restart between the merge commit
\* and the terminal step forgets that, and the re-driven root, which the
\* database answers "already merged" from durable state, is discharged with
\* no downstream marker, so INV_ForwardObligationOwned is violated.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1}
  Cols           = {}
  MaxV           = 1
  Cap            = 1
  FetchCap       = 1
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "OwedInMemory"
INVARIANT INV_TypeOK
INVARIANT INV_ForwardObligationOwned
