\* GREEN: the real code. Callers a (both permissions), b (the write's only),
\* c (none) and a caller naming no identity each ask, while one permission may
\* be revoked: no write lands without both, every refusal names Go's first,
\* and once the revoke returns, the edge checks against the new grants.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  anon = anon
  node = node
  Bug = "None"
INVARIANT TypeOK
INVARIANT INV_NoEffectWithoutPermission
INVARIANT INV_RefusalNamesGoFirst
INVARIANT INV_EdgeSeesReturnedRevoke
CHECK_DEADLOCK FALSE
