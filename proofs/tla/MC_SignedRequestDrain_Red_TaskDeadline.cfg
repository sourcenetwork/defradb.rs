\* RED: the signed task's deadline aborts its waiter and releases admission
\* even though the started worker keeps running; shutdown stops P2P and the
\* worker then commits without a marker. INV_CommittedMarked must fail.
SPECIFICATION Spec
CONSTANTS
  NoTaskDeadline = FALSE
  TransformAdmitted = TRUE
INVARIANT INV_CommittedMarked
CHECK_DEADLOCK FALSE
