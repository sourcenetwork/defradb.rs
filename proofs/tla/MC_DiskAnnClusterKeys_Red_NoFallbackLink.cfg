\* run-all: DiskAnnClusterKeys.tla RED
\* a merge trusts the cache's cluster, takes a linked node for a new one and gives it a second record
\* Plants the same bug as Red_NoFallback, a lookup that reads only the key the shared cache names, but checks only what merges write. Node a starts in the old layout and is consolidated, then linked fresh into a cluster; a search loads the cache from the first generation, which still names a's bare id key. The next link of a looks there, finds nothing, takes a for a new node and writes a second record under a fresh cluster, so a has two records and INV_OneRecord fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Ids = {a, b}
          Clusters = {c1, c2}
          MaxGen = 4
          KeepCluster = TRUE
          Fallback = FALSE
INVARIANT INV_OneRecord
