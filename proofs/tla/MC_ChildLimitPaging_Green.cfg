\* run-all: ChildLimitPaging.tla GREEN
\* unordered scans run to completion before paging
\* GREEN: a filter index scans children out of order. The guard requires the
\* scan to finish before selecting each parent's offset page.
SPECIFICATION FairSpec
CONSTANTS
  Parents = {"a", "b"}
  Children = {1, 2, 3, 4, 5, 6}
  OrderedScan = FALSE
  Offset = 1
  Limit = 1
  Guarded = TRUE
INVARIANT TypeStays
INVARIANT INV_CompletedPage
INVARIANT INV_EarlyStopOnlyWhenOrdered
PROPERTY LIVE_AllPagesComplete
CHECK_DEADLOCK FALSE
