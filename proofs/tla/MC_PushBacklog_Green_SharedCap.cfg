\* GREEN (audit F24): two dead peers and one healthy peer with three workers and
\* PerPeerCap 2. An unreachable peer may run two jobs at once, and a healthy peer
\* that timed out once may answer while another of its jobs still runs. The
\* unreachable peers together still stay within one peer's cap, so a worker always
\* remains for the rest. All bounds hold and the healthy peer's jobs leave the queue,
\* under scheduler-only fairness.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcTwoDeadPeers
  SlowPeers <- mcTwoDeadSlowPeers
  Weight <- mcTwoDeadWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcSharedCapWorkers
  PerPeerCap <- mcSharedCapPerPeerCap
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Release"
  HandleMode = "FixedWorkers"
  FairnessMode = "PerPeerCap"
  ParkMode = "ParkUnreachable"
INVARIANT INV_TypeOK
INVARIANT INV_QueueBounded
INVARIANT INV_PermitConservation
INVARIANT INV_HandlesBounded
INVARIANT INV_NoSilentLoss
INVARIANT INV_PeerLeavesAWorker
INVARIANT INV_UnreachableLeaveAWorker
PROPERTY ACT_DemoteAfterFailedProbe
PROPERTY LIVE_HealthyProgress
