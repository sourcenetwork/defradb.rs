\* Plants F1: a pushed head is covered when a record of its scope sorts at
\* or after it by (priority, CID), sibling or not. h forwards the siblings
\* ya and yb to b. Whichever b records first, the other is either
\* acknowledged as covered with nothing written, or retires the first
\* one's record. h clears its marker, and nobody owes the sibling that b's
\* record does not bring. INV_ObligationOwned fails.
SPECIFICATION Spec
CONSTANTS
  Nodes <- eNodes
  Repl <- eRepl
  Heads <- eHeads
  Author <- eAuthor
  Parent <- eParent
  Prio <- ePrio
  KeyOrder <- eKeyOrder
  Base <- eBase
  Fresh <- eFresh
  Backlogs <- eBacklogs
  Trickle <- eTrickle
  Dead <- eDead
  PullPeer <- ePullPeer
  PullAt <- ePullAt
  Storm <- eStorm
  Crashable <- eCrashable
  ConnectedAtStart <- eConnectedAtStart
  K = 1
  Permits = 1
  PeerPermits = 1
  MemCap = 3
  PeerQuota = 3
  DurCap = 3
  MaxCrash = 1
  MaxRegFail = 1
  MaxDisc = 0
  MaxCont = 0
  CoverRule = "Priority"
  MarkerMode = "Durable"
  ForwardMode = "WithMerge"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Kept"
  FanoutMode = "PerPeer"
  SlotBeforePermit = FALSE
  DispatchPath = "Direct"
  ConnMode = "Served"
INVARIANT INV_TypeOK
INVARIANT INV_Bounded
INVARIANT INV_ObligationOwned
INVARIANT INV_ReverseBorrowServed
CHECK_DEADLOCK FALSE
