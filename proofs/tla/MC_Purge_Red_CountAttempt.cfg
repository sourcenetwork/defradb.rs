\* Bug planted: the count grows on every attempt, not on the commit.
\* A sync stores a block the prune deletes, the attempt conflicts and is counted anyway: INV_Count fails.
SPECIFICATION Spec
CONSTANTS
  Prune = TRUE
  MaxActs = 1
  OwnerMode = "Checked"
  EdgeMode = "Drop"
  IndexMode = "Delete"
  CountMode = "Attempt"
  RetryMode = "Retry"
  ScanMode = "Validated"
  Branchable = FALSE
  CollectionMode = "Owner"
INVARIANTS INV_OthersIntact INV_CollectionIntact INV_Gone INV_NoStaleOwner INV_Pruned INV_Count
PROPERTY PROP_Commits
CHECK_DEADLOCK FALSE
