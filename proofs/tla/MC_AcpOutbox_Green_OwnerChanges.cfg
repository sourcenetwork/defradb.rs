\* GREEN: the design when the owner the provider names can change. The
\* document is the creator's at the start; at any time another owner may take
\* it over on the provider. A change that passed the staging check is then
\* refused at submission and parked, and a parked delete keeps denying on
\* this node. Every safety property holds: the node is never more open than
\* the committed changes intend or than the provider allows.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g", "*"}
  Actors                   = {"c", "m"}
  Auths                    = {"node", "deleg"}
  Preexisting              = TRUE
  InitTuples               = {"g", "*"}
  MaxCrashes               = 1
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = FALSE
  AssumeNoTransferWhileOwed = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWidening
INVARIANT INV_RevokedAtCommit
INVARIANT INV_RegistrationFirst
INVARIANT INV_AtMostOneEffect
INVARIANT INV_RollbackLeavesNothing
INVARIANT INV_OwedDocumentNarrow
INVARIANT INV_DenialsChecked
INVARIANT INV_RefusedChecked
INVARIANT INV_UncheckedYields
