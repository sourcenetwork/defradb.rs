\* GREEN: inside the caller's explicit transaction, with its own pending
\* writes. All three checks read the transaction view, so a pending grant,
\* revocation or block write counts. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  InTxn = TRUE
  CheckNac = TRUE
  CheckAcp = TRUE
  CheckBlock = TRUE
  NacAt = "view"
  AcpAt = "view"
  BlockAt = "view"
  MaxEnv = 2
INVARIANT TypeOK INV_VerifiedAtOnePoint INV_NoValidRejected
CHECK_DEADLOCK FALSE
