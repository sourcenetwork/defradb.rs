\* GREEN: every guard on. The frame limit allows for the topic, so the
\* edge broadcast fits; the huge one goes by direct push and lands or comes
\* back as an error; the large control message is skipped with a warning;
\* a failed stream reports what it drops. No message is lost unheard of.
SPECIFICATION Spec
CONSTANTS
  MaxMessage = 10
  TopicLen = 3
  Overhead = 2
  Size <- MCSize
  Control <- MCControl
  LimitMatched = TRUE
  Fallback = TRUE
  SkipOversize = TRUE
  ReportLoss = TRUE
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
INVARIANT INV_NoSilentLoss
INVARIANT INV_BroadcastFits
