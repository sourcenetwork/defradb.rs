\* GREEN: every guard on. Gossip's size leaves room for the topic, so every
\* broadcast it accepts fits a frame; the huge one goes by direct push to
\* every connected subscriber, near and far, and lands or comes back as an
\* error; the large control message is skipped with a warning;
\* a failed stream reports what it drops. No message is lost unheard of.
SPECIFICATION Spec
CONSTANTS
  FrameLimit = 13
  TopicLen = 3
  Overhead = 2
  Size <- MCSize
  Control <- MCControl
  LimitMatched = TRUE
  Fallback = TRUE
  PushConnected = TRUE
  SkipOversize = TRUE
  ReportLoss = TRUE
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
INVARIANT INV_NoSilentLoss
INVARIANT INV_BroadcastFits
