\* RED (F69): the sweep reads the stored deadline as it is. The wall clock
\* steps back past the longest rung, and a connected peer waits out the whole
\* step before it is swept again. INV_HeldWithinLongestRung fails.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder         <- mcLadder
  Steps          <- mcSteps
  Scopes         = {d, p}
  Poison         = {p}
  RestartOn      = {"LiveAck", "SupersededAck", "ReplayAck"}
  BoundDeadlines = FALSE
INVARIANT TypeOK
INVARIANT INV_HeldWithinLongestRung
