\* RED, a known gap (#2736): the code checks NAC ViewAdd before the
\* view's transaction opens. The permission is revoked after the check and
\* the view still commits (INV_NoViewWithoutPermission). It turns GREEN when
\* the check moves into the create transaction.
SPECIFICATION Spec
CONSTANTS
  CheckEmpty = TRUE
  CheckLens = TRUE
  StoreTransform = TRUE
  LensAt = "txn"
  NacAt = "before"
  MaxEnv = 2
INVARIANT INV_NoViewWithoutPermission
CHECK_DEADLOCK FALSE
