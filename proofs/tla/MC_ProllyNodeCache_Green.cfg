\* run-all: ProllyNodeCache.tla GREEN
\* nodes put are readable, the cache stays under budget, roots name stored nodes
\* All guards on: reads look in the pending nodes, the cache evicts and skips
\* a node too big for it, a failed write keeps its nodes pending, and a root
\* goes out only once everything is stored. Puts, flushes, reads, publishes
\* and crashes interleave in every order.
SPECIFICATION Spec
CONSTANTS
  ReadPending = TRUE
  Evict = TRUE
  SkipHuge = TRUE
  KeepOnFail = TRUE
  FlushFirst = TRUE
  RefuseAfterFail = TRUE
INVARIANT TypeOK
INVARIANT GetFinds
INVARIANT CacheBounded
INVARIANT HugeEvictsNothing
INVARIANT PublishedStored
INVARIANT BuildWhole
CHECK_DEADLOCK FALSE
