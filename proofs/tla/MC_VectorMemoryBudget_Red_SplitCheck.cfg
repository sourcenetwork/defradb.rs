\* run-all: VectorMemoryBudget.tla RED
\* the room check and the take are two steps, so two takers fit into one room
\* RED: a reload checks for room and takes it in a later step. An older reload checks, a newer one fills the budget meanwhile, and the older one then takes room that is no longer there (INV_BudgetHolds).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Searches = {s1, s2, s3}
          Limit = 2
          Codes = 3
          MaxGen = 3
          AtomicTake = FALSE
          ReleaseOnDrop = TRUE
          DropOldFirst = TRUE
          NoMissesWhileLoading = TRUE
          SingleFlight = TRUE
          OwnedFinish = TRUE
          OwnedStep = TRUE
          OwnedAbandon = TRUE
          NoPendingWhileLoading = TRUE
INVARIANT INV_BudgetHolds
INVARIANT INV_Accounted
INVARIANT INV_FullLoad
INVARIANT INV_ClaimLostOnlyToNewer
INVARIANT INV_NoTakeAfterLoss
INVARIANT INV_NoClaimClearedByStaleAbandon
SYMMETRY Symmetry
