  MapStop   = TRUE
  FlagFirst = TRUE
  StopFirst = FALSE
INVARIANT TypeOK
INVARIANT INV_AbortSaysCancelled
INVARIANT INV_StopSaysClosed
INVARIANT INV_DoneSaysValue
CHECK_DEADLOCK FALSE
