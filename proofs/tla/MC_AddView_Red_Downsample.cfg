\* run-all: AddView.tla RED
\* The downsample check is left out of the core: an invalid downsample definition still gets its views (INV_NoViewUnlessAllChecksPass)
\* RED: the core skips the downsample check, and both ways in forward to it, so
\* an invalid downsample definition is not refused and its views are created.
SPECIFICATION Spec
CONSTANTS
  Views = {"a", "b"}
  CoreChecks = {"nac", "sdl", "one", "cid", "chunk", "policy", "identity"}
  ServerChecks = {"nac", "sdl", "one", "cid", "chunk", "policy", "identity"}
  DocumentAcp = {"node", "server"}
  CreateMode = "Atomic"
  BuildFirst = FALSE
INVARIANT INV_NoViewUnlessAllChecksPass
CHECK_DEADLOCK FALSE
