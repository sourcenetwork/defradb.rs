\* run-all: TruncateUnderWriters.tla RED
\* each chunk marked just before its purge: a writer of a later chunk refuses it (INV_FirstAttemptCommits)
\* RED: a chunk is marked and purged before the next chunk is marked. While the
\* first chunk is purged a writer still updates a document of the second, and
\* its update records an owner of a block the two documents share. The purge
\* scanned that owner range validated, so its commit is refused
\* (INV_FirstAttemptCommits).
SPECIFICATION Spec
CONSTANTS
  Docs = {"d1", "d2"}
  Writers = {"w1", "w2"}
  MaxCommits = 3
  MaxAttempts = 2
  Enforced = {"mark", "split", "validated"}
INVARIANT INV_FirstAttemptCommits
CHECK_DEADLOCK FALSE
