\* RED: the ack guard reads only the hub's view of its durable records. A head the full
\* in-memory map has no entry for is registered on its durable record alone, and the view
\* learns of that record only when the store's receipt-ordered events go out, which an
\* earlier commit's hook on the same store holds back past the reply. The guard finds
\* neither an entry nor a record, and nacks a head whose record is durable: the pusher
\* keeps its retry record, and parks the hub, for a head the hub owns.
\* INV_NackImpliesUnregistered is violated at that reply.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Heads     <- mcHeads
  Parent    <- mcNoParents
  Prio      <- mcFlatPrio
  ScopeOf   <- mcOwnScope
  Cap       <- mcCap
  ReplyMode = "NackOnFull"
  CoverRule = "Parent"
  GuardMode = "View"
INVARIANT INV_TypeOK
INVARIANT INV_SuccessImpliesRegisteredOrMerged
INVARIANT INV_NackImpliesUnregistered
