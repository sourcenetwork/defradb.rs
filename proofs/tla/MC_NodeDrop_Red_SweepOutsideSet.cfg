\* RED: the sweep sits in a slot of its own, as the old txn_cleanup_task
\* did. Shutdown stops it, but a drop without shutdown leaves it running: it
\* holds the transaction registry, the registry the database, the database
\* the pool, so the pool's threads and the store's files never go away.
\* Must fail LIVE_DroppedNodeReleasesPool.
SPECIFICATION Spec
CONSTANTS
  SweepInSet  = FALSE
  AbortOnDrop = TRUE
  DropAwaits  = FALSE
PROPERTY LIVE_DroppedNodeReleasesPool
CHECK_DEADLOCK FALSE
