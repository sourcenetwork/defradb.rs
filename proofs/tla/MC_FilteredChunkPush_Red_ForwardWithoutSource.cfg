\* RED: the bug plants a decision that lets a chunk through when its article's
\* document is not at hand. The sender forwards a chunk that arrived before
\* its article, and the chunk of a refused article reaches the receiver
\* (INV_NothingUnmatched).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  StaleMarkers = {a1, a2}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = FALSE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
