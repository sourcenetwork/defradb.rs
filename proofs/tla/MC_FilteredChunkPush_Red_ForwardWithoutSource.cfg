\* RED: the bug plants a decision that lets a chunk through when its
\* article's document is not at hand. A node forwards a chunk that arrived
\* before its article, and the chunk of a refused article reaches the
\* receiver (INV_NoChunkOfUnmatchedArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = FALSE
  TxnCarriesArticle = TRUE
  KeepWaiting = TRUE
INVARIANT INV_NoChunkOfUnmatchedArticle
CHECK_DEADLOCK FALSE
