\* run-all: FilteredChunkPush.tla RED
\* a chunk with no article document is sent (INV_NothingUnmatched)
\* RED: the bug plants a chunk push that goes when no article document is at
\* hand, as for a chunk forwarded from another node. The unmatched article's
\* chunk reaches the receiver (INV_NothingUnmatched).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  NewMatches = {a1}
  Unreadable = {}
  StaleMarkers = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = FALSE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = TRUE
  ReplayNeedsArticle = TRUE
  ReplayDefersChunk = TRUE
  ReplayChunksOnRefilter = TRUE
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
