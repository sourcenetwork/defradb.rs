\* Bug: the heads are merged before their blocks are stored, so for a
\* moment (or, after a crash, for good) the node has merged versions it holds
\* no block for. Fails INV_MergedHasBlocks.
SPECIFICATION Spec
CONSTANTS
  Filtered = {"a"}
  MaxRuns = 2
  SnapMode = "Shallow"
  StoreMode = "After"
  GenesisMode = "Check"
  WriteMode = "Join"
  JudgeMode = "Restore"
  ReportMode = "Report"
INVARIANTS INV_MergedHasBlocks INV_NoDocWithoutFirst INV_NoLostLiveWrite INV_Complete
CHECK_DEADLOCK FALSE
