\* filter run on the chunk drops every chunk (INV_ChunksFollowParent)
\* RED: the bug plants the filter run on the chunk collection. A chunk has
\* none of the article's fields, so no chunk is ever pushed, and the peer
\* holds the matching article without its chunks (INV_ChunksFollowParent).
SPECIFICATION Spec
CONSTANTS
  Articles = {pub, priv}
  Matching = {pub}
  ChunkRule = "own"
  SyncRule = "current"
INVARIANT INV_ChunksFollowParent
CHECK_DEADLOCK FALSE
