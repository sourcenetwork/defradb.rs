\* RED: the core skips the NAC check, as an edge that relied on its own check
\* would once that check moved. Caller b, who lacks the permission, gets its
\* write into the store (INV_NoEffectWithoutPermission).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  t1 = t1
  Callers = {a, b}
  Allowed = {a}
  Txns    = {t1}
  Bug     = "NoNac"
INVARIANT TypeOK
INVARIANT INV_NoEffectWithoutPermission
CHECK_DEADLOCK FALSE
