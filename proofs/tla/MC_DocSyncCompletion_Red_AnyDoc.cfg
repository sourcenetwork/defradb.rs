\* run-all: DocSyncCompletion.tla RED
\* RED: the fix without its filter. A report for a document the sync did not ask for joins the set, so the set reaches the number of asked documents with one of them still missing, and the sync says it is complete (INV_CompleteMeansEveryDocMerged).
SPECIFICATION Spec
CONSTANTS
  Docs         = {d1, d2, d3}
  Peers        = {p1}
  MaxReports   = 4
  CountReports = FALSE
  FilterAsked  = FALSE
  HeldDocs     = {}
  ReportHeld   = TRUE
INVARIANT TypeOK
INVARIANT INV_CompleteMeansEveryDocMerged
INVARIANT INV_DoneOnceEveryDocReported
CHECK_DEADLOCK FALSE
