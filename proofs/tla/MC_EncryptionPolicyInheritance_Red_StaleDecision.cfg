\* run-all: EncryptionPolicyInheritance.tla RED
\* the builder keeps the stale prepared headless decision after a merge changed an earlier write (INV_SeesRequestWrites)
\* RED: the builder keeps the preparation's headless decision, as before the
\* re-prepare (#3273's review). One request updates f1, plaintext, then the
\* headless f2: f2 is prepared plaintext because f1 is. A remote encrypted
\* head reaches f1 before the build, f1 is written encrypted (rule (b)), and
\* f2 is written in plaintext on a document whose every field is now
\* encrypted (INV_SeesRequestWrites).
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 2
  MaxReqWrites = 2
  MaxMerges = 1
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  KeepPrepared = TRUE
  ReprepareStale = TRUE
  UsePending = TRUE
  TornSnapshot = FALSE
  IgnoreConfig = FALSE
INVARIANT INV_SeesRequestWrites
CHECK_DEADLOCK FALSE
