\* run-all: ChunkCleanup.tla RED
\* a remake reuses the deleted ID (INV_NoResurrect)
\* RED: the bug plants one fixed ID per chunk. A revert makes a deleted chunk
\* again under its old ID, so the deleted document comes back to life
\* (INV_NoResurrect).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CleanWrites = TRUE
  CleanMerges = TRUE
  DropStale = TRUE
  DeleteGuard = TRUE
  Ids = "none"
  Reanchor = TRUE
  KeepWaiting = TRUE
INVARIANT INV_NoResurrect
CHECK_DEADLOCK FALSE
