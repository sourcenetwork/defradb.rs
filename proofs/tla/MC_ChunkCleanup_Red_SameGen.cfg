\* RED: the bug plants a revert that makes a deleted chunk again under its old
\* ID. The deleted document comes back to life, and a peer that later merges
\* its delete takes it away again (INV_NoResurrect).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CleanWrites = TRUE
  CleanMerges = TRUE
  DropStale = TRUE
  DeleteGuard = TRUE
  NextGen = FALSE
INVARIANT INV_NoResurrect
CHECK_DEADLOCK FALSE
