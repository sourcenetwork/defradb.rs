\* run-all: BackupImportWritePath.tla RED
\* the FFI import writes through another edge's path (INV_HostFromEdge)
\* RED: the FFI import writes through the Node's path instead of its
\* DocumentCall. Its documents run on a path that is not the FFI's. Must fail
\* INV_HostFromEdge.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = FALSE
  KeepCaller          = TRUE
  HoldImport          = TRUE
  DetachedImport      = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  OneByOneOnRefusal   = TRUE
  RegisterEachOnRefusal = TRUE
  RequireNode         = TRUE
  ImportRouteOnEdge   = TRUE
INVARIANT INV_HostFromEdge
CHECK_DEADLOCK FALSE
