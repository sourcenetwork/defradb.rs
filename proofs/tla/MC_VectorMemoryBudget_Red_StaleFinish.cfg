\* run-all: VectorMemoryBudget.tla RED
\* a reload taken over still publishes, wiping the newer reload's claim
\* RED: a reload that a newer one took over still publishes its older codes, which wipes the claim of the newer reload still running, so its work is thrown away for an older generation's (INV_ClaimLostOnlyToNewer).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Searches = {s1, s2, s3}
          Limit = 2
          Codes = 3
          MaxGen = 3
          AtomicTake = TRUE
          ReleaseOnDrop = TRUE
          DropOldFirst = TRUE
          NoMissesWhileLoading = TRUE
          SingleFlight = TRUE
          OwnedFinish = FALSE
          OwnedStep = TRUE
          OwnedAbandon = TRUE
          NoPendingWhileLoading = TRUE
INVARIANT INV_BudgetHolds
INVARIANT INV_Accounted
INVARIANT INV_FullLoad
INVARIANT INV_ClaimLostOnlyToNewer
INVARIANT INV_NoTakeAfterLoss
INVARIANT INV_NoClaimClearedByStaleAbandon
SYMMETRY Symmetry
