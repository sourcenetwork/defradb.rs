\* RED: a contender acts as soon as it proposes, without waiting for a certificate. Both contenders act on the slot (INV_OneActs).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Honest <- mcHonest
  Cheaters <- mcCheaters
  Contenders <- mcContenders
  Quorum = 3
  VoteOnce = TRUE
  ActOnCert = FALSE
  AbstainOnRestore = TRUE
  Restores = FALSE
INVARIANT TypeOK
INVARIANT INV_OneActs
