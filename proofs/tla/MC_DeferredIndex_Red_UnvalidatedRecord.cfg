\* RED: a drain reads the position record without validating it. Two drains read
\* the same record, each moves the entry from it to the value it saw, and the second
\* leaves the first one's entry behind (INV_RecordMatchesIndex).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a, b}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Unvalidated"
  Truncate = "Planned"
INVARIANT INV_RecordMatchesIndex
CHECK_DEADLOCK FALSE
