\* Node::subscribe: a counted drop wakes nobody (EventuallyObserved)
\* RED: the raw bus as Node::subscribe uses it: a drop is counted but wakes
\* nobody. The reader drained the queue and read the counter just before the
\* count landed, and waits for a notice that never comes (EventuallyObserved).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Updates = {u1, u2}
  Merged = {u2}
  Cap = 1
  MaxCrashes = 1
  Hideable = {}
  Channel = "closing"
  Mode = "counter_no_wake"
INVARIANT TypeOK
PROPERTY EventuallyObserved
