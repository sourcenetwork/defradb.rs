\* run-all: LiveMarkerGeneration.tla RED
\* an ack clears whatever marker holds the scope: an older head clears a newer head's marker (INV_LiveOwed)
\* RED: a live acknowledgement clears whatever marker holds the scope, not only its own. Writer 1 commits head 1 and writes its marker; its push lands while head 1 is the frontier. Writer 2 then commits head 2 and writes a newer marker. Writer 1's unfenced ack clears it, and writer 2's push is lost. Head 2 is neither delivered nor marked (INV_LiveOwed).
SPECIFICATION Spec
CONSTANT LiveMode = "covered"
CONSTANT Fence = FALSE
CONSTANT HeadFence = TRUE
INVARIANTS INV_NoFalseFailure INV_LiveOwed
CHECK_DEADLOCK FALSE
