\* Bug: a live acknowledgement clears whatever marker holds the scope, not only its own. The writer with the older head allocates the newer generation and writes its marker; the writer with the newer head, superseded, reruns and writes a newer marker still; the first writer's push lands and its unfenced ack clears that newer marker; the second writer's push is lost. The newer head is neither delivered nor marked (INV_LiveOwed).
SPECIFICATION Spec
CONSTANT LiveMode = "rerun"
CONSTANT Fence = FALSE
CONSTANT HeadFence = TRUE
CONSTANT MaxReruns = 2
INVARIANTS INV_NoFalseFailure INV_LiveOwed
CHECK_DEADLOCK FALSE
