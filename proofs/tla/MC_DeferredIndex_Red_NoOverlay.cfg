\* RED: a read trusts the stored entries alone. After an increment and before a
\* drain, the entry still says the old value, so the read finds the document under
\* a value it no longer has (INV_ReadExact).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a, b}
  MaxSteps = 3
  Overlay = "Off"
  OwnAppends = "On"
  RecordRead = "Validated"
  Truncate = "Planned"
INVARIANT INV_ReadExact
CHECK_DEADLOCK FALSE
