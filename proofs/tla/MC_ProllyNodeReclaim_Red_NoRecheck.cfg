\* This bug plants a stale mark set: the delete transaction does not mark the
\* roots again. A root published after the page scan can name a node the sweep
\* still deletes, which violates SweepKeepsLiveRoots.
SPECIFICATION Spec
CONSTANTS
  RecheckRoots = FALSE
  OnlyDeleteUnmarked = TRUE
INVARIANT TypeHolds
INVARIANT SweepKeepsLiveRoots
CHECK_DEADLOCK FALSE
