\* GREEN: budgets at least the burst. A refused announcement becomes a durable
\* pending record and the sweep promotes it into a free slot. Every heard
\* announcement stays owned across a crash, none is dropped, all merge.
SPECIFICATION FairSpec
CONSTANTS
  Docs <- mcDocs
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  MemCap = 1
  MaxCrashes = 1
  PeerCap = 3
  TotalCap = 3
  Mode = "Durable"
  Promote = TRUE
CHECK_DEADLOCK TRUE
INVARIANT INV_TypeOK
INVARIANT INV_HeardIsOwned
INVARIANT INV_NothingDropped
PROPERTY LIVE_AllMerged
