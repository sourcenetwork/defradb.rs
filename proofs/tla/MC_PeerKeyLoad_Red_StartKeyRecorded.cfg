\* RED: a start key records its identity in the store as a keyring does, as
\* the FFI's keyring mapping did. A start with a start key marks the store;
\* the next plain start is refused because the store now demands a keyring
\* (PeerKeyringRequired). Must fail INV_StartKeyLeavesNoMark.
SPECIFICATION Spec
CONSTANTS
  Keys                = {k1, k2}
  None                = none
  MaxStarts           = 4
  StartKeyUnchecked   = TRUE
  StartKeyNotRecorded = FALSE
INVARIANT INV_StartKeyLeavesNoMark
CHECK_DEADLOCK FALSE
