\* RED: no direct push. A publish over the budget is handed to gossip, which
\* drops it and tells nobody: the huge update never reaches the peer and its
\* publisher thinks it went out. Expect INV_NoSilentLoss to be violated.
SPECIFICATION Spec
CONSTANTS
  MaxMessage = 10
  TopicLen = 3
  Overhead = 2
  Size <- MCSize
  Control <- MCControl
  LimitMatched = TRUE
  Fallback = FALSE
  SkipOversize = TRUE
  ReportLoss = TRUE
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
INVARIANT INV_NoSilentLoss
INVARIANT INV_BroadcastFits
