\* PeerConnected is sent before the pump is registered: an adopt dropped while that send
\* waits leaves the connection counted and cached with no pump to release it.
SPECIFICATION Spec
CONSTANTS
  AdoptRpcDial = TRUE
  Announcer = "adopt-first"
  CleanupRefusedPump = TRUE
  HitSkipsAdoption = TRUE
  NarrowRefusal = TRUE
  RestoreSibling = TRUE
  CloseRetained = TRUE
INVARIANTS
  Released
CHECK_DEADLOCK FALSE
