\* Plants F9: the clock hands fetches out through the merge loop's channel
\* and only when it has room right now. Catch-up traffic keeps the channel
\* full with blocked senders that always get the room first, so the clock
\* never dispatches x. LIVE_HeadDelivered fails.
SPECIFICATION Spec
CONSTANTS
  Nodes <- rNodes
  Repl <- rRepl
  Heads <- rHeads
  Author <- rAuthor
  Parent <- rParent
  Prio <- rPrio
  KeyOrder <- rKeyOrder
  Base <- rBase
  Fresh <- rFresh
  Backlogs <- rBacklogs
  Trickle <- rTrickle
  Dead <- rDead
  PullPeer <- rPullPeer
  PullAt <- rPullAt
  Storm <- rStorm
  Crashable <- rCrashable
  ConnectedAtStart <- rConnectedAtStart
  K = 1
  Permits = 2
  PeerPermits = 1
  MemCap = 2
  PeerQuota = 1
  DurCap = 3
  MaxCrash = 0
  MaxRegFail = 0
  MaxDisc = 1
  MaxCont = 2
  CoverRule = "Ancestry"
  ShutdownOrder = "DrainFirst"
  ForwardMode = "BeforeMark"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Kept"
  FanoutMode = "PerPeer"
  SlotBeforePermit = FALSE
  DispatchPath = "MergeFifo"
  ConnMode = "Served"
INVARIANT INV_TypeOK
INVARIANT INV_Bounded
INVARIANT INV_ObligationOwned
INVARIANT INV_ReverseBorrowServed
PROPERTY LIVE_HeadDelivered
CHECK_DEADLOCK FALSE
