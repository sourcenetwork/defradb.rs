\* run-all: MC_EmbedderStream_Common.tla RED
\* a returned handler and a cancel share code 7, so a finish after the deadline cancel reads as delivered (INV_CancelFailsFinish)
\* RED: a returned handler and a cancel both stop the stream with code 7, and the
\* opener's finish holds on 7 (the code before #3415's fix). s1's handler hangs until
\* its deadline cancels the stream; its opener finishes afterwards, and the finish
\* reads as success though nothing took the data.
\* Expect INV_CancelFailsFinish to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  Registered <- mcRegistered
  Stuck <- mcStuck
  Share = 1
  TagMode = "Check"
  LeaseMode = "WithRequest"
  DeadlineMode = "Deadline"
  RevokeMode = "Close"
  ShutdownMode = "Abort"
  Unread <- mcUnread
  DropMode = "Signal"
  FinishMode = "AnyCancel"
INVARIANT INV_TypeOK
INVARIANT INV_CancelFailsFinish
