\* run-all: BackupImportWritePath.tla RED
\* the HTTP adapter ignores the handler's host (INV_HostFromEdge)
\* RED: the defradb start adapter writes through a host of its own over its
\* runner instead of the handler's. Its documents skip the HTTP request path.
\* Must fail INV_HostFromEdge.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  HoldImport          = TRUE
  DetachedImport      = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = FALSE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  OneByOneOnRefusal   = TRUE
  RegisterEachOnRefusal = TRUE
  RequireNode         = TRUE
  ImportRouteOnEdge   = TRUE
INVARIANT INV_HostFromEdge
CHECK_DEADLOCK FALSE
