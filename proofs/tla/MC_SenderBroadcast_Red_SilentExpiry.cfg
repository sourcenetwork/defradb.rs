\* RED: the write waits, but when a deadline passes its announcement is
\* dropped without the node event, so the application cannot tell that the
\* write needs a resync.
\* Expect INV_CommittedIsOwnedOrReported to be violated.
SPECIFICATION Spec
CONSTANTS
  Writes <- mcWrites
  Room = 2
  Slots = 1
  Shed = FALSE
  ReportExpiry = FALSE
  SlotAfterWindow = TRUE
  BoundRoom = TRUE
CHECK_DEADLOCK TRUE
INVARIANT TypeOK
INVARIANT INV_CommittedIsOwnedOrReported
