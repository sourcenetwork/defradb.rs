\* GREEN (F1 fix): a hub offers two sibling heads of one document to a peer. The newer
\* sibling still retires the queued older one from the live queue, but its ack clears the
\* marker only when it is the document's whole frontier. With a sibling beside it the
\* marker stays set and the retry ladder sends both, so a clear marker never hides an
\* undelivered head. That sibling's ack is not reported, so the frontier the ladder
\* records as acked stands.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  MaxHead <- mcMaxHead
  Parent <- mcSiblings
  QueueMode = "LatestOnly"
  RetryMode = "CurrentOnly"
  CompleteRule = "Frontier"
INVARIANT INV_TypeOK
INVARIANT INV_OneLiveHead
INVARIANT INV_NoStaleRetry
INVARIANT INV_NewestRetained
INVARIANT INV_ClearedScopeDelivered
INVARIANT INV_AckRecordCurrent
