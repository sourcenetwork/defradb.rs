\* run-all: ChunkFollow.tla GREEN
\* chunks with vectors: the merge deletes unused ones, a sync brings the rest
\* GREEN: the chunks carry vectors, so the peer's merge of an edit makes none
\* of them: a document sync brings the chunks of the current text, and the
\* merge deletes the ones the text stopped using. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Articles = {pub, priv}
  Matching = {pub}
  ChunkRule = "parent"
  SyncRule = "current"
  DeletesFollow = TRUE
  Reconcile = TRUE
  Cascade = TRUE
  Embedded = TRUE
  KeepWaiting = TRUE
INVARIANT TypeOK
INVARIANT INV_ChunksFollowParent
INVARIANT INV_NoForeignChunks
INVARIANT INV_DeletesFollowParent
INVARIANT INV_SyncSendsCurrentChunks
INVARIANT INV_DroppedChunksGo
CHECK_DEADLOCK FALSE
