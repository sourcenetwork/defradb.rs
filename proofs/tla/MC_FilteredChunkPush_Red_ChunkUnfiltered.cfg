\* RED: the bug plants a chunk collection that does not count as filtered.
\* Every chunk is pushed as if no filter applied, so a chunk of the article
\* the filter refuses reaches the receiver (INV_NoChunkOfUnmatchedArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = FALSE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  KeepWaiting = TRUE
INVARIANT INV_NoChunkOfUnmatchedArticle
CHECK_DEADLOCK FALSE
