\* run-all: FilteredChunkPush.tla RED
\* an unmatched article's chunk is sent (INV_NothingUnmatched)
\* RED: the bug plants a chunk collection that does not count as filtered, as a
\* record with no chunk sources. Every chunk goes, so the receiver holds a chunk
\* of the article the filter does not match (INV_NothingUnmatched).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  NewMatches = {a1}
  Unreadable = {}
  StaleMarkers = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = FALSE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = TRUE
  ReplayNeedsArticle = TRUE
  ReplayDefersChunk = TRUE
  ReplayChunksOnRefilter = TRUE
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
