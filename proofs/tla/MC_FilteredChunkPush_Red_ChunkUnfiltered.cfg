\* RED: the bug plants a chunk collection that does not count as filtered. The
\* chunk of the article the filter refuses is pushed as if no filter applied
\* (INV_NothingUnmatched).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  StaleMarkers = {a1, a2}
  ShipChunks = TRUE
  MarkChunksFiltered = FALSE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  ReplayAddsParent = TRUE
  ReplayNeedsArticle = TRUE
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
