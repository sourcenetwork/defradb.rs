\* RED: report does not close the connection on a fatal error, and dispatch
\* does not close it after a cancel request. The loop reads on after a wrong
\* token. Must fail INV_NothingAfterEnd.
SPECIFICATION Spec
CONSTANTS
  Limit              = 2
  MaxTime            = 3
  MaxMsgs            = 3
  PreMsgs            = {"did"}
  PostMsgs           = {"pwBad", "query"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = FALSE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingAfterEnd
CHECK_DEADLOCK FALSE
