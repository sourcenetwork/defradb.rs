\* run-all: EmbeddedVeraSwitch.tla RED
\* a stop that gave up leaves a node running for good (LIVE_NoNodeAfterStop)
\* RED: a stop that reaches its deadline leaves nothing behind. A read call
\* holds the slot past the stop's deadline; the stop returns, the call lets
\* go, and nobody ever stops the node in the slot. Fails
\* LIVE_NoNodeAfterStop.
SPECIFICATION Spec
CONSTANTS
  EvictWatch     = TRUE
  AskWithdraws   = TRUE
  AbortOnStop    = TRUE
  SwitchDeadline = TRUE
  ClearsHalted   = TRUE
  RecordsTarget  = TRUE
  Restarts       = TRUE
  LinkShuts      = TRUE
  Reaps          = FALSE
  WaitsRelease   = TRUE
INVARIANT TypeOK
INVARIANT INV_ClosedAfterStop
INVARIANT INV_NoStartAfterStop
INVARIANT INV_SlotRuns
INVARIANT INV_StoppedMeansEnded
INVARIANT INV_DeviceNamesNode
PROPERTY LIVE_NoNodeAfterStop
PROPERTY LIVE_DropStops
PROPERTY LIVE_SwitchEnds
PROPERTY LIVE_WatchWakes
PROPERTY LIVE_StopReturns
PROPERTY LIVE_Recovers
CHECK_DEADLOCK FALSE
