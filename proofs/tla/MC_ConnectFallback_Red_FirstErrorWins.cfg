\* RED: in the race, the first attempt to fail is the answer, and the other,
\* still running, is dropped: the connect fails although the other family
\* might have connected. Must fail INV_ErrorOnlyWhenAllFail.
SPECIFICATION Spec
CONSTANTS
  D              = 1
  CT             = 3
  MaxTime        = 3
  HasFallback    = TRUE
  MayHang        = TRUE
  Limited        = TRUE
  DelayFallback  = TRUE
  StartOnFailure = TRUE
  AwaitOther     = FALSE
  KeepLastError  = TRUE
  DropLosers     = TRUE
  TimeoutAll     = TRUE
INVARIANT TypeOK
INVARIANT INV_ErrorOnlyWhenAllFail
CHECK_DEADLOCK FALSE
