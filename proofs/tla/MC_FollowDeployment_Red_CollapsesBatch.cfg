\* run-all: FollowDeployment.tla RED
\* only the first change of an object handed back together is owed: the revocation after it is lost (INV_RevocationDenies)
\* RED: of the changes of one object handed back together only the first is owed:
\* the later ones look as if a later change were owed already. The grant and
\* the revocation are both lost; only the grant is owed again, and settles.
\* Must fail INV_RevocationDenies.
SPECIFICATION Spec
CONSTANTS
  Keep         = 2
  MaxTakeovers = 2
  Gate         = TRUE
  CacheByTerm  = TRUE
  Restage      = TRUE
  Taint        = TRUE
  CheckWindow  = TRUE
  MaxCrashes   = 1
  GateDelivery = TRUE
  Mark         = TRUE
  KeepBatch = FALSE
INVARIANT TypeOK
INVARIANT INV_RevocationDenies
