\* a settlement resumes a write-back record without writing back (INV_RebuiltAll)
\* RED: a settlement walks a rebuild's record without writing values back. The
\* rebuild stopped after its first page, the settlement walks the second
\* document fixing only its index, and the rebuild, started again, resumes
\* its own record after it: it reports done with the second document still
\* at its source value, so INV_RebuiltAll fails.
SPECIFICATION Spec
CONSTANTS
  N = 3
  ResumeRestamp = FALSE
  ResumeAnyMode = FALSE
  SettleIgnoresMode = TRUE
INVARIANT TypeOK INV_RebuiltAll
CHECK_DEADLOCK FALSE
