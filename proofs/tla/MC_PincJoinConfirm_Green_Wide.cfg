\* run-all: PincJoinConfirm.tla GREEN
\* GREEN, wider: three subscribe attempts, two unsubscribes and two holds,
\* so a hold can come back after an unsubscribe ended it and a third retry
\* follows two failures. Same promises as Green.
SPECIFICATION Spec
CONSTANTS
  Calls            = {c1, c2, c3}
  MaxUnsub         = 2
  MaxHold          = 2
  MaxLost          = 1
  ConfirmCheck     = TRUE
  StillJoined      = TRUE
  Recheck          = TRUE
  Rollback         = TRUE
  ClearOnLeave     = TRUE
  HubTagsLists     = TRUE
  RejoinAfterDrain = TRUE
INVARIANT TypeOK
INVARIANT INV_OkOnlyWhenHeld INV_FailOnlyUnconfirmed INV_NoMissedWake INV_NoStuckSubscription INV_JoinedMatches
CHECK_DEADLOCK FALSE
