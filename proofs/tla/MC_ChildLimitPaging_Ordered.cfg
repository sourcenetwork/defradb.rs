\* run-all: ChildLimitPaging.tla GREEN
\* ordered scans can stop at offset plus limit
\* GREEN: an index supplies the requested order, so each parent may stop
\* once it has found offset plus limit matches.
SPECIFICATION FairSpec
CONSTANTS
  Parents = {"a", "b"}
  Children = {1, 2, 3, 4, 5, 6}
  OrderedScan = TRUE
  Offset = 1
  Limit = 1
  Guarded = TRUE
INVARIANT TypeStays
INVARIANT INV_CompletedPage
INVARIANT INV_EarlyStopOnlyWhenOrdered
PROPERTY LIVE_AllPagesComplete
CHECK_DEADLOCK FALSE
