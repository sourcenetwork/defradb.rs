\* RED (the old rule): a PushLog or peer-connect handler that completes
\* another root's DAG waits for room in the merge loop's full channel to
\* report it, while it holds its admission lane slot and the CID guard.
\* INV_AdmissionNeverWaitsOnMergeLoop fails.
SPECIFICATION WSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1}
  Cols           = {}
  MaxV           = 1
  Cap            = 1
  FetchCap       = 1
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MaxAttempts    = 3
  AttemptMode    = "PerAttempt"
  RearmMode      = "AttemptEnd"
  ExpiryMode     = "AckRetained"
  Dead           = {}
  Trickle        = {}
  CutoffMode     = "Quantum"
  SharedPeer     = {}
  PeerPermits    = 1
  MaxPulls       = 0
  PermitMode     = "WithSlot"
  DispatchPath   = "OwnLane"
  HandlerSend    = "Blocking"
  Storm          = TRUE
  FifoCap        = 1
INVARIANT INV_DispatchTypeOK
INVARIANT INV_AdmissionNeverWaitsOnMergeLoop
