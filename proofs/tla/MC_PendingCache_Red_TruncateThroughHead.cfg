\* Plants the bug of a merge that truncates the log through the head rather than through what it linked: a vector it never linked is neither linked nor pending, and INV_NoLostVector fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {a, b}
          Readers = {r1, r2}
          MaxCommits = 3
          MaxOwn = 2
          GenerationCheck = TRUE
          OwnAppendsRead = TRUE
          TruncateThroughLinked = FALSE
          LatestOnly = TRUE
          HeadCut = TRUE
INVARIANT INV_NoHiddenPending
INVARIANT INV_CacheCovers
INVARIANT INV_NoLostVector
INVARIANT INV_ScoresLatest
SYMMETRY Symmetry
