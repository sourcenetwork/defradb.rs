\* run-all: CommitOutcome.tla RED
\* a not-found commit is answered aborted with no abort retained (INV_AbortedMeansNothingLanded)
\* RED: a commit of a transaction the registry no longer holds is answered aborted whatever happened, as a bare not-found reads to a caller. After a failed commit whose entry expired, a resend hears aborted for a write on disk. Fails INV_AbortedMeansNothingLanded.
SPECIFICATION Spec
CONSTANT ClassifyFailure = TRUE
CONSTANT RetainFailure = TRUE
CONSTANT NotFoundSaysUnknown = FALSE
CONSTANT ReportRefusal = TRUE
CONSTANT LostReplyUnknown = TRUE
INVARIANT INV_AbortedMeansNothingLanded
CHECK_DEADLOCK FALSE
