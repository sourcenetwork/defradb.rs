\* RED: setup_iroh is not handed the configured retry ladder, so the iroh peer
\* and its retry peerstore keep the default one. A node on iroh with its own
\* ladder starts retrying on the wrong one. Must fail INV_OneSchedule.
SPECIFICATION Spec
CONSTANTS
  ScheduleToIroh       = FALSE
  ShutdownOnListenFail = TRUE
  ValidateFirst        = TRUE
  OwnerPassed          = TRUE
  ConnectAfterNac      = TRUE
  BootstrapNonFatal    = TRUE
INVARIANT INV_OneSchedule
CHECK_DEADLOCK FALSE
