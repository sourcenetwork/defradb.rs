\* run-all: TruncateIndexCleanup.tla RED
\* indexes taken from the collection the truncate began with: an index created mid-truncate keeps entries (INV_NoEntryForTruncatedDoc)
\* RED: the cleanup takes its indexes from the collection the truncate was
\* handed when it began, as the first version of this fix did. An index
\* created while the chunks run, whose backfill indexed a document before its
\* chunk deleted it, is not cleaned, so its entry for that document outlives
\* the truncate (INV_NoEntryForTruncatedDoc).
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  OldIndexes = {1}
  NewIndexes = {2}
  Source = "Captured"
  Which = "Declared"
  BackfillRead = "Validated"
  Boundary = "Index"
INVARIANT INV_NoEntryForTruncatedDoc
CHECK_DEADLOCK FALSE
