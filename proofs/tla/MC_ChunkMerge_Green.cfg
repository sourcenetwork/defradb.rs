\* GREEN: a reader cuts the current text itself, a merge builds the chunks it
\* lacks, and the merge refuses a forged or changed chunk. Deletes are off
\* here, MC_ChunkMerge_Green_Delete has them. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = FALSE
  DeleteRule = "wait"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = TRUE
  Encrypt = FALSE
  Ship = TRUE
  OneCopy = TRUE
INVARIANT TypeOK
INVARIANT INV_SettledPeersAgree
INVARIANT INV_NoForgedChunk
INVARIANT INV_ChunksNeverChange
INVARIANT INV_TextChunksStored
INVARIANT INV_EachChunkOnce
INVARIANT INV_PlainChunkStoredOnce
CHECK_DEADLOCK FALSE
