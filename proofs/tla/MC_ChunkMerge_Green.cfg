\* GREEN: a reader checks entry 0 of the list against the current text and cuts
\* the text itself when they differ, and the merge refuses a forged or changed
\* chunk. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CheckEntry0 = TRUE
  CheckHash = TRUE
  Immutable = TRUE
INVARIANT TypeOK
INVARIANT INV_ReadsMatchText
INVARIANT INV_SettledPeersAgree
INVARIANT INV_NoForgedChunk
INVARIANT INV_ChunksNeverChange
CHECK_DEADLOCK FALSE
