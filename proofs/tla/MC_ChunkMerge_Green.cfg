\* readers cut the text when a peer merge kept another edit's list
\* GREEN: a reader cuts the current text itself and never trusts the list, and
\* the merge refuses a forged or changed chunk. Deletes are off here, MC_ChunkMerge_Green_Delete has them. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = FALSE
  DeleteRule = "wait"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = TRUE
  Encrypt = FALSE
  Ship = TRUE
INVARIANT TypeOK
INVARIANT INV_ReadsMatchText
INVARIANT INV_SettledPeersAgree
INVARIANT INV_NoForgedChunk
INVARIANT INV_ChunksNeverChange
INVARIANT INV_TextChunksStored
INVARIANT INV_SettledListsAgree
INVARIANT INV_EachChunkOnce
CHECK_DEADLOCK FALSE
