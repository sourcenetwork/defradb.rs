\* run-all: TruncateUnderWriters.tla GREEN
\* #2914: an unfiltered truncate finishes while clients keep updating the collection
\* GREEN: every document is marked deleted, in transactions of their own, before
\* any chunk is purged, and writers check the marker they read at commit. No
\* truncate transaction is ever refused by an update, so it never runs out of
\* retries, and no update lands after its document was marked.
SPECIFICATION Spec
CONSTANTS
  Docs = {"d1", "d2"}
  Writers = {"w1", "w2"}
  MaxCommits = 3
  MaxAttempts = 2
  Enforced = {"mark", "split", "markall", "validated"}
INVARIANT TypeOK
INVARIANT INV_FirstAttemptCommits
INVARIANT INV_NeverExhausted
INVARIANT INV_NoWriteAfterMark
INVARIANT INV_DoneRemovesAll
CHECK_DEADLOCK FALSE
