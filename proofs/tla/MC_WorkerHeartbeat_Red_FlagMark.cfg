\* RED: the mark is a bare flag. The monitor reads a long task poll, the
\* poll ends, the hook runs, the next short task poll starts, and only then
\* does the mark land: that short poll takes it and the task is remembered
\* as stalled. Must fail INV_MarkTrue.
SPECIFICATION Spec
CONSTANTS
  Limit          = 1
  MaxTime        = 5
  MaxPolls       = 3
  HookBeat       = TRUE
  MarkHoldsStart = FALSE
  HookClears     = TRUE
  Recheck        = TRUE
INVARIANT TypeOK
INVARIANT INV_MarkTrue
