\* RED: the mark is a bare flag. The monitor reads a long task poll, the
\* poll ends and finds no mark, the hook runs, the next short task poll
\* starts, and only then does the mark land: that short poll takes it and
\* the task is remembered as stalled. Must fail INV_MarkTrue.
SPECIFICATION Spec
SYMMETRY MonSymmetry
CONSTANTS
  Limit          = 1
  MaxTime        = 6
  MaxPolls       = 4
  Watchers       = {m1, m2}
  HookBeat       = TRUE
  MarkNamesPoll  = FALSE
  HookClears     = TRUE
  Recheck        = TRUE
  MarkKeepsLive  = TRUE
  ClaimMax       = TRUE
INVARIANT TypeOK
INVARIANT INV_MarkTrue
