\* run-all: ChunkCleanup.tla RED
\* a merge of edits made apart keeps each peer's chunks (INV_SettledSameIds)
\* RED: the bug plants a merge that treats two heads like one: it keeps the
\* chunks it holds and makes only the missing ones. A peer that deleted a
\* chunk on its own branch makes it again under the winner, while the peer
\* that kept it keeps the old document, so peers with every edit hold
\* different chunk documents (INV_SettledSameIds).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CleanWrites = TRUE
  CleanMerges = TRUE
  DropStale = TRUE
  DeleteGuard = TRUE
  Ids = "source"
  Reanchor = FALSE
  KeepWaiting = TRUE
INVARIANT INV_SettledSameIds
CHECK_DEADLOCK FALSE
