\* run-all: FilteredChunkPush.tla RED
\* a transaction's chunk never follows its article (LIVE_ChunkFollowsItsArticle)
\* RED: the bug plants an explicit transaction that hands its chunks no article
\* document. The chunk is refused while its article goes, so it never follows
\* (LIVE_ChunkFollowsItsArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  NewMatches = {a1}
  Unreadable = {}
  StaleMarkers = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = FALSE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = TRUE
  ReplayNeedsArticle = TRUE
  ReplayDefersChunk = TRUE
  ReplayChunksOnRefilter = TRUE
PROPERTY LIVE_ChunkFollowsItsArticle
CHECK_DEADLOCK FALSE
