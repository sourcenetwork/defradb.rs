\* RED: the bug plants an explicit transaction that hands its chunks no
\* article document. Their live push fails closed and nothing retries it, so
\* the receiver misses a matching article's chunk (INV_SettledHasMatchingChunks).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = FALSE
INVARIANT INV_SettledHasMatchingChunks
CHECK_DEADLOCK FALSE
