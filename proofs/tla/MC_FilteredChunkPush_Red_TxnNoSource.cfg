\* RED: the bug plants an explicit transaction that hands its chunks no
\* article document. Their push fails closed and nothing retries it, so the
\* article reaches the receiver and its chunk never follows
\* (LIVE_ChunkFollowsItsArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  StaleMarkers = {a1, a2}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = FALSE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  ReplayAddsParent = TRUE
  ReplayNeedsArticle = TRUE
PROPERTY LIVE_ChunkFollowsItsArticle
CHECK_DEADLOCK FALSE
