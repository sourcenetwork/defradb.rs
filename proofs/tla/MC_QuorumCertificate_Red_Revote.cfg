\* RED: honest validators may vote again. Each votes for both contenders, so both get certificates (INV_OneCertificate).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Honest <- mcHonest
  Cheaters <- mcCheaters
  Contenders <- mcContenders
  Quorum = 3
  VoteOnce = FALSE
  ActOnCert = TRUE
  AbstainOnRestore = TRUE
  Restores = FALSE
INVARIANT TypeOK
INVARIANT INV_OneCertificate
