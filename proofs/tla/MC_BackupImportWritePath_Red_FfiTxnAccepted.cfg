\* RED: the FFI import takes a transaction handle. An import on a
\* transaction writes documents. Must fail INV_FfiTxnRefused.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  AdmitEachWrite      = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  RequireNode         = FALSE
INVARIANT INV_FfiTxnRefused
CHECK_DEADLOCK FALSE
