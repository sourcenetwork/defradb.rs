\* run-all: PincJoinConfirm.tla RED
\* RED: a failed subscribe leaves its topic subscribed and joined. The hub
\* confirms but the event is lost to a full queue; the subscribe fails, and
\* pinc, already told, never raises the event again: every retry finds the
\* join in place and waits for nothing. Must fail INV_NoStuckSubscription.
SPECIFICATION Spec
CONSTANTS
  Calls            = {c1}
  MaxUnsub         = 1
  MaxHold          = 0
  MaxLost          = 1
  ConfirmCheck     = TRUE
  StillJoined      = TRUE
  Recheck          = TRUE
  Rollback         = FALSE
  ClearOnLeave     = TRUE
  HubTagsLists     = TRUE
  RejoinAfterDrain = TRUE
INVARIANT TypeOK
INVARIANT INV_NoStuckSubscription
CHECK_DEADLOCK FALSE
