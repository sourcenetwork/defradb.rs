\* retry without a cap asks past ATTEMPTS (INV_AttemptsBounded)
\* RED: the retry has no cap. A chain that finalizes a block during every
\* round trip keeps the read asking without end; here five blocks push it to a
\* fifth ask. Must fail INV_AttemptsBounded.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 5
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = FALSE
  MaxBusy     = 0
  RetryBusy   = TRUE
  Patience    = 15
  MaxTook     = 2
  PauseMin    = 1
  PauseMax    = 2
  CountTook   = TRUE
  CheckDrawn  = TRUE
  MaxStale    = 0
  CheckFresh  = TRUE
  WaitFresh   = TRUE
INVARIANT TypeOK
INVARIANT INV_AttemptsBounded
