\* RED: the retry has no cap. A chain that finalizes a block during every
\* round trip keeps the read asking without end; here five blocks push it to a
\* fifth ask. Must fail INV_AttemptsBounded.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 5
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = FALSE
INVARIANT TypeOK
INVARIANT INV_AttemptsBounded
