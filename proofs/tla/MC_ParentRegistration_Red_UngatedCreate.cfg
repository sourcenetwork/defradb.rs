\* AuthorizedAtWrite
\* Plants the bug: a local create registers its document without checking the
\* permission on the parent it names. The identity holds nothing on the parent, creates
\* a document under it and becomes its owner: AuthorizedAtWrite fails.
SPECIFICATION Spec
CONSTANT Bug = "local"
INVARIANT AuthorizedAtWrite
INVARIANT RegistrationHasParent
INVARIANT FieldNamesAdmittedParent
CHECK_DEADLOCK FALSE
