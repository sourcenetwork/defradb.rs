\* RED (the rule before): MC_SyncOwnership_Green_Dispatch_PeerPermits with
\* the clock reserving a root's fetch slot first; the fetch asks for its
\* source peer's permit only afterwards and waits for one while it holds the
\* slot. d1's trickling attempt takes the spoke's only permit, d2 is claimed
\* into the second slot and waits for that permit, and d3, acknowledged
\* meanwhile from another peer and able to start at once, finds no slot:
\* INV_NoSlotWaitsForPermit fails.
SPECIFICATION WSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1, d2, d3}
  Cols           = {}
  MaxV           = 1
  Cap            = 3
  FetchCap       = 2
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MaxAttempts    = 3
  AttemptMode    = "PerAttempt"
  RearmMode      = "AttemptEnd"
  ExpiryMode     = "AckRetained"
  Dead           = {}
  Trickle        = {d1}
  CutoffMode     = "Quantum"
  SharedPeer     = {d1, d2}
  PeerPermits    = 1
  MaxPulls       = 0
  PermitMode     = "AfterSlot"
  DispatchPath   = "OwnLane"
  HandlerSend    = "TryThenClock"
  LaneTurns      = "Bounded"
  Storm          = FALSE
  FifoCap        = 1
INVARIANT INV_DispatchTypeOK
INVARIANT INV_NoSlotWaitsForPermit
