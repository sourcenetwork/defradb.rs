\* GREEN: a chunk's push, create or delete, is decided by its article's filter,
\* a document sync of an article brings its chunks, and the peer's merge of an
\* edit deletes the chunk the edit stopped using. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Articles = {pub, priv}
  Matching = {pub}
  ChunkRule = "parent"
  SyncFollows = TRUE
  DeletesFollow = TRUE
  Reconcile = TRUE
INVARIANT TypeOK
INVARIANT INV_ChunksFollowParent
INVARIANT INV_NoForeignChunks
INVARIANT INV_DeletesFollowParent
INVARIANT INV_DroppedChunksGo
CHECK_DEADLOCK FALSE
