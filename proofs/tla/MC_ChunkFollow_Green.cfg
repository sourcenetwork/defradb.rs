\* run-all: ChunkFollow.tla GREEN
\* #2310: a chunk's push and sync follow its parent
\* GREEN: a chunk's push, create or delete, is decided by its article's
\* filter, a document sync of an article brings the chunks of its current
\* text, and the peer's merge of an edit deletes the chunk the edit stopped
\* using. Every invariant holds, through creates, an edit, deletes and syncs.
SPECIFICATION Spec
CONSTANTS
  Articles = {pub, priv}
  Matching = {pub}
  ChunkRule = "parent"
  SyncRule = "current"
  DeletesFollow = TRUE
  Reconcile = TRUE
  Cascade = TRUE
  Embedded = FALSE
  KeepWaiting = TRUE
INVARIANT TypeOK
INVARIANT INV_ChunksFollowParent
INVARIANT INV_NoForeignChunks
INVARIANT INV_DeletesFollowParent
INVARIANT INV_SyncSendsCurrentChunks
INVARIANT INV_DroppedChunksGo
CHECK_DEADLOCK FALSE
