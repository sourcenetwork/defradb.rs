\* GREEN: a chunk's push is decided by its article's filter, and a document
\* sync of an article brings the chunks of its current text. Every invariant
\* holds, through creates, an edit, deletes and syncs.
SPECIFICATION Spec
CONSTANTS
  Articles = {pub, priv}
  Matching = {pub}
  ChunkRule = "parent"
  SyncRule = "current"
INVARIANT TypeOK
INVARIANT INV_ChunksFollowParent
INVARIANT INV_NoForeignChunks
INVARIANT INV_DeletesFollowParent
INVARIANT INV_SyncSendsCurrentChunks
CHECK_DEADLOCK FALSE
