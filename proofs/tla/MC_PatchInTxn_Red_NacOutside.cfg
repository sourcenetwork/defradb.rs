\* RED: the NAC check reads the committed permissions before the patch's
\* transaction runs, outside it. An administrator revokes the client's patch
\* permission and commits after the check; nothing the client's transaction
\* read changed, so its commit lands a patch the client may no longer make
\* (INV_RevocationDeniesPatch).
SPECIFICATION Spec
CONSTANTS
  ReadThroughTxn = TRUE
  WriteThroughTxn = TRUE
  FinishOnCommit = TRUE
  RetryHides = FALSE
  Savepoint = TRUE
  RefreshCatalog = TRUE
  NacInTxn = FALSE
INVARIANT INV_RevocationDeniesPatch
CHECK_DEADLOCK FALSE
