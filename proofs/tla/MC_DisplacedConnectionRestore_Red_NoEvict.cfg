\* run-all: DisplacedConnectionRestore.tla RED
\* The cleanup forgets to evict the refused handle. When nothing was displaced,
\* or the displaced sibling is closed, the refused connection stays cached and
\* later RPCs pick a handle that admission already turned away.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANT Mode = "noEvict"
INVARIANTS TypeOK NoRefused
