\* run-all: DeferredVector.tla RED
\* a deferred write never asks for a drain
\* Plants deferred writes that commit without asking for a drain (and no crash
\* to settle at open). Their entries stay pending forever and the graph never
\* catches up: PROP_Converges fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {n1, n2}
          Drains = {d1, d2}
          MaxWrites = 3
          MaxCrashes = 1
          ValidateRead = TRUE
          Supersede = TRUE
          MergePending = TRUE
          DropStale = TRUE
          AskOnCommit = FALSE
          SettleAtOpen = FALSE
PROPERTY PROP_Converges
