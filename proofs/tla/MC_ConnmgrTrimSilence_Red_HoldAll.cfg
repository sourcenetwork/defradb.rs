\* run-all: ConnmgrTrimSilence.tla RED
\* the hold refuses an explicit connect too (INV_ExplicitNeverRefused)
\* The bug: the hold refuses every outbound dial to a held peer, not only
\* Kademlia's own. A peer disconnects, someone runs `client p2p connect` to it
\* (or a replicator push needs it) within the hold, and the connect is refused.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers = {p1, p2, p3}
  Low = 1
  High = 2
  Silence = 3
  MaxTime = 6
  Mode = "holdAll"
INVARIANTS TypeOK INV_ExplicitNeverRefused
