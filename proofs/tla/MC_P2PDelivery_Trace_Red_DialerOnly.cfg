\* RED (F27): a's connection to h comes up dialed by a and registered only
\* on a's side, so h never serves a push over it and never dials back. The
\* fixed design serves every new connection on both sides, so the replay
\* deadlocks at that connection.
SPECIFICATION TraceSpec
CONSTANTS
  Nodes <- tNodes
  Repl <- tRepl
  Heads <- tHeads
  Author <- tAuthor
  Parent <- tParent
  Prio <- tPrio
  KeyOrder <- tKeyOrder
  Base <- tNoHeads
  Fresh <- tHeads
  Backlogs <- tBacklogs
  Trickle <- tNoHeads
  Dead <- tNoHeads
  PullPeer <- tPullPeer
  PullAt <- tNodes
  Storm <- tNodes
  Crashable <- tNodes
  ConnectedAtStart = "down"
  Trace <- mDialerOnly
  K = 4
  Permits = 4
  PeerPermits = 3
  MemCap = 1000
  PeerQuota = 250
  DurCap = 4000
  MaxCrash = 3
  MaxRegFail = 0
  MaxDisc = 0
  MaxCont = 0
  CoverRule = "Ancestry"
  ShutdownOrder = "DrainFirst"
  ForwardMode = "BeforeMark"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Kept"
  FanoutMode = "PerPeer"
  SlotBeforePermit = FALSE
  DispatchPath = "Direct"
  ConnMode = "Served"
INVARIANT INV_TypeOK
INVARIANT INV_Bounded
INVARIANT INV_ObligationOwned
INVARIANT INV_TraceIndex
