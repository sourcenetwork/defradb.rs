\* run-all: HistoryRetention.tla RED
\* #559: a field head an earlier prune kept is never reclaimed once superseded (INV_Reclaimed)
\* Bug planted: a prune deletes only the field blocks its pruned composites link. The first prune keeps f1, the name field's head, and deletes c1, its only linker; an update then supersedes f1, so no later prune reaches it and it stays stored, unowned by anyone else: INV_Reclaimed fails.
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Keep"
  FieldMode = "Keep"
  ScanMode = "Validated"
  MarkerMode = "Keep"
  WindowMode = "Exact"
  ReclaimMode = "Links"
  ReadMode = "Refuse"
  MaxPrunes = 2
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned INV_Reclaimed INV_NoPartialRead
CHECK_DEADLOCK FALSE
