\* RED: a provider outside the page's transaction loses a registration with
\* no delete on this node: ahead of the delete's commit, or because a peer
\* that shares the provider deleted the document first. The provider calls
\* the document public, the page's second look finds it alive, and its rows
\* go to a reader who could never read it.
