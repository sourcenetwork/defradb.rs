\* RED (f): a worker thread is refused before the started cell is read
\* (completion.rs:278 checked before default.rs:118). c1 starts s1; c2, on a
\* worker, asks with nothing registered and gets OnWorker although s1 runs and
\* could be handed out without waiting. No registrable pool is needed; two
\* callers are (one plain to start s1, one on a worker). Must fail
\* INV_ErrorHonest.
SPECIFICATION Spec
CONSTANTS
  NP                 = 0
  NC                 = 2
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = FALSE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_ErrorHonest
CHECK_DEADLOCK FALSE
