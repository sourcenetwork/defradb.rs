\* RED: a block is merged the moment it arrives, even if its parents have not.
\* Alice types "a", then types "c" in front of it. Bob gets "c" first: its
\* parent version is missing, so "c" is read against an empty text and goes
\* under the root. When "a" arrives it goes under the root too, and by ID it
\* sorts before "c". Bob shows "ac" where replaying the same blocks gives
\* "ca". Must fail INV_MatchesReplay.
SPECIFICATION Spec
CONSTANTS
  Peers        = {p1, p2}
  MaxBlocks    = 4
  SiblingKey   = "id"
  CausalBuffer = FALSE
  ResolveAt    = "parent"
  PlaceRule    = "fugue"
  ReplayFrom   = "critical"
  NullRule     = "heads"
INVARIANT TypeOK
INVARIANT INV_MatchesReplay
