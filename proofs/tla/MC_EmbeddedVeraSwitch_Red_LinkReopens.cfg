\* run-all: EmbeddedVeraSwitch.tla RED
\* a switch reopens the link the stop closed (INV_ClosedAfterStop)
\* RED: a switch points the link at its new node whatever the link is (a
\* plain store). The switch launches its node; the stop begins and closes
\* the link; the switch opens it on its new node and lets go; the stop takes
\* the node and returns, and a transport reaches a Vera node after the stop
\* returned. Fails INV_ClosedAfterStop.
SPECIFICATION Spec
CONSTANTS
  EvictWatch     = TRUE
  AskWithdraws   = TRUE
  AbortOnStop    = TRUE
  SwitchDeadline = TRUE
  ClearsHalted   = TRUE
  RecordsTarget  = TRUE
  ReportFails    = FALSE
  ObservesCommit = TRUE
  Restarts       = TRUE
  LinkShuts      = FALSE
  Reaps          = TRUE
  WaitsRelease   = TRUE
INVARIANT TypeOK
INVARIANT INV_ClosedAfterStop
INVARIANT INV_NoStartAfterStop
INVARIANT INV_SlotRuns
INVARIANT INV_StoppedMeansEnded
INVARIANT INV_DeviceNamesNode
PROPERTY LIVE_NoNodeAfterStop
PROPERTY LIVE_DropStops
PROPERTY LIVE_SwitchEnds
PROPERTY LIVE_WatchWakes
PROPERTY LIVE_StopReturns
PROPERTY LIVE_Recovers
CHECK_DEADLOCK FALSE
