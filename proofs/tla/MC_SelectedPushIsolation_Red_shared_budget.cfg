\* Bug: every head shares one budget for the whole call, so a head that has only just started expires early (INV_FreshHeadBudget).
SPECIFICATION Spec
CONSTANTS
  Bug = "shared-budget"
  N = 3
  Cap = 2
INVARIANTS TypeOK INV_Independent INV_HintOwner INV_Drained INV_ScheduleBound INV_SendBound INV_StallBound INV_CompletionTruth INV_PauseNotTerminal INV_FreshHeadBudget
CHECK_DEADLOCK FALSE
