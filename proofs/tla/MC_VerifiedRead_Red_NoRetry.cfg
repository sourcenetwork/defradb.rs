\* RED: the bug that was on main. A refused read is never asked again, so one
\* block finalizing during the round trip ends the read in an error ("unable
\* to verify access to commit history") with three asks still unused. Must fail
\* INV_FailsOnlyWhenEveryAskOvertaken.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 3
  CheckRoot   = TRUE
  Retry       = FALSE
  Capped      = TRUE
INVARIANT TypeOK
INVARIANT INV_FailsOnlyWhenEveryAskOvertaken
