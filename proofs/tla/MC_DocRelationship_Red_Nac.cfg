\* run-all: DocRelationship.tla RED
\* The core skips the nac check: a relationship changes although that check fails (INV_NoChangeUnlessAllChecksPass)
\* RED: the core no longer checks that the caller may change relationships, so a caller NAC refuses changes one.
\* Both ways in forward to it, so both make the change.
SPECIFICATION Spec
CONSTANTS
  Skipped = {"nac"}
  Swapped = TRUE
  ServerCopy = FALSE
  EventFirst = FALSE
  TxnSwapped = FALSE
INVARIANT INV_NoChangeUnlessAllChecksPass
CHECK_DEADLOCK FALSE
