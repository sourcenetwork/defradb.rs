\* RED: the gate wait does not watch the close. A close while the build waits
\* at the shut gate waits for the pool, the pool waits for the build, and the
\* gate opens only once the node is up again: the close never finishes, which
\* is the restart hang the testo scenario hit (LIVE_CloseFinishes).
SPECIFICATION Spec
CONSTANTS
  Docs = 2
  RaceMode = "NoRace"
  StopMode = "Leave"
  ResumeMode = "Resume"
PROPERTY LIVE_CloseFinishes
CHECK_DEADLOCK FALSE
