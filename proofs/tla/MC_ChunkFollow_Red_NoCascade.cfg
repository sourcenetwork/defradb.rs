\* run-all: ChunkFollow.tla RED
\* the merge of an article's delete leaves the chunks only the peer built (INV_DeletesFollowParent)
\* RED: the bug plants a merge of the article's delete that deletes none of its
\* chunks. A chunk of the edit reaches the peer while the peer still holds the
\* first text, which does not use it, so the peer deletes it. The merge of the
\* edit builds it again under a new ID. The source's deletes name only its own
\* IDs, so after the article's delete that chunk stays live
\* (INV_DeletesFollowParent).
SPECIFICATION Spec
CONSTANTS
  Articles = {pub}
  Matching = {pub}
  ChunkRule = "parent"
  SyncRule = "current"
  DeletesFollow = TRUE
  Reconcile = TRUE
  Cascade = FALSE
INVARIANT INV_DeletesFollowParent
CHECK_DEADLOCK FALSE
