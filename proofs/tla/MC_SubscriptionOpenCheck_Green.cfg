\* Subscribe first, check through the plain path, race the check with closing:
\* a bad filter is reported, a good one whose check met a failure that passes
\* is kept, no promised update is lost, and closing ends it.
SPECIFICATION Spec
CONSTANT Bug = "none"
INVARIANTS INV_BadNeverStreams INV_BadIsReported INV_GoodNeverRefused INV_NoLostUpdate
PROPERTY LIVE_ClosingEnds
CHECK_DEADLOCK FALSE
