\* run-all: SubscriptionOpenCheck.tla GREEN
\* subscribe, then check; bad filter reported, transient failure kept, closing ends it
\* Subscribe first, check through the plain path, race the check with closing:
\* a bad filter is reported, a filter whose check met a failure that passes is
\* kept (and, if bad, reported by the update that finds it so), no update
\* committed after the registration is lost, and closing ends it.
SPECIFICATION Spec
CONSTANT Bug = "none"
INVARIANTS INV_BadNeverStreams INV_BadIsReported INV_GoodNeverRefused INV_NoLostUpdate
PROPERTIES LIVE_ClosingEnds LIVE_BadUpdateReported
CHECK_DEADLOCK FALSE
