\* RED: a filter-only or different-order scan is treated as ordered and stops
\* before the ordered child is reached, so the second parent loses its page
\* (INV_EveryParentHasPage).
SPECIFICATION Spec
CONSTANTS
  Parents = {"a", "b"}
  Children = {"x", "y"}
  Guarded = FALSE
INVARIANT INV_EveryParentHasPage
CHECK_DEADLOCK FALSE
