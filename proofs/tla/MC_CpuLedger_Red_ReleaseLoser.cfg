\* RED (c): a claim alone records each CPU before it checks its swap won, so
\* the CPU it lost on is in its record and its rollback gives that CPU back
\* too. Pool A holds CPU 0 and runs on it; pool B loses on CPU 0 and lowers
\* A's count: CPU 0 reads free while A still runs there, and the next claim
\* alone takes it. Must fail INV_HeldNeverFree.
\* Two CPUs, two pools living once each, one claim alone before sharing:
\* small, and still every interleaving of the scenario above.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 1
  Attempts         = 1
  AtomicTake       = TRUE
  RollBack         = TRUE
  InsertAfterWin   = FALSE
  ShareCounts      = TRUE
  AttemptCap       = TRUE
  KeepWhileRunning = TRUE
  ReleaseOnce      = TRUE
  RunOnHeld        = TRUE
  ReleaseAtEnd     = TRUE
INVARIANT TypeOK
INVARIANT INV_HeldNeverFree
CHECK_DEADLOCK FALSE
