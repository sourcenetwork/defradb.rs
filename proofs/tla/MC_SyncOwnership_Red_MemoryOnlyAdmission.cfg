\* RED (the rule before two tiers): a full map nacks every head it has no
\* entry for, although the durable store has room. d1, whose provider never
\* serves, is acknowledged and holds the only entry after the restart; no
\* durable root waits, so it never gives the entry up. d2's head, written
\* after the restart, is nacked, its sender keeps the marker and offers it
\* again, and it is nacked again, for ever: the obligation never leaves the
\* sender and d2 never merges although its provider serves.
\* LIVE_WrittenHeadMerged fails.
SPECIFICATION MFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs             = {d1, d2}
  Cols             = {}
  MaxV             = 1
  Cap              = 2
  FetchCap         = 1
  SenderMode       = "MarkerRederive"
  RegisterMode     = "Durable"
  FlightMode       = "SingleFlight"
  AckGuardMode     = "HeadCurrent"
  ServeMode        = "DurableDerived"
  ProviderMode     = "OriginBound"
  OriginAuthMode   = "TransportBound"
  FetchMode        = "RootThenSelective"
  StreamMode       = "DrainResponse"
  CompletionMode   = "LatchedDrain"
  PendingMode      = "ScopeCurrent"
  MergeMode        = "SerializedBatch"
  MemCap           = 1
  RotateAfter      = 1
  Dead             = {d1}
  PullScopes       = {d2}
  OverflowMode     = "Rotate"
  ContinuationMode = "EndOnStop"
  AdmissionMode    = "MemoryOnly"
  PeerScopes       = {{d1}, {d2}}
  DurableQuota     = 2
INVARIANT INV_MemoryTypeOK
PROPERTY LIVE_WrittenHeadMerged
