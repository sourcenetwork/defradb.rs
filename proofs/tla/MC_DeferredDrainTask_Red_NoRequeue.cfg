\* RED: an index with work left after its turn does not ask again. The quiet
\* index owes two turns, gets one, and the rest waits with no request (INV_OwedKept).
SPECIFICATION Spec
CONSTANTS
  Poison = 1
  Hot = 2
  Quiet = 3
  Interval = 2
  Isolate = "On"
  KeepFailed = "On"
  Requeue = "Off"
  PurgeRequests = "On"
  SweepTimer = "Fixed"
  SweepFirst = "On"
INVARIANT INV_OwedKept
CHECK_DEADLOCK FALSE
