\* RED: the subscriber reads before it subscribes; an update committed in
\* between is announced to nobody and never read (EventuallyObserved).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Updates = {u1, u2}
  Merged = {u2}
  Cap = 1
  MaxCrashes = 1
  Channel = "coalescing"
  Mode = "read_before_subscribe"
INVARIANT TypeOK
PROPERTY EventuallyObserved
