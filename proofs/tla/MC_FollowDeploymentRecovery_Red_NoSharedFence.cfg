\* RED: a pass that ends after a second node bound its outbox reopens the
\* node anyway. The takeover voided a confirmation of that node's, which only
\* its own ledger names, so nothing owes it and the node decides without it.
\* Must fail INV_TheirsNotLost.
SPECIFICATION Spec
CONSTANTS
  Records       = 3
  Revoked       = {2, 3}
  PageSize      = 2
  MaxTakeovers  = 2
  MaxCrashes    = 1
  Gate          = TRUE
  HandOver      = TRUE
  OweFirst      = TRUE
  EndFromLedger = TRUE
  SaysDone      = TRUE
  TermFence     = TRUE
  SharedFence   = FALSE
INVARIANT TypeOK
INVARIANT INV_TheirsNotLost
