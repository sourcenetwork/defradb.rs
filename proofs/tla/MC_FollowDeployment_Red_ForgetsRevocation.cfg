\* RED: a replay the deployment refuses is dropped, not owed again. The
\* revocation was confirmed in a void block and its replay is refused (its
\* delegation expired): the deployment holds the grant before it, nothing
\* owed denies, and the node allows what it revoked. Must fail
\* INV_RevocationDenies.
