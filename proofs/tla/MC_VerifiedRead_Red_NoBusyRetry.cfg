\* a busy (-32002) answer never asked again: errors with patience left (INV_FailsOnlyWhenEveryAskOvertaken)
\* RED: the bug the embedded Vera tests met under load. A read the node
\* answers busy (-32002: the evidence was not ready by its deadline) is never
\* asked again, so one late certificate ends the read in an error ("created
\* policy proof: ... evidence deadline exceeded") while most of its patience
\* is left. Must fail INV_FailsOnlyWhenEveryAskOvertaken.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 0
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = TRUE
  MaxBusy     = 1
  RetryBusy   = FALSE
  Patience    = 15
  MaxTook     = 2
  PauseMin    = 1
  PauseMax    = 2
  CountTook   = TRUE
  CheckDrawn  = TRUE
  MaxStale    = 0
  CheckFresh  = TRUE
  WaitFresh   = TRUE
INVARIANT TypeOK
INVARIANT INV_FailsOnlyWhenEveryAskOvertaken
