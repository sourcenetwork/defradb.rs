\* RED (k), caller contract C1 broken: Pool::stop asks for the default before it
\* shuts its pool down (mod.rs:509 and 510 swapped). p1 registers; c1 stops p1
\* but asks first, so p1 still runs and is the answer. The deadline timer is then
\* admitted on p1 itself, p1's shutdown waits for that timer like any admitted
\* work, and the stop always runs its full deadline and reports TimedOut: the
\* stop waits on itself. One pool and one caller. Must fail
\* INV_StopDeadlineElsewhere.
SPECIFICATION Spec
CONSTANTS
  NP                 = 1
  NC                 = 1
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = FALSE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_StopDeadlineElsewhere
CHECK_DEADLOCK FALSE
