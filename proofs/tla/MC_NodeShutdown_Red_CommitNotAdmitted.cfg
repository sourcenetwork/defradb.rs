\* RED: an in-process commit (EmbeddedNode::commit_transaction) goes straight
\* to the runner instead of through the request scope, as defra-node did at
\* feab76e5. Shutdown stops admitting requests, but the commit still starts,
\* commits after P2P began going down, and its head marker is never
\* registered. Must fail INV_AdmittedWritesMarked.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
  P2PFirst        = TRUE
  RequestsFirst   = TRUE
  CommitsAdmitted = FALSE
  EndsOpenTransactions = TRUE
  WaitersWait     = TRUE
  HandsBackLead   = TRUE
  RerunCompletesClose = TRUE
INVARIANT INV_AdmittedWritesMarked
CHECK_DEADLOCK FALSE
