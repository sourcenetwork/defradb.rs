\* RED: an in-process commit (Node::commit_transaction) goes straight to the
\* runner instead of through the request scope. Shutdown stops admitting
\* requests, but the commit still starts, commits after P2P began going down,
\* and its head marker is never registered. Must fail INV_AdmittedWritesMarked.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
  RequestsFirst   = TRUE
  CommitsAdmitted = FALSE
INVARIANT INV_AdmittedWritesMarked
CHECK_DEADLOCK FALSE
