\* RED: Quorum 2 = F + 1 is too small: two quorums need not share any validator. The honest votes split 2 to 1, the cheater tops up the smaller side, and both contenders get certificates (INV_OneCertificate).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Honest <- mcHonest
  Cheaters <- mcCheaters
  Contenders <- mcContenders
  Quorum = 2
  VoteOnce = TRUE
  ActOnCert = TRUE
  AbstainOnRestore = TRUE
  Restores = FALSE
INVARIANT TypeOK
INVARIANT INV_OneCertificate
