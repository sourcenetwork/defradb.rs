\* RED: the guard accepts a missing stamp with collections without rebuilding.
\* A legacy store opens with no current stamp (INV_StampedAfterOpen).
SPECIFICATION Spec
CONSTANTS
  Collections = {c1}
  RefusesOld = "On"
  RebuildsLegacy = "Off"
  StampsFresh = "On"
  MutatesOnRefusal = "Off"
INVARIANT INV_StampedAfterOpen
CHECK_DEADLOCK FALSE
