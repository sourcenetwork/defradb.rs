\* RED: the guard accepts a missing stamp with collections. A legacy store opens
\* as though it were new (INV_OpenCompatible).
SPECIFICATION Spec
CONSTANTS
  Collections = {c1}
  RefusesOld = "On"
  RefusesUnstamped = "Off"
  StampsFresh = "On"
  MutatesOnRefusal = "Off"
INVARIANT INV_OpenCompatible
CHECK_DEADLOCK FALSE
