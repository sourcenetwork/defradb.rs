\* RED: a drain truncates a broken document's entries without appending it again.
\* d1 is incremented, the drain cannot migrate it and forgets it, so d1 looks
\* settled while its stored entry is stale (INV_ReadExact).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 2
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
  Poisoned = {d1}
  Carry = "Drop"
  Fixed = "Never"
INVARIANT INV_ReadExact
CHECK_DEADLOCK FALSE
