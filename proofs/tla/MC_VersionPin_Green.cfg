\* GREEN: both guards in place. Requests on one transaction pin an old
\* version, the active one, or nothing, write and read, while DDL changes the
\* active version between turns. Pins never outlive their turn, an unpinned
\* turn sees the active version, reads through an old version change nothing,
\* and writes land at the selected version.
SPECIFICATION Spec
CONSTANTS
  Versions         = {v1, v2}
  None             = none
  MaxSteps         = 7
  ClearPin         = TRUE
  NoWriteBackOnPin = TRUE
INVARIANT TypeOK
INVARIANT INV_PinScoped
INVARIANT INV_UnpinnedSeesActive
INVARIANT INV_ReadNoSideEffect
INVARIANT INV_WriteAtSelected
CHECK_DEADLOCK FALSE
