\* A rerun budget of zero (the first fix's bound with max_txn_retries = 0): a live write superseded once by a replay's newer marker is still reported undurable (INV_NoFalseFailure). The code's bound, LIVE_MARKER_RERUNS, is a fixed 16, independent of max_txn_retries.
SPECIFICATION Spec
CONSTANT LiveMode = "rerun"
CONSTANT MaxReruns = 0
INVARIANTS INV_NoFalseFailure INV_LiveOwed
CHECK_DEADLOCK FALSE
