\* GREEN: the design. Siblings are ordered by block ID, a block is merged only
\* after its parents, and positions are read in the block's parent version.
\* Two peers write four edits between them (inserts and deletes, concurrent or
\* not) and swap them in every order the network allows. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Peers        = {p1, p2}
  MaxBlocks    = 4
  SiblingKey   = "id"
  CausalBuffer = TRUE
  ResolveAt    = "parent"
INVARIANT TypeOK
INVARIANT INV_Converge
INVARIANT INV_MatchesReplay
INVARIANT INV_Intent
INVARIANT INV_PlacedAsIntended
