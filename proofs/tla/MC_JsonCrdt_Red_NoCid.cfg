\* RED: ties broken by priority alone. Alice and Bob each set "a" with no
\* edits seen, so both blocks have priority 1. With no CID to break the tie,
\* each peer keeps the edit it merged first: Alice's peer shows hers, Bob's
\* shows his, though both hold the same two blocks. Must fail INV_Converge.
SPECIFICATION Spec
CONSTANTS
  Peers            = {p1, p2}
  MaxBlocks        = 3
  UseCid           = FALSE
  DeleteWins       = FALSE
  DeleteImpliesMap = FALSE
INVARIANT TypeOK
INVARIANT INV_Converge
