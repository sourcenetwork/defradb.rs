\* RED: Quorum 4 = N needs every validator. The cheater withholds its vote, so a contender alone for the slot is never certified (PROP_UncontendedCommits).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Honest <- mcHonest
  Cheaters <- mcCheaters
  Contenders <- mcContenders
  Quorum = 4
  VoteOnce = TRUE
  ActOnCert = TRUE
INVARIANT TypeOK
PROPERTY PROP_UncontendedCommits
