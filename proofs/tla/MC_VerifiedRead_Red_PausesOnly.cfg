\* patience counts only the pauses: a slow busy node carries asks past BUSY_PATIENCE (INV_AttemptsBounded)
\* RED: the patience counts only the time slept in pauses and forgets the
\* requests' own time, as a count of asks would. A slow node that takes 2
\* steps to answer busy each time lets the read sleep five 1-step pauses,
\* well inside a patience of 15 by that count, while 15 steps have really
\* passed: the read is asked again after its patience ran out. Must fail
\* INV_AttemptsBounded.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 0
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = TRUE
  MaxBusy     = 8
  RetryBusy   = TRUE
  Patience    = 15
  MaxTook     = 2
  PauseMin    = 1
  PauseMax    = 2
  CountTook   = FALSE
  CheckDrawn  = TRUE
  MaxStale    = 0
  CheckFresh  = TRUE
  WaitFresh   = TRUE
INVARIANT TypeOK
INVARIANT INV_AttemptsBounded
