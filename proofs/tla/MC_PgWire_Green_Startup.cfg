\* GREEN: the code as written, through the opening and the startup. A client
\* that may start TLS directly, send SSL and GSS requests (again and again),
\* stay silent, send a startup for an anonymous or a DID user or a cancel
\* request, then a good or a wrong token, queries and extended messages, and
\* close at any time, five messages in all, over a clock of four ticks with a
\* startup limit of two. Every handler may succeed or fail, fatally or not.
\* Every invariant and the liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  Limit              = 2
  MaxTime            = 4
  MaxMsgs            = 5
  PreMsgs            = {"tls", "ssl", "gss", "anon", "did", "cancel"}
  PostMsgs           = {"pwOk", "pwBad", "query", "ext"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_StartupWithinDeadline
INVARIANT INV_StartedNeverTimedOut
INVARIANT INV_NoQueryBeforeStartup
INVARIANT INV_SkipUntilSync
INVARIANT INV_SyncResumes
INVARIANT INV_CopyEnds
INVARIANT INV_NothingAfterEnd
PROPERTY LIVE_Ends
CHECK_DEADLOCK FALSE
