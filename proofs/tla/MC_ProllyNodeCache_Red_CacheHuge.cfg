\* The bug: the cache takes a node bigger than its whole budget. To fit it,
\* it evicts every other node, and then the huge node too. HugeEvictsNothing
\* fails.
SPECIFICATION Spec
CONSTANTS
  ReadPending = TRUE
  Evict = TRUE
  SkipHuge = FALSE
  KeepOnFail = TRUE
  FlushFirst = TRUE
INVARIANT HugeEvictsNothing
CHECK_DEADLOCK FALSE
