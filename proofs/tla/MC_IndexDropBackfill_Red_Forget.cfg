\* RED: a crash while the drop deletes entries, and a restart that does not
\* look at the drop record. The drop never finishes and the rest of its
\* entries stay on disk (LIVE_DropFinishes).
SPECIFICATION Spec
CONSTANTS
  Docs = {1, 2}
  RecordMode = "Clear"
  FailMode = "Checked"
  EntryMode = "AfterDefinition"
  ResumeMode = "Forget"
PROPERTY LIVE_DropFinishes
CHECK_DEADLOCK FALSE
