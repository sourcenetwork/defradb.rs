\* RED: a run of the teardown that ends early (the runtime task panics or is
\* refused, or a caller running it in place is cancelled) keeps the lead.
\* Nobody runs the rest, and the caller that stays waits forever. Must fail
\* LIVE_ShutdownTerminates.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
  P2PFirst        = TRUE
  RequestsFirst   = TRUE
  CommitsAdmitted = TRUE
  EndsOpenTransactions = TRUE
  WaitersWait     = TRUE
  HandsBackLead   = FALSE
  RerunCompletesClose = TRUE
PROPERTY LIVE_ShutdownTerminates
CHECK_DEADLOCK FALSE
