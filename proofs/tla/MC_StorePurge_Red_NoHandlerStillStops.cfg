\* run-all: StorePurge.tla RED
\* a refused purge stops the node anyway (INV_RefusedPurgeTouchesNothing)
\* RED: a node with no purge handler answers 501 but stops anyway, so a
\* refused purge takes the node down. Must fail INV_RefusedPurgeTouchesNothing.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Developments = {TRUE}
  Handlers = {FALSE}
  HeldElsewhere = {FALSE}
  OtherCallers  = {FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = TRUE
  HandlerChecked           = FALSE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
  SignerHeld               = TRUE
INVARIANT INV_RefusedPurgeTouchesNothing
CHECK_DEADLOCK FALSE
