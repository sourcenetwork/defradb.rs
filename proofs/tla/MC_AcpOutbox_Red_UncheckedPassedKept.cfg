\* RED: an unchecked change that waits for authority is passed by a later
\* change of its tuple and kept. The owner stages an add while the provider
\* is down, signed with a delegation that expires. The owner's later delete
\* passes it and lands. Fresh authority then arrives for the add, it is sent
\* after the delete, and the tuple is back though the delete committed last.
\* Must fail INV_RevokedAtCommit.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c"}
  Auths                    = {"node", "deleg"}
  Preexisting              = TRUE
  InitTuples               = {"g"}
  MaxCrashes               = 1
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "pass"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
INVARIANT INV_RevokedAtCommit
CHECK_DEADLOCK FALSE
