\* RED: a dropped ticket serves the next one at once, before its turn. A call
\* drops ticket 1 while ticket 0 runs: ticket 2's turn comes and it starts
\* beside ticket 0, overtaking nothing it should not but running two at once.
\* Must fail INV_OneRunning.
SPECIFICATION Spec
CONSTANTS
  Calls      = {c1, c2, c3}
  Recheck    = TRUE
  SkipOnTurn = FALSE
INVARIANT INV_OneRunning
CHECK_DEADLOCK FALSE
