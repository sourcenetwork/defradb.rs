\* GREEN: clients stage changes over HTTP in their own transactions, each
\* under the verified delegation it presents, beside changes an embedder
\* stages. The creator and an actor without authority stage adds and
\* deletes; the delegation expires once, so a staged change can lapse
\* before it is settled and wait for authority; transactions roll back, the
\* node crashes and the drainer sends through the worker's journal. Every
\* client's change acts as its credential's DID and was checked, and every
\* safety property holds.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"deleg"}
