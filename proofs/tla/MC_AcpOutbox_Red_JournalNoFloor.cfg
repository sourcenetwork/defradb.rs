\* run-all: AcpOutbox.tla RED
\* a note of an earlier request with the same bytes settles a change that was never sent (INV_SettledTookEffect)
\* RED: a note found by digest is taken whatever its sequence. The creator
\* grants the same tuple in two transactions under the node's key, so the
\* second request has the bytes of the first. The first is resolved by
\* another command and noted under its digest. The drainer marks the second
\* change with that digest and the node crashes before the request is
\* journaled. Taking the first request's note, the drainer deletes the
\* second change's record as settled though its request was never sent.
\* Must fail INV_SettledTookEffect.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c"}
  Auths                    = {"node"}
  Preexisting              = TRUE
  InitTuples               = {"g"}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = TRUE
  Note                     = TRUE
  Floor                    = FALSE
  Captured                 = TRUE
  Remote                   = FALSE
  ActorFromCredential      = TRUE
  RemoteCheck              = TRUE
  RemoteAuthority          = TRUE
  HeldKeys                 = {}
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT INV_SettledTookEffect
CHECK_DEADLOCK FALSE
