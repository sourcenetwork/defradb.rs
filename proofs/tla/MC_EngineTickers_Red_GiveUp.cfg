\* RED (guard: the loop goes round after a lost swap): publish gives up after
\* one lost swap. A read that saw 1 commit wins 0 -> 1 just before the close,
\* which saw 2, tries 0 -> 2; the close loses, gives up, and leaves the map
\* with its second commit never claimed: nobody will ever add it. One read,
\* one export, two counts. Must fail INV_ClosedComplete.
SPECIFICATION Spec
CONSTANTS
  NS           = 1
  NR           = 1
  MaxCount     = 2
  Forward      = TRUE
  ClaimByCas   = TRUE
  Retry        = FALSE
  Refresh      = TRUE
  PublishFirst = TRUE
  HoldStats    = TRUE
  OnlyGrow     = TRUE
  OwnStats     = TRUE
  StopFirst    = TRUE
INVARIANT TypeOK
INVARIANT INV_ClosedComplete
CHECK_DEADLOCK FALSE
