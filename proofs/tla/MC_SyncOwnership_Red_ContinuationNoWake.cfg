\* RED (#2307): Green_Memory with the continuation's wake left out (MergeTurn
\* before the fix). After the restart d2's head waits on its durable record
\* while a pull-sync continuation of d2 holds the map's one place. The
\* continuation's turn ends without yielding and its entry leaves, but nothing
\* wakes the sweep: the place stands empty, with d2 waiting for it, until the
\* sweep's next tick. Fails INV_FreedPlaceArmed.
SPECIFICATION MFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs             = {d1, d2}
  Cols             = {}
  MaxV             = 1
  Cap              = 2
  FetchCap         = 1
  SenderMode       = "MarkerRederive"
  RegisterMode     = "Durable"
  FlightMode       = "SingleFlight"
  AckGuardMode     = "HeadCurrent"
  ServeMode        = "DurableDerived"
  ProviderMode     = "OriginBound"
  OriginAuthMode   = "TransportBound"
  FetchMode        = "RootThenSelective"
  StreamMode       = "DrainResponse"
  CompletionMode   = "LatchedDrain"
  PendingMode      = "ScopeCurrent"
  MergeMode        = "SerializedBatch"
  MemCap           = 1
  RotateAfter      = 1
  Dead             = {d1}
  PullScopes       = {d2}
  OverflowMode     = "Rotate"
  ContinuationMode = "EndOnStop"
  AdmissionMode    = "TwoTier"
  PeerScopes       = {{d1}, {d2}}
  DurableQuota     = 1
  WakeMode         = "NoContinuationWake"
INVARIANT INV_MemoryTypeOK
INVARIANT INV_FreedPlaceArmed
