\* run-all: AddView.tla RED
\* The policy check is left out of the core: an @policy naming a policy the node does not hold still gets its views (INV_NoViewUnlessAllChecksPass)
\* RED: the core skips the policy check, and both ways in forward to it, so
\* an @policy naming a policy the node does not hold is not refused and its views are created.
SPECIFICATION Spec
CONSTANTS
  Views = {"a", "b"}
  CoreChecks = {"nac", "sdl", "one", "cid", "chunk", "downsample", "identity"}
  ServerChecks = {"nac", "sdl", "one", "cid", "chunk", "downsample", "identity"}
  DocumentAcp = {"node", "server"}
  CreateMode = "Atomic"
  BuildFirst = FALSE
INVARIANT INV_NoViewUnlessAllChecksPass
CHECK_DEADLOCK FALSE
