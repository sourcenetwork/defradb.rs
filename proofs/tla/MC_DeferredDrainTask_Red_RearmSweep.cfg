\* RED: every pass restarts the sweep timer. The hot index wakes the task before
\* each second tick, the sweep is never due, and the quiet index, which failed once
\* and waits for the sweep, owes work forever (PROP_QuietSettles).
SPECIFICATION Spec
CONSTANTS
  Poison = 1
  Hot = 2
  Quiet = 3
  Interval = 2
  Isolate = "On"
  KeepFailed = "On"
  Requeue = "On"
  PurgeRequests = "On"
  SweepTimer = "Rearm"
  SweepFirst = "On"
PROPERTY PROP_QuietSettles
CHECK_DEADLOCK FALSE
