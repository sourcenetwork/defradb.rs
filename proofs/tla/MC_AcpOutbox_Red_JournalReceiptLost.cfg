\* receipt and note can no longer be read: the drainer sends a landed change again (INV_AtMostOneEffect)
\* RED: AssumeReceiptRetrievable is off for the drainer. A request lands and
\* leaves the journal; before the drainer asks, its receipt and the note's
\* entry for it can no longer be read. The marked change is decided as never
\* sent, is sent again and takes effect twice: the mark and the journal give
\* at most one effect only while a receipt, the journal entry or the note
\* can still be read. Must fail INV_AtMostOneEffect.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 1
  Subjects                 = {"g"}
