\* RED, as a witness and with no bug planted: a transfer or an archive
\* finalized between the confirmation read and the local commit is not caught,
\* as the code cannot catch it (the provider and the local commit share no
\* order). If this ever passed, the model would be stricter than the code.
\* Must fail WindowClosed.
SPECIFICATION Spec
CONSTANT Bug = "none"
INVARIANT WindowClosed
CHECK_DEADLOCK FALSE
