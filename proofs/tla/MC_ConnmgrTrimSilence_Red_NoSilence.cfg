\* The bug: the manager trims whenever the node is over high water, with no
\* silence period. A peer dials in right after a trim, the node is over high
\* water again, and the next pass trims at once: the node churns.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers = {p1, p2, p3}
  Low = 1
  High = 2
  Silence = 3
  MaxTime = 6
  Mode = "noSilence"
INVARIANTS TypeOK INV_TrimsSpaced
