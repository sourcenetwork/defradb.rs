\* RED: stopping the Vera node leaves its transports open. A provider that
\* outlives the node keeps the method table, and with it the lock on the
\* directory. Must fail INV_StoppedNodeFreesDirectory.
SPECIFICATION Spec
CONSTANTS
  NoDecisionCache   = TRUE
  StopAfterRequests = TRUE
  StopDeadline      = TRUE
  StartDeadline     = TRUE
  ClosesLink        = FALSE
INVARIANT INV_StoppedNodeFreesDirectory
CHECK_DEADLOCK FALSE
