\* RED: a page is read and its cursor written, but what it found lost never
\* reaches the outbox. The pass ends and the node reopens with lost records
\* nobody owes. Must fail INV_NothingLost.
SPECIFICATION Spec
CONSTANTS
  Records       = 3
  Revoked       = {2, 3}
  PageSize      = 2
  MaxTakeovers  = 2
  MaxCrashes    = 1
  Gate          = TRUE
  HandOver      = FALSE
  OweFirst      = TRUE
  EndFromLedger = TRUE
  SaysDone      = TRUE
  TermFence     = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingLost
INVARIANT INV_RevocationDenies
PROPERTY LIVE_RecoveryEnds
