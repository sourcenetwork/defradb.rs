\* RED: the writer ends the stream on a frame it cannot send, as it did
\* before #2820. The large control message takes every frame queued behind
\* it, and no one is told. Expect INV_NoSilentLoss to be violated.
SPECIFICATION Spec
CONSTANTS
  FrameLimit = 13
  TopicLen = 3
  Overhead = 2
  Size <- MCSize
  Control <- MCControl
  LimitMatched = TRUE
  Fallback = TRUE
  SkipOversize = FALSE
  ReportLoss = TRUE
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
INVARIANT INV_NoSilentLoss
INVARIANT INV_BroadcastFits
