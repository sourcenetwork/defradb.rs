\* run-all: UpdateJournalRetention.tla RED
\* RED: a truncate ends by emptying the journal and setting its head back to
\* 0. The next row takes cursor 1 again, below a cursor the reader already
\* saved, so the reader never reads it and is never told.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS MaxRows = 3 Slice = 2 Limit = 2 Truncators = {t1} Mode = "reset"
INVARIANT INV_NoSilentGap
