\* RED (m), caller contract C3 broken: a pool that is already closing registers
\* itself (or is shut down by another holder during the call). c1 stops p1, then
\* p1's make_default finds the slot empty, swaps p1 in and answers "yes", yet
\* default_pool() passes over the closing p1. One pool and one caller. Must fail
\* INV_MakeDefaultTellsTruth.
SPECIFICATION Spec
CONSTANTS
  NP                 = 1
  NC                 = 1
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = FALSE
INVARIANT TypeOK
INVARIANT INV_MakeDefaultTellsTruth
CHECK_DEADLOCK FALSE
