\* RED: retain takes a hold whether or not the key is there. Holder a holds
\* and gives back the DID, so its key is gone; holder b retains it anyway and
\* is told it holds a key the store does not have, so b's signed requests
\* fail. Must fail INV_KeyWhileHeld.
SPECIFICATION Spec
CONSTANTS
  Holders         = {a, b}
  Contexts        = {a, b}
  PinSig          = a
  NoSigner        = none
  MaxSlots        = 2
  AtomicSwap      = TRUE
  CountHolds      = TRUE
  ClearKeepsSlots = TRUE
  ClearKeepsHeld  = TRUE
  RetainNeedsKey  = FALSE
  RefuseOther     = TRUE
  PinRefusesHeld  = TRUE
  SameByContext   = TRUE
INVARIANT INV_KeyWhileHeld
CHECK_DEADLOCK FALSE
