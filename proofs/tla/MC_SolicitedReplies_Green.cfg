\* GREEN, mux 0.1: expect before sending, take one expectation per admitted stream,
\* prune only expired entries and only on the endpoint task. No stream is
\* admitted when no reply is owed, and no owed reply is refused.
SPECIFICATION Spec
CONSTANTS
  MaxReq = 3
  MatchMode = "Match"
  TakeMode = "Decrement"
  PruneMode = "ExpiredSerial"
  SendMode = "ExpectFirst"
  ExpiredMode = "Reset"
  Mux = "V1"
  ReplyMode = "RequestStream"
  RespMode = "Refuse"
INVARIANT INV_TypeOK
INVARIANT INV_NoUnsolicitedAdmitted
INVARIANT INV_SolicitedAdmitted
INVARIANT INV_NoReplyStreamOnV2
