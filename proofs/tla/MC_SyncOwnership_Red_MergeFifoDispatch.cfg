\* RED (the old rule): the clock hands a dispatch to the merge loop through
\* its one channel and may take only a free cell that no waiting sender is
\* owed (try_reserve). In a catch-up storm the channel stays full: every cell
\* the merge loop frees goes to the sender waiting for it, and the next
\* sender waits again before the clock looks. An acknowledged head is never
\* dispatched, and LIVE_AckedRootMerged fails, even with a clock that is
\* strongly fair.
SPECIFICATION WStrongClockSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1}
  Cols           = {}
  MaxV           = 1
  Cap            = 1
  FetchCap       = 1
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MaxAttempts    = 3
  AttemptMode    = "PerAttempt"
  RearmMode      = "AttemptEnd"
  ExpiryMode     = "AckRetained"
  Dead           = {}
  Trickle        = {}
  CutoffMode     = "Quantum"
  SharedPeer     = {}
  PeerPermits    = 1
  MaxPulls       = 0
  PermitMode     = "WithSlot"
  DispatchPath   = "MergeFifo"
  HandlerSend    = "TryThenClock"
  LaneTurns      = "Bounded"
  Storm          = TRUE
  FifoCap        = 1
INVARIANT INV_DispatchTypeOK
PROPERTY LIVE_AckedRootMerged
