\* run-all: ChunkSigner.tla GREEN
\* a remote provider checks the signer at the edge, before the merge transaction
\* GREEN: the writer signs a protected article's chunks, R builds none of them,
\* and the remote provider's signer check keeps Alice's chunk and keeps each
\* chunk once. The provider cannot join the transaction, so a revoke after its
\* check is the documented staleness checked by the OutsideTxn RED config; no
\* grant or revoke is interleaved in this run.
SPECIFICATION Spec
CONSTANTS
  CheckParent = TRUE
  Sign = TRUE
  WaitForParent = TRUE
  Provider = "Remote"
  Rebuild = FALSE
  MaxFlips = 0
INVARIANT TypeOK
INVARIANT INV_WriterChunkKept
INVARIANT INV_EachChunkOnce
CHECK_DEADLOCK FALSE
