\* run-all: LensWithVersion.tla RED
\* RED: the commit holds no copy of its lens before it lands, so the lens is
\* known only once the ordered publication owes it. A request that reads the
\* version from storage in between finds no transform
\* (INV_NoMissingTransform).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANT Mode = "noHold"
INVARIANT TypeOK INV_NoMissingTransform
