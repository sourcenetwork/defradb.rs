\* RED (the rule before rotation): an acknowledged root never gives its
\* in-memory entry up. The restart restores d1 first, whose provider never
\* serves; it holds the only entry for good, the sweep finds no room for d2,
\* and d2 is never fetched although its provider serves:
\* LIVE_DurableRootMerged fails.
SPECIFICATION MFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs             = {d1, d2}
  Cols             = {}
  MaxV             = 1
  Cap              = 2
  FetchCap         = 1
  SenderMode       = "MarkerRederive"
  RegisterMode     = "Durable"
  FlightMode       = "SingleFlight"
  AckGuardMode     = "HeadCurrent"
  ServeMode        = "DurableDerived"
  ProviderMode     = "OriginBound"
  OriginAuthMode   = "TransportBound"
  FetchMode        = "RootThenSelective"
  StreamMode       = "DrainResponse"
  CompletionMode   = "LatchedDrain"
  PendingMode      = "ScopeCurrent"
  MergeMode        = "SerializedBatch"
  MemCap           = 1
  RotateAfter      = 1
  Dead             = {d1}
  PullScopes       = {d2}
  OverflowMode     = "Retained"
  ContinuationMode = "EndOnStop"
  AdmissionMode    = "TwoTier"
  PeerScopes       = {{d1}, {d2}}
  DurableQuota     = 1
INVARIANT INV_MemoryTypeOK
PROPERTY LIVE_DurableRootMerged
