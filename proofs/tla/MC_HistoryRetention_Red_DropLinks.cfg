\* run-all: HistoryRetention.tla RED
\* #559: deleting the field blocks kept composites link loses a live value (INV_KeptLinksStored)
\* Bug planted: the prune does not retain the field links of composites inside the window.
\* c3 stays, but its field block f3 is reclaimed because c3 itself is not a field head.
\* INV_KeptLinksStored fails on f3 even though every field head is retained.
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Keep"
  FieldMode = "Keep"
  LinkMode = "Drop"
  ScanMode = "Validated"
  MarkerMode = "Keep"
  WindowMode = "Exact"
  ReclaimMode = "Scan"
  ReadMode = "Refuse"
  MaxPrunes = 2
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned INV_Reclaimed INV_KeptLinksStored
CHECK_DEADLOCK FALSE
