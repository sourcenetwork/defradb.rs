\* run-all: OwnerTransfer.tla RED
\* a transfer sent again after a crash is reported refused though it took effect (INV_RefusedTookNoEffect)
\* RED: no journal and no owner check. The transfer lands, the node
\* crashes before deleting its record, and it is sent again; the deployment
\* refuses the second one, the creator owning nothing any more, and the node
\* parks the transfer as refused though it took effect. Must fail
\* INV_RefusedTookNoEffect.
SPECIFICATION Spec
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = TRUE
  CommitConflict = TRUE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = FALSE
  OwnerConfirms  = FALSE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {}
  MaxFails       = 2
  MaxCrashes     = 1
  MaxLapses      = 1
  MaxAborts      = 1
  OwnTransfer    = TRUE
INVARIANT INV_RefusedTookNoEffect
CHECK_DEADLOCK FALSE
