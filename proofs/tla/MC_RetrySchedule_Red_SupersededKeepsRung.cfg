\* RED: an acknowledgement restarts the peer clock only when its marker
\* generation is still current. A newer write registers the document again
\* while its push is in flight; the peer acknowledges the older push, the
\* fence turns the completion away, and the escalated rung stays.
\* ACT_DeliveryRestarts fails.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder         <- mcLadder
  Steps          = {}
  Scopes         = {d, p}
  Poison         = {p}
  RestartOn      = {"LiveAck", "ReplayAck"}
  BoundDeadlines = TRUE
INVARIANT TypeOK
PROPERTY ACT_DeliveryRestarts
