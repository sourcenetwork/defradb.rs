\* RED: a parked block whose merge fails for now (a store error, a key B does
\* not hold) is set aside for good. Built with the type, B's replay meets the
\* failure once, drops the block's record and never tries again, so B keeps
\* an older value than A. Must fail INV_ConvergeWhenDone.
SPECIFICATION Spec
CONSTANTS
  MaxBlocks = 2
  MaxVal    = 2
  Mode      = "FailStall"
INVARIANT INV_ConvergeWhenDone
CHECK_DEADLOCK FALSE
