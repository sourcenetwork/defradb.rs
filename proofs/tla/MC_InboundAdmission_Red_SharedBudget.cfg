\* RED: one byte budget for every class. Three stuck bulk bodies fill the
\* shared pool, so the healthy control message is reset every time it asks.
\* Expect LIVE_HealthyHandled to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  ConnOf <- mcConnOf
  PeerOf <- mcPeerOf
  ClassOf <- mcClassOf
  LaneOf <- mcLaneOf
  Classes <- mcClasses
  Lanes <- mcLanes
  Healthy = "h1"
  Stalls <- mcStalls
  Trickles <- mcTrickles
  StuckClasses <- mcStuckClasses
  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "Shared"
  ShareMode = "PerPeer"
  DrainMode = "PerLane"
  LeaseMode = "UntilHandled"
  ReadMode = "AdmitFirst"
  DeadlineMode = "Deadline"
  ReadDeadlineMode = "Deadline"
INVARIANT INV_TypeOK
PROPERTY LIVE_HealthyHandled
