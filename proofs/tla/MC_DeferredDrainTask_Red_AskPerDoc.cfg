\* a batch registers a commit callback per document it owes (INV_OneAsk)
\* RED: a batch asks for the drain once per document it owes, so a 10k-document
\* batch registers 10k commit callbacks instead of one (INV_OneAsk).
SPECIFICATION Spec
CONSTANTS
  Poison = 1
  Hot = 2
  Quiet = 3
  Interval = 2
  Isolate = "On"
  KeepFailed = "On"
  Requeue = "On"
  PurgeRequests = "On"
  SweepTimer = "Fixed"
  SweepFirst = "On"
  AskOnce = "PerDoc"
INVARIANT INV_OneAsk
CHECK_DEADLOCK FALSE
