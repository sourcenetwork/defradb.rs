\* run-all: CreateGate.tla RED
\* the creator reads a gated document while it is owed
\* Lets the creator read its document while Vera does not hold it, as the
\* ungated overlay does; if Vera then refuses, the creator read a document it
\* may not create. Fails INV_HiddenUntilRegistered.
SPECIFICATION Spec
CONSTANT Bug = "CreatorReadsOwed"
CONSTANT Remote = TRUE
CONSTANT MaxReplicaSends = 2
INVARIANT INV_NoSquat
INVARIANT INV_NoAnonymous
INVARIANT INV_HiddenUntilRegistered
INVARIANT INV_RefusalFinal
INVARIANT INV_ReplicaBounded
CONSTRAINT StateBound
CHECK_DEADLOCK FALSE
