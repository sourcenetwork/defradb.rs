\* RED: document ACP is read from the latest commit instead of the caller's
\* transaction, as the code did before #2724's fix (an unbound provider). The
\* caller revoked its own access in its transaction, the unbound ACP does not
\* see that, and it hears "verified" (INV_VerifiedAtOnePoint).
SPECIFICATION Spec
CONSTANTS
  InTxn = TRUE
  CheckNac = TRUE
  CheckAcp = TRUE
  CheckBlock = TRUE
  NacAt = "view"
  AcpAt = "latest"
  BlockAt = "view"
  MaxEnv = 2
INVARIANT INV_VerifiedAtOnePoint
CHECK_DEADLOCK FALSE
