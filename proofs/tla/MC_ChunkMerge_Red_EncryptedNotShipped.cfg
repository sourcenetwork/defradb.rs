\* RED: the bug plants a merge that skips an encrypted text's chunks, as the
\* fix does, while those chunks do not travel with the article. A peer that
\* merges another peer's encrypted text holds it live with none of its chunks
\* and none on their way (INV_TextChunksStored).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = FALSE
  DeleteRule = "wait"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = TRUE
  Encrypt = TRUE
  Ship = FALSE
INVARIANT INV_TextChunksStored
CHECK_DEADLOCK FALSE
