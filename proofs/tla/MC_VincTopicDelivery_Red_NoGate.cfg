\* RED: the endpoint hands on whatever the hub pushes. A node that subscribed
\* but dialed no one gets a head hint from a node it never met, as if it sat
\* on the publisher's mesh. Must fail INV_NoDeliveryOffMesh.
SPECIFICATION Spec
CONSTANTS
  Nodes         = {a, b}
  RawTopic      = FALSE
  Gate          = FALSE
  RawFirst      = TRUE
  SessionFilter = TRUE
  OwnerCheck    = TRUE
  EngineFilter  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoDeliveryOffMesh
CHECK_DEADLOCK FALSE
