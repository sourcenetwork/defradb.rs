\* RED: a connection on the older mux is dropped without a word to gossip.
\* Gossip asks for a dial to r, the dial lands on r's older mux, and gossip
\* never hears back: it waits on r for good and never asks again. Expect
\* LIVE_AskAnswered to be violated.
SPECIFICATION Spec
CONSTANTS
  Peers <- mcPeers
  Revocable <- mcRevocable
  Healthy = "h"
  Legacy <- mcLegacy
  MaxDrops = 1
  MaxForgets = 1
  ForgetBound = "Bounded"
  PathMode = "SharedMux"
  RecheckMode = "Recheck"
  ForgetMode = "DropSender"
  LegacyMode = "Silent"
PROPERTY LIVE_AskAnswered
