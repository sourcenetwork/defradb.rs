\* run-all: StorePurge.tla RED
\* a memory store keeps the old Vera chain (INV_NothingSurvives)
\* RED: a memory store removes no directory, so the embedded Vera node
\* restarts on its old chain. Must fail INV_NothingSurvives.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Cli"}
  Stores   = {"Memory"}
  Veras    = {"Embedded"}
  Developments = {TRUE}
  Handlers = {TRUE}
  HeldElsewhere = {FALSE}
  OtherCallers  = {FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = FALSE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
  SignerHeld               = TRUE
INVARIANT INV_NothingSurvives
CHECK_DEADLOCK FALSE
