\* schema change owes nothing (INV_IndexMatchesReads)
\* RED: a schema change owes no reindex. After switching the active version
\* across the lens the entry describes the other version, yet nothing is
\* owed and the index answers: INV_IndexMatchesReads fails.
SPECIFICATION Spec
CONSTANTS
  Gate = "owed"
  OweOnSchemaChange = FALSE
  OweOnMerge = TRUE
  SkipIfOwed = FALSE
  ClearChecksToken = TRUE
  ScanRechecksOwed = TRUE
  WalkStamps = FALSE
  MaxSteps = 6
INVARIANT TypeOK INV_IndexMatchesReads INV_SettledIndexAnswers INV_ScanMatchesReads INV_ReadsFollowWrites
CHECK_DEADLOCK FALSE
