\* RED: the bug plants signed chunk blocks, so a chunk's ID names the peer
\* that built it. Two peers build the chunks of one text, one sends its copy to
\* the other, and the reader there shows that chunk twice (INV_EachChunkOnce).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = FALSE
  DeleteRule = "wait"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = FALSE
INVARIANT INV_EachChunkOnce
CHECK_DEADLOCK FALSE
