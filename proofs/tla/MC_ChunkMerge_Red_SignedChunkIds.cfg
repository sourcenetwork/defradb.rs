\* RED: the bug plants signed chunk blocks, so a chunk's ID names the peer
\* that built it. Two peers build the chunks of one text, one sends its copy to
\* the other, which now stores that chunk as two documents
\* (INV_PlainChunkStoredOnce). Its reader still shows one of them.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = FALSE
  DeleteRule = "wait"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = FALSE
  Encrypt = FALSE
  Ship = TRUE
  OneCopy = TRUE
INVARIANT INV_PlainChunkStoredOnce
CHECK_DEADLOCK FALSE
