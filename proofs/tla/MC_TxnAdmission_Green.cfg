\* GREEN: the code as written. The FFI registry is in embedder mode, HTTP keys
\* by identity, and work runs as the request's own identity. Every caller,
\* surface and transaction the model tries must keep every invariant.
SPECIFICATION Spec
CONSTANTS
  EmbedderMode  = TRUE
  IdentityKey   = TRUE
  ActsAsRequest = TRUE
INVARIANT TypeOK
INVARIANT INV_FfiReaches
INVARIANT INV_HttpOwnerOnly
INVARIANT INV_ActsAsCaller
CHECK_DEADLOCK FALSE
