\* run-all: UpdateJournalRetention.tla RED
\* RED: a write whose once key is already held adds another row. Merging the
\* same block twice therefore gives one write two rows in the journal.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS MaxRows = 3 Slice = 1 Limit = 2 Truncators = {t1} Blocks = {b1} MaxLives = 1 Mode = "duplicate"
INVARIANT INV_OneRowPerWrite
