\* Isolates the assumption rather than the receiver: arrival-order registration
\* is sound when the link really is ordered and never duplicates.  Compare
\* MC_Transport_Red_ReorderOverwrite, which changes only LinkMode.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxHead <- mcMaxHead
  MaxLoss <- mcMaxLoss
  LinkMode     = "Ordered"
  DupMode      = "Dedup"
  ReplyMode    = "NewStream"
  RouteMode    = "Routable"
  TimeoutMode  = "Ambiguous"
  RegisterMode = "LastArrived"
INVARIANT INV_TypeOK
INVARIANT INV_RegisteredMonotone
INVARIANT INV_ObligationIdempotent
