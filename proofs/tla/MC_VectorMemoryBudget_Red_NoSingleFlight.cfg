\* run-all: VectorMemoryBudget.tla RED
\* every search reloads, taking over a running reload of its own generation
\* RED: every search that finds the codes out of date reloads them, so a second search takes over a reload of the same generation that was still running and throws its work away (INV_ClaimLostOnlyToNewer).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Searches = {s1, s2, s3}
          Limit = 2
          Codes = 3
          MaxGen = 3
          AtomicTake = TRUE
          ReleaseOnDrop = TRUE
          DropOldFirst = TRUE
          NoMissesWhileLoading = TRUE
          SingleFlight = FALSE
          OwnedFinish = TRUE
          OwnedStep = TRUE
          OwnedAbandon = TRUE
          NoPendingWhileLoading = TRUE
INVARIANT INV_BudgetHolds
INVARIANT INV_Accounted
INVARIANT INV_FullLoad
INVARIANT INV_ClaimLostOnlyToNewer
INVARIANT INV_NoTakeAfterLoss
INVARIANT INV_NoClaimClearedByStaleAbandon
SYMMETRY Symmetry
