\* run-all: DocSyncCompletion.tla GREEN
\* GREEN: the fix, with two peers that may answer for d1 with heads the node already merged, while d2 may still have heads to send. The reply handler reports d1 as merged, so once every answer is handled and every report read the sync is done; it is still complete only when every asked document merged.
SPECIFICATION Spec
CONSTANTS
  Docs         = {d1, d2}
  Peers        = {p1, p2}
  MaxReports   = 4
  CountReports = FALSE
  FilterAsked  = TRUE
  HeldDocs     = {d1}
  ReportHeld   = TRUE
INVARIANT TypeOK
INVARIANT INV_CompleteMeansEveryDocMerged
INVARIANT INV_DoneOnceEveryDocReported
INVARIANT INV_NoWaitOnceEveryAnswerHandled
CHECK_DEADLOCK FALSE
