\* GREEN: the code as written. The sweep is held in the node's shutdown set,
\* which aborts every task it holds when dropped and waits for none. A node
\* dropped without a shutdown releases its pool once its aborted tasks reach
\* their next poll; a shutdown still stops every task before it returns.
SPECIFICATION Spec
CONSTANTS
  SweepInSet  = TRUE
  AbortOnDrop = TRUE
  DropAwaits  = FALSE
INVARIANT TypeOK
INVARIANT INV_DropNeverWaits
INVARIANT INV_ShutdownStopsEveryTask
PROPERTY LIVE_DroppedNodeReleasesPool
CHECK_DEADLOCK FALSE
