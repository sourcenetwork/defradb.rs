\* RED: an archive is left out of its actor's admission count and the
\* node's but still counts against what its own transaction may stage, as
\* any new change does. A transaction that deletes many documents fills
\* its bound with their archives, and then a change of its own that it
\* asks for afterwards is refused, though it staged nothing else. Must
\* fail INV_DeleteChargesNobody.
SPECIFICATION Spec
CONSTANTS
  CheckPermission  = TRUE
  ArchiveAsOwner   = TRUE
  Drop             = TRUE
  VeraRefuses      = TRUE
  Overlay          = TRUE
  HistoryActorOnly = TRUE
  SpareOnlyDeleter = TRUE
  ArchiveUncounted = TRUE
  ArchiveOffNode   = TRUE
  ArchiveOffTxn    = FALSE
  First            = "archive"
INVARIANT TypeOK
INVARIANT INV_DeleteChargesNobody
