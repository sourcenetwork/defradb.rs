\* RED: a full plan doubles the cap with no limit. Three increments owe the log
\* three entries; the first plan takes one, is full, and the cap grows to two
\* though the largest cap is one. The next plan takes two entries, so a drain's
\* transaction grows with the backlog (INV_PlanBounded).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
  Poisoned = {}
  Carry = "Tail"
  Fixed = "Never"
  MinPlan = 1
  MaxPlan = 1
  Growth = "Uncapped"
  FullCarry = "Carry"
INVARIANT INV_PlanBounded
CHECK_DEADLOCK FALSE
