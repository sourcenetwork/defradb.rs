\* RED: the bug plants a reader that shows every document of a chunk. Two
\* peers write the same text apart and encrypt it, each with a key of its own,
\* so each builds its own document for one chunk. Once one peer's chunks reach
\* the other, the reader there shows that chunk twice (INV_EachChunkOnce).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = FALSE
  DeleteRule = "wait"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = TRUE
  Encrypt = TRUE
  Ship = TRUE
  OneCopy = FALSE
INVARIANT INV_EachChunkOnce
CHECK_DEADLOCK FALSE
