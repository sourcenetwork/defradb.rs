\* RED: a pin replaces the signer of a DID something holds. Holder b holds
\* the DID with its own signer; the process pins it with a's, and b's requests
\* now sign through a signer b never brought. Must fail INV_OwnSigner.
SPECIFICATION Spec
CONSTANTS
  Holders         = {a, b}
  PinSig          = a
  NoSigner        = none
  MaxSlots        = 2
  AtomicSwap      = TRUE
  CountHolds      = TRUE
  ClearKeepsSlots = TRUE
  ClearKeepsHeld  = TRUE
  RetainNeedsKey  = TRUE
  RefuseOther     = TRUE
  PinRefusesHeld  = FALSE
INVARIANT INV_OwnSigner
CHECK_DEADLOCK FALSE
