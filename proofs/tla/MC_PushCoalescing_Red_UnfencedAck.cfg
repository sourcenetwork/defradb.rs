\* RED (F1, the first patch): the frontier rule keeps the marker set over a sibling, but
\* the non-clearing ack is still reported with no generation. Siblings 2 and 3 over 1; 3
\* is sent, the ladder sends both, records {2, 3} and clears the marker, then 3's live ack
\* lands and records {3}. With the marker clear the record stays {3} against a frontier
\* of {2, 3}. Expect: INV_AckRecordCurrent VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  MaxHead <- mcMaxHead
  Parent <- mcSiblings
  QueueMode = "LatestOnly"
  RetryMode = "CurrentOnly"
  CompleteRule = "Unfenced"
INVARIANT INV_TypeOK
INVARIANT INV_AckRecordCurrent
