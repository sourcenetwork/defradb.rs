\* the HTTP import route runs its driver on a database worker (INV_DriverOnCaller)
\* RED: both HTTP servers' route layer runs /backup/import on the worker
\* pool, as it runs the other /backup routes. The handler, and the driver
\* it awaits, run on a database worker, and so does every write's
\* preparation, nested run_on running in place there. Must fail
\* INV_DriverOnCaller.
SPECIFICATION Spec
