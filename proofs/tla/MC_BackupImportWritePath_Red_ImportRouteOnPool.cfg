  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  HoldImport          = TRUE
  DetachedImport      = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  OneByOneOnRefusal   = TRUE
  RegisterEachOnRefusal = TRUE
  RequireNode         = TRUE
  ImportRouteOnEdge   = FALSE
INVARIANT INV_DriverOnCaller
CHECK_DEADLOCK FALSE
