\* RED: a page that stopped at the ledger's byte boundary is taken as the end.
\* The pass closes early and can decide before later pages are handed over.
\* This must fail INV_NoDecisionBeforeHandover.
SPECIFICATION Spec2
CONSTANTS
  Keep         = 1
  MaxTakeovers = 1
  Gate         = TRUE
  GateDelivery = TRUE
  CacheByTerm  = TRUE
  Restage      = TRUE
  Taint        = TRUE
  CheckWindow  = TRUE
  Recover      = TRUE
  RecoverAll   = TRUE
  Mark         = TRUE
  KeepBatch    = TRUE
  MaxCrashes   = 0
  Pages        = 2
  DeliverPage  = TRUE
  PageEndsAtBoundary = FALSE
  SourceCompletion = TRUE
INVARIANT TypeOK
INVARIANT INV_NoDecisionBeforeHandover
