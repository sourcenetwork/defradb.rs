\* run-all: EmbeddedVeraSwitch.tla RED
\* a watch keeps the node while a switch asks for it (LIVE_SwitchEnds)
\* RED: a watch keeps the slot while a writer asks (Held::watch without the
\* asked race). The host watches for a demotion while it asks for a switch:
\* the switch waits for a slot the watch never gives up, so the switch never
\* ends. Fails LIVE_SwitchEnds.
SPECIFICATION Spec
CONSTANTS
  EvictWatch     = FALSE
  AskWithdraws   = TRUE
  AbortOnStop    = TRUE
  SwitchDeadline = TRUE
  ClearsHalted   = TRUE
  RecordsTarget  = TRUE
  Restarts       = TRUE
  LinkShuts      = TRUE
  Reaps          = TRUE
  WaitsRelease   = TRUE
INVARIANT TypeOK
INVARIANT INV_ClosedAfterStop
INVARIANT INV_NoStartAfterStop
INVARIANT INV_SlotRuns
INVARIANT INV_StoppedMeansEnded
INVARIANT INV_DeviceNamesNode
PROPERTY LIVE_NoNodeAfterStop
PROPERTY LIVE_DropStops
PROPERTY LIVE_SwitchEnds
PROPERTY LIVE_WatchWakes
PROPERTY LIVE_StopReturns
PROPERTY LIVE_Recovers
CHECK_DEADLOCK FALSE
