\* RED: the block is read from the latest commit instead of the snapshot.
\* A block written after the snapshot is reported "verified" at a point
\* where it was not there (INV_VerifiedAtOnePoint).
SPECIFICATION Spec
CONSTANTS
  InTxn = FALSE
  CheckNac = TRUE
  CheckAcp = TRUE
  CheckBlock = TRUE
  NacAt = "view"
  AcpAt = "view"
  BlockAt = "latest"
  MaxEnv = 2
INVARIANT INV_VerifiedAtOnePoint
CHECK_DEADLOCK FALSE
