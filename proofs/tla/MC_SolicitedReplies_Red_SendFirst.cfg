\* RED: the request is sent before its expectation is written. A fast peer
\* replies in between, and the owed reply is refused (INV_SolicitedAdmitted).
SPECIFICATION Spec
CONSTANTS
  MaxReq = 3
  MatchMode = "Match"
  TakeMode = "Decrement"
  PruneMode = "ExpiredSerial"
  SendMode = "SendFirst"
  ExpiredMode = "Reset"
  Mux = "V1"
  ReplyMode = "RequestStream"
  RespMode = "Refuse"
INVARIANT INV_SolicitedAdmitted
