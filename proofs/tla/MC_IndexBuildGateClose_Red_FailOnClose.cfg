\* RED: a build stopped by the close goes down the failure path and its
\* record says failed. The next open does not resume a failed build, so the
\* index is never built (LIVE_BuildFinishes).
SPECIFICATION Spec
CONSTANTS
  Docs = 2
  RaceMode = "Race"
  StopMode = "Fail"
  ResumeMode = "Resume"
PROPERTY LIVE_BuildFinishes
CHECK_DEADLOCK FALSE
