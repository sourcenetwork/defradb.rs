\* RED: every attempt draws a fresh short ID, as an engine-retried batch
\* create did before the pipeline. The key fetched for the first
\* attempt is kept under the old ID, so the next attempt misses it and asks
\* again: one field's key is minted twice (INV_OneKeyPerField).
SPECIFICATION Spec
CONSTANTS
  Fields = {"a", "b"}
  MaxAttempts = 4
  StoreMode = "AfterCompute"
  IdMode = "PerAttempt"
  KeySource = "Memo"
  WaveMode = "All"
INVARIANT INV_OneKeyPerField
CHECK_DEADLOCK FALSE
