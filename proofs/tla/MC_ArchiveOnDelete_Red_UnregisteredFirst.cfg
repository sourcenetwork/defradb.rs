\* RED: a read asks whether the deployment has the object before the owed
\* archive. The deployment has dropped the object; the owner deletes the
\* document, and before the archive settles anyone reads it, because an
\* object the deployment does not have is public by the unregistered rule.
\* Must fail INV_DeletedGrantsNothing.
SPECIFICATION Spec
CONSTANTS
  CheckOwner  = TRUE
  Drop        = TRUE
  VeraRefuses = TRUE
  Overlay     = TRUE
  HistoryActorOnly = TRUE
  First       = "unregistered"
INVARIANT TypeOK
INVARIANT INV_DeletedGrantsNothing
