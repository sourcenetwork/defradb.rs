\* RED: the code before #2779. A subscription stream ignores closing, so its response never ends and the drain waits out its whole deadline for it, then stops it (INV_DeadlineStopsNoStream). A stream that should end but whose EndStream never fires is a different bug: Expire then waits for it forever, and LIVE_ServerReturns is what fails.
SPECIFICATION Spec
CONSTANTS
  Conns        = {c1, c2, c3}
  Hangs        = {c2}
  Streams      = {c3}
  Drained      = TRUE
  BetweenOnly  = TRUE
  CheckClosing = TRUE
  Deadline     = TRUE
  EndStreams   = FALSE
INVARIANT TypeOK
INVARIANT INV_NoDropBeforeDeadline
INVARIANT INV_NoNewWorkWhenClosing
INVARIANT INV_DeadlineStopsNoStream
PROPERTY LIVE_ServerReturns
CHECK_DEADLOCK FALSE
