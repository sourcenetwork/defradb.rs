\* RED: a call that names no identity acts as the node, as the in-process
\* default did before #2700. It holds every permission, so the caller with
\* none writes (INV_NoEffectWithoutPermission).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  anon = anon
  node = node
  Bug = "AnonAsNode"
INVARIANT TypeOK
INVARIANT INV_NoEffectWithoutPermission
CHECK_DEADLOCK FALSE
