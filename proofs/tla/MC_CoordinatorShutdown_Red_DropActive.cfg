  SwapFlag         = TRUE
  AtomicSpawn      = TRUE
  RunRefused       = TRUE
  DrainOwnsSender  = TRUE
  WaitForRegistry   = TRUE
  CheckRegistryFlag = TRUE
  KeepActive        = FALSE
  AbortAtDeadline  = TRUE
INVARIANT TypeOK
INVARIANT INV_KeepActive
CHECK_DEADLOCK FALSE
