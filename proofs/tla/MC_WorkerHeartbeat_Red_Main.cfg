\* RED: the code that was on main. The hook writes no heartbeat and the
\* task's stays up until the turn ends, so a slow hook poll after a short
\* task is reported under the task's name. Must fail INV_ReportTrue.
SPECIFICATION Spec
CONSTANTS
  Limit          = 1
  MaxTime        = 5
  MaxPolls       = 3
  HookBeat       = FALSE
  MarkHoldsStart = FALSE
  HookClears     = FALSE
  Recheck        = TRUE
INVARIANT TypeOK
INVARIANT INV_ReportTrue
