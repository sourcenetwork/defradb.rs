\* RED: the code that was on main. The hook shows nothing of its own and the
\* task's heartbeat stays up until the turn ends, so a slow hook poll after
\* a short task is reported under the task's name. Must fail INV_ReportTrue.
SPECIFICATION Spec
SYMMETRY MonSymmetry
CONSTANTS
  Limit          = 1
  MaxTime        = 6
  MaxPolls       = 4
  Watchers       = {m1, m2}
  HookBeat       = FALSE
  MarkNamesPoll  = FALSE
  HookClears     = FALSE
  Recheck        = TRUE
  MarkKeepsLive  = TRUE
  ClaimMax       = TRUE
INVARIANT TypeOK
INVARIANT INV_ReportTrue
