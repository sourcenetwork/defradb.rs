\* GREEN: what the node does before the in-flight mark exists. A pass submits
\* a change and deletes its record once the provider answered; nothing is
\* stored in between, so a crash there leaves the change as never sent and it
\* is sent again. Everything else is the design: owed records belong to their
\* transaction, any owed delete denies, a refused delete keeps denying, the
\* registration settles first, changes go in order and a change awaiting
\* authority holds its tuple. Every safety property holds but
\* INV_AtMostOneEffect, which is left out: MC_AcpOutbox_Red_NoInFlightMarker
\* shows it fail. A change that lands twice lands twice in a row on its tuple,
\* so what readers are given does not change.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g", "*"}
  Actors                   = {"c", "m"}
  Auths                    = {"node", "deleg"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 2
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = FALSE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node", "deleg", "none"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
INVARIANT TypeOK
INVARIANT INV_NoWidening
INVARIANT INV_RevokedAtCommit
INVARIANT INV_RegistrationFirst
INVARIANT INV_RollbackLeavesNothing
INVARIANT INV_OwedDocumentNarrow
INVARIANT INV_DenialsChecked
INVARIANT INV_RefusedChecked
INVARIANT INV_UncheckedYields
INVARIANT INV_FailureReported
INVARIANT INV_AbandonIsFinal
INVARIANT INV_PresentedAuthority
CHECK_DEADLOCK FALSE
