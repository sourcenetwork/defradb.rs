\* RED: JOINED comes from the hub's member list as it is. A node reports a
\* peer it holds no session with as joined, which a gossip mesh never does,
\* and a test waiting for JOINED passes before the peers are connected.
\* Must fail INV_JoinedOnlyLinkedMembers.
SPECIFICATION Spec
CONSTANTS
  Nodes         = {a, b}
  RawTopic      = FALSE
  Gate          = TRUE
  RawFirst      = TRUE
  SessionFilter = FALSE
  OwnerCheck    = TRUE
  EngineFilter  = TRUE
INVARIANT TypeOK
INVARIANT INV_JoinedOnlyLinkedMembers
CHECK_DEADLOCK FALSE
