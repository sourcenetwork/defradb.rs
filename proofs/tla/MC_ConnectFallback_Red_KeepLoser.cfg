\* RED: the losing attempt is left running (as a spawned task would be), not
\* dropped with first_connected's frame. It connects after the answer, and its
\* socket stays open with nobody to use it. Must fail INV_OneSocket.
SPECIFICATION Spec
CONSTANTS
  D              = 1
  CT             = 3
  MaxTime        = 3
  HasFallback    = TRUE
  MayHang        = TRUE
  Limited        = TRUE
  DelayFallback  = TRUE
  StartOnFailure = TRUE
  AwaitOther     = TRUE
  KeepLastError  = TRUE
  DropLosers     = FALSE
  TimeoutAll     = TRUE
INVARIANT TypeOK
INVARIANT INV_OneSocket
CHECK_DEADLOCK FALSE
