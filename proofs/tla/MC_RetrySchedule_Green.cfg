\* GREEN: a live acknowledgement returns the peer clock to the first rung, never
\* later than its deadline; a new marker and a reconnect keep the rung. Three
\* documents, one of which never lands, on a three-rung ladder, through
\* outages and reconnects: a peer that has just taken a delivery is due within
\* the first rung, and a peer that keeps failing waits out every rung it earned.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder    <- mcLadder
  Scopes    = {d, e, p}
  Poison    = {p}
  RestartOn = {"LiveAck"}
INVARIANT TypeOK
INVARIANT INV_DeliveredPeerDueAtFirstRung
INVARIANT INV_SilentPeerBacksOff
