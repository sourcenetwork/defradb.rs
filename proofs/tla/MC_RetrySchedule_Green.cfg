\* GREEN: an acknowledgement, live, live after a newer write, or replayed,
\* returns the peer clock to the first rung, never later than its deadline; a
\* new marker and a reconnect keep the rung; the sweep reads a deadline past
\* the longest rung as due. Three documents, one of which never lands, on a
\* three-rung ladder, through outages, reconnects, backward clock steps and
\* passes cut short by the cap: a delivery leaves the peer due within the
\* first rung, a peer that keeps failing waits out every rung it earned, and
\* no deadline holds a peer past the longest rung.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder         <- mcLadder
  Steps          <- mcSteps
  Scopes         = {d, e, p}
  Poison         = {p}
  RestartOn      = {"LiveAck", "SupersededAck", "ReplayAck"}
  BoundDeadlines = TRUE
INVARIANT TypeOK
INVARIANT INV_HeldWithinLongestRung
PROPERTY ACT_DeliveryRestarts
PROPERTY ACT_SilentPeerBacksOff
