\* RED: a Joined event counts whether or not the topic is still joined. The
\* hub confirms, the engine unsubscribes before the reader takes the event,
\* and the event then marks the left topic confirmed: the next subscribe of
\* it answers "subscribed" before the hub holds its join. Must fail
\* INV_OkOnlyWhenHeld.
SPECIFICATION Spec
CONSTANTS
  Calls            = {c1, c2}
  MaxUnsub         = 1
  MaxHold          = 0
  MaxLost          = 0
  ConfirmCheck     = TRUE
  StillJoined      = FALSE
  Recheck          = TRUE
  Rollback         = TRUE
  ClearOnLeave     = TRUE
  HubTagsLists     = TRUE
  RejoinAfterDrain = TRUE
INVARIANT TypeOK
INVARIANT INV_OkOnlyWhenHeld
CHECK_DEADLOCK FALSE
