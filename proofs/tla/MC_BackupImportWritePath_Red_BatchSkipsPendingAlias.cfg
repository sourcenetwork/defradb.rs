\* RED: the batch does not flush before a document whose alias it already
\* holds. A file naming alias a twice saves both documents in one batch.
\* Must fail INV_NoDuplicateAlias.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  AdmitEachWrite      = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = FALSE
  RequireNode         = TRUE
INVARIANT INV_NoDuplicateAlias
CHECK_DEADLOCK FALSE
