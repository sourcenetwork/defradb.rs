\* run-all: MC_Acp_StaleStore_Red.tla RED
\* stale tuple grants revoked permission
\* RED: the bug planted is a node that records a revocation it received but
\* keeps the revoked tuple in its copy. Alice's read is still allowed there
\* after the revocation arrived, so INV_RevocationConsistent fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  Tuples <- mcTuples
  InitialAuthority <- mcInitialAuthority
  InitiallyKnown <- mcInitiallyKnown
  Grantable <- mcGrantable
  Revocable <- mcRevocable
  NetworkConnected = TRUE
  EnforcementMode = "StaleStore"
INVARIANT TypeOK
INVARIANT INV_RevokedNotAuthoritative
INVARIANT INV_RevocationConsistent
