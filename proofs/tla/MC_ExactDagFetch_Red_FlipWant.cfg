\* Plants a walk where "held" overrides a block asked for by name. The
\* receiver that lost C2 asks for it, but the held C3 above it turns it held,
\* so it is never sent and the receiver keeps asking. INV_RoundsBounded fails.
SPECIFICATION Spec
CONSTANTS
  Liar = FALSE
  MaxRounds = 3
  Bug = "flipwant"
INVARIANT INV_RoundsBounded
CHECK_DEADLOCK FALSE
