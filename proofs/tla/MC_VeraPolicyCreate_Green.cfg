\* GREEN: a send again carries the request's nonce, "already exists" is
\* answered by reading the policy there and adopting it only when it is the
\* request's own, and the creator is part of the id. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Requests = {r1, r2}
  Creators = {c1, c2}
  Defs = {d1, d2}
  Nonces = {n1, n2}
  MaxSends = 2
  Enforced = {"reuse", "adopt", "check", "creator"}
INVARIANT TypeOK
INVARIANT INV_OneRequestOnePolicy
INVARIANT INV_ReturnedIsOwn
INVARIANT INV_NoRefusalOfOwn
INVARIANT INV_NoForeignBlock
CHECK_DEADLOCK FALSE
