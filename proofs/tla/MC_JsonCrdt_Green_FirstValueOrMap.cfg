\* GREEN, first half: the first block written sets a plain value or {}.
\* With MC_JsonCrdt_Green_FirstListOrDelete it covers every state.
\* The design. Two peers write three edits between them across "a",
\* "a.b" and "c": plain values, {}, [] and deletes, swapped in every order the
\* causal buffer allows. Ties are broken by the CID and an update beats a
\* concurrent delete. Every invariant holds. Peer names are symmetric, so a
\* state and its copy with the peers swapped are checked once.
SPECIFICATION Spec
CONSTANTS
  Peers            = {p1, p2}
  MaxBlocks        = 3
  UseCid           = TRUE
  DeleteWins       = FALSE
  DeleteImpliesMap = FALSE
  SharedIds        = FALSE
CONSTRAINT FirstSetsValueOrMap
SYMMETRY PeerSymmetry
INVARIANT TypeOK
INVARIANT INV_Converge
INVARIANT INV_MatchesReplay
INVARIANT INV_DisjointKept
INVARIANT INV_SamePathLww
INVARIANT INV_UpdateWins
INVARIANT INV_TypeClash
INVARIANT INV_ConflictsAreLosers
INVARIANT INV_DeleteCreatesNothing
