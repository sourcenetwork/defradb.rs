\* run-all: NacDacBypass.tla RED
\* an anonymous write decides the bypass for the node's default identity (INV_BypassOnlyWhenGranted)
\* RED: a write decides the bypass for the identity document access control
\* acts as, which for an anonymous request is the node's default identity.
\* On a node started with the NAC owner as that identity, an anonymous
\* update bypasses DAC and changes every document, though an anonymous read
\* gets no bypass (INV_BypassOnlyWhenGranted).
SPECIFICATION Spec
CONSTANTS
  Bug = "DefaultIdentity"
INVARIANT TypeOK
INVARIANT INV_BypassOnlyWhenGranted
CHECK_DEADLOCK FALSE
