\* RED: main before #2379. No index answers once the history has any lens,
\* even after the rebuild settled and the entry matches what reads see, so a
\* query that Go answers from the index scans: INV_SettledIndexAnswers fails.
SPECIFICATION Spec
CONSTANTS
  Gate = "lens"
  OweOnSchemaChange = TRUE
  OweOnMerge = TRUE
  SkipIfOwed = FALSE
  ClearChecksToken = TRUE
  ScanRechecksOwed = TRUE
  MaxSteps = 6
INVARIANT TypeOK INV_IndexMatchesReads INV_SettledIndexAnswers INV_ScanMatchesReads
CHECK_DEADLOCK FALSE
