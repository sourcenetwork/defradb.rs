\* run-all: ClientUniqueAdmission.tla RED
\* planted bug: the equality plan validates a nil writer's filter read of "v", as before #3379 (INV_RefusedOnlyOverItsOwnValue)
\* RED. The bug plants the validated `get` the unique-index equality plan
\* made before #3379. Client 1 writes nil, which the unique index never
\* checks, but first filters for "v" through that plan. Client 2 commits "v"
\* after client 1's snapshot, and client 1's commit loses with "transaction
\* conflict. Please retry" although nobody else can hold nil against it, so
\* the house rule that a query read decides nothing fails
\* (INV_RefusedOnlyOverItsOwnValue). With the fix the read decides nothing:
\* testo txn::unique_filter_read
\* a_nil_writers_unique_filter_read_does_not_fail_the_commit.
