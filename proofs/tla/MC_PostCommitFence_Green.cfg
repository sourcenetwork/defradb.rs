\* run-all: PostCommitFence.tla GREEN
\* post-commit work ignores its own fence and waits for every other fenced commit
\* GREEN: commit 1 is durable before its post-commit work reads; commit 2 may be
\* fenced, but the read waits until commit 2 lands.
SPECIFICATION Spec
CONSTANTS
  WaitOthers = TRUE
INVARIANT TypeOK INV_ReadAfterOwnCommit INV_WaitsForEveryOtherFence
CHECK_DEADLOCK FALSE
