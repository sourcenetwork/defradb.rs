\* GREEN: the design, for a document created here. Two changes may be staged,
\* on a named identity or on "everyone", by the creator or by an actor without
\* authority, signed with the node key or with a delegation that expires once.
\* The node crashes twice. Owed records belong to their transaction, any owed
\* delete denies, a refused delete keeps denying, only the creator's own named
\* grant is honoured while the registration is owed, the registration settles
\* first, changes go in order, a change awaiting authority holds its tuple, a
\* refused change does not hold the rest, the in-flight mark is durable,
\* receipts can be read and nobody else owns the document. Every safety
\* property holds.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g", "*"}
  Actors                   = {"c", "m"}
  Auths                    = {"node", "deleg"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 2
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node", "deleg", "none"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = FALSE
  Note                     = TRUE
  Floor                    = TRUE
  Captured                 = TRUE
  Remote                   = FALSE
  ActorFromCredential      = TRUE
  RemoteCheck              = TRUE
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWidening
INVARIANT INV_RevokedAtCommit
INVARIANT INV_RegistrationFirst
INVARIANT INV_AtMostOneEffect
INVARIANT INV_RollbackLeavesNothing
INVARIANT INV_OwedDocumentNarrow
INVARIANT INV_DenialsChecked
INVARIANT INV_RefusedChecked
INVARIANT INV_UncheckedYields
INVARIANT INV_FailureReported
INVARIANT INV_AbandonIsFinal
