\* RED: a hook poll's report is claimed with a swap of the last claimed
\* word, which only stops the same poll reported twice in a row. Monitor 1
\* reads the first slow hook poll and is held up. Monitor 2 reports it,
\* then reports the second slow hook poll. Monitor 1's swap finds the
\* second poll's word, not its own, and reports the first hook poll again.
\* Must fail INV_HookOnce.
SPECIFICATION Spec
SYMMETRY MonSymmetry
CONSTANTS
  Limit          = 1
  MaxTime        = 6
  MaxPolls       = 4
  Watchers       = {m1, m2}
  HookBeat       = TRUE
  MarkNamesPoll  = TRUE
  HookClears     = TRUE
  Recheck        = TRUE
  MarkKeepsLive  = TRUE
  ClaimMax       = FALSE
INVARIANT TypeOK
INVARIANT INV_HookOnce
