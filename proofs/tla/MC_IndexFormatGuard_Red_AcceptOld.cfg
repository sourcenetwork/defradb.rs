\* RED: the guard accepts an older layout without rebuilding it. An old-layout
\* store opens with no current stamp (INV_StampedAfterOpen).
SPECIFICATION Spec
CONSTANTS
  Collections = {c1}
  RefusesOld = "Off"
  RebuildsLegacy = "Off"
  StampsFresh = "On"
  MutatesOnRefusal = "Off"
INVARIANT INV_StampedAfterOpen
CHECK_DEADLOCK FALSE
