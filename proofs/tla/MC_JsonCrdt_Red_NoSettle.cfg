\* RED: a block goes out with its edits unsettled. Alice writes 5 at "a" and
\* then 1 at "a.b" in one write. She reads {"a": {"b": 1}}, since the set of
\* "a.b" makes "a" a map again, but the block carries both edits as they
\* are: her own 5 at "a" wins the tie with the map her set implies, and the
\* field reads {"a": 5}. Must fail INV_WriteLandsAsRead.
SPECIFICATION Spec
CONSTANTS
  Peers            = {p1, p2}
  MaxBlocks        = 1
  UseCid           = TRUE
  DeleteWins       = FALSE
  DeleteImpliesMap = FALSE
  SharedIds        = FALSE
  MultiPath        = TRUE
  Settle           = FALSE
  ReadAs           = "design"
  Anchor           = TRUE
INVARIANT TypeOK
INVARIANT INV_WriteLandsAsRead
