\* GREEN: four peers, plain or trusted, reply with the same root. One fetch
\* per trust at a time, a trusted reply never waits behind a plain fetch, and a
\* reply after a failed fetch starts the next one.
SPECIFICATION Spec
CONSTANTS
  R = 4
  GuardMode = "Claim"
  ReleaseMode = "Drop"
  KeyMode = "RootTrust"
INVARIANT INV_TypeOK INV_OneFetchPerRoot INV_NoReplyLost
CHECK_DEADLOCK FALSE
