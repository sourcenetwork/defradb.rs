\* RED: the journal drops the request when a deadline passes. A caller that
\* keeps calling finds nothing to send again, and a request the node dropped
\* is never confirmed. Must fail LIVE_RecalledConfirms.
SPECIFICATION SpecRecalled
CONSTANTS
  Resends          = TRUE
  KeepsTrying      = TRUE
  RetainsOnTimeout = FALSE
  NodeDedupes      = TRUE
  Disturbances     = 2
PROPERTY LIVE_RecalledConfirms
CHECK_DEADLOCK FALSE
