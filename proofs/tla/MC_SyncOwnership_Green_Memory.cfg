\* GREEN: two documents are acknowledged durably while the map holds both;
\* the restart then restores into a map of one. d1's provider never serves and
\* d1 sorts first. A root that had its dispatches gives its entry up while
\* another durable root waits, keeping its record, and the sweep resumes after
\* the root it admitted last, so d2 is admitted, fetched and merged. The
\* receiver also pulls d2: a continuation that stops yielding leaves the map.
\* d2's head written after the restart finds the map full of d1: it is
\* acknowledged on its durable record alone, d1 gives its entry up to it, and
\* it merges.
SPECIFICATION MFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs             = {d1, d2}
  Cols             = {}
  MaxV             = 1
  Cap              = 2
  FetchCap         = 1
  SenderMode       = "MarkerRederive"
  RegisterMode     = "Durable"
  FlightMode       = "SingleFlight"
  AckGuardMode     = "HeadCurrent"
  ServeMode        = "DurableDerived"
  ProviderMode     = "OriginBound"
  OriginAuthMode   = "TransportBound"
  FetchMode        = "RootThenSelective"
  StreamMode       = "DrainResponse"
  CompletionMode   = "LatchedDrain"
  PendingMode      = "ScopeCurrent"
  MergeMode        = "SerializedBatch"
  MemCap           = 1
  RotateAfter      = 1
  Dead             = {d1}
  PullScopes       = {d2}
  OverflowMode     = "Rotate"
  ContinuationMode = "EndOnStop"
  AdmissionMode    = "TwoTier"
  PeerScopes       = {{d1}, {d2}}
  DurableQuota     = 1
INVARIANT INV_MemoryTypeOK
INVARIANT INV_MemoryBounded
INVARIANT INV_MemoryHoldsDurable
INVARIANT INV_DurablePeerQuota
INVARIANT INV_ContinuationsNeverAcked
INVARIANT INV_DueOrBackoff
INVARIANT INV_ObligationConservation
INVARIANT INV_SingleFlight
INVARIANT INV_FetchOwnersBounded
PROPERTY LIVE_DurableRootMerged
PROPERTY LIVE_ContinuationEnds
PROPERTY LIVE_WrittenHeadMerged
