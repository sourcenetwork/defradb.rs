\* RED: the bug plants a merge that lets a stored chunk change. A peer sends a
\* new version of a chunk the receiver already has, with a hash that matches
\* the new text, and the merge accepts it, so a chunk changes after it was
\* created (INV_ChunksNeverChange).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CheckEntry0 = TRUE
  CheckHash = TRUE
  Immutable = FALSE
INVARIANT INV_ChunksNeverChange
CHECK_DEADLOCK FALSE
