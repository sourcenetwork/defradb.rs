\* RED: anyone may abandon a refused change. The creator deletes a tuple the
\* provider holds; another owner then takes the document over, so the
\* provider refuses the delete and it is parked, still denying. The grantee
\* the delete names abandons it and reads again, though the creator never
\* took the delete back. Must fail INV_RevokedAtCommit.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"node"}
  Preexisting              = TRUE
  InitTuples               = {"g"}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = FALSE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "anyone"
  Journaled                = FALSE
  Note                     = TRUE
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT INV_RevokedAtCommit
CHECK_DEADLOCK FALSE
