\* GREEN: the code as written. Two pools race to register (the first that runs
\* keeps the slot, the other hears "no" or replaces one that stopped), two
\* callers race to start the default (one start, the other waits for the turn;
\* a failed start passes the turn on), c2 may be a worker thread (answered at
\* once, never waiting), any plain caller may stop a registered pool before it
\* asks, and owners may let their pools go. Two pools and two callers are the
\* smallest instance with both races at once and a stopper whose pool is still
\* named by the slot. Every invariant and both liveness properties must hold.
SPECIFICATION Spec
CONSTANTS
  NP                 = 2
  NC                 = 2
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverHandsOutClosing
INVARIANT INV_FirstRunningWins
INVARIANT INV_RegisteredWins
INVARIANT INV_OneStart
INVARIANT INV_OneDefault
INVARIANT INV_ErrorHonest
INVARIANT INV_StopDeadlineElsewhere
INVARIANT INV_MakeDefaultTellsTruth
INVARIANT INV_WorkerNeverWaits
INVARIANT INV_RegistrationKeepsNothingAlive
PROPERTY LIVE_EveryCallReturns
PROPERTY LIVE_EveryRegisterReturns
CHECK_DEADLOCK FALSE
