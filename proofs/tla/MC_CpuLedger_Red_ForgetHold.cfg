\* RED (i), a caller contract broken: a pool ends without giving its Hold back
\* (the Hold forgotten, or the placer leaked). Pool A holds CPU 0 and ends;
\* pool B shares CPU 0 and ends; every pool is gone, yet CPU 0 reads held for
\* the rest of the process, and no later pool can take it alone. Must fail
\* INV_DoneLeavesNothing.
\* Two CPUs, two pools living once each, one claim alone before sharing:
\* small, and still every interleaving of the scenario above.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 1
  Edges            = {}
  Attempts         = 1
  AtomicTake       = TRUE
  RollBack         = TRUE
  InsertAfterWin   = TRUE
  ShareCounts      = TRUE
  AttemptCap       = TRUE
  KeepWhileRunning = TRUE
  ReleaseOnce      = TRUE
  RunOnHeld        = TRUE
  ReleaseAtEnd     = FALSE
INVARIANT TypeOK
INVARIANT INV_DoneLeavesNothing
CHECK_DEADLOCK FALSE
