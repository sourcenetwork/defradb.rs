\* run-all: EmbeddedVeraSwitch.tla RED
\* a stop during a switch returns while the node's thread still runs (INV_StoppedMeansEnded)
\* RED: the stop returns as soon as the node it took out of the slot has
\* stopped, without waiting for the node directory to be released
\* (HostedNode::stop without host/release.rs released). A switch has told
\* the old node to stop and waits for its thread when the stop begins, or
\* its deadline passes; the switch is dropped, the stop finds the slot
\* empty and says it stopped the node, while that thread still runs and
\* holds the directory: the next start finds the directory in use, and
\* the node's shutdown goes on with a Vera runtime alive on the edge cores. Fails INV_StoppedMeansEnded.
SPECIFICATION Spec
CONSTANTS
  EvictWatch     = TRUE
  AskWithdraws   = TRUE
  AbortOnStop    = TRUE
  SwitchDeadline = TRUE
  ClearsHalted   = TRUE
  RecordsTarget  = TRUE
  ReportFails    = FALSE
  ObservesCommit = TRUE
  Restarts       = TRUE
  LinkShuts      = TRUE
  Reaps          = TRUE
  WaitsRelease   = FALSE
INVARIANT TypeOK
INVARIANT INV_ClosedAfterStop
INVARIANT INV_NoStartAfterStop
INVARIANT INV_SlotRuns
INVARIANT INV_StoppedMeansEnded
INVARIANT INV_DeviceNamesNode
PROPERTY LIVE_NoNodeAfterStop
PROPERTY LIVE_DropStops
PROPERTY LIVE_SwitchEnds
PROPERTY LIVE_WatchWakes
PROPERTY LIVE_StopReturns
PROPERTY LIVE_Recovers
CHECK_DEADLOCK FALSE
