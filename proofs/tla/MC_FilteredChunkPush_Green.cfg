\* GREEN: chunks of a filtered article are replicated, count as filtered with
\* their article, are decided by the article's document, and are not sent when
\* that document is not at hand. Both write paths hand it over. Every live
\* push, replay and retry then sends exactly the chunks of matching articles.
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
INVARIANT TypeOK
INVARIANT INV_NoChunkOfUnmatchedArticle
INVARIANT INV_SettledHasMatchingChunks
CHECK_DEADLOCK FALSE
