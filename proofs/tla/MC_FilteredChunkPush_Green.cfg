\* GREEN: every fix is in. Chunks of a filtered article are replicated, count as
\* filtered, are decided by the article's document, are not sent without it,
\* travel with their article on every path, and a chunk retry without its
\* article ends. Every invariant and both liveness properties hold.
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  StaleMarkers = {a1, a2}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  ReplayAddsParent = TRUE
  ReplayNeedsArticle = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingUnmatched
INVARIANT INV_ChunkOnlyWithItsArticle
PROPERTY LIVE_RetriesEnd
PROPERTY LIVE_ChunkFollowsItsArticle
CHECK_DEADLOCK FALSE
