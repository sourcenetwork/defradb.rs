\* GREEN: the code as written, head hints on an ordinary topic. Two nodes
\* that subscribe, unsubscribe, publish with and without waiting, link and
\* unlink in any order: no engine off the mesh gets a message, every JOINED
\* names a linked member, and a waiting publish never takes the engine off
\* a topic it subscribed to.
