\* GREEN: the code as written, head hints on an ordinary topic. Two nodes
\* that subscribe, unsubscribe, publish and hold the topic, let the hold
\* end, link and unlink in any order: no engine off the mesh gets a message,
\* every JOINED names a linked member on a topic the engine has or holds, an
\* ended hold never takes the engine off a topic it subscribed to, and a
\* held topic stays joined.
SPECIFICATION Spec
CONSTANTS
  Nodes         = {a, b}
  RawTopic      = FALSE
  Gate          = TRUE
  RawFirst      = TRUE
  SessionFilter = TRUE
  OwnerCheck    = TRUE
  HoldKeep      = TRUE
  EngineFilter  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoDeliveryOffMesh
INVARIANT INV_RawNeverDecoded
INVARIANT INV_JoinedOnlyLinkedMembers
INVARIANT INV_EngineKeepsItsTopic
INVARIANT INV_OnlyEngineTopics
INVARIANT INV_HeldIsJoined
CHECK_DEADLOCK FALSE
