\* RED: a check that failed closed publishes a report with no closing reason.
\* An empty report looks like a clean takeover while the node refuses every
\* decision. Must fail INV_ClosedNamed.
SPECIFICATION Spec
CONSTANTS
    Submissions = {1, 2}
    MaxTerm = 2
    MaxFaults = 1
    Publish = TRUE
    AfterAll = TRUE
    Once = TRUE
    KeepOwed = TRUE
    CutOfTerm = TRUE
    NameUnrestorable = TRUE
    NameClosed = FALSE
    Recorded = TRUE
INVARIANT
    TypeOK
    INV_ClosedNamed
