\* RED: a lost commit is reported as an error instead of deciding again, as
\* the manager's write scope did. Of two disables, the loser gets a
\* transaction error, not Go's "already disabled" (INV_RaceLoserHearsAlready).
SPECIFICATION RaceSpec
CONSTANTS
  Enforced = {"configured", "already", "nac", "stored", "acp", "identity", "relation", "target"}
  LiveReEnable = FALSE
  StartReEnables = FALSE
  AlreadyFirst = FALSE
  SplitScope = FALSE
  OutsideGuard = FALSE
  NoRetry = TRUE
  RelOutsideGuard = FALSE
INVARIANT INV_RaceLoserHearsAlready
CHECK_DEADLOCK FALSE
