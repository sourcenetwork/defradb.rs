\* RED: a durable refusal is counted as parked instead of failed.
\* Expect: ACT_OfflineDenialFails VIOLATED.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcPeers
  SlowPeers <- mcSlowPeers
  Weight <- mcWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Release"
  HandleMode = "FixedWorkers"
  FairnessMode = "PerPeerCap"
  ParkMode = "ParkUnreachable"
  OfflineMode = "KeepQueue"
  OfflineAdmission = "ParkDenied"
INVARIANT INV_TypeOK
PROPERTY ACT_OfflineDenialFails
