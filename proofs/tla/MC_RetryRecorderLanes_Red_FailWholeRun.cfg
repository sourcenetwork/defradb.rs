\* run-all: RetryRecorderLanes.tla RED
\* RED: a failed transaction answers every record in it with no marker, as the
\* recorder did before it fell back to single calls. p1's records 1 and 4 run
\* as one transaction; record 4's own call fails, so the transaction fails, and
\* record 1, whose single call would have written its marker, is refused too
\* (INV_FailureCostsOnlyItsRecord).
SPECIFICATION Spec
CONSTANT LaneByPeer = TRUE
CONSTANT OneTxnPerPeer = TRUE
CONSTANT AnswerAfterCommit = TRUE
CONSTANT SinglesOnFail = FALSE
INVARIANT TypeOK
INVARIANT INV_OnePeerAtATime
INVARIANT INV_PeerOrder
INVARIANT INV_AnsweredOnlyWhenDurable
INVARIANT INV_FailureCostsOnlyItsRecord
CHECK_DEADLOCK FALSE
