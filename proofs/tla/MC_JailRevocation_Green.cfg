\* GREEN: membership checks admission and the fork proof, and early blocks are retried. Only admitted keys write, no proven key is merged, and the honest block lands everywhere.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  Peers <- mcPeers
  CheaterKeys <- mcCheaterKeys
  HonestKey <- mcHonestKey
  RestoreKey <- mcRestoreKey
  WriterHome <- mcWriterHome
  Budget <- mcBudget
  CheckMembership = TRUE
  CheckEvidence = TRUE
  RetryOnAdmission = TRUE
  RotateOnRestore = TRUE
  Restores = FALSE
INVARIANT TypeOK
INVARIANT INV_OnlyAdmittedWrite
INVARIANT INV_CheaterWithinBudget
INVARIANT INV_NoMergeAfterProof
PROPERTY PROP_AdmittedWritesLand
