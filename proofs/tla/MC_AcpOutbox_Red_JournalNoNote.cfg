\* RED: whoever resolves a journaled request keeps no note of its outcome.
\* The drainer marks a change with its request's digest and has the request
\* journaled; before it stores the hash its wait is dropped, and the request
\* is sent and resolved by another command. The change now carries only the
\* digest, the journal is empty and nothing records the outcome under that
\* digest: the drainer takes the change for never sent, sends it again, and
\* it takes effect twice. Must fail INV_AtMostOneEffect.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 1
  Subjects                 = {"g"}
  Actors                   = {"c"}
  Auths                    = {"node"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = TRUE
  Note                     = FALSE
  Floor                    = TRUE
  Captured                 = TRUE
  Remote                   = FALSE
  ActorFromCredential      = TRUE
  RemoteCheck              = TRUE
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT INV_AtMostOneEffect
CHECK_DEADLOCK FALSE
