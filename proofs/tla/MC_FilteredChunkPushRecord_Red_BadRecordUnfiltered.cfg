\* run-all: FilteredChunkPushRecord.tla RED
\* an unreadable record decides as an unfiltered one (INV_NothingUnmatched)
\* RED: the bug plants a retry that reads an unreadable record as one with no
\* filter. The retry of the unmatched article sends it to the receiver
\* (INV_NothingUnmatched).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  MaxRestarts = 2
  LookupCanFail = TRUE
  CanCorrupt = TRUE
  AddPairs = TRUE
  RemoveTakesChunks = TRUE
  KeepStoredPair = TRUE
  PersistOnlyNarrows = TRUE
  PersistInOneTxn = TRUE
  BadRecordFailsClosed = FALSE
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
