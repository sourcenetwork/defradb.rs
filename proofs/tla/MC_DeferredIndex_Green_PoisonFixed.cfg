\* GREEN, a broken document fixed later: d1's migration fails until the operator
\* fixes its lens. The drain carries d1 at the tail meanwhile, so once it migrates
\* it drains too: every owed document leaves the log and the entries settle at the
\* live values.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
  Poisoned = {d1}
  Carry = "Tail"
  Fixed = "Eventually"
INVARIANT INV_TypeOK INV_ReadExact INV_SettledIndexExact
PROPERTY PROP_Drains
CHECK_DEADLOCK FALSE
