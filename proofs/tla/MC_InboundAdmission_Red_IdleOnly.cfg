\* RED: reading a body has only an idle deadline. Connection a declares a control
\* body and sends a byte now and then, so the idle timer never fires and the
\* body holds the control budget forever. The healthy message is reset every
\* time it asks. Expect LIVE_HealthyHandled to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  ConnOf <- mcConnOf
  PeerOf <- mcPeerOf
  ClassOf <- mcClassOf
  LaneOf <- mcLaneOf
  Classes <- mcClasses
  Lanes <- mcLanes
  Healthy = "h1"
  Stalls <- mcStalls
  Trickles <- mcTrickles
  StuckClasses <- mcStuckClasses
  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "PerClass"
  ShareMode = "PerPeer"
  DrainMode = "PerLane"
  LeaseMode = "UntilHandled"
  ReadMode = "AdmitFirst"
  DeadlineMode = "Deadline"
  ReadDeadlineMode = "IdleOnly"
INVARIANT INV_TypeOK
PROPERTY LIVE_HealthyHandled
