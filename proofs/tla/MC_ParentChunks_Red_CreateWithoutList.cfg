\* RED: the bug plants a signed create whose blocks were built before the list
\* was added. The list then has no block of its own, so the first update writes
\* its list at priority 1, ties with the list the create stored, and the old
\* list can win. The article keeps its new text with the old text's list
\* (INV_ListMatchesText).
SPECIFICATION Spec
CONSTANTS
  Writers = {w1, w2}
  MaxOps = 2
  Validate = TRUE
  SameTxn = TRUE
  Cascade = TRUE
  CreateListBlock = FALSE
  Lookup = TRUE
INVARIANT INV_ListMatchesText
CHECK_DEADLOCK FALSE
