\* INV_EndsInTime
\* Plants the bug: the deadline never ends the wait. With the provider down the change
\* stays owed and the wait runs past its deadline: INV_EndsInTime fails.
SPECIFICATION Spec
CONSTANTS
  Bug = "noExpiry"
  Patience = 3
  Notifications = TRUE
  MaxTries = 5
INVARIANT INV_EndsInTime
CHECK_DEADLOCK FALSE
