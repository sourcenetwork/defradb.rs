\* run-all: IndexCachePublication.tla RED
\* a create returns before its cache publication ran (INV_ReturnSeesOwn)
\* RED: the create queues its cache publication behind the writer's hook and
\* returns at once, as index create and drop did with OnCommit::Ordered. Its
\* caller's next request reads a cache without the index it just made: a
\* recreate after a drop is refused with "cached schema differs", and a
\* reload that runs before the late publication is undone by it.
SPECIFICATION Spec
CONSTANTS
  PublishMode = "Queue"
  SettleMode = "Commit"
  StatusRead = "Incremental"
INVARIANT INV_ReturnSeesOwn
CHECK_DEADLOCK FALSE
