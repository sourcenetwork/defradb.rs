\* run-all: DeferredVector.tla RED
\* a search keeps graph hits of nodes with a pending entry
\* Plants a search that merges the pending entries but keeps the graph's hit
\* for a node that has one. An updated document shows both its old and new
\* vector, and a deleted one still shows: INV_SearchSeesLatest fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {n1, n2}
          Drains = {d1, d2}
          MaxWrites = 3
          MaxCrashes = 1
          ValidateRead = TRUE
          Supersede = TRUE
          MergePending = TRUE
          DropStale = FALSE
          AskOnCommit = TRUE
          SettleAtOpen = TRUE
INVARIANT INV_SearchSeesLatest
