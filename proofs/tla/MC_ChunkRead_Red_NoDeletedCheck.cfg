\* RED: the bug plants a read check that forgets the article can be deleted.
\* A writer deletes the article, its chunks stay stored, and the next query
\* still shows them (INV_ShownIsLiveAndReadable).
\* A ranking still scores the deleted article (INV_RankedIsBestListed).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = FALSE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = TRUE
  CheckListed = TRUE
  RouteChecksList = TRUE
  RouteOnlyUnruled = TRUE
INVARIANT INV_ShownIsLiveAndReadable
CHECK_DEADLOCK FALSE
INVARIANT INV_RankedIsBestListed
