\* RED: siblings ordered by when they arrived instead of by block ID. Alice
\* and Bob both type a first character into the empty text, so both become
\* right children of the root. Alice's peer saw hers first and puts it first;
\* Bob's peer saw his first and puts his first. They hold the same two blocks
\* and show different text. Must fail INV_Converge.
SPECIFICATION Spec
CONSTANTS
  Peers        = {p1, p2}
  MaxBlocks    = 4
  SiblingKey   = "arrival"
  CausalBuffer = TRUE
  ResolveAt    = "parent"
  PlaceRule    = "fugue"
  NullRule     = "heads"
INVARIANT TypeOK
INVARIANT INV_Converge
