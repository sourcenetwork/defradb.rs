\* GREEN: the pushing peer may hold one of two durable records. The store checks the share
\* against the durable records in the registration's own transaction, so the peer never
\* holds more than its share however its pushes interleave with the view learning of their
\* records; a push past the share is nacked and re-pushed, and every head eventually merges.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Heads     <- mcHeads
  Parent    <- mcNoParents
  Prio      <- mcFlatPrio
  ScopeOf   <- mcOwnScope
  Cap       <- mcShareCap
  Quota     <- mcQuota
  ReplyMode = "NackOnFull"
  CoverRule = "Parent"
  GuardMode = "Committed"
  QuotaMode = "Store"
INVARIANT INV_TypeOK
INVARIANT INV_SuccessImpliesRegisteredOrMerged
INVARIANT INV_NackImpliesUnregistered
INVARIANT INV_PeerQuota
PROPERTY EventuallyAllMerged
