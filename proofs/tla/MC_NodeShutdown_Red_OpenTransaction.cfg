\* RED: shutdown does not end the transactions callers left open. A commit
\* refused at shutdown leaves its transaction open, and an HTTP client cannot
\* discard it: its discard is refused too. The transaction keeps its store
\* transaction in the registry, and regolith's close waits out its 30 s
\* timeout for it, then fails. Must fail INV_CloseWaitsForNoTransaction.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
  RequestsFirst   = TRUE
  CommitsAdmitted = TRUE
  EndsOpenTransactions = FALSE
INVARIANT INV_CloseWaitsForNoTransaction
CHECK_DEADLOCK FALSE
