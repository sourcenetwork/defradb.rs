\* RED: shutdown does not end the transactions callers left open, as
\* defra-node did before #2428 (gents#3291: an HTTP client gone
\* mid-transaction). The transaction keeps its store transaction in the
\* registry's table, and the store's close waits out its 30 s timeout for it.
\* Must fail INV_CloseWaitsForNoTransaction.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
  P2PFirst        = TRUE
  RequestsFirst   = TRUE
  CommitsAdmitted = TRUE
  EndsOpenTransactions = FALSE
  WaitersWait     = TRUE
  HandsBackLead   = TRUE
  RerunCompletesClose = TRUE
INVARIANT INV_CloseWaitsForNoTransaction
CHECK_DEADLOCK FALSE
