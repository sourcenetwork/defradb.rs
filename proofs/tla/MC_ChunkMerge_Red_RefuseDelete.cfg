\* run-all: ChunkMerge.tla RED
\* merge refuses an early chunk delete for good (INV_DeletesNotLost)
\* RED: the bug plants a merge that refuses a blocked chunk delete for good
\* instead of holding it back. The chunk delete reaches a peer before the
\* article's delete, is refused, and that peer keeps a chunk every other peer
\* deleted (INV_DeletesNotLost).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = TRUE
  DeleteRule = "refuse"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = TRUE
  Encrypt = FALSE
  Ship = TRUE
INVARIANT INV_DeletesNotLost
CHECK_DEADLOCK FALSE
