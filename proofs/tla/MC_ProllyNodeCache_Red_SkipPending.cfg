\* run-all: ProllyNodeCache.tla RED
\* a read skips the pending nodes (GetFinds)
\* The bug: a read asks the cache and regolith but not the pending nodes.
\* A node just put, not yet flushed, reads as missing. GetFinds fails.
SPECIFICATION Spec
CONSTANTS
  ReadPending = FALSE
  Evict = TRUE
  SkipHuge = TRUE
  KeepOnFail = TRUE
  FlushFirst = TRUE
  RefuseAfterFail = TRUE
INVARIANT GetFinds
CHECK_DEADLOCK FALSE
