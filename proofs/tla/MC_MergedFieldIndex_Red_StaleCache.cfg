\* RED: a field write leaves the kept read as it was. The second block of the
\* same field then edits the value from before the first block, so the first
\* block's edit is lost (INV_NoLostEdit).
SPECIFICATION Spec
CONSTANTS
  ReadMode = "Before"
  CacheMode = "Keep"
  MaxSteps = 4
INVARIANT INV_NoLostEdit
CHECK_DEADLOCK FALSE
