\* run-all: ChunkRead.tla RED
\* a rescore keeps the last copy of a hash it read (INV_RankedIsBestListed)
\* RED: the bug plants a route that holds one score per hash, the last copy
\* it read, and a rescore that skips reading a held hash. A peer that embeds
\* differently stores a second, farther copy of a chunk the text uses. The
\* route reads both copies, keeps the farther one, and ranks the article
\* below its best current chunk (INV_RankedIsBestListed).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = TRUE
  CheckCut = TRUE
  RouteChecksList = TRUE
  RouteOnlyUnruled = TRUE
  HeldKeepsBest = FALSE
  CheckResolved = TRUE
  CheckOwnApp = TRUE
  CheckDelegationScope = TRUE
INVARIANT INV_RankedIsBestListed
CHECK_DEADLOCK FALSE
