\* RED: the reindex walk writes its entry and overwrites the record without
\* removing the entry the record named. After the clear, a drain moves a document's
\* entry to its new value; the walk then writes the entry for a later value, and the
\* drain's entry stays behind with no record naming it (INV_NoOrphanEntry).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "On"
  WalkRecord = "Overwrite"
  WalkCheck = "WriteConflict"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
  Poisoned = {}
  Carry = "Tail"
  Fixed = "Never"
INVARIANT INV_NoOrphanEntry
CHECK_DEADLOCK FALSE
