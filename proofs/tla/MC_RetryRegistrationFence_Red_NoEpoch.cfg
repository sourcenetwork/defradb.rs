\* run-all: RetryRegistrationFence.tla RED
\* RED: a registration no longer checks that its peer is still at the
\* incarnation it read. A peer removed and added back between the read and the
\* write then gets a marker from its old life (ACT_RegistrationCannotCrossFence).
SPECIFICATION Spec
CONSTANT Peers = {"p1", "p2"}
CONSTANT Background = 1
CONSTANT MaxEpoch = 2
CONSTANT Faults = TRUE
CONSTANT CheckEpoch = FALSE
CONSTANT CheckOrder = TRUE
CONSTANT FanOut = "PerPeer"
INVARIANT TypeOK
PROPERTY ACT_RegistrationCannotCrossFence
CHECK_DEADLOCK FALSE
