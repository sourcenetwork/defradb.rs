\* RED (F1 class): h's admission of h1 reports retiring h2, a head h1's
\* DAG does not bring, so a record could be dropped that nothing replaces.
\* An admission retires only its own ancestors, so the replay deadlocks at
\* that admission.
SPECIFICATION TraceSpec
CONSTANTS
  Nodes <- tNodes
  Repl <- tRepl
  Heads <- tHeads
  Author <- tAuthor
  Parent <- tParent
  Prio <- tPrio
  KeyOrder <- tKeyOrder
  Base <- tNoHeads
  Fresh <- tHeads
  Backlogs <- tBacklogs
  Trickle <- tNoHeads
  Dead <- tNoHeads
  PullPeer <- tPullPeer
  PullAt <- tNodes
  Storm <- tNodes
  Crashable <- tNodes
  ConnectedAtStart = "down"
  Trace <- mRetiresNonAncestor
  K = 4
  Permits = 4
  PeerPermits = 3
  MemCap = 1000
  PeerQuota = 250
  DurCap = 4000
  MaxCrash = 3
  MaxRegFail = 0
  MaxDisc = 0
  MaxCont = 0
  CoverRule = "Ancestry"
  ShutdownOrder = "DrainFirst"
  ForwardMode = "BeforeMark"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Kept"
  FanoutMode = "PerPeer"
  SlotBeforePermit = FALSE
  DispatchPath = "Direct"
  ConnMode = "Served"
INVARIANT INV_TypeOK
INVARIANT INV_Bounded
INVARIANT INV_ObligationOwned
INVARIANT INV_TraceIndex
