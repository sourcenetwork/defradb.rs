\* run-all: EncryptionPolicyInheritance.tla RED
\* the builder re-decides rule (c) but writes without ending the attempt for the unminted key (INV_PreparedKeyCovers)
\* RED: the builder decides rule (c) again on the heads it reads, but does
\* not end the attempt when the key it needs was never minted. A remote
\* encrypted block lands between preparation and build, the builder now
\* wants the document key, and writes with a key the preparation never
\* minted (INV_PreparedKeyCovers).
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 1
  MaxReqWrites = 1
  MaxMerges = 1
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  KeepPrepared = FALSE
  ReprepareStale = FALSE
  UsePending = TRUE
  TornSnapshot = FALSE
  IgnoreConfig = FALSE
INVARIANT INV_PreparedKeyCovers
CHECK_DEADLOCK FALSE
