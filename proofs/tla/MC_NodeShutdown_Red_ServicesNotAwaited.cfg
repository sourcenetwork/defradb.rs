\* RED: services are stopped but not awaited. A service in the middle of a
\* storage call when it is aborted finishes that call first; shutdown does not
\* wait, stops the pool and closes regolith while the call is still inside
\* storage. Must fail INV_NoStorageAfterClose.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = FALSE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
INVARIANT INV_NoStorageAfterClose
CHECK_DEADLOCK FALSE
