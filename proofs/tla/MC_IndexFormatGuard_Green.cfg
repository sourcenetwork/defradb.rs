\* GREEN: every guard is in place. Current stores open, new empty stores are
\* stamped and open, older and unstamped legacy stores are refused untouched.
SPECIFICATION Spec
CONSTANTS
  Collections = {c1}
  RefusesOld = "On"
  RefusesUnstamped = "On"
  StampsFresh = "On"
  MutatesOnRefusal = "Off"
INVARIANT INV_TypeOK INV_OpenCompatible INV_RefusalReadOnly INV_FreshStoreOpens
CHECK_DEADLOCK FALSE
