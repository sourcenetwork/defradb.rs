\* GREEN: every guard is in place. Current stores open, new empty stores are
\* stamped, and older or unstamped legacy stores rebuild and stamp current.
SPECIFICATION Spec
CONSTANTS
  Collections = {c1}
  RefusesOld = "On"
  RebuildsLegacy = "On"
  StampsFresh = "On"
  MutatesOnRefusal = "Off"
INVARIANT INV_TypeOK INV_OpenCompatible INV_RefusalReadOnly INV_FreshStoreOpens INV_RebuiltIsCurrent INV_StampedAfterOpen
CHECK_DEADLOCK FALSE
