\* RED: a libp2p listen that fails returns its error without stopping the host.
\* The node does not start, yet its host keeps running with nobody holding it to
\* stop it. Must fail INV_FailedHoldsNothing.
SPECIFICATION Spec
CONSTANTS
  ScheduleToIroh       = TRUE
  ShutdownOnListenFail = FALSE
  ValidateFirst        = TRUE
  OwnerPassed          = TRUE
  ConnectAfterNac      = TRUE
  BootstrapNonFatal    = TRUE
INVARIANT INV_FailedHoldsNothing
CHECK_DEADLOCK FALSE
