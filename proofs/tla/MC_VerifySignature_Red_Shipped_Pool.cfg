\* RED: the code as shipped, with no explicit transaction: NAC is checked
\* before the read-only transaction opens and document ACP reads the latest
\* commit, so a grant or revocation that commits in between makes the
\* answer disagree with the snapshot it is about (INV_VerifiedAtOnePoint).
SPECIFICATION Spec
CONSTANTS
  InTxn = FALSE
  CheckNac = TRUE
  CheckAcp = TRUE
  CheckBlock = TRUE
  NacAt = "latest"
  AcpAt = "latest"
  BlockAt = "view"
  MaxEnv = 2
INVARIANT INV_VerifiedAtOnePoint
CHECK_DEADLOCK FALSE
