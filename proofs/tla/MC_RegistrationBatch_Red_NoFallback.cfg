\* RED: a refused list parks every member as refused. The refused member
\* takes the good one beside it down: a registration the provider would
\* take alone is parked for good. Must fail INV_RefusedOnlyIfBad.
SPECIFICATION Spec
CONSTANTS
  Obj        = {1, 2, 3}
  ByB        = {3}
  Bad        = {2}
  MaxLoss    = 1
  Recheck    = TRUE
  Fallback   = FALSE
  PerCreator = TRUE
  InOrder    = TRUE
INVARIANT TypeOK
INVARIANT INV_RefusedOnlyIfBad
