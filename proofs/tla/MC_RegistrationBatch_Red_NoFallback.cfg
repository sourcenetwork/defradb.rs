\* a refused list parks every member: a good one is parked for good (INV_RefusedOnlyIfBad)
\* RED: a refused list parks every member as refused. The refused member
\* takes the good one beside it down: a registration the provider would take
\* alone is parked for good. Must fail INV_RefusedOnlyIfBad.
SPECIFICATION Spec
CONSTANTS
  Obj          = {1, 2, 3}
  ByB          = {3}
  Bad          = {2}
  Elsewhere    = {}
  MaxLoss      = 1
  MaxOther     = 0
  Recheck      = TRUE
  AskOnRefusal = TRUE
  Fallback     = FALSE
  PerCreator   = TRUE
  InOrder      = TRUE
INVARIANT TypeOK
INVARIANT INV_RefusedOnlyIfBad
