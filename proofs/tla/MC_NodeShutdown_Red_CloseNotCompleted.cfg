\* RED: a store close interrupted while it waited for transactions is not
\* completed by the rerun, which finds the store already closing and returns
\* at once, as RegolithStore::close did. Regolith is never closed. Must fail
\* INV_StoreClosedPastClose.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
  P2PFirst        = TRUE
  RequestsFirst   = TRUE
  CommitsAdmitted = TRUE
  EndsOpenTransactions = TRUE
  WaitersWait     = TRUE
  HandsBackLead   = TRUE
  RerunCompletesClose = FALSE
INVARIANT INV_StoreClosedPastClose
CHECK_DEADLOCK FALSE
