\* run-all: DocSyncCompletion.tla GREEN
\* GREEN: the fix, with two peers. A timeout may end the sync at any moment. Each may hold a head of any document, asked for or not; every merge may be reported again, in any order with the rest. The sync is complete only when every document it asked for has merged, and it stops waiting once it has read a report of each.
SPECIFICATION Spec
CONSTANTS
  Docs         = {d1, d2, d3}
  Peers        = {p1, p2}
  MaxReports   = 4
  CountReports = FALSE
  FilterAsked  = TRUE
  HeldDocs     = {}
  ReportHeld   = TRUE
INVARIANT TypeOK
INVARIANT INV_CompleteMeansEveryDocMerged
INVARIANT INV_DoneOnceEveryDocReported
INVARIANT INV_NoWaitOnceEveryAnswerHandled
CHECK_DEADLOCK FALSE
