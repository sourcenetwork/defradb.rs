\* RED: the bug plants a merge that does not compare a chunk's hash with its
\* text. A peer sends a chunk whose hash is not the hash of its text, the merge
\* stores it, and the planted chunk sits next to the real ones
\* (INV_NoForgedChunk).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CheckEntry0 = TRUE
  CheckHash = FALSE
  Immutable = TRUE
INVARIANT INV_NoForgedChunk
CHECK_DEADLOCK FALSE
