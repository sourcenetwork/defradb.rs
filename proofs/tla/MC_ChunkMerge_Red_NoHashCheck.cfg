\* run-all: ChunkMerge.tla RED
\* merge stores a chunk whose hash does not match (INV_NoForgedChunk)
\* RED: the bug plants a merge that does not compare a chunk's hash with its
\* text. A peer sends a chunk whose hash is not the hash of its text, the merge
\* stores it, and the planted chunk sits next to the real ones
\* (INV_NoForgedChunk).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CheckHash = FALSE
  Immutable = TRUE
  Deletes = FALSE
  DeleteRule = "wait"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = TRUE
  Encrypt = FALSE
  Ship = TRUE
INVARIANT INV_NoForgedChunk
CHECK_DEADLOCK FALSE
