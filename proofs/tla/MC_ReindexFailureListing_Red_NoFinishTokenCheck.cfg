\* run-all: ReindexFailureListing.tla RED
\* an old rebuild finishing removes a newer owed record (INV_SettledIsExact)
\* RED: a finishing rebuild removes the owed record whatever token it has. A
\* rebuild of the first reindex has cleared and is walking when a schema
\* change owes a second one, so the entries describe the older version. The
\* old rebuild then finishes and removes the second record, and the index
\* answers queries with stale entries: INV_SettledIsExact fails.
SPECIFICATION Spec
CONSTANTS
  MaxTokens = 3
  NoTokenCheck = FALSE
  KeepFailureOnOwe = FALSE
  NoFinishTokenCheck = TRUE
  KeepProgressOnStop = FALSE
  KeepFailureOnRetry = FALSE
  WritersIgnoreFailure = FALSE
INVARIANT TypeOK INV_SettledIsExact INV_FailureIsCurrent INV_SettledNotFailed INV_FailedRefusesNoWrite
CHECK_DEADLOCK FALSE
