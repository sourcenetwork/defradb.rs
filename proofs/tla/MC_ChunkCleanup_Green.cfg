\* run-all: ChunkCleanup.tla GREEN
\* #3040: edits and merges delete unused chunks, a remake takes the next generation
\* GREEN: edits and merges delete the chunks their text does not use, a create
\* the text here does not use is dropped, a delete waits while the text here
\* uses its chunk, and a chunk made again takes the next generation. Every
\* invariant holds.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 3
  CleanWrites = TRUE
  CleanMerges = TRUE
  DropStale = TRUE
  DeleteGuard = TRUE
  NextGen = TRUE
INVARIANT TypeOK
INVARIANT INV_VisibleIsSplit
INVARIANT INV_StoredIsSplit
INVARIANT INV_EachChunkOnce
INVARIANT INV_NoResurrect
INVARIANT INV_GenerationsBounded
INVARIANT INV_SettledAgree
CHECK_DEADLOCK FALSE
