\* run-all: ChunkCleanup.tla GREEN
\* edits and merges delete unused chunks, a new chunk names the commit of its text
\* GREEN: edits and merges delete the chunks their text does not use, a new
\* chunk names the commit whose text it was cut from, a merge that leaves two
\* heads moves every chunk to the winner, a create the text here does not use
\* is dropped, and a delete waits while the text here uses its chunk or its
\* commit has not merged here. Every invariant holds, and peers with every
\* edit hold the same chunk documents.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CleanWrites = TRUE
  CleanMerges = TRUE
  DropStale = TRUE
  DeleteGuard = TRUE
  Ids = "source"
  Reanchor = TRUE
  KeepWaiting = TRUE
INVARIANT TypeOK
INVARIANT INV_VisibleIsSplit
INVARIANT INV_StoredIsSplit
INVARIANT INV_EachChunkOnce
INVARIANT INV_NoResurrect
INVARIANT INV_GenerationsBounded
INVARIANT INV_SettledSameIds
CHECK_DEADLOCK FALSE
