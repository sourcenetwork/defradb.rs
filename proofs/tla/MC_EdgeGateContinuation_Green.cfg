\* GREEN: the fix. A continuation counts itself only on a count above zero and backs out on the seal; the drain seals before its last look; connection drivers spawn as continuations. A late plain admission counts itself for a moment after closing. Every invariant must hold.
SPECIFICATION Spec
CONSTANTS
  Seal     = TRUE
  Cas      = TRUE
  Continue = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingAfterDrain
INVARIANT INV_InFlightContinues
INVARIANT INV_NoContinuationWhenIdle
CHECK_DEADLOCK FALSE
