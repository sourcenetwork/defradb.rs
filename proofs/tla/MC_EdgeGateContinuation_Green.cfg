\* GREEN: the fix. A continuation counts itself only on a count above zero and backs out on the seal; the drain seals before its last look; connection drivers spawn as continuations. Newcomers come and go before closing, and one counts itself for a moment after closing before it is refused. Every invariant must hold.
SPECIFICATION Spec
CONSTANTS
  Seal     = TRUE
  Cas      = TRUE
  Continue = TRUE
  Refuse   = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingAfterDrain
INVARIANT INV_InFlightContinues
INVARIANT INV_NoContinuationWhenIdle
PROPERTY LIVE_DrainEnds
CHECK_DEADLOCK FALSE
