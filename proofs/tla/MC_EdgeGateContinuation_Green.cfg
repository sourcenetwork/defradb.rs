\* run-all: EdgeGateContinuation.tla GREEN
\* continuations of admitted work run through the drain, never after it, never from idle
\* GREEN: the fix, with no drain deadline. A continuation counts itself only on a count above zero and backs out on the seal; the drain seals before its last look; connection drivers spawn as continuations. Newcomers come and go before closing; after closing each is refused and may retry, counting itself for a moment each time. Every invariant must hold, and the drain says drained once refused callers stop retrying.
SPECIFICATION Spec
CONSTANTS
  Seal     = TRUE
  Cas      = TRUE
  Continue = TRUE
  Refuse   = TRUE
  Deadline = FALSE
INVARIANT TypeOK
INVARIANT INV_NothingAfterDrain
INVARIANT INV_InFlightContinues
INVARIANT INV_NoContinuationWhenIdle
PROPERTY LIVE_DrainEndsOnceRetriesStop
CHECK_DEADLOCK FALSE
