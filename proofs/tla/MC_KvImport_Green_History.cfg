\* A Rust snapshot with every version: both documents merge, live writes and reruns keep everything.
SPECIFICATION Spec
CONSTANTS
  Filtered = {"a"}
  MaxRuns = 2
  SnapMode = "History"
  StoreMode = "Before"
  GenesisMode = "Check"
  WriteMode = "Join"
  JudgeMode = "Restore"
  ReportMode = "Report"
INVARIANTS INV_MergedHasBlocks INV_NoDocWithoutFirst INV_NoLostLiveWrite INV_Complete
CHECK_DEADLOCK FALSE
