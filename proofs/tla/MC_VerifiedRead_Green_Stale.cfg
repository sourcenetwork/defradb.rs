\* GREEN: the head goes stale once (a starved host) while the read runs. The
\* light client refuses to read at it; the read waits for the next revision
\* within its patience and is asked again when one arrives, or fails with
\* the stale refusal once the patience is spent. Nothing is decided at a
\* stale head, and a read fails only once its patience is gone.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 2
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = TRUE
  MaxBusy     = 1
  RetryBusy   = TRUE
  Patience    = 8
  MaxTook     = 2
  PauseMin    = 1
  PauseMax    = 2
  CountTook   = TRUE
  CheckDrawn  = TRUE
  MaxStale    = 1
  CheckFresh  = TRUE
  WaitFresh   = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverStale
INVARIANT INV_NeverFromStale
INVARIANT INV_StaleFailsOnlyAtPatience
INVARIANT INV_AttemptsBounded
