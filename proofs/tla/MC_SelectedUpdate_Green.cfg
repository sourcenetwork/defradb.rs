\* GREEN: the attempt compares what the caller compared and what it writes.
\* A change to the body after the selection loses the race and the caller runs
\* again; a change to another field never does.
SPECIFICATION Spec
CONSTANTS
  Compare = "Dependencies"
  MaxRuns = 3
INVARIANT TypeOK
INVARIANT INV_NoSilentOverwrite
INVARIANT INV_LosesOnlyToItsFields
CHECK_DEADLOCK FALSE
