\* RED: recovery skips handover and publishes the checked term anyway.
\* A decision can be served before any page reaches the outbox. This must fail
\* INV_NoDecisionBeforeHandover.
SPECIFICATION Spec2
CONSTANTS
  Keep         = 1
  MaxTakeovers = 1
  Gate         = TRUE
  GateDelivery = TRUE
  CacheByTerm  = TRUE
  Restage      = TRUE
  Taint        = TRUE
  CheckWindow  = TRUE
  Recover      = TRUE
  RecoverAll   = TRUE
  Mark         = TRUE
  KeepBatch    = TRUE
  MaxCrashes   = 0
  Pages        = 2
  DeliverPage  = FALSE
  PageEndsAtBoundary = TRUE
  SourceCompletion = TRUE
INVARIANT TypeOK
INVARIANT INV_NoDecisionBeforeHandover
