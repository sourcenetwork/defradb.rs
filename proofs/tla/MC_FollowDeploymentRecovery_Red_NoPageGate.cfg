\* RED: the pass publishes no page to the outbox, so its handover never happens.
\* The checked term is published anyway, and a decision can be served before the
\* state has been handed over. Must fail INV_NoDecisionBeforeHandover.
SPECIFICATION Spec2
CONSTANTS
  Keep         = 2
  MaxTakeovers = 1
  Gate         = TRUE
  CacheByTerm  = TRUE
  Restage      = TRUE
  Taint        = TRUE
  CheckWindow  = TRUE
  Recover      = TRUE
  RecoverAll   = TRUE
  Mark         = TRUE
  KeepBatch    = TRUE
  MaxCrashes   = 0
  Pages        = 2
  DeliverPage  = FALSE
INVARIANT TypeOK
INVARIANT TypeOK2
INVARIANT INV_NoDecisionBeforeHandover
