\* GREEN: the code as written, with a connect timeout. Two families; each
\* attempt may connect, fail, or hang, at any tick; the delay is one tick and
\* the timeout three, over a clock of four. This covers an early success, an
\* early failure, the race in both orders (both ending before one poll
\* included), a failure then the other's success or failure, and a timeout
\* that drops a hanging race. Every invariant and the liveness property must
\* hold.
SPECIFICATION Spec
CONSTANTS
  D              = 1
  CT             = 3
  MaxTime        = 4
  HasFallback    = TRUE
  MayHang        = TRUE
  Limited        = TRUE
  DelayFallback  = TRUE
  StartOnFailure = TRUE
  AwaitOther     = TRUE
  KeepLastError  = TRUE
  DropLosers     = TRUE
  TimeoutAll     = TRUE
INVARIANT TypeOK
INVARIANT INV_OneSocket
INVARIANT INV_FallbackWaits
INVARIANT INV_NeverIdle
INVARIANT INV_ErrorOnlyWhenAllFail
INVARIANT INV_LastError
INVARIANT INV_WithinLimit
PROPERTY LIVE_Ends
CHECK_DEADLOCK FALSE
