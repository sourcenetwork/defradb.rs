\* run-all: ClientUniqueAdmission.tla DEFECT
\* known defect, no planted bug: today's code, a filter read of another value aborts the commit (INV_RefusedOnlyOverItsOwnValue)
\* RED, and the code as it is today: no flag is flipped. Client 1 filters for
\* "w" through the unique-index equality plan, which validates the read, and
\* writes "v"; client 2 commits "w" after client 1's snapshot. Client 1's commit
\* loses with "transaction conflict. Please retry" although nobody else holds
\* "v", so the house rule that a query read decides nothing fails
\* (INV_RefusedOnlyOverItsOwnValue). This config turns GREEN when the defect is
\* fixed; testo txn::unique_isolation
\* known_defect_a_unique_filter_read_aborts_the_commit pins the same answer.
SPECIFICATION Spec
CONSTANTS
  Clients = {1, 2}
  Values = {"v", "w"}
  Mode = "Explicit"
  Indexed = TRUE
  EntryValidated = TRUE
  ScanDecides = FALSE
  LoserLeaves = FALSE
  RerunReuses = FALSE
  NilChecked = FALSE
  MaxAttempts = 3
INVARIANT INV_RefusedOnlyOverItsOwnValue
CHECK_DEADLOCK FALSE
