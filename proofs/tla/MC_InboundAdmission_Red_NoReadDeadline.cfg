\* RED: reading a body has no deadline. Connection a declares a control body,
\* never sends it, and holds the control budget forever, so the healthy
\* message is reset every time it asks. Expect LIVE_HealthyHandled to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  ConnOf <- mcConnOf
  ClassOf <- mcClassOf
  LaneOf <- mcLaneOf
  Classes <- mcClasses
  Lanes <- mcLanes
  Healthy = "h1"
  Stalls <- mcStalls
  StuckClasses <- mcStuckClasses
  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "PerClass"
  ShareMode = "PerConnection"
  DrainMode = "PerLane"
  LeaseMode = "UntilHandled"
  ReadMode = "AdmitFirst"
  DeadlineMode = "Deadline"
  ReadDeadlineMode = "None"
INVARIANT INV_TypeOK
PROPERTY LIVE_HealthyHandled
