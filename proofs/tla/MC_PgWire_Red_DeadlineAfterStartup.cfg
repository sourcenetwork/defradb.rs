\* RED: the startup deadline also covers reads after the startup (the
\* `starting` check dropped). An anonymous client that started and then idles
\* is cut off at the startup deadline. Must fail INV_StartedNeverTimedOut.
SPECIFICATION Spec
CONSTANTS
  Limit              = 2
  MaxTime            = 3
  MaxMsgs            = 2
  PreMsgs            = {"anon"}
  PostMsgs           = {"query"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = FALSE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_StartedNeverTimedOut
CHECK_DEADLOCK FALSE
