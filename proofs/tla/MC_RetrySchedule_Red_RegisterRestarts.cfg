\* RED (the naive fix): every new marker restarts the peer clock, delivery or
\* not. A peer fails two passes in a row with nothing delivered, then a local
\* write's failed live push pulls its deadline back to the first rung: the
\* failing peer is swept again before the rung it earned, and every further
\* write against it would do the same. INV_SilentPeerBacksOff fails.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder    <- mcLadder
  Scopes    = {d, p}
  Poison    = {p}
  RestartOn = {"LiveAck", "Register"}
INVARIANT TypeOK
INVARIANT INV_SilentPeerBacksOff
