\* RED (the naive fix): every new marker restarts the peer clock, delivery or
\* not. A pass that lands nothing climbs a rung, then a local write's new
\* marker pulls the clock back to the first rung with nothing delivered: a
\* peer that keeps failing is swept again before the rung it earned, and every
\* further write against it would do the same. ACT_SilentPeerBacksOff fails.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder         <- mcLadder
  Steps          = {}
  Scopes         = {d, p}
  Poison         = {p}
  RestartOn      = {"LiveAck", "SupersededAck", "ReplayAck", "Register"}
  BoundDeadlines = TRUE
INVARIANT TypeOK
PROPERTY ACT_SilentPeerBacksOff
