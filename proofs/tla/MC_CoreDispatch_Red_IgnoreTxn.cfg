\* RED: the edge drops the transaction from the context, as the HTTP patch,
\* set-active and lens handlers did when they ignored the x-defradb-tx header.
\* A request that named t1 writes straight to the store (INV_TxnNeverAutocommits).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  t1 = t1
  Callers = {a, b}
  Allowed = {a}
  Txns    = {t1}
  Bug     = "IgnoreTxn"
INVARIANT TypeOK
INVARIANT INV_TxnNeverAutocommits
CHECK_DEADLOCK FALSE
