\* run-all: FilteredChunkPushRecord.tla RED
\* a restart whose lookup fails drops the pair (INV_NothingUnmatched)
\* RED: the bug plants a restart that replaces the stored pair with what the
\* schema lookup found, which is nothing when it fails. The chunk collection is
\* then unpaired, and a forwarded chunk of the unmatched article reaches the
\* receiver (INV_NothingUnmatched).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  MaxRestarts = 2
  LookupCanFail = TRUE
  CanCorrupt = TRUE
  AddPairs = TRUE
  RemoveTakesChunks = TRUE
  KeepStoredPair = FALSE
  PersistOnlyNarrows = TRUE
  PersistInOneTxn = TRUE
  BadRecordFailsClosed = TRUE
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
