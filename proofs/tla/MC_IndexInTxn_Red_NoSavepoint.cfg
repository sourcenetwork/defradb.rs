\* RED: a change runs without a savepoint. A create that fails after writing
\* the definition, but before its name key and action record, leaves that
\* definition in the caller's transaction, and the caller's commit lands it
\* although the create reported an error (INV_FailedChangeLeavesNothing).
SPECIFICATION Spec
CONSTANTS
  WriteThroughTxn = TRUE
  WorkOnCommit = TRUE
  RefreshCatalog = TRUE
  AwaitWork = TRUE
  ReadCommitted = TRUE
  RollBackFailed = FALSE
INVARIANT INV_FailedChangeLeavesNothing
CHECK_DEADLOCK FALSE
