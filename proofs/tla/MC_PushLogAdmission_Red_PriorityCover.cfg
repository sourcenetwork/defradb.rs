\* RED (F1, main before the fix): cover and supersede follow (priority, CID). The hub
\* registers sibling 2, then sibling 3 arrives with the higher version and retires 2's
\* registration; or 3 arrives first and 2 is acked as covered without one. Either way
\* the pusher was told success for a head that no pending or merged head links, so
\* fetching the survivor never brings it. INV_AckedHeadReachable is violated.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Heads     <- mcHeads
  Parent    <- mcSiblingParents
  Prio      <- mcSiblingPrio
  ScopeOf   <- mcOneScope
  Cap       <- mcSiblingCap
  ReplyMode = "NackOnFull"
  CoverRule = "Priority"
  GuardMode = "Committed"
INVARIANT INV_TypeOK
INVARIANT INV_AckedHeadReachable
