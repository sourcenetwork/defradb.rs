\* GREEN: a poison index that always fails, a hot index written forever, and a
\* quiet index a purge and an update owe, whose drain fails once. Each index drains
\* on its own, a failed one is kept for the sweep, one with work left asks again, a
\* purge asks like any write, and a due sweep wins over requests on a fixed
\* deadline. Owed work is always asked for, and the quiet index always settles.
SPECIFICATION Spec
CONSTANTS
  Poison = 1
  Hot = 2
  Quiet = 3
  Interval = 2
  Isolate = "On"
  KeepFailed = "On"
  Requeue = "On"
  PurgeRequests = "On"
  SweepTimer = "Fixed"
  SweepFirst = "On"
INVARIANT INV_TypeOK INV_OwedKept
PROPERTY PROP_QuietSettles
CHECK_DEADLOCK FALSE
