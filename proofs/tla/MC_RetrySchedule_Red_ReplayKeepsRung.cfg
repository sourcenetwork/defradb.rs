\* RED: a live acknowledgement restarts the peer clock, but a replayed one
\* does not. A pass over a document that never lands climbs a rung; the next
\* pass lands a document and is cut short by the cap with nothing failed, so it
\* neither charges nor restarts the clock and leaves the escalated rung, which
\* the next timeout would charge. ACT_DeliveryRestarts fails.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder         <- mcLadder
  Steps          = {}
  Scopes         = {d, p}
  Poison         = {p}
  RestartOn      = {"LiveAck", "SupersededAck"}
  BoundDeadlines = TRUE
INVARIANT TypeOK
PROPERTY ACT_DeliveryRestarts
