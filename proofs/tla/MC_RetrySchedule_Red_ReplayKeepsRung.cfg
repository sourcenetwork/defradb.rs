\* RED: a live acknowledgement restarts the peer clock, but a replayed one
\* does not. A pass over a document that never lands climbs a rung; the next
\* pass lands a document and is cut short by the cap with nothing failed, so it
\* neither charges nor restarts the clock and leaves the escalated rung. The
\* peer stays due, so INV_DeliveredPeerDueAtFirstRung holds, but the next pass
\* times out and charges that rung, not the second:
\* INV_FirstFailureAfterDeliveryChargesSecondRung fails.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder    <- mcLadder
  Scopes    = {d, p}
  Poison    = {p}
  RestartOn = {"LiveAck"}
INVARIANT TypeOK
INVARIANT INV_DeliveredPeerDueAtFirstRung
INVARIANT INV_FirstFailureAfterDeliveryChargesSecondRung
