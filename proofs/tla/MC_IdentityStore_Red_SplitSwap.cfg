\* RED: the swap is split. A hold or release reads the slot, and later writes
\* what it computed from that read over whatever is there by then. Holders a
\* and b both read "no holds" and both write "one hold": two holders, a count
\* of one, so a's release drops the key b still signs with. Must fail
\* INV_CountExact.
SPECIFICATION Spec
CONSTANTS
  Holders         = {a, b}
  Contexts        = {a, b}
  PinSig          = a
  NoSigner        = none
  MaxSlots        = 2
  AtomicSwap      = FALSE
  CountHolds      = TRUE
  ClearKeepsSlots = TRUE
  ClearKeepsHeld  = TRUE
  RetainNeedsKey  = TRUE
  RefuseOther     = TRUE
  PinRefusesHeld  = TRUE
  SameByContext   = TRUE
INVARIANT INV_CountExact
CHECK_DEADLOCK FALSE
