\* run-all: AddView.tla GREEN
\* #2321: every way in adds views through the core's eight checks, creates them all or none, then builds them
\* GREEN: the embedded node and the `defradb start` server both call the core,
\* which runs every check in order, creates the views in one transaction and
\* builds them after it lands. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Views = {"a", "b"}
  CoreChecks = {"nac", "sdl", "one", "cid", "chunk", "downsample", "policy", "identity"}
  ServerChecks = {"nac", "sdl", "one", "cid", "chunk", "downsample", "policy", "identity"}
  DocumentAcp = {"node", "server"}
  CreateMode = "Atomic"
  BuildFirst = FALSE
INVARIANT TypeOK
INVARIANT INV_NoViewUnlessAllChecksPass
INVARIANT INV_AllOrNone
INVARIANT INV_BuiltOnlyCreated
INVARIANT INV_SameAnswer
CHECK_DEADLOCK FALSE
