\* run-all: DeletedHistory.tla GREEN
\* a deleted document's history reads only to whom its owner allows
\* GREEN: every guard on. A delete keeps the object, a purge removes it with
\* the history, and a deleted DocID cannot be added again. Nobody reads a
\* history its owner did not let them read.
SPECIFICATION Spec
CONSTANTS
  KeepOnDelete   = TRUE
  ReleaseOnPurge = TRUE
  FenceRecreate  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoUnintendedRead
