\* run-all: ReindexFailureListing.tla RED
\* a retry resumes past a stopped rebuild's walk (INV_SettledIsExact)
\* RED: recording a failure keeps the rebuild's progress. A rebuild clears,
\* walks and stops on a clash, leaving partial entries while writers stop
\* maintaining the index. The retry resumes the walk instead of clearing,
\* finishes, and the index answers with entries that do not match the
\* documents: INV_SettledIsExact fails.
SPECIFICATION Spec
CONSTANTS
  MaxTokens = 3
  NoTokenCheck = FALSE
  KeepFailureOnOwe = FALSE
  NoFinishTokenCheck = FALSE
  KeepProgressOnStop = TRUE
  KeepFailureOnRetry = FALSE
  WritersIgnoreFailure = FALSE
INVARIANT TypeOK INV_SettledIsExact INV_FailureIsCurrent INV_SettledNotFailed INV_FailedRefusesNoWrite
CHECK_DEADLOCK FALSE
