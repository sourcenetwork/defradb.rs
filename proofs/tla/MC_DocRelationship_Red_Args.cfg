\* run-all: DocRelationship.tla RED
\* The core skips the args check: a relationship changes although that check fails (INV_NoChangeUnlessAllChecksPass)
\* RED: the core no longer checks that every argument is given, so a change with no document, relation, target or identity lands.
\* Both ways in forward to it, so both make the change.
SPECIFICATION Spec
CONSTANTS
  Skipped = {"args"}
  Swapped = FALSE
  ServerCopy = FALSE
  EventFirst = FALSE
  TxnSwapped = FALSE
INVARIANT INV_NoChangeUnlessAllChecksPass
CHECK_DEADLOCK FALSE
