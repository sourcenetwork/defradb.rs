\* "already exists" taken as a failure: a lost answer fails the request (INV_NoRefusalOfOwn)
\* RED: "already exists" is taken as a failure. A send that created the
\* policy but whose answer was lost is sent again, refused as already
\* existing, and the request fails although its own policy is there
\* (INV_NoRefusalOfOwn).
SPECIFICATION Spec
CONSTANTS
  Requests = {r1, r2}
  Creators = {c1, c2}
  Defs = {d1, d2}
  Nonces = {n1, n2}
  MaxSends = 2
  Enforced = {"reuse", "check", "creator", "caller"}
INVARIANT INV_NoRefusalOfOwn
CHECK_DEADLOCK FALSE
