\* run-all: FilteredChunkPush.tla RED
\* a chunk whose article failed to queue is dropped (LIVE_ReplayShipsChunks)
\* RED: the bug plants a replay that skips a matching chunk whose article's push
\* failed to build, with no retry marker for it. The article's retry sends
\* only the article, so the chunk never arrives (LIVE_ReplayShipsChunks). No
\* stale marker is left to send it by chance.
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  NewMatches = {a1}
  Unreadable = {}
  StaleMarkers = {}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = TRUE
  ReplayNeedsArticle = TRUE
  ReplayDefersChunk = FALSE
  ReplayChunksOnRefilter = TRUE
PROPERTY LIVE_ReplayShipsChunks
CHECK_DEADLOCK FALSE
