\* RED: the quiet check refuses every dial, not only Kademlia's own
\* (DefraKademlia::handle_pending_outbound_connection without the `dials`
\* set). A PushLog or request to a peer the node disconnected never lands.
\* Must fail RequestsStillDial.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = TRUE
  QuietUnlinked = TRUE
  RemoteQuiet = FALSE
  Unquiet = TRUE
  OnlyDiscoveryChecked = FALSE
  RecheckQuiet = TRUE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT RequestsStillDial
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
