\* RED: B without the type takes the unknown field as a last-write-wins
\* register. A writes 2 then 1; B receives 2 then 1 and keeps 1, while A's max
\* register holds 2. Nothing is offered again, so after B is built with the
\* type the two still differ. Must fail INV_ConvergeWhenDone.
SPECIFICATION Spec
CONSTANTS
  MaxBlocks = 3
  MaxVal    = 2
  Mode      = "Lww"
INVARIANT INV_ConvergeWhenDone
CHECK_DEADLOCK FALSE
