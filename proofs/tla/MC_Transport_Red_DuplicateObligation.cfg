\* iroh multipath can deliver a direct and a relayed copy of one head hint
\* (see three_node_relay_preserves_origin_without_promoting_hop).  With
\* arrival-order registration the second copy creates a second obligation for
\* work already queued.  Expect: INV_ObligationIdempotent VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxHead <- mcMaxHead
  MaxLoss <- mcMaxLoss
  LinkMode     = "Reorder"
  DupMode      = "Duplicate"
  ReplyMode    = "NewStream"
  RouteMode    = "Routable"
  TimeoutMode  = "Ambiguous"
  RegisterMode = "LastArrived"
INVARIANT INV_TypeOK
INVARIANT INV_ObligationIdempotent
