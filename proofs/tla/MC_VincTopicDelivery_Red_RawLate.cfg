\* RED: the raw topic is joined first and marked raw after. A KMS message that
\* arrives in between is decoded as a PushLog head hint, which it is not.
\* Must fail INV_RawNeverDecoded.
SPECIFICATION Spec
CONSTANTS
  Nodes         = {a, b}
  RawTopic      = TRUE
  Gate          = TRUE
  RawFirst      = FALSE
  SessionFilter = TRUE
  OwnerCheck    = TRUE
  HoldKeep      = TRUE
  EngineFilter  = TRUE
INVARIANT TypeOK
INVARIANT INV_RawNeverDecoded
CHECK_DEADLOCK FALSE
