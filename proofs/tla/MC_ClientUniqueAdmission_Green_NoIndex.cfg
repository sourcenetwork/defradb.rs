\* run-all: ClientUniqueAdmission.tla GREEN
\* without an index both commit
\* GREEN: the same race with no index on the field. The filtered reads are
\* plain scans, which decide nothing, so both documents commit even when
\* their values are equal. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Clients = {1, 2}
  Values = {"v", "w"}
  Mode = "Explicit"
  Indexed = FALSE
  EntryValidated = TRUE
  ScanDecides = FALSE
  LoserLeaves = FALSE
  RerunReuses = FALSE
  NilChecked = FALSE
  MaxAttempts = 3
INVARIANT TypeOK
INVARIANT INV_AtMostOnePerNonNilValue
INVARIANT INV_LoserLeavesNothing
INVARIANT INV_LoserRefusedTyped
INVARIANT INV_NoIndexNotRefused
INVARIANT INV_NilNotRefused
CHECK_DEADLOCK FALSE
