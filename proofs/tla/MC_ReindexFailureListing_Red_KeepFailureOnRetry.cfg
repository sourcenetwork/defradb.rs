\* run-all: ReindexFailureListing.tla RED
\* a retry walks while writers still skip the index (INV_SettledIsExact)
\* RED: a rebuild that tries a failed reindex again leaves the failure in
\* place. It clears the index, but writers still do not maintain it, so a
\* document written while it walks is missing from the index when it
\* finishes: INV_SettledIsExact fails.
SPECIFICATION Spec
CONSTANTS
  MaxTokens = 3
  NoTokenCheck = FALSE
  KeepFailureOnOwe = FALSE
  NoFinishTokenCheck = FALSE
  KeepProgressOnStop = FALSE
  KeepFailureOnRetry = TRUE
  WritersIgnoreFailure = FALSE
INVARIANT TypeOK INV_SettledIsExact INV_FailureIsCurrent INV_SettledNotFailed INV_FailedRefusesNoWrite
CHECK_DEADLOCK FALSE
