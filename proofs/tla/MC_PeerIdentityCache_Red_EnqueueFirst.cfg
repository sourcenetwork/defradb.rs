\* run-all: PeerIdentityCache.tla RED
\* a place taken before the map write strands the peer (SettledMatch)
\* The insert takes its place before it writes the peer into the map. Another
\* task pops that place and removes a peer that is not there yet; then the
\* write lands and the peer is cached with no place, never to be evicted:
\* SettledMatch fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  p1 = p1
  p2 = p2
  p3 = p3
  t1 = t1
  t2 = t2
  Peers = {p1, p2, p3}
  Tasks = {t1, t2}
  Ops = 2
  Cap = 1
  Mode = "enqueueFirst"
INVARIANTS TypeOK SettledMatch
