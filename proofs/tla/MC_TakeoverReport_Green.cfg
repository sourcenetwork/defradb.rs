\* run-all: TakeoverReport.tla GREEN
\* a checked term is reported once, complete, with its own cut, and a closed check says so
\* GREEN: the provider reports each checked term once, after every replay is
\* classified, with the owed replays kept, the cut of that term, a reason on
\* every unrestorable replay, and the closing reason when it fails closed.
\* Every invariant holds and every run settles.
SPECIFICATION Spec
CONSTANTS
    Submissions = {1, 2}
    MaxTerm = 2
    MaxFaults = 1
    Publish = TRUE
    AfterAll = TRUE
    Once = TRUE
    KeepOwed = TRUE
    CutOfTerm = TRUE
    NameUnrestorable = TRUE
    NameClosed = TRUE
    Recorded = TRUE
INVARIANT
    TypeOK
    INV_Classified
    INV_Published
    INV_PublishedOnce
    INV_Complete
    INV_CutOfTerm
    INV_ClosedNamed
    INV_ClosedRecorded
PROPERTY
    LIVE_Reported
