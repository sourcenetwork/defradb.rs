\* GREEN: a superseded live write counts as owed by the newer marker and sends nothing of its own. With two writers the newer marker can belong to the writer with the older head; the head fence keeps that writer's ack from clearing it, so the marker stays until the newer head lands or the sweep sends it. Without the head fence this mode fails INV_LiveOwed, as Red_NoHeadFence does for reruns.
SPECIFICATION Spec
CONSTANT LiveMode = "covered"
CONSTANT Fence = TRUE
CONSTANT HeadFence = TRUE
CONSTANT MaxReruns = 2
INVARIANTS INV_NoFalseFailure INV_LiveOwed
CHECK_DEADLOCK FALSE
