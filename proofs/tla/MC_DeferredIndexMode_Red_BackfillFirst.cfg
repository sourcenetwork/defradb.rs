\* RED: a backfill a crash stopped resumes before the check at open. Stopped on an
\* inline start, it resumes deferred and places records for the documents it had
\* not reached; the check then finds records and rebuilds nothing, so the documents
\* it indexed inline keep entries with no record (INV_OpenMatchesMode).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  MaxValue = 2
  MaxRestarts = 3
  StartModes = {"Inline", "Deferred"}
  Check = "Both"
  ClearRecords = "On"
  ProgressReset = "On"
  CheckFirst = "Off"
INVARIANT INV_OpenMatchesMode
CHECK_DEADLOCK FALSE
