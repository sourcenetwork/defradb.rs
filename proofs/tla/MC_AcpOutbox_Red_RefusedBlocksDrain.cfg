\* RED: a refused change holds every later one. An actor without authority
\* stages a change, the provider refuses it, and the changes behind it are
\* never sent. Must fail LIVE_Drains.
SPECIFICATION SpecLive
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"node"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = FALSE
  Marker                   = TRUE
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
PROPERTY LIVE_Drains
CHECK_DEADLOCK FALSE
