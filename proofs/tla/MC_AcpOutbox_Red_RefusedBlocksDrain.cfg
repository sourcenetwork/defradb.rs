\* RED: a refused change holds every later one. The creator stages a change
\* that passes the staging check, another owner takes the document over on
\* the provider (AssumeOwnerStays is off), the provider refuses the change,
\* and a change of another tuple behind it is never sent. Must fail
\* LIVE_Drains.
SPECIFICATION SpecLive
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g", "*"}
  Actors                   = {"c", "m"}
  Auths                    = {"node"}
  Preexisting              = TRUE
  InitTuples               = {}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = FALSE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = FALSE
  AssumeNoTransferWhileOwed = TRUE
PROPERTY LIVE_Drains
CHECK_DEADLOCK FALSE
