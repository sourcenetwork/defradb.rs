\* run-all: PincPeerExchange.tla RED
\* RED: the exchange before addresses. M hands a new peer only the peers whose
\* record it holds. B connects, C connects before B is settled, M has no
\* record of B to hand C, and no later step hands it over: B and C never
\* meet. Must fail LIVE_PeersMeet.
SPECIFICATION Spec
CONSTANTS
  RecordOnly = TRUE
  NoRetry    = FALSE
INVARIANT TypeOK
PROPERTY LIVE_PeersMeet
CHECK_DEADLOCK FALSE
