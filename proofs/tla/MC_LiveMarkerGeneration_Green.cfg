\* The fix: a superseded live registration reruns with a fresh generation, so a committed live write is never reported undurable and its head stays owed until delivered.
SPECIFICATION Spec
CONSTANT LiveMode = "rerun"
CONSTANT Fence = TRUE
CONSTANT HeadFence = TRUE
CONSTANT MaxReruns = 2
INVARIANTS INV_NoFalseFailure INV_LiveOwed
CHECK_DEADLOCK FALSE
