\* #2902/#3114: a superseded live write is owed by the newer marker; acks fenced on generation and frontier
\* GREEN, the design: a superseded live write counts as owed by the newer marker and still pushes at its own older generation; an ack clears the marker only at its own generation and only while its head is the whole frontier. No committed live write is reported undurable, and every live head stays delivered or marked.
SPECIFICATION Spec
CONSTANT LiveMode = "covered"
CONSTANT Fence = TRUE
CONSTANT HeadFence = TRUE
INVARIANTS INV_NoFalseFailure INV_LiveOwed
CHECK_DEADLOCK FALSE
