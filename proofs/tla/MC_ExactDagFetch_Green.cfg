\* Every guard in place, an honest provider, three receivers: one that holds
\* the shared history, one that lost a block of it, and one gossip handed the
\* new head first. Each is sent only what it lacks, in one request (two with
\* the lost block), and merges.
SPECIFICATION Spec
CONSTANTS
  Liar = FALSE
  MaxRounds = 3
  Bug = "none"
INVARIANTS INV_TypeOK INV_MergeComplete INV_NoForged INV_HeldNotResent INV_RoundsBounded INV_Converges
CHECK_DEADLOCK FALSE
