\* Every guard in place: full batches publish at once, the tick flushes a
\* batch that waited, the store keeps to its budget and counts replaced CARs
\* out, a CAR is used once, for the peer that offered it, and a batch that
\* fails in a way that can pass is kept to retry until it used every try.
INIT Init
NEXT Next
CONSTANT Bug = "none"
INVARIANTS INV_BatchBounded INV_NoLongWait INV_ExactlyOnce INV_RetryableKept INV_WithinBudget INV_BytesMatch INV_UsedOnce INV_OwnPeer
CHECK_DEADLOCK FALSE
