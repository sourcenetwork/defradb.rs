\* GREEN: the real code, with one export, two reads and an engine that counts
\* to two. The reads race each other and the export's close; a reading can be
\* a moment old, a swap can lose and go round, the store can let go of its
\* statistics before or after the close. Each count reaches the total once,
\* the total and the mark never go back, the close claims every count before
\* the export leaves the map, and every read and close finishes. Two reads
\* and two counts are the smallest instance with a stale reading, a lost swap
\* and a reading behind the mark; more add only longer interleavings of the
\* same steps.
SPECIFICATION Spec
CONSTANTS
  NS           = 1
  NR           = 2
  MaxCount     = 2
  Forward      = TRUE
  ClaimByCas   = TRUE
  Retry        = TRUE
  Refresh      = TRUE
  PublishFirst = TRUE
  HoldStats    = TRUE
  OnlyGrow     = TRUE
  OwnStats     = TRUE
  StopFirst    = TRUE
INVARIANT TypeOK
INVARIANT INV_Accounted
INVARIANT INV_NeverOvercount
INVARIANT INV_ClosedComplete
INVARIANT INV_LeftClaimed
INVARIANT INV_QuiescentExact
PROPERTY PROP_TotalNeverBack
PROPERTY PROP_MarkNeverBack
PROPERTY LIVE_EveryCallEnds
CHECK_DEADLOCK FALSE
