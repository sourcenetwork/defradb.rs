\* RED: a wait has no fallback. The light client's header stream is down, no
\* header comes, and the loop waits for ever for a receipt the node already
\* serves. Must fail LIVE_Confirms.
SPECIFICATION Spec
CONSTANTS
  EventWake      = TRUE
  SeenBeforeSend = TRUE
  Bounded        = FALSE
  MaxHeight      = 3
  Fallback       = 2
PROPERTY LIVE_Confirms
CHECK_DEADLOCK FALSE
