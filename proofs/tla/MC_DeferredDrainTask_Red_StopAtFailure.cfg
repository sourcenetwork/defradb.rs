\* RED: a pass stops at the first index that fails. The sweep takes the quiet
\* index's request, the poison index fails first, and the quiet index is left owing
\* work nobody asked for (INV_OwedKept).
SPECIFICATION Spec
CONSTANTS
  Poison = 1
  Hot = 2
  Quiet = 3
  Interval = 2
  Isolate = "Off"
  KeepFailed = "On"
  Requeue = "On"
  PurgeRequests = "On"
  SweepTimer = "Fixed"
  SweepFirst = "On"
INVARIANT INV_OwedKept
CHECK_DEADLOCK FALSE
