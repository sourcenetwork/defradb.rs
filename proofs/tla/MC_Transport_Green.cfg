\* The hostile link against the shipped design: the wire reorders, duplicates
\* via multipath, needs a reverse route for every two-stream reply, and times
\* out ambiguously.  The sender holds a marker and rederives; the receiver
\* registers head-current.  Expect: every invariant and both liveness
\* properties hold.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxHead <- mcMaxHead
  MaxLoss <- mcMaxLoss
  LinkMode     = "Reorder"
  DupMode      = "Duplicate"
  ReplyMode    = "NewStream"
  RouteMode    = "Routable"
  TimeoutMode  = "Ambiguous"
  RegisterMode = "HeadCurrent"
INVARIANT INV_TypeOK
INVARIANT INV_NoLostUpdate
INVARIANT INV_RegisteredMonotone
INVARIANT INV_ObligationIdempotent
PROPERTY LIVE_EventuallyMerged
PROPERTY LIVE_SenderQuiesces
