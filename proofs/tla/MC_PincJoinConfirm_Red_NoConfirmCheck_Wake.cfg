\* run-all: PincJoinConfirm.tla RED
\* RED: the old code again, one subscribe and no hold. The hub answers and
\* the reader takes the Joined event before the subscribe decides: the
\* subscribe then waits for an event already read, and fails twelve seconds
\* later on a topic the hub holds. Must fail INV_NoMissedWake.
SPECIFICATION Spec
CONSTANTS
  Calls            = {c1}
  MaxUnsub         = 1
  MaxHold          = 0
  MaxLost          = 0
  ConfirmCheck     = FALSE
  StillJoined      = TRUE
  Recheck          = TRUE
  Rollback         = TRUE
  ClearOnLeave     = TRUE
  HubTagsLists     = TRUE
  RejoinAfterDrain = TRUE
INVARIANT TypeOK
INVARIANT INV_NoMissedWake
CHECK_DEADLOCK FALSE
