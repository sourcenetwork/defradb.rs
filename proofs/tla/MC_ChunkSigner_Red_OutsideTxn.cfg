\* run-all: ChunkSigner.tla RED
\* the remote provider's edge check goes stale under a concurrent revoke
\* RED: this is the documented remote-provider limit. Bob is granted, the
\* remote provider reads the grant before the transaction, the grant is
\* revoked, and the merge stores the chunk because the remote provider cannot
\* join and validate the transaction (INV_NoRogueChunk).
SPECIFICATION Spec
CONSTANTS
  CheckParent = TRUE
  Sign = TRUE
  WaitForParent = TRUE
  Provider = "Remote"
  Rebuild = FALSE
  MaxFlips = 2
INVARIANT INV_NoRogueChunk
CHECK_DEADLOCK FALSE
