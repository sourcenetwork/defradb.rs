\* RED: revoking a peer only bars its new connections. Peer a stays connected
\* after its revocation, and its hung stream keeps going. Expect INV_RevokedIsCut
\* to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  Registered <- mcRegistered
  Stuck <- mcStuck
  Share = 1
  TagMode = "Check"
  LeaseMode = "WithRequest"
  DeadlineMode = "Deadline"
  RevokeMode = "BarOnly"
  ShutdownMode = "Abort"
INVARIANT INV_TypeOK
INVARIANT INV_RevokedIsCut
