\* run-all: RetryRecorderLanes.tla RED
\* RED: a lane answers the senders when it takes their records, before the
\* transaction commits. A write then queues its push while its marker is not
\* durable yet, and a crash loses the obligation (INV_AnsweredOnlyWhenDurable).
SPECIFICATION Spec
CONSTANT LaneByPeer = TRUE
CONSTANT OneTxnPerPeer = TRUE
CONSTANT AnswerAfterCommit = FALSE
CONSTANT SinglesOnFail = TRUE
INVARIANT TypeOK
INVARIANT INV_OnePeerAtATime
INVARIANT INV_PeerOrder
INVARIANT INV_AnsweredOnlyWhenDurable
INVARIANT INV_FailureCostsOnlyItsRecord
CHECK_DEADLOCK FALSE
