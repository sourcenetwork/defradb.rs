\* run-all: EncryptionPolicyInheritance.tla GREEN
\* local writes alone keep "every field encrypted" true once it is (PROP_EncryptedMonotone)
\* GREEN: local writes only, up to two per request, no merges. Here "every field encrypted" does
\* stay true once it is true (PROP_EncryptedMonotone), every invariant holds, and no attempt
\* ends for a key: the preparation decides what the build decides.
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 3
  MaxReqWrites = 2
  MaxMerges = 0
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  KeepPrepared = FALSE
  ReprepareStale = TRUE
  UsePending = TRUE
  TornSnapshot = FALSE
  IgnoreConfig = FALSE
INVARIANT TypeOK INV_FollowsOwnHeads INV_NoDowngradeOfEncryptedField INV_HeadlessAllEncrypted INV_StaleDecisionSerializable INV_SeesRequestWrites INV_PreparedKeyCovers INV_CompositeUnlinked INV_ExplicitConfigEncrypts INV_ReprepareOnlyWhenStale
PROPERTY PROP_EncryptedMonotone
CHECK_DEADLOCK FALSE
