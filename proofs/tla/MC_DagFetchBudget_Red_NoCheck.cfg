\* Providers are asked even after the stall budget is spent. Stalls keep
\* coming batch after batch and INV_WaitBounded fails.
INIT Init
NEXT Next
CONSTANTS Batches = 6
          Providers = 2
          Window = 3
          Fast = 1
          MaxFree = 2
          SlowMode = "Stall"
          CapMode = "Capped"
          CheckMode = "NoCheck"
INVARIANT INV_TypeOK
INVARIANT INV_WaitBounded
CHECK_DEADLOCK FALSE
