\* run-all: OwnerTransfer.tla GREEN
\* a change the deployment only ever answers with an error is refused after a bounded number of tries and kept; a refused transfer denies its old owner until abandoned
\* GREEN: the deployment answers the creator's grant and the transfer only
\* with errors. After MaxFails answers each is refused and kept as refused,
\* where its actor sees it. The refused transfer keeps denying the old owner
\* until it abandons it; then the deployment, which never moved the owner,
\* decides again. Every property holds and every change is decided.
SPECIFICATION SpecLive
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = TRUE
  CommitConflict = TRUE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {1, 2}
  MaxFails       = 2
  MaxCrashes     = 0
  MaxLapses      = 0
  MaxAborts      = 0
  OwnTransfer    = FALSE
INVARIANT TypeOK
INVARIANT INV_NoWidening
INVARIANT INV_EarlierUnderOwner
INVARIANT INV_LaterAfterTransfer
INVARIANT INV_QueueFollowsCommits
INVARIANT INV_RegistrationFirst
INVARIANT INV_TransferOnce
INVARIANT INV_RefusedTookNoEffect
INVARIANT INV_FailureReported
PROPERTY LIVE_Decided
CHECK_DEADLOCK FALSE
