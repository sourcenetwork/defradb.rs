\* RED (caller contract: counts only grow): someone resets exported
\* statistics. A read added the first commit and left the mark at 1; the reset
\* takes the count to 0 and the next commit brings it back to 1, which is not
\* past the mark, so that commit is never added. One read, one export, two
\* counts. Must fail INV_QuiescentExact.
SPECIFICATION Spec
CONSTANTS
  NS           = 1
  NR           = 1
  MaxCount     = 2
  Forward      = TRUE
  ClaimByCas   = TRUE
  Retry        = TRUE
  Refresh      = TRUE
  PublishFirst = TRUE
  HoldStats    = TRUE
  OnlyGrow     = FALSE
  OwnStats     = TRUE
  StopFirst    = TRUE
INVARIANT TypeOK
INVARIANT INV_QuiescentExact
CHECK_DEADLOCK FALSE
