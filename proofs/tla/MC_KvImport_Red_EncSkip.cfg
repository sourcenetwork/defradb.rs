\* Bug: the import does not check for missing encryption blocks, so it
\* stores the encrypted document c's blocks, values no query can read.
\* Fails INV_NoUnreadableStored.
SPECIFICATION Spec
CONSTANTS
  Filtered = {"a"}
  MaxRuns = 2
  StoreMode = "Before"
  GenesisMode = "Check"
  WriteMode = "Join"
  JudgeMode = "Restore"
  ReportMode = "Report"
  SigMode = "RestoreOnly"
  EncMode = "Skip"
INVARIANTS INV_MergedHasBlocks INV_NoDocWithoutFirst INV_NoLostLiveWrite INV_NoUnsignedPush INV_NoUnreadableStored INV_Complete
CHECK_DEADLOCK FALSE
