\* RED: the settler sends again without asking the provider first. After a
\* lost answer the provider applied, the next pass sends the same objects
\* again: the provider refuses them, and the whole list with them. Must
\* fail INV_NoResendOfHeld.
SPECIFICATION Spec
CONSTANTS
  Obj        = {1, 2, 3}
  ByB        = {3}
  Bad        = {2}
  MaxLoss    = 1
  Recheck    = FALSE
  Fallback   = TRUE
  PerCreator = TRUE
  InOrder    = TRUE
INVARIANT TypeOK
INVARIANT INV_NoResendOfHeld
