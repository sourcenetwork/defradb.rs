\* run-all: RegistrationBatch.tla RED
\* sent again without asking the provider: a held object refuses its list (INV_NoResendOfKnownHeld)
\* RED: the settler sends without asking the provider first. After a lost
\* answer the provider applied, or with a replica another node holds, the
\* list carries an object the provider holds and refuses. Must fail
\* INV_NoResendOfKnownHeld.
SPECIFICATION Spec
CONSTANTS
  Obj          = {1, 2, 3}
  ByB          = {3}
  Bad          = {2}
  Elsewhere    = {}
  MaxLoss      = 1
  MaxOther     = 0
  Recheck      = FALSE
  AskOnRefusal = TRUE
  Fallback     = TRUE
  PerCreator   = TRUE
  InOrder      = TRUE
INVARIANT TypeOK
INVARIANT INV_NoResendOfKnownHeld
