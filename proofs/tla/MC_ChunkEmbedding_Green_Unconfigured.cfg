\* run-all: ChunkEmbedding.tla GREEN
\* no model or URL: a write that creates chunks is refused
\* GREEN: the node has no model or URL for the embedding, and a write that
\* creates chunks is refused. No chunk is ever stored without its vector.
SPECIFICATION Spec
CONSTANTS
  KeyByText = TRUE
  WantOnlyMissing = TRUE
  ResolveOutside = TRUE
  WantEveryMiss = TRUE
  CommitNeedsVectors = TRUE
  Unconfigured = TRUE
  RefuseUnconfigured = TRUE
INVARIANT TypeOK
INVARIANT INV_NoModelCallInTxn
INVARIANT INV_ListedChunkHasVector
INVARIANT INV_VectorIsItsText
INVARIANT INV_UnchangedChunkNoCall
INVARIANT INV_OneWave
CHECK_DEADLOCK FALSE
