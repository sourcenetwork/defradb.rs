\* run-all: CommitOutcome.tla RED
\* a client concludes aborted for a write with no readable answer (INV_AbortedMeansNothingLanded)
\* RED: a client whose write got no readable answer (a bare 5xx, a timeout after the request was sent) concludes aborted. The server may still commit that write, so the caller runs it again and it applies twice. Fails INV_AbortedMeansNothingLanded.
SPECIFICATION Spec
CONSTANT ClassifyFailure = TRUE
CONSTANT RetainFailure = TRUE
CONSTANT NotFoundSaysUnknown = TRUE
CONSTANT ReportRefusal = TRUE
CONSTANT LostReplyUnknown = FALSE
INVARIANT INV_AbortedMeansNothingLanded
CHECK_DEADLOCK FALSE
