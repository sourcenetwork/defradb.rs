\* run-all: MC_Claim_Common.tla RED
\* split same-DID breaks convergence
\* RED: if filtering splits same-DID contenders into different replication sets,
\* even eventual claim uniqueness breaks because local LWW winners never converge.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Instances <- mcInstances
  DIDs <- mcDIDs
  DidOf <- mcDidOf
  RequestDID <- mcRequestDID
  ClaimRank <- mcClaimRank
  ReplicationPeers <- mcPeersSplitSameDID
INVARIANT TypeOK
PROPERTY INV_EventualClaimUnique
