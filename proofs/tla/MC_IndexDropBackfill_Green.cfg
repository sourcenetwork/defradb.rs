\* GREEN: two old documents, a backfill, a drop of its index, a failed drop
\* page, a new index created after the drop, and two restarts. The drop
\* clears the backfill record and retires the index's id in its own commit, a
\* failure is recorded only while the index is defined, entries go in pages
\* after the definition commits, and a restart resumes an unfinished or
\* failed drop until it is done.
SPECIFICATION Spec
CONSTANTS
  Docs = {1, 2}
  RecordMode = "Clear"
  FailMode = "Checked"
  EntryMode = "AfterDefinition"
  ResumeMode = "Resume"
  IdMode = "Retire"
INVARIANT INV_TypeOK INV_NoRecordForGoneIndex INV_NoOrphanEntries INV_NewIndexIntact
PROPERTY LIVE_DropFinishes
CHECK_DEADLOCK FALSE
