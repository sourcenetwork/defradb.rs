\* GREEN: two old documents, a backfill, a drop of its index, and one crash
\* anywhere. The drop clears the backfill record in its own commit, a failure
\* is recorded only while the index is defined, entries go in pages after
\* the definition commits, and a restart resumes an unfinished drop.
SPECIFICATION Spec
CONSTANTS
  Docs = {1, 2}
  RecordMode = "Clear"
  FailMode = "Checked"
  EntryMode = "AfterDefinition"
  ResumeMode = "Resume"
INVARIANT INV_TypeOK INV_NoRecordForGoneIndex INV_NoOrphanEntries
PROPERTY LIVE_DropFinishes
CHECK_DEADLOCK FALSE
