\* RED: P2P sync puts a fetched lens in memory only, with no config, as it
\* did before #2724's fix, while the view's check reads the config in its
\* transaction. A lens the node holds is reported missing, so a valid view
\* is rejected (INV_NoValidRejected).
SPECIFICATION Spec
CONSTANTS
  CheckEmpty = TRUE
  CheckLens = TRUE
  StoreTransform = TRUE
  LensAt = "txn"
  NacAt = "txn"
  SyncPersists = FALSE
  MaxEnv = 2
INVARIANT INV_NoValidRejected
CHECK_DEADLOCK FALSE
