\* run-all: EdgeGateContinuation.tla RED
\* no deadline: refused callers retrying in a loop hold the drain for ever (LIVE_DrainReturns)
\* RED: the drain with no deadline, against callers that retry after being told Closed. This is the gap in the code today: Gate::admit counts a caller before it reads `closed`, even one already refused, so two refused callers retrying in a loop take turns counting themselves in, the count is above zero at every look, and only the deadline ends the drain. Without it the drain never returns (LIVE_DrainReturns).
SPECIFICATION Spec
CONSTANTS
  Seal     = TRUE
  Cas      = TRUE
  Continue = TRUE
  Refuse   = TRUE
  Deadline = FALSE
INVARIANT TypeOK
INVARIANT INV_NothingAfterDrain
INVARIANT INV_InFlightContinues
INVARIANT INV_NoContinuationWhenIdle
PROPERTY LIVE_DrainReturns
CHECK_DEADLOCK FALSE
