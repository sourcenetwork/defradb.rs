\* run-all: OwnerTransfer.tla RED
\* the old owner keeps reading while its transfer is owed (INV_NoWidening)
\* RED: no denial from the commit. The creator transfers its document in
\* the create and keeps reading it, by the owed-registration rule and then
\* because the deployment still names it, until the transfer lands. The
\* committed changes, all applied, give the creator nothing. Must fail
\* INV_NoWidening.
SPECIFICATION Spec
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = TRUE
  CommitConflict = TRUE
  DenyFromCommit = FALSE
  ProviderGrants = TRUE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {}
  MaxFails       = 2
  MaxCrashes     = 1
  MaxLapses      = 1
  MaxAborts      = 1
  OwnTransfer    = TRUE
INVARIANT INV_NoWidening
CHECK_DEADLOCK FALSE
