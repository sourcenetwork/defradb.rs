\* Plants a receiver that merges when the provider says the DAG is done. A
\* lying provider sends nothing and says so, and the head is merged with its
\* DAG missing. INV_MergeComplete fails.
SPECIFICATION Spec
CONSTANTS
  Liar = TRUE
  MaxRounds = 3
  Bug = "trustprovider"
INVARIANT INV_MergeComplete
CHECK_DEADLOCK FALSE
