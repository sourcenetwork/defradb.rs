\* run-all: CommitResponseWait.tla RED
\* bound answers by cancelling the commit (UnknownIsNotAbort)
\* RED: answer unknown by cancelling the ticket, so "unknown" becomes an abort;
\* UnknownIsNotAbort fails.
SPECIFICATION Spec
CONSTANT Bound = 1
CONSTANT CommitBound = TRUE
CONSTANT CommitKeepsRunning = FALSE
INVARIANT TypeOK
INVARIANT UnknownIsNotAbort
INVARIANT AnswerOnlyAfterSend
PROPERTY ClientSettles
CHECK_DEADLOCK FALSE
