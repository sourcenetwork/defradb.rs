\* run-all: SimilarityOrder.tla GREEN
\* a similarity query scores only readable documents, then filters on the scores
\* GREEN: both guards are on. Each document is filtered, then checked for
\* access, then scored, then filtered on its score, so no hidden document is
\* scored and the answer is exact.
SPECIFICATION Spec
CONSTANTS
  ScoreAfterAccess = TRUE
  AliasAfterScore = TRUE
INVARIANT TypeOK
INVARIANT INV_HiddenNeverScored
INVARIANT INV_AnswerIsExact
CHECK_DEADLOCK FALSE
