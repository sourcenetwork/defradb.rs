\* RED: the record stays in progress, but the next open does not look at it,
\* so the build stopped by the close never runs again and the index is never
\* built (LIVE_BuildFinishes).
SPECIFICATION Spec
CONSTANTS
  Docs = 2
  RaceMode = "Race"
  StopMode = "Leave"
  ResumeMode = "Forget"
PROPERTY LIVE_BuildFinishes
CHECK_DEADLOCK FALSE
