\* RED: a Node import is admitted once, as a whole, and its writes are not
\* admitted again. The node closes mid-import and a later batch still
\* commits. Must fail INV_NoWriteAfterClose.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  AdmitEachWrite      = FALSE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  RequireNode         = TRUE
INVARIANT INV_NoWriteAfterClose
CHECK_DEADLOCK FALSE
