\* Bug: when the clock's dispatch meets a full event lane and hands its reservation back, it also
\* notifies the clock. The clock wakes at once, reserves the same root, meets the same full lane and
\* wakes itself again: a busy loop that makes no progress (INV_RollbackNeedsCause).
SPECIFICATION Spec
CONSTANTS
  Bug = "rollback-wake"
  Cap = 1
  MaxGen = 3
INVARIANT INV_RollbackNeedsCause
CHECK_DEADLOCK FALSE
