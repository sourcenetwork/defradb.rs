\* RED: membership checks the admission only and ignores the fork proof. A node holding both sides of k1's fork still merges k1 (INV_NoMergeAfterProof).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  Peers <- mcPeers
  CheaterKeys <- mcCheaterKeys
  HonestKey <- mcHonestKey
  WriterHome <- mcWriterHome
  Budget <- mcBudget
  CheckMembership = TRUE
  CheckEvidence = FALSE
  RetryOnAdmission = TRUE
INVARIANT TypeOK
INVARIANT INV_NoMergeAfterProof
