\* RED (caller contract: the engine stops counting before its guard drops):
\* the guard is dropped while the engine still runs, as when a caller ignores
\* #[must_use] and drops it at once. The close publishes what was counted so
\* far, the export leaves the map, and a commit after that is never added.
\* One read, one export, one count. Must fail INV_QuiescentExact.
SPECIFICATION Spec
CONSTANTS
  NS           = 1
  NR           = 1
  MaxCount     = 1
  Forward      = TRUE
  ClaimByCas   = TRUE
  Retry        = TRUE
  Refresh      = TRUE
  PublishFirst = TRUE
  HoldStats    = TRUE
  OnlyGrow     = TRUE
  OwnStats     = TRUE
  StopFirst    = FALSE
INVARIANT TypeOK
INVARIANT INV_QuiescentExact
CHECK_DEADLOCK FALSE
