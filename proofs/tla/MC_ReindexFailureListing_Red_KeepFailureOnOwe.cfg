\* run-all: ReindexFailureListing.tla RED
\* a newly owed reindex keeps the old failure (INV_FailureIsCurrent)
\* RED: owing a reindex again keeps the failure the record had. The first
\* reindex stops on a clash, a schema change owes a second one, and the index
\* lists as failed before any rebuild of the second reindex ran:
\* INV_FailureIsCurrent fails.
SPECIFICATION Spec
CONSTANTS
  MaxTokens = 3
  NoTokenCheck = FALSE
  KeepFailureOnOwe = TRUE
  FailureBeside = FALSE
INVARIANT TypeOK INV_FailureIsCurrent INV_SettledNotFailed
CHECK_DEADLOCK FALSE
