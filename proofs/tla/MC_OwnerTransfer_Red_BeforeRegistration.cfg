\* run-all: OwnerTransfer.tla RED
\* a change is sent while the registration is owed (INV_RegistrationFirst)
\* RED: no registration first. The drainer sends the creator's grant, or
\* the transfer, while the document's registration is still owed: the
\* deployment is asked to change an object it does not hold. Must fail
\* INV_RegistrationFirst.
SPECIFICATION Spec
CONSTANTS
  RegFirst       = FALSE
  ObjectOrder    = TRUE
  CommitConflict = TRUE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {}
  MaxFails       = 2
  MaxCrashes     = 1
  MaxLapses      = 1
  MaxAborts      = 1
  OwnTransfer    = TRUE
INVARIANT INV_RegistrationFirst
CHECK_DEADLOCK FALSE
