\* run-all: ChunkRead.tla RED
\* a chunk of an unknown collection is served as public (INV_ServedIsReadable)
\* RED: the bug plants a block owner lookup that serves a chunk's block when it
\* can't find the chunk's collection or the article collection that chunks it.
\* It then finds no access rules, the block counts as public, and a peer the
\* article was revoked from gets the private text (INV_ServedIsReadable).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = TRUE
  CheckListed = TRUE
  CheckResolved = FALSE
  CutText = TRUE
  CheckOwnApp = TRUE
  CheckDelegationScope = TRUE
INVARIANT INV_ServedIsReadable
CHECK_DEADLOCK FALSE
