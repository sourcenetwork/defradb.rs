\* RED: a decision is remembered under the last verified state whether or not
\* that state is still fresh. After the Vera node stops, the decision an
\* earlier request got is repeated without end. Must fail
\* INV_NoDecisionPastFreshness.
SPECIFICATION Spec
CONSTANTS
  FreshDecisions    = FALSE
  StopAfterRequests = TRUE
  StopDeadline      = TRUE
  StartDeadline     = TRUE
  ClosesLink        = TRUE
INVARIANT INV_NoDecisionPastFreshness
CHECK_DEADLOCK FALSE
