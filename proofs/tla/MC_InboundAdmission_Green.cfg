\* GREEN: every guard on. Bodies stay within budget, no connection holds
\* more than its share, the healthy control message is handled, and every
\* waiting stream is admitted or reset.
\* CHECK_DEADLOCK FALSE: stuck handlers end the run with nothing left to do.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  ConnOf <- mcConnOf
  ClassOf <- mcClassOf
  LaneOf <- mcLaneOf
  Classes <- mcClasses
  Lanes <- mcLanes
  Healthy = "h1"
  Stalls <- mcStalls
  Trickles <- mcTrickles
  StuckClasses <- mcStuckClasses
  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "PerClass"
  ShareMode = "PerConnection"
  DrainMode = "PerLane"
  LeaseMode = "UntilHandled"
  ReadMode = "AdmitFirst"
  DeadlineMode = "Deadline"
  ReadDeadlineMode = "Deadline"
INVARIANT INV_TypeOK
INVARIANT INV_ResidentWithinBudget
INVARIANT INV_ShareBound
PROPERTY LIVE_HealthyHandled
PROPERTY LIVE_WaitEnds
