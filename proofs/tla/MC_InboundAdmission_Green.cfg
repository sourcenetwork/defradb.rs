\* GREEN: every guard on. Bodies stay within budget, the healthy control
\* message is handled, and every waiting stream is admitted or reset.
\* CHECK_DEADLOCK FALSE: stuck handlers end the run with nothing left to do.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  PeerOf <- mcPeerOf
  ClassOf <- mcClassOf
  Classes <- mcClasses
  Healthy = "h1"
  Stalls <- mcStalls
  StuckClasses <- mcStuckClasses
  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "PerClass"
  ShareMode = "PerPeer"
  DrainMode = "PerClass"
  LeaseMode = "UntilHandled"
  ReadMode = "AdmitFirst"
  DeadlineMode = "Deadline"
INVARIANT INV_TypeOK
INVARIANT INV_ResidentWithinBudget
PROPERTY LIVE_HealthyHandled
PROPERTY LIVE_WaitEnds
