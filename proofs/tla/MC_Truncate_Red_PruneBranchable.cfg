\* run-all: Truncate.tla RED
\* keephistory left out: a filtered truncate of a branchable collection deletes history its collection DAG links (INV_FilteredKeepsBranchableHistory)
\* RED: the purge a filtered truncate runs deletes the removed documents'
\* blocks even in a branchable collection. The collection DAG still links
\* those versions, so it now points at blocks that are gone
\* (INV_FilteredKeepsBranchableHistory).
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  Enforced = {"nac", "chunk", "allowbranchable", "txn", "shape", "reread", "viewcache", "progress", "seprefix", "sesamespace", "metaerror"}
INVARIANT INV_FilteredKeepsBranchableHistory
CHECK_DEADLOCK FALSE
