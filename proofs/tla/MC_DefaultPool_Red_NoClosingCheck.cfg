\* RED (a): running() keeps the upgrade but drops the closing check
\* (default.rs:140). p1 registers, c1 stops it (p1 is closing), then c1 asks for
\* a pool to time its deadline on: the slot still names p1 and the call answers
\* p1. A closing pool admits nothing, so every caller handed it fails with
\* ShutDown although the started pool could run its work, and the stop's
\* deadline ends at once and abandons p1's admitted work. One pool and one
\* caller are enough for the slot to name a closing pool. Must fail
\* INV_NeverHandsOutClosing.
SPECIFICATION Spec
CONSTANTS
  NP                 = 1
  NC                 = 1
  CheckClosing       = FALSE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverHandsOutClosing
CHECK_DEADLOCK FALSE
