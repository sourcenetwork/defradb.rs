\* run-all: MC_Acp_Green.tla GREEN
\* ACP revocation propagates
\* GREEN: a revocation that reaches a node removes the tuple from its copy.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  Tuples <- mcTuples
  InitialAuthority <- mcInitialAuthority
  InitiallyKnown <- mcInitiallyKnown
  Grantable <- mcGrantable
  Revocable <- mcRevocable
  NetworkConnected = TRUE
  EnforcementMode = "CurrentStore"
INVARIANT TypeOK
INVARIANT INV_RevokedNotAuthoritative
INVARIANT INV_RevocationConsistent
PROPERTY PROP_RevocationEventuallyEnforced
