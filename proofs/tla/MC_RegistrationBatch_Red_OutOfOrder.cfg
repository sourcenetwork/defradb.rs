\* RED: a refused list's members are sent alone in any order, so a later one
\* goes before an earlier one is answered. Must fail INV_Order.
SPECIFICATION Spec
CONSTANTS
  Obj          = {1, 2, 3}
  ByB          = {3}
  Bad          = {2}
  Elsewhere    = {}
  MaxLoss      = 1
  MaxOther     = 0
  Recheck      = TRUE
  AskOnRefusal = TRUE
  Fallback     = TRUE
  PerCreator   = TRUE
  InOrder      = FALSE
INVARIANT TypeOK
INVARIANT INV_Order
