\* a settlement walk saves the document at the active version (INV_ReadsFollowWrites)
\* RED: the rebuild walk a schema change owes saves the document at the
\* active version with the value it indexed, as a settlement that restamps
\* or persists would. Walking before any lens moves the document to the
\* active version with its raw value; a lens added afterwards then no longer
\* applies to it, so reads stop seeing the written value through the lens
\* (the same happens to a migrated value once its lens is removed):
\* INV_ReadsFollowWrites fails.
SPECIFICATION Spec
CONSTANTS
  Gate = "owed"
  OweOnSchemaChange = TRUE
  OweOnMerge = TRUE
  SkipIfOwed = FALSE
  ClearChecksToken = TRUE
  ScanRechecksOwed = TRUE
  WalkStamps = TRUE
  MaxSteps = 6
INVARIANT TypeOK INV_IndexMatchesReads INV_SettledIndexAnswers INV_ScanMatchesReads INV_ReadsFollowWrites
CHECK_DEADLOCK FALSE
