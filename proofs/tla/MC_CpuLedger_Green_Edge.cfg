\* GREEN: the code as written, with slot 1 a network runtime sized from the
\* machine and slot 2 a worker pool. Two CPUs, each slot running two lives one
\* after another, two claims alone before the pool shares and the runtime
\* gives up. This covers the runtime winning a CPU alone while the pool plans
\* around it, the runtime losing to a pool that holds its CPUs and giving up
\* holding nothing, a pool sharing a CPU the runtime holds alone, and a later
\* runtime finding the CPUs the last one gave back. Every invariant and the
\* liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 2
  Edges            = {1}
  Attempts         = 2
  AtomicTake       = TRUE
  RollBack         = TRUE
  InsertAfterWin   = TRUE
  ShareCounts      = TRUE
  AttemptCap       = TRUE
  KeepWhileRunning = TRUE
  ReleaseOnce      = TRUE
  RunOnHeld        = TRUE
  ReleaseAtEnd     = TRUE
INVARIANT TypeOK
INVARIANT INV_AloneTakesDisjoint
INVARIANT INV_AloneRunsAlone
INVARIANT INV_TakenAlone
INVARIANT INV_AllOrNothing
INVARIANT INV_HeldNeverFree
INVARIANT INV_CountExact
INVARIANT INV_DoneLeavesNothing
PROPERTY LIVE_StartEnds
CHECK_DEADLOCK FALSE
