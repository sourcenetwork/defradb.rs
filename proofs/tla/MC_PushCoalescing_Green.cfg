\* GREEN: one writer's linear heads. Coalescing keeps the newest live head, a superseded
\* failure never re-enters persisted retry, and an ack of the frontier clears the marker
\* only when every offered head is reachable from what was delivered.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  MaxHead <- mcMaxHead
  Parent <- mcLinear
  QueueMode = "LatestOnly"
  RetryMode = "CurrentOnly"
  CompleteRule = "Frontier"
INVARIANT INV_TypeOK
INVARIANT INV_OneLiveHead
INVARIANT INV_OnePersistedHead
INVARIANT INV_NoStaleRetry
INVARIANT INV_NewestRetained
INVARIANT INV_ClearedScopeDelivered
INVARIANT INV_AckRecordCurrent
