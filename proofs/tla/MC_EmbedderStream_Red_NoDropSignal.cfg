\* RED: the send half has no drop signal (the code before #3415's fix). s2's handler
\* blocks writing to an opener that stopped reading; at the deadline the handler is
\* dropped, but the write in flight runs on and the stream stays open.
\* Expect INV_DeadlineResets to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  Registered <- mcRegistered
  Stuck <- mcStuck
  Share = 1
  TagMode = "Check"
  LeaseMode = "WithRequest"
  DeadlineMode = "Deadline"
  RevokeMode = "Close"
  ShutdownMode = "Abort"
  Unread <- mcUnread
  DropMode = "None"
INVARIANT INV_TypeOK
INVARIANT INV_DeadlineResets
