\* run-all: StorePurge.tla RED
\* shutdown_and_wipe wipes while a second handle keeps the store locked (INV_NoWipeWhileOpen)
\* RED: shutdown_and_wipe wipes although the application still holds a
\* second handle to the node, so the closed store is still locked by a live
\* node while its keys are dropped. Must fail INV_NoWipeWhileOpen.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Developments = {TRUE}
  Handlers = {TRUE}
  HeldElsewhere = {TRUE}
  OtherCallers  = {FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = FALSE
  ShutdownOnce             = TRUE
  SignerHeld               = TRUE
INVARIANT INV_NoWipeWhileOpen
CHECK_DEADLOCK FALSE
