\* RED: no check at open. A store kept inline opens deferred: its entries have no
\* records, so a drain never finds the old entry to remove (INV_OpenMatchesMode).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  MaxValue = 2
  MaxRestarts = 3
  StartModes = {"Inline", "Deferred"}
  Check = "Off"
  ClearRecords = "On"
  ProgressReset = "On"
  CheckFirst = "On"
INVARIANT INV_OpenMatchesMode
CHECK_DEADLOCK FALSE
