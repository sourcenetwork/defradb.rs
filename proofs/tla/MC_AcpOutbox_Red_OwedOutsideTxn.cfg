\* RED: owed records are written beside the transaction, not as its own
\* writes. A transaction creates the document and rolls back: the registration
\* stays owed for a document that does not exist. Must fail
\* INV_RollbackLeavesNothing.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"node"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = FALSE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
INVARIANT INV_RollbackLeavesNothing
CHECK_DEADLOCK FALSE
