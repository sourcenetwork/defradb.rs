\* RED (fa4a84f7 regression of #592): capacity overflow drops the pending registration but
\* replies success, so the pusher deletes its retry record while the hub holds neither a
\* merge nor a registration. INV_SuccessImpliesRegisteredOrMerged is violated at the
\* overflow step - the #1088 M1 silent-divergence laundering.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Heads     <- mcHeads
  Parent    <- mcNoParents
  Prio      <- mcFlatPrio
  ScopeOf   <- mcOwnScope
  Cap       <- mcCap
  ReplyMode = "SuccessOnFull"
  CoverRule = "Parent"
  GuardMode = "Committed"
INVARIANT INV_TypeOK
INVARIANT INV_SuccessImpliesRegisteredOrMerged
