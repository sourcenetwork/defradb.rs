\* a fresh delegation renews a request journaled with an expired one (INV_LandsUnderItsCredential)
\* RED: a journaled request lands under the stored delegation instead of
\* the one it carries. The creator's grant is journaled with a delegation
\* that then expires; a later change of the creator waits for authority and
\* is handed a fresh delegation. The grant's request still carries the
\* expired one, yet lands as though renewed. Must fail
\* INV_LandsUnderItsCredential.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c"}
  Auths                    = {"deleg"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 0
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = TRUE
  Note                     = TRUE
  Floor                    = TRUE
  Captured                 = FALSE
  Remote                   = FALSE
  ActorFromCredential      = TRUE
  RemoteCheck              = TRUE
  RemoteAuthority          = TRUE
  HeldKeys                 = {}
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT INV_LandsUnderItsCredential
CHECK_DEADLOCK FALSE
