\* a writer's delete charges its archive to the owner's admission count (INV_DeleteChargesNobody)
\* RED: an archive counts against its actor's admission, as any new change
\* does. A writer the policy lets delete deletes the owner's document; the
\* archive, made as the owner, is charged to the owner, who did not delete
\* anything. Parked for want of the owner's authority, archives like it
\* keep counting until the owner hands one in, and enough of them lock the
\* owner out of staging any change of its own. Must fail
\* INV_DeleteChargesNobody.
SPECIFICATION Spec
CONSTANTS
  CheckPermission  = TRUE
  ArchiveAsOwner   = TRUE
  Drop             = TRUE
  VeraRefuses      = TRUE
  Overlay          = TRUE
  HistoryActorOnly = TRUE
  SpareOnlyDeleter = TRUE
  ArchiveUncounted = FALSE
  ArchiveOffNode   = TRUE
  ArchiveOffTxn    = TRUE
  First            = "archive"
INVARIANT TypeOK
INVARIANT INV_DeleteChargesNobody
