\* RED: the decider reads the count without validating it (no parts). A
\* delete commits after the decider read that nobody is denied, and the
\* decider still commits. Must fail INV_NoMissedRevoke.
SPECIFICATION Spec
CONSTANTS
  MaxWrites     = 4
  SettleParts   = {"settled"}
  ReadParts     = {}
  SettleGuarded = TRUE
INVARIANT INV_NoMissedRevoke
CHECK_DEADLOCK FALSE
