\* RED (main): a refused gossip announcement is dropped. The peer never says
\* it again, so the document is owned by nothing and is lost for good.
\* Expect INV_HeardIsOwned to be violated.
SPECIFICATION Spec
CONSTANTS
  Docs <- mcDocs
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  MemCap = 1
  MaxCrashes = 1
  PeerCap = 3
  TotalCap = 3
  Mode = "Drop"
  Promote = TRUE
  Lane = "Wait"
CHECK_DEADLOCK TRUE
INVARIANT INV_TypeOK
INVARIANT INV_HeardIsOwned
