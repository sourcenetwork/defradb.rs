\* run-all: ClientUniqueAdmission.tla GREEN
\* an autocommit loser re-runs and is refused as a unique violation
\* GREEN: two autocommit writes add a value under a unique index. A write
\* that loses its commit runs again, finds the winner's entry and is refused
\* as a unique violation. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Clients = {1, 2}
  Values = {"v", "w"}
  Mode = "Autocommit"
  Indexed = TRUE
  EntryValidated = TRUE
  ScanDecides = FALSE
  FilterValidated = FALSE
  LoserLeaves = FALSE
  RerunReuses = FALSE
  NilChecked = FALSE
  MaxAttempts = 3
INVARIANT TypeOK
INVARIANT INV_AtMostOnePerNonNilValue
INVARIANT INV_LoserLeavesNothing
INVARIANT INV_LoserRefusedTyped
INVARIANT INV_NoIndexNotRefused
INVARIANT INV_NilNotRefused
INVARIANT INV_RefusedOnlyOverItsOwnValue
CHECK_DEADLOCK FALSE
