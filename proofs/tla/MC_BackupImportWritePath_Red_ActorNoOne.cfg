\* RED: an anonymous import acts as no one, as main's Node import did. On a
\* signing Node an anonymous create is owned by the node but the imported
\* document by no one. Must fail INV_CreatorAsCreate.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  HoldImport          = TRUE
  DetachedImport      = TRUE
  AnonAsCreate        = FALSE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  OneByOneOnRefusal   = TRUE
  RegisterEachOnRefusal = TRUE
  RequireNode         = TRUE
INVARIANT INV_CreatorAsCreate
CHECK_DEADLOCK FALSE
