\* GREEN: the code as written. The asker a asks three peers; gossip hands
\* each its first copy straight from a or relayed by a peer that already had
\* it, in every order, and the deadline may pass at any moment. Every peer
\* answers the request's publisher, a, and each answer travels before it
\* lands. No answer may be lost, the deadline may cut off only an answer
\* not yet sent or still on its way, and the asker always stops waiting.
SPECIFICATION Spec
CONSTANTS
  Asker           = a
  Peers           = {p1, p2, p3}
  AnswerPublisher = TRUE
INVARIANT TypeOK
INVARIANT INV_NoAnswerLost
INVARIANT INV_AllAnswered
PROPERTY LIVE_Done
PROPERTY LIVE_AllArrive
CHECK_DEADLOCK FALSE
