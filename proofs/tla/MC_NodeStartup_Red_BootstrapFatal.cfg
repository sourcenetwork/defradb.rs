\* RED: a bootstrap peer that does not answer fails startup. Go starts the node
\* and lets the peer be dialed later. Must fail INV_BootstrapNonFatal.
SPECIFICATION Spec
CONSTANTS
  ScheduleToIroh       = TRUE
  ShutdownOnListenFail = TRUE
  ValidateFirst        = TRUE
  OwnerPassed          = TRUE
  ConnectAfterNac      = TRUE
  BootstrapNonFatal    = FALSE
INVARIANT INV_BootstrapNonFatal
CHECK_DEADLOCK FALSE
