\* RED (l), caller contract C2 broken: a caller shuts down the pool
\* default_pool() started. c2 starts s2; c1 stops s2 and then asks: nothing is
\* registered, the cell still holds s2, and s2 is closing, so it is the answer.
\* The cell is never filled again, so from then on every call off a registered
\* pool is handed a pool that refuses work. Two callers and no registrable pool.
\* Must fail INV_NeverHandsOutClosing.
SPECIFICATION Spec
CONSTANTS
  NP                 = 0
  NC                 = 2
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = FALSE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverHandsOutClosing
CHECK_DEADLOCK FALSE
