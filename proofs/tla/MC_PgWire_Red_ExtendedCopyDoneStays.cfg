\* RED: an extended copy's CopyDone does not leave the copy state, as the code
\* did before the fix. A handler starts a copy from Execute (pgwire allows it;
\* no pg-compat handler does today), and the copy's CopyDone succeeds. The
\* connection stays CopyInProgress(true), and the Sync the client sends next is
\* dropped as a copy-mode message: the client never gets its ReadyForQuery.
\* Must fail INV_CopyEnds.
SPECIFICATION Spec
CONSTANTS
  Limit              = 1
  MaxTime            = 0
  MaxMsgs            = 4
  PreMsgs            = {"anon"}
  PostMsgs           = {"ext", "done", "sync"}
  SimpleCopy         = FALSE
  ExtendedCopy       = TRUE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = FALSE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_CopyEnds
CHECK_DEADLOCK FALSE
