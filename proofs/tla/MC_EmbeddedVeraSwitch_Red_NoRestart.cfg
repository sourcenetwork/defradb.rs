\* run-all: EmbeddedVeraSwitch.tla RED
\* a switch that left no node is never undone (LIVE_Recovers)
\* RED: the host has no way to start the node again in its slot (no
\* complete_switch or restart). A switch's launch fails, the slot stays
\* empty, and short of a stop the device never serves again. Fails
\* LIVE_Recovers.
SPECIFICATION Spec
CONSTANTS
  EvictWatch     = TRUE
  AskWithdraws   = TRUE
  AbortOnStop    = TRUE
  SwitchDeadline = TRUE
  ClearsHalted   = TRUE
  RecordsTarget  = TRUE
  Restarts       = FALSE
  LinkShuts      = TRUE
  Reaps          = TRUE
  WaitsRelease   = TRUE
INVARIANT TypeOK
INVARIANT INV_ClosedAfterStop
INVARIANT INV_NoStartAfterStop
INVARIANT INV_SlotRuns
INVARIANT INV_StoppedMeansEnded
INVARIANT INV_DeviceNamesNode
PROPERTY LIVE_NoNodeAfterStop
PROPERTY LIVE_DropStops
PROPERTY LIVE_SwitchEnds
PROPERTY LIVE_WatchWakes
PROPERTY LIVE_StopReturns
PROPERTY LIVE_Recovers
CHECK_DEADLOCK FALSE
