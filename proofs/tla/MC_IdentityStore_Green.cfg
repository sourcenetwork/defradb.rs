\* GREEN: every guard in place. Two holders hold, retain and give back one
\* DID again and again while the process pins and clears it; each hold brings
\* either of two host contexts, so the holders sometimes share one and
\* sometimes do not. The count stays exact, a held DID always answers its
\* key, no key outlives its holders, no holder is re-routed to a signer it
\* did not bring (a hold with the other context is refused while one is
\* held, and the process pins with context a), and a hold that brings the
\* context already held is never refused.
SPECIFICATION Spec
CONSTANTS
  Holders         = {a, b}
  Contexts        = {a, b}
  PinSig          = a
  NoSigner        = none
  MaxSlots        = 2
  AtomicSwap      = TRUE
  CountHolds      = TRUE
  ClearKeepsSlots = TRUE
  ClearKeepsHeld  = TRUE
  RetainNeedsKey  = TRUE
  RefuseOther     = TRUE
  PinRefusesHeld  = TRUE
  SameByContext   = TRUE
INVARIANT TypeOK
INVARIANT INV_CountExact
INVARIANT INV_KeyWhileHeld
INVARIANT INV_KeyMatchesHolders
INVARIANT INV_OwnSigner
INVARIANT INV_AcceptSame
CHECK_DEADLOCK FALSE
