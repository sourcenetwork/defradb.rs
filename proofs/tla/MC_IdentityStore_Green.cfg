\* GREEN: every guard in place. Two holders hold, retain and give back one
\* DID again and again while the process pins and clears it; the count stays
\* exact, a held DID always answers its key, no key outlives its holders, and
\* no holder is re-routed to a signer it did not bring: b, which brings its
\* own signer, is refused while a holds, and the process pins with a's.
SPECIFICATION Spec
CONSTANTS
  Holders         = {a, b}
  PinSig          = a
  NoSigner        = none
  MaxSlots        = 2
  AtomicSwap      = TRUE
  CountHolds      = TRUE
  ClearKeepsSlots = TRUE
  ClearKeepsHeld  = TRUE
  RetainNeedsKey  = TRUE
  RefuseOther     = TRUE
  PinRefusesHeld  = TRUE
INVARIANT TypeOK
INVARIANT INV_CountExact
INVARIANT INV_KeyWhileHeld
INVARIANT INV_KeyMatchesHolders
INVARIANT INV_OwnSigner
CHECK_DEADLOCK FALSE
