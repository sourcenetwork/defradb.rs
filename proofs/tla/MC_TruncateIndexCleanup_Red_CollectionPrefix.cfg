\* run-all: TruncateIndexCleanup.tla RED
\* the collection-wide prefix: short ID 100 sweeps every collection's documents (INV_OtherCollectionIntact)
\* RED: the cleanup deletes the collection's whole index prefix, as before
\* this fix. For a collection whose short ID is written as the byte `d` (100),
\* that prefix is `/d/`, the start of every collection's document keys, so the
\* other collection's document goes too (INV_OtherCollectionIntact).
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  OldIndexes = {1}
  NewIndexes = {2}
  Source = "InTxn"
  Which = "Declared"
  BackfillRead = "Validated"
  Boundary = "Collection"
INVARIANT INV_OtherCollectionIntact
CHECK_DEADLOCK FALSE
