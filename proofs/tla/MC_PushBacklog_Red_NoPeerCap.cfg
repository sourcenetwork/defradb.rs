\* RED (no per-peer cap): nothing caps one peer's running sends, so the slow peer's
\* jobs take every worker and hold the whole pool for a send timeout (30 s each in the
\* real code) while healthy jobs wait.
\* Expect: INV_PeerLeavesAWorker VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcPeers
  SlowPeers <- mcSlowPeers
  Weight <- mcWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  MaxGlitches <- mcMaxGlitches
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Release"
  HandleMode = "FixedWorkers"
  FairnessMode = "Unfair"
  ParkMode = "ParkUnreachable"
INVARIANT INV_TypeOK
INVARIANT INV_PeerLeavesAWorker
