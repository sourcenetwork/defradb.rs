\* run-all: ChunkCleanup.tla RED
\* a merge takes a delete its text still needs (INV_VisibleIsSplit)
\* RED: the bug plants a merge that takes every chunk delete. A peer whose text
\* still uses the chunk, because its own edit won, loses the chunk's only live
\* document and readers miss it (INV_VisibleIsSplit).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CleanWrites = TRUE
  CleanMerges = TRUE
  DropStale = TRUE
  DeleteGuard = FALSE
  NextGen = TRUE
INVARIANT INV_VisibleIsSplit
CHECK_DEADLOCK FALSE
