\* run-all: DeferredIndex.tla RED
\* a full plan of broken documents writes nothing and holds the rest (PROP_HealthyDrains)
\* RED: a plan whose every entry would be carried writes nothing, even when it is
\* full. The cap is already at its largest, one entry. d1 is broken and written
\* before d2, so every plan holds only d1, writes nothing, and never moves it to the
\* tail; d2 waits behind it forever (PROP_HealthyDrains).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 2
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
  Poisoned = {d1}
  Carry = "Tail"
  Fixed = "Never"
  MinPlan = 1
  MaxPlan = 1
  Growth = "Capped"
  FullCarry = "Skip"
PROPERTY PROP_HealthyDrains
CHECK_DEADLOCK FALSE
