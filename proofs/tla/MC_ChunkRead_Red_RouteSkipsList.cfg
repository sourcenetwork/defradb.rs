\* run-all: ChunkRead.tla RED
\* similarity route ranks by a superseded chunk (INV_RankedIsBestListed)
\* RED: the bug plants a similarity route that ranks by any honest chunk the index
\* returns, without checking the article's current list. A writer edits the text,
\* and the old chunks stay stored and indexed, nearer than any new one. Before
\* the new text's chunks arrive, the rescore finds no current chunk, so the
\* route keeps the old chunk it read and scores the article by a chunk its text
\* no longer uses (INV_RankedIsBestListed).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = TRUE
  CheckCut = TRUE
  RouteChecksList = FALSE
  RouteOnlyUnruled = TRUE
  HeldKeepsBest = TRUE
  CheckResolved = TRUE
  CheckOwnApp = TRUE
  CheckDelegationScope = TRUE
INVARIANT INV_RankedIsBestListed
CHECK_DEADLOCK FALSE
