\* RED: the bug plants a similarity route that ranks by any honest chunk the index
\* returns, without checking the article's current list. A writer edits the text,
\* the old chunks stay stored and indexed, and they rank above the new one. The
\* route then scores the article by a chunk its text no longer uses
\* (INV_RankedIsBestListed).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = TRUE
  CheckListed = TRUE
  RouteChecksList = FALSE
INVARIANT INV_RankedIsBestListed
CHECK_DEADLOCK FALSE
