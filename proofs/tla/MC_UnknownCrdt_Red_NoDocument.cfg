\* RED: B makes no document for a block whose only part it parked. A writes one
\* block that only sets the custom field; B, without the type, parks it and
\* holds no document. Built with the type, B merges the block and removes its
\* record, but there is no document to write the value into, so B shows no
\* document while A has one. Must fail INV_ConvergeWhenDone.
SPECIFICATION Spec
CONSTANTS
  MaxBlocks = 2
  MaxVal    = 2
  Mode      = "NoDocument"
INVARIANT INV_ConvergeWhenDone
CHECK_DEADLOCK FALSE
