\* run-all: ChunkFollow.tla RED
\* doc sync without the chunks (INV_ChunksFollowParent)
\* RED: the bug plants a document sync that answers with the article's heads
\* only. The peer syncs the article and holds it without its chunks
\* (INV_ChunksFollowParent).
\* The text is encrypted, so the peer's merge builds none of its chunks.
SPECIFICATION Spec
CONSTANTS
  Articles = {pub, priv}
  Matching = {pub}
  ChunkRule = "parent"
  SyncRule = "none"
  DeletesFollow = TRUE
  Reconcile = FALSE
  Cascade = TRUE
INVARIANT INV_ChunksFollowParent
CHECK_DEADLOCK FALSE
