\* A branchable collection: the filter is not asked, and every event merges.
\* All invariants hold.
SPECIFICATION Spec
CONSTANTS
  Branchable = TRUE
  AskMode = "BeforePersist"
  BatchMode = "PerEvent"
  FinalMode = "Terminal"
  ScopeMode = "SkipBranchable"
INVARIANTS INV_RefusedNothingStored INV_KeptMerged INV_MergedOnce INV_BranchableUnfiltered
CHECK_DEADLOCK FALSE
