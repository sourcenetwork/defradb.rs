\* RED: enable() turns a disabled NAC back on and adds the caller as an owner;
\* must fail INV_ReEnableNeedsPersistedAdmin, which is listed first because
\* the same step also breaks INV_NoWriteWhileDisabled and
\* INV_NoNonAdminMutatesAdminSet.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Owner <- mcOwner
  Admins0 <- mcAdmins0
  NonAdmins <- mcNonAdmins
  MaxMutations <- mcMaxMutations
  Mode = "BugEnableReEnables"
INVARIANT TypeOK
INVARIANT INV_ReEnableNeedsPersistedAdmin
INVARIANT INV_NoWriteWhileDisabled
INVARIANT INV_DisabledPersistsAcrossRestart
INVARIANT INV_NoNonAdminMutatesAdminSet
