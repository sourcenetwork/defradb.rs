\* RED: the db retry loop before this fix. A write made with the peer
\* connected but not subscribed is announced at once and finds no
\* subscriber; the loop publishes it again while the peer is connected, and
\* once the peer subscribes it gets the write, which Go never sends it. Must
\* fail INV_GoAudience.
SPECIFICATION Spec
CONSTANTS
  SkipWhenAlone = TRUE
  AloneMeansUnsubscribed = TRUE
  RetryWhileConnected = TRUE
INVARIANT TypeOK
INVARIANT INV_GoAudience
CHECK_DEADLOCK FALSE
