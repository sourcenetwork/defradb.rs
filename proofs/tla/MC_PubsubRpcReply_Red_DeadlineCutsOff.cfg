\* RED: the same bug, seen from the asker. Every peer answered, but one
\* answer went to a relay's topic, so the asker never has them all and stops
\* at its deadline: the branchable sync returns with a peer's heads missing,
\* and the `_commits` query sees two or three of four commits. Must fail
\* INV_AllAnswered.
SPECIFICATION Spec
CONSTANTS
  Asker           = a
  Peers           = {p1, p2, p3}
  AnswerPublisher = FALSE
INVARIANT TypeOK
INVARIANT INV_AllAnswered
CHECK_DEADLOCK FALSE
