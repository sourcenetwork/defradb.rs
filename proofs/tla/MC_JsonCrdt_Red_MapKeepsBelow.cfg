\* RED: the writer reads {} at a path that already holds a map as keeping
\* what is below. Alice holds {"a": {"b": 1}} and writes {} at "a". She reads
\* {"a": {"b": 1}}, but {} wipes what she had seen below "a", and the field
\* reads {"a": {}}. Must fail INV_WriteLandsAsRead.
SPECIFICATION Spec
CONSTANTS
  Peers            = {p1, p2}
  MaxBlocks        = 2
  UseCid           = TRUE
  DeleteWins       = FALSE
  DeleteImpliesMap = FALSE
  SharedIds        = FALSE
  MultiPath        = TRUE
  Settle           = TRUE
  ReadAs           = "mapKeepsBelow"
  Anchor           = TRUE
INVARIANT TypeOK
INVARIANT INV_WriteLandsAsRead
