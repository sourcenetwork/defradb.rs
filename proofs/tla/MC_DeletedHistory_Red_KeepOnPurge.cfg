\* RED: the purge leaves the object behind. When the same content is added
\* again under the same DocID, the new document keeps the purged one's reader
\* grant, and that reader reads it. Must fail INV_NoUnintendedRead.
SPECIFICATION Spec
CONSTANTS
  KeepOnDelete   = TRUE
  ReleaseOnPurge = FALSE
  FenceRecreate  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoUnintendedRead
