\* run-all: DocRelationship.tla RED
\* The core skips the target check: a relationship changes although that check fails (INV_NoChangeUnlessAllChecksPass)
\* RED: the core no longer checks that the target parses, so a change to a target that is not a subject lands.
\* Both ways in forward to it, so both make the change.
SPECIFICATION Spec
CONSTANTS
  Skipped = {"target"}
  Swapped = FALSE
  ServerCopy = FALSE
  EventFirst = FALSE
  TxnSwapped = FALSE
INVARIANT INV_NoChangeUnlessAllChecksPass
CHECK_DEADLOCK FALSE
