\* run-all: ReindexFailureListing.tla RED
\* a failed index refuses a write (INV_FailedRefusesNoWrite)
\* RED: writers keep maintaining the index the failure names, as before this
\* fix. A rebuild stops on a clash and leaves its entries, and a write whose
\* value one of them holds is refused while the index lists as failed:
\* INV_FailedRefusesNoWrite fails.
SPECIFICATION Spec
CONSTANTS
  MaxTokens = 3
  NoTokenCheck = FALSE
  KeepFailureOnOwe = FALSE
  NoFinishTokenCheck = FALSE
  KeepProgressOnStop = FALSE
  KeepFailureOnRetry = FALSE
  WritersIgnoreFailure = TRUE
INVARIANT TypeOK INV_FailedRefusesNoWrite INV_FailureIsCurrent INV_SettledNotFailed INV_SettledIsExact
CHECK_DEADLOCK FALSE
