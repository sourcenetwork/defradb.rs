\* RED (guard: the guard's own Arc<Statistics>): the close reaches the
\* statistics through the export's weak handle only. The store drops its own
\* handle first (its metrics drop their statistics field before the guard),
\* so at the close the statistics are gone, nothing is published, and the
\* store's last commit never reaches the total. One read, one export, one
\* count. Must fail INV_ClosedComplete.
SPECIFICATION Spec
CONSTANTS
  NS           = 1
  NR           = 1
  MaxCount     = 1
  Forward      = TRUE
  ClaimByCas   = TRUE
  Retry        = TRUE
  Refresh      = TRUE
  PublishFirst = TRUE
  HoldStats    = FALSE
  OnlyGrow     = TRUE
  OwnStats     = TRUE
  StopFirst    = TRUE
INVARIANT TypeOK
INVARIANT INV_ClosedComplete
CHECK_DEADLOCK FALSE
