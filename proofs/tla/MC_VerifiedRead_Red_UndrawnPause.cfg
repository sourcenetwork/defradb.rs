\* RED: the patience is checked against the shortest pause, but the pause the
\* jitter drew is slept. At step 13 the check sees 13 + 1 < 15 and lets the
\* read sleep a drawn pause of 2, so it is asked again at step 15, when its
\* patience has run out. Must fail INV_AttemptsBounded.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 0
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = TRUE
  MaxBusy     = 8
  RetryBusy   = TRUE
  Patience    = 15
  MaxTook     = 2
  PauseMin    = 1
  PauseMax    = 2
  CountTook   = TRUE
  CheckDrawn  = FALSE
INVARIANT TypeOK
INVARIANT INV_AttemptsBounded
