\* RED: taking a stream for its reply leaves its entry in the table, as a
\* table that handed out a copy would. The deadline then passes and the
\* sweep resets a stream that already has its reply: the peer can lose the
\* reply it was reading. Must fail INV_OneOutcome.
SPECIFICATION Spec
CONSTANTS
  N              = 1
  Cap            = 1
  D              = 1
  Lossy          = FALSE
  DeadlinePasses = TRUE
  TakeOnce       = FALSE
  DropReset      = TRUE
  SweepGuard     = TRUE
  CapGuard       = TRUE
INVARIANT TypeOK
INVARIANT INV_OneOutcome
CHECK_DEADLOCK FALSE
