\* run-all: EncryptionPolicyInheritance.tla RED
\* the empty doc counts as wholly encrypted (INV_HeadlessAllEncrypted)
\* RED: the empty document counts as "every field encrypted". The first
\* write without config on a document with no fields gets the document key
\* though nothing was ever encrypted (INV_HeadlessAllEncrypted).
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 1
  MaxReqWrites = 1
  MaxMerges = 0
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = TRUE
  KeepPrepared = FALSE
  ReprepareStale = TRUE
  UsePending = TRUE
  TornSnapshot = FALSE
  IgnoreConfig = FALSE
INVARIANT INV_HeadlessAllEncrypted
CHECK_DEADLOCK FALSE
