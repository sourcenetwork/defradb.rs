\* RED: the loop reads startup messages with no deadline. A DID user sends its
\* startup, is asked for its token, and never sends it. Must fail
\* INV_StartupWithinDeadline.
SPECIFICATION Spec
CONSTANTS
  Limit              = 2
  MaxTime            = 3
  MaxMsgs            = 2
  PreMsgs            = {"anon", "did"}
  PostMsgs           = {"pwOk"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = FALSE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_StartupWithinDeadline
CHECK_DEADLOCK FALSE
