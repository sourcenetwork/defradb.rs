\* GREEN: the light client refuses an answer a block overtook, the read is
\* asked again, at most 4 times, and the chain finalizes 3 blocks; the node
\* answers busy at most twice, each request takes 1 or 2 steps, each pause
\* is drawn between 1 and 2 steps, and the patience is 15 steps, more than
\* those asks can spend: every read ends with an answer accepted at the
\* newest root.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 3
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = TRUE
  MaxBusy     = 2
  RetryBusy   = TRUE
  Patience    = 15
  MaxTook     = 2
  PauseMin    = 1
  PauseMax    = 2
  CountTook   = TRUE
  CheckDrawn  = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverStale
INVARIANT INV_FailsOnlyWhenEveryAskOvertaken
INVARIANT INV_AttemptsBounded
PROPERTY LIVE_Answers
