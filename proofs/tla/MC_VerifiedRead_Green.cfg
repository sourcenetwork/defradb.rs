\* GREEN: the light client refuses an answer a block overtook, the read is
\* asked again, at most 4 times, and the chain finalizes 3 blocks; the node
\* answers busy at most twice, and a busy read is asked again, at most 3
\* times: every read ends with an answer accepted at the newest root.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 3
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = TRUE
  BusyAttempts = 3
  MaxBusy     = 2
  RetryBusy   = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverStale
INVARIANT INV_FailsOnlyWhenEveryAskOvertaken
INVARIANT INV_AttemptsBounded
PROPERTY LIVE_Answers
