\* run-all: OwnerTransfer.tla RED
\* a transfer the deployment only ever answers with an error is sent for ever (LIVE_Decided)
\* RED: unbounded retries. The deployment answers the transfer only with
\* errors, and the node sends it again every time: it is never decided,
\* neither applied nor refused. Must fail LIVE_Decided.
SPECIFICATION SpecLive
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = TRUE
  CommitConflict = TRUE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = FALSE
  Poisoned       = {2}
  MaxFails       = 2
  MaxCrashes     = 0
  MaxLapses      = 0
  MaxAborts      = 0
  OwnTransfer    = FALSE
PROPERTY LIVE_Decided
CHECK_DEADLOCK FALSE
