\* run-all: PatchInTxn.tla RED
\* a failed patch leaves its local lens registration (INV_FailedPatchLeavesNothing)
\* RED: the storage writes are rolled back, but the statement-local lens store is
\* not restored. A failed patch therefore leaves its lens visible in the caller's
\* transaction, and committing that transaction lands a lens the client was told
\* had failed (INV_FailedPatchLeavesNothing).
SPECIFICATION Spec
CONSTANTS
  WriteThroughTxn = TRUE
  PublishOnCommit = TRUE
  FollowUpOnCommit = TRUE
  RefreshCatalog = TRUE
  RollBackFailed = TRUE
  RestoreLensStore = FALSE
  AwaitFollowUp = TRUE
  ValidateDefinitions = TRUE
INVARIANT INV_FailedPatchLeavesNothing
CHECK_DEADLOCK FALSE
