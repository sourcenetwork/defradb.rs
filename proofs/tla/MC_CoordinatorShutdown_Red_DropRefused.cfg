\* RED: the old code. A refused drain is dropped instead of run in place
\* (network().spawn(drain) on a closed edge). Its sender drops with it, so the
\* callers return with an error, and the task in the tracked set, never joined
\* nor aborted, keeps the coordinator alive for good. Must fail INV_NoLeak.
SPECIFICATION Spec
CONSTANTS
  Callers          = {"c1"}
  Tasks            = {"t1"}
  Late             = {}
  CanKill          = FALSE
  SwapFlag         = TRUE
  AtomicSpawn      = TRUE
  RunRefused       = FALSE
  DrainOwnsSender  = TRUE
  WaitForPruners   = TRUE
  PrunerChecksFlag = TRUE
  RecheckAfterPush = TRUE
  AbortAtDeadline  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoLeak
CHECK_DEADLOCK FALSE
