\* run-all: ProllyNodeReclaim.tla RED
\* nodes committed before their root are swept (SweepKeepsLiveRoots)
\* The bug: the writer commits the nodes of the new root first, and publishes
\* the root in a later transaction. Between the two, a sweep sees those nodes
\* named by no root and deletes them. The root then goes out naming nodes the
\* store no longer holds. SweepKeepsLiveRoots fails.
SPECIFICATION Spec
CONSTANTS
  RootsInTxn = TRUE
  ValidateRoots = TRUE
  PublishWithNodes = FALSE
  OnlyDeleteUnmarked = TRUE
INVARIANT TypeHolds
INVARIANT SweepKeepsLiveRoots
CHECK_DEADLOCK FALSE
