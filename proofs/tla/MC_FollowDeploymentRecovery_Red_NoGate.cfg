\* run-all: FollowDeploymentRecovery.tla RED
\* deciding while the journal is closed: a lost revocation not owed yet lets the grant through (INV_RevocationDenies)
\* RED: the node decides while its journal is closed. The deployment lost a
\* revocation and still grants; the pass has not owed it yet, so nothing
\* denies, and the decision allows. Must fail INV_RevocationDenies.
SPECIFICATION Spec
CONSTANTS
  Records       = 3
  Revoked       = {2, 3}
  PageSize      = 2
  MaxTakeovers  = 2
  MaxCrashes    = 1
  Gate          = FALSE
  HandOver      = TRUE
  OweFirst      = TRUE
  EndFromLedger = TRUE
  SaysDone      = TRUE
  TermFence     = TRUE
  SharedFence   = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingLost
INVARIANT INV_RevocationDenies
PROPERTY LIVE_RecoveryEnds
