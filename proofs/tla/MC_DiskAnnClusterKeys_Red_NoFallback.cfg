\* run-all: DiskAnnClusterKeys.tla RED
\* a search trusts the cache's cluster and misses a record its snapshot holds
\* Plants the bug of reading only the key the shared cache names. Node a is consolidated and linked again into another cluster; a search loads the cache at the new generation, and a search still at the old snapshot looks for a under the new cluster, finds nothing, and skips a node its snapshot holds, so INV_FindsRecord fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Ids = {a, b}
          Clusters = {c1, c2}
          MaxGen = 4
          KeepCluster = TRUE
          Fallback = FALSE
INVARIANT INV_OneRecord
INVARIANT INV_FindsRecord
