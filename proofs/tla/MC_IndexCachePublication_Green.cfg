\* run-all: IndexCachePublication.tla GREEN
\* #2913: index creates and backfill settlements keep the collection cache in step with the store
\* GREEN: two indexes created while a writer's hook holds back cache
\* publications, an unrelated publication at any time, and backfills that
\* end built or failed. A create returns only after its publication ran, a
\* backfill's settling commit publishes the index itself, and every
\* publishing transaction reads the index statuses as a validated scan.
SPECIFICATION Spec
CONSTANTS
  PublishMode = "Wait"
  SettleMode = "Commit"
  StatusRead = "Validated"
INVARIANT INV_TypeOK INV_ReturnSeesOwn INV_CacheMatchesStore
CHECK_DEADLOCK FALSE
