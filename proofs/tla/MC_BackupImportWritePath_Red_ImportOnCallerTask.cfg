\* run-all: BackupImportWritePath.tla RED
\* a caller that stops waiting drops the driver before a registration (INV_SavedRegistered)
\* RED: the Node import's driver runs on its caller's task, held there
\* by its admission, not as a network task of its own. A caller that stops
\* waiting (a timeout or a select around import_backup_as) drops the driver
\* right after a batch's create committed and before its registration, so the
\* saved document never gets its alias and a later import can give that file
\* ID to another document. Must fail INV_SavedRegistered.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  HoldImport          = TRUE
  DetachedImport      = FALSE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  OneByOneOnRefusal   = TRUE
  RegisterEachOnRefusal = TRUE
  RequireNode         = TRUE
  ImportRouteOnEdge   = TRUE
INVARIANT INV_SavedRegistered
CHECK_DEADLOCK FALSE
