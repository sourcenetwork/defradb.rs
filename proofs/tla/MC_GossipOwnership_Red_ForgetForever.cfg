\* RED: gossip may drop the healthy peer forever: every time it learns the
\* peer again it may drop it before opening a path. Nothing promises the
\* peer is ever reached, and TLC finds that run (LIVE_HealthyReached).
SPECIFICATION Spec
CONSTANTS
  Peers <- mcPeers
  Revocable <- mcRevocable
  Healthy = "h"
  Legacy = {}
  MaxDrops = 1
  MaxForgets = 1
  ForgetBound = "Unbounded"
  PathMode = "SharedMux"
  RecheckMode = "Recheck"
  ForgetMode = "DropSender"
  LegacyMode = "Answer"
PROPERTY LIVE_HealthyReached
