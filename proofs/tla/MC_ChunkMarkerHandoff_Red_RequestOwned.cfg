\* Plants the bug: the request's own future registers the markers. The
\* deadline fires after the article's marker is written and drops the chunks
\* still waiting, so no marker or retry ever covers them.
\* INV_CommittedHeadOwned fails.
SPECIFICATION Spec
CONSTANTS
  Heads = {"article", "chunk1", "chunk2"}
  Owner = "Request"
INVARIANT TypeOK
INVARIANT INV_CommittedHeadOwned
CHECK_DEADLOCK FALSE
