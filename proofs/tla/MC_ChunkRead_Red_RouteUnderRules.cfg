\* RED: the bug plants a planner that routes a ranking even when the article has
\* read rules. The route checks no grant, so after the owner revokes the reader's
\* access the ranking still scores the article (INV_RankedIsBestListed).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = TRUE
  CheckListed = TRUE
  RouteChecksList = TRUE
  RouteOnlyUnruled = FALSE
INVARIANT INV_RankedIsBestListed
CHECK_DEADLOCK FALSE
