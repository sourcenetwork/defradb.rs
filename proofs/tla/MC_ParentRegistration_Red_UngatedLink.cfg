\* AuthorizedAtWrite
\* Plants the bug: a parent link is added to a registered document without
\* checking the permission on the new parent. The owner of a document links it under a
\* parent it holds nothing on: AuthorizedAtWrite fails.
SPECIFICATION Spec
CONSTANT Bug = "link"
INVARIANT AuthorizedAtWrite
INVARIANT RegistrationHasParent
INVARIANT FieldNamesAdmittedParent
CHECK_DEADLOCK FALSE
