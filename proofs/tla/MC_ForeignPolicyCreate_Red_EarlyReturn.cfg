\* run-all: ForeignPolicyCreate.tla RED
\* a create that returns before the light client has seen its policy lets a later add route it (INV_NoShadow)
\* RED: the create returns, dropping its mark, as soon as it lands, before
\* the node's own light client has seen P. An add that starts then finds no
\* create in flight and a light client that does not see P, and routes it
\* while the deployment holds it. Must fail INV_NoShadow.
SPECIFICATION Spec
CONSTANT Bug = "earlyReturn"
INVARIANT INV_NoShadow
CHECK_DEADLOCK FALSE
