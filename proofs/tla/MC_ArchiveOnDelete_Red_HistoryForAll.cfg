\* run-all: ArchiveOnDelete.tla RED
\* an owed archive leaves the commit history to everyone: the reader reads a deleted document's history (INV_HistoryOnlyToDeleter)
\* RED: an owed archive leaves the commit history to everyone, not to its
\* actor alone. After the owner deletes the document the reader asks for its
\* commit history and gets it, though the document is deleted and its
\* archive is on the way. Must fail INV_HistoryOnlyToDeleter.
SPECIFICATION Spec
CONSTANTS
  CheckOwner  = TRUE
  Drop        = TRUE
  VeraRefuses = TRUE
  Overlay     = TRUE
  HistoryActorOnly = FALSE
  First       = "archive"
INVARIANT TypeOK
INVARIANT INV_HistoryOnlyToDeleter
