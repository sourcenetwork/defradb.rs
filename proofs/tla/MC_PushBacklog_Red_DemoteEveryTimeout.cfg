\* RED (the first F24 fix): every send timeout also moves the peer's queued jobs to
\* the retry ledger, probe or not. No peer is dead here: a healthy peer's first send
\* times out, and its queued jobs go to the ledger in that step, before any probe ran,
\* so they wait for the serial retry sweep instead of going out live.
\* Expect: ACT_DemoteAfterFailedProbe VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcHealthyPeers
  SlowPeers <- mcNoSlowPeers
  Weight <- mcHealthyWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Release"
  HandleMode = "FixedWorkers"
  FairnessMode = "PerPeerCap"
  ParkMode = "DemoteEveryTimeout"
INVARIANT INV_TypeOK
PROPERTY ACT_DemoteAfterFailedProbe
