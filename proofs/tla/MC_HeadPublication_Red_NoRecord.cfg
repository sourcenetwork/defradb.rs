\* run-all: HeadPublication.tla RED
\* nothing records a publication: a replay of a superseded block makes it a head again (INV_LiveExact)
\* The guard key removed with nothing in its place: no publication leaves a
\* record. p is published, its child c supersedes it, and p's replay adds it
\* again: p is a head under its own child. INV_LiveExact fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Record = "None"
  OwnRead = "Validated"
  PartRead = "Names"
INVARIANT TypeOK
INVARIANT INV_LiveExact
