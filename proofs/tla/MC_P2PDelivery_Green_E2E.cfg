\* The target contract end to end, none of it on main yet except the
\* connection rule, which the gents rc1 pin has. Coverage is judged by
\* ancestry, a stop drains writes before P2P stops, the hub registers its
\* forward before the mark discharges its record, replicators are restored
\* before the loops start, a failed registration is retried for its own peer
\* and touches no other, and every connection is fully registered. Through
\* one crash of a or h and one failed registration or forward, every head
\* stays owed on every edge, no request goes out on a connection its peer
\* does not serve, and every head reaches every node.
