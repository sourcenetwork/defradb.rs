\* backfill pages read documents unvalidated: an entry commits after the cleanup (INV_NoEntryForTruncatedDoc)
\* RED: a backfill page reads its documents without validating them. A page
\* that read a document before its chunk deleted it commits the entry after
\* the cleanup is done, so the entry outlives the truncate
\* (INV_NoEntryForTruncatedDoc).
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  OldIndexes = {1}
  NewIndexes = {2}
  Source = "InTxn"
  Which = "Declared"
  BackfillRead = "Snapshot"
  Boundary = "Index"
INVARIANT INV_NoEntryForTruncatedDoc
CHECK_DEADLOCK FALSE
