\* RED: a turn's end leaves its pin in the catalog. A request pins an old
\* version and ends; the next request on the transaction pins nothing yet its
\* lookups still answer the old version. Must fail INV_PinScoped.
SPECIFICATION Spec
CONSTANTS
  Versions         = {v1, v2}
  None             = none
  MaxSteps         = 7
  ClearPin         = FALSE
  NoWriteBackOnPin = TRUE
INVARIANT INV_PinScoped
CHECK_DEADLOCK FALSE
