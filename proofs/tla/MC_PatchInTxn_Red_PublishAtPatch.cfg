\* run-all: PatchInTxn.tla RED
\* shared cache updated at patch time (INV_IsolatedUntilCommit)
\* RED: the shared collection cache is updated when the patch runs, not by the
\* commit's callbacks. Every other request reads the patched definition before
\* the commit, and keeps reading it after a discard (INV_IsolatedUntilCommit).
SPECIFICATION Spec
CONSTANTS
  WriteThroughTxn = TRUE
  PublishOnCommit = FALSE
  FollowUpOnCommit = TRUE
  RefreshCatalog = TRUE
  RollBackFailed = TRUE
  RestoreLensStore = TRUE
  AwaitFollowUp = TRUE
  ValidateDefinitions = TRUE
INVARIANT INV_IsolatedUntilCommit
CHECK_DEADLOCK FALSE
