\* RED: the bug plants a chunk gate that never asks whether the reader may read the
\* parent article. The owner revokes the reader's access, and a query still shows the
\* article's chunks to someone who may not see them (INV_ShownIsLiveAndReadable).
\* A ranking of the article with read rules still scores it (INV_RankedIsBestListed).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = FALSE
  CheckListed = TRUE
  RouteChecksList = TRUE
  RouteOnlyUnruled = TRUE
INVARIANT INV_ShownIsLiveAndReadable
CHECK_DEADLOCK FALSE
INVARIANT INV_RankedIsBestListed
