\* Slow failures are stalls, free refusals are capped and an empty budget skips
\* the batch: six batches over two providers wait at most one rotation plus the
\* free refusals.
INIT Init
NEXT Next
CONSTANTS Batches = 6
          Providers = 2
          Window = 3
          Fast = 1
          MaxFree = 2
          SlowMode = "Stall"
          CapMode = "Capped"
          CheckMode = "Check"
INVARIANT INV_TypeOK
INVARIANT INV_WaitBounded
CHECK_DEADLOCK FALSE
