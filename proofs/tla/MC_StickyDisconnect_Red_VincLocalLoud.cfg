\* RED: vinc with the local half removed. The peer still reads the close
\* code and stays quiet, but the node that hung up forgets at once, so a late
\* list naming the peer has it dial back. Must fail
\* NoRedialAfterDeliberateClose.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = FALSE
  RemoteQuiet = TRUE
  Unquiet = TRUE
  OnlyDiscoveryChecked = TRUE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT NoRedialAfterDeliberateClose
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
