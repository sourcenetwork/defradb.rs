\* RED: B merges a parked block but keeps its record, so the next build merges
\* it again: a custom type whose merge is not idempotent (a counter) would
\* count it twice. Must fail INV_MergeOnce.
SPECIFICATION Spec
CONSTANTS
  MaxBlocks = 2
  MaxVal    = 1
  Mode      = "DoubleReplay"
INVARIANT INV_MergeOnce
CHECK_DEADLOCK FALSE
