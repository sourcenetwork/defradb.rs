\* Bug: a replay registers its retry markers for whatever install is current, not its own.
\* A collection removal mid-replay rewrites the peer with a new incarnation, and the stale
\* replay then leaves markers the new install's retry sweep would send (INV_MarkerOwner).
SPECIFICATION Spec
CONSTANT MarkerMode = "current"
CONSTANT ReplayMode = "fenced"
CONSTANT Stale = "retry"
INVARIANT INV_MarkerOwner
CHECK_DEADLOCK FALSE
