\* RED: no per-peer share. Peer a stalls two control bodies and holds the whole
\* control budget, so the healthy control message times out.
\* Expect LIVE_HealthyHandled to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  PeerOf <- mcPeerOf
  ClassOf <- mcClassOf
  Classes <- mcClasses
  Healthy = "h1"
  Stalls <- mcStalls
  StuckClasses <- mcStuckClasses
  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "PerClass"
  ShareMode = "None"
  DrainMode = "PerClass"
  LeaseMode = "UntilHandled"
  ReadMode = "AdmitFirst"
  DeadlineMode = "Deadline"
INVARIANT INV_TypeOK
PROPERTY LIVE_HealthyHandled
