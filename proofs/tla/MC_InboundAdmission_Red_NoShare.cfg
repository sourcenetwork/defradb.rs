\* RED: no per-connection share. Connection a gets both its bulk bodies in
\* and holds the whole bulk class. Expect INV_ShareBound to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  ConnOf <- mcConnOf
  ClassOf <- mcClassOf
  LaneOf <- mcLaneOf
  Classes <- mcClasses
  Lanes <- mcLanes
  Healthy = "h1"
  Stalls <- mcStalls
  Trickles <- mcTrickles
  StuckClasses <- mcStuckClasses
  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "PerClass"
  ShareMode = "None"
  DrainMode = "PerLane"
  LeaseMode = "UntilHandled"
  ReadMode = "AdmitFirst"
  DeadlineMode = "Deadline"
  ReadDeadlineMode = "Deadline"
INVARIANT INV_TypeOK
INVARIANT INV_ShareBound
