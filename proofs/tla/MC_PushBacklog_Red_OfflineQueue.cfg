\* RED: the first offline probe discards the peer's queued jobs instead of
\* leaving them for the reconnect window.
\* Expect: ACT_OfflineParkKeepsQueue VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcHealthyPeers
  SlowPeers <- mcNoSlowPeers
  Weight <- mcHealthyWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Release"
  HandleMode = "FixedWorkers"
  FairnessMode = "PerPeerCap"
  ParkMode = "ParkUnreachable"
  OfflineMode = "DropQueue"
INVARIANT INV_TypeOK
PROPERTY ACT_OfflineParkKeepsQueue
