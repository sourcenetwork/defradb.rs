\* RED: a refused flush drops its handle with the refused closure, so the
\* handle's drop runs the exporter join on the shutdown caller, blocking it for
\* seconds. Must fail INV_CallerNeverJoinsExporter.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = FALSE
INVARIANT INV_CallerNeverJoinsExporter
CHECK_DEADLOCK FALSE
