\* run-all: HistoryRetention.tla RED
\* #559: a live composite head below the window is pruned (INV_HeadsStored)
\* Bug planted: the prune picks composites by height alone. b2 is a concurrent head at height 2, below the window of c4, and is deleted: INV_HeadsStored fails.
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Prune"
  FieldMode = "Keep"
  LinkMode = "Keep"
  ScanMode = "Validated"
  MarkerMode = "Keep"
  WindowMode = "Exact"
  ReclaimMode = "Scan"
  ReadMode = "Refuse"
  MaxPrunes = 2
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned INV_Reclaimed INV_KeptLinksStored INV_NoPartialRead
CHECK_DEADLOCK FALSE
