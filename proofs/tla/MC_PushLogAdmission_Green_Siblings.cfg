\* GREEN (F1 fix): one sender scope pushes a base head and two siblings over it. A head
\* retires the scope's current head only when it links it as a parent, and nothing is
\* covered, so each sibling keeps its own registration. Every acked head stays reachable
\* from what the hub holds, and under scheduler fairness every head merges.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Heads     <- mcHeads
  Parent    <- mcSiblingParents
  Prio      <- mcSiblingPrio
  ScopeOf   <- mcOneScope
  Cap       <- mcSiblingCap
  Quota     <- mcSiblingCap
  ReplyMode = "NackOnFull"
  CoverRule = "Parent"
  GuardMode = "Committed"
  QuotaMode = "Store"
INVARIANT INV_TypeOK
INVARIANT INV_AckedHeadReachable
PROPERTY EventuallyAllMerged
