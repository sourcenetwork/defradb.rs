\* GREEN: the writer is restored from a backup and mints a new key, admitted again before it writes. No honest key is ever proven forked, and the rest of the guarantees hold with one cheater key.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  Peers <- mcPeers
  CheaterKeys <- mcOneCheaterKey
  HonestKey <- mcHonestKey
  RestoreKey <- mcRestoreKey
  WriterHome <- mcWriterHome
  Budget <- mcBudget
  CheckMembership = TRUE
  CheckEvidence = TRUE
  RetryOnAdmission = TRUE
  RotateOnRestore = TRUE
  Restores = TRUE
INVARIANT TypeOK
INVARIANT INV_OnlyAdmittedWrite
INVARIANT INV_CheaterWithinBudget
INVARIANT INV_NoMergeAfterProof
INVARIANT INV_NoWrongfulRevocation
PROPERTY PROP_AdmittedWritesLand
