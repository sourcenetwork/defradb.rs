\* run-all: DacPolicyAdd.tla GREEN
\* #2321: add DAC policy checks nac, acp, creator, data, valid in Go's order; a remote ACP's policy is kept locally before its ID goes back
\* GREEN: add a DAC policy. All five checks run in Go's order before the
\* store, a remote ACP's policy is kept locally before its ID goes back, and
\* a counter is taken only locally and a nonce only remotely.
\* Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Enforced = {"nac", "acp", "creator", "data", "valid", "mirror", "seed"}
  CreatorFirst = FALSE
INVARIANT TypeOK
INVARIANT INV_NoPolicyWithoutPermission
INVARIANT INV_NoPolicyWithoutCreator
INVARIANT INV_NoInvalidPolicy
INVARIANT INV_NoPolicyWithoutAcp
INVARIANT INV_ReturnedIsKeptLocally
INVARIANT INV_NoSilentFailure
INVARIANT INV_GoOrder
INVARIANT INV_SeedHonoured
CHECK_DEADLOCK FALSE
