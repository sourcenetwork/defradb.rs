\* GREEN: add a DAC policy. All five checks run in Go's order before the
\* store, and a remote ACP's policy is kept locally before its ID goes back.
\* Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Enforced = {"nac", "acp", "creator", "data", "valid", "mirror"}
  CreatorFirst = FALSE
INVARIANT TypeOK
INVARIANT INV_NoPolicyWithoutPermission
INVARIANT INV_NoPolicyWithoutCreator
INVARIANT INV_NoInvalidPolicy
INVARIANT INV_NoPolicyWithoutAcp
INVARIANT INV_ReturnedIsKeptLocally
INVARIANT INV_NoSilentFailure
INVARIANT INV_GoOrder
CHECK_DEADLOCK FALSE
