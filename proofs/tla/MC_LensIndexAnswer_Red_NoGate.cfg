\* RED: the gate is removed, so the index answers even while a reindex is
\* owed. Right after the migration the entry still holds the old value while
\* a query reads the migrated one: INV_IndexMatchesReads fails.
SPECIFICATION Spec
CONSTANTS
  Gate = "none"
  OweOnSchemaChange = TRUE
  OweOnMerge = TRUE
  SkipIfOwed = FALSE
  ClearChecksToken = TRUE
  ScanRechecksOwed = TRUE
  MaxSteps = 6
INVARIANT TypeOK INV_IndexMatchesReads INV_SettledIndexAnswers INV_ScanMatchesReads
CHECK_DEADLOCK FALSE
