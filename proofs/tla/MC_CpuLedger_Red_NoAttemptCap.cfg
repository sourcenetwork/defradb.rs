\* RED (e): reserve has no cap on its claims alone. Pool A holds CPU 0 and
\* keeps running; pool B plans on CPU 0 again after every lost claim, loses
\* again, and never starts: Pool::start never returns. Must fail
\* LIVE_StartEnds.
\* Two CPUs, two pools living once each (Attempts is not used: the cap is
\* off): small, and still every interleaving of the scenario above.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 1
  Attempts         = 1
  AtomicTake       = TRUE
  RollBack         = TRUE
  InsertAfterWin   = TRUE
  ShareCounts      = TRUE
  AttemptCap       = FALSE
  KeepWhileRunning = TRUE
  ReleaseOnce      = TRUE
  RunOnHeld        = TRUE
  ReleaseAtEnd     = TRUE
INVARIANT TypeOK
PROPERTY LIVE_StartEnds
CHECK_DEADLOCK FALSE
