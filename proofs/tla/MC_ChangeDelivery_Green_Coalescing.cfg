\* GREEN: the coalescing channel (document change notifications), with the
\* same writes, re-merge and crash; every update is observed once, in order.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Updates = {u1, u2, u3}
  Merged = {u2}
  Cap = 1
  MaxCrashes = 1
  Channel = "coalescing"
  Mode = "safe"
INVARIANT TypeOK
INVARIANT INV_ExactlyOnce
INVARIANT INV_CommitOrder
INVARIANT INV_LossCounted
PROPERTY EventuallyObserved
