\* RED (the old rule): the merge loop starts a block sync for a root with no
\* source peer, finds its completion already latched, and completes another
\* root's DAG inline. It waits for room in its own full channel to report
\* it, and nobody else drains that channel.
\* INV_MergeLoopNeverWaitsOnItself fails.
SPECIFICATION WSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1}
  Cols           = {}
  MaxV           = 1
  Cap            = 1
  FetchCap       = 1
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MaxAttempts    = 3
  AttemptMode    = "PerAttempt"
  RearmMode      = "AttemptEnd"
  ExpiryMode     = "AckRetained"
  Dead           = {}
  Trickle        = {}
  CutoffMode     = "Quantum"
  SharedPeer     = {}
  PeerPermits    = 1
  MaxPulls       = 0
  PermitMode     = "WithSlot"
  DispatchPath   = "OwnLane"
  HandlerSend    = "Blocking"
  LaneTurns      = "Bounded"
  Storm          = TRUE
  FifoCap        = 1
INVARIANT INV_DispatchTypeOK
INVARIANT INV_MergeLoopNeverWaitsOnItself
