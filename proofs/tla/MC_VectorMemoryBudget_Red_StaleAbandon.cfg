\* run-all: VectorMemoryBudget.tla RED
\* an older search's cancellation clears a newer reload's claim
\* RED: abandoning a search that no longer owns the reload clears the newer owner's claim, so INV_NoClaimClearedByStaleAbandon fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Searches = {s1, s2}
          Limit = 3
          Codes = 3
          MaxGen = 2
          AtomicTake = TRUE
          ReleaseOnDrop = TRUE
          DropOldFirst = TRUE
          NoMissesWhileLoading = TRUE
          SingleFlight = TRUE
          OwnedFinish = TRUE
          OwnedStep = TRUE
          OwnedAbandon = FALSE
          NoPendingWhileLoading = TRUE
INVARIANT INV_NoClaimClearedByStaleAbandon
SYMMETRY Symmetry
