\* Bug: an owner's destructor removes the root's entry without checking it holds its own generation.
\* The claimant that lost the race is dropped, frees the winner's slot, and another root is admitted
\* while the winner still works, so more roots work than there are slots (INV_Capacity).
SPECIFICATION Spec
CONSTANTS
  Bug = "no-generation"
  Cap = 1
  MaxGen = 3
INVARIANT INV_Capacity
CHECK_DEADLOCK FALSE
