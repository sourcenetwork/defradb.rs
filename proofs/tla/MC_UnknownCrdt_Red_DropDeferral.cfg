\* RED: B acknowledges a custom block without keeping a record of it. A stops
\* offering it, and nothing on B ever merges its custom part, so after B is
\* built with the type it still lacks the value. Must fail
\* INV_ConvergeWhenDone.
SPECIFICATION Spec
CONSTANTS
  MaxBlocks = 3
  MaxVal    = 2
  Mode      = "DropDeferral"
INVARIANT INV_ConvergeWhenDone
CHECK_DEADLOCK FALSE
