\* RED: nodes jail on an accusation alone, with no fork as proof. The cheater accuses an honest node and gets it jailed (INV_NoWrongfulJail).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Honest <- mcHonest
  Cheater <- mcCheater
  Peers <- mcPeers
  Heights <- mcHeights
  CheckEvidence = FALSE
  EnforceJail = TRUE
  GossipEvidence = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWrongfulJail
