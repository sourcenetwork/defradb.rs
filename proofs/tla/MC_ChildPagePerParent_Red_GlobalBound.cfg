\* run-all: ChildPagePerParent.tla RED
\* one global child bound lets the first parent consume the bound and leaves B without its page (INV_SecondParentKeepsPage)
\* RED: the planted bug is one bound shared by every parent. The first parent
\* takes its two children, which uses the whole bound, so the scan stops with
\* the second parent holding none of the two it was owed.
SPECIFICATION Spec
CONSTANTS
  Mode        = "Global"
  StopAtLimit = TRUE
  Limit       = 2
  Parents     = {"a", "b"}
  ChildrenOfA = {1, 2}
  ChildrenOfB = {3, 4}
INVARIANT TypeOK
INVARIANT INV_SecondParentKeepsPage
CHECK_DEADLOCK FALSE
