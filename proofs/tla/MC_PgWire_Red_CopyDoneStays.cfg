\* RED: a simple copy's CopyDone does not leave the copy state. The copy
\* succeeds, ReadyForQuery goes out, and the connection still drops every query
\* as a copy-mode message. Must fail INV_CopyEnds.
SPECIFICATION Spec
CONSTANTS
  Limit              = 1
  MaxTime            = 0
  MaxMsgs            = 3
  PreMsgs            = {"anon"}
  PostMsgs           = {"query", "done"}
  SimpleCopy         = TRUE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = FALSE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_CopyEnds
CHECK_DEADLOCK FALSE
