\* run-all: FilteredChunkPush.tla GREEN
\* every fix is in; a re-add widens the filter to the first article
\* GREEN: every fix is in, and the replicator is added again with a filter that
\* matches the first article, which matched nothing before. The replay sends it and its
\* chunk. Every invariant and every liveness property holds.
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {}
  NewMatches = {a1}
  Unreadable = {}
  StaleMarkers = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = TRUE
  ReplayNeedsArticle = TRUE
  ReplayDefersChunk = TRUE
  ReplayChunksOnRefilter = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingUnmatched
INVARIANT INV_ChunkOnlyWithItsArticle
PROPERTY LIVE_RetriesEnd
PROPERTY LIVE_ChunkFollowsItsArticle
PROPERTY LIVE_ReplayShipsChunks
CHECK_DEADLOCK FALSE
