\* RED: setup_pinc does not hand the configured retry ladder on, so the pinc
\* peer and its retry peerstore keep the default one. A node with its own
\* ladder starts retrying on the wrong one. Must fail INV_OneSchedule.
SPECIFICATION Spec
CONSTANTS
  ScheduleToPinc       = FALSE
  ValidateFirst        = TRUE
  OwnerPassed          = TRUE
  ConnectAfterNac      = TRUE
  BootstrapNonFatal    = TRUE
INVARIANT INV_OneSchedule
CHECK_DEADLOCK FALSE
