\* run-all: VectorMemoryBudget.tla RED
\* a reload keeps the old codes until it publishes, so they hold its room
\* RED: a reload keeps the old generation's codes in memory while it loads the new ones, so they hold the room the new codes need and it publishes fewer than fit (INV_FullLoad).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Searches = {s1, s2, s3}
          Limit = 2
          Codes = 3
          MaxGen = 3
          AtomicTake = TRUE
          ReleaseOnDrop = TRUE
          DropOldFirst = FALSE
          NoMissesWhileLoading = TRUE
          SingleFlight = TRUE
          OwnedFinish = TRUE
          OwnedStep = TRUE
          OwnedAbandon = TRUE
          NoPendingWhileLoading = TRUE
INVARIANT INV_BudgetHolds
INVARIANT INV_Accounted
INVARIANT INV_FullLoad
INVARIANT INV_ClaimLostOnlyToNewer
INVARIANT INV_NoTakeAfterLoss
INVARIANT INV_NoClaimClearedByStaleAbandon
SYMMETRY Symmetry
