\* RED: the monitor does not look again after its mark. It reads a long
\* poll, the poll ends and finds no mark, then the mark lands for a poll
\* nobody shows or will look at. Must fail INV_NotLeftStuck.
SPECIFICATION Spec
SYMMETRY MonSymmetry
CONSTANTS
  Limit          = 1
  MaxTime        = 6
  MaxPolls       = 4
  Watchers       = {m1, m2}
  HookBeat       = TRUE
  MarkNamesPoll  = TRUE
  HookClears     = TRUE
  Recheck        = FALSE
  MarkKeepsLive  = TRUE
  ClaimMax       = TRUE
INVARIANT TypeOK
INVARIANT INV_NotLeftStuck
