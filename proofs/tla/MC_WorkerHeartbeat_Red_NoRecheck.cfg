\* RED: the monitor does not look again after its mark. It reads a long
\* poll, the poll ends and finds no mark, then the mark lands on the idle
\* worker and nothing takes it off. Must fail INV_NotLeftStuck.
SPECIFICATION Spec
CONSTANTS
  Limit          = 1
  MaxTime        = 5
  MaxPolls       = 3
  HookBeat       = TRUE
  MarkHoldsStart = TRUE
  HookClears     = TRUE
  Recheck        = FALSE
INVARIANT TypeOK
INVARIANT INV_NotLeftStuck
