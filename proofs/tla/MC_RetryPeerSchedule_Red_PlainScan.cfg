\* run-all: RetryPeerSchedule.tla RED
\* The bug: the scan that found no marker is a plain scan. A registration of
\* scope 2 commits while the acknowledgement of scope 1 (or a clear) is
\* running. The acknowledgement's snapshot had no other marker and nothing it
\* validated changed, so it commits and deletes the row. Scope 2's marker is
\* then durable with no schedule row, and INV_EveryMarkerScheduled fails.
SPECIFICATION Spec
CONSTANT ValidateEmptyScan = FALSE
INVARIANT TypeOK
INVARIANT INV_EveryMarkerScheduled
CHECK_DEADLOCK FALSE
