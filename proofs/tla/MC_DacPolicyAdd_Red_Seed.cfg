\* RED: the store ignores how the caller asked for the ID. A nonce sent to a
\* node with local ACP gets an ID from the node's counter, and a counter sent
\* to a node on vera.rs gets an ID the remote ACP made from a nonce of its own:
\* either way the caller's ID is not the one it computed (INV_SeedHonoured).
SPECIFICATION Spec
CONSTANTS
  Enforced = {"nac", "acp", "creator", "data", "valid", "mirror"}
  CreatorFirst = FALSE
INVARIANT INV_SeedHonoured
CHECK_DEADLOCK FALSE
