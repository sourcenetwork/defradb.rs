\* run-all: EmbeddedVeraSwitch.tla RED
\* a switch goes on launching during the shutdown (INV_NoStartAfterStop)
\* RED: a switch in progress ignores a stop that begins
\* (HostedNode::unless_stopped without the stopping event). The switch halts
\* the old node, the stop begins and waits for the slot, and the switch
\* launches a new Vera node during the shutdown, which as the validator
\* could finalize blocks nobody asked for. Fails INV_NoStartAfterStop.
SPECIFICATION Spec
CONSTANTS
  EvictWatch     = TRUE
  AskWithdraws   = TRUE
  AbortOnStop    = FALSE
  SwitchDeadline = TRUE
  ClearsHalted   = TRUE
  RecordsTarget  = TRUE
  ReportFails    = FALSE
  ObservesCommit = TRUE
  Restarts       = TRUE
  LinkShuts      = TRUE
  Reaps          = TRUE
  WaitsRelease   = TRUE
INVARIANT TypeOK
INVARIANT INV_ClosedAfterStop
INVARIANT INV_NoStartAfterStop
INVARIANT INV_SlotRuns
INVARIANT INV_StoppedMeansEnded
INVARIANT INV_DeviceNamesNode
PROPERTY LIVE_NoNodeAfterStop
PROPERTY LIVE_DropStops
PROPERTY LIVE_SwitchEnds
PROPERTY LIVE_WatchWakes
PROPERTY LIVE_StopReturns
PROPERTY LIVE_Recovers
CHECK_DEADLOCK FALSE
