\* RED: a reconnect restarts the peer clock as well as making it due. A peer
\* that keeps failing comes back for a moment between failed passes; each
\* time its rung falls back, so its next failed pass charges the second rung
\* instead of the one it earned. ACT_SilentPeerBacksOff fails.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder         <- mcLadder
  Steps          = {}
  Scopes         = {d, p}
  Poison         = {p}
  RestartOn      = {"LiveAck", "SupersededAck", "ReplayAck", "Activate"}
  BoundDeadlines = TRUE
INVARIANT TypeOK
PROPERTY ACT_SilentPeerBacksOff
