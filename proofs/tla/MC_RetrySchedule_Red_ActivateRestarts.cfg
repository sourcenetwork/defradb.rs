\* RED: a reconnect restarts the peer clock as well as making it due. A peer
\* that keeps failing comes back for a moment between failed passes; each
\* time its rung falls back, so its next failed pass charges the second rung
\* instead of the one it earned. INV_SilentPeerBacksOff fails.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder    <- mcLadder
  Scopes    = {d, p}
  Poison    = {p}
  RestartOn = {"LiveAck", "ReplayAck", "Activate"}
INVARIANT TypeOK
INVARIANT INV_SilentPeerBacksOff
