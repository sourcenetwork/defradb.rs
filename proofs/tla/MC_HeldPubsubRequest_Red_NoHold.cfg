\* RED: the bug on main. A publish refused before any peer subscribed fails the sync at once,
\* so a peer that subscribes a moment later never gets the request. Fails Delivered.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  HoldOnRefusal = FALSE
  ResendOnJoin = TRUE
  WatchBeforePublish = TRUE
  DedupeReplies = TRUE
INVARIANT TypeOK
INVARIANT Delivered
INVARIANT OneReplyEach
INVARIANT RefusedOnlyUnsent
