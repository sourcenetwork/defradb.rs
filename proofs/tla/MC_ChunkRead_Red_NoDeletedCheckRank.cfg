\* run-all: ChunkRead.tla RED
\* a deleted article is still ranked (INV_RankedIsBestListed)
\* RED: the bug plants a check that forgets the article can be deleted, as in
\* MC_ChunkRead_Red_NoDeletedCheck, and checks only the ranking. A writer deletes the article, its chunks stay stored, and a ranking still
\* scores the deleted article (INV_RankedIsBestListed).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = FALSE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = TRUE
  CheckCut = TRUE
  RouteChecksList = TRUE
  RouteOnlyUnruled = TRUE
  CheckResolved = TRUE
  CheckOwnApp = TRUE
  CheckDelegationScope = TRUE
INVARIANT INV_RankedIsBestListed
CHECK_DEADLOCK FALSE
