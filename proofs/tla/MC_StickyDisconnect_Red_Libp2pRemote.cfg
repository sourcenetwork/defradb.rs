\* RED: what libp2p still allows. Its close says nothing about why, so the
\* peer that was hung up on keeps no memory of it, and a late list naming the
\* node has it dial back. This is the half libp2p does not implement. Must
\* fail NoRedialAfterDeliberateClose.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = TRUE
  QuietUnlinked = TRUE
  RemoteQuiet = FALSE
  Unquiet = TRUE
  OnlyDiscoveryChecked = TRUE
  RecheckQuiet = TRUE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT NoRedialAfterDeliberateClose
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
