\* RED: the bug plants truncate emptying the parents first. An article created
\* between the two steps survives, and the second step removes its chunks, so a
\* live article names chunks that are gone (INV_LiveParentHasChunks).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  ChunksFirst = FALSE
INVARIANT INV_LiveParentHasChunks
CHECK_DEADLOCK FALSE
