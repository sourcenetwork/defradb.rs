\* RED: the record send before the retry. A peer asks pinc for its record
\* once, when it connects. B connects before pinc settles it, the one ask is
\* refused busy, and B never asks again: M never gets B's record. Must fail
\* LIVE_RecordsKept.
SPECIFICATION Spec
CONSTANTS
  RecordOnly = FALSE
  NoRetry    = TRUE
INVARIANT TypeOK
PROPERTY LIVE_RecordsKept
CHECK_DEADLOCK FALSE
