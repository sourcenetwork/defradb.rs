\* RED: today's design. Gossip dials peers on its own connection with no
\* admission check of ours. Revoking r closes that connection, but gossip
\* still hears about r and dials it again. Expect INV_RevokedHasNoGossip
\* to be violated.
SPECIFICATION Spec
CONSTANTS
  Peers <- mcPeers
  Revocable <- mcRevocable
  Healthy = "h"
  Legacy = {}
  MaxDrops = 1
  MaxForgets = 1
  ForgetBound = "Bounded"
  PathMode = "OwnConnection"
  RecheckMode = "Recheck"
  ForgetMode = "DropSender"
  LegacyMode = "Answer"
INVARIANT INV_TypeOK
INVARIANT INV_RevokedHasNoGossip
