\* the node holds the creator's key: the creator's change is staged under it whatever it signed in with, and an identity token for another actor stages nothing
\* GREEN: the node holds the creator's key. Clients stage changes over HTTP
\* in their own transactions, signed in with a delegation or with an
\* identity token. The creator's change is staged under the node's key
\* whatever it signed in with, as the non-transactional route sends as a
\* DID whose key the node holds; the other actor's change is staged under
\* the delegation it presents, and not at all when it signed in with an
\* identity token. Transactions roll back and the drainer sends through
\* the worker's journal. Every client's change acts as its credential's
\* DID, was checked and can be sent, and every safety property holds.
