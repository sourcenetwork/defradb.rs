\* Bug planted: Go's behaviour, a purge without pruning keeps the owner edges.
\* The blocks stay owned by documents that are gone, so nothing can ever reclaim them: INV_NoStaleOwner fails.
SPECIFICATION Spec
CONSTANTS
  Prune = FALSE
  MaxActs = 0
  OwnerMode = "Checked"
  EdgeMode = "Keep"
  IndexMode = "Delete"
  CountMode = "Distinct"
  RetryMode = "Retry"
  ScanMode = "Validated"
  Branchable = FALSE
  CollectionMode = "Owner"
INVARIANTS INV_OthersIntact INV_CollectionIntact INV_Gone INV_NoStaleOwner INV_Pruned INV_Count
PROPERTY PROP_Commits
CHECK_DEADLOCK FALSE
