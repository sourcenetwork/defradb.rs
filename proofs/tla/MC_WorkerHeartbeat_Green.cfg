\* GREEN: the worker polls a task, its hook, a task and its hook again, any
\* of them slow; each task poll hands the heartbeat straight to the hook
\* poll after it, which stays shown until the next task poll or the end of
\* the turn. The monitor sweeps, sights hook polls, reads, marks and
\* rechecks at any moment in between. Every report names a poll that is
\* still the worker's and past the limit, a task is remembered as reported
\* only for a long poll of its own, and no mark is left at rest for a poll
\* neither shown nor waiting for the worker's look.
SPECIFICATION Spec
CONSTANTS
  Limit          = 1
  MaxTime        = 6
  MaxPolls       = 4
  HookBeat       = TRUE
  MarkNamesPoll  = TRUE
  HookClears     = TRUE
  Recheck        = TRUE
INVARIANT TypeOK
INVARIANT INV_ReportTrue
INVARIANT INV_MarkTrue
INVARIANT INV_NotLeftStuck
