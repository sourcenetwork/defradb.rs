\* GREEN: the worker polls a task, its hook, then the task again, any of
\* them slow, while the monitor reads, marks and rechecks at any moment in
\* between. Every report names the poll that runs and is past the limit, a
\* task is remembered as reported only for a long poll of its own, and an
\* idle worker is never left marked.
SPECIFICATION Spec
CONSTANTS
  Limit          = 1
  MaxTime        = 5
  MaxPolls       = 3
  HookBeat       = TRUE
  MarkHoldsStart = TRUE
  HookClears     = TRUE
  Recheck        = TRUE
INVARIANT TypeOK
INVARIANT INV_ReportTrue
INVARIANT INV_MarkTrue
INVARIANT INV_NotLeftStuck
