\* RED: register_task does not read the flag again after its push. A late
\* spawn passes its first check before shutdown and pushes its handle after
\* the drain took the set; its task runs on in a set nobody will drain again.
\* Must fail INV_NoLeak.
SPECIFICATION Spec
CONSTANTS
  Callers          = {"c1"}
  Tasks            = {"t1", "t2"}
  Late             = {"t2"}
  CanKill          = FALSE
  SwapFlag         = TRUE
  AtomicSpawn      = TRUE
  RunRefused       = TRUE
  DrainOwnsSender  = TRUE
  WaitForPruners   = TRUE
  PrunerChecksFlag = TRUE
  RecheckAfterPush = FALSE
  AbortAtDeadline  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoLeak
CHECK_DEADLOCK FALSE
