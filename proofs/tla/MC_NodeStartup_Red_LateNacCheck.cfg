\* RED: the check that NAC has an owner runs after the pinc peer started, and
\* returns early with `?`. A node asked for NAC without an identity fails with
\* its peer running and its database open. Must fail INV_FailedHoldsNothing.
SPECIFICATION Spec
CONSTANTS
  ScheduleToPinc       = TRUE
  ValidateFirst        = FALSE
  OwnerPassed          = TRUE
  ConnectAfterNac      = TRUE
  BootstrapNonFatal    = TRUE
INVARIANT INV_FailedHoldsNothing
CHECK_DEADLOCK FALSE
