\* a stale refusal fails at once with patience left (INV_StaleFailsOnlyAtPatience)
\* RED: a read refused for a stale head is not waited out: it fails at
\* once, with patience left, although the next revision would have come.
\* Must fail INV_StaleFailsOnlyAtPatience.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 2
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = TRUE
  MaxBusy     = 1
  RetryBusy   = TRUE
  Patience    = 8
  MaxTook     = 2
  PauseMin    = 1
  PauseMax    = 2
  CountTook   = TRUE
  CheckDrawn  = TRUE
  MaxStale    = 1
  CheckFresh  = TRUE
  WaitFresh   = FALSE
INVARIANT TypeOK
INVARIANT INV_StaleFailsOnlyAtPatience
