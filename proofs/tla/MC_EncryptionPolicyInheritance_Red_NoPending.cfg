\* run-all: EncryptionPolicyInheritance.tla RED
\* a preparation ignores the request's earlier writes, written_fields, so every such request ends an attempt for a key with nothing merged (INV_ReprepareOnlyWhenStale)
\* RED: a preparation reads only the committed heads and ignores the fields
\* the request's earlier writes prepared (written_fields dropped). On an empty
\* document, one request creates f1 with an encryption config and then
\* updates f2 with none: the update's preparation sees no field at all and
\* mints no document key. The build sees the create's encrypted f1, needs the
\* key, and ends the attempt for it though nothing merged during the request:
\* every such request pays a second attempt (INV_ReprepareOnlyWhenStale).
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 2
  MaxReqWrites = 2
  MaxMerges = 0
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  KeepPrepared = FALSE
  ReprepareStale = TRUE
  UsePending = FALSE
  TornSnapshot = FALSE
  IgnoreConfig = FALSE
INVARIANT INV_ReprepareOnlyWhenStale
CHECK_DEADLOCK FALSE
