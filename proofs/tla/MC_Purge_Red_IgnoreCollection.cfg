\* Bug planted: the prune ignores the collection DAG as an owner, as Go does. In a
\* @branchable collection it deletes a, whose composites the collection DAG links:
\* the collection's `_commits` loses them and a syncing peer cannot fetch them.
\* INV_CollectionIntact fails.
SPECIFICATION Spec
CONSTANTS
  Prune = TRUE
  MaxActs = 2
  OwnerMode = "Checked"
  EdgeMode = "Drop"
  IndexMode = "Delete"
  CountMode = "Distinct"
  RetryMode = "Retry"
  ScanMode = "Validated"
  Branchable = TRUE
  CollectionMode = "Ignored"
INVARIANTS INV_OthersIntact INV_CollectionIntact INV_Gone INV_NoStaleOwner INV_Pruned INV_Count
PROPERTY PROP_Commits
CHECK_DEADLOCK FALSE
