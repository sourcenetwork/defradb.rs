\* Bug: the deferred replay rewrites the peer row through create_replicator instead of the fenced
\* status write. create_replicator allocates a new incarnation, so the install's own finish sees a
\* changed peer and reports a configuration change it made itself (ACT_DeferredReplaySettlesClean).
SPECIFICATION Spec
