\* INV_ReuseHoldsLatest
\* Plants the bug: the prepared input is not keyed by the tuple's latest staged
\* change. A later change stages and settles after the edge answered, nothing
\* is owed in the transaction's view, and it reuses the older answer:
\* INV_ReuseHoldsLatest fails.
SPECIFICATION Spec
CONSTANTS
  Bug = "noHead"
  Patience = 3
  Notifications = TRUE
  MaxTries = 5
INVARIANT INV_ReuseHoldsLatest
CHECK_DEADLOCK FALSE
