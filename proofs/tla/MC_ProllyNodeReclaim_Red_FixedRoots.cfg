\* the sweep marks from roots read before its transaction (SweepKeepsLiveRoots)
\* The bug: the sweep marks from the list of roots it was given when the page
\* was scanned, and never reads the roots itself. The writer publishes the new
\* root after the scan. The sweep still marks from the old root, so it deletes
\* "back", which the new root names. SweepKeepsLiveRoots fails.
SPECIFICATION Spec
CONSTANTS
  RootsInTxn = FALSE
  ValidateRoots = TRUE
  PublishWithNodes = TRUE
  OnlyDeleteUnmarked = TRUE
INVARIANT TypeHolds
INVARIANT SweepKeepsLiveRoots
CHECK_DEADLOCK FALSE
