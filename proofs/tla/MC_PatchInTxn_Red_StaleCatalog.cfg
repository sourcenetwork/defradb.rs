\* run-all: PatchInTxn.tla RED
\* stale cached definition in the txn (INV_SeesOwnPatch)
\* RED: the transaction keeps the definitions it cached before the patch. The
\* caller's next query in the transaction answers from the old definition and
\* does not know the field it just added (INV_SeesOwnPatch).
SPECIFICATION Spec
CONSTANTS
  WriteThroughTxn = TRUE
  PublishOnCommit = TRUE
  FollowUpOnCommit = TRUE
  RefreshCatalog = FALSE
  RollBackFailed = TRUE
  RestoreLensStore = TRUE
  AwaitFollowUp = TRUE
  ValidateDefinitions = TRUE
INVARIANT INV_SeesOwnPatch
CHECK_DEADLOCK FALSE
