  ReadThroughTxn = TRUE
  WriteThroughTxn = TRUE
  FinishOnCommit = TRUE
  RetryHides = FALSE
  Savepoint = TRUE
  RefreshCatalog = FALSE
  NacInTxn = TRUE
INVARIANT INV_SeesOwnPatch
CHECK_DEADLOCK FALSE
