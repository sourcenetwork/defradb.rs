\* RED: the patch stages its new version but leaves the transaction's cached
\* copy of the collection alone. A request later in the same transaction finds
\* the old definition: a create with the new field fails as an unknown
\* collection, and a read uses the definition from before the patch
\* (INV_SeesOwnPatch).
SPECIFICATION Spec
