\* run-all: CoordinatorShutdown.tla RED
\* RED: the drain skips waiting for registry access. It can miss a task
\* whose handle is still with its spawner or is temporarily out for pruning.
SPECIFICATION Spec
CONSTANTS
  Callers          = {"c1"}
  Tasks            = {"t1", "t2"}
  Late             = {"t2"}
  CanKill          = FALSE
  SwapFlag         = TRUE
  AtomicSpawn      = TRUE
  RunRefused       = TRUE
  DrainOwnsSender  = TRUE
  WaitForRegistry   = FALSE
  CheckRegistryFlag = TRUE
  KeepActive        = TRUE
  AbortAtDeadline  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoLeak
CHECK_DEADLOCK FALSE
