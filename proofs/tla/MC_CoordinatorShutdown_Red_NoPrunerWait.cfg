\* RED: the drain does not wait for pruners. A late spawn's pruner has an
\* early task's handle out of the set when the drain takes the set; the drain
\* returns without it, and the pruner puts it back, still running, into a set
\* nobody will drain again. Must fail INV_NoLeak.
SPECIFICATION Spec
CONSTANTS
  Callers          = {"c1"}
  Tasks            = {"t1", "t2"}
  Late             = {"t2"}
  CanKill          = FALSE
  SwapFlag         = TRUE
  AtomicSpawn      = TRUE
  RunRefused       = TRUE
  DrainOwnsSender  = TRUE
  WaitForPruners   = FALSE
  PrunerChecksFlag = TRUE
  RecheckAfterPush = TRUE
  AbortAtDeadline  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoLeak
CHECK_DEADLOCK FALSE
