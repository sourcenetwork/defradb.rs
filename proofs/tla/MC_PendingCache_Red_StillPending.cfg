\* Plants the bug of an id-only log: a catch-up keeps only what is still pending at its own snapshot, so a vector inserted and deleted inside its window is missing for an older search, and INV_CacheCovers fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {a, b}
          Readers = {r1, r2}
          MaxCommits = 3
          GenerationCheck = TRUE
          LoadedAtCheck = TRUE
          DeletesAppend = TRUE
          EntriesCarryCode = FALSE
          OwnWritesScan = TRUE
INVARIANT INV_NoHiddenPending
INVARIANT INV_CacheCovers
SYMMETRY Symmetry
