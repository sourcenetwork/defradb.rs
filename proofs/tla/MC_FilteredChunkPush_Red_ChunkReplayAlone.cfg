\* RED: the bug plants both missing guards of a replay that names only the
\* chunk collection: the replay does not add the article collection, and it
\* sends a matching chunk without its article being queued. The receiver holds
\* a chunk whose article was never sent to it (INV_ChunkOnlyWithItsArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  StaleMarkers = {a1, a2}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  ReplayAddsParent = FALSE
  ReplayNeedsArticle = FALSE
INVARIANT INV_ChunkOnlyWithItsArticle
CHECK_DEADLOCK FALSE
