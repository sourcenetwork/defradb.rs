\* run-all: ClientUniqueAdmission.tla GREEN
\* #3265: the second explicit commit of a unique value is a conflict and leaves nothing
\* GREEN: two explicit transactions add a value under a unique index, in every
\* order, with equal or different values. The second commit of a value loses
\* with "transaction conflict. Please retry" and leaves nothing. Every
\* invariant holds.
SPECIFICATION Spec
CONSTANTS
  Clients = {1, 2}
  Values = {"v", "w"}
  Mode = "Explicit"
  Indexed = TRUE
  EntryValidated = TRUE
  ScanDecides = FALSE
  LoserLeaves = FALSE
  RerunReuses = FALSE
  NilChecked = FALSE
  MaxAttempts = 3
INVARIANT TypeOK
INVARIANT INV_AtMostOnePerNonNilValue
INVARIANT INV_LoserLeavesNothing
INVARIANT INV_LoserRefusedTyped
INVARIANT INV_NoIndexNotRefused
INVARIANT INV_NilNotRefused
CHECK_DEADLOCK FALSE
