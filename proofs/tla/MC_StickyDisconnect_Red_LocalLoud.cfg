\* RED: the bug of #2992 on the side that hung up. The hang-up quiets
\* nothing, so a list sent before it and read after it names the peer, and
\* the node dials it straight back. Must fail NoLocalRedial.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = FALSE
  QuietUnlinked = TRUE
  RemoteQuiet = FALSE
  Unquiet = TRUE
  OnlyDiscoveryChecked = TRUE
  RecheckQuiet = TRUE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT NoLocalRedial
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
