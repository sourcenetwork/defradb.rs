\* Bug: a head whose receiver pauses outlast its own deadline raises the call's stop flag, as before
\* the fix. The receiver is answering, yet one head's pauses end the whole selection and the call
\* returns with documents it never tried (INV_EveryDocTried).
SPECIFICATION Spec
CONSTANTS
  Bug = "expiry-stop"
  N = 3
  Cap = 2
INVARIANT INV_EveryDocTried
CHECK_DEADLOCK FALSE
