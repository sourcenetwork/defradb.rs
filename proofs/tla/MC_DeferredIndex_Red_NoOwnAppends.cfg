\* RED: a read inside an explicit transaction ignores the documents it appended
\* itself. Their appends have no position yet, so the log does not show them, and
\* the read misses its own increment (INV_TxReadExact).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a, b}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "Off"
  RecordRead = "Validated"
  Truncate = "Planned"
INVARIANT INV_TxReadExact
CHECK_DEADLOCK FALSE
