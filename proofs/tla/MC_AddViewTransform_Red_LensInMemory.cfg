\* RED: the lens check asks the in-memory lens store, as shipped. A lens
\* whose config has committed but is not registered yet is reported missing,
\* so a valid view is rejected (INV_NoValidRejected).
SPECIFICATION Spec
CONSTANTS
  CheckEmpty = TRUE
  CheckLens = TRUE
  StoreTransform = TRUE
  LensAt = "memory"
  NacAt = "txn"
  MaxEnv = 2
INVARIANT INV_NoValidRejected
CHECK_DEADLOCK FALSE
