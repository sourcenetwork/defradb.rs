\* RED: one bounded queue; what peers send is dropped when it is full, but
\* control still waits for room. Peers keep the queue full, so the endpoint
\* loop waits behind their messages exactly as with Shared. This was the
\* records task's inbox before record changes got a lane of their own.
\* Expect LIVE_RequestAnswered to be violated.
SPECIFICATION Spec
CONSTANTS
  Cap = 2
  EventCap = 1
  MaxRecv = 4
  MaxCmds = 2
  InboxMode = "LossyShared"
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
PROPERTY LIVE_RequestAnswered
