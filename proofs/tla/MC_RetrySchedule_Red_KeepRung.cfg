\* RED (the old rule): a live acknowledgement clears its own marker and leaves
\* the peer clock alone. A pass over a document that never lands climbs a rung;
\* the peer then acknowledges a live push, yet its other markers, and any push
\* that fails after it, stay on the escalated deadline, longer than the first
\* rung. INV_DeliveredPeerDueAtFirstRung fails.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder    <- mcLadder
  Scopes    = {d, p}
  Poison    = {p}
  RestartOn = {}
INVARIANT TypeOK
INVARIANT INV_DeliveredPeerDueAtFirstRung
