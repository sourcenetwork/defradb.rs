\* RED (the rule before #2563): an acknowledgement, live, superseded or
\* replayed, leaves the peer clock alone. A pass that lands nothing climbs a
\* rung; the peer then acknowledges a push, yet the markers it still owes, and
\* any push that fails after it, stay on the escalated rung.
\* ACT_DeliveryRestarts fails.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Ladder         <- mcLadder
  Steps          = {}
  Scopes         = {d, p}
  Poison         = {p}
  RestartOn      = {}
  BoundDeadlines = TRUE
INVARIANT TypeOK
PROPERTY ACT_DeliveryRestarts
