\* RED: a caller that does not lead returns at once instead of waiting for the
\* shutdown its leader runs, so it sees the node as shut down while the store
\* is still open. Must fail INV_ReturnsAfterShutdown.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
  P2PFirst        = TRUE
  RequestsFirst   = TRUE
  CommitsAdmitted = TRUE
  EndsOpenTransactions = TRUE
  WaitersWait     = FALSE
  HandsBackLead   = TRUE
  RerunCompletesClose = TRUE
INVARIANT INV_ReturnsAfterShutdown
CHECK_DEADLOCK FALSE
