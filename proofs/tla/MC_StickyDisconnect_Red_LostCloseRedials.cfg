\* RED witness: pinc as written, with a close that never arrives. The peer
\* hung up on was never told, so to it the hang-up is a drop, and its
\* discovery may dial the node back. Must fail NoRedialAfterLostClose;
\* passing would mean the model never loses a close.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = TRUE
  QuietUnlinked = TRUE
  RemoteQuiet = TRUE
  Unquiet = TRUE
  OnlyDiscoveryChecked = TRUE
  RecheckQuiet = TRUE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT NoRedialAfterLostClose
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
