\* Plants the bug of keeping a copy loaded from a read with an entry missing: every later entry is numbered one short, so searches miss or misscore vectors and an invariant fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {a, b}
          Readers = {r1, r2}
          MaxCommits = 3
          MaxOwn = 2
          GenerationCheck = TRUE
          OwnAppendsRead = TRUE
          TruncateThroughLinked = TRUE
          LatestOnly = TRUE
          HeadCut = TRUE
          HeadAwareMarks = TRUE
          GapCheck = FALSE
INVARIANT INV_NoHiddenPending
INVARIANT INV_CacheCovers
INVARIANT INV_NoLostVector
INVARIANT INV_ScoresLatest
SYMMETRY Symmetry
