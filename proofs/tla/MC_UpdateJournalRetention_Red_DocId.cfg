\* run-all: UpdateJournalRetention.tla RED
\* RED: the once key names the document by its DocID instead of its short ID.
\* After a full truncate deletes the document and drops its row, the same
\* document created again writes the same block: the dropped row's once key
\* is still held, so the write adds no row and no reader ever sees it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS MaxRows = 3 Slice = 2 Limit = 2 Truncators = {t1} Blocks = {b1} MaxLives = 2 Mode = "docid"
INVARIANT INV_EveryWriteHasRow
