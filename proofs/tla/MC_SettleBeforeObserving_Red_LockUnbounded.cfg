\* Plants the bug: the wait for the settling lock has no deadline. A settlement pass
\* holds the lock on for other objects and the observation waits past its deadline:
\* INV_EndsInTime fails.
SPECIFICATION Spec
CONSTANTS
  Bug = "lockUnbounded"
  Patience = 3
  Notifications = TRUE
  MaxTries = 5
INVARIANT INV_EndsInTime
CHECK_DEADLOCK FALSE
