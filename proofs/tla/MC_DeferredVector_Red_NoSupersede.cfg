\* run-all: DeferredVector.tla RED
\* an inline write leaves an older pending entry behind
\* Plants an inline write, as one past the pending limit, that leaves the
\* node's older pending entry in place. The entry no longer matches the
\* document and a later drain would apply it over the newer vector:
\* INV_PendingIsLatest fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {n1, n2}
          Drains = {d1, d2}
          MaxWrites = 3
          MaxCrashes = 1
          ValidateRead = TRUE
          Supersede = FALSE
          MergePending = TRUE
          DropStale = TRUE
          AskOnCommit = TRUE
          SettleAtOpen = TRUE
INVARIANT INV_PendingIsLatest
