\* run-all: OwnerTransfer.tla RED
\* a grant that takes its place before a concurrent transfer but commits after it lands first (INV_LaterAfterTransfer)
\* RED: no commit conflict, the other way round. The creator's grant takes
\* the earlier place in the queue and commits after a concurrent transfer.
\* The queue sends the grant first and the deployment decides it under the
\* creator, while the transfer it committed after is still owed. Must fail
\* INV_LaterAfterTransfer.
SPECIFICATION Spec
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = TRUE
  CommitConflict = FALSE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {}
  MaxFails       = 2
  MaxCrashes     = 1
  MaxLapses      = 1
  MaxAborts      = 1
  OwnTransfer    = TRUE
INVARIANT INV_LaterAfterTransfer
CHECK_DEADLOCK FALSE
