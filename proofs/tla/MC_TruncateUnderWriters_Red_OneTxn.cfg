\* run-all: TruncateUnderWriters.tla RED
\* marker set in the purge transaction itself: writers are not stopped before it (INV_FirstAttemptCommits)
\* RED: the marker is set inside the purge transaction instead of before it.
\* Nothing stops a writer until that transaction commits, so a writer that
\* commits while it runs gets it refused, exactly as with no marker at all
\* (INV_FirstAttemptCommits).
SPECIFICATION Spec
CONSTANTS
  Docs = {"d1", "d2"}
  Writers = {"w1", "w2"}
  MaxCommits = 3
  MaxAttempts = 2
  Enforced = {"mark", "markall", "validated"}
INVARIANT INV_FirstAttemptCommits
CHECK_DEADLOCK FALSE
