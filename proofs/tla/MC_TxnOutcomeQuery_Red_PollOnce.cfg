\* run-all: TxnOutcomeQuery.tla RED
\* the owner stops asking after one answer: it keeps a stale "open" or "committing" (INV_OwnerSettled)
\* RED: the owner stops asking after its first answer. An owner that asks
\* while its commit is still running gets "open" or "committing" and never
\* asks again, so it is left holding a state the commit has since outgrown.
\* Must fail INV_OwnerSettled.
SPECIFICATION Spec
CONSTANTS
    Idle = 2
    QueryWorks = TRUE
    CheckToken = TRUE
    CheckOwner = TRUE
    BrokenStart = FALSE
    LeaksOwner = FALSE
    ConsumesOnRead = FALSE
    PollsOnce = TRUE
    EvictsLive = FALSE
    Cap = 2

INVARIANT
    INV_Agreement
    INV_Foreign
    INV_StartToken
    INV_FinalAnswer
    INV_Bounded
    INV_OwnerSettled

PROPERTY
    LIVE_QuestionAnswered
CHECK_DEADLOCK FALSE
