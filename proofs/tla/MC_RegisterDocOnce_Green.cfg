\* GREEN: the fix. The deciding scan is validated and there is no sentinel.
\* Three people register one document, and its tuples may be deleted once, so
\* a second round of registration runs after the first owner is gone. Every
\* invariant holds.
SPECIFICATION Spec
CONSTANTS
  Owners        = {o1, o2, o3}
  MaxDeletes    = 1
  ValidatedScan = TRUE
  Sentinel      = FALSE
INVARIANT TypeOK
INVARIANT INV_OneOwner
INVARIANT INV_WinnersOwn
INVARIANT INV_SomeoneWins
