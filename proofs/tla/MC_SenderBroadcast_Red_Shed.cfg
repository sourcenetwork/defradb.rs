\* RED (main): a committed write whose announcement finds the pool full is
\* dropped on the spot. Only replicators hold a durable marker, so a peer that
\* follows gossip never hears of the write.
\* Expect INV_CommittedIsOwnedOrReported to be violated.
SPECIFICATION Spec
CONSTANTS
  Writes <- mcWrites
  Room = 2
  Slots = 1
  Shed = TRUE
  ReportExpiry = TRUE
  SlotAfterWindow = TRUE
  BoundRoom = TRUE
CHECK_DEADLOCK TRUE
INVARIANT TypeOK
INVARIANT INV_CommittedIsOwnedOrReported
