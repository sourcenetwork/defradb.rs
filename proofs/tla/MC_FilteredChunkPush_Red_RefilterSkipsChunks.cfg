\* run-all: FilteredChunkPush.tla RED
\* a new filter replays articles but not their chunks (LIVE_ChunkFollowsItsArticle)
\* RED: the bug plants a re-add whose replay names only the article collection,
\* since only its own filter changed. The newly matching article reaches the
\* receiver and its chunk never does (LIVE_ChunkFollowsItsArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {}
  NewMatches = {a1}
  Unreadable = {}
  StaleMarkers = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = TRUE
  ReplayNeedsArticle = TRUE
  ReplayDefersChunk = TRUE
  ReplayChunksOnRefilter = FALSE
PROPERTY LIVE_ChunkFollowsItsArticle
CHECK_DEADLOCK FALSE
