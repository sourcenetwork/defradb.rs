\* RED: a new empty store is left unstamped. The guard cannot tell it from a
\* legacy store and refuses it (INV_FreshStoreOpens).
SPECIFICATION Spec
CONSTANTS
  Collections = {c1}
  RefusesOld = "On"
  RefusesUnstamped = "On"
  StampsFresh = "Off"
  MutatesOnRefusal = "Off"
INVARIANT INV_FreshStoreOpens
CHECK_DEADLOCK FALSE
