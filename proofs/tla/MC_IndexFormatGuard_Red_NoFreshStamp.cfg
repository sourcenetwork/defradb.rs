\* RED: a new empty store is left unstamped and opened without a rebuild, so no
\* later open sees it as current (INV_StampedAfterOpen).
SPECIFICATION Spec
CONSTANTS
  Collections = {c1}
  RefusesOld = "On"
  RebuildsLegacy = "Off"
  StampsFresh = "Off"
  MutatesOnRefusal = "Off"
INVARIANT INV_StampedAfterOpen
CHECK_DEADLOCK FALSE
