\* run-all: ConnmgrTrimSilence.tla RED
\* only a trim's peers are held, so the pruned end redials (INV_NoRedialOfPruned)
\* The bug: only a trim's own peers are held. The far end of a trim sees a
\* plain remote close, as it would for a restart or a network blip, so it takes
\* no hold, and its Kademlia bootstrap redials the node that just pruned it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers = {p1, p2, p3}
  Low = 1
  High = 2
  Silence = 3
  MaxTime = 6
  Mode = "trimOnly"
INVARIANTS TypeOK INV_NoRedialOfPruned
