\* RED (guard: while now > seen): the loop runs while the reading differs from
\* the mark it saw, not only while it is past it. A read that saw 1 commit
\* loads the mark after the close moved it to 2, swaps it back to 1 and adds
\* 1 - 2: the total goes from 2 to 1 (in a release build the subtraction
\* wraps, and adding the wrapped number takes the total back the same way).
\* One read, one export, two counts. Must fail PROP_TotalNeverBack.
SPECIFICATION Spec
CONSTANTS
  NS           = 1
  NR           = 1
  MaxCount     = 2
  Forward      = FALSE
  ClaimByCas   = TRUE
  Retry        = TRUE
  Refresh      = TRUE
  PublishFirst = TRUE
  HoldStats    = TRUE
  OnlyGrow     = TRUE
  OwnStats     = TRUE
  StopFirst    = TRUE
INVARIANT TypeOK
PROPERTY PROP_TotalNeverBack
CHECK_DEADLOCK FALSE
