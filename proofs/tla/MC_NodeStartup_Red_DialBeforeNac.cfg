\* RED: bootstrap peers are dialed as soon as the host listens, before the NAC
\* manager is in place. A peer reached then meets no access control. Must fail
\* INV_NoPeerBeforeNac.
SPECIFICATION Spec
CONSTANTS
  ScheduleToIroh       = TRUE
  ShutdownOnListenFail = TRUE
  ValidateFirst        = TRUE
  OwnerPassed          = TRUE
  ConnectAfterNac      = FALSE
  BootstrapNonFatal    = TRUE
INVARIANT INV_NoPeerBeforeNac
CHECK_DEADLOCK FALSE
