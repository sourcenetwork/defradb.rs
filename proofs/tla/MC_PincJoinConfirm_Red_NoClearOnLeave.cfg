\* run-all: PincJoinConfirm.tla RED
\* RED: leaving a topic keeps it in the confirmed set. A subscribe is
\* confirmed, the engine unsubscribes and subscribes again: the new join
\* answers "subscribed" at once, before the hub holds it. Must fail
\* INV_OkOnlyWhenHeld.
SPECIFICATION Spec
CONSTANTS
  Calls            = {c1, c2}
  MaxUnsub         = 1
  MaxHold          = 0
  MaxLost          = 0
  ConfirmCheck     = TRUE
  StillJoined      = TRUE
  Recheck          = TRUE
  Rollback         = TRUE
  ClearOnLeave     = FALSE
  HubTagsLists     = TRUE
  RejoinAfterDrain = TRUE
INVARIANT TypeOK
INVARIANT INV_OkOnlyWhenHeld
CHECK_DEADLOCK FALSE
