\* GREEN: an edit may encrypt its text. A merge that keeps an encrypted text
\* builds none of its chunks, and the writer's chunks come with the article,
\* so the text's chunks are stored once they arrive. INV_EachChunkOnce is left
\* out: when two peers write the same chunk apart and one of them encrypts it,
\* both end up with two copies, since an encrypted copy's ID comes from its
\* writer's key.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = FALSE
  DeleteRule = "wait"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = TRUE
  Encrypt = TRUE
  Ship = TRUE
INVARIANT TypeOK
INVARIANT INV_ReadsMatchText
INVARIANT INV_SettledPeersAgree
INVARIANT INV_NoForgedChunk
INVARIANT INV_ChunksNeverChange
INVARIANT INV_TextChunksStored
INVARIANT INV_OwedIsEncrypted
INVARIANT INV_SettledListsAgree
CHECK_DEADLOCK FALSE
