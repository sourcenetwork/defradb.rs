\* GREEN: an edit may encrypt its text. A merge that keeps an encrypted text
\* builds none of its chunks, and the writer's chunks come with the article,
\* so the text's chunks are stored once they arrive. Two peers that write the
\* same text apart and encrypt it each hold both copies of a chunk, since an
\* encrypted copy's ID comes from its writer's key, and a reader shows one of
\* them. Every invariant holds; INV_PlainChunkStoredOnce speaks only of peers
\* that encrypt nothing.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = FALSE
  DeleteRule = "wait"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = TRUE
  Encrypt = TRUE
  Ship = TRUE
  OneCopy = TRUE
INVARIANT TypeOK
INVARIANT INV_SettledPeersAgree
INVARIANT INV_NoForgedChunk
INVARIANT INV_ChunksNeverChange
INVARIANT INV_TextChunksStored
INVARIANT INV_OwedIsEncrypted
INVARIANT INV_EachChunkOnce
CHECK_DEADLOCK FALSE
