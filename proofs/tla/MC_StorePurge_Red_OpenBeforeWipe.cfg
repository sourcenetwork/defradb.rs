\* run-all: StorePurge.tla RED
\* the node opens again before its wipe (INV_NoOpenBeforeWipe)
\* RED: the node starts again before its wipe ran, so it opens the old store
\* and the wipe never comes. Must fail INV_NoOpenBeforeWipe.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Developments = {TRUE}
  Handlers = {TRUE}
  HeldElsewhere = {FALSE}
  OtherCallers  = {FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = FALSE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
  SignerHeld               = TRUE
INVARIANT INV_NoOpenBeforeWipe
CHECK_DEADLOCK FALSE
