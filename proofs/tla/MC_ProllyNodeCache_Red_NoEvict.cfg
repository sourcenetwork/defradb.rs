\* the cache never evicts (CacheBounded)
\* The bug: the cache never evicts. Reading three one-byte nodes holds three
\* bytes against a two-byte budget, so the cache grows with the tree.
\* CacheBounded fails.
SPECIFICATION Spec
CONSTANTS
  ReadPending = TRUE
  Evict = FALSE
  SkipHuge = TRUE
  KeepOnFail = TRUE
  FlushFirst = TRUE
  RefuseAfterFail = TRUE
INVARIANT CacheBounded
CHECK_DEADLOCK FALSE
