\* RED: the code on main before this change. The scan is not validated, and
\* both registrations write the sentinel byte 1. regolith commits a write that
\* leaves the key holding what it already holds, so the second sentinel write
\* does not conflict, both commit, and the document has two owners. Must fail
\* INV_OneOwner.
SPECIFICATION Spec
CONSTANTS
  Owners        = {o1, o2, o3}
  MaxDeletes    = 1
  ValidatedScan = FALSE
  Sentinel      = TRUE
INVARIANT TypeOK
INVARIANT INV_OneOwner
