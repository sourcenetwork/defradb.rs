\* RED: one list carries every owed registration under the first creator's
\* credential. Nothing in it is refused, so it applies, and b's document is
\* registered to a. Must fail INV_OwnerIsCreator.
SPECIFICATION Spec
CONSTANTS
  Obj          = {1, 2, 3}
  ByB          = {3}
  Bad          = {}
  Elsewhere    = {}
  MaxLoss      = 1
  MaxOther     = 0
  Recheck      = TRUE
  AskOnRefusal = TRUE
  Fallback     = TRUE
  PerCreator   = FALSE
  InOrder      = TRUE
INVARIANT TypeOK
INVARIANT INV_OwnerIsCreator
