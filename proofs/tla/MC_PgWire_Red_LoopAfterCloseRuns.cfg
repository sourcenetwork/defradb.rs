\* RED (the CI bug, its worst case): no is_closed check after a turn. report
\* sets ReadyForQuery before it closes on the fatal error, so a query the
\* client sent right after its wrong token is read and run, with nobody logged
\* in. Must fail INV_NoQueryBeforeStartup.
SPECIFICATION Spec
CONSTANTS
  Limit              = 2
  MaxTime            = 3
  MaxMsgs            = 3
  PreMsgs            = {"did"}
  PostMsgs           = {"pwBad", "query"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = FALSE
INVARIANT TypeOK
INVARIANT INV_NoQueryBeforeStartup
CHECK_DEADLOCK FALSE
