\* Bug: releasing a slot does not notify the retry clock.
\* The clock went to sleep while every slot was full; the slot frees, a due root could take it,
\* and nothing wakes the clock before its next tick (INV_NoIdleCapacity).
SPECIFICATION Spec
CONSTANTS
  Bug = "no-wake"
  Cap = 1
  MaxGen = 3
INVARIANT INV_NoIdleCapacity
CHECK_DEADLOCK FALSE
