\* Replays the trace in MC_P2PDelivery_Trace_HubRelay through P2PDelivery under the fixed
\* design's knobs. TLC finds no error if every event is a model step
\* and the run settles; a deadlock names the first event that is not.
SPECIFICATION TraceSpec
CONSTANTS
  Nodes <- tNodes
  Repl <- tRepl
  Heads <- tHeads
  Author <- tAuthor
  Parent <- tParent
  Prio <- tPrio
  KeyOrder <- tKeyOrder
  Base <- tNoHeads
  Fresh <- tHeads
  Backlogs <- tBacklogs
  Trickle <- tNoHeads
  Dead <- tNoHeads
  PullPeer <- tPullPeer
  PullAt <- tNodes
  Storm <- tNodes
  Crashable <- tNodes
  ConnectedAtStart = "down"
  Trace <- tTrace
  K = 4
  Permits = 4
  PeerPermits = 3
  MemCap = 1000
  PeerQuota = 250
  DurCap = 4000
  MaxCrash = 3
  MaxRegFail = 0
  MaxDisc = 0
  MaxCont = 0
  CoverRule = "Ancestry"
  ShutdownOrder = "DrainFirst"
  ForwardMode = "BeforeMark"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Kept"
  FanoutMode = "PerPeer"
  SlotBeforePermit = FALSE
  DispatchPath = "Direct"
  ConnMode = "Served"
INVARIANT INV_TypeOK
INVARIANT INV_Bounded
INVARIANT INV_ObligationOwned
INVARIANT INV_TraceIndex
