\* run-all: EncryptionPolicyInheritance.tla GREEN
\* #2742: each field follows its own heads; a headless field takes the doc key only on a wholly encrypted doc; the composite links nothing; a stale headless decision re-prepares its key
\* GREEN: the code as it is. Two local writes, in one request or two, and two
\* remote merges, of either kind, on any starting document: every decision
\* follows the rule, rests on heads the document really held with the
\* request's earlier writes as built, and needs only minted keys; a merge
\* between preparation and build ends the attempt for a missing key, and
\* nothing else does.
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 2
  MaxReqWrites = 2
  MaxMerges = 2
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  KeepPrepared = FALSE
  ReprepareStale = TRUE
  UsePending = TRUE
  TornSnapshot = FALSE
  IgnoreConfig = FALSE
INVARIANT TypeOK INV_FollowsOwnHeads INV_NoDowngradeOfEncryptedField INV_HeadlessAllEncrypted INV_StaleDecisionSerializable INV_SeesRequestWrites INV_PreparedKeyCovers INV_CompositeUnlinked INV_ExplicitConfigEncrypts INV_ReprepareOnlyWhenStale
CHECK_DEADLOCK FALSE
