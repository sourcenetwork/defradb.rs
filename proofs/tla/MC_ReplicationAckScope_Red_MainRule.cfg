\* RED: the read on main before the fix. It compares at collection scope for
\* every branchable collection, even for a filtered replicator. A filtered
\* replicator is never pushed the collection heads, so nothing is recorded at
\* collection scope for it: once the peer acknowledges d1's heads, d1 still
\* reads as not acknowledged. Must fail INV_AckedReadsAcked.
SPECIFICATION Spec
CONSTANTS
  d1 = d1
  d2 = d2
  Docs           = {d1, d2}
  Matches        = {d1}
  MaxWrites      = 2
  MainRule       = TRUE
  PushToFiltered = FALSE
INVARIANT TypeOK
INVARIANT INV_AckedReadsAcked
