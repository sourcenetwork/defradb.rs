\* RED: a dropping call marks its ticket and never looks again. The call
\* before it finishes and checks for a mark just before the mark is made, so
\* nobody skips the dropped ticket: the transaction keeps serving it and the
\* next call waits forever. Must fail Progress.
SPECIFICATION Spec
CONSTANTS
  Calls      = {c1, c2, c3}
  Recheck    = FALSE
  SkipOnTurn = TRUE
PROPERTY Progress
CHECK_DEADLOCK FALSE
