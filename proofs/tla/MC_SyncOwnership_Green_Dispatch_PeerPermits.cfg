\* GREEN: the dispatch rules of MC_SyncOwnership_Green_Dispatch, with fetch
\* permits per source peer and two fetch slots. One spoke announces d1 and d2
\* and has one permit; d1 is a catch-up root whose provider trickles, so its
\* attempt holds that permit up to its quantum. d3 is a head from another
\* peer. The clock takes a root's slot and its peer's permit together, so
\* while d1's attempt holds the spoke's permit, d2 is passed over and keeps
\* its place, and the second slot goes to d3: no slot is held by a fetch
\* waiting for a permit, no peer has more permits in use than it has, and an
\* attempt starts only for the oldest due root that can run. Safety only; the
\* liveness of a passed-over root is MC_SyncOwnership_Green_Dispatch_PullPermit.
SPECIFICATION WSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1, d2, d3}
  Cols           = {}
  MaxV           = 1
  Cap            = 3
  FetchCap       = 2
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MaxAttempts    = 3
  AttemptMode    = "PerAttempt"
  RearmMode      = "AttemptEnd"
  ExpiryMode     = "AckRetained"
  Dead           = {}
  Trickle        = {d1}
  CutoffMode     = "Quantum"
  SharedPeer     = {d1, d2}
  PeerPermits    = 1
  MaxPulls       = 0
  PermitMode     = "WithSlot"
INVARIANT INV_DispatchTypeOK
INVARIANT INV_DueOrBackoff
INVARIANT INV_ObligationConservation
INVARIANT INV_SingleFlight
INVARIANT INV_FetchOwnersBounded
INVARIANT INV_PeerPermitsBounded
INVARIANT INV_NoSlotWaitsForPermit
PROPERTY ACT_AttemptsStartInDueOrder
PROPERTY ACT_EndedAttemptQueuesBehind
PROPERTY ACT_AckedRootLeavesOwned
