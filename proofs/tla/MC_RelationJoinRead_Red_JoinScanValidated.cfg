\* The bug behind the backward one-to-one test: the query's join scan of the
\* Book range is checked at commit. T1 and T2 link different publishers, yet
\* the first book to commit lands in the other's scanned range and aborts
\* it, so INV_JoinReadDecidesNothing fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANT ValidateJoinScan = TRUE
CONSTANT ValidateOwnEntry = TRUE
CONSTANT T2Publishers = {"p2"}
INVARIANT INV_JoinReadDecidesNothing
