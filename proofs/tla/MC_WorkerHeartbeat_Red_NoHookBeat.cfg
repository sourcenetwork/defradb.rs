\* RED: the mark holds its poll's start, but the hook still writes no
\* heartbeat of its own: the monitor reads the task's heartbeat while the
\* hook is slow and blames the task. Must fail INV_ReportTrue.
SPECIFICATION Spec
CONSTANTS
  Limit          = 1
  MaxTime        = 5
  MaxPolls       = 3
  HookBeat       = FALSE
  MarkHoldsStart = TRUE
  HookClears     = TRUE
  Recheck        = TRUE
INVARIANT TypeOK
INVARIANT INV_ReportTrue
