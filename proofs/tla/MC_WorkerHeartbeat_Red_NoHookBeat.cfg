\* RED: the mark names its poll and the hook's mark is looked for, but the
\* task poll does not hand the heartbeat to the hook: the monitor reads the
\* task's heartbeat while the hook is slow and blames the task. Must fail
\* INV_ReportTrue.
SPECIFICATION Spec
CONSTANTS
  Limit          = 1
  MaxTime        = 6
  MaxPolls       = 4
  HookBeat       = FALSE
  MarkNamesPoll  = TRUE
  HookClears     = TRUE
  Recheck        = TRUE
INVARIANT TypeOK
INVARIANT INV_ReportTrue
