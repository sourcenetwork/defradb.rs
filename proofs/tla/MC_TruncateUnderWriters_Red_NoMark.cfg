\* run-all: TruncateUnderWriters.tla RED
\* no marks: each chunk is purged straight away, as before #2914 (INV_FirstAttemptCommits)
\* RED: the marks are left out, so the truncate purges each chunk at once. A
\* writer that merges into a document while the purge attempt runs commits
\* first, the purge deletes that value, and its commit is refused: with writers
\* that never stop it can run out of retries (INV_FirstAttemptCommits).
SPECIFICATION Spec
CONSTANTS
  Docs = {"d1", "d2"}
  Writers = {"w1", "w2"}
  MaxCommits = 3
  MaxAttempts = 2
  Enforced = {"split", "markall", "validated"}
INVARIANT INV_FirstAttemptCommits
CHECK_DEADLOCK FALSE
