\* RED: gossip's max_message_size is the frame limit itself, forgetting the
\* topic our frame adds (the bug in #2820). Gossip accepts the huge broadcast,
\* whose frame is then over the limit every release reads, so a message gossip
\* accepted cannot be sent. Expect INV_BroadcastFits to be violated.
SPECIFICATION Spec
CONSTANTS
  FrameLimit = 13
  TopicLen = 3
  Overhead = 2
  Size <- MCSize
  Control <- MCControl
  LimitMatched = FALSE
  Fallback = TRUE
  PushConnected = TRUE
  SkipOversize = TRUE
  ReportLoss = TRUE
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
INVARIANT INV_NoSilentLoss
INVARIANT INV_BroadcastFits
