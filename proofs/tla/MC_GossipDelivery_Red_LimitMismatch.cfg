\* RED: the frame limit is gossip's own max_message_size, forgetting the
\* topic our frame adds (the bug in #2820). Gossip queues the edge broadcast,
\* whose frame is over the limit, so a message gossip accepted cannot be sent.
\* Expect INV_BroadcastFits to be violated.
SPECIFICATION Spec
CONSTANTS
  MaxMessage = 10
  TopicLen = 3
  Overhead = 2
  Size <- MCSize
  Control <- MCControl
  LimitMatched = FALSE
  Fallback = TRUE
  SkipOversize = TRUE
  ReportLoss = TRUE
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
INVARIANT INV_NoSilentLoss
INVARIANT INV_BroadcastFits
