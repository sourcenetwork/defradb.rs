\* RED: a new character always becomes the left child of the node after its
\* left origin, never its left origin's right child. The text is "X". Alice
\* types "a" in front of it, then "b" right after her "a"; meanwhile Bob types
\* "c" in front of X too. All three hang as left children of X, ordered by
\* ID: "a", "c", "b". Alice's peer, once it has Bob's block, shows "acbX":
\* Bob's "c" splits Alice's "ab" though Bob never saw her "a", so two runs
\* typed at one spot interleave. Fugue hangs "b" under "a" instead, which
\* keeps "ab" whole. Must fail INV_NoInterleave.
SPECIFICATION Spec
CONSTANTS
  Peers        = {p1, p2}
  MaxBlocks    = 4
  SiblingKey   = "id"
  CausalBuffer = TRUE
  ResolveAt    = "parent"
  PlaceRule    = "next"
  ReplayFrom   = "critical"
  NullRule     = "heads"
INVARIANT TypeOK
INVARIANT INV_NoInterleave
