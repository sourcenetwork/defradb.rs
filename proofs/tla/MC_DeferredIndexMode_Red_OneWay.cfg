\* RED: the check looks only for a deferred index kept inline. A deferred index with
\* drains still owed opens inline: its entries sit at old values that inline writes
\* never find (INV_OpenMatchesMode).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  MaxValue = 2
  MaxRestarts = 3
  StartModes = {"Inline", "Deferred"}
  Check = "ToDeferred"
  ClearRecords = "On"
  ProgressReset = "On"
INVARIANT INV_OpenMatchesMode
CHECK_DEADLOCK FALSE
