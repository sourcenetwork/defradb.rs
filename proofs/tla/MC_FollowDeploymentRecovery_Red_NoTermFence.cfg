\* RED: a cursor written under an older term is resumed. A second takeover
\* loses records the first pass already walked past; the pass counts as
\* complete and the node reopens without owing them. Must fail
\* INV_NothingLost.
SPECIFICATION Spec
CONSTANTS
  Records       = 3
  Revoked       = {2, 3}
  PageSize      = 2
  MaxTakeovers  = 2
  MaxCrashes    = 1
  Gate          = TRUE
  HandOver      = TRUE
  OweFirst      = TRUE
  EndFromLedger = TRUE
  SaysDone      = TRUE
  TermFence     = FALSE
INVARIANT TypeOK
INVARIANT INV_NothingLost
INVARIANT INV_RevocationDenies
PROPERTY LIVE_RecoveryEnds
