\* run-all: EventOrder.tla RED
\* completes before the hand-over, events lost (INV_CommittedEventsKept)
\* RED: a commit completes as soon as it commits, before its owner hands
\* the events over; the drainer then has nothing to send and drops what
\* arrives later, so a committed commit's events are lost
\* (INV_CommittedEventsKept).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {t1}
  MaxReceipt = 1
  Mode = "dispatch_before_attach"
INVARIANT TypeOK
INVARIANT INV_CommittedEventsKept
