  WriteThroughTxn = TRUE
  PublishOnCommit = TRUE
  FollowUpOnCommit = TRUE
  RefreshCatalog = TRUE
  RollBackFailed = TRUE
  RestoreLensStore = TRUE
  AwaitFollowUp = FALSE
  ValidateDefinitions = TRUE
INVARIANT INV_FollowUpRanWhenCommitReturns
CHECK_DEADLOCK FALSE
