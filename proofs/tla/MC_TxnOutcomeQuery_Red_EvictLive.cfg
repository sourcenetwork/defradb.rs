\* run-all: TxnOutcomeQuery.tla RED
\* a full store drops a live record: the owner gets "unknown" for a commit that landed (LIVE_QuestionAnswered)
\* RED: the old last-resort eviction. When the store is at its cap and holds
\* no final result to drop, a new transaction's begin drops a live record.
\* The owner of that transaction loses its answer, asks after the commit
\* settled, and gets "unknown" for a commit that landed. Must fail
\* LIVE_QuestionAnswered.
SPECIFICATION Spec
CONSTANTS
    Idle = 2
    QueryWorks = TRUE
    CheckToken = TRUE
    CheckOwner = TRUE
    BrokenStart = FALSE
    LeaksOwner = FALSE
    ConsumesOnRead = FALSE
    PollsOnce = FALSE
    EvictsLive = TRUE
    Cap = 2

INVARIANT
    INV_Agreement
    INV_Foreign
    INV_StartToken
    INV_FinalAnswer
    INV_Bounded
    INV_OwnerSettled

PROPERTY
    LIVE_QuestionAnswered
CHECK_DEADLOCK FALSE
