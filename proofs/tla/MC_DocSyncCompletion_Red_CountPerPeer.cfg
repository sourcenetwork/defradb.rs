\* run-all: DocSyncCompletion.tla RED
\* RED: the code before the fix, with two peers. Only one peer holds the asked document's head, so one report comes where the rule wants two: the sync has read a report of every document and still waits, until its idle timeout (INV_DoneOnceEveryDocReported).
SPECIFICATION Spec
CONSTANTS
  Docs         = {d1, d2, d3}
  Peers        = {p1, p2}
  MaxReports   = 4
  CountReports = TRUE
  FilterAsked  = TRUE
  HeldDocs     = {}
  ReportHeld   = TRUE
INVARIANT TypeOK
INVARIANT INV_CompleteMeansEveryDocMerged
INVARIANT INV_DoneOnceEveryDocReported
CHECK_DEADLOCK FALSE
