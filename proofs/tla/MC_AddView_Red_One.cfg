\* run-all: AddView.tla RED
\* The one check is left out of the core: a source query that selects two sources, or none, still gets its views (INV_NoViewUnlessAllChecksPass)
\* RED: the core skips the one check, and both ways in forward to it, so
\* a source query that selects two sources, or none, is not refused and its views are created.
SPECIFICATION Spec
CONSTANTS
  Views = {"a", "b"}
  CoreChecks = {"nac", "sdl", "cid", "chunk", "downsample", "policy", "identity"}
  ServerChecks = {"nac", "sdl", "cid", "chunk", "downsample", "policy", "identity"}
  BuildFirst = FALSE
INVARIANT INV_NoViewUnlessAllChecksPass
CHECK_DEADLOCK FALSE
