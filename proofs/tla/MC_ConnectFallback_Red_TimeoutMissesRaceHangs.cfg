\* RED: the connect timeout covers only the name lookup, and both attempts
\* hang (a host whose routes drop packets, before the OS gives up). The connect
\* never ends. Must fail LIVE_Ends.
SPECIFICATION Spec
CONSTANTS
  D              = 1
  CT             = 2
  MaxTime        = 3
  HasFallback    = TRUE
  MayHang        = TRUE
  Limited        = TRUE
  DelayFallback  = TRUE
  StartOnFailure = TRUE
  AwaitOther     = TRUE
  KeepLastError  = TRUE
  DropLosers     = TRUE
  TimeoutAll     = FALSE
INVARIANT TypeOK
PROPERTY LIVE_Ends
CHECK_DEADLOCK FALSE
