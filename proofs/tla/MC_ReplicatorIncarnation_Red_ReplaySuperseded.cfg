\* Bug: a replay treats "a newer marker already holds this document" like "the install was replaced".
\* A live push commits a newer marker for one failed document, the replay gives up while its install
\* is still current, and the documents after it get no retry marker (INV_FailuresRecorded).
SPECIFICATION Spec
CONSTANT MarkerMode = "conflated"
CONSTANT ReplayMode = "fenced"
CONSTANT Stale = "retry"
INVARIANT INV_FailuresRecorded
CHECK_DEADLOCK FALSE
