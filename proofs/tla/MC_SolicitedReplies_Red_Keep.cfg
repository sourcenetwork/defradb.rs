\* RED: admitting a stream does not use up its expectation. One request is
\* answered, then the peer opens a second reply stream and it is admitted
\* too, though nothing is owed (INV_NoUnsolicitedAdmitted).
SPECIFICATION Spec
CONSTANTS
  MaxReq = 3
  MatchMode = "Match"
  TakeMode = "Keep"
  PruneMode = "ExpiredSerial"
  SendMode = "ExpectFirst"
  ExpiredMode = "Reset"
  Mux = "V1"
  ReplyMode = "RequestStream"
  RespMode = "Refuse"
INVARIANT INV_NoUnsolicitedAdmitted
