\* RED: no abort after the deadline. The drain joins each handle with no
\* deadline, so a task that never ends keeps the drain waiting forever, and
\* every caller with it. Must fail LIVE_CallersReturn.
SPECIFICATION Spec
CONSTANTS
  Callers          = {"c1", "c2"}
  Tasks            = {"t1"}
  Late             = {}
  CanKill          = FALSE
  SwapFlag         = TRUE
  AtomicSpawn      = TRUE
  RunRefused       = TRUE
  DrainOwnsSender  = TRUE
  WaitForPruners   = TRUE
  PrunerChecksFlag = TRUE
  RecheckAfterPush = TRUE
  AbortAtDeadline  = FALSE
INVARIANT TypeOK
PROPERTY LIVE_CallersReturn
CHECK_DEADLOCK FALSE
