\* RED: the bug plants a merge that keeps another peer's text but builds none
\* of its chunks. Those chunks come only if their own documents travel, and a
\* peer that synced only the article never gets them, so its live text has
\* chunks it does not store (INV_TextChunksStored).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = FALSE
  DeleteRule = "wait"
  GenesisFirst = TRUE
  Rebuild = FALSE
  SameIds = TRUE
  Encrypt = FALSE
  Ship = TRUE
INVARIANT INV_TextChunksStored
CHECK_DEADLOCK FALSE
