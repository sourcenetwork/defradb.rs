\* GREEN (#1099 + audit F24): a bounded item+byte queue admits compact jobs before
\* anything is spawned, a fixed worker pool drains it, finished jobs release their slot,
\* only the pool's handles are kept, the per-peer cap (< Workers) isolates the slow
\* peer, and timed-out peers are parked and share one peer's cap. A peer's queued jobs
\* go to the ledger only once one of its probes times out. All bounds hold and every
\* job admitted for a healthy peer leaves the queue, under scheduler-only fairness.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcPeers
  SlowPeers <- mcSlowPeers
  Weight <- mcWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Release"
  HandleMode = "FixedWorkers"
  FairnessMode = "PerPeerCap"
  ParkMode = "ParkUnreachable"
INVARIANT INV_TypeOK
INVARIANT INV_QueueBounded
INVARIANT INV_PermitConservation
INVARIANT INV_HandlesBounded
INVARIANT INV_NoSilentLoss
INVARIANT INV_PeerLeavesAWorker
INVARIANT INV_UnreachableLeaveAWorker
PROPERTY ACT_DemoteAfterFailedProbe
PROPERTY LIVE_HealthyProgress
