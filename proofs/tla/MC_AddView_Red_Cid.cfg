\* run-all: AddView.tla RED
\* The cid check is left out of the core: a blank lens CID still gets its views (INV_NoViewUnlessAllChecksPass)
\* RED: the core skips the cid check, and both ways in forward to it, so
\* a blank lens CID is not refused and its views are created.
SPECIFICATION Spec
CONSTANTS
  Views = {"a", "b"}
  CoreChecks = {"nac", "sdl", "one", "chunk", "downsample", "policy", "identity"}
  ServerChecks = {"nac", "sdl", "one", "chunk", "downsample", "policy", "identity"}
  BuildFirst = FALSE
INVARIANT INV_NoViewUnlessAllChecksPass
CHECK_DEADLOCK FALSE
