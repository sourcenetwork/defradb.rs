\* run-all: DiskAnnClusterKeys.tla RED
\* a node linked again gets a second record under another cluster
\* Plants the bug of picking a fresh cluster when a node already in the graph is linked again (an update). The new record goes under the new cluster and the old one stays behind, so the node has two records and one sits at a key its code no longer names: INV_OneRecord fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Ids = {a, b}
          Clusters = {c1, c2}
          MaxGen = 4
          KeepCluster = FALSE
          Fallback = TRUE
INVARIANT INV_OneRecord
INVARIANT INV_FindsRecord
