\* GREEN: whom the policy lets delete may delete, owner or writer, and the
\* archive is made as the owner; earlier unsent changes, parked ones
\* included, go with the delete; Vera refuses changes to an archived object;
\* the owed archive denies everyone and leaves the commit history to its
\* actor alone, and only when that actor deleted. A deleted document grants
\* nothing, only its deleter reads its commit history, no archive is owed as
\* anyone but the owner, no delete counts against anyone's admission of
\* new changes, the node's and its transaction's included, no grant
\* outlives the archive, and the archive settles.
SPECIFICATION Spec
CONSTANTS
  CheckPermission  = TRUE
  ArchiveAsOwner   = TRUE
  Drop             = TRUE
  VeraRefuses      = TRUE
  Overlay          = TRUE
  HistoryActorOnly = TRUE
  SpareOnlyDeleter = TRUE
  ArchiveUncounted = TRUE
  ArchiveOffNode   = TRUE
  ArchiveOffTxn    = TRUE
  First            = "archive"
INVARIANT TypeOK
INVARIANT INV_DeletedGrantsNothing
INVARIANT INV_NoGrantAfterArchive
INVARIANT INV_DeletedByPermitted
INVARIANT INV_ArchiveAsOwner
INVARIANT INV_HistoryOnlyToDeleter
INVARIANT INV_DeleteChargesNobody
PROPERTY LIVE_Retired
