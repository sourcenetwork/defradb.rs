\* GREEN: only the owner may delete; earlier unsent changes, parked ones
\* included, go with the delete; Vera refuses changes to an archived object;
\* the owed archive denies everyone and leaves the commit history to its
\* actor alone. A deleted document grants nothing, only its deleter reads
\* its commit history, no grant outlives the archive, and the archive
\* settles.
SPECIFICATION Spec
CONSTANTS
  CheckOwner  = TRUE
  Drop        = TRUE
  VeraRefuses = TRUE
  Overlay     = TRUE
  HistoryActorOnly = TRUE
INVARIANT TypeOK
INVARIANT INV_DeletedGrantsNothing
INVARIANT INV_NoGrantAfterArchive
INVARIANT INV_DeletedByOwner
INVARIANT INV_HistoryOnlyToDeleter
PROPERTY LIVE_Retired
