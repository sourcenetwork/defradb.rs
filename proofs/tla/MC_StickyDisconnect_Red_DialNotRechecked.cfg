\* RED: a discovery dial reads the quiet only when it is decided, not again
\* as it lands (DefraKademlia::handle_established_outbound_connection without
\* its quiet check; on pinc, learn_peers' dial without is_quiet around it). A
\* DisconnectPeers that lands while the dial is on its way is overtaken, and
\* the node is linked to the peer it just hung up on. Must fail NoLocalRedial.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = TRUE
  QuietUnlinked = TRUE
  RemoteQuiet = FALSE
  Unquiet = TRUE
  OnlyDiscoveryChecked = TRUE
  RecheckQuiet = FALSE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT NoLocalRedial
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
