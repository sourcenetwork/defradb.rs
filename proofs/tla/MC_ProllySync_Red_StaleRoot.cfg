\* run-all: ProllySync.tla RED
\* The bug: the responder answers with a root it cached before its last write.
\* The cached root equals the puller's, so the puller stops "caught up" while
\* the responder holds a version it lacks. PulledHolds fails.
SPECIFICATION Spec
CONSTANTS
  MaxVersion = 3
  Filter = TRUE
  FreshRoot = FALSE
  FetchChanged = TRUE
  InvalidateOnMerge = TRUE
INVARIANT PulledHolds
CHECK_DEADLOCK FALSE
