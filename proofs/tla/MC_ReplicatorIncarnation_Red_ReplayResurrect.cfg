\* Bug: a replay that read the row before Delete writes it back through create_replicator, so a
\* removed peer reappears as an inactive replicator (ACT_NoResurrect).
SPECIFICATION Spec
CONSTANT MarkerMode = "replay"
CONSTANT Stale = "retry"
CONSTANT ReplayMode = "create"
PROPERTY ACT_NoResurrect
CHECK_DEADLOCK FALSE
