\* GREEN (#1088 W1 fix): capacity overflow replies AT_CAPACITY, so the pusher keeps its
\* retry record and re-pushes. Every success reply corresponds to kept hub state (merged
\* or pending), and under scheduler fairness every head eventually merges.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Heads     <- mcHeads
  Parent    <- mcNoParents
  Prio      <- mcFlatPrio
  ScopeOf   <- mcOwnScope
  Cap       <- mcCap
  ReplyMode = "NackOnFull"
  CoverRule = "Parent"
INVARIANT INV_TypeOK
INVARIANT INV_SuccessImpliesRegisteredOrMerged
INVARIANT INV_AckedHeadReachable
PROPERTY EventuallyAllMerged
