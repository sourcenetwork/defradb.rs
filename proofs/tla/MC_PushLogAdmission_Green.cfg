\* GREEN (#1088 W1 fix): capacity overflow replies AT_CAPACITY, so the pusher keeps its
\* retry record and re-pushes. Every success reply corresponds to kept hub state (merged
\* or pending), and under scheduler fairness every head eventually merges. The ack guard
\* accepts the durable record the store committed for a head with no in-memory entry, so
\* no nack hits a head the hub has registered.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Heads     <- mcHeads
  Parent    <- mcNoParents
  Prio      <- mcFlatPrio
  ScopeOf   <- mcOwnScope
  Cap       <- mcCap
  ReplyMode = "NackOnFull"
  CoverRule = "Parent"
  GuardMode = "Committed"
INVARIANT INV_TypeOK
INVARIANT INV_SuccessImpliesRegisteredOrMerged
INVARIANT INV_AckedHeadReachable
INVARIANT INV_NackImpliesUnregistered
PROPERTY EventuallyAllMerged
