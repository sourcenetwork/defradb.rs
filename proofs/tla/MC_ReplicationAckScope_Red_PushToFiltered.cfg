\* RED: the push loses its guard and sends the collection heads to a filtered
\* replicator too. The collection heads lead to every document, so the peer
\* receives d2, which its filter does not match. Must fail INV_FilterRespected.
SPECIFICATION Spec
CONSTANTS
  d1 = d1
  d2 = d2
  Docs           = {d1, d2}
  Matches        = {d1}
  MaxWrites      = 2
  MainRule       = FALSE
  PushToFiltered = TRUE
INVARIANT TypeOK
INVARIANT INV_FilterRespected
