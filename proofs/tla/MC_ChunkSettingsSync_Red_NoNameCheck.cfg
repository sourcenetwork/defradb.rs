\* The bug: the guards compare the @chunk settings but not the name. A forged
\* patch that renames the parent keeps its settings and is stored, so its
\* chunks lose their parent by name. MergedKeepName fails.
SPECIFICATION Spec
CONSTANTS
  N = 3
  FirstCheck = TRUE
  MergeGuard = TRUE
  ActivateGuard = TRUE
  NameCheck = FALSE
  HasLegacy = FALSE
INVARIANT MergedKeepName
CHECK_DEADLOCK FALSE
