\* GREEN: a client's change staged over HTTP under its delegation, which
\* may expire before settlement, with what is promised to happen: the
\* drainer takes its turns and fresh authority is supplied. The change ends
\* settled, or parked as refused or as awaiting authority. Several changes
\* and crashes are MC_AcpOutbox_Green_Journal_Live's: from the commit on, a
\* client's change is any change.
SPECIFICATION SpecLiveJournaled
CONSTANTS
  MaxChanges               = 1
  Subjects                 = {"g"}
  Actors                   = {"c"}
  Auths                    = {"deleg"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 0
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = TRUE
  Note                     = TRUE
  Floor                    = TRUE
  Captured                 = TRUE
  Remote                   = TRUE
  ActorFromCredential      = TRUE
  RemoteCheck              = TRUE
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT TypeOK
PROPERTY LIVE_Drains
CHECK_DEADLOCK FALSE
