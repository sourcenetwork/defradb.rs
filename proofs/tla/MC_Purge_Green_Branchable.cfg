\* A purge in a @branchable collection, every guard in place: the whole history stays, because the
\* collection DAG links it, and no block names a purged document as its owner any more.
SPECIFICATION Spec
CONSTANTS
  Branchable = TRUE
  HistoryMode = "ByCollection"
  MaxActs = 2
  OwnerMode = "Checked"
  EdgeMode = "Drop"
  IndexMode = "Delete"
  CountMode = "Distinct"
  RetryMode = "Retry"
  ScanMode = "Validated"
INVARIANTS INV_OthersIntact INV_CollectionIntact INV_Gone INV_NoStaleOwner INV_Pruned INV_Count
PROPERTY PROP_Commits
CHECK_DEADLOCK FALSE
