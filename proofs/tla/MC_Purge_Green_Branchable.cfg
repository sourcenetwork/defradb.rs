\* pruneHistory on in a @branchable collection: the collection DAG keeps every composite and what it links, other guards as GREEN.
SPECIFICATION Spec
CONSTANTS
  Prune = TRUE
  MaxActs = 2
  OwnerMode = "Checked"
  EdgeMode = "Drop"
  IndexMode = "Delete"
  CountMode = "Distinct"
  RetryMode = "Retry"
  ScanMode = "Validated"
  Branchable = TRUE
  CollectionMode = "Owner"
INVARIANTS INV_OthersIntact INV_CollectionIntact INV_Gone INV_NoStaleOwner INV_Pruned INV_Count
PROPERTY PROP_Commits
CHECK_DEADLOCK FALSE
