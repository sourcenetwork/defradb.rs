\* GREEN, a broken document: d1's migration fails and nobody fixes it. Three
\* writes, the explicit transaction and a crash around one drain. The drain moves
\* d2, appends d1 to the log again and truncates its plan, so d2 always leaves the
\* log while d1 stays owed. Every read is exact and the entries match the records.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
  Poisoned = {d1}
  Carry = "Tail"
  Fixed = "Never"
INVARIANT INV_TypeOK INV_ReadExact INV_TxReadExact INV_RecordMatchesIndex INV_SettledIndexExact INV_TxNotAbortedByDrain
PROPERTY PROP_HealthyDrains
CHECK_DEADLOCK FALSE
