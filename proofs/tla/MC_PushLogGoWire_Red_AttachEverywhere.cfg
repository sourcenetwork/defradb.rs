\* run-all: PushLogGoWire.tla RED
\* push log go wire: the capability reaches Go (INV_NoPushDropped)
\* RED: the sender attaches the capability whatever protocol the push took,
\* as before the fix. Go's signature check fails on the field it does not
\* know, Go drops the push, and the owned document never arrives: INV_NoPushDropped
\* (and INV_GoGetsOnlyGoFields) is violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Docs = {"owned", "public"}
  Owned = {"owned"}
  Receivers = {"go", "rust"}
  Bug = "AttachEverywhere"
INVARIANT TypeOK
INVARIANT INV_NoPushDropped
