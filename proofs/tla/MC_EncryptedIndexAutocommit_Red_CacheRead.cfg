\* RED: the request decides from the shared cache, read outside its
\* transaction, and blind-writes the definition, as the `defradb start`
\* adapter did. Two clients read the definition with no index, the first
\* commits its field, the second overwrites the definition with only its own
\* field, and the first client was told it succeeded (INV_NoLostIndex).
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  ValidatedRead = FALSE
  Retry = TRUE
INVARIANT INV_NoLostIndex
CHECK_DEADLOCK FALSE
