\* RED: clear keeps the slot but drops every key, held or not. Holder a holds
\* the DID; the process clears; a's next signed request finds no key though
\* a never gave its hold back. Must fail INV_KeyWhileHeld.
SPECIFICATION Spec
CONSTANTS
  Holders         = {a, b}
  Contexts        = {a, b}
  PinSig          = a
  NoSigner        = none
  MaxSlots        = 2
  AtomicSwap      = TRUE
  CountHolds      = TRUE
  ClearKeepsSlots = TRUE
  ClearKeepsHeld  = FALSE
  RetainNeedsKey  = TRUE
  RefuseOther     = TRUE
  PinRefusesHeld  = TRUE
  SameByContext   = TRUE
INVARIANT INV_KeyWhileHeld
CHECK_DEADLOCK FALSE
