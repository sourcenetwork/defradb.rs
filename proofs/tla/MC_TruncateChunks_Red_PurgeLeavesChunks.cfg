\* RED: the bug plants a purge that removes the articles but not their chunks.
\* The purge commits and the chunks of the purged article are still stored, so
\* they pile up with nothing to ever remove them (INV_PurgedHaveNoChunks).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  ChunksFirst = TRUE
  PurgeCascades = FALSE
INVARIANT INV_PurgedHaveNoChunks
CHECK_DEADLOCK FALSE
