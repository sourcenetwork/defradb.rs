\* GREEN: every guard in place. Imports through each of the four edges, by
\* an anonymous or a named caller, on a node that signs or not, of a file
\* with a repeated alias, a contested alias or a stored one (first or last),
\* while another writer claims an alias, the node may close and drain and
\* the Node import's caller may stop waiting at
\* any step: every imported document is signed, owned and broadcast as a
\* create, written on its edge's path, with no alias twice, no alias
\* stolen, every saved alias registered, no drain under a running import,
\* and every document before a failure kept.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  HoldImport          = TRUE
  DetachedImport      = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  OneByOneOnRefusal   = TRUE
  RegisterEachOnRefusal = TRUE
  RequireNode         = TRUE
INVARIANT TypeOK INV_ImportSigned INV_ImportReplicated INV_HostFromEdge INV_DriverOnCaller INV_NoDuplicateAlias INV_AliasNeverStolen INV_FfiTxnRefused INV_CreatorAsCreate INV_SavedRegistered INV_DrainWaitsForImport INV_KeepsPrefix
CHECK_DEADLOCK FALSE
