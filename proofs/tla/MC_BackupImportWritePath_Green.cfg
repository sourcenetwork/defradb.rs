\* GREEN: every guard in place. Imports through each of the four edges, by
\* an anonymous or a named caller, on a node that signs or not, of a file
\* with a repeated alias, a contested alias or a stored one, while another
\* writer claims an alias and the node may close: every imported document is
\* signed, owned and broadcast as a create, written on its edge's path, with
\* no alias twice and no alias stolen.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  AdmitEachWrite      = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  RequireNode         = TRUE
INVARIANT TypeOK
INVARIANT INV_ImportSigned
INVARIANT INV_ImportReplicated
INVARIANT INV_HostFromEdge
INVARIANT INV_DriverOnCaller
INVARIANT INV_NoDuplicateAlias
INVARIANT INV_AliasNeverStolen
INVARIANT INV_FfiTxnRefused
INVARIANT INV_CreatorAsCreate
INVARIANT INV_NoWriteAfterClose
CHECK_DEADLOCK FALSE
