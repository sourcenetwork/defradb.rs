\* run-all: DeferredVector.tla RED
\* a node that opens on pending entries does not drain them
\* Plants a node that opens after a crash without draining what is pending. The
\* crash lost the request the last write made, so its entry stays pending
\* forever: PROP_Converges fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {n1, n2}
          Drains = {d1, d2}
          MaxWrites = 3
          MaxCrashes = 1
          ValidateRead = TRUE
          Supersede = TRUE
          MergePending = TRUE
          DropStale = TRUE
          AskOnCommit = TRUE
          SettleAtOpen = FALSE
PROPERTY PROP_Converges
