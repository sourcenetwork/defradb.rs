\* RED: #2848's first cut. The writer counts itself alone only when no peer
\* is connected. A peer that has connected but not yet subscribed makes the
\* write wait out the window; the peer subscribes during it and gets the
\* write, which Go never sends it. Must fail INV_GoAudience.
SPECIFICATION Spec
CONSTANTS
  SkipWhenAlone = TRUE
  AloneMeansUnsubscribed = FALSE
  RetryWhileConnected = FALSE
INVARIANT TypeOK
INVARIANT INV_GoAudience
CHECK_DEADLOCK FALSE
