\* run-all: RetryRegistrationFence.tla RED
\* RED: the write stops at the first peer whose registration fails and queues
\* nothing. A peer removed during the fan-out then leaves the other peers
\* undecided, or registered with no push queued (INV_FanOutPeerLocal).
SPECIFICATION Spec
CONSTANT Peers = {"p1", "p2"}
CONSTANT Background = 1
CONSTANT MaxEpoch = 2
CONSTANT Faults = FALSE
CONSTANT CheckEpoch = TRUE
CONSTANT CheckOrder = TRUE
CONSTANT KeepFallbackFence = TRUE
CONSTANT FanOut = "AbortOnFirstFail"
INVARIANT TypeOK
INVARIANT INV_FanOutPeerLocal
CHECK_DEADLOCK FALSE
