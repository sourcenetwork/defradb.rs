\* RED (c): make_default writes the slot with a plain store instead of a
\* compare-and-swap against the value it loaded (default.rs:95). p1 and p2 both
\* load the empty slot and both see nothing running; p1 stores itself and hears
\* "yes", then p2's store overwrites it while p1 runs. A lost update: p1 was told
\* it is the default and it is not. Two pools are the smallest instance with
\* two racing registrations. Must fail INV_FirstRunningWins.
SPECIFICATION Spec
CONSTANTS
  NP                 = 2
  NC                 = 1
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = FALSE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_FirstRunningWins
CHECK_DEADLOCK FALSE
