\* RED: an unsubscribe leaves the topic but keeps the publish's hold. A node
\* subscribed to a document topic, published on it, then unsubscribed: it is
\* off the topic while the node still counts it held, so it would take the
\* held topic's JOINED and LEFT it can no longer hear. Must fail
\* INV_HeldIsJoined.
SPECIFICATION Spec
CONSTANTS
  Nodes         = {a, b}
  RawTopic      = FALSE
  Gate          = TRUE
  RawFirst      = TRUE
  SessionFilter = TRUE
  OwnerCheck    = TRUE
  HoldEnds      = FALSE
  EngineFilter  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoDeliveryOffMesh
INVARIANT INV_RawNeverDecoded
INVARIANT INV_JoinedOnlyLinkedMembers
INVARIANT INV_EngineKeepsItsTopic
INVARIANT INV_OnlyEngineTopics
INVARIANT INV_HeldIsJoined
CHECK_DEADLOCK FALSE
