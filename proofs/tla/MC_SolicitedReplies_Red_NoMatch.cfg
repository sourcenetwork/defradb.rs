\* RED: admission reads every reply stream, as before this change. A reply
\* stream arrives before any request was sent and is admitted
\* (INV_NoUnsolicitedAdmitted).
SPECIFICATION Spec
CONSTANTS
  MaxReq = 3
  MatchMode = "NoMatch"
  TakeMode = "Decrement"
  PruneMode = "ExpiredSerial"
  SendMode = "ExpectFirst"
  ExpiredMode = "Reset"
  Mux = "V1"
  ReplyMode = "RequestStream"
  RespMode = "Refuse"
INVARIANT INV_NoUnsolicitedAdmitted
