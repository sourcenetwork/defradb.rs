\* RED: one bounded queue for every input, and everyone waits for room. The
\* driver waits on a full event lane while the consumer waits for a reply;
\* peers fill the queue, so the endpoint loop waits for room that never comes.
\* Expect LIVE_RequestAnswered to be violated.
SPECIFICATION Spec
CONSTANTS
  Cap = 2
  EventCap = 1
  MaxRecv = 4
  MaxCmds = 2
  InboxMode = "Shared"
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
PROPERTY LIVE_RequestAnswered
