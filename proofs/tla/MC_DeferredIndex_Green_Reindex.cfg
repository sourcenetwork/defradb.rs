\* GREEN, reindex: two documents, one drain, increments and deletes, the explicit
\* transaction, one crash and a reindex that clears the entries and walks the
\* documents while the drain keeps running. The walk reads each document's record
\* without validating it and removes the entry it names before it writes its own.
\* Its put of the record conflicts with a drain that moved the record anywhere else,
\* so no entry is ever left that no record names, and reads are exact once the walk
\* is done.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "On"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
INVARIANT INV_TypeOK INV_ReadExact INV_TxReadExact INV_RecordMatchesIndex INV_NoOrphanEntry INV_SettledIndexExact
CHECK_DEADLOCK FALSE
