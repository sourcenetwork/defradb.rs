\* run-all: ExplicitDisconnect.tla RED
\* libp2p accepts a marked inbound dial (INV_MarkedInboundRefused)
\* RED: libp2p accepts an inbound dial after a deliberate disconnect, as the
\* missing refusal guard did, violating INV_MarkedInboundRefused.
SPECIFICATION Spec
CONSTANTS
  Nodes = {"a", "b", "c"}
  Half = "Libp2p"
  Bug = "AcceptsInbound"
INVARIANT TypeOK
INVARIANT INV_NoRedialAfterDeliberateClose
INVARIANT INV_RemoteExplicitDialAccepted
INVARIANT INV_MarkedInboundRefused
CHECK_DEADLOCK FALSE
