\* GREEN: the design. Two callers race to shut down; two tasks are in the
\* tracked set from the start and a third comes from a late spawn whose
\* pruner and push race the drain. The edge may close at any moment, the
\* runtime may be torn down under a drain on the edge, a caller may be
\* cancelled while it waits or while it runs the drain in place, and any
\* task may end or hang. Every invariant and the liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  Callers          = {"c1", "c2"}
  Tasks            = {"t1", "t2", "t3"}
  Late             = {"t3"}
  CanKill          = TRUE
  SwapFlag         = TRUE
  AtomicSpawn      = TRUE
  RunRefused       = TRUE
  DrainOwnsSender  = TRUE
  WaitForPruners   = TRUE
  PrunerChecksFlag = TRUE
  RecheckAfterPush = TRUE
  AbortAtDeadline  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoLeak
INVARIANT INV_OneDrain
INVARIANT INV_ErrMeansCancelled
PROPERTY LIVE_CallersReturn
CHECK_DEADLOCK FALSE
