\* RED: each collection is validated as if it were the only one the patch
\* changes (the bug in #2375). A relation added on both sides looks one-sided,
\* so a valid patch is refused (INV_ValidPatchApplies).
SPECIFICATION Spec
CONSTANTS
  Colls = {"users", "books"}
  CommitMode = "Atomic"
  SiblingsVisible = FALSE
  CheckRefs = TRUE
INVARIANT INV_ValidPatchApplies
CHECK_DEADLOCK FALSE
