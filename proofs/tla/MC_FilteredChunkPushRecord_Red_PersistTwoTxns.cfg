\* run-all: FilteredChunkPushRecord.tla RED
\* a removal writes back a record it read before an add (INV_NothingUnmatched)
\* RED: the bug plants a removal that reads the disk in one transaction and
\* writes it in another. The add of the filter lands in between, and the
\* removal writes back the unfiltered record it read. After a restart the
\* unmatched article and its chunk reach the receiver (INV_NothingUnmatched).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  MaxRestarts = 2
  LookupCanFail = TRUE
  CanCorrupt = TRUE
  AddPairs = TRUE
  RemoveTakesChunks = TRUE
  KeepStoredPair = TRUE
  PersistOnlyNarrows = TRUE
  PersistInOneTxn = FALSE
  BadRecordFailsClosed = TRUE
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
