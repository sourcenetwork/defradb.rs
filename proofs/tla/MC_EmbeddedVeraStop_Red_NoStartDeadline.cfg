\* RED: the next node's wait for the directory has no deadline. While a Vera
\* node that hung past its stop deadline holds the directory, the next start
\* waits forever and reports nothing. Must fail LIVE_NextStartReturns.
SPECIFICATION Spec
CONSTANTS
  FreshDecisions    = TRUE
  StopAfterRequests = TRUE
  StopDeadline      = TRUE
  StartDeadline     = FALSE
  ClosesLink        = TRUE
PROPERTY LIVE_NextStartReturns
CHECK_DEADLOCK FALSE
