\* run-all: ClientUniqueAdmission.tla RED
\* a plain scan is validated: a writer is refused with no index (INV_NoIndexNotRefused)
\* RED: with no index, the filtered read is treated as a decision and
\* validated over its range. The second writer of "v" is refused although
\* nothing forbids two documents with "v" (INV_NoIndexNotRefused).
SPECIFICATION Spec
CONSTANTS
  Clients = {1, 2}
  Values = {"v"}
  Mode = "Explicit"
  Indexed = FALSE
  EntryValidated = TRUE
  ScanDecides = TRUE
  LoserLeaves = FALSE
  RerunReuses = FALSE
  NilChecked = FALSE
  MaxAttempts = 3
INVARIANT INV_NoIndexNotRefused
CHECK_DEADLOCK FALSE
