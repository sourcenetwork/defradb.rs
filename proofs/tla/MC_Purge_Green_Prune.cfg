\* A purge outside a @branchable collection, every guard in place, a sync storing blocks twice:
\* the history only the purged documents own goes, shared blocks stay, the count lands once on commit.
SPECIFICATION Spec
CONSTANTS
  Branchable = FALSE
  HistoryMode = "ByCollection"
  MaxActs = 2
  OwnerMode = "Checked"
  EdgeMode = "Drop"
  IndexMode = "Delete"
  CountMode = "Distinct"
  RetryMode = "Retry"
  ScanMode = "Validated"
INVARIANTS INV_OthersIntact INV_CollectionIntact INV_Gone INV_NoStaleOwner INV_Pruned INV_Count
PROPERTY PROP_Commits
CHECK_DEADLOCK FALSE
