\* GREEN: the drainer as the code runs it. Changes go through the worker's
\* journal: the drainer stores the request's digest with its changes, has it
\* journaled, stores its hash, sends it and waits for its receipt. Two changes
\* of one transaction go in one request, which the provider applies together
\* or not at all, and a refused one is sent again one change at a time. The
\* node crashes, a wait is dropped, and anyone may resolve the journaled
\* request, keeping a note of its outcome. The provider goes away and an actor
\* without authority stages while it is away. Every safety property holds:
\* above all a change takes effect at most once, and no change is parked as
\* refused for another's refusal.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"node", "deleg"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 1
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = TRUE
  Note                     = TRUE
  MaxBatch                 = 2
  Isolate                  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWidening
INVARIANT INV_RevokedAtCommit
INVARIANT INV_RegistrationFirst
INVARIANT INV_AtMostOneEffect
INVARIANT INV_RollbackLeavesNothing
INVARIANT INV_OwedDocumentNarrow
INVARIANT INV_DenialsChecked
INVARIANT INV_RefusedChecked
INVARIANT INV_UncheckedYields
INVARIANT INV_FailureReported
INVARIANT INV_AbandonIsFinal
INVARIANT INV_PresentedAuthority
INVARIANT INV_RefusedOnItsOwn
