\* The iroh configuration. A reply rides the request's own bidirectional stream,
\* so a relay-only path -- which gives no reverse route -- still carries the ACK
\* and the sender retires its marker. Differs from
\* MC_Transport_Red_RelayNoRouteBack in ReplyMode alone: that run is the libp2p
\* shape, which Go compatibility fixes at a reverse-dialled response stream.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxHead <- mcMaxHead
  MaxLoss <- mcMaxLoss
  LinkMode     = "Reorder"
  DupMode      = "Duplicate"
  ReplyMode    = "SameStream"
  RouteMode    = "RelayOnly"
  TimeoutMode  = "Ambiguous"
  RegisterMode = "HeadCurrent"
INVARIANT INV_TypeOK
INVARIANT INV_NoLostUpdate
INVARIANT INV_RegisteredMonotone
INVARIANT INV_ObligationIdempotent
PROPERTY LIVE_EventuallyMerged
PROPERTY LIVE_SenderQuiesces
