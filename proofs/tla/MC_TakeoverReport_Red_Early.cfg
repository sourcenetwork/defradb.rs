\* RED: the provider publishes as soon as one replay is classified. The event
\* leaves out the replays still to run, so the embedder takes a partial report
\* for the whole one. Must fail INV_Complete.
SPECIFICATION Spec
CONSTANTS
    Submissions = {1, 2}
    MaxTerm = 2
    MaxFaults = 1
    Publish = TRUE
    AfterAll = FALSE
    Once = TRUE
    KeepOwed = TRUE
    CutOfTerm = TRUE
    NameUnrestorable = TRUE
    NameClosed = TRUE
    Recorded = TRUE
INVARIANT
    TypeOK
    INV_Complete
