\* RED: the loop takes report's wait_for_sync from the message alone, not from
\* the copy state. CopyData is not an extended message, so an error in a copy
\* begun by Execute makes the connection ready at once, and the next extended
\* message is handled before the Sync. Must fail INV_SkipUntilSync.
SPECIFICATION Spec
CONSTANTS
  Limit              = 1
  MaxTime            = 0
  MaxMsgs            = 4
  PreMsgs            = {"anon"}
  PostMsgs           = {"ext", "data", "sync"}
  SimpleCopy         = FALSE
  ExtendedCopy       = TRUE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = FALSE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_SkipUntilSync
CHECK_DEADLOCK FALSE
