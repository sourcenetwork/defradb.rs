\* RED: P2P shuts down after the drain closed the node's scope, as defra-node
\* EmbeddedNode::shutdown did before #2428. The closed scope refuses the
\* coordinator's drain, so nobody aborts the coordinator task: it keeps running
\* on the network runtime past P2P's shutdown, through the close of regolith,
\* holding its store transaction. Must fail INV_NothingDetached. The
\* same order checked on storage is MC_NodeShutdown_Red_P2PAfterDrainStorage.cfg.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
  P2PFirst        = FALSE
  RequestsFirst   = TRUE
  CommitsAdmitted = TRUE
  EndsOpenTransactions = TRUE
  WaitersWait     = TRUE
  HandsBackLead   = TRUE
  RerunCompletesClose = TRUE
INVARIANT INV_NothingDetached
CHECK_DEADLOCK FALSE
