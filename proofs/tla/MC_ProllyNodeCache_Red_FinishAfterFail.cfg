\* The bug: a build whose put failed still finishes. The reference that put
\* was to hand the level above is gone, so the tree it returns misses that
\* chunk's entries. BuildWhole fails.
SPECIFICATION Spec
CONSTANTS
  ReadPending = TRUE
  Evict = TRUE
  SkipHuge = TRUE
  KeepOnFail = TRUE
  FlushFirst = TRUE
  RefuseAfterFail = FALSE
INVARIANT BuildWhole
CHECK_DEADLOCK FALSE
