\* Bug: a document with no first version is dropped without a report, so
\* the operator never learns b was not imported. Fails INV_Complete.
SPECIFICATION Spec
CONSTANTS
  Filtered = {"a"}
  MaxRuns = 2
  SnapMode = "Shallow"
  StoreMode = "Before"
  GenesisMode = "Check"
  WriteMode = "Join"
  JudgeMode = "Restore"
  ReportMode = "Silent"
INVARIANTS INV_MergedHasBlocks INV_NoDocWithoutFirst INV_NoLostLiveWrite INV_Complete
CHECK_DEADLOCK FALSE
