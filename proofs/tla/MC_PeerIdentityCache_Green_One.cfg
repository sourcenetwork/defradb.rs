\* The real cache with a line of one place, where every new peer evicts the
\* previous one and evictions race each other. Every invariant still holds.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  p1 = p1
  p2 = p2
  p3 = p3
  t1 = t1
  t2 = t2
  Peers = {p1, p2, p3}
  Tasks = {t1, t2}
  Ops = 2
  Cap = 1
  Mode = "correct"
INVARIANTS TypeOK NoDoublePlace PlacedAreCached SettledMatch SettledBounded Bounded
