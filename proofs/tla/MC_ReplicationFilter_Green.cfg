\* Every guard in place: the refused document stores nothing, the kept ones merge, alone or in a batch.
\* All invariants hold.
SPECIFICATION Spec
CONSTANTS
  Branchable = FALSE
  AskMode = "BeforePersist"
  BatchMode = "PerEvent"
  FinalMode = "Terminal"
  ScopeMode = "SkipBranchable"
INVARIANTS INV_RefusedNothingStored INV_KeptMerged INV_MergedOnce INV_BranchableUnfiltered
CHECK_DEADLOCK FALSE
