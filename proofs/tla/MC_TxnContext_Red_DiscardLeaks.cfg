  a = a
  b = b
  t1 = t1
  t2 = t2
  k1 = k1
  Callers = {a, b}
  Txns    = {t1, t2}
  Keys    = {k1}
  Bug     = "DiscardLeaks"
INVARIANT TypeOK
INVARIANT INV_DiscardLeavesNothing
