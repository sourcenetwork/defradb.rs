\* PeerConnected is sent by the adopt after it spawns the pump, as before the fix: an adopt
\* dropped while that send waits on a full lane leaves the peer counted with no PeerConnected,
\* and nothing sends it until the peer fully disconnects (Announced).
SPECIFICATION Spec
CONSTANTS
  AdoptRpcDial = TRUE
  Announcer = "adopt"
  CleanupRefusedPump = TRUE
  HitSkipsAdoption = TRUE
  NarrowRefusal = TRUE
  RestoreSibling = TRUE
  CloseRetained = TRUE
INVARIANTS
  Announced
CHECK_DEADLOCK FALSE
