\* RED: a failed drain drops its request. The poison index fails at the settle
\* and nothing asks for it again (INV_OwedKept).
SPECIFICATION Spec
CONSTANTS
  Poison = 1
  Hot = 2
  Quiet = 3
  Interval = 2
  Isolate = "On"
  KeepFailed = "Off"
  Requeue = "On"
  PurgeRequests = "On"
  SweepTimer = "Fixed"
  SweepFirst = "On"
INVARIANT INV_OwedKept
CHECK_DEADLOCK FALSE
