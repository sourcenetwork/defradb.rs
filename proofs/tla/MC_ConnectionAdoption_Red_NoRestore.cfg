\* A refused publish does not put back the sibling it displaced: the sibling stays open
\* but is no longer the shared RPC path, so the next request dials again.
SPECIFICATION Spec
CONSTANTS
  AdoptRpcDial = TRUE
  PumpBeforeAnnounce = TRUE
  CleanupRefusedPump = TRUE
  HitSkipsAdoption = TRUE
  NarrowRefusal = TRUE
  RestoreSibling = FALSE
  CloseRetained = TRUE
INVARIANTS
  SiblingKept
CHECK_DEADLOCK FALSE
