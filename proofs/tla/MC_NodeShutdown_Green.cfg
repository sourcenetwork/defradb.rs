\* GREEN: the code as written. The redrive is a pool task in the shutdown set,
\* services are stopped and then awaited, the drain has a deadline, and a
\* refused telemetry flush keeps its handle for a thread of its own, and P2P
\* shuts down before the drain closes the node's scope, so the coordinator's
\* drain is admitted and ends its task; requests and in-process writes stop and
\* drain before P2P, so every admitted write registers its marker; and the
\* transactions callers left open end before the store closes. Three tasks,
\* one request, one write and one open transaction reach every step, with two
\* callers: one may be cancelled, and the runtime's task may end early, and
\* each hands the lead back to the next caller, which reruns the teardown.
\* Every invariant and the liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
  P2PFirst        = TRUE
  RequestsFirst   = TRUE
  CommitsAdmitted = TRUE
  EndsOpenTransactions = TRUE
  WaitersWait     = TRUE
  HandsBackLead   = TRUE
  RerunCompletesClose = TRUE
INVARIANT TypeOK
INVARIANT INV_NoStorageAfterClose
INVARIANT INV_NothingDetached
INVARIANT INV_CallerNeverJoinsExporter
INVARIANT INV_AdmittedWritesMarked
INVARIANT INV_CloseWaitsForNoTransaction
INVARIANT INV_ReturnsAfterShutdown
INVARIANT INV_StoreClosedPastClose
PROPERTY LIVE_ShutdownTerminates
CHECK_DEADLOCK FALSE
