\* GREEN: the code as written. The redrive is a pool task in the shutdown set,
\* services are stopped and then awaited, the drain has a deadline, and a
\* refused telemetry flush keeps its handle for a thread of its own. Two tasks
\* and one request that may hang forever are enough to reach every step.
\* Every invariant and the liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
INVARIANT TypeOK
INVARIANT INV_NoStorageAfterClose
INVARIANT INV_NothingDetached
INVARIANT INV_CallerNeverJoinsExporter
PROPERTY LIVE_ShutdownTerminates
CHECK_DEADLOCK FALSE
