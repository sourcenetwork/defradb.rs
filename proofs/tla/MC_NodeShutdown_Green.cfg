\* GREEN: the code as written. The redrive is a pool task in the shutdown set,
\* services are stopped and then awaited, each drain has a deadline, a refused
\* telemetry flush keeps its handle for a thread of its own, and requests and
\* in-process writes stop and drain before P2P, so every admitted write
\* registers its marker, and the transactions callers left open end before
\* regolith closes. Two tasks, one request that may hang forever, one
\* in-process write and one transaction left open are enough to reach every
\* step. Every invariant and the liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
  RequestsFirst   = TRUE
  CommitsAdmitted = TRUE
  EndsOpenTransactions = TRUE
INVARIANT TypeOK
INVARIANT INV_NoStorageAfterClose
INVARIANT INV_NothingDetached
INVARIANT INV_CallerNeverJoinsExporter
INVARIANT INV_AdmittedWritesMarked
INVARIANT INV_CloseWaitsForNoTransaction
PROPERTY LIVE_ShutdownTerminates
CHECK_DEADLOCK FALSE
