\* Plants the bug of reading every entry of a cache that is ahead of the search: an update from the search's future is the newest entry it sees, and INV_ScoresLatest fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {a, b}
          Readers = {r1, r2}
          MaxCommits = 3
          MaxOwn = 2
          GenerationCheck = TRUE
          OwnAppendsRead = TRUE
          TruncateThroughLinked = TRUE
          LatestOnly = TRUE
          HeadCut = FALSE
INVARIANT INV_NoHiddenPending
INVARIANT INV_CacheCovers
INVARIANT INV_NoLostVector
INVARIANT INV_ScoresLatest
SYMMETRY Symmetry
