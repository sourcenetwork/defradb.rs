\* run-all: OwnerTransfer.tla RED
\* a refused transfer is removed and its actor is told nothing (INV_FailureReported)
\* RED: a refusal removes the change silently. The deployment answers the
\* transfer only with errors, the node takes them as a refusal and deletes
\* the record without a note: its actor reads "nothing is owed" as "the
\* deployment holds it". Must fail INV_FailureReported.
SPECIFICATION Spec
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = TRUE
  CommitConflict = TRUE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = FALSE
  BoundedRetries = TRUE
  Poisoned       = {2}
  MaxFails       = 2
  MaxCrashes     = 1
  MaxLapses      = 1
  MaxAborts      = 1
  OwnTransfer    = TRUE
INVARIANT INV_FailureReported
CHECK_DEADLOCK FALSE
