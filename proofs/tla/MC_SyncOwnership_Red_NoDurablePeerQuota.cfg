\* RED: the second tier with no per-peer quota (DurableQuota = Cap). p1's
\* never-serving roots d1 and d2 are both acknowledged, one in each tier,
\* and fill the durable store for good: neither merges, and rotation only
\* swaps them in the map. Every head of d3, whose provider serves, is nacked
\* at the full store for ever: LIVE_WrittenHeadMerged fails.
SPECIFICATION MFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs             = {d1, d2, d3}
  Cols             = {}
  MaxV             = 1
  Cap              = 2
  FetchCap         = 1
  SenderMode       = "MarkerRederive"
  RegisterMode     = "Durable"
  FlightMode       = "SingleFlight"
  AckGuardMode     = "HeadCurrent"
  ServeMode        = "DurableDerived"
  ProviderMode     = "OriginBound"
  OriginAuthMode   = "TransportBound"
  FetchMode        = "RootThenSelective"
  StreamMode       = "DrainResponse"
  CompletionMode   = "LatchedDrain"
  PendingMode      = "ScopeCurrent"
  MergeMode        = "SerializedBatch"
  MemCap           = 1
  RotateAfter      = 1
  Dead             = {d1, d2}
  PullScopes       = {}
  OverflowMode     = "Rotate"
  ContinuationMode = "EndOnStop"
  AdmissionMode    = "TwoTier"
  PeerScopes       = {{d1, d2}, {d3}}
  DurableQuota     = 2
INVARIANT INV_MemoryTypeOK
PROPERTY LIVE_WrittenHeadMerged
