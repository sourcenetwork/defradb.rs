\* RED: the refusal path writes the store. A failed open changes it before the
\* caller can reopen it with the version that wrote it (INV_RefusalReadOnly).
SPECIFICATION Spec
CONSTANTS
  Collections = {c1}
  RefusesOld = "On"
  RebuildsLegacy = "Off"
  StampsFresh = "On"
  MutatesOnRefusal = "On"
INVARIANT INV_RefusalReadOnly
CHECK_DEADLOCK FALSE
