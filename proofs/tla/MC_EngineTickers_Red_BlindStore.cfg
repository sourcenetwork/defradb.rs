\* RED (guard: compare_exchange_weak): the mark is written with a plain store
\* instead of a compare-and-swap. A read and the close both see the mark at 0
\* and the count at 1, both write 1 and both add 1: one commit, counted twice.
\* One read, one export, one count. Must fail INV_NeverOvercount.
SPECIFICATION Spec
CONSTANTS
  NS           = 1
  NR           = 1
  MaxCount     = 1
  Forward      = TRUE
  ClaimByCas   = FALSE
  Retry        = TRUE
  Refresh      = TRUE
  PublishFirst = TRUE
  HoldStats    = TRUE
  OnlyGrow     = TRUE
  OwnStats     = TRUE
  StopFirst    = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverOvercount
CHECK_DEADLOCK FALSE
