\* run-all: CommitOutcome.tla RED
\* a refusal before apply is answered indeterminate (INV_RefusalIsAborted)
\* RED: a refusal before the engine applied anything is answered indeterminate. Nothing is lost, but the caller cannot tell a refused transaction from one that may have landed, and never retries it. Fails INV_RefusalIsAborted.
SPECIFICATION Spec
CONSTANT ClassifyFailure = TRUE
CONSTANT RetainFailure = TRUE
CONSTANT NotFoundSaysUnknown = TRUE
CONSTANT ReportRefusal = FALSE
CONSTANT LostReplyUnknown = TRUE
INVARIANT INV_RefusalIsAborted
CHECK_DEADLOCK FALSE
