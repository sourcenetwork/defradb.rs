\* RED (d): a pool that shares takes no hold: the ledger never hears of it.
\* Pool A shares CPU 0 and runs there, its counter still 0; pool B claims CPU 0
\* alone and wins it, so a pool that promised to be alone lands on a CPU
\* another pool runs on. Must fail INV_TakenAlone.
\* Two CPUs, two pools living once each, one claim alone before sharing:
\* small, and still every interleaving of the scenario above.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 1
  Edges            = {}
  Attempts         = 1
  AtomicTake       = TRUE
  RollBack         = TRUE
  InsertAfterWin   = TRUE
  ShareCounts      = FALSE
  AttemptCap       = TRUE
  KeepWhileRunning = TRUE
  ReleaseOnce      = TRUE
  RunOnHeld        = TRUE
  ReleaseAtEnd     = TRUE
INVARIANT TypeOK
INVARIANT INV_TakenAlone
CHECK_DEADLOCK FALSE
