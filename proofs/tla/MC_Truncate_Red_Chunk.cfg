\* RED: the chunk check is left out. A truncate removes the documents of a
\* chunk collection while its parents still list them, so the chunks no longer
\* come only from the parent's writes (INV_NoRemovalFromChunks).
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  Enforced = {"nac", "branchable", "txn", "shape"}
INVARIANT INV_NoRemovalFromChunks
CHECK_DEADLOCK FALSE
