\* RED: every page marks the pass complete, also one that stopped at the page
\* limit. The records after the first page are never checked, and the node
\* reopens without owing the ones the deployment lost. Must fail
\* INV_NothingLost.
SPECIFICATION Spec
CONSTANTS
  Records       = 3
  Revoked       = {2, 3}
  PageSize      = 2
  MaxTakeovers  = 2
  MaxCrashes    = 1
  Gate          = TRUE
  HandOver      = TRUE
  OweFirst      = TRUE
  EndFromLedger = FALSE
  SaysDone      = TRUE
  TermFence     = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingLost
INVARIANT INV_RevocationDenies
PROPERTY LIVE_RecoveryEnds
