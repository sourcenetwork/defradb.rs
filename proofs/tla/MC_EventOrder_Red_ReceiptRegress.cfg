\* run-all: EventOrder.tla RED
\* a later commit gets a lower receipt (INV_CommitOrder)
\* RED: regolith hands a later commit a lower receipt, so the drainer sends
\* the later commit's events first (INV_CommitOrder).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {t1, t2}
  MaxReceipt = 2
  Mode = "receipt_regress"
INVARIANT TypeOK
INVARIANT INV_CommitOrder
