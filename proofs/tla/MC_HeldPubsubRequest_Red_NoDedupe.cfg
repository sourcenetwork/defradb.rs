\* RED: every reply is handed to the caller, so a peer that got the request twice is counted
\* twice and can stand in for a peer that never answered. Fails OneReplyEach.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  HoldOnRefusal = TRUE
  ResendOnJoin = TRUE
  WatchBeforePublish = TRUE
  DedupeReplies = FALSE
INVARIANT TypeOK
INVARIANT Delivered
INVARIANT OneReplyEach
INVARIANT RefusedOnlyUnsent
