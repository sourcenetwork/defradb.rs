\* run-all: RetryRegistrationFence.tla GREEN
\* GREEN: the code. Every peer's registration runs at once, each peer is
\* decided on its own, and the write queues only after all are decided.
SPECIFICATION Spec
CONSTANT Peers = {"p1", "p2"}
CONSTANT Background = 1
CONSTANT MaxEpoch = 2
CONSTANT Faults = TRUE
CONSTANT CheckEpoch = TRUE
CONSTANT CheckOrder = TRUE
CONSTANT KeepFallbackFence = TRUE
CONSTANT FanOut = "PerPeer"
INVARIANT TypeOK
PROPERTY ACT_RegistrationCannotCrossFence
INVARIANT INV_FanOutPeerLocal
PROPERTY LIVE_FanOutDecides
CHECK_DEADLOCK FALSE
