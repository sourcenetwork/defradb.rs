\* RED: the reader learns records only from gossip and never queries the
\* owner when its pointer is ahead. Gossip loses the newest record, and the
\* reader keeps an old one forever (LIVE_NewestReached).
SPECIFICATION Spec
CONSTANTS
  MaxSeq = 3
  SeqMode = "Increasing"
  ChooseMode = "CheckExpiry"
  RefreshMode = "GossipOnly"
PROPERTY LIVE_NewestReached
\* A reader that has lost every announcement has nothing left to do; that idle
\* state is the failure this config shows, not a deadlock to report.
CHECK_DEADLOCK FALSE
