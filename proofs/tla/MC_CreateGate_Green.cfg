\* run-all: CreateGate.tla GREEN
\* every promise holds under Vera
\* Breaks nothing: the node decides create on Vera's certified state before the
\* transaction, Vera decides again at registration, the document stays hidden
\* until Vera holds it, a refusal is final and a replica is parked after its bound.
SPECIFICATION Spec
