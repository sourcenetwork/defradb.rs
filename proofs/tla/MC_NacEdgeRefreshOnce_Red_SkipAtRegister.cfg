\* RED: the key is skipped when it was registered before, at registration
\* rather than at commit. A savepoint rolled back drops the only registration,
\* the next NAC write is skipped because the key was seen, and the commit
\* never rebuilds the snapshot (INV_RebuiltAfterNacWrite).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2, d3}
  NacDocs = {d1, d2}
  Bug = "SkipAtRegister"
INVARIANT TypeOK
INVARIANT INV_RebuiltAfterNacWrite
CHECK_DEADLOCK FALSE
