\* GREEN: gossip rides the mux connection, a dial checks admission again
\* once connected, and forgetting a peer only drops gossip's sender. A
\* revoked peer never has gossip, a path never outlives its connection,
\* gossip never closes a shared connection, and the healthy peer is reached
\* even though gossip may drop it once along the way.
SPECIFICATION Spec
CONSTANTS
  Peers <- mcPeers
  Revocable <- mcRevocable
  Healthy = "h"
  Legacy = {}
  MaxDrops = 1
  MaxForgets = 1
  ForgetBound = "Bounded"
  PathMode = "SharedMux"
  RecheckMode = "Recheck"
  ForgetMode = "DropSender"
  LegacyMode = "Answer"
INVARIANT INV_TypeOK
INVARIANT INV_RevokedHasNoGossip
INVARIANT INV_PathOnLiveConnection
INVARIANT INV_GossipNeverClosesShared
PROPERTY LIVE_HealthyReached
PROPERTY LIVE_AskAnswered
