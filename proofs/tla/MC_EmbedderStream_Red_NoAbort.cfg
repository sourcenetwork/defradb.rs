\* RED: shutdown leaves stream tasks running. s1 is still being served after
\* the node is down. Expect INV_ShutdownLeavesNone to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  Registered <- mcRegistered
  Stuck <- mcStuck
  Share = 1
  TagMode = "Check"
  LeaseMode = "WithRequest"
  DeadlineMode = "Deadline"
  RevokeMode = "Close"
  ShutdownMode = "None"
INVARIANT INV_TypeOK
INVARIANT INV_ShutdownLeavesNone
