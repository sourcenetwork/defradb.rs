\* run-all: AddView.tla RED
\* The identity check is left out of the core: a malformed acting identity still gets its views (INV_NoViewUnlessAllChecksPass)
\* RED: the core skips the identity check, and both ways in forward to it, so
\* a malformed acting identity is not refused and its views are created.
SPECIFICATION Spec
CONSTANTS
  Views = {"a", "b"}
  CoreChecks = {"nac", "sdl", "one", "cid", "chunk", "downsample", "policy"}
  ServerChecks = {"nac", "sdl", "one", "cid", "chunk", "downsample", "policy"}
  DocumentAcp = {"node", "server"}
  CreateMode = "Atomic"
  BuildFirst = FALSE
INVARIANT INV_NoViewUnlessAllChecksPass
CHECK_DEADLOCK FALSE
