\* RED: earlier changes are kept with the delete and the deployment takes
\* a change to an archived object. A grant parked before the delete is
\* renewed after it and lands after the archive: the former reader holds a
\* grant on a deleted document. Must fail INV_NoGrantAfterArchive.
SPECIFICATION Spec
CONSTANTS
  CheckPermission  = TRUE
  ArchiveAsOwner   = TRUE
  Drop             = FALSE
  VeraRefuses      = FALSE
  Overlay          = TRUE
  HistoryActorOnly = TRUE
  SpareOnlyDeleter = TRUE
  First            = "archive"
INVARIANT TypeOK
INVARIANT INV_NoGrantAfterArchive
