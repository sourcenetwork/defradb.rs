\* GREEN: DB::add_encrypted_index. Each request reads the definition in its
\* own transaction with a validated read and runs in DB::transact_db, so a
\* change that commits in between makes it run again on the new definition.
\* Three clients, so a client can lose the race twice.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2, c3}
  ValidatedRead = TRUE
  Retry = TRUE
INVARIANT TypeOK INV_NoLostIndex INV_NoValidRefused
CHECK_DEADLOCK FALSE
