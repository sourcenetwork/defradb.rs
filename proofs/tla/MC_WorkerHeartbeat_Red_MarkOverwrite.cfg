\* RED: a monitor's mark replaces whatever mark is there. Monitor 1 reads a
\* long task poll and is held up. The poll ends, the hook poll after it
\* runs long, and monitor 2 marks that hook poll, so routing goes around
\* the worker. Then monitor 1 lands its old mark on top, its recheck sees
\* its poll gone and takes the mark down, and the still-stuck worker is
\* routed new work until a later scan marks it again. Must fail
\* INV_KeepsMark.
SPECIFICATION Spec
SYMMETRY MonSymmetry
CONSTANTS
  Limit          = 1
  MaxTime        = 6
  MaxPolls       = 4
  Watchers       = {m1, m2}
  HookBeat       = TRUE
  MarkNamesPoll  = TRUE
  HookClears     = TRUE
  Recheck        = TRUE
  MarkKeepsLive  = FALSE
  ClaimMax       = TRUE
INVARIANT TypeOK
INVARIANT INV_KeepsMark
