\* RED: a concurrent merge replays from a block that is merely under every
\* head, not a critical one. For example, Alice writes "a" and Bob writes "b" at once; Alice
\* merges Bob's block and writes "c" after both. "a" is under the only head,
\* "c", but Bob's "b" never saw "a". Replaying from "a" stands placeholders for
\* "a" in front of Bob's block, so Bob's position counts a character his
\* author never had, and "b" lands somewhere a full replay does not put it.
\* Must fail INV_CriticalReplay.
SPECIFICATION Spec
CONSTANTS
  Peers        = {p1, p2}
  MaxBlocks    = 4
  SiblingKey   = "id"
  CausalBuffer = TRUE
  ResolveAt    = "parent"
  PlaceRule    = "fugue"
  ReplayFrom   = "ancestor"
INVARIANT TypeOK
INVARIANT INV_CriticalReplay
