\* run-all: AcpOutbox.tla GREEN
\* a registered document: deletes of tuples the provider holds deny from the commit on
\* GREEN: the design, for a document the provider already holds for its
\* creator, with a tuple for a named identity and one for "everyone". Two
\* changes, both actors, both ways to sign, two crashes, one expiry. Deletes
\* of tuples the provider holds are denied from the commit on, and every
\* safety property holds.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g", "*"}
  Actors                   = {"c", "m"}
  Auths                    = {"node", "deleg"}
  Preexisting              = TRUE
  InitTuples               = {"g", "*"}
  MaxCrashes               = 2
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node", "deleg", "none"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = FALSE
  Note                     = TRUE
  Floor                    = TRUE
  Captured                 = TRUE
  Remote                   = FALSE
  ActorFromCredential      = TRUE
  RemoteCheck              = TRUE
  RemoteAuthority          = TRUE
  HeldKeys                 = {}
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWidening
INVARIANT INV_RevokedAtCommit
INVARIANT INV_RegistrationFirst
INVARIANT INV_AtMostOneEffect
INVARIANT INV_RollbackLeavesNothing
INVARIANT INV_OwedDocumentNarrow
INVARIANT INV_DenialsChecked
INVARIANT INV_RefusedChecked
INVARIANT INV_UncheckedYields
INVARIANT INV_FailureReported
INVARIANT INV_AbandonIsFinal
INVARIANT INV_PresentedAuthority
CHECK_DEADLOCK FALSE
