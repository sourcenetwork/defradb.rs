\* RED: the drop waits for each aborted task to end. A node dropped on one
\* of its own pool's workers would wait on the very worker that has to run
\* the task's next poll. Must fail INV_DropNeverWaits.
SPECIFICATION Spec
CONSTANTS
  SweepInSet  = TRUE
  AbortOnDrop = TRUE
  DropAwaits  = TRUE
INVARIANT INV_DropNeverWaits
CHECK_DEADLOCK FALSE
