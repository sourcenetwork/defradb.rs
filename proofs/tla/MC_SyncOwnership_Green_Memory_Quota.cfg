\* GREEN: the shape of Red_QuotaPassOver. d1 and d2 came from one peer, whose
\* quota is one entry after the restart; d3 from another; d1 and d3 never
\* serve, and the key order is d3, d1, d2. The sweep offers the peer's places
\* to its roots in turn after the one it admitted last, so once d1 gives the
\* peer's place up the sweep offers it to d2, and d2 is fetched and merged.
SPECIFICATION MFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs             = {d1, d2, d3}
  Cols             = {}
  MaxV             = 1
  Cap              = 3
  FetchCap         = 1
  SenderMode       = "MarkerRederive"
  RegisterMode     = "Durable"
  FlightMode       = "SingleFlight"
  AckGuardMode     = "HeadCurrent"
  ServeMode        = "DurableDerived"
  ProviderMode     = "OriginBound"
  OriginAuthMode   = "TransportBound"
  FetchMode        = "RootThenSelective"
  StreamMode       = "DrainResponse"
  CompletionMode   = "LatchedDrain"
  PendingMode      = "ScopeCurrent"
  MergeMode        = "SerializedBatch"
  MemCap           = 2
  RotateAfter      = 1
  Dead             = {d1, d3}
  PullScopes       = {}
  PeerScopes       = {{d1, d2}, {d3}}
  DurableQuota     = 3
  AdmissionMode    = "TwoTier"
  OverflowMode     = "Rotate"
  ContinuationMode = "EndOnStop"
INVARIANT INV_MemoryTypeOK
INVARIANT INV_MemoryBounded
INVARIANT INV_MemoryHoldsDurable
INVARIANT INV_ContinuationsNeverAcked
INVARIANT INV_DueOrBackoff
INVARIANT INV_ObligationConservation
INVARIANT INV_SingleFlight
INVARIANT INV_FetchOwnersBounded
PROPERTY LIVE_DurableRootMerged
