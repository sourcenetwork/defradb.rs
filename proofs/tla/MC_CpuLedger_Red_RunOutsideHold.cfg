\* RED (g), a caller contract broken: a pool puts a thread on a CPU its Hold
\* does not cover (a background CPU or a sibling left out of cores_of). Pool A
\* holds CPU 0 alone but also runs on CPU 1; pool B finds CPU 1 free, claims it
\* alone and runs there too. Must fail INV_AloneRunsAlone.
\* Two CPUs, two pools living once each, one claim alone before sharing:
\* small, and still every interleaving of the scenario above.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 1
  Edges            = {}
  Attempts         = 1
  AtomicTake       = TRUE
  RollBack         = TRUE
  InsertAfterWin   = TRUE
  ShareCounts      = TRUE
  AttemptCap       = TRUE
  KeepWhileRunning = TRUE
  ReleaseOnce      = TRUE
  RunOnHeld        = FALSE
  ReleaseAtEnd     = TRUE
INVARIANT TypeOK
INVARIANT INV_AloneRunsAlone
CHECK_DEADLOCK FALSE
