\* RED: the writer reads a delete through a missing path as making the path
\* above a map. Alice deletes "a.b" from an empty field and reads {"a": {}},
\* but a delete creates nothing, and the field stays {}. Must fail
\* INV_WriteLandsAsRead.
SPECIFICATION Spec
CONSTANTS
  Peers            = {p1, p2}
  MaxBlocks        = 1
  UseCid           = TRUE
  DeleteWins       = FALSE
  DeleteImpliesMap = FALSE
  SharedIds        = FALSE
  MultiPath        = FALSE
  Settle           = TRUE
  ReadAs           = "deleteMakesParent"
  Anchor           = TRUE
INVARIANT TypeOK
INVARIANT INV_WriteLandsAsRead
