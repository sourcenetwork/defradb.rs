\* run-all: RetryRegistrationFence.tla RED
\* RED: a registration no longer checks that its token is not older than the
\* peer's marker. Two registrations that land out of order then replace a newer
\* marker with an older one (ACT_RegistrationCannotCrossFence).
SPECIFICATION Spec
CONSTANT Peers = {"p1", "p2"}
CONSTANT Background = 1
CONSTANT MaxEpoch = 2
CONSTANT Faults = TRUE
CONSTANT CheckEpoch = TRUE
CONSTANT CheckOrder = FALSE
CONSTANT KeepFallbackFence = TRUE
CONSTANT FanOut = "PerPeer"
INVARIANT TypeOK
PROPERTY ACT_RegistrationCannotCrossFence
CHECK_DEADLOCK FALSE
