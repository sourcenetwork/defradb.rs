\* GREEN: the transport subscribes, then puts the newest finalized block in
\* front of the stream, and the light client checks every header, the
\* forged ones the transport may slip in included. Up to 3 blocks finalize,
\* the first possibly before the subscription: the light client only ever
\* takes a certified head, and once the stream is drained it stands on the
\* newest block without waiting for another.
SPECIFICATION Spec
CONSTANTS
  MaxHeight      = 3
  HeadFirst      = TRUE
  FreshHead      = TRUE
  SubscribeFirst = TRUE
  Verify         = TRUE
INVARIANT TypeOK
INVARIANT INV_OnlyFinalized
INVARIANT INV_Current
