\* GREEN: the transport subscribes, then puts the newest finalized block in
\* front of the stream when it is fresh, passes on queued headers of a later
\* term even below it, and the light client checks every header, the forged
\* ones the transport may slip in included. Up to 3 blocks finalize, the
\* first before the subscription, just now or long ago, and the active
\* device may switch once: the light client only takes a certified head, a
\* stale head is never sent, and once the stream is drained the light client
\* stands on the newest fresh block without waiting for another.
SPECIFICATION Spec
CONSTANTS
  MaxHeight      = 3
  MaxTerm        = 1
  HeadFirst      = TRUE
  FreshOnly      = TRUE
  SubscribeFirst = TRUE
  KeepLaterTerms = TRUE
  Verify         = TRUE
INVARIANT TypeOK
INVARIANT INV_OnlyFinalized
INVARIANT INV_Current
INVARIANT INV_SentHeadFresh
