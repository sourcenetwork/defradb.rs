\* FieldNamesAdmittedParent
\* Plants the bug: an update may write any value into the parent field. A
\* document admitted under one parent is updated to name the other, which nobody
\* authorized: FieldNamesAdmittedParent fails.
SPECIFICATION Spec
CONSTANT Bug = "update"
INVARIANT AuthorizedAtWrite
INVARIANT RegistrationHasParent
INVARIANT FieldNamesAdmittedParent
CHECK_DEADLOCK FALSE
