\* run-all: PeerIdentityCache.tla RED
\* a refresh takes a second place (NoDoublePlace)
\* A refresh takes a new place at the back instead of keeping its first one.
\* The peer now holds two places, and the stale one later evicts it early
\* while the map runs below capacity: NoDoublePlace fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  p1 = p1
  p2 = p2
  p3 = p3
  t1 = t1
  t2 = t2
  Peers = {p1, p2, p3}
  Tasks = {t1, t2}
  Ops = 2
  Cap = 2
  Mode = "refreshEnqueues"
INVARIANTS TypeOK NoDoublePlace
