\* The bug: a patch overwrites the settings with whatever its block says, as
\* the merge did before. A forged patch with other settings is stored, so
\* MergedMatchFirst fails.
SPECIFICATION Spec
CONSTANTS
  N = 3
  FirstCheck = TRUE
  MergeGuard = FALSE
  ActivateGuard = TRUE
  HasLegacy = FALSE
INVARIANT MergedMatchFirst
CHECK_DEADLOCK FALSE
