\* RED: a restored validator has forgotten its vote and votes again under its new key, for the other contender. One machine counts twice and both contenders get certificates (INV_OneCertificate).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Honest <- mcHonest
  Cheaters <- mcCheaters
  Contenders <- mcContenders
  Quorum = 3
  VoteOnce = TRUE
  ActOnCert = TRUE
  AbstainOnRestore = FALSE
  Restores = TRUE
INVARIANT TypeOK
INVARIANT INV_OneCertificate
