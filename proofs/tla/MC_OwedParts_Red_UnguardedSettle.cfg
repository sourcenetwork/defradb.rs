\* a settle with nothing owed: settled passes staged (INV_OwedNotNegative)
\* RED: a settle is merged though nothing is owed (a record settled twice,
\* or one that was never staged). The settled part passes the staged one and
\* what is owed would go below zero. Must fail INV_OwedNotNegative.
SPECIFICATION Spec
CONSTANTS
  MaxWrites     = 4
  SettleParts   = {"settled"}
  ReadParts     = {"staged"}
  SettleGuarded = FALSE
INVARIANT INV_OwedNotNegative
CHECK_DEADLOCK FALSE
