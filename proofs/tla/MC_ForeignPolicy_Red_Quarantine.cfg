\* run-all: ForeignPolicy.tla RED
\* a change A refuses is rejected for good (INV_NeverQuarantined)
\* RED: a change A refuses is rejected for good instead of parked, so a later
\* grant on A can never let it in. Must fail INV_NeverQuarantined.
SPECIFICATION Spec
CONSTANT Bug = "quarantine"
CONSTANT Bound = 2
INVARIANT INV_NeverQuarantined
CHECK_DEADLOCK FALSE
