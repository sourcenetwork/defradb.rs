\* RED: the explicit transaction validates the position records its read used.
\* An increment owes a document, the transaction reads through the index, and a
\* drain then moves that document's record. The record decided nothing, yet the
\* transaction's commit now aborts and the conflict goes back to the client
\* (INV_TxNotAbortedByDrain).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a, b}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Validated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
  Poisoned = {}
  Carry = "Tail"
  Fixed = "Never"
INVARIANT INV_TxNotAbortedByDrain
CHECK_DEADLOCK FALSE
