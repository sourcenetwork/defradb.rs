\* RED (caller contract: one export per Statistics, ever): two exports read the
\* same statistics, as when a caller passes its own statistics in the store's
\* engine options and opens the store twice. Each export's mark starts at 0,
\* so each adds the same commit: one commit, counted twice. One read, two
\* exports, one count. Must fail INV_NeverOvercount.
SPECIFICATION Spec
CONSTANTS
  NS           = 2
  NR           = 1
  MaxCount     = 1
  Forward      = TRUE
  ClaimByCas   = TRUE
  Retry        = TRUE
  Refresh      = TRUE
  PublishFirst = TRUE
  HoldStats    = TRUE
  OnlyGrow     = TRUE
  OwnStats     = FALSE
  StopFirst    = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverOvercount
CHECK_DEADLOCK FALSE
