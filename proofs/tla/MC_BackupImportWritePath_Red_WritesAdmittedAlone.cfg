\* RED: the Node import is not admitted as one request; each create is
\* admitted on its own and the alias jobs not at all. The node closes and
\* drains between a batch's create and its registration, the database closes,
\* and the saved document never gets its alias. Must fail INV_SavedRegistered.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  HoldImport          = FALSE
  DetachedImport      = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  OneByOneOnRefusal   = TRUE
  RegisterEachOnRefusal = TRUE
  RequireNode         = TRUE
  ImportRouteOnEdge   = TRUE
INVARIANT INV_SavedRegistered
CHECK_DEADLOCK FALSE
