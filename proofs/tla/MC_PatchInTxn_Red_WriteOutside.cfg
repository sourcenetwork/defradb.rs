\* run-all: PatchInTxn.tla RED
\* the patch commits on its own (INV_IsolatedUntilCommit)
\* RED: the patch commits in a transaction of its own, as the autocommit
\* patch_collection does. Another client sees the new field while the caller's
\* transaction is still open, and a discard cannot take it back
\* (INV_IsolatedUntilCommit).
SPECIFICATION Spec
CONSTANTS
  WriteThroughTxn = FALSE
  PublishOnCommit = TRUE
  FollowUpOnCommit = TRUE
  RefreshCatalog = TRUE
  RollBackFailed = TRUE
  RestoreLensStore = TRUE
  AwaitFollowUp = TRUE
  ValidateDefinitions = TRUE
INVARIANT INV_IsolatedUntilCommit
CHECK_DEADLOCK FALSE
