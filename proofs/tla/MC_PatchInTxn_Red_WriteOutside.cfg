\* RED: the patch commits its definition writes in a transaction of its own.
\* Other clients see the patch before the caller commits, and still see it
\* after the caller discards (INV_IsolatedUntilCommit).
SPECIFICATION Spec
CONSTANTS
  ReadThroughTxn = TRUE
  WriteThroughTxn = FALSE
  FinishOnCommit = TRUE
  RetryHides = FALSE
  Savepoint = TRUE
  RefreshCatalog = TRUE
INVARIANT INV_IsolatedUntilCommit
CHECK_DEADLOCK FALSE
