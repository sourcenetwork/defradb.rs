\* run-all: FollowDeployment.tla RED
\* pruned entries taken as kept: the replay cannot pass the voided pruned request and the node stalls silently (LIVE_ResubmittedSettles)
\* RED: the node replays what its journal retains and takes the rest as
\* kept. With one entry retained, a takeover voids the pruned grant too. The
\* revocation, the one entry left, cannot be executed again before the grant
\* the chain no longer holds (the worker's requests go in sequence): the
\* node replays, waits out its deadline and tries again for ever, decides
\* nothing and never says why. Must fail LIVE_ResubmittedSettles.
SPECIFICATION Spec
CONSTANTS
  Keep         = 1
  MaxTakeovers = 1
  Gate         = TRUE
  CacheByTerm  = TRUE
  Restage      = TRUE
  Taint        = TRUE
  CheckWindow  = FALSE
  MaxCrashes   = 1
  GateDelivery = TRUE
  Mark         = TRUE
  KeepBatch    = TRUE
INVARIANT TypeOK
PROPERTY LIVE_ResubmittedSettles
