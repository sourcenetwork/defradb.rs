\* RED: the node replays what its journal retains and takes the rest as
\* kept. With one entry retained, a takeover voids the pruned grant too; the
\* node replays the revocation only, and the grant it committed is neither on
\* the chain nor owed. Must fail INV_NothingLost.
SPECIFICATION Spec
CONSTANTS
  Keep         = 1
  MaxTakeovers = 1
  Gate         = TRUE
  CacheByTerm  = TRUE
  Restage      = TRUE
  Taint        = TRUE
  CheckWindow  = FALSE
INVARIANT TypeOK
INVARIANT INV_NothingLost
