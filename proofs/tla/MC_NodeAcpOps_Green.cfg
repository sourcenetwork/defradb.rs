\* GREEN: node access control operations, one request at a time. Every check
\* runs in Go's order, re-enable checks the stored relationships, and a
\* restart leaves NAC as it was. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Enforced = {"configured", "already", "nac", "stored", "acp", "identity", "relation", "target"}
  LiveReEnable = FALSE
  StartReEnables = FALSE
  AlreadyFirst = FALSE
  SplitScope = FALSE
  OutsideGuard = FALSE
  NoRetry = FALSE
INVARIANT TypeOK INV_NoStatusWithoutPermission INV_NoDisableWithoutPermission INV_NoReEnableWithoutStoredPermission INV_NoGrantUnlessAllChecksPass INV_NoChangeUnlessConfigured INV_RestartKeepsStatus INV_NoSilentNoOp INV_GoOrder
CHECK_DEADLOCK FALSE
