\* run-all: HistoryRetention.tla RED
\* #559: the window keeps N - 1 heights (INV_WindowKept)
\* Bug planted: the cutoff is one too high. With N = 2 and c4 on top, c3 is pruned although it is inside the window: INV_WindowKept fails.
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Keep"
  FieldMode = "Keep"
  ScanMode = "Validated"
  MarkerMode = "Keep"
  WindowMode = "OffByOne"
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned
CHECK_DEADLOCK FALSE
