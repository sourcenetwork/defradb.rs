\* GREEN: the design, with two late spawns racing the shutdown and each
\* other. Their pruners may be at work together, and one may take the
\* other's freshly pushed handle out of the set. One task is in the set from
\* the start; one caller shuts down, and may be cancelled; the edge may close
\* and the runtime may be torn down at any moment. Every invariant and the
\* liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  Callers          = {"c1"}
  Tasks            = {"t1", "t2", "t3"}
  Late             = {"t2", "t3"}
  CanKill          = TRUE
  SwapFlag         = TRUE
  AtomicSpawn      = TRUE
  RunRefused       = TRUE
  DrainOwnsSender  = TRUE
  WaitForPruners   = TRUE
  PrunerChecksFlag = TRUE
  RecheckAfterPush = TRUE
  AbortAtDeadline  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoLeak
INVARIANT INV_OneDrain
INVARIANT INV_ErrMeansCancelled
PROPERTY LIVE_CallersReturn
CHECK_DEADLOCK FALSE
