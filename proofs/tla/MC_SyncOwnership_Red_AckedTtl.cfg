\* RED (the old TTL): the wall-clock TTL drops a pending root whether or not
\* it was ever fetched. The success reply already ended the sender's scope
\* marker, so once the receiver drops the acknowledged head nobody owns it and
\* ACT_AckedRootLeavesOwned fails. The model does not credit the durable resync:
\* with a pending store it re-registers the root within a minute, but with its
\* backoff reset, its running fetch cancelled and a new TTL; without one the
\* head is gone.
SPECIFICATION WSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1, d2}
  Cols           = {}
  MaxV           = 1
  Cap            = 2
  FetchCap       = 1
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MaxAttempts    = 3
  AttemptMode    = "PerAttempt"
  RearmMode      = "AttemptEnd"
  ExpiryMode     = "WallClockTtl"
  Dead           = {}
  Trickle        = {}
  CutoffMode     = "Quantum"
  SharedPeer     = {}
  PeerPermits    = 1
  MaxPulls       = 0
  PermitMode     = "WithSlot"
  DispatchPath   = "OwnLane"
  HandlerSend    = "TryThenClock"
  LaneTurns      = "Bounded"
  Storm          = FALSE
  FifoCap        = 1
INVARIANT INV_DispatchTypeOK
PROPERTY ACT_AckedRootLeavesOwned
