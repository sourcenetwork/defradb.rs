\* RED: every document write registers its own unkeyed rebuild, as the
\* projector hook did before. A transaction writing two documents rebuilds the
\* snapshot twice, and one writing no NAC tuple still rebuilds it
\* (INV_AtMostOneRebuild).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2, d3}
  NacDocs = {d1, d2}
  Bug = "PerDoc"
INVARIANT TypeOK
INVARIANT INV_AtMostOneRebuild
CHECK_DEADLOCK FALSE
