\* INV_BackoffHeld
\* Plants the bug: the wait wakes the drainer whenever it is woken. Each failed
\* pass writes a record, which wakes the wait, which ends the back-off: the
\* tries run out within the deadline and INV_BackoffHeld fails.
SPECIFICATION Spec
CONSTANTS
  Bug = "wakeDrainer"
  Patience = 3
  Notifications = TRUE
  MaxTries = 5
INVARIANT INV_BackoffHeld
CHECK_DEADLOCK FALSE
