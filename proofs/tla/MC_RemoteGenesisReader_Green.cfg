\* run-all: RemoteGenesisReader.tla GREEN
\* on a shared remote provider the reader a genesis names is owed by its creator with the registration, and a node merges only once its provider holds both
\* GREEN: every guard in place. Whatever the order of settlement, light client
\* catch-up, replication, a crash and a revocation, no safety invariant fails.
SPECIFICATION Spec
CONSTANT Bug = "none"
INVARIANT INV_OnlyGranted
INVARIANT INV_SettledFirst
INVARIANT INV_RevokedStops
INVARIANT INV_RegisteredFirst
INVARIANT INV_ValidBatchCommits
INVARIANT INV_OrdinaryAdmitted
INVARIANT INV_CountBalanced
CHECK_DEADLOCK FALSE
