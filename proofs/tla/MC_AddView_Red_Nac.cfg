\* run-all: AddView.tla RED
\* The nac check is left out of the core: a caller without add-view permission still gets its views (INV_NoViewUnlessAllChecksPass)
\* RED: the core skips the nac check, and both ways in forward to it, so
\* a caller without add-view permission is not refused and its views are created.
SPECIFICATION Spec
CONSTANTS
  Views = {"a", "b"}
  CoreChecks = {"sdl", "one", "cid", "chunk", "downsample", "policy", "identity"}
  ServerChecks = {"sdl", "one", "cid", "chunk", "downsample", "policy", "identity"}
  BuildFirst = FALSE
INVARIANT INV_NoViewUnlessAllChecksPass
CHECK_DEADLOCK FALSE
