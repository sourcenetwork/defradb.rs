\* RED: no admission check once a dial connects. r is revoked while our dial
\* to it is connecting, the dial keeps the connection, and gossip opens a
\* path on it. Expect INV_RevokedHasNoGossip to be violated.
SPECIFICATION Spec
CONSTANTS
  Peers <- mcPeers
  Revocable <- mcRevocable
  Healthy = "h"
  Legacy = {}
  MaxDrops = 1
  MaxForgets = 1
  ForgetBound = "Bounded"
  PathMode = "SharedMux"
  RecheckMode = "None"
  ForgetMode = "DropSender"
  LegacyMode = "Answer"
INVARIANT INV_TypeOK
INVARIANT INV_RevokedHasNoGossip
