\* RED: a parked change nobody checked holds its tuple. The provider is
\* down, an actor without authority stages an add signed with a delegation,
\* the delegation expires and the add waits for authority. The owner's later
\* delete of the same tuple is then kept from the provider behind it. Must
\* fail INV_UncheckedYields.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"node", "deleg"}
  Preexisting              = TRUE
  InitTuples               = {"g"}
  MaxCrashes               = 1
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "hold"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = FALSE
  Note                     = TRUE
  Floor                    = TRUE
  Captured                 = TRUE
  Remote                   = FALSE
  ActorFromCredential      = TRUE
  RemoteCheck              = TRUE
  RemoteAuthority          = TRUE
  HeldKeys                 = {}
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT INV_UncheckedYields
CHECK_DEADLOCK FALSE
