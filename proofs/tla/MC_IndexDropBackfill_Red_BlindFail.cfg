\* RED: the drop clears the backfill record, but the backfill, finding its
\* index gone at its next page, writes "errored" without looking, as it did
\* behind the FFI drop. The record comes back for a dropped index
\* (INV_NoRecordForGoneIndex).
SPECIFICATION Spec
CONSTANTS
  Docs = {1, 2}
  RecordMode = "Clear"
  FailMode = "Blind"
  EntryMode = "AfterDefinition"
  ResumeMode = "Resume"
  IdMode = "Retire"
INVARIANT INV_NoRecordForGoneIndex
CHECK_DEADLOCK FALSE
