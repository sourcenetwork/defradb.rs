\* run-all: RetryRecorderLanes.tla RED
\* RED: a lane runs every record it takes as a transaction of its own, all at
\* once, instead of one transaction per peer. p1's two records are then in
\* flight together and can commit out of order (INV_OnePeerAtATime).
SPECIFICATION Spec
CONSTANT LaneByPeer = TRUE
CONSTANT OneTxnPerPeer = FALSE
CONSTANT AnswerAfterCommit = TRUE
CONSTANT SinglesOnFail = TRUE
INVARIANT TypeOK
INVARIANT INV_OnePeerAtATime
INVARIANT INV_PeerOrder
INVARIANT INV_AnsweredOnlyWhenDurable
INVARIANT INV_FailureCostsOnlyItsRecord
CHECK_DEADLOCK FALSE
