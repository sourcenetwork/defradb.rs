\* RED: the node executes every copy it admits. A send that was admitted but
\* unheard is sent again, and the request takes effect twice. Must fail
\* INV_AtMostOneEffect.
SPECIFICATION Spec
CONSTANTS
  Resends          = TRUE
  KeepsTrying      = TRUE
  RetainsOnTimeout = TRUE
  NodeDedupes      = FALSE
INVARIANT INV_AtMostOneEffect
CHECK_DEADLOCK FALSE
