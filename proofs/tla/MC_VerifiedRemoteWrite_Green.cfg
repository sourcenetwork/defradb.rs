\* a verified write on a remote provider needs authority for its signer, an update or delete is admitted on the signer's verified permission and owes nothing, a request-bound delegation covers its own command only, and a failed submission is reported and takes a fresh credential by the same rule
\* GREEN: every check is in place. A verified write on a remote provider is
\* staged only with authority for its signer, a refusal records nothing, a
\* request-bound delegation is used for its own command only and never as a
\* login, nothing is sent after expiry, and the registration goes first. A
\* submission that fails after the commit is reported, a parked command is
\* owed again only on a fresh credential the same rule admits, and nothing is
\* sent with authority that was not recorded for it. An update or a delete is
\* admitted only on a verified permission, never with a request-bound
\* delegation, and owes the provider nothing.
