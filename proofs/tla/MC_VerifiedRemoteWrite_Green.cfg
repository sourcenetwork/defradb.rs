\* GREEN: every check is in place. A verified write on a remote provider is
\* staged only with authority for its signer, a refusal records nothing, a
\* request-bound delegation is used for its own command only and never as a
\* login, nothing is sent after expiry, and the registration goes first. A
\* submission that fails after the commit is reported, a parked command is
\* owed again only on a fresh credential the same rule admits, and nothing is
\* sent with authority that was not recorded for it.
SPECIFICATION Spec
CONSTANT Bug = "none"
INVARIANT TypeOK
INVARIANT INV_RefusalRecordsNothing
INVARIANT INV_RequestOnlyItsRequest
INVARIANT INV_RequestIsNoLogin
INVARIANT INV_NothingSentStale
INVARIANT INV_RegistrationFirst
INVARIANT INV_SentUnderRecordedAuthority
INVARIANT INV_FailureReported
PROPERTY INV_AuthorityAtAdmission
PROPERTY INV_GrantAuthority
PROPERTY INV_ReauthorizedWithAuthority
CHECK_DEADLOCK FALSE
