\* run-all: VectorMemoryBudget.tla RED
\* a reload taken over keeps taking codes instead of stopping
\* RED: a reload that a newer generation took over keeps scanning and taking codes after it lost its claim, so INV_NoTakeAfterLoss fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Searches = {s1, s2}
          Limit = 3
          Codes = 3
          MaxGen = 2
          AtomicTake = TRUE
          ReleaseOnDrop = TRUE
          DropOldFirst = TRUE
          NoMissesWhileLoading = TRUE
          SingleFlight = TRUE
          OwnedFinish = TRUE
          OwnedStep = FALSE
          OwnedAbandon = TRUE
          NoPendingWhileLoading = TRUE
INVARIANT INV_NoTakeAfterLoss
SYMMETRY Symmetry
