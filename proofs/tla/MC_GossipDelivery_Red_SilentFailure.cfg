\* RED: a stream that fails drops its queue without a word. The frames
\* waiting on it are gone and nothing reports them. Expect INV_NoSilentLoss
\* to be violated.
SPECIFICATION Spec
CONSTANTS
  FrameLimit = 13
  TopicLen = 3
  Overhead = 2
  Size <- MCSize
  Control <- MCControl
  LimitMatched = TRUE
  Fallback = TRUE
  SkipOversize = TRUE
  ReportLoss = FALSE
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
INVARIANT INV_NoSilentLoss
INVARIANT INV_BroadcastFits
