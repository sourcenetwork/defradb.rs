\* GREEN: the code. Schema changes and merges off the active version across
\* the lens owe a fresh record, no index answers while one stands, and a
\* rebuild clears only the record it started from, and a query's index
\* scan reads the owed record again and scans the collection when one stands.
\* Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Gate = "owed"
  OweOnSchemaChange = TRUE
  OweOnMerge = TRUE
  SkipIfOwed = FALSE
  ClearChecksToken = TRUE
  ScanRechecksOwed = TRUE
  MaxSteps = 6
INVARIANT TypeOK INV_IndexMatchesReads INV_SettledIndexAnswers INV_ScanMatchesReads
CHECK_DEADLOCK FALSE
