\* GREEN: both guards in place. Three calls take tickets on one transaction
\* in any order of arrival; any of them may drop its ticket before its turn.
\* Calls run one at a time, never overtaking an earlier ticket, and every
\* waiting call stops waiting.
SPECIFICATION Spec
CONSTANTS
  Calls      = {c1, c2, c3}
  Recheck    = TRUE
  SkipOnTurn = TRUE
INVARIANT TypeOK
INVARIANT INV_OneRunning
INVARIANT INV_NoOvertake
PROPERTY Progress
CHECK_DEADLOCK FALSE
