\* RED: a head older than the light client's freshness limit is not queued
\* (head.rs recent). The first block finalized before the subscription, so
\* nothing starts the stream, and the drained light client waits for the next
\* block. Must fail INV_Current.
SPECIFICATION Spec
CONSTANTS
  MaxHeight      = 3
  HeadFirst      = TRUE
  FreshHead      = FALSE
  SubscribeFirst = TRUE
  Verify         = TRUE
INVARIANT TypeOK
INVARIANT INV_Current
