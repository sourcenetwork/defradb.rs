\* the HTTP route stages a change signed in with an identity token for a DID whose key the node does not hold: it is owed and can never be sent (INV_SendableAuthority)
\* RED: the HTTP route stages a client's change without an authority the
\* node can send it with. The creator signs in with an identity token, and
\* the node holds no key for it; its grant passes the check and is staged
\* as if under a delegation the client never presented. After the commit
\* the change is owed, and the node can never send it: it has neither the
\* creator's key nor a delegation from it. Must fail INV_SendableAuthority.
