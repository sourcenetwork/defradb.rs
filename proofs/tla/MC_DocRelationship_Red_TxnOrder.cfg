\* run-all: DocRelationship.tla RED
\* The transaction route asks for the arguments and owner relation before the collection: a refusal names another check than Go's (INV_GoOrder)
\* RED: a change inside a transaction uses the swapped order while the same
\* change outside one uses Go's order. On a collection without a policy and a
\* request with no owner argument, the transaction route names the wrong first
\* failure.
SPECIFICATION Spec
CONSTANTS
  Skipped = {}
  Swapped = FALSE
  ServerCopy = FALSE
  EventFirst = FALSE
  TxnSwapped = TRUE
INVARIANT INV_GoOrder
CHECK_DEADLOCK FALSE
