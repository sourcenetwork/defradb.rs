\* Plants F8: a dispatch takes its slot before its permits. A pull fetch from
\* c holds c's one permit and never ends. t is due first, takes the one slot
\* and waits there for c's permit for ever, so x never gets a slot.
\* LIVE_HeadDelivered fails.
SPECIFICATION Spec
CONSTANTS
  Nodes <- rNodes
  Repl <- rRepl
  Heads <- rHeads
  Author <- rAuthor
  Parent <- rParent
  Prio <- rPrio
  KeyOrder <- rKeyOrder
  Base <- rBase
  Fresh <- rFresh
  Backlogs <- rBacklogs
  Trickle <- rTrickle
  Dead <- rDead
  PullPeer <- rPullPeer
  PullAt <- rPullAt
  Storm <- rStorm
  Crashable <- rCrashable
  ConnectedAtStart <- rConnectedAtStart
  K = 1
  Permits = 2
  PeerPermits = 1
  MemCap = 2
  PeerQuota = 1
  DurCap = 3
  MaxCrash = 0
  MaxRegFail = 0
  MaxDisc = 0
  MaxCont = 2
  CoverRule = "Ancestry"
  MarkerMode = "Durable"
  ForwardMode = "WithMerge"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Kept"
  FanoutMode = "PerPeer"
  SlotBeforePermit = TRUE
  DispatchPath = "Direct"
  ConnMode = "Served"
INVARIANT INV_TypeOK
INVARIANT INV_Bounded
INVARIANT INV_ObligationOwned
INVARIANT INV_ReverseBorrowServed
PROPERTY LIVE_HeadDelivered
CHECK_DEADLOCK FALSE
