\* run-all: AddCollection.tla GREEN
\* #2319: add_collection checks nac, parse, validate, policy in order, then creates all collections or none
\* GREEN: add_collection. All four checks run in order and the create is one
\* transaction. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Colls = {"a", "b"}
  Enforced = {"nac", "parse", "validate", "policy"}
  CreateMode = "Atomic"
INVARIANT TypeOK
INVARIANT INV_NoCollectionUnlessAllChecksPass
INVARIANT INV_AllOrNone
CHECK_DEADLOCK FALSE
