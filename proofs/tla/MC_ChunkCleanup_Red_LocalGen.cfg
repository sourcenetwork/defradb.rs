\* run-all: ChunkCleanup.tla RED
\* a chunk's ID comes from what this peer deleted (INV_SettledSameIds)
\* RED: the bug plants the ID rule the code had before sourceCID: a new chunk
\* takes the first generation this peer has not deleted. A peer that got the
\* writer's chunk before the article deletes it at the first edit it merges
\* and makes it again under the next generation, while the writer keeps the
\* first, so peers with every edit hold different chunk documents
\* (INV_SettledSameIds).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CleanWrites = TRUE
  CleanMerges = TRUE
  DropStale = TRUE
  DeleteGuard = TRUE
  Ids = "generation"
  Reanchor = TRUE
  KeepWaiting = TRUE
INVARIANT INV_SettledSameIds
CHECK_DEADLOCK FALSE
