\* RED: the provider checks a term and publishes nothing. The embedder never
\* learns what the takeover voided. Must fail INV_Published.
SPECIFICATION Spec
CONSTANTS
    Submissions = {1, 2}
    MaxTerm = 2
    MaxFaults = 1
    Publish = FALSE
    AfterAll = TRUE
    Once = TRUE
    KeepOwed = TRUE
    CutOfTerm = TRUE
    NameUnrestorable = TRUE
    NameClosed = TRUE
    Recorded = TRUE
INVARIANT
    TypeOK
    INV_Published
