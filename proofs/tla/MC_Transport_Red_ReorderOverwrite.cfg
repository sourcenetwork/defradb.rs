\* A timed-out attempt leaves its copies on the wire, so a retry of a newer head
\* can overtake it.  A receiver that registers whatever arrived last rolls its
\* durable registration backwards.  Expect: INV_RegisteredMonotone VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxHead <- mcMaxHead
  MaxLoss <- mcMaxLoss
  LinkMode     = "Reorder"
  DupMode      = "Dedup"
  ReplyMode    = "NewStream"
  RouteMode    = "Routable"
  TimeoutMode  = "Ambiguous"
  RegisterMode = "LastArrived"
INVARIANT INV_TypeOK
INVARIANT INV_RegisteredMonotone
