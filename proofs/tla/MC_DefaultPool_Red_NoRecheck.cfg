\* RED (h): the turn holder does not look at the cell again (once_cell.rs:145-147
\* removed). c2 waits for the turn while c1 starts s1 and publishes it; the
\* publish opens the turn to everyone, and c2 goes in without looking and starts
\* s2, which loses the publish and is dropped. Two callers and no registrable
\* pool. Must fail INV_OneStart.
SPECIFICATION Spec
CONSTANTS
  NP                 = 0
  NC                 = 2
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = FALSE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_OneStart
CHECK_DEADLOCK FALSE
