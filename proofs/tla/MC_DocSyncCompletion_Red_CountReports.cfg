\* run-all: DocSyncCompletion.tla RED
\* RED: the code before the fix, with one peer. The sync counts reports against peers x documents; one document's merge reported twice counts as two documents, so the sync says it is complete while the other document it asked for never merged (INV_CompleteMeansEveryDocMerged).
SPECIFICATION Spec
CONSTANTS
  Docs         = {d1, d2, d3}
  Peers        = {p1}
  MaxReports   = 4
  CountReports = TRUE
  FilterAsked  = TRUE
  HeldDocs     = {}
  ReportHeld   = TRUE
INVARIANT TypeOK
INVARIANT INV_CompleteMeansEveryDocMerged
INVARIANT INV_DoneOnceEveryDocReported
CHECK_DEADLOCK FALSE
