\* GREEN: every guard on. Only registered tags reach a handler, no peer holds more
\* than its share, room is held only for a request still kept, a revoked peer is cut, shutdown
\* leaves no stream running, and every handler ends.
\* CHECK_DEADLOCK FALSE: a finished run has nothing left to do.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  Registered <- mcRegistered
  Stuck <- mcStuck
  Share = 1
  TagMode = "Check"
  LeaseMode = "WithRequest"
  DeadlineMode = "Deadline"
  RevokeMode = "Close"
  ShutdownMode = "Abort"
INVARIANT INV_TypeOK
INVARIANT INV_OnlyRegisteredServed
INVARIANT INV_ShareBound
INVARIANT INV_RoomIsTheRequest
INVARIANT INV_RevokedIsCut
INVARIANT INV_ShutdownLeavesNone
PROPERTY LIVE_HandlerEnds
