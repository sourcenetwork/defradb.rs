\* run-all: FollowDeployment.tla GREEN
\* takeovers void any part of the chain: no void decision, a revocation always denies, nothing lost, owed again settles
\* GREEN: the node grants, then revokes; up to two takeovers void any part of
\* the chain; the journal retains both confirmations. Nothing is decided or
\* sent while a term is unchecked, the cache key carries the checked term, a
\* refused replay and everything after it on the object is owed again. No
\* decision comes from a void revision, a revocation always denies, nothing
\* committed is lost, and what is owed again settles.
SPECIFICATION Spec
CONSTANTS
  Keep         = 2
  MaxTakeovers = 2
  Gate         = TRUE
  CacheByTerm  = TRUE
  Restage      = TRUE
  Taint        = TRUE
  CheckWindow  = TRUE
  MaxCrashes   = 1
  GateDelivery = TRUE
  Mark         = TRUE
  KeepBatch    = TRUE
INVARIANT TypeOK
INVARIANT INV_NoVoidDecision
INVARIANT INV_RevocationDenies
INVARIANT INV_NothingLost
PROPERTY LIVE_ResubmittedSettles
