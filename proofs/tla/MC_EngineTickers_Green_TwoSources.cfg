\* GREEN: the real code, with two exports that each count once and one read
\* that walks the map while both close. The read can find one export and miss
\* the other, publish an export after its close began, and the two totals'
\* shares interleave. Every promise of the one-export run must hold across the
\* map. One count per engine is enough here: the races inside one export are
\* the one-export GREEN's job.
SPECIFICATION Spec
CONSTANTS
  NS           = 2
  NR           = 1
  MaxCount     = 1
  Forward      = TRUE
  ClaimByCas   = TRUE
  Retry        = TRUE
  Refresh      = TRUE
  PublishFirst = TRUE
  HoldStats    = TRUE
  OnlyGrow     = TRUE
  OwnStats     = TRUE
  StopFirst    = TRUE
INVARIANT TypeOK
INVARIANT INV_Accounted
INVARIANT INV_NeverOvercount
INVARIANT INV_ClosedComplete
INVARIANT INV_LeftClaimed
INVARIANT INV_QuiescentExact
PROPERTY PROP_TotalNeverBack
PROPERTY PROP_MarkNeverBack
PROPERTY LIVE_EveryCallEnds
CHECK_DEADLOCK FALSE
