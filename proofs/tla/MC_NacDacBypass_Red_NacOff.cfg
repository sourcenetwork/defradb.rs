\* run-all: NacDacBypass.tla RED
\* a bare permission check: NAC off reads as granted and opens DAC (INV_BypassOnlyWhenGranted)
\* RED: the bypass is a bare permission check, which reads every permission
\* as held while NAC is off. A read with NAC off bypasses DAC
\* (INV_BypassOnlyWhenGranted).
SPECIFICATION Spec
CONSTANTS
  Bug = "NacOff"
INVARIANT TypeOK
INVARIANT INV_BypassOnlyWhenGranted
CHECK_DEADLOCK FALSE
