\* FINDING, no planted bug: the real code, checked against the promise the
\* close's comment makes (engine_tickers.rs:131-132), that a read which no
\* longer finds an export finds its counts in the totals. A read claims the
\* export's commit (its swap 0 -> 1 wins) and pauses before its add. The
\* close reads 1, sees the mark at 1, has nothing to claim, and leaves the
\* map. A read that starts now misses the export and loads a total without
\* that commit, until the paused read adds it. The total never goes back and
\* the commit arrives once (the GREEN runs hold); it arrives late. One read,
\* one export, one count. Fails INV_LeftInTotals while the code keeps the
\* claim and the add as two steps.
SPECIFICATION Spec
CONSTANTS
  NS           = 1
  NR           = 1
  MaxCount     = 1
  Forward      = TRUE
  ClaimByCas   = TRUE
  Retry        = TRUE
  Refresh      = TRUE
  PublishFirst = TRUE
  HoldStats    = TRUE
  OnlyGrow     = TRUE
  OwnStats     = TRUE
  StopFirst    = TRUE
INVARIANT TypeOK
INVARIANT INV_LeftInTotals
CHECK_DEADLOCK FALSE
