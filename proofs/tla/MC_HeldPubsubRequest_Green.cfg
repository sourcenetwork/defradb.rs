\* GREEN: the request is held, resent on every join, armed before publishing, deduplicated,
\* and never resent once its deadline has passed, which can come at any moment.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  HoldOnRefusal = TRUE
  ResendOnJoin = TRUE
  WatchBeforePublish = TRUE
  DedupeReplies = TRUE
  StopAtDeadline = TRUE
INVARIANT TypeOK
INVARIANT Delivered
INVARIANT OneReplyEach
INVARIANT RefusedOnlyUnsent
INVARIANT NoResendAfterDeadline
