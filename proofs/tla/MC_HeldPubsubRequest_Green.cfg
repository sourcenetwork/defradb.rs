\* GREEN: the request is held, resent on every join, armed before publishing, and deduplicated.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  HoldOnRefusal = TRUE
  ResendOnJoin = TRUE
  WatchBeforePublish = TRUE
  DedupeReplies = TRUE
INVARIANT TypeOK
INVARIANT Delivered
INVARIANT OneReplyEach
INVARIANT RefusedOnlyUnsent
