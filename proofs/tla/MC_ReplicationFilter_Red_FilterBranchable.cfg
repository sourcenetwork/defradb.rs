\* Bug planted: a branchable collection is filtered document by document.
\* r is skipped though its collection head commits it with the others: INV_BranchableUnfiltered fails.
SPECIFICATION Spec
CONSTANTS
  Branchable = TRUE
  AskMode = "BeforePersist"
  BatchMode = "PerEvent"
  FinalMode = "Terminal"
  ScopeMode = "All"
INVARIANTS INV_RefusedNothingStored INV_KeptMerged INV_MergedOnce INV_BranchableUnfiltered
CHECK_DEADLOCK FALSE
