\* run-all: ChunkFollow.tla RED
\* chunks pushed unfiltered leak (INV_NoForeignChunks)
\* RED: the bug plants every chunk pushed with no filter at all. The peer
\* gets the chunks of the article the filter keeps out (INV_NoForeignChunks).
SPECIFICATION Spec
CONSTANTS
  Articles = {pub, priv}
  Matching = {pub}
  ChunkRule = "all"
  SyncRule = "current"
  DeletesFollow = TRUE
  Reconcile = TRUE
  Cascade = TRUE
INVARIANT INV_NoForeignChunks
CHECK_DEADLOCK FALSE
