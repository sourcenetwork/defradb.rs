\* RED: the driver writes with a mutator of its own, as main did. A signing
\* node imports a document and leaves its blocks unsigned. Must fail
\* INV_ImportSigned.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = TRUE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  HoldImport          = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  OneByOneOnRefusal   = TRUE
  RegisterEachOnRefusal = TRUE
  RequireNode         = TRUE
INVARIANT INV_ImportSigned
CHECK_DEADLOCK FALSE
