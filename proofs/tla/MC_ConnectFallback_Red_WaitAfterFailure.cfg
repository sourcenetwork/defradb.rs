\* RED: when the preferred family fails within the delay, the connect waits
\* the delay out before it starts the fallback, with nothing under way. Must
\* fail INV_NeverIdle.
SPECIFICATION Spec
CONSTANTS
  D              = 2
  CT             = 3
  MaxTime        = 3
  HasFallback    = TRUE
  MayHang        = TRUE
  Limited        = TRUE
  DelayFallback  = TRUE
  StartOnFailure = FALSE
  AwaitOther     = TRUE
  KeepLastError  = TRUE
  DropLosers     = TRUE
  TimeoutAll     = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverIdle
CHECK_DEADLOCK FALSE
