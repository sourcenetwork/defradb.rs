\* run-all: ChildPagePerParent.tla RED
\* the per-parent scan reads past a full page (INV_PageWithinLimit)
\* RED: the per-parent scan loses its early stop and keeps reading after the
\* page is full, so a parent that asked for one child ends up with two and
\* INV_PageWithinLimit fails.
SPECIFICATION Spec
CONSTANTS
  Mode        = "PerParent"
  StopAtLimit = FALSE
  Limit       = 1
  Parents     = {"a", "b"}
  ChildrenOfA = {1, 2}
  ChildrenOfB = {3, 4}
INVARIANT TypeOK
INVARIANT INV_PageWithinLimit
CHECK_DEADLOCK FALSE
