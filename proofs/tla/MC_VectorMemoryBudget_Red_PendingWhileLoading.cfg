\* run-all: VectorMemoryBudget.tla RED
\* a pending-list copy takes the room a running reload needs
\* RED: publishing a pending-list copy while a reload runs takes one code of its room, so the reload finishes short and INV_FullLoad fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Searches = {s1, s2}
          Limit = 2
          Codes = 3
          MaxGen = 2
          AtomicTake = TRUE
          ReleaseOnDrop = TRUE
          DropOldFirst = TRUE
          NoMissesWhileLoading = TRUE
          SingleFlight = TRUE
          OwnedFinish = TRUE
          OwnedStep = TRUE
          OwnedAbandon = TRUE
          NoPendingWhileLoading = FALSE
INVARIANT INV_FullLoad
SYMMETRY Symmetry
