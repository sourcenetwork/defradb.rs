\* run-all: FollowDeploymentRecovery.tla GREEN
\* an uncovered takeover is rebuilt from the node's own ledger in pages, across a crash and a second takeover: nothing lost is left unowed when the node decides, a revocation denies, the pass ends
\* GREEN: two takeovers the journal cannot cover, a ledger of three records read
\* two at a time, and one crash. Every page is handed to the outbox before its
\* cursor is written, the pass ends at the ledger's end, a second takeover
\* starts it again, and the node decides only after it. Every property holds.
SPECIFICATION Spec
CONSTANTS
  Records       = 3
  Revoked       = {2, 3}
  PageSize      = 2
  MaxTakeovers  = 2
  MaxCrashes    = 1
  Gate          = TRUE
  HandOver      = TRUE
  OweFirst      = TRUE
  EndFromLedger = TRUE
  SaysDone      = TRUE
  TermFence     = TRUE
  SharedFence   = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingLost
INVARIANT INV_TheirsNotLost
INVARIANT INV_RevocationDenies
PROPERTY LIVE_RecoveryEnds
