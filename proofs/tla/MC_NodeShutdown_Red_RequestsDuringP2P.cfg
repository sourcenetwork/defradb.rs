\* RED: requests share the node's scope and stop only at its drain, after P2P,
\* as Node::shutdown did before the request scope. A request admitted before
\* shutdown, or while P2P shuts down, commits after P2P began going down, and
\* its head marker is never registered: the replicator never gets that head.
\* Must fail INV_AdmittedWritesMarked.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
  RequestsFirst   = FALSE
  CommitsAdmitted = TRUE
INVARIANT INV_AdmittedWritesMarked
CHECK_DEADLOCK FALSE
