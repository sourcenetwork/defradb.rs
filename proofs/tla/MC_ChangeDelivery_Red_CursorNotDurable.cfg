\* RED: the cursor is not saved with what the subscriber observed; after a
\* crash it reads from the start and observes updates again (INV_ExactlyOnce).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Updates = {u1, u2}
  Merged = {u2}
  Cap = 1
  MaxCrashes = 1
  Channel = "coalescing"
  Mode = "cursor_not_durable"
INVARIANT TypeOK
INVARIANT INV_ExactlyOnce
