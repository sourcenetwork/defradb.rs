\* run-all: DacPolicyAdd.tla RED
\* remote policy not kept locally, as the node's Vera path did (INV_ReturnedIsKeptLocally)
\* RED: the remote ACP's policy is not kept locally, as the node's Vera path
\* did before. The caller gets an ID the node's store does not hold, so a
\* collection that names it cannot be checked (INV_ReturnedIsKeptLocally).
SPECIFICATION Spec
CONSTANTS
  Enforced = {"nac", "acp", "creator", "data", "valid", "seed"}
  CreatorFirst = FALSE
INVARIANT INV_ReturnedIsKeptLocally
CHECK_DEADLOCK FALSE
