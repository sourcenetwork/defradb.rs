\* run-all: AddView.tla RED
\* The chunk check is left out of the core: a view with a chunk field still gets its views (INV_NoViewUnlessAllChecksPass)
\* RED: the core skips the chunk check, and both ways in forward to it, so
\* a view with a chunk field is not refused and its views are created.
SPECIFICATION Spec
CONSTANTS
  Views = {"a", "b"}
  CoreChecks = {"nac", "sdl", "one", "cid", "downsample", "policy", "identity"}
  ServerChecks = {"nac", "sdl", "one", "cid", "downsample", "policy", "identity"}
  BuildFirst = FALSE
INVARIANT INV_NoViewUnlessAllChecksPass
CHECK_DEADLOCK FALSE
