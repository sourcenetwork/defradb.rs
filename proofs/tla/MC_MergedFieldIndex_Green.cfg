\* GREEN: local writes and merges in any order, up to four steps, with
\* composites of one or two blocks. Each composite reads the document before
\* its field merges write, and each field write puts its value in the kept
\* read, so the next block and the index update see what is stored.
SPECIFICATION Spec
CONSTANTS
  ReadMode = "Before"
  CacheMode = "Update"
  MaxSteps = 4
INVARIANT INV_TypeOK INV_IndexMatchesValue INV_NoLostEdit
CHECK_DEADLOCK FALSE
