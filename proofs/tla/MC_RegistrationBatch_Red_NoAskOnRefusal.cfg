\* run-all: RegistrationBatch.tla RED
\* a refusal reported unasked: one another settler registered meanwhile is reported failed (INV_HeldNotFailed)
\* RED: a refusal is reported without asking the provider again. Another
\* settler registered a document after this one asked and before its list
\* landed; the provider refuses it as held, and it is reported as failed
\* although it is registered to its creator. Must fail INV_HeldNotFailed.
SPECIFICATION Spec
CONSTANTS
  Obj          = {1, 2, 3}
  ByB          = {3}
  Bad          = {}
  Elsewhere    = {}
  MaxLoss      = 0
  MaxOther     = 1
  Recheck      = TRUE
  AskOnRefusal = FALSE
  Fallback     = TRUE
  PerCreator   = TRUE
  InOrder      = TRUE
INVARIANT TypeOK
INVARIANT INV_HeldNotFailed
