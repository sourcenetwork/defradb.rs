\* run-all: ChangeDelivery.tla RED
\* no once key: a re-merged block gets a second row (INV_ExactlyOnce)
\* RED: without the once key a block merged again appends a second row, and
\* the reader observes the update twice (INV_ExactlyOnce).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Updates = {u1, u2}
  Merged = {u2}
  Cap = 1
  MaxCrashes = 1
  Hideable = {}
  Channel = "coalescing"
  Mode = "remerge_appends"
INVARIANT TypeOK
INVARIANT INV_ExactlyOnce
