\* the restore overwrites a newer connection (FreshKept)
\* The restore uses a plain insert instead of insert_if_absent. When a newer
\* connection has already taken the slot, the open old sibling is written over
\* it, and FreshKept fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANT Mode = "plainInsert"
INVARIANTS TypeOK
PROPERTIES FreshKept
