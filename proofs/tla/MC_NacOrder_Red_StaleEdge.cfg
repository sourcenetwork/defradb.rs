\* RED: a revoke returns before the edge's snapshot of the grants is swapped,
\* as it would if the snapshot were rebuilt in the background. A caller who
\* starts after the revoke returned is still let through by the edge on the
\* grants it just lost (INV_EdgeSeesReturnedRevoke). Its write is still
\* refused inside the transaction, so INV_NoEffectWithoutPermission holds.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  anon = anon
  node = node
  Bug = "StaleEdge"
INVARIANT TypeOK
INVARIANT INV_NoEffectWithoutPermission
INVARIANT INV_EdgeSeesReturnedRevoke
CHECK_DEADLOCK FALSE
