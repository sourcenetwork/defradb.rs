\* run-all: OwnerTransfer.tla RED
\* the transfer goes while the creator's earlier grant waits for authority, and the grant is then refused (INV_EarlierUnderOwner)
\* RED: no object order. The creator's grant from the create waits for a
\* fresh credential while the transfer, a change of another tuple, goes
\* ahead and lands. When the grant is sent at last the deployment no longer
\* takes it from the creator, who owns nothing now: the grant the creator
\* made as owner is refused. Must fail INV_EarlierUnderOwner.
SPECIFICATION Spec
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = FALSE
  CommitConflict = TRUE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {}
  MaxFails       = 2
  MaxCrashes     = 1
  MaxLapses      = 1
  MaxAborts      = 1
  OwnTransfer    = TRUE
INVARIANT INV_EarlierUnderOwner
CHECK_DEADLOCK FALSE
