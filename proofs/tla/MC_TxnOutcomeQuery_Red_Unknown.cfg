\* the query always says unknown: a live final answer is never reported (LIVE_QuestionAnswered)
SPECIFICATION Spec
CONSTANTS
    Idle = 2
    QueryWorks = FALSE
    CheckToken = TRUE
    CheckOwner = TRUE
    BrokenStart = FALSE
    LeaksOwner = FALSE
    ConsumesOnRead = FALSE
    PollsOnce = FALSE
    EvictsLive = FALSE
    Cap = 2

INVARIANT
    INV_Agreement
    INV_Foreign
    INV_StartToken
    INV_FinalAnswer
    INV_Bounded
    INV_OwnerSettled

PROPERTY
    LIVE_QuestionAnswered
CHECK_DEADLOCK FALSE
