\* run-all: FilteredChunkPush.tla RED
\* a chunk retry sends the chunk when its article has no head (INV_ChunkOnlyWithItsArticle)
\* RED: the bug plants a chunk retry that goes on when its article has no head
\* it can read, and records the article as delivered with no head. The
\* receiver holds the chunk and not its article (INV_ChunkOnlyWithItsArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  NewMatches = {a1}
  Unreadable = {a1}
  StaleMarkers = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = FALSE
  ReplayNeedsArticle = TRUE
  ReplayDefersChunk = TRUE
  ReplayChunksOnRefilter = TRUE
INVARIANT INV_ChunkOnlyWithItsArticle
CHECK_DEADLOCK FALSE
