\* GREEN: the code. B and C connect to M in either order, before or after
\* pinc settles them: M hands each new peer the other with its address, so
\* they meet, and each peer asks for its record until pinc settles it, so M
\* gets both records.
SPECIFICATION Spec
CONSTANTS
  RecordOnly = FALSE
  NoRetry    = FALSE
INVARIANT TypeOK
PROPERTY LIVE_PeersMeet
PROPERTY LIVE_RecordsKept
CHECK_DEADLOCK FALSE
