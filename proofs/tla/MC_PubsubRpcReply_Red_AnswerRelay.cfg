\* RED: the bug of #2773. A peer answers the neighbour that handed it the
\* request, gossipsub's propagation_source, instead of the request's
\* publisher. When a relay's copy arrives first, the answer goes to the
\* relay's reply topic, the relay drops it, and the asker waits out its
\* deadline without that peer's heads. Must fail INV_NoAnswerLost.
SPECIFICATION Spec
CONSTANTS
  Asker           = a
  Peers           = {p1, p2, p3}
  AnswerPublisher = FALSE
INVARIANT TypeOK
INVARIANT INV_NoAnswerLost
CHECK_DEADLOCK FALSE
