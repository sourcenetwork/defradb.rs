\* run-all: BackupExportAccess.tla RED
\* FFI keeps its own export that skips the core's check: it answers a stranger the others refuse (INV_SameAnswer)
\* RED: FFI reads the documents itself instead of calling the core, as it
\* did before #2321. A caller without read-document is refused by the node,
\* HTTP and the CLI but gets the export through FFI.
SPECIFICATION Spec
CONSTANTS
  CoreChecks = TRUE
  Forwarding = {"node", "http", "cli"}
INVARIANT INV_SameAnswer
CHECK_DEADLOCK FALSE
