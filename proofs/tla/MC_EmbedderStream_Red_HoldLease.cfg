\* RED: the request's room is held until the handler returns, as in the first
\* draft. s1 hangs while holding peer a's whole share, so s2 can only be turned
\* away busy. Expect INV_ServingHoldsNoLease to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  Registered <- mcRegistered
  Stuck <- mcStuck
  Share = 1
  TagMode = "Check"
  LeaseMode = "HoldUntilReturn"
  DeadlineMode = "Deadline"
  RevokeMode = "Close"
  ShutdownMode = "Abort"
INVARIANT INV_TypeOK
INVARIANT INV_ServingHoldsNoLease
