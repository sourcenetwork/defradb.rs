\* Plants F2: P2P stops before the node drains its writes, as main's
\* Node::shutdown does, so a stop can land after a commit and before the
\* recorder registers its marker, which lives only in memory until then.
\* a commits ya and stops before the registration: ya is merged on a and
\* owed to h by nobody. INV_ObligationOwned fails.
SPECIFICATION Spec
CONSTANTS
  Nodes <- eNodes
  Repl <- eRepl
  Heads <- eHeads
  Author <- eAuthor
  Parent <- eParent
  Prio <- ePrio
  KeyOrder <- eKeyOrder
  Base <- eBase
  Fresh <- eFresh
  Backlogs <- eBacklogs
  Trickle <- eTrickle
  Dead <- eDead
  PullPeer <- ePullPeer
  PullAt <- ePullAt
  Storm <- eStorm
  Crashable <- eCrashable
  ConnectedAtStart <- eConnectedAtStart
  K = 1
  Permits = 1
  PeerPermits = 1
  MemCap = 3
  PeerQuota = 3
  DurCap = 3
  MaxCrash = 1
  MaxRegFail = 1
  MaxDisc = 0
  MaxCont = 0
  CoverRule = "Ancestry"
  ShutdownOrder = "StopFirst"
  ForwardMode = "BeforeMark"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Kept"
  FanoutMode = "PerPeer"
  SlotBeforePermit = FALSE
  DispatchPath = "Direct"
  ConnMode = "Served"
INVARIANT INV_TypeOK
INVARIANT INV_Bounded
INVARIANT INV_ObligationOwned
INVARIANT INV_ReverseBorrowServed
CHECK_DEADLOCK FALSE
