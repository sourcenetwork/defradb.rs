\* RED: the first version of the fix. The held answer waits on every
\* connected peer that has not identified, not just the ones waiting when
\* the caller asked. A peer that dials in after the call then holds the
\* answer for up to its Identify timeout (60 s), and a steady stream of new
\* peers can hold it for longer. Must fail INV_NotHeldByLater.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  WaitForIdentify = TRUE
  SnapshotAtAsk = FALSE
INVARIANT TypeOK
INVARIANT INV_ListenAddress
INVARIANT INV_NotHeldByLater
CHECK_DEADLOCK FALSE
