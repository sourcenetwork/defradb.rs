\* Plants the bug: a replicated genesis is registered without checking the
\* permission on the parent it names. A document for a parent the identity holds
\* nothing on arrives and is registered: AuthorizedAtWrite fails.
SPECIFICATION Spec
CONSTANT Bug = "replica"
INVARIANT AuthorizedAtWrite
INVARIANT RegistrationHasParent
INVARIANT FieldNamesAdmittedParent
CHECK_DEADLOCK FALSE
