\* GREEN: the code as written. A transactional write commits, then a
\* coordinator task registers its scope markers, and the commit call returns
\* only once that task ended (event/emission.rs register_update_event_callback,
\* merge/txn_broadcaster.rs SyncTxnBroadcaster::submit_update). Node::shutdown
\* drains the writes it admitted before P2P stops, so no registration is
\* pending then; the sender may still crash between a commit and its
\* registration. Every head a writer was told committed stays owed to the
\* receiver until it merges it. A head whose sender crashed before registering
\* it was never acknowledged: INV_ObligationConservation, which counts every
\* committed head, does not hold across that crash and is not checked here,
\* and with nothing left to run after it the state space has dead ends, so
\* deadlock is not checked either.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Docs           = {d1}
  Cols           = {}
  MaxV           = 2
  Cap            = 2
  FetchCap       = 1
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MarkerHandoff  <- HandoffDrained
INVARIANT INV_TypeOK
INVARIANT INV_AckedWriteOwned
INVARIANT INV_SingleFlight
INVARIANT INV_FetchOwnersBounded
INVARIANT INV_SingleMergeWriter
INVARIANT INV_SingleTerminalWriter
INVARIANT INV_ReceiverQueueBounded
PROPERTY ACT_LinkingHeadRetiresScopeHead
INVARIANT INV_PendingServiceable
INVARIANT INV_SenderMarkersOnly
INVARIANT INV_MarkersReplayable
