\* run-all: ReindexFailureListing.tla RED
\* the failure is kept beside the owed record and outlives it (INV_SettledNotFailed)
\* RED: the failure is stored next to the owed record instead of inside it. A
\* rebuild stops on a clash, a later rebuild of the same reindex finishes and
\* removes the record, but the failure stays and the index still lists as
\* failed with nothing owed: INV_SettledNotFailed fails.
SPECIFICATION Spec
CONSTANTS
  MaxTokens = 3
  NoTokenCheck = FALSE
  KeepFailureOnOwe = FALSE
  FailureBeside = TRUE
INVARIANT TypeOK INV_SettledNotFailed INV_FailureIsCurrent
CHECK_DEADLOCK FALSE
