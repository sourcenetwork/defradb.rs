\* run-all: DocRelationship.tla RED
\* The core skips the collection check: a relationship changes although that check fails (INV_NoChangeUnlessAllChecksPass)
\* RED: the core no longer checks that the collection exists and has a policy, so a change lands on a collection that has none.
\* Both ways in forward to it, so both make the change.
SPECIFICATION Spec
CONSTANTS
  Skipped = {"collection"}
  Swapped = TRUE
  ServerCopy = FALSE
  EventFirst = FALSE
  TxnSwapped = FALSE
INVARIANT INV_NoChangeUnlessAllChecksPass
CHECK_DEADLOCK FALSE
