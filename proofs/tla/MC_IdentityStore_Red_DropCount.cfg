\* RED: the slot does not count its holds, it only says "held". Holders a and
\* b both hold the DID; a gives its hold back, which leaves the slot "not
\* held", so the key is dropped while b still holds it and b's next signed
\* request finds no key. Must fail INV_KeyWhileHeld.
SPECIFICATION Spec
CONSTANTS
  Holders         = {a, b}
  PinSig          = a
  NoSigner        = none
  MaxSlots        = 2
  AtomicSwap      = TRUE
  CountHolds      = FALSE
  ClearKeepsSlots = TRUE
  ClearKeepsHeld  = TRUE
  RetainNeedsKey  = TRUE
  RefuseOther     = TRUE
  PinRefusesHeld  = TRUE
INVARIANT INV_KeyWhileHeld
CHECK_DEADLOCK FALSE
