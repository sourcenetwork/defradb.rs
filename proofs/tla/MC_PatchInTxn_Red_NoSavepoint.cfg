\* run-all: PatchInTxn.tla RED
\* a failed patch keeps its partial writes (INV_FailedPatchLeavesNothing)
\* RED: a patch runs without a savepoint. A patch whose second operation is
\* refused after its first was written leaves that write in the caller's
\* transaction, and the commit lands it although the patch reported an error
\* (INV_FailedPatchLeavesNothing).
SPECIFICATION Spec
CONSTANTS
  WriteThroughTxn = TRUE
  PublishOnCommit = TRUE
  FollowUpOnCommit = TRUE
  RefreshCatalog = TRUE
  RollBackFailed = FALSE
  RestoreLensStore = TRUE
  AwaitFollowUp = TRUE
  ValidateDefinitions = TRUE
INVARIANT INV_FailedPatchLeavesNothing
CHECK_DEADLOCK FALSE
