\* RED: the patch writes straight into the caller's transaction with no
\* statement savepoint. When a later collection fails (it still has documents),
\* the earlier collections' new versions and cache hooks stay in the
\* transaction, and the caller's commit lands half a patch
\* (INV_FailedPatchLeavesNothing).
SPECIFICATION Spec
CONSTANTS
  ReadThroughTxn = TRUE
  WriteThroughTxn = TRUE
  FinishOnCommit = TRUE
  RetryHides = FALSE
  Savepoint = FALSE
  RefreshCatalog = TRUE
  NacInTxn = TRUE
  IndexInTxn = TRUE
INVARIANT INV_FailedPatchLeavesNothing
CHECK_DEADLOCK FALSE
