\* RED: the light client skips the root check and accepts whatever the server
\* proved. A block that finalizes while the answer travels leaves an answer
\* from the older root accepted, which could grant an access the newer state
\* revoked. Must fail INV_NeverStale.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 3
  CheckRoot   = FALSE
  Retry       = TRUE
  Capped      = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverStale
