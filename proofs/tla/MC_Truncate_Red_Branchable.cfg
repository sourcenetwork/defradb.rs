\* run-all: Truncate.tla RED
\* allowbranchable left out: Go's refusal of a filtered truncate of a branchable collection is put back (INV_FilteredOnBranchableAllowed)
\* RED: allowing a filtered truncate of a branchable collection is left out,
\* so Go's refusal is put back. The caller cannot remove any document from
\* such a collection
\* (INV_FilteredOnBranchableAllowed).
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  Enforced = {"nac", "chunk", "txn", "shape", "viewcache", "seprefix", "sesamespace", "metaerror", "keephistory"}
INVARIANT INV_FilteredOnBranchableAllowed
CHECK_DEADLOCK FALSE
