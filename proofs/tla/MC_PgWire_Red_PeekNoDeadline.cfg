\* RED (the reviewed bug): the deadline is read after serve's peek, so the peek
\* waits with no limit. A client that connects and sends nothing holds the
\* connection, unstarted, as long as it likes. Must fail
\* INV_StartupWithinDeadline.
SPECIFICATION Spec
CONSTANTS
  Limit              = 2
  MaxTime            = 3
  MaxMsgs            = 1
  PreMsgs            = {"tls", "ssl", "anon"}
  PostMsgs           = {"query"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = FALSE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_StartupWithinDeadline
CHECK_DEADLOCK FALSE
