\* a chunk shows only while its parent is live, readable and uses it
\* GREEN: every guard is on. A deleted or unreadable article shows no chunks,
\* forged chunks are hashed again and dropped, the text is cut again to find
\* the chunks it uses, the chunk collection's own app check runs, each query decides afresh, and a block
\* is served only for an article that has arrived, from collections this node knows,
\* and a delegated key only for a block its delegation covers.
