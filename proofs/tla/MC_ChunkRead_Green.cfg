\* GREEN: every guard is on. A deleted or unreadable article shows no chunks,
\* forged chunks are hashed again and dropped, the text is cut again
\* rather than trusting the list, the chunk collection's own app check runs, each query decides afresh, and a block
\* is served only for an article that has arrived, from collections this node knows.
