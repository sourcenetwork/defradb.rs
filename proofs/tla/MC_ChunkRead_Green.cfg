\* run-all: ChunkRead.tla GREEN
\* a chunk shows only while its parent is live, readable and uses it
\* GREEN: every guard is on. A deleted or unreadable article shows no chunks,
\* forged chunks are hashed again and dropped, the text is cut again to find
\* the chunks it uses, the chunk collection's own app check runs, each
\* query decides afresh, a block is served only for an article that has
\* arrived, from collections this node knows, a delegated key only for a block
\* its delegation covers, and a ranking scores the article by its best current
\* chunk.
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 2
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = TRUE
  CheckCut = TRUE
  CheckResolved = TRUE
  CheckOwnApp = TRUE
  CheckDelegationScope = TRUE
  RouteChecksList = TRUE
  RouteOnlyUnruled = TRUE
  HeldKeepsBest = TRUE
INVARIANT TypeOK
INVARIANT INV_ShownIsLiveAndReadable
INVARIANT INV_ShownIsTheText
INVARIANT INV_ShownPassesOwnApp
INVARIANT INV_ServedIsReadable
INVARIANT INV_DelegatedKeyInScope
INVARIANT INV_RankedIsBestListed
CHECK_DEADLOCK FALSE
