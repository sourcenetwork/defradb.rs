\* RED: a rebuild that writes values back resumes a settlement's record. The
\* settlement stopped after its first page, which wrote nothing back, and the
\* rebuild carries on after it: it reports done with the first document still
\* at its source value, so INV_RebuiltAll fails.
SPECIFICATION Spec
CONSTANTS
  N = 3
  ResumeRestamp = FALSE
  ResumeAnyMode = TRUE
  SettleIgnoresMode = FALSE
INVARIANT TypeOK INV_RebuiltAll
CHECK_DEADLOCK FALSE
