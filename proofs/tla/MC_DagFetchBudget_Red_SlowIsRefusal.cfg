\* A window that failed only at the 30 s response timeout counts as a free
\* refusal. Each batch then waits a full window per provider without spending
\* budget, so the wait grows with the batches and INV_WaitBounded fails.
INIT Init
NEXT Next
CONSTANTS Batches = 6
          Providers = 2
          Window = 3
          Fast = 1
          MaxFree = 2
          SlowMode = "Refusal"
          CapMode = "Capped"
          CheckMode = "Check"
INVARIANT INV_TypeOK
INVARIANT INV_WaitBounded
CHECK_DEADLOCK FALSE
