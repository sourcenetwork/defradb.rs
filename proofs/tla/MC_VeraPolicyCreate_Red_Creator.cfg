\* RED: the id leaves the creator out, as the counter scheme named policies
\* without their creator. A second creator asking for the same definition and
\* nonce finds the first creator's policy under its id and is refused
\* (INV_NoForeignBlock).
SPECIFICATION Spec
CONSTANTS
  Requests = {r1, r2}
  Creators = {c1, c2}
  Defs = {d1, d2}
  Nonces = {n1, n2}
  MaxSends = 2
  Enforced = {"reuse", "adopt", "check"}
INVARIANT INV_NoForeignBlock
CHECK_DEADLOCK FALSE
