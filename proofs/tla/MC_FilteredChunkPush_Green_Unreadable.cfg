\* run-all: FilteredChunkPush.tla GREEN
\* every fix is in; the matching article's heads can't be read
\* GREEN: every fix is in, and the matching article's heads can't be read here,
\* so its replay sends nothing and its chunk's retry ends unsent. Every
\* invariant and every liveness property holds.
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  NewMatches = {a1}
  Unreadable = {a1}
  StaleMarkers = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = TRUE
  ReplayNeedsArticle = TRUE
  ReplayDefersChunk = TRUE
  ReplayChunksOnRefilter = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingUnmatched
INVARIANT INV_ChunkOnlyWithItsArticle
PROPERTY LIVE_RetriesEnd
PROPERTY LIVE_ChunkFollowsItsArticle
PROPERTY LIVE_ReplayShipsChunks
CHECK_DEADLOCK FALSE
