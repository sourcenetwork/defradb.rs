\* run-all: HistoryRetention.tla RED
\* #559: a pruned composite a peer sends again becomes a head again (INV_NoStaleHead)
\* Bug planted: the prune deletes a pruned commit's priority entry. A peer sends c2 again, the merge finds no record that it was published, applies it as new and makes it a head: INV_NoStaleHead fails.
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Keep"
  FieldMode = "Keep"
  ScanMode = "Validated"
  MarkerMode = "Drop"
  WindowMode = "Exact"
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned
CHECK_DEADLOCK FALSE
