\* run-all: HistoryRetention.tla RED
\* #559: a pruned commit whose priority entry is dropped reads as the start of history (INV_NoPartialRead) and, sent again, becomes a head again (INV_NoStaleHead)
\* Bug planted: the prune deletes a pruned commit's priority entry. Right after the prune, a version read at c3 meets the missing c2, finds no entry saying a prune deleted it, takes it for the start of history and returns a partial document: INV_NoPartialRead fails first. Without that read, a peer sending c2 again would find no record that it was published, apply it as new and make it a head (INV_NoStaleHead).
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Keep"
  FieldMode = "Keep"
  LinkMode = "Keep"
  ScanMode = "Validated"
  MarkerMode = "Drop"
  WindowMode = "Exact"
  ReclaimMode = "Scan"
  ReadMode = "Refuse"
  MaxPrunes = 2
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned INV_Reclaimed INV_KeptLinksStored
CHECK_DEADLOCK FALSE
