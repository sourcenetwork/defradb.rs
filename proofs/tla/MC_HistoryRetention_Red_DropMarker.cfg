\* run-all: HistoryRetention.tla RED
\* #559: a pruned commit whose priority entry is dropped, then sent again, becomes a head again (INV_NoStaleHead)
\* Bug planted: the prune deletes a pruned commit's priority entry, so a peer sending c2 again finds no record that it was published, applies it as new and makes it a head. This configuration isolates INV_NoStaleHead; the separate SkipRead configuration checks the partial-read guard.
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Keep"
  FieldMode = "Keep"
  LinkMode = "Keep"
  ScanMode = "Validated"
  MarkerMode = "Drop"
  WindowMode = "Exact"
  ReclaimMode = "Scan"
  ReadMode = "Refuse"
  MaxPrunes = 2
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned INV_Reclaimed INV_KeptLinksStored
CHECK_DEADLOCK FALSE
