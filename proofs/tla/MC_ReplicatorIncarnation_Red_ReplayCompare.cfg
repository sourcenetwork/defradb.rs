\* Bug: the replay reads the row, then writes inactive only if the incarnation and the bytes it read
\* are both unchanged (the old set_replicator_if_incarnation compare-and-set). Another writer that
\* rewrites the row under the same incarnation in between makes the replay skip its flip, so its own
\* current install stays active with unfinished documents (ACT_FlipNotSkipped).
SPECIFICATION Spec
CONSTANT MarkerMode = "replay"
CONSTANT Stale = "retry"
CONSTANT ReplayMode = "cas"
PROPERTY ACT_FlipNotSkipped
CHECK_DEADLOCK FALSE
