\* The bug: the lookup and the write run in separate transactions. The
\* lookup finds the document live, another writer deletes it, and the
\* write then lands on the deleted document and forks. This must fail
\* INV_NoFork.
INIT Init
NEXT Next
CONSTANT CheckDeleted = TRUE
CONSTANT OneTransaction = FALSE
INVARIANT INV_NoFork
CHECK_DEADLOCK FALSE
