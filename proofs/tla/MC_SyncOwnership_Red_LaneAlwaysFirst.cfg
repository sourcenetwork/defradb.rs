\* RED (the rule before): the merge loop always takes the clock's lane first.
\* With two fetch slots, d1's trickling attempt is re-dispatched at every
\* quantum before the merge loop looks again, so the lane is never empty
\* when it does. d2's DagReady waits in the channel behind it for good, and
\* LIVE_AckedRootMerged fails.
SPECIFICATION WFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1, d2}
  Cols           = {}
  MaxV           = 1
  Cap            = 2
  FetchCap       = 2
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MaxAttempts    = 3
  AttemptMode    = "PerAttempt"
  RearmMode      = "AttemptEnd"
  ExpiryMode     = "AckRetained"
  Dead           = {}
  Trickle        = {d1}
  CutoffMode     = "Quantum"
  SharedPeer     = {}
  PeerPermits    = 1
  MaxPulls       = 0
  PermitMode     = "WithSlot"
  DispatchPath   = "OwnLane"
  HandlerSend    = "TryThenClock"
  LaneTurns      = "Always"
  Storm          = FALSE
  FifoCap        = 1
INVARIANT INV_DispatchTypeOK
PROPERTY LIVE_AckedRootMerged
