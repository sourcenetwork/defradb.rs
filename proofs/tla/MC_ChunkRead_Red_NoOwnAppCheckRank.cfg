\* run-all: ChunkRead.tla RED
\* a ranking scores chunks their own app check refuses (INV_RankedIsBestListed)
\* RED: the bug plants a ranking that checks only the article, as in
\* MC_ChunkRead_Red_NoOwnAppCheck, and checks only the ranking. An app read
\* validator on the chunk collection refuses the reader, and a ranking of the
\* article, which is never routed under that rule, still scores it by those
\* chunks (INV_RankedIsBestListed).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = TRUE
  CheckCut = TRUE
  RouteChecksList = TRUE
  RouteOnlyUnruled = TRUE
  CheckResolved = TRUE
  CheckOwnApp = FALSE
  CheckDelegationScope = TRUE
INVARIANT INV_RankedIsBestListed
CHECK_DEADLOCK FALSE
