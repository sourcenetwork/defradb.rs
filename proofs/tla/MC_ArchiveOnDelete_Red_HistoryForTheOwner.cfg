\* RED: an owed archive leaves the commit history to its actor whoever
\* deleted. A writer deletes the owner's document, and the owner, the
\* archive's actor, reads the deleted document's commit history though it
\* did not delete it. Must fail INV_HistoryOnlyToDeleter.
SPECIFICATION Spec
CONSTANTS
  CheckPermission  = TRUE
  ArchiveAsOwner   = TRUE
  Drop             = TRUE
  VeraRefuses      = TRUE
  Overlay          = TRUE
  HistoryActorOnly = TRUE
  SpareOnlyDeleter = FALSE
  First            = "archive"
INVARIANT TypeOK
INVARIANT INV_HistoryOnlyToDeleter
