\* RED (j): the started cell is a check-then-store cell instead of a OnceCell:
\* no turn (once_cell.rs:144) and a plain store where the publish has its
\* compare-and-swap (once_cell.rs:166-171). This is one bug, the cell built by
\* hand, and it removes both guards at once. c1 and c2 both find it empty and
\* both start; c1 stores s1 and is answered s1, then c2 stores s2 over it and is
\* answered s2: two calls, two process-wide defaults. (The compare-and-swap
\* alone has no RED: only the turn holder ever writes the cell, so with the
\* turn in place the model stays green.) Two callers and no registrable pool.
\* Must fail INV_OneDefault.
SPECIFICATION Spec
CONSTANTS
  NP                 = 0
  NC                 = 2
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = FALSE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = FALSE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_OneDefault
CHECK_DEADLOCK FALSE
