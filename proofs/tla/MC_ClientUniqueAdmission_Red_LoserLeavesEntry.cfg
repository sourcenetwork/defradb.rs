\* run-all: ClientUniqueAdmission.tla RED
\* a lost commit keeps its entry (INV_LoserLeavesNothing)
\* RED: a commit that loses still lands its unique entry. The refused client
\* leaves an entry that names it, so its value stays taken by a document that
\* does not exist (INV_LoserLeavesNothing).
SPECIFICATION Spec
CONSTANTS
  Clients = {1, 2}
  Values = {"v"}
  Mode = "Explicit"
  Indexed = TRUE
  EntryValidated = TRUE
  ScanDecides = FALSE
  FilterValidated = FALSE
  LoserLeaves = TRUE
  RerunReuses = FALSE
  NilChecked = FALSE
  MaxAttempts = 3
INVARIANT INV_LoserLeavesNothing
CHECK_DEADLOCK FALSE
