\* RED: the bug plants a merge that holds back a chunk delete only while the
\* live article's text uses the chunk. A peer deletes a chunk the text does not
\* use yet, a later edit uses it again, and readers miss it (INV_ListedChunksStay).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = TRUE
  DeleteRule = "listed"
  WaitForChunk = TRUE
INVARIANT INV_ListedChunksStay
CHECK_DEADLOCK FALSE
