\* The save refuses a deleted document and runs its lookup and write in one
\* transaction. Every invariant must hold.
INIT Init
NEXT Next
CONSTANT CheckDeleted = TRUE
CONSTANT OneTransaction = TRUE
INVARIANT TypeOK
INVARIANT INV_NoFork
INVARIANT INV_DeletedStaysDeleted
INVARIANT INV_RefusedOnlyDeleted
CHECK_DEADLOCK FALSE
