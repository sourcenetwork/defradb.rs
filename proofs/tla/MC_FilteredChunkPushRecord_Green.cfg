\* run-all: FilteredChunkPushRecord.tla GREEN
\* every fix is in; lookups can fail and the record on disk can become unreadable
\* GREEN: every fix is in. Adding the filter pairs the chunk collection on every
\* transport, removing the article takes its chunk collection, a restart whose
\* lookup fails keeps the stored pair, a removal reads and rewrites the disk in
\* one transaction and only drops collections from it, and an unreadable
\* record decides nothing. No document of the unmatched article reaches the
\* receiver.
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  MaxRestarts = 2
  LookupCanFail = TRUE
  CanCorrupt = TRUE
  AddPairs = TRUE
  RemoveTakesChunks = TRUE
  KeepStoredPair = TRUE
  PersistOnlyNarrows = TRUE
  PersistInOneTxn = TRUE
  BadRecordFailsClosed = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
