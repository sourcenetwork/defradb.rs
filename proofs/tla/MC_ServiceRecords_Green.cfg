\* GREEN: a record replaces only a lower seq, an expired record is never
\* used, and a reader whose pointer is ahead queries the owner. Gossip may
\* lose or reorder any announcement, yet the reader never steps back, never
\* uses an expired record, and ends up with the newest one.
SPECIFICATION Spec
CONSTANTS
  MaxSeq = 3
  SeqMode = "Increasing"
  ChooseMode = "CheckExpiry"
  RefreshMode = "QueryOnStale"
INVARIANT INV_TypeOK
INVARIANT INV_SeqNeverGoesBack
INVARIANT INV_NoExpiredChosen
PROPERTY LIVE_NewestReached
