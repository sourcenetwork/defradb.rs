\* RED (e): the slot holds the registered pool with an Arc instead of a Weak
\* (default.rs:24, 94). p1 registers and its owner drops its last handle, yet p1
\* stays alive and running: the registration keeps a pool nobody owns, with its
\* threads and CPUs, and it stays the default. One pool registering is enough.
\* Must fail INV_RegistrationKeepsNothingAlive.
SPECIFICATION Spec
CONSTANTS
  NP                 = 1
  NC                 = 1
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = FALSE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_RegistrationKeepsNothingAlive
CHECK_DEADLOCK FALSE
