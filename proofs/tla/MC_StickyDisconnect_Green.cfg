\* run-all: StickyDisconnect.tla GREEN
\* the close carries CLOSE_DISCONNECTED, so neither side of a hang-up discovery-dials the other back
\* GREEN: pinc as written. A hang-up quiets the peer for this node's peer
\* exchange, and the close carries the code DISCONNECTED, so the peer quiets
\* the node too. Lists arrive in any order around the hang-up, links drop,
\* and nodes connect explicitly twice. Neither side of a hang-up dials the
\* other back through discovery, an explicit connect lifts the quiet, and
\* other dials still reach a quiet peer.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = TRUE
  QuietUnlinked = TRUE
  RemoteQuiet = TRUE
  Unquiet = TRUE
  OnlyDiscoveryChecked = TRUE
  RecheckQuiet = TRUE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT NoLocalRedial
INVARIANT NoRedialAfterDeliberateClose
INVARIANT UnquietOnConnect
INVARIANT RequestsStillDial
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
