\* RED: a concurrent merge takes the null flag from the block it merges, not
\* from the heads. For example, the text is "a". Alice writes null while Bob
\* types "x" after "a", at once. Alice merges Bob's block, which is not null,
\* and reads "x". Bob merges Alice's null last and takes its word: his field
\* reads null though it still shows "x", and Alice disagrees with him.
\* Must fail INV_NullMatchesReplay.
SPECIFICATION Spec
CONSTANTS
  Peers        = {p1, p2}
  MaxBlocks    = 4
  SiblingKey   = "id"
  CausalBuffer = TRUE
  ResolveAt    = "parent"
  PlaceRule    = "fugue"
  NullRule     = "last"
INVARIANT TypeOK
INVARIANT INV_NullMatchesReplay
