\* Bug: every merge, not only a restore, takes a block whose signature
\* block is missing, so a peer can push an update with no signature and the
\* node merges it as unsigned. Fails INV_NoUnsignedPush.
SPECIFICATION Spec
CONSTANTS
  Filtered = {"a"}
  MaxRuns = 2
  StoreMode = "Before"
  GenesisMode = "Check"
  WriteMode = "Join"
  JudgeMode = "Restore"
  ReportMode = "Report"
  SigMode = "Always"
  EncMode = "Check"
INVARIANTS INV_MergedHasBlocks INV_NoDocWithoutFirst INV_NoLostLiveWrite INV_NoUnsignedPush INV_NoUnreadableStored INV_Complete
CHECK_DEADLOCK FALSE
