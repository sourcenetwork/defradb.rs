\* an unrestorable replay is unnamed (INV_Classified)
\* RED: an unrestorable replay is reported without its reason. The embedder
\* sees a lost policy creation and cannot tell why. Must fail INV_Classified.
SPECIFICATION Spec
CONSTANTS
    Submissions = {1, 2}
    MaxTerm = 2
    MaxFaults = 1
    Publish = TRUE
    AfterAll = TRUE
    Once = TRUE
    KeepOwed = TRUE
    CutOfTerm = TRUE
    NameUnrestorable = FALSE
    NameClosed = TRUE
    Recorded = TRUE
INVARIANT
    TypeOK
    INV_Classified
