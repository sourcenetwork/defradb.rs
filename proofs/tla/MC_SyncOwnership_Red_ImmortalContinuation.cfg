\* RED (the rule before MergeTurn): a pull-sync continuation whose turn skips
\* or fails without a terminal outcome keeps its entry. The clock re-drives it
\* turn after turn, it never leaves and it counts against the map for good:
\* LIVE_ContinuationEnds fails.
SPECIFICATION MFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs             = {d1, d2}
  Cols             = {}
  MaxV             = 1
  Cap              = 2
  FetchCap         = 1
  SenderMode       = "MarkerRederive"
  RegisterMode     = "Durable"
  FlightMode       = "SingleFlight"
  AckGuardMode     = "HeadCurrent"
  ServeMode        = "DurableDerived"
  ProviderMode     = "OriginBound"
  OriginAuthMode   = "TransportBound"
  FetchMode        = "RootThenSelective"
  StreamMode       = "DrainResponse"
  CompletionMode   = "LatchedDrain"
  PendingMode      = "ScopeCurrent"
  MergeMode        = "SerializedBatch"
  MemCap           = 1
  Dead             = {d1}
  PullScopes       = {d2}
  OverflowMode     = "Rotate"
  ContinuationMode = "Retained"
INVARIANT INV_MemoryTypeOK
PROPERTY LIVE_ContinuationEnds
