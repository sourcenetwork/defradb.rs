\* run-all: ArchiveOnDelete.tla RED
\* a writer's parked archives count against the node's admission, refusing everyone's new changes (INV_DeleteChargesNobody)
\* RED: an archive is left out of its actor's admission count but still
\* counts against the node's, as any new change does. A writer the policy
\* lets delete deletes the owner's document; the archive, parked for want
\* of the owner's authority, keeps counting against the node until the
\* owner hands one in, and enough of them fill the node's bound: then no
\* new change of anyone's is admitted, the owner's included, though nobody
\* staged one. Must fail INV_DeleteChargesNobody.
SPECIFICATION Spec
CONSTANTS
  CheckPermission  = TRUE
  ArchiveAsOwner   = TRUE
  Drop             = TRUE
  VeraRefuses      = TRUE
  Overlay          = TRUE
  HistoryActorOnly = TRUE
  SpareOnlyDeleter = TRUE
  ArchiveUncounted = TRUE
  ArchiveOffNode   = FALSE
  ArchiveOffTxn    = TRUE
  First            = "archive"
INVARIANT TypeOK
INVARIANT INV_DeleteChargesNobody
