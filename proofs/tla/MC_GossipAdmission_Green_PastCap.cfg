\* GREEN past the budgets: peer "a" may keep one deferred record and all peers
\* two. Some announcements cannot be kept; each of them is reported as a node
\* event, so every heard announcement is owned or reported, and every
\* document is merged or reported in the end.
SPECIFICATION FairSpec
CONSTANTS
  Docs <- mcDocs
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  MemCap = 1
  MaxCrashes = 1
  PeerCap = 1
  TotalCap = 2
  Mode = "Durable"
  Promote = TRUE
CHECK_DEADLOCK TRUE
INVARIANT INV_TypeOK
INVARIANT INV_HeardIsOwnedOrReported
PROPERTY LIVE_AllSettled
