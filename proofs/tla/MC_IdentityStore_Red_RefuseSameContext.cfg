\* RED: signers are compared by which registration made them (an Arc
\* pointer), not by the host context they call, as same_signer did. Holder a
\* registers the DID with context a; holder b registers it again with the
\* very same context, a second handle the host keeps valid, and is refused
\* only because its registration made a new signer object. Must fail
\* INV_AcceptSame.
SPECIFICATION Spec
CONSTANTS
  Holders         = {a, b}
  Contexts        = {a, b}
  PinSig          = a
  NoSigner        = none
  MaxSlots        = 2
  AtomicSwap      = TRUE
  CountHolds      = TRUE
  ClearKeepsSlots = TRUE
  ClearKeepsHeld  = TRUE
  RetainNeedsKey  = TRUE
  RefuseOther     = TRUE
  PinRefusesHeld  = TRUE
  SameByContext   = FALSE
INVARIANT INV_AcceptSame
CHECK_DEADLOCK FALSE
