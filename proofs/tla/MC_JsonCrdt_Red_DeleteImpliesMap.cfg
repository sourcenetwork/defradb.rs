\* RED: a delete below a path counts as saying the path is a map. Bob
\* deletes "a.b" from a document where "a" is gone, or where Alice deletes "a"
\* at the same time. His delete keeps "a" in the race as an implied map, so
\* "a" comes back as {} though nobody wrote anything into it: without Bob's
\* delete, "a" is gone, and no set holds it up. Must fail
\* INV_DeleteCreatesNothing.
SPECIFICATION Spec
CONSTANTS
  Peers            = {p1, p2}
  MaxBlocks        = 3
  UseCid           = TRUE
  DeleteWins       = FALSE
  DeleteImpliesMap = TRUE
  SharedIds        = FALSE
  MultiPath        = FALSE
  Settle           = TRUE
  ReadAs           = "design"
  Anchor           = TRUE
INVARIANT TypeOK
INVARIANT INV_DeleteCreatesNothing
