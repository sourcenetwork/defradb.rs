\* run-all: DeferredVector.tla RED
\* a search reads the graph and not the pending entries
\* Plants a search that reads the graph alone. A deferred write that committed
\* is not found until the drain runs: INV_SearchSeesLatest fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {n1, n2}
          Drains = {d1, d2}
          MaxWrites = 3
          MaxCrashes = 1
          ValidateRead = TRUE
          Supersede = TRUE
          MergePending = FALSE
          DropStale = TRUE
          AskOnCommit = TRUE
          SettleAtOpen = TRUE
INVARIANT INV_SearchSeesLatest
