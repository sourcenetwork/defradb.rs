\* run-all: BackupExportAccess.tla RED
\* The core's export checks no permission: the embedded node and FFI export for a stranger (INV_NoReadWithoutPermission)
\* RED: the check is left out of the core. The HTTP route still refuses a
\* caller without read-document, but the embedded node and FFI have no route,
\* so they read the documents and hand them over.
SPECIFICATION Spec
CONSTANTS
  CoreChecks = FALSE
  Forwarding = {"node", "http", "cli", "ffi"}
INVARIANT INV_NoReadWithoutPermission
CHECK_DEADLOCK FALSE
