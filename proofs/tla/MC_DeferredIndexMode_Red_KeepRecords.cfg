\* RED: the rebuild of an inline index keeps its records. Inline writes move the
\* entries and leave the records behind; on the next deferred start the old records
\* look current, so nothing is rebuilt and they name entries that are gone
\* (INV_OpenMatchesMode).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  MaxValue = 2
  MaxRestarts = 3
  StartModes = {"Inline", "Deferred"}
  Check = "Both"
  ClearRecords = "Off"
  ProgressReset = "On"
INVARIANT INV_OpenMatchesMode
CHECK_DEADLOCK FALSE
