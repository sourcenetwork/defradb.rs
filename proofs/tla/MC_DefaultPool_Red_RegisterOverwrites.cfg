\* RED (b): make_default swaps itself in without looking whether the registered
\* pool still runs (default.rs:91-93 removed). p1 registers and runs, then p2
\* registers and replaces it: the default jumps from p1 to p2 while both run, so
\* work meant for the node's own pool lands on another one, and both calls said
\* "yes". Two pools are the smallest instance with a second registration. Must
\* fail INV_FirstRunningWins.
SPECIFICATION Spec
CONSTANTS
  NP                 = 2
  NC                 = 1
  CheckClosing       = TRUE
  RegisterChecks     = FALSE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_FirstRunningWins
CHECK_DEADLOCK FALSE
