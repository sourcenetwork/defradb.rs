\* merge takes a peer's chunk delete while the article is live (INV_ListedChunksStay)
\* RED: the bug plants a merge that takes every chunk delete, as the delete
\* branch did when it returned before the chunk guard. A peer sends a delete of
\* a chunk the live article uses, and readers lose it (INV_ListedChunksStay).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = TRUE
  DeleteRule = "none"
  GenesisFirst = TRUE
  Rebuild = TRUE
  SameIds = TRUE
  Encrypt = FALSE
  Ship = TRUE
INVARIANT INV_ListedChunksStay
CHECK_DEADLOCK FALSE
