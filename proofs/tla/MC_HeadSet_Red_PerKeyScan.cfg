\* The head scan validated per key, as regolith's Serializable does since
\* 0.1.6. A writer snapshots, a sweep reclaims a superseded head key the
\* writer's scan yielded, and the writer's commit is refused although the head
\* set it derived is unchanged. INV_NoWriteConflict fails. This is what makes
\* RepeatableRead on the store a requirement rather than a tuning.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Writers = {w1, w2}
  Seed = seed
  Strategy = "Derived"
  Reclaim = "Together"
  ScanReads = "PerKey"
INVARIANT TypeOK
INVARIANT INV_NoWriteConflict
