\* run-all: EmbedderStreamOpen.tla RED
\* the old write-before-spawn order: a busy open delivered its request and the retry runs it again (INV_BusyDeliversNothing)
\* RED: the old order, the request written before the pumps are placed. An attempt
\* refused busy has already delivered its request, and the retry delivers it again.
\* Expect INV_BusyDeliversNothing to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Attempts = 3
  OpenMode = "WriteFirst"
INVARIANT INV_TypeOK
INVARIANT INV_BusyDeliversNothing
