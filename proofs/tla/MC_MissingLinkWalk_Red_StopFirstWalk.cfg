\* RED: the quantum also stops a walk before its attempt fetched anything. A clock that fires early in every dispatch then stops every first walk, nothing is ever fetched, and a DAG whose walk outlasts the quantum never converges (LIVE_Converges).
SPECIFICATION Spec
CONSTANT N = 3
CONSTANT StopFirstWalk = TRUE
CONSTANT StoppedAsEmpty = FALSE
CONSTANT NoYield = FALSE
CHECK_DEADLOCK FALSE
INVARIANT TypeOK
INVARIANT INV_StoppedNeverReady
INVARIANT INV_YieldsEachPage
PROPERTY LIVE_Converges
