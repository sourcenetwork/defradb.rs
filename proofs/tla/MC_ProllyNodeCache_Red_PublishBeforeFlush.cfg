\* run-all: ProllyNodeCache.tla RED
\* a root goes out before its node is stored (PublishedStored)
\* The bug: a root goes out while its node is still pending. regolith does
\* not hold it, and a crash now loses it for good. PublishedStored fails.
SPECIFICATION Spec
CONSTANTS
  ReadPending = TRUE
  Evict = TRUE
  SkipHuge = TRUE
  KeepOnFail = TRUE
  FlushFirst = FALSE
  RefuseAfterFail = TRUE
INVARIANT PublishedStored
CHECK_DEADLOCK FALSE
