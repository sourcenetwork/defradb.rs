\* The bug: a root goes out while its node is still pending. regolith does
\* not hold it, and a crash now loses it for good. PublishedStored fails.
SPECIFICATION Spec
CONSTANTS
  ReadPending = TRUE
  Evict = TRUE
  SkipHuge = TRUE
  KeepOnFail = TRUE
  FlushFirst = FALSE
INVARIANT PublishedStored
CHECK_DEADLOCK FALSE
