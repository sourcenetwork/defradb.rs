\* RED: the code as shipped, inside an explicit transaction: NAC and
\* document ACP read the latest commit, not the transaction. The caller's
\* own pending revocation is missed and it hears "verified"
\* (INV_VerifiedAtOnePoint).
SPECIFICATION Spec
CONSTANTS
  InTxn = TRUE
  CheckNac = TRUE
  CheckAcp = TRUE
  CheckBlock = TRUE
  NacAt = "latest"
  AcpAt = "latest"
  BlockAt = "view"
  MaxEnv = 2
INVARIANT INV_VerifiedAtOnePoint
CHECK_DEADLOCK FALSE
