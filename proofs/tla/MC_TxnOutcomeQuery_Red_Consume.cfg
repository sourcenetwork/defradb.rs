\* run-all: TxnOutcomeQuery.tla RED
\* a read drops the record: an owner that polled mid-commit never learns the result (LIVE_QuestionAnswered)
\* RED: reading an outcome removes its record. An owner that asks while its
\* commit is still running gets "open", and when it asks again after the
\* commit settled the record is gone, so it gets "unknown" for a commit that
\* landed. Must fail LIVE_QuestionAnswered.
SPECIFICATION Spec
CONSTANTS
    Idle = 2
    QueryWorks = TRUE
    CheckToken = TRUE
    CheckOwner = TRUE
    BrokenStart = FALSE
    LeaksOwner = FALSE
    ConsumesOnRead = TRUE
    PollsOnce = FALSE
    EvictsLive = FALSE
    Cap = 2

INVARIANT
    INV_Agreement
    INV_Foreign
    INV_StartToken
    INV_FinalAnswer
    INV_Bounded
    INV_OwnerSettled

PROPERTY
    LIVE_QuestionAnswered
CHECK_DEADLOCK FALSE
