\* run-all: IndexFormatGuard.tla RED
\* a format 5 store opens without rebuilding its JSON indexes
\* RED: a previous-format store rebuilds no index at all, as if only an older
\* format needed a rebuild. Its JSON index keeps lacking the empty-array
\* entries, yet the store is stamped current and opens: INV_OpenCompatible fails.
SPECIFICATION Spec
CONSTANTS Collections = {c1, c2} Rebuild = TRUE StampLast = TRUE RefuseFuture = TRUE RetainLegacy = TRUE GuardRecordedKeys = TRUE FreshToken = TRUE JsonCollections = {c1} RebuildJson = FALSE
INVARIANT INV_OpenCompatible
CHECK_DEADLOCK FALSE
