\* RED: the drop deletes the entries it saw in a plain scan inside its own
\* commit, as both drop paths did. A backfill page that commits between the
\* scan and the drop's commit leaves its entry on disk after the drop says it
\* is done (INV_NoOrphanEntries).
SPECIFICATION Spec
CONSTANTS
  Docs = {1, 2}
  RecordMode = "Clear"
  FailMode = "Checked"
  EntryMode = "SameTxn"
  ResumeMode = "Resume"
INVARIANT INV_NoOrphanEntries
CHECK_DEADLOCK FALSE
