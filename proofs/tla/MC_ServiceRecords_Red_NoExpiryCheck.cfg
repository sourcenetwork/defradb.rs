\* RED: the reader picks peers from its copy without checking expiry. The
\* owner moves on to record 2, record 1 expires before the reader hears of
\* 2, and the reader picks a peer from the expired record
\* (INV_NoExpiredChosen).
SPECIFICATION Spec
CONSTANTS
  MaxSeq = 3
  SeqMode = "Increasing"
  ChooseMode = "NoCheck"
  RefreshMode = "QueryOnStale"
INVARIANT INV_NoExpiredChosen
