\* run-all: EncryptionPolicyInheritance.tla RED
\* heads read field by field at two times (INV_StaleDecisionSerializable)
\* RED: the heads are read field by field at two times, f2 late and f3
\* early. Two merges land in between, f3 then f2, and the decision rests on a
\* picture of the document it never had (INV_StaleDecisionSerializable).
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 1
  MaxReqWrites = 1
  MaxMerges = 2
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  KeepPrepared = FALSE
  ReprepareStale = TRUE
  UsePending = TRUE
  TornSnapshot = TRUE
  IgnoreConfig = FALSE
INVARIANT INV_StaleDecisionSerializable
CHECK_DEADLOCK FALSE
