\* run-all: UpdateJournalRetention.tla GREEN
\* GREEN: slices of two rows, pages of one row, and more rows than one slice
\* or one page holds, with two truncates running at once.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS MaxRows = 5 Slice = 2 Limit = 1 Truncators = {t1, t2} Mode = "safe"
INVARIANTS INV_Prefix INV_NoCorrupt INV_NoSilentGap INV_ToldOnlyDropped
