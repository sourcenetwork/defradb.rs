\* run-all: UpdateJournalRetention.tla GREEN
\* GREEN: slices of two rows, pages of one row, and more rows than one slice
\* or one page holds, with two truncates running at once and a document
\* created again that rewrites three blocks of its first life.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS MaxRows = 5 Slice = 2 Limit = 1 Truncators = {t1, t2} Blocks = {b1, b2, b3} MaxLives = 2 Mode = "safe"
INVARIANTS INV_Prefix INV_NoCorrupt INV_NoSilentGap INV_ToldOnlyDropped INV_EveryWriteHasRow INV_OneRowPerWrite
