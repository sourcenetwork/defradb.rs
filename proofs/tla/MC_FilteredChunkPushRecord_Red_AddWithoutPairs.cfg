\* run-all: FilteredChunkPushRecord.tla RED
\* an install leaves the chunk collection unpaired (INV_NothingUnmatched)
\* RED: the bug plants an add that never pairs the chunk collection with its
\* article, as pinc did. A chunk of the unmatched article forwarded from another
\* node has no filter of its own, so it goes to the receiver (INV_NothingUnmatched).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  MaxRestarts = 2
  LookupCanFail = TRUE
  CanCorrupt = TRUE
  AddPairs = FALSE
  RemoveTakesChunks = TRUE
  KeepStoredPair = TRUE
  PersistOnlyNarrows = TRUE
  PersistInOneTxn = TRUE
  BadRecordFailsClosed = TRUE
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
