\* RED (f), a caller contract broken: the Hold is dropped while the pool's
\* threads still run (the placer does not keep it). Pool A holds CPU 0 and its
\* threads run there; A's Hold gives CPU 0 back while they still run; pool B
\* claims CPU 0 alone, wins, and puts its threads next to A's. Must fail
\* INV_AloneRunsAlone.
\* Two CPUs, two pools living once each, one claim alone before sharing:
\* small, and still every interleaving of the scenario above.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 1
  Edges            = {}
  Attempts         = 1
  AtomicTake       = TRUE
  RollBack         = TRUE
  InsertAfterWin   = TRUE
  ShareCounts      = TRUE
  AttemptCap       = TRUE
  KeepWhileRunning = FALSE
  ReleaseOnce      = TRUE
  RunOnHeld        = TRUE
  ReleaseAtEnd     = TRUE
INVARIANT TypeOK
INVARIANT INV_AloneRunsAlone
CHECK_DEADLOCK FALSE
