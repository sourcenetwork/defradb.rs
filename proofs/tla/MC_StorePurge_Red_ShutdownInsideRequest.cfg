\* run-all: StorePurge.tla RED
\* the teardown runs inside the request and waits for its own drain (LIVE_PurgeServesAgain)
\* RED: the handler runs the teardown inside the purge request. The drain
\* waits for that request, which waits for the drain, so the node never
\* serves again. Must fail LIVE_PurgeServesAgain.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Developments = {TRUE}
  Handlers = {TRUE}
  HeldElsewhere = {FALSE}
  OtherCallers  = {FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = FALSE
  DevelopmentChecked       = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
  SignerHeld               = TRUE
PROPERTY LIVE_PurgeServesAgain
CHECK_DEADLOCK FALSE
