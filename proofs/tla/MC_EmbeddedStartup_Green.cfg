\* GREEN: the code as written. Every config the model tries (either transport,
\* a default, custom or invalid retry ladder, one to two listen addresses that
\* bind or fail, with or without an identity and a NAC request, and a bootstrap
\* peer that answers, does not, or is absent) starts or fails holding nothing.
\* Every invariant and the liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  ScheduleToIroh       = TRUE
  ShutdownOnListenFail = TRUE
  ValidateFirst        = TRUE
  OwnerPassed          = TRUE
  ConnectAfterNac      = TRUE
  BootstrapNonFatal    = TRUE
INVARIANT TypeOK
INVARIANT INV_FailedHoldsNothing
INVARIANT INV_OneSchedule
INVARIANT INV_NacAsAsked
INVARIANT INV_NoPeerBeforeNac
INVARIANT INV_BootstrapNonFatal
PROPERTY LIVE_StartupEnds
CHECK_DEADLOCK FALSE
