\* RED: on a 0.2 connection admission still lets a reply stream through when
\* an expectation is left, as on 0.1. A peer we asked opens a second stream
\* with a forged reply and it is admitted (INV_NoReplyStreamOnV2).
SPECIFICATION Spec
CONSTANTS
  MaxReq = 3
  MatchMode = "Match"
  TakeMode = "Decrement"
  PruneMode = "ExpiredSerial"
  SendMode = "ExpectFirst"
  ExpiredMode = "Reset"
  Mux = "V2"
  ReplyMode = "RequestStream"
  RespMode = "Gate"
INVARIANT INV_NoReplyStreamOnV2
