\* RED (F1, main before the fix): the ack of the head holding the newest generation clears
\* the marker on its own. Sibling 2 is queued, sibling 3 retires it from the queue, 3 is
\* sent and acked, and the marker clears: 2 was never sent, 3 does not link it, and
\* nothing is left to send it. Expect: INV_ClearedScopeDelivered VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  MaxHead <- mcMaxHead
  Parent <- mcSiblings
  QueueMode = "LatestOnly"
  RetryMode = "CurrentOnly"
  CompleteRule = "Generation"
INVARIANT INV_TypeOK
INVARIANT INV_ClearedScopeDelivered
