\* RED: a broken document aborts the whole drain. d1 is written before d2, every
\* plan that reaches d2 also holds d1, and d1 never migrates, so d2 stays in the
\* log forever behind it (PROP_HealthyDrains).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 2
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
  Poisoned = {d1}
  Carry = "Abort"
  Fixed = "Never"
PROPERTY PROP_HealthyDrains
CHECK_DEADLOCK FALSE
