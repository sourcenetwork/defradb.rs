\* run-all: EncryptionPolicyInheritance.tla RED
\* a plaintext head beside an encrypted one downgrades the field (INV_NoDowngradeOfEncryptedField)
\* RED: one plaintext head turns a field plaintext. A remote plaintext block
\* merged beside an encrypted head, and the next write without config, writes
\* the encrypted field in the clear (INV_NoDowngradeOfEncryptedField).
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 1
  MaxReqWrites = 1
  MaxMerges = 1
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = TRUE
  Vacuous = FALSE
  KeepPrepared = FALSE
  ReprepareStale = TRUE
  UsePending = TRUE
  TornSnapshot = FALSE
  IgnoreConfig = FALSE
INVARIANT INV_NoDowngradeOfEncryptedField
CHECK_DEADLOCK FALSE
