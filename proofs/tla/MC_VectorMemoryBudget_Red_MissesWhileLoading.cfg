\* run-all: VectorMemoryBudget.tla RED
\* searches keep missed codes while a reload runs, taking its room
\* RED: searches keep the codes they read on a miss while a reload runs, so the misses take the room the reload needs and it publishes fewer codes than fit (INV_FullLoad).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Searches = {s1, s2, s3}
          Limit = 2
          Codes = 3
          MaxGen = 3
          AtomicTake = TRUE
          ReleaseOnDrop = TRUE
          DropOldFirst = TRUE
          NoMissesWhileLoading = FALSE
          SingleFlight = TRUE
          OwnedFinish = TRUE
          OwnedStep = TRUE
          OwnedAbandon = TRUE
          NoPendingWhileLoading = TRUE
INVARIANT INV_BudgetHolds
INVARIANT INV_Accounted
INVARIANT INV_FullLoad
INVARIANT INV_ClaimLostOnlyToNewer
INVARIANT INV_NoTakeAfterLoss
INVARIANT INV_NoClaimClearedByStaleAbandon
SYMMETRY Symmetry
