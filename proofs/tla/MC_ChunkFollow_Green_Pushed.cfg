\* run-all: ChunkFollow.tla GREEN
\* #3040: an edit's chunk delete follows its parent
\* GREEN: only the pushed deletes clean the peer up here, as for an encrypted
\* text whose merge deletes nothing. For an article the filter matches, the
\* edit's chunk delete follows the article and the dropped chunk goes. Every
\* invariant holds.
SPECIFICATION Spec
CONSTANTS
  Articles = {pub}
  Matching = {pub}
  ChunkRule = "parent"
  SyncRule = "current"
  DeletesFollow = TRUE
  Reconcile = FALSE
  Cascade = TRUE
  Embedded = FALSE
  KeepWaiting = TRUE
INVARIANT TypeOK
INVARIANT INV_ChunksFollowParent
INVARIANT INV_NoForeignChunks
INVARIANT INV_DeletesFollowParent
INVARIANT INV_SyncSendsCurrentChunks
INVARIANT INV_DroppedChunksGo
CHECK_DEADLOCK FALSE
