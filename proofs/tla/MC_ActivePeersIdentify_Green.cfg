\* GREEN: the code as written. Two peers dial in, each one's Identify
\* arrives, fails, or it hangs up, at any point around the caller's
\* question. The caller never sees the source port of a peer whose Identify
\* may still come, a peer that dials in after the call never holds the
\* answer, and the caller always gets one.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  WaitForIdentify = TRUE
  SnapshotAtAsk = TRUE
INVARIANT TypeOK
INVARIANT INV_ListenAddress
INVARIANT INV_NotHeldByLater
PROPERTY LIVE_Answered
CHECK_DEADLOCK FALSE
