\* Plants the bug of deletes that append nothing: two snapshots with one head hold different pending lists, so a load after a delete misses the deleted vector for an older search, and INV_CacheCovers fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {a, b}
          Readers = {r1, r2}
          MaxCommits = 3
          GenerationCheck = TRUE
          LoadedAtCheck = TRUE
          DeletesAppend = FALSE
          EntriesCarryCode = TRUE
          OwnWritesScan = TRUE
INVARIANT INV_NoHiddenPending
INVARIANT INV_CacheCovers
SYMMETRY Symmetry
