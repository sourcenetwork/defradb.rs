\* run-all: ChunkSigner.tla GREEN
\* a peer's chunk merges only from a signer who may update its parent
\* GREEN: the writer signs a protected article's chunks, R builds none of them
\* itself, and R's merge checks, in its own transaction, that the article has
\* arrived and that the chunk's signer may update it. Bob is granted and
\* revoked twice. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  CheckParent = TRUE
  Sign = TRUE
  WaitForParent = TRUE
  Provider = "Local"
  Rebuild = FALSE
  MaxFlips = 2
INVARIANT TypeOK
INVARIANT INV_NoRogueChunk
INVARIANT INV_WriterChunkKept
INVARIANT INV_EachChunkOnce
CHECK_DEADLOCK FALSE
