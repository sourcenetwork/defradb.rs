\* Every guard in place: the observation answers only from a state that holds every change owed, a transaction reuses no older answer, the wait ends at its deadline, and waiting spends no tries.
SPECIFICATION Spec
CONSTANTS
  Bug = "none"
  Patience = 3
  Notifications = TRUE
  MaxTries = 5
INVARIANT INV_NotOlderThanOwed INV_HoldsLatest INV_EndsInTime INV_ReuseHoldsLatest INV_BackoffHeld
CHECK_DEADLOCK FALSE
