\* Head 1 starts, head 2 supersedes it, then head 1 fails and is persisted.
\* Expect: INV_NoStaleRetry VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  MaxHead <- mcMaxHead
  Parent <- mcLinear
  QueueMode = "LatestOnly"
  RetryMode = "ReplayEvery"
  CompleteRule = "Frontier"
INVARIANT INV_TypeOK
INVARIANT INV_NoStaleRetry
