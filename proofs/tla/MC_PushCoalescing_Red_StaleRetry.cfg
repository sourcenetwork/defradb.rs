\* Head 1 is sent, head 2 registers and is queued, then head 1 fails and registers the
\* marker afresh, taking it from head 2's job. Expect: INV_NoStaleRetry VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers <- mcPeers
  MaxHead <- mcMaxHead
  Parent <- mcLinear
  QueueMode = "LatestOnly"
  RetryMode = "ReplayEvery"
  CompleteRule = "Frontier"
INVARIANT INV_TypeOK
INVARIANT INV_NoStaleRetry
