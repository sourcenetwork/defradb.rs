\* the HTTP route takes the actor from the request: a change goes in under another's credential (INV_ActsAsItsCredential)
\* RED: the HTTP route takes the acting DID from the request instead of the
\* verified credential. An actor without authority presents its own
\* delegation and names the owner as the actor of a revocation; the change
\* passes the check as the owner's and is staged under the other's
\* credential, denying the subject from the commit on. Must fail
\* INV_ActsAsItsCredential.
SPECIFICATION Spec
