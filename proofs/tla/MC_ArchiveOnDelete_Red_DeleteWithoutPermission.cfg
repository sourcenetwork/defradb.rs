\* run-all: ArchiveOnDelete.tla RED
\* a stranger the policy does not let delete deletes (INV_DeletedByPermitted)
\* RED: the delete does not ask whether its caller may delete. A stranger
\* the policy does not let delete removes the document.
\* Must fail INV_DeletedByPermitted.
SPECIFICATION Spec
CONSTANTS
  CheckPermission  = FALSE
  ArchiveAsOwner   = TRUE
  Drop             = TRUE
  VeraRefuses      = TRUE
  Overlay          = TRUE
  HistoryActorOnly = TRUE
  SpareOnlyDeleter = TRUE
  ArchiveUncounted = TRUE
  ArchiveOffNode   = TRUE
  ArchiveOffTxn    = TRUE
  First            = "archive"
INVARIANT TypeOK
INVARIANT INV_DeletedByPermitted
