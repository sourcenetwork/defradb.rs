\* run-all: VerifiedRemoteWrite.tla RED
\* an owed command is sent under an expired credential (INV_NothingSentStale)
\* RED: The Node sends an owed command with the credential recorded for it
\* without checking it again, so a credential that expired since the commit is
\* used. Must fail INV_NothingSentStale.
SPECIFICATION Spec
CONSTANT Bug = "sentExpired"
INVARIANT INV_NothingSentStale
CHECK_DEADLOCK FALSE
