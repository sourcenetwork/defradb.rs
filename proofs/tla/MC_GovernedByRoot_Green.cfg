\* run-all: GovernedByRoot.tla GREEN
\* a validating node judges every rooted or claimed collection; a node with no validator behaves as before
\* GREEN: the rule has both arms (a claimed name, or a validator and a declared root with no policy); a rooted collection with a policy is not judged unless claimed; a node with no validator holds only what it claimed and merges the rest; a collection with no root and no claim merges as before.
