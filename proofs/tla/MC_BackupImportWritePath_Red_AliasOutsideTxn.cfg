\* RED: aliases are registered blindly, outside a validated read. Another
\* writer claims alias c after its batch's check; the registration overwrites
\* the claim. Must fail INV_AliasNeverStolen.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = FALSE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  HoldImport          = TRUE
  DetachedImport      = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  OneByOneOnRefusal   = TRUE
  RegisterEachOnRefusal = TRUE
  RequireNode         = TRUE
INVARIANT INV_AliasNeverStolen
CHECK_DEADLOCK FALSE
