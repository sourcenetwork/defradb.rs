\* run-all: BackupExportAccess.tla GREEN
\* #2321: every way in exports through the core, which checks read-document before it reads
\* GREEN: the embedded node, HTTP, the CLI and FFI all call the core's
\* export, which checks the permission first. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  CoreChecks = TRUE
  Forwarding = {"node", "http", "cli", "ffi"}
INVARIANT TypeOK
INVARIANT INV_NoReadWithoutPermission
INVARIANT INV_SameAnswer
CHECK_DEADLOCK FALSE
