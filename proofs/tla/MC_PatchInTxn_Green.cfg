\* GREEN: patch_collection_in_txn_as. The patch reads and writes through the
\* caller's transaction, its follow-up work waits for the commit, and a conflict
\* goes back to the caller. It runs behind a statement savepoint and drops the
\* collections it changed from the transaction's cache. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  ReadThroughTxn = TRUE
  WriteThroughTxn = TRUE
  FinishOnCommit = TRUE
  RetryHides = FALSE
  Savepoint = TRUE
  RefreshCatalog = TRUE
INVARIANT TypeOK INV_IsolatedUntilCommit INV_FinishOnlyAfterCommit INV_ConflictReachesCaller INV_SeesOwnWrites INV_FailedPatchLeavesNothing INV_SeesOwnPatch
CHECK_DEADLOCK FALSE
