\* run-all: PatchInTxn.tla GREEN
\* #2374: a patch in a txn is staged in it, seen by it alone, published and followed up after commit, conflicts with a patch committed first
\* GREEN: patch_collection_in_txn_as. The patch is written into the caller's
\* transaction, which forgets its cached definitions; the shared cache and the
\* follow-up work wait for the commit, which awaits them before it returns; a
\* failed patch is rolled back to its savepoint; and the definitions the patch
\* read are checked at commit, so a patch committed first makes it conflict.
SPECIFICATION Spec
CONSTANTS
  WriteThroughTxn = TRUE
  PublishOnCommit = TRUE
  FollowUpOnCommit = TRUE
  RefreshCatalog = TRUE
  RollBackFailed = TRUE
  RestoreLensStore = TRUE
  AwaitFollowUp = TRUE
  ValidateDefinitions = TRUE
INVARIANT TypeOK INV_IsolatedUntilCommit INV_NoTraceAfterRollback INV_SeesOwnPatch INV_FailedPatchLeavesNothing INV_FollowUpRanWhenCommitReturns INV_NoLostPatch
CHECK_DEADLOCK FALSE
