\* GREEN: patch_collection_in_txn_as. The patch reads and writes through the
\* caller's transaction, its follow-up work waits for the commit, and a conflict
\* goes back to the caller. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  ReadThroughTxn = TRUE
  WriteThroughTxn = TRUE
  FinishOnCommit = TRUE
  RetryHides = FALSE
INVARIANT TypeOK INV_IsolatedUntilCommit INV_FinishOnlyAfterCommit INV_ConflictReachesCaller INV_SeesOwnWrites
CHECK_DEADLOCK FALSE
