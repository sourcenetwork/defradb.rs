\* GREEN, deep: as MC_DeferredIndex_Green, with one drain and three writes, so an
\* explicit transaction, plain writes around it and a crash all fit in one run.
\* Every read is exact, inside the transaction too, the stored entries always
\* match the position records, and no drain aborts the transaction.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
  Poisoned = {}
  Carry = "Tail"
  Fixed = "Never"
INVARIANT INV_TypeOK INV_ReadExact INV_TxReadExact INV_RecordMatchesIndex INV_SettledIndexExact INV_TxNotAbortedByDrain
CHECK_DEADLOCK FALSE
