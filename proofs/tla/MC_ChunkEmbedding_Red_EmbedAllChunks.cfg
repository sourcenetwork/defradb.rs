\* run-all: ChunkEmbedding.tla RED
\* unchanged chunks are embedded again (INV_UnchangedChunkNoCall)
\* RED: the bug embeds every chunk of the new text, not only the missing
\* ones. An edit that keeps a paragraph asks the model for that paragraph
\* again (INV_UnchangedChunkNoCall).
SPECIFICATION Spec
CONSTANTS
  KeyByText = TRUE
  WantOnlyMissing = FALSE
  ResolveOutside = TRUE
  WantEveryMiss = TRUE
  CommitNeedsVectors = TRUE
  Unconfigured = FALSE
  RefuseUnconfigured = TRUE
INVARIANT INV_UnchangedChunkNoCall
CHECK_DEADLOCK FALSE
