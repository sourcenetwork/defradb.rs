\* RED: prune removes entries whose deadline has not passed. A request is
\* sent, its entry is pruned at once, and the honest reply is refused
\* (INV_SolicitedAdmitted).
SPECIFICATION Spec
CONSTANTS
  MaxReq = 3
  MatchMode = "Match"
  TakeMode = "Decrement"
  PruneMode = "Any"
  SendMode = "ExpectFirst"
  ExpiredMode = "Reset"
  Mux = "V1"
  ReplyMode = "RequestStream"
  RespMode = "Refuse"
INVARIANT INV_SolicitedAdmitted
