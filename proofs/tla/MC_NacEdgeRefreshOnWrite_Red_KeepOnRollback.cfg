\* RED: a savepoint rolled back undoes the NAC write made after it but keeps
\* its registered rebuild. The commit rebuilds the snapshot for a transaction
\* whose surviving writes touched no NAC tuple (INV_NoRebuildWithoutNacWrite).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2, d3}
  NacDocs = {d1, d2}
  Bug = "KeepOnRollback"
INVARIANT TypeOK
INVARIANT INV_NoRebuildWithoutNacWrite
CHECK_DEADLOCK FALSE
