\* run-all: ForeignPolicyCreate.tla RED
\* a caller that stops waiting also drops the create's in-flight mark, so an add routes while the handed-off create lands beside it (INV_NoShadow)
\* RED: after the create looks for a claim and is sent, the caller stops and the mark goes. An add then finds neither a create in flight nor a pending request and routes P; the create lands, so P is routed while the node's own deployment holds it. Must fail INV_NoShadow.
SPECIFICATION Spec
CONSTANT Bug = "forgetsMark"
INVARIANT INV_NoShadow
CHECK_DEADLOCK FALSE
