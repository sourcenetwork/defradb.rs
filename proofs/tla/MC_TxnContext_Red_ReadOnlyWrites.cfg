\* RED: the read-only flag is not checked at the write. A read-only transaction takes a key into its private writes (INV_ReadOnlyNeverWrites).
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  t1 = t1
  t2 = t2
  k1 = k1
  Callers = {a, b}
  Txns    = {t1, t2}
  Keys    = {k1}
  Bug     = "ReadOnlyWrites"
INVARIANT TypeOK
INVARIANT INV_ReadOnlyNeverWrites
