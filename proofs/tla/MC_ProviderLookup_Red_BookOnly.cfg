\* RED: the answer carries only records from the helper's book. The helper is
\* the owner and never holds its own record there, so the reader never finds
\* it (LIVE_Found).
SPECIFICATION Spec
CONSTANTS
  HelperIsOwner = TRUE
  AskMode = "Ask"
  GuardMode = "Empty"
  AnswerMode = "BookOnly"
PROPERTY LIVE_Found
CHECK_DEADLOCK FALSE
