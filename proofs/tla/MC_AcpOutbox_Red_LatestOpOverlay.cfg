\* RED: the deny overlay follows the latest stored record of a tuple, as #2954
\* words it. The provider holds a tuple. The creator deletes it, then an actor
\* without authority stages an add of the same tuple. The add is now the
\* latest record, so the denial is lifted and the provider, which has not seen
\* the delete yet, still says yes. Once everything is settled the delete has
\* applied and the add was refused: the node honoured an access the provider
\* will not give. Must fail INV_NoWidening.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"node"}
  Preexisting              = TRUE
  InitTuples               = {"g"}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = TRUE
  DenyRule                 = "LatestOp"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
INVARIANT INV_NoWidening
CHECK_DEADLOCK FALSE
