\* The bug: Kademlia's dial to a held peer is refused before the swarm checks
\* its peer condition. A peer disconnects, an explicit connect to it is in
\* flight, and Kademlia dials it too: instead of being told a dial is already
\* in progress, the query is told the peer is denied and gives up on it while
\* the explicit dial may still connect.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers = {p1, p2, p3}
  Low = 1
  High = 2
  Silence = 3
  MaxTime = 6
  Mode = "refuseFirst"
INVARIANTS TypeOK INV_InFlightDialNotDenied
