\* run-all: ConnmgrTrimSilence.tla GREEN
\* no redial of a just-closed peer, trims a silence period apart, explicit and in-flight dials never refused
\* The code, with three peers (enough to go over high water): any
\* last-connection close holds Kademlia's redials of that peer, and a trim
\* also starts a silence period. Peers dial explicitly at any time,
\* dials take time, and Kademlia dials any peer not held. Kademlia never undoes
\* a disconnect, trims stay a silence period apart, an explicit dial is never
\* refused, and a Kademlia dial that meets a dial in flight is never refused.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers = {p1, p2, p3}
  Low = 1
  High = 2
  Silence = 3
  MaxTime = 6
  Mode = "correct"
INVARIANTS TypeOK INV_NoRedialOfPruned INV_TrimsSpaced INV_ExplicitNeverRefused INV_InFlightDialNotDenied
