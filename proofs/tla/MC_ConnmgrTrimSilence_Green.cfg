\* The code: a trim holds Kademlia's redials of the peers it pruned and starts a
\* silence period. Peers dial in at any time and Kademlia dials any peer not
\* held. Kademlia never undoes a trim and trims stay a silence period apart.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Peers = {p1, p2, p3, p4}
  Low = 1
  High = 2
  Silence = 3
  MaxTime = 6
  Mode = "correct"
INVARIANTS TypeOK INV_NoRedialOfPruned INV_TrimsSpaced
