\* RED: the standalone deferral is OFF. A counter block arrives on its own before its
\* document has a value. The merge claims the block's applied key, throws away the
\* value it computed, and reports the block merged. The composite then writes the
\* value, finds the key claimed and skips the increment: blob < doneCount, the
\* increment is lost. INV_NoLoss catches it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  LocalOps  = {l1}
  RemoteOps = {}
  StoreMode = "Unified"
  Dedup     = "On"
  LateOps   = {s1}
  Defer     = "Off"
INVARIANT INV_TypeOK
INVARIANT INV_NoLoss
