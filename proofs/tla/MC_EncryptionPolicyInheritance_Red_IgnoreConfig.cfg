\* run-all: EncryptionPolicyInheritance.tla RED
\* the builder drops rule (a), so an explicit config writes plaintext (INV_ExplicitConfigEncrypts)
\* RED: the builder drops rule (a) and decides a write with an explicit
\* config as if it had none. On a document whose fields are plaintext or
\* unwritten, a write that asks to encrypt a field gets plaintext from its
\* heads or from rule (c), and the field the caller asked to encrypt is
\* written in the clear (INV_ExplicitConfigEncrypts).
SPECIFICATION Spec
CONSTANTS
  Fields = {"f1", "f2", "f3"}
  Tear = "f2"
  MaxWrites = 1
  MaxReqWrites = 1
  MaxMerges = 0
  KeepCompositeLink = FALSE
  AnyField = FALSE
  PlainHeadedDocKey = FALSE
  PlainHeadWins = FALSE
  Vacuous = FALSE
  KeepPrepared = FALSE
  ReprepareStale = TRUE
  UsePending = TRUE
  TornSnapshot = FALSE
  IgnoreConfig = TRUE
INVARIANT INV_ExplicitConfigEncrypts
CHECK_DEADLOCK FALSE
