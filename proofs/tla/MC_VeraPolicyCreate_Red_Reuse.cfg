\* RED: every send draws a new nonce. A send that created the policy but
\* whose answer was lost is sent again under another nonce, and one request
\* leaves two policies behind (INV_OneRequestOnePolicy).
SPECIFICATION Spec
CONSTANTS
  Requests = {r1, r2}
  Creators = {c1, c2}
  Defs = {d1, d2}
  Nonces = {n1, n2}
  MaxSends = 2
  Enforced = {"adopt", "check", "creator", "caller"}
INVARIANT INV_OneRequestOnePolicy
CHECK_DEADLOCK FALSE
