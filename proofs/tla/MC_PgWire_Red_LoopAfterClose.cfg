\* RED (the CI bug): no is_closed check after a turn. A DID user's wrong token
\* is a fatal error: report closes the connection, and the loop reads the next
\* message anyway (a close only shuts the writing half). Must fail
\* INV_NothingAfterEnd.
SPECIFICATION Spec
CONSTANTS
  Limit              = 2
  MaxTime            = 3
  MaxMsgs            = 3
  PreMsgs            = {"did"}
  PostMsgs           = {"pwBad", "query"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = FALSE
INVARIANT TypeOK
INVARIANT INV_NothingAfterEnd
CHECK_DEADLOCK FALSE
