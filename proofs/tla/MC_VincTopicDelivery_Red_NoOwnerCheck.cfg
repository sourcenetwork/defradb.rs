\* RED: a waiting publish leaves the topic it joined whatever happened
\* meanwhile. The engine subscribes while a KMS reply waits; the reply goes
\* out and leaves, and the engine's subscription is gone with it.
\* Must fail INV_EngineKeepsItsTopic.
SPECIFICATION Spec
CONSTANTS
  Nodes         = {a, b}
  RawTopic      = TRUE
  Gate          = TRUE
  RawFirst      = TRUE
  SessionFilter = TRUE
  OwnerCheck    = FALSE
  EngineFilter  = TRUE
INVARIANT TypeOK
INVARIANT INV_EngineKeepsItsTopic
CHECK_DEADLOCK FALSE
