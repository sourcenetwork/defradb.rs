\* RED: an ended hold leaves the topic whatever happened meanwhile. The
\* engine subscribes while a KMS reply's hold lasts; the hold ends and
\* leaves, and the engine's subscription is gone with it.
\* Must fail INV_EngineKeepsItsTopic.
SPECIFICATION Spec
CONSTANTS
  Nodes         = {a, b}
  RawTopic      = TRUE
  Gate          = TRUE
  RawFirst      = TRUE
  SessionFilter = TRUE
  OwnerCheck    = FALSE
  HoldKeep      = TRUE
  EngineFilter  = TRUE
INVARIANT TypeOK
INVARIANT INV_EngineKeepsItsTopic
CHECK_DEADLOCK FALSE
