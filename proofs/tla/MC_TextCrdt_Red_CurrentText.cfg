\* RED: a received block's position is read against the text the receiving
\* peer holds now instead of the block's parent version. The text is "a";
\* Alice inserts "x" after a while Bob inserts "y" after a. Bob's peer reads
\* Alice's "position 1" against its own "ay": a already has a right child, so
\* x is hung under y instead of under a, a place Alice's version never chose.
\* Must fail INV_PlacedAsIntended.
SPECIFICATION Spec
CONSTANTS
  Peers        = {p1, p2}
  MaxBlocks    = 4
  SiblingKey   = "id"
  CausalBuffer = TRUE
  ResolveAt    = "current"
  PlaceRule    = "fugue"
  ReplayFrom   = "critical"
  NullRule     = "heads"
INVARIANT TypeOK
INVARIANT INV_PlacedAsIntended
