\* Plants the bug: the deadline never ends the wait, and no owed record notifies. The
\* wait runs past its deadline with nothing to wake it: INV_EndsInTime fails.
SPECIFICATION Spec
CONSTANTS
  Bug = "noExpiry"
  Patience = 3
  Notifications = FALSE
  MaxTries = 5
INVARIANT INV_EndsInTime
CHECK_DEADLOCK FALSE
