\* RED: NAC is enabled without passing the node identity as its owner. The node
\* starts with access control on and no one allowed to manage it. Must fail
\* INV_NacAsAsked.
SPECIFICATION Spec
CONSTANTS
  ScheduleToIroh       = TRUE
  ShutdownOnListenFail = TRUE
  ValidateFirst        = TRUE
  OwnerPassed          = FALSE
  ConnectAfterNac      = TRUE
  BootstrapNonFatal    = TRUE
INVARIANT INV_NacAsAsked
CHECK_DEADLOCK FALSE
