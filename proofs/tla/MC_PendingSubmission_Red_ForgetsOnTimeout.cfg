\* RED: the journal drops the request when the deadline passes. A request the
\* node may still execute is no longer known to the worker. Must fail
\* INV_RetainedUntilConfirmed.
SPECIFICATION Spec
CONSTANTS
  Resends          = TRUE
  KeepsTrying      = TRUE
  RetainsOnTimeout = FALSE
  NodeDedupes      = TRUE
  Disturbances     = 0
INVARIANT INV_RetainedUntilConfirmed
CHECK_DEADLOCK FALSE
