\* The bug: the save writes without refusing a deleted document, as the
\* upsert alone did. Its lookup finds the document deleted, the upsert
\* cannot see it, and the content is added under another ID. This must
\* fail INV_NoFork.
INIT Init
NEXT Next
CONSTANT CheckDeleted = FALSE
CONSTANT OneTransaction = TRUE
INVARIANT INV_NoFork
CHECK_DEADLOCK FALSE
