\* RED: prune runs on another task, between an expect reading an expired
\* entry and adding to it. The add lands on the removed entry, the request
\* goes out with nothing expected, and its reply is refused
\* (INV_SolicitedAdmitted).
SPECIFICATION Spec
CONSTANTS
  MaxReq = 3
  MatchMode = "Match"
  TakeMode = "Decrement"
  PruneMode = "ExpiredConcurrent"
  SendMode = "ExpectFirst"
  ExpiredMode = "Reset"
  Mux = "V1"
  ReplyMode = "RequestStream"
  RespMode = "Refuse"
INVARIANT INV_SolicitedAdmitted
