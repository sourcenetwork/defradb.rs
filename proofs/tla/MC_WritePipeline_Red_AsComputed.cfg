\* RED: each block is stored as soon as it is made, the way batch and
\* explicit-transaction creates built blocks before the pipeline. A field
\* block sits in the transaction while the composite does not exist yet
\* (INV_NoStoreBeforeComposite).
SPECIFICATION Spec
CONSTANTS
  Fields = {"a", "b"}
  MaxAttempts = 4
  StoreMode = "AsComputed"
  IdMode = "Once"
  KeySource = "Memo"
INVARIANT INV_NoStoreBeforeComposite
CHECK_DEADLOCK FALSE
