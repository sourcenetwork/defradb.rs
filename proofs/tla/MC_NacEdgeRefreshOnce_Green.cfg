\* GREEN: the real code. Three documents, two of whose writes also write NAC
\* tuples, written in any order around a savepoint that may be rolled back:
\* the commit rebuilds the edge snapshot exactly once when a NAC write
\* survived, and never otherwise.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2, d3}
  NacDocs = {d1, d2}
  Bug = "None"
INVARIANT TypeOK
INVARIANT INV_RebuiltAfterNacWrite
INVARIANT INV_AtMostOneRebuild
CHECK_DEADLOCK FALSE
