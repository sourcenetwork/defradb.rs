\* run-all: StorePurge.tla RED
\* defradb start only pins its Orbis signer and the restart loses it (INV_SignerSurvivesRestart)
\* RED: `defradb start` only pins its Orbis signer, so the identity clear
\* at the end of the purged run drops it and the restarted node signs with
\* the wrong identity. Must fail INV_SignerSurvivesRestart.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Cli"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Developments = {TRUE}
  Handlers = {TRUE}
  HeldElsewhere = {FALSE}
  OtherCallers  = {FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
  SignerHeld               = FALSE
INVARIANT INV_SignerSurvivesRestart
CHECK_DEADLOCK FALSE
