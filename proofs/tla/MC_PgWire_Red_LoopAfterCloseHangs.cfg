\* RED (the CI bug, as CI saw it): no is_closed check after a turn. After a
\* fatal error the loop waits for the client's next message, and a client that
\* waits for the server to close (as a cancel request's client does) never
\* sends one: both wait forever. Must fail LIVE_Ends.
SPECIFICATION Spec
CONSTANTS
  Limit              = 2
  MaxTime            = 3
  MaxMsgs            = 3
  PreMsgs            = {"did", "cancel"}
  PostMsgs           = {"pwBad", "query"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = FALSE
INVARIANT TypeOK
PROPERTY LIVE_Ends
CHECK_DEADLOCK FALSE
