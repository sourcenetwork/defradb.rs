\* RED: the head is read before the subscription. A block that finalizes in
\* between is neither the head nor streamed, and the drained light client
\* stands one block behind until the next one comes. Must fail INV_Current.
SPECIFICATION Spec
CONSTANTS
  MaxHeight      = 3
  MaxTerm        = 1
  HeadFirst      = TRUE
  FreshOnly      = TRUE
  SubscribeFirst = FALSE
  KeepLaterTerms = TRUE
  Verify         = TRUE
INVARIANT TypeOK
INVARIANT INV_Current
