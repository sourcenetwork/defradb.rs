\* run-all: ChunkCleanup.tla RED
\* a merge deletes no chunk (INV_StoredIsSplit)
\* RED: the bug plants a merge that builds the winning text's chunks but
\* deletes none. A peer whose own edit lost keeps that edit's chunk live, and
\* no edit of its own will ever delete it (INV_StoredIsSplit).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CleanWrites = TRUE
  CleanMerges = FALSE
  DropStale = TRUE
  DeleteGuard = TRUE
  Ids = "source"
  Reanchor = TRUE
  KeepWaiting = TRUE
INVARIANT INV_StoredIsSplit
CHECK_DEADLOCK FALSE
