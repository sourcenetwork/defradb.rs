\* RED: a refused announcement is parked in an in-memory side queue. A crash
\* wipes the queue, and nothing durable remembers the document, so it is lost.
\* Expect INV_HeardIsOwned to be violated.
SPECIFICATION Spec
CONSTANTS
  Docs <- mcDocs
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  MemCap = 1
  MaxCrashes = 1
  PeerCap = 3
  TotalCap = 3
  Mode = "MemoryDefer"
  Promote = TRUE
  Lane = "Wait"
CHECK_DEADLOCK TRUE
INVARIANT INV_TypeOK
INVARIANT INV_HeardIsOwned
