\* RED: the completion sender is not owned by the drain. It stays in the
\* shared state, and the drain sends it at its end. The drain is cancelled
\* (the runtime is torn down under it, or the winner running it in place is
\* cancelled): nothing sends and nothing drops the sender, which the callers'
\* own handles keep alive, so every other caller waits forever. Must fail
\* LIVE_CallersReturn.
SPECIFICATION Spec
CONSTANTS
  Callers          = {"c1", "c2"}
  Tasks            = {"t1"}
  Late             = {}
  CanKill          = TRUE
  SwapFlag         = TRUE
  AtomicSpawn      = TRUE
  RunRefused       = TRUE
  DrainOwnsSender  = FALSE
  WaitForPruners   = TRUE
  PrunerChecksFlag = TRUE
  RecheckAfterPush = TRUE
  AbortAtDeadline  = TRUE
INVARIANT TypeOK
PROPERTY LIVE_CallersReturn
CHECK_DEADLOCK FALSE
