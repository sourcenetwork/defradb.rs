\* GREEN: the code as written, with vinc confirming only the subscription
\* that asked (#483). Two subscribe attempts, an unsubscribe, a publish hold
\* and its end, and one lost event, in any order: every "subscribed" answer
\* comes while the hub holds the current join, no subscribe fails once the
\* node knows it is confirmed, no wait misses its wake-up, no subscription is
\* left with no confirmation to come, and vinc is joined exactly while the
\* engine or a hold has the topic.
SPECIFICATION Spec
CONSTANTS
  Calls            = {c1, c2}
  MaxUnsub         = 1
  MaxHold          = 1
  MaxLost          = 1
  ConfirmCheck     = TRUE
  StillJoined      = TRUE
  Recheck          = TRUE
  Rollback         = TRUE
  ClearOnLeave     = TRUE
  HubTagsLists     = TRUE
  RejoinAfterDrain = TRUE
INVARIANT TypeOK
INVARIANT INV_OkOnlyWhenHeld INV_FailOnlyUnconfirmed INV_NoMissedWake INV_NoStuckSubscription INV_JoinedMatches
CHECK_DEADLOCK FALSE
