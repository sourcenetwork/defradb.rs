\* GREEN: the code as written, in the hardest world: three streams, a table
\* of two (so one is refused), drop messages that may be lost, a connection
\* that may end, and a clock that reaches every deadline. Every answer is
\* given once, the table stays bounded, and it empties for good.
SPECIFICATION Spec
CONSTANTS
  N              = 3
  Cap            = 2
  D              = 1
  Lossy          = TRUE
  DeadlinePasses = TRUE
  TakeOnce       = TRUE
  DropReset      = TRUE
  SweepGuard     = TRUE
  CapGuard       = TRUE
INVARIANT TypeOK
INVARIANT INV_OneOutcome
INVARIANT INV_Bounded
INVARIANT INV_NoWriteAfterEnd
PROPERTY LIVE_NoLeak
PROPERTY LIVE_DropResets
CHECK_DEADLOCK FALSE
