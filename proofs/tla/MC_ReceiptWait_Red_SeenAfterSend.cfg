\* the height read after the send misses a header verified in between
\* RED: the loop reads the verified height after it sends, when the wait
\* begins. The request's block is finalized and verified between the send and
\* that read, so the wait waits for a height past it and no header wakes it.
\* Must fail INV_Prompt.
SPECIFICATION Spec
CONSTANTS
  EventWake      = TRUE
  SeenBeforeSend = FALSE
  Bounded        = TRUE
  MaxHeight      = 3
  Fallback       = 2
INVARIANT INV_Prompt
CHECK_DEADLOCK FALSE
