\* run-all: AddView.tla RED
\* Views are created one by one instead of in one transaction: a failed create leaves some views (INV_AllOrNone)
\* RED: each view is committed on its own. When a later create fails, the
\* request ends with only some of its views, rather than none.
SPECIFICATION Spec
CONSTANTS
  Views = {"a", "b"}
  CoreChecks = {"nac", "sdl", "one", "cid", "chunk", "downsample", "policy", "identity"}
  ServerChecks = {"nac", "sdl", "one", "cid", "chunk", "downsample", "policy", "identity"}
  DocumentAcp = {"node", "server"}
  CreateMode = "OneByOne"
  BuildFirst = FALSE
INVARIANT INV_AllOrNone
CHECK_DEADLOCK FALSE
