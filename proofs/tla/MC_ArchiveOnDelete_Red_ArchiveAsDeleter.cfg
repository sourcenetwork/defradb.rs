\* a writer's delete owes the archive as the writer, not the owner (INV_ArchiveAsOwner)
\* RED: the archive is made as whoever deleted. A writer the policy lets
\* delete deletes the document and its archive is owed as the writer, to
\* be sent under the writer's authority, which Vera refuses: the object is
\* never archived. Must fail INV_ArchiveAsOwner.
SPECIFICATION Spec
CONSTANTS
  CheckPermission  = TRUE
  ArchiveAsOwner   = FALSE
  Drop             = TRUE
  VeraRefuses      = TRUE
  Overlay          = TRUE
  HistoryActorOnly = TRUE
  SpareOnlyDeleter = TRUE
  ArchiveUncounted = TRUE
  ArchiveOffNode   = TRUE
  ArchiveOffTxn    = TRUE
  First            = "archive"
INVARIANT TypeOK
INVARIANT INV_ArchiveAsOwner
