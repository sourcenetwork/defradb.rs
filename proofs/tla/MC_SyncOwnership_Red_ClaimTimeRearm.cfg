\* RED: a fetch gives its slot back after one attempt, but the clock fixed the
\* root's next deadline when it claimed the slot, and it passes while the
\* attempt runs. When the attempt fails the root is already due, ahead of
\* every head acknowledged after its deadline passed, so the clock hands it
\* the slot again and INV_ReadyRootsServedInOrder fails.
SPECIFICATION WSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1, d2}
  Cols           = {}
  MaxV           = 1
  Cap            = 2
  FetchCap       = 1
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MaxAttempts    = 3
  AttemptMode    = "PerAttempt"
  RearmMode      = "ClaimTime"
  ExpiryMode     = "AckRetained"
  Dead           = {}
INVARIANT INV_DispatchTypeOK
INVARIANT INV_ReadyRootsServedInOrder
