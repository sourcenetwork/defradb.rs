\* RED: the body is read before asking for budget, as on main today. Every
\* waiting bulk stream already has its body in memory, which goes over the bulk
\* budget. Expect INV_ResidentWithinBudget to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  ConnOf <- mcConnOf
  ClassOf <- mcClassOf
  LaneOf <- mcLaneOf
  Classes <- mcClasses
  Lanes <- mcLanes
  Healthy = "h1"
  Stalls <- mcStalls
  StuckClasses <- mcStuckClasses
  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "PerClass"
  ShareMode = "PerConnection"
  DrainMode = "PerLane"
  LeaseMode = "UntilHandled"
  ReadMode = "ReadFirst"
  DeadlineMode = "Deadline"
  ReadDeadlineMode = "Deadline"
INVARIANT INV_TypeOK
INVARIANT INV_ResidentWithinBudget
