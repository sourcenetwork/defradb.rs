\* RED: a hang-up quiets the peer only when a link is up. A DisconnectPeers
\* for a peer with no live link then leaves it loud, and a later list naming
\* it has the node dial it. Must fail NoLocalRedial.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = TRUE
  QuietUnlinked = FALSE
  RemoteQuiet = TRUE
  Unquiet = TRUE
  OnlyDiscoveryChecked = TRUE
  RecheckQuiet = TRUE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT NoLocalRedial
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
