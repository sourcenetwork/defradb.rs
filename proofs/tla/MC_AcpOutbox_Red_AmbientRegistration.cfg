\* RED: a submission of the registration is sent with whatever token the
\* process holds for the creator. The create's request carried nothing that
\* lets the node register the document, or a delegation that has run out;
\* the commit's own submission, or a retry after it, sends it all the same.
\* Must fail INV_PresentedAuthority.
