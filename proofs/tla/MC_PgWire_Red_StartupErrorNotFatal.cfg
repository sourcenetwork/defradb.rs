\* RED (contract broken): the startup handler returns a plain ERROR, not a
\* FATAL one. report treats the startup message like a simple query: the
\* connection becomes ready, stays open, and runs the next query with nobody
\* logged in. DIDAuthHandler only returns FATAL errors. Must fail
\* INV_NoQueryBeforeStartup.
SPECIFICATION Spec
CONSTANTS
  Limit              = 2
  MaxTime            = 3
  MaxMsgs            = 2
  PreMsgs            = {"anon"}
  PostMsgs           = {"query"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = FALSE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_NoQueryBeforeStartup
CHECK_DEADLOCK FALSE
