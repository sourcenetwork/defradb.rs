\* GREEN: no explicit transaction. The node opens its read-only transaction
\* first and reads NAC, the block and document ACP all at that one view,
\* while other transactions commit around it. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  InTxn = FALSE
  CheckNac = TRUE
  CheckAcp = TRUE
  CheckBlock = TRUE
  NacAt = "view"
  AcpAt = "view"
  BlockAt = "view"
  MaxEnv = 2
INVARIANT TypeOK INV_VerifiedAtOnePoint INV_NoValidRejected
CHECK_DEADLOCK FALSE
