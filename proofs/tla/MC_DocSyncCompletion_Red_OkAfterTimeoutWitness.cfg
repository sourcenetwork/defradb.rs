\* run-all: DocSyncCompletion.tla RED
\* RED, a witness and not a bug: the contract before and after the fix. A timeout ends the sync while an asked document has not merged, and the caller is told Ok (INV_OkMeansEveryDocMerged is not promised). Ok after a timeout means only that the sync stopped waiting; the caller reads back what it needs.
SPECIFICATION Spec
CONSTANTS
  Docs         = {d1, d2, d3}
  Peers        = {p1}
  MaxReports   = 4
  CountReports = FALSE
  FilterAsked  = TRUE
INVARIANT TypeOK
INVARIANT INV_OkMeansEveryDocMerged
CHECK_DEADLOCK FALSE
