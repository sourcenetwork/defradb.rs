\* RED: the deadline is not checked before a resend. A peer that subscribes as the deadline
\* passes wakes the request, and it is published again after its deadline (or a stalled
\* publish runs on past it). Fails NoResendAfterDeadline.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  HoldOnRefusal = TRUE
  ResendOnJoin = TRUE
  WatchBeforePublish = TRUE
  DedupeReplies = TRUE
  StopAtDeadline = FALSE
INVARIANT TypeOK
INVARIANT Delivered
INVARIANT OneReplyEach
INVARIANT RefusedOnlyUnsent
INVARIANT NoResendAfterDeadline
