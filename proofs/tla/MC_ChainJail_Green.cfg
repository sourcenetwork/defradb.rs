\* GREEN: evidence-only jail, enforced, gossiped. No honest node is jailed, none merges a fork, and every honest node jails the cheater.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Honest <- mcHonest
  Cheater <- mcCheater
  Peers <- mcPeers
  Heights <- mcHeights
  CheckEvidence = TRUE
  EnforceJail = TRUE
  GossipEvidence = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWrongfulJail
INVARIANT INV_NoForkMerged
PROPERTY PROP_EveryoneJails
