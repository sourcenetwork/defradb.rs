\* any policy under the id adopted: an edited one is handed back (INV_ReturnedIsOwn)
\* RED: whatever policy holds the id is adopted. Its owner edited it after it
\* was created, and the request hands back an id whose policy is no longer the
\* definition it asked for (INV_ReturnedIsOwn).
SPECIFICATION Spec
CONSTANTS
  Requests = {r1, r2}
  Creators = {c1, c2}
  Defs = {d1, d2}
  Nonces = {n1, n2}
  MaxSends = 2
  Enforced = {"reuse", "adopt", "creator", "caller"}
INVARIANT INV_ReturnedIsOwn
CHECK_DEADLOCK FALSE
