\* RED: the cut is read when the report is published, not with the term. A
\* newer term is certified while the replays run, and the event names the old
\* term with the new one's cut. Must fail INV_CutOfTerm.
SPECIFICATION Spec
CONSTANTS
    Submissions = {1, 2}
    MaxTerm = 2
    MaxFaults = 1
    Publish = TRUE
    AfterAll = TRUE
    Once = TRUE
    KeepOwed = TRUE
    CutOfTerm = FALSE
    NameUnrestorable = TRUE
    NameClosed = TRUE
    Recorded = TRUE
INVARIANT
    TypeOK
    INV_CutOfTerm
