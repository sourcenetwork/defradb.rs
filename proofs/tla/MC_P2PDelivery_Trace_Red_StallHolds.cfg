\* RED (#0a): h's first attempt for h1 gets nothing and keeps its fetch
\* slot through the backoff, so a dead provider can hold the pool. The
\* fixed design frees the slot after each attempt, so the replay deadlocks
\* at that stall.
SPECIFICATION TraceSpec
CONSTANTS
  Nodes <- tNodes
  Repl <- tRepl
  Heads <- tHeads
  Author <- tAuthor
  Parent <- tParent
  Prio <- tPrio
  KeyOrder <- tKeyOrder
  Base <- tNoHeads
  Fresh <- tHeads
  Backlogs <- tBacklogs
  Trickle <- tNoHeads
  Dead <- tNoHeads
  PullPeer <- tPullPeer
  PullAt <- tNodes
  Storm <- tNodes
  Crashable <- tNodes
  ConnectedAtStart = "down"
  Trace <- mStallHolds
  K = 4
  Permits = 4
  PeerPermits = 3
  MemCap = 1000
  PeerQuota = 250
  DurCap = 4000
  MaxCrash = 3
  MaxRegFail = 0
  MaxDisc = 0
  MaxCont = 0
  CoverRule = "Ancestry"
  ShutdownOrder = "DrainFirst"
  ForwardMode = "BeforeMark"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Kept"
  FanoutMode = "PerPeer"
  SlotBeforePermit = FALSE
  DispatchPath = "Direct"
