\* run-all: StorePurge.tla RED
\* a node not in development mode accepts the purge and wipes (INV_PurgeOnlyInDevelopment)
\* RED: the development-mode check is gone, so a node that is not in
\* development mode accepts a purge from any client allowed to ask, and the
\* store is wiped where Go refuses with "operation not permitted whilst
\* development mode is disabled". Must fail INV_PurgeOnlyInDevelopment.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Developments = {FALSE}
  Handlers = {TRUE}
  HeldElsewhere = {FALSE}
  OtherCallers  = {FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = FALSE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
  SignerHeld               = TRUE
INVARIANT INV_PurgeOnlyInDevelopment
CHECK_DEADLOCK FALSE
