\* run-all: ReindexFailureListing.tla GREEN
\* a listed failure is the current reindex's, and none outlives the reindex
\* GREEN: the code. A stopped rebuild writes its failure only onto the record
\* of its own token, a newly owed reindex starts without one, and the failure
\* lives in the owed record, so finishing removes it.
SPECIFICATION Spec
CONSTANTS
  MaxTokens = 3
  NoTokenCheck = FALSE
  KeepFailureOnOwe = FALSE
  FailureBeside = FALSE
INVARIANT TypeOK INV_FailureIsCurrent INV_SettledNotFailed
CHECK_DEADLOCK FALSE
