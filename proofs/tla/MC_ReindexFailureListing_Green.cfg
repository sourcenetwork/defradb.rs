\* run-all: ReindexFailureListing.tla GREEN
\* a listed failure is the current reindex's, refuses no write, and a settled
\* index matches the documents
\* GREEN: the code. A stopped rebuild writes its failure only onto the record
\* of its own token and drops its progress, a newly owed reindex starts
\* without one, a finishing rebuild removes only its own record, writers do
\* not maintain the failed index, and a retry removes the failure and clears
\* before it walks.
SPECIFICATION Spec
CONSTANTS
  MaxTokens = 3
  NoTokenCheck = FALSE
  KeepFailureOnOwe = FALSE
  NoFinishTokenCheck = FALSE
  KeepProgressOnStop = FALSE
  KeepFailureOnRetry = FALSE
  WritersIgnoreFailure = FALSE
INVARIANT TypeOK INV_FailureIsCurrent INV_SettledNotFailed INV_FailedRefusesNoWrite INV_SettledIsExact
CHECK_DEADLOCK FALSE
