\* run-all: DocSyncCompletion.tla GREEN
\* GREEN: the fix, with the one peer of the defect's report. A merge reported twice stands for one document, so the sync waits for the others.
SPECIFICATION Spec
CONSTANTS
  Docs         = {d1, d2, d3}
  Peers        = {p1}
  MaxReports   = 5
  CountReports = FALSE
  FilterAsked  = TRUE
  HeldDocs     = {}
  ReportHeld   = TRUE
INVARIANT TypeOK
INVARIANT INV_CompleteMeansEveryDocMerged
INVARIANT INV_DoneOnceEveryDocReported
INVARIANT INV_NoWaitOnceEveryAnswerHandled
CHECK_DEADLOCK FALSE
