\* RED: enable() on a disabled NAC adds the caller as an owner; checked alone so
\* it must fail INV_NoNonAdminMutatesAdminSet (MC_Nac_Red_EnableReEnables.tla).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Owner <- mcOwner
  Admins0 <- mcAdmins0
  NonAdmins <- mcNonAdmins
  MaxMutations <- mcMaxMutations
  Mode = "BugEnableReEnables"
INVARIANT TypeOK
INVARIANT INV_NoNonAdminMutatesAdminSet
