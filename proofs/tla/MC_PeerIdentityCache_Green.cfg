\* run-all: PeerIdentityCache.tla GREEN
\* concurrent inserts leave every cached peer one eviction place, within capacity
\* The real cache: two tasks insert two peers each, out of three, into a line
\* of two places, in every interleaving. No peer holds two places, every place
\* names a cached peer, and once the inserts finish the map is exactly the
\* placed peers and within capacity.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  p1 = p1
  p2 = p2
  p3 = p3
  t1 = t1
  t2 = t2
  Peers = {p1, p2, p3}
  Tasks = {t1, t2}
  Ops = 2
  Cap = 2
  Mode = "correct"
INVARIANTS TypeOK NoDoublePlace PlacedAreCached SettledMatch SettledBounded Bounded
