\* RED: a conflict at commit is retried behind the caller's back. The patch
\* lands on definitions the caller never saw, and the caller is told it
\* succeeded (INV_ConflictReachesCaller).
SPECIFICATION Spec
CONSTANTS
  ReadThroughTxn = TRUE
  WriteThroughTxn = TRUE
  FinishOnCommit = TRUE
  RetryHides = TRUE
  Savepoint = TRUE
  RefreshCatalog = TRUE
INVARIANT INV_ConflictReachesCaller
CHECK_DEADLOCK FALSE
