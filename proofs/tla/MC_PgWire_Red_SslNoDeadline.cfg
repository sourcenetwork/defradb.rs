\* RED: refuse_ssl runs outside the deadline. A client sends an SSL request,
\* gets its refusal and goes silent: refuse_ssl waits for the next packet
\* forever. Must fail INV_StartupWithinDeadline.
SPECIFICATION Spec
CONSTANTS
  Limit              = 2
  MaxTime            = 3
  MaxMsgs            = 2
  PreMsgs            = {"ssl", "gss", "anon"}
  PostMsgs           = {"query"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = FALSE
  StartupArmed       = TRUE
  OneDeadline        = TRUE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_StartupWithinDeadline
CHECK_DEADLOCK FALSE
