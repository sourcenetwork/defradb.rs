\* RED: the request runs once, in new_txn(false) and commit(), as NodeOps
\* did. The validated read catches the race, but the loser gets the conflict
\* back as an error although its request was valid (INV_NoValidRefused).
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  ValidatedRead = TRUE
  Retry = FALSE
INVARIANT INV_NoValidRefused
CHECK_DEADLOCK FALSE
