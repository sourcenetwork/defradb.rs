\* run-all: IndexCachePublication.tla RED
\* the late create publication undoes the backfill's reload (INV_CacheMatchesStore)
\* RED: the code as it was in #2913: the create returns before its cache
\* publication ran, and the backfill tells the cache it finished through a
\* reload. The reload lands first, then the create's queued publication puts
\* the index back as building. The store says built, the cache never does,
\* and the planner never uses the index.
SPECIFICATION Spec
CONSTANTS
  PublishMode = "Queue"
  SettleMode = "Reload"
  StatusRead = "Validated"
INVARIANT INV_CacheMatchesStore
CHECK_DEADLOCK FALSE
