\* run-all: OwedParts.tla RED
\* a settle rewrites the staged part too: readers are refused for it (INV_SettleAbortsNobody)
\* RED: a settle writes the staged part as well, as a count rewritten by
\* read-modify-write does. A stager or a decider that read the count before
\* a settle committed is refused at its own commit for nothing it decided
\* on. Must fail INV_SettleAbortsNobody.
SPECIFICATION Spec
CONSTANTS
  MaxWrites     = 4
  SettleParts   = {"staged", "settled"}
  ReadParts     = {"staged"}
  SettleGuarded = TRUE
INVARIANT INV_SettleAbortsNobody
CHECK_DEADLOCK FALSE
