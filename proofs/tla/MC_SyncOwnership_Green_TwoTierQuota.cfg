\* GREEN: two peers. p1 pushes d1 and d2, whose provider never serves; p2
\* pushes d3, whose provider serves. Each peer may hold one durable root and
\* the map holds one entry after the restart. p1's first head is
\* acknowledged and its second is nacked at its quota for ever, so p1's
\* never-serving roots cannot fill the store. d3 is acknowledged in either
\* tier, on its durable record alone when p1's root holds the entry, which
\* gives it up, and it merges.
SPECIFICATION MFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs             = {d1, d2, d3}
  Cols             = {}
  MaxV             = 1
  Cap              = 2
  FetchCap         = 1
  SenderMode       = "MarkerRederive"
  RegisterMode     = "Durable"
  FlightMode       = "SingleFlight"
  AckGuardMode     = "HeadCurrent"
  ServeMode        = "DurableDerived"
  ProviderMode     = "OriginBound"
  OriginAuthMode   = "TransportBound"
  FetchMode        = "RootThenSelective"
  StreamMode       = "DrainResponse"
  CompletionMode   = "LatchedDrain"
  PendingMode      = "ScopeCurrent"
  MergeMode        = "SerializedBatch"
  MemCap           = 1
  RotateAfter      = 1
  Dead             = {d1, d2}
  PullScopes       = {}
  OverflowMode     = "Rotate"
  ContinuationMode = "EndOnStop"
  AdmissionMode    = "TwoTier"
  PeerScopes       = {{d1, d2}, {d3}}
  DurableQuota     = 1
INVARIANT INV_MemoryTypeOK
INVARIANT INV_MemoryBounded
INVARIANT INV_MemoryHoldsDurable
INVARIANT INV_DurablePeerQuota
INVARIANT INV_DueOrBackoff
INVARIANT INV_ObligationConservation
INVARIANT INV_SingleFlight
INVARIANT INV_FetchOwnersBounded
PROPERTY LIVE_DurableRootMerged
PROPERTY LIVE_WrittenHeadMerged
