\* The eviction pops the front place but forgets to remove its peer from the
\* map. That peer stays cached with no place, so nothing will ever evict it
\* and the map grows past capacity: SettledMatch fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  p1 = p1
  p2 = p2
  p3 = p3
  t1 = t1
  t2 = t2
  Peers = {p1, p2, p3}
  Tasks = {t1, t2}
  Ops = 2
  Cap = 1
  Mode = "noEvict"
INVARIANTS TypeOK SettledMatch
