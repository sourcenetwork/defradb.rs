\* RED: a node sees the fork but keeps merging the cheater. It merges both sides of the fork (INV_NoForkMerged).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Honest <- mcHonest
  Cheater <- mcCheater
  Peers <- mcPeers
  Heights <- mcHeights
  CheckEvidence = TRUE
  EnforceJail = FALSE
  GossipEvidence = TRUE
INVARIANT TypeOK
INVARIANT INV_NoForkMerged
