\* GREEN: the code as written. A turn reads the verified height before it
\* asks and sends, a verified height above it ends the wait, and every wait
\* ends after the fallback. The loop never lets time pass once the request's
\* block is verified, and it reads the receipt in the end though the light
\* client may never verify a header. Fresh and recovered requests both start.
SPECIFICATION Spec
CONSTANTS
  EventWake      = TRUE
  SeenBeforeSend = TRUE
  Bounded        = TRUE
  MaxHeight      = 3
  Fallback       = 2
INVARIANT TypeOK
INVARIANT INV_Prompt
PROPERTY LIVE_Confirms
CHECK_DEADLOCK FALSE
