\* run-all: WorkerHeartbeat.tla RED
\* a task report claimed by swap: a held-up monitor reports an older task poll again (INV_TaskOnce)
\* RED: a task poll's report is claimed with a swap of the last claimed
\* poll, which only stops the same poll reported twice in a row. Monitor 1
\* reads the first slow task poll and is held up. Monitor 2 reports it,
\* then reports the second slow task poll. Monitor 1's swap finds the
\* second poll, not its own, and reports the first task poll again.
\* Must fail INV_TaskOnce.
SPECIFICATION Spec
SYMMETRY MonSymmetry
CONSTANTS
  Limit          = 1
  MaxTime        = 6
  MaxPolls       = 4
  Watchers       = {m1, m2}
  HookBeat       = TRUE
  MarkNamesPoll  = TRUE
  HookClears     = TRUE
  Recheck        = TRUE
  MarkKeepsLive  = TRUE
  ClaimMax       = FALSE
INVARIANT TypeOK
INVARIANT INV_TaskOnce
