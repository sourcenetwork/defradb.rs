\* run-all: RegistrationBatch.tla GREEN
\* lists applied whole, at once or after a lost answer, and never sent again once held
\* GREEN: nothing is refused and two answers may be lost: each creator's list
\* is applied whole, at once or after a lost answer, and a pass after a lost
\* answer the provider applied clears the records without sending them.
SPECIFICATION Spec
CONSTANTS
  Obj          = {1, 2, 3}
  ByB          = {3}
  Bad          = {}
  Elsewhere    = {}
  MaxLoss      = 2
  MaxOther     = 1
  Recheck      = TRUE
  AskOnRefusal = TRUE
  Fallback     = TRUE
  PerCreator   = TRUE
  InOrder      = TRUE
INVARIANT TypeOK
INVARIANT INV_ClearedOnlyHeld
INVARIANT INV_OwnerIsCreator
INVARIANT INV_RefusedOnlyIfBad
INVARIANT INV_NoResendOfKnownHeld
INVARIANT INV_HeldNotFailed
INVARIANT INV_Order
