\* Plants a receiver that never widens the cut. A receiver with none of the
\* history then needs a round for every three blocks, eight rounds for this
\* chain instead of four. INV_RoundsLogarithmic fails.
SPECIFICATION Spec
CONSTANTS
  N = 24
  InitCut = 2
  Cap = 16
  MaxRounds = 4
  Bug = "nowiden"
INVARIANT INV_RoundsLogarithmic
CHECK_DEADLOCK FALSE
