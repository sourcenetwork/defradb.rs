\* run-all: MC_SyncOwnership_Memory.tla RED
\* a durable record leaves and the sweep sleeps until its tick beside the place (INV_FreedPlaceArmed)
\* RED (#2307): Green_Memory without the record-leaving wake
\* (remove_persisted_pending before the fix). After a restart the one-place map
\* holds d1 while d2 waits on its durable record. d1's record then leaves at
\* its terminal merge, which also removes its in-memory entry. d2 fits the
\* empty place, but nothing wakes the sweep, so it stands empty until the next
\* tick. Fails INV_FreedPlaceArmed.
SPECIFICATION MFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs             = {d1, d2}
  Cols             = {}
  MaxV             = 1
  Cap              = 2
  FetchCap         = 1
  SenderMode       = "MarkerRederive"
  RegisterMode     = "Durable"
  FlightMode       = "SingleFlight"
  AckGuardMode     = "HeadCurrent"
  ServeMode        = "DurableDerived"
  ProviderMode     = "OriginBound"
  OriginAuthMode   = "TransportBound"
  FetchMode        = "RootThenSelective"
  StreamMode       = "DrainResponse"
  CompletionMode   = "LatchedDrain"
  PendingMode      = "ScopeCurrent"
  MergeMode        = "SerializedBatch"
  MemCap           = 1
  RotateAfter      = 1
  Dead             = {}
  PullScopes       = {}
  OverflowMode     = "Retained"
  ContinuationMode = "EndOnStop"
  AdmissionMode    = "TwoTier"
  PeerScopes       = {{d1}, {d2}}
  DurableQuota     = 1
  WakeMode         = "NoRecordWake"
INVARIANT INV_MemoryTypeOK
INVARIANT INV_FreedPlaceArmed
