\* RED: a write carries no nonce, so two blocks with the same edit on the same
\* past share one ID though their CIDs differ. Alice and Bob both set "a.b"
\* having seen nothing; Alice then deletes "a" having seen only her own set.
\* Bob's peer holds his set, takes Alice's for the one it holds, and the
\* delete wipes that one entry: "a.b" is gone. Alice's peer took the delete
\* before Bob's set, so Bob's set arrives as new and stays. Both hold the same
\* three blocks and show different JSON. Only sets of "a.b" and deletes of
\* "a" are written (CONSTRAINT SharedIdEdits), which is all this bug needs.
\* Must fail INV_Converge.
SPECIFICATION Spec
CONSTANTS
  Peers            = {p1, p2}
  MaxBlocks        = 3
  UseCid           = TRUE
  DeleteWins       = FALSE
  DeleteImpliesMap = FALSE
  SharedIds        = TRUE
CONSTRAINT SharedIdEdits
INVARIANT TypeOK
INVARIANT INV_Converge
