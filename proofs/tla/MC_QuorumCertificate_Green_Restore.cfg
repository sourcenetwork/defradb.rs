\* GREEN: an honest validator that voted is restored and comes back under a new key, which abstains on the open slot. Still one certificate at most and one actor at most.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Honest <- mcHonest
  Cheaters <- mcCheaters
  Contenders <- mcContenders
  Quorum = 3
  VoteOnce = TRUE
  ActOnCert = TRUE
  AbstainOnRestore = TRUE
  Restores = TRUE
INVARIANT TypeOK
INVARIANT INV_OneCertificate
INVARIANT INV_OneActs
