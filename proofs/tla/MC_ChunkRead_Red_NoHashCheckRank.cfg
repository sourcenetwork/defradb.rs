\* RED: the bug plants a check that trusts the hash a chunk claims, as in
\* MC_ChunkRead_Red_NoHashCheck, and checks only the ranking. A forged chunk claims the hash of a real chunk of the text, and a ranking
\* scores the article by the forged chunk's vector (INV_RankedIsBestListed).
