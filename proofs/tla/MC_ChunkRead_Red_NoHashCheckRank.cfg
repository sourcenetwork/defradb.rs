\* run-all: ChunkRead.tla RED
\* a forged chunk scores its article (INV_RankedIsBestListed)
\* RED: the bug plants a check that trusts the hash a chunk claims, as in
\* MC_ChunkRead_Red_NoHashCheck, and checks only the ranking. A forged chunk claims the hash of a real chunk of the text, and a ranking
\* scores the article by the forged chunk's vector (INV_RankedIsBestListed).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = FALSE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = TRUE
  CheckCut = TRUE
  RouteChecksList = TRUE
  RouteOnlyUnruled = TRUE
  HeldKeepsBest = TRUE
  CheckResolved = TRUE
  CheckOwnApp = TRUE
  CheckDelegationScope = TRUE
INVARIANT INV_RankedIsBestListed
CHECK_DEADLOCK FALSE
