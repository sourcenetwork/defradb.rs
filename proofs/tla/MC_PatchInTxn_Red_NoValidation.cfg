\* run-all: PatchInTxn.tla RED
\* unchecked reads: the commit overwrites a patch committed first (INV_NoLostPatch)
\* RED: the definitions the patch read are not checked at commit. Another
\* writer's patch of the same collection commits first, and the caller's
\* commit lands over it, so that patch is silently lost (INV_NoLostPatch).
SPECIFICATION Spec
CONSTANTS
  WriteThroughTxn = TRUE
  PublishOnCommit = TRUE
  FollowUpOnCommit = TRUE
  RefreshCatalog = TRUE
  RollBackFailed = TRUE
  RestoreLensStore = TRUE
  AwaitFollowUp = TRUE
  ValidateDefinitions = FALSE
INVARIANT INV_NoLostPatch
CHECK_DEADLOCK FALSE
