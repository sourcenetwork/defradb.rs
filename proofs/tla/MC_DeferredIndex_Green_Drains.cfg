\* GREEN, progress: the same system with two writes, so the check of what must
\* eventually happen stays fast. As long as drains get to run, every owed document
\* is drained and the stored entries settle at the live values.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a, b}
  MaxSteps = 2
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
  Poisoned = {}
  Carry = "Tail"
  Fixed = "Never"
INVARIANT INV_ReadExact INV_SettledIndexExact
PROPERTY PROP_Drains
CHECK_DEADLOCK FALSE
