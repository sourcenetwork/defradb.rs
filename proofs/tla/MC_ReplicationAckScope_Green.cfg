\* GREEN: the fix. The push and the read pick the scope with the same rule.
\* The replicator starts filtered or not and the collection branchable or not,
\* so all four shapes are checked. Two documents, the filter matches only d1,
\* and each document is written twice, with the peer's acknowledgements
\* arriving in any order. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  d1 = d1
  d2 = d2
  Docs           = {d1, d2}
  Matches        = {d1}
  MaxWrites      = 2
  MainRule       = FALSE
  PushToFiltered = FALSE
INVARIANT TypeOK
INVARIANT INV_AckedReadsAcked
INVARIANT INV_AckedIsHeld
INVARIANT INV_NeverPushedNeverAcked
INVARIANT INV_FilterRespected
