\* RED: a drain truncates through the head at its commit, not the head it planned.
\* An increment that committed after the plan loses its log entry, so the document
\* looks settled while its entry is stale (INV_ReadExact).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a, b}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  Truncate = "Head"
INVARIANT INV_ReadExact
CHECK_DEADLOCK FALSE
