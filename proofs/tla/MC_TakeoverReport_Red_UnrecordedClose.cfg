\* says closed before the close is written (INV_ClosedRecorded)
\* RED: a provider whose close write failed publishes the report as closed
\* anyway. The journal is not closed, so the next call closes again and the
\* embedder hears of the closed term twice, the first time while the node's
\* durable state says otherwise. Must fail INV_ClosedRecorded.
SPECIFICATION Spec
CONSTANTS
    Submissions = {1, 2}
    MaxTerm = 2
    MaxFaults = 1
    Publish = TRUE
    AfterAll = TRUE
    Once = TRUE
    KeepOwed = TRUE
    CutOfTerm = TRUE
    NameUnrestorable = TRUE
    NameClosed = TRUE
    Recorded = FALSE
INVARIANT
    TypeOK
    INV_ClosedRecorded
