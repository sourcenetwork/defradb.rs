\* RED: each drop page stops a page past the first entry left, but its range starts
\* at position 1. Every page then truncates again every position the log ever gave,
\* so a page's transaction grows with the index's whole history (INV_CleanupBounded).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "On"
  Cleanup = "FromOne"
  Page = 1
  Poisoned = {}
  Carry = "Tail"
  Fixed = "Never"
INVARIANT INV_CleanupBounded
CHECK_DEADLOCK FALSE
