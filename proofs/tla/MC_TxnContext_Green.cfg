\* GREEN: the real code. Two callers, two transaction IDs, one key. Every order of
\* begin, request, commit and discard keeps all five rules: only the opener runs in a
\* transaction, read-only holds no write, a finished transaction runs nothing, a
\* discard leaves nothing in the store, and a clashing commit fails.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  t1 = t1
  t2 = t2
  k1 = k1
  Callers = {a, b}
  Txns    = {t1, t2}
  Keys    = {k1}
  Bug     = "None"
INVARIANT TypeOK
INVARIANT INV_OnlyOwnerRuns
INVARIANT INV_ReadOnlyNeverWrites
INVARIANT INV_FinishedNeverRuns
INVARIANT INV_DiscardLeavesNothing
INVARIANT INV_NoLostUpdate
