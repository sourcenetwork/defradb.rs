\* run-all: PushLogGoWire.tla RED
\* push log go wire: the capability is lost to Rust (INV_RustKeepsCapability)
\* RED: the sender strips the capability from every push, Rust's included.
\* Go is answered, but a Rust receiver gets an owned document's push without
\* the capability its encrypted replay needs: INV_RustKeepsCapability is violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Docs = {"owned", "public"}
  Owned = {"owned"}
  Receivers = {"go", "rust"}
  Bug = "StripEverywhere"
INVARIANT TypeOK
INVARIANT INV_RustKeepsCapability
