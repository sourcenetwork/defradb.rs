\* RED: the scan trusts the plan. A query plans the index while nothing is
\* owed, then a merge stores the document off the active version across the
\* lens and owes a reindex before the query scans. The scan does not read
\* the owed record again, so it answers from the merged raw entry while reads
\* see the migrated value, and the query misses the document:
\* INV_ScanMatchesReads fails.
SPECIFICATION Spec
CONSTANTS
  Gate = "owed"
  OweOnSchemaChange = TRUE
  OweOnMerge = TRUE
  SkipIfOwed = FALSE
  ClearChecksToken = TRUE
  ScanRechecksOwed = FALSE
  MaxSteps = 6
INVARIANT TypeOK INV_IndexMatchesReads INV_SettledIndexAnswers INV_ScanMatchesReads
CHECK_DEADLOCK FALSE
