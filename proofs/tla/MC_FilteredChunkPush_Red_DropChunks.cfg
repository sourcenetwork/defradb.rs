\* run-all: FilteredChunkPush.tla RED
\* chunks of a filtered article are never sent (LIVE_ChunkFollowsItsArticle)
\* RED: the bug plants the old code, which leaves a filtered article's chunk
\* collection out. The matching article reaches the receiver and its chunk
\* never does (LIVE_ChunkFollowsItsArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  NewMatches = {a1}
  Unreadable = {}
  StaleMarkers = {a1}
  ShipChunks = FALSE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = TRUE
  ReplayNeedsArticle = TRUE
  ReplayDefersChunk = TRUE
  ReplayChunksOnRefilter = TRUE
PROPERTY LIVE_ChunkFollowsItsArticle
CHECK_DEADLOCK FALSE
