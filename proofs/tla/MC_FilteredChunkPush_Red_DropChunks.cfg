\* RED: the bug plants the old behaviour, where a filtered article's chunks
\* are left out of the replicator. A matching article reaches the receiver
\* without its chunks (INV_SettledHasMatchingChunks).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  ShipChunks = FALSE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
INVARIANT INV_SettledHasMatchingChunks
CHECK_DEADLOCK FALSE
