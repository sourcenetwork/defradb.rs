\* RED: the bug plants the old behaviour, where a filtered article's chunks are
\* left out. A matching article reaches the receiver and its chunk never
\* follows (LIVE_ChunkFollowsItsArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  StaleMarkers = {a1, a2}
  ShipChunks = FALSE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  ReplayAddsParent = TRUE
  ReplayNeedsArticle = TRUE
PROPERTY LIVE_ChunkFollowsItsArticle
CHECK_DEADLOCK FALSE
