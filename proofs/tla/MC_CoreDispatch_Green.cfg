\* GREEN: the real code. Caller a may do these operations and b may not; every
\* order of three requests, with and without transaction t1, keeps the rules:
\* b changes nothing, and a request in t1, a patch included, stays in t1.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  t1 = t1
  Callers = {a, b}
  Allowed = {a}
  Txns    = {t1}
  Bug     = "None"
INVARIANT TypeOK
INVARIANT INV_NoEffectWithoutPermission
INVARIANT INV_TxnNeverAutocommits
CHECK_DEADLOCK FALSE
