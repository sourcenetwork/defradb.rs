\* owed replays taken out before publication (INV_Complete)
\* RED: the owed replays are taken out of the report before it is published.
\* The outbox gets them, but the event names none, so the embedder cannot tell
\* which changes are still pending. Must fail INV_Complete.
SPECIFICATION Spec
CONSTANTS
    Submissions = {1, 2}
    MaxTerm = 2
    MaxFaults = 1
    Publish = TRUE
    AfterAll = TRUE
    Once = TRUE
    KeepOwed = FALSE
    CutOfTerm = TRUE
    NameUnrestorable = TRUE
    NameClosed = TRUE
    Recorded = TRUE
INVARIANT
    TypeOK
    INV_Complete
