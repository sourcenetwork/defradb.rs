\* RED: the bug plants a merge that takes a delete of a chunk it does not store
\* yet, with no article check, as delete_must_wait did when the chunk was
\* missing. A peer sends the delete first, the chunk of the live article
\* arrives after it, and readers lose it (INV_ListedChunksStay).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = TRUE
  DeleteRule = "wait"
  WaitForChunk = FALSE
INVARIANT INV_ListedChunksStay
CHECK_DEADLOCK FALSE
