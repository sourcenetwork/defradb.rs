\* RED: the bug plants a merge that takes a delete before its chunk's first
\* block, as it would if a delete did not need that block to name its chunk.
\* The delete merges with no article check, the chunk of the live article
\* arrives after it, and readers lose it (INV_ListedChunksStay). The merge
\* builds nothing here, as for an encrypted text, so only the chunk that
\* travels can fill the text.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = TRUE
  DeleteRule = "text"
  GenesisFirst = FALSE
  Regenerate = TRUE
  Rebuild = FALSE
  SameIds = TRUE
INVARIANT INV_ListedChunksStay
CHECK_DEADLOCK FALSE
