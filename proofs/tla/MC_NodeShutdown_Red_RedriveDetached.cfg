\* RED: the redrive is detached, as the old drop(network.spawn(..)) left it.
\* Nobody holds it, so shutdown never aborts or awaits it. It keeps running on
\* the network runtime past the wait for tasks, through the close of regolith,
\* until the runtime itself goes. Must fail INV_NothingDetached.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = FALSE
  AwaitServices   = TRUE
  DrainDeadline   = TRUE
  SlotKeepsHandle = TRUE
INVARIANT INV_NothingDetached
CHECK_DEADLOCK FALSE
