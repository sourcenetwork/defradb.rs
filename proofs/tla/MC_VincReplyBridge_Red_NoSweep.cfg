\* RED: there is no sweep. A drop message is lost to a full queue while the
\* connection stays up, so nothing ever takes the entry: the stream and its
\* table slot leak. Must fail LIVE_NoLeak.
SPECIFICATION Spec
CONSTANTS
  N              = 1
  Cap            = 1
  D              = 1
  Lossy          = TRUE
  DeadlinePasses = TRUE
  TakeOnce       = TRUE
  DropReset      = TRUE
  SweepGuard     = FALSE
  CapGuard       = TRUE
INVARIANT TypeOK
PROPERTY LIVE_NoLeak
CHECK_DEADLOCK FALSE
