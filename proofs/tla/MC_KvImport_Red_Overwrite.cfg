\* Bug: the import writes the snapshot raw, as Go does, so a rerun puts a
\* back to its snapshot versions and a live write is lost. Fails INV_NoLostLiveWrite.
SPECIFICATION Spec
CONSTANTS
  Filtered = {"a"}
  MaxRuns = 2
  SnapMode = "History"
  StoreMode = "Before"
  GenesisMode = "Check"
  WriteMode = "Overwrite"
  JudgeMode = "Restore"
  ReportMode = "Report"
INVARIANTS INV_MergedHasBlocks INV_NoDocWithoutFirst INV_NoLostLiveWrite INV_Complete
CHECK_DEADLOCK FALSE
