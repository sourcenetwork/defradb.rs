\* RED: every projected document write registers a rebuild, NAC tuple or
\* not, as the projector hook did before. A transaction that writes only a
\* document with no NAC tuple still rebuilds the snapshot at commit
\* (INV_NoRebuildWithoutNacWrite).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2, d3}
  NacDocs = {d1, d2}
  Bug = "EveryWrite"
INVARIANT TypeOK
INVARIANT INV_NoRebuildWithoutNacWrite
CHECK_DEADLOCK FALSE
