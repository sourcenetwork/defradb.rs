\* run-all: CommitResponseWait.tla RED
\* no server bound: a wedged commit leaves the client waiting (ClientSettles)
\* RED: remove the server's bound, so a queued or running commit can keep the
\* client waiting forever; ClientSettles fails.
SPECIFICATION Spec
CONSTANT Bound = 1
CONSTANT CommitBound = FALSE
CONSTANT CommitKeepsRunning = TRUE
INVARIANT TypeOK
INVARIANT UnknownIsNotAbort
INVARIANT AnswerOnlyAfterSend
PROPERTY ClientSettles
CHECK_DEADLOCK FALSE
