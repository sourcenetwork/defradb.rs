\* RED: nothing bounds the pending set, so a burst of commits piles up
\* announcements without limit while they wait for slots.
\* Expect INV_PendingBounded to be violated.
SPECIFICATION Spec
CONSTANTS
  Writes <- mcWrites
  Room = 2
  Slots = 1
  Shed = FALSE
  ReportExpiry = TRUE
  SlotAfterWindow = TRUE
  BoundRoom = FALSE
CHECK_DEADLOCK TRUE
INVARIANT TypeOK
INVARIANT INV_PendingBounded
