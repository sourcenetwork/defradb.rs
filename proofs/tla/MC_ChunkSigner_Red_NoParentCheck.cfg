\* run-all: ChunkSigner.tla RED
\* the merge skips the parent check and stores Bob's chunk (INV_NoRogueChunk)
\* RED: the bug plants a merge that never asks whether the chunk's signer may
\* update its article, as when the chunk collection's own missing policy is
\* all it looks at. Bob, who may not update the article, sends a chunk with a
\* text and vector of his choosing, and R stores it (INV_NoRogueChunk).
SPECIFICATION Spec
CONSTANTS
  CheckParent = FALSE
  Sign = TRUE
  WaitForParent = TRUE
  Provider = "Local"
  Rebuild = FALSE
  MaxFlips = 0
INVARIANT INV_NoRogueChunk
CHECK_DEADLOCK FALSE
