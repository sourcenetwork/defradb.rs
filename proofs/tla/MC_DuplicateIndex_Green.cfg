\* run-all: DuplicateIndex.tla GREEN
\* a create refuses a listed copy and validates its definition read
\* GREEN: the create transaction refuses a copy and its definition read is
\* validated at commit, so no copy is listed, no created index is lost and
\* only copies are refused.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Check = TRUE
  Validate = TRUE
INVARIANT INV_NoDuplicate
INVARIANT INV_NoLostIndex
INVARIANT INV_RefusedOnlyCopies
