\* GREEN, drop: one document, one drain, increments and deletes, one crash and a
\* drop of the index while entries are still owed. The drop truncates what is left
\* of the log a page at a time, each page from the first entry still there, so no
\* transaction truncates more than a page, and the log still empties after a crash.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1}
  Drains = {a}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "Validated"
  Drop = "On"
  Cleanup = "Paged"
  Page = 1
INVARIANT INV_TypeOK INV_ReadExact INV_RecordMatchesIndex INV_SettledIndexExact INV_CleanupBounded
PROPERTY PROP_Drains
CHECK_DEADLOCK FALSE
