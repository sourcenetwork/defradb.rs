\* run-all: PushLogGoWire.tla GREEN
\* push log go wire: Go gets Go's fields, Rust keeps the capability
\* GREEN: the sender writes the capability only on Rust's protocol, so Go
\* verifies and answers every push and a Rust receiver gets the capability.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Docs = {"owned", "public"}
  Owned = {"owned"}
  Receivers = {"go", "rust"}
  Bug = "None"
INVARIANT TypeOK
INVARIANT INV_GoGetsOnlyGoFields
INVARIANT INV_NoPushDropped
INVARIANT INV_RustKeepsCapability
