\* run-all: VectorMemoryBudget.tla RED
\* a stopped reload keeps its room, which nothing gives back
\* RED: a reload that stops half way does not give back the room its codes took, so the counter says more is held than anything holds (INV_Accounted).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Searches = {s1, s2, s3}
          Limit = 2
          Codes = 3
          MaxGen = 3
          AtomicTake = TRUE
          ReleaseOnDrop = FALSE
          DropOldFirst = TRUE
          NoMissesWhileLoading = TRUE
          SingleFlight = TRUE
          OwnedFinish = TRUE
INVARIANT INV_BudgetHolds
INVARIANT INV_Accounted
INVARIANT INV_FullLoad
INVARIANT INV_ClaimLostOnlyToNewer
SYMMETRY Symmetry
