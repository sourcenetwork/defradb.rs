\* RED: the bug plants a chunk decided by its own document. The chunk has
\* none of the article's fields, so a filter like "kind is not secret" passes
\* on it, and a chunk of a refused article is sent (INV_NoChunkOfUnmatchedArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = FALSE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  KeepWaiting = TRUE
INVARIANT INV_NoChunkOfUnmatchedArticle
CHECK_DEADLOCK FALSE
