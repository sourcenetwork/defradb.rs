\* run-all: FilteredChunkPush.tla RED
\* a chunk passes on its own document (INV_NothingUnmatched)
\* RED: the bug plants a chunk decided by its own document, which a negative
\* filter always lets through. The receiver holds a chunk of the unmatched
\* article (INV_NothingUnmatched).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  NewMatches = {a1}
  Unreadable = {}
  StaleMarkers = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = FALSE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = TRUE
  ReplayNeedsArticle = TRUE
  ReplayDefersChunk = TRUE
  ReplayChunksOnRefilter = TRUE
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
