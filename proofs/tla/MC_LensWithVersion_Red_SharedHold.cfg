\* run-all: LensWithVersion.tla RED
\* RED: the hold is keyed by the lens, not by the commit. Two commits carry
\* the same lens; one lands, the other fails and lets go of the one shared
\* hold, so a request that sees the landed version before it is owed finds
\* no transform (INV_NoMissingTransform).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANT Mode = "sharedHold"
INVARIANT TypeOK INV_NoMissingTransform
