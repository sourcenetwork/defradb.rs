\* RED: the reader looks the owner's pointer up only when it connects. It
\* queries once, gossip then loses a newer record on the long-lived
\* connection, and the reader keeps an old one forever (LIVE_NewestReached).
SPECIFICATION Spec
CONSTANTS
  MaxSeq = 3
  SeqMode = "Increasing"
  ChooseMode = "CheckExpiry"
  RefreshMode = "QueryOnConnect"
PROPERTY LIVE_NewestReached
CHECK_DEADLOCK FALSE
