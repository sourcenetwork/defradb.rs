\* RED: past a budget the announcement is dropped but not reported: a counter
\* and a log line only. The application never learns the document is gone.
\* Expect INV_HeardIsOwnedOrReported to be violated.
SPECIFICATION Spec
CONSTANTS
  Docs <- mcDocs
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  MemCap = 1
  MaxCrashes = 1
  PeerCap = 1
  TotalCap = 2
  Mode = "SilentShed"
  Promote = TRUE
CHECK_DEADLOCK TRUE
INVARIANT INV_TypeOK
INVARIANT INV_HeardIsOwnedOrReported
