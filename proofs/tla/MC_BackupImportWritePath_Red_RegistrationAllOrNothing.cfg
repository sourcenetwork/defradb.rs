\* run-all: BackupImportWritePath.tla RED
\* one taken ID leaves its batch-mates without theirs (INV_SavedRegistered)
\* RED: a registration refused by one alias another writer took since the
\* check fails as a whole. A file of a then c, saved as one batch, loses c
\* to the other writer before its registration, and the saved document a
\* never gets its alias. Must fail INV_SavedRegistered.
SPECIFICATION Spec
CONSTANTS
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  HoldImport          = TRUE
  DetachedImport      = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  OneByOneOnRefusal   = TRUE
  RegisterEachOnRefusal = FALSE
  RequireNode         = TRUE
  ImportRouteOnEdge   = TRUE
INVARIANT INV_SavedRegistered
CHECK_DEADLOCK FALSE
