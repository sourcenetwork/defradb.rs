\* run-all: FilteredChunkPushRecord.tla RED
\* removing the article leaves its chunk collection (INV_NothingUnmatched)
\* RED: the bug plants a removal of the article that keeps its chunk collection.
\* The filter went with the article, so the next chunk of the unmatched article
\* passes and reaches the receiver (INV_NothingUnmatched).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  MaxRestarts = 2
  LookupCanFail = TRUE
  CanCorrupt = TRUE
  AddPairs = TRUE
  RemoveTakesChunks = FALSE
  KeepStoredPair = TRUE
  PersistOnlyNarrows = TRUE
  PersistInOneTxn = TRUE
  BadRecordFailsClosed = TRUE
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
