\* RED: clear removes the DID's slot from the map (clearing the map itself).
\* Holder a holds the DID; the process clears; the map now answers no key
\* for a DID a still holds. And a later hold makes a fresh slot whose count
\* a's release then takes from, dropping the new holder's key. Must fail
\* INV_KeyWhileHeld.
SPECIFICATION Spec
CONSTANTS
  Holders         = {a, b}
  Contexts        = {a, b}
  PinSig          = a
  NoSigner        = none
  MaxSlots        = 2
  AtomicSwap      = TRUE
  CountHolds      = TRUE
  ClearKeepsSlots = FALSE
  ClearKeepsHeld  = TRUE
  RetainNeedsKey  = TRUE
  RefuseOther     = TRUE
  PinRefusesHeld  = TRUE
  SameByContext   = TRUE
INVARIANT INV_KeyWhileHeld
CHECK_DEADLOCK FALSE
