\* run-all: PincJoinConfirm.tla RED
\* RED (pinc today, #483): a topic is joined again while the Joined event
\* of the old join is still queued. The reader takes it after the new join
\* and marks the topic confirmed: the subscribe answers "subscribed" before
\* the hub took the new subscribe. Must fail INV_OkOnlyWhenHeld.
SPECIFICATION Spec
CONSTANTS
  Calls            = {c1, c2}
  MaxUnsub         = 1
  MaxHold          = 0
  MaxLost          = 0
  ConfirmCheck     = TRUE
  StillJoined      = TRUE
  Recheck          = TRUE
  Rollback         = TRUE
  ClearOnLeave     = TRUE
  HubTagsLists     = TRUE
  RejoinAfterDrain = FALSE
INVARIANT TypeOK
INVARIANT INV_OkOnlyWhenHeld
CHECK_DEADLOCK FALSE
