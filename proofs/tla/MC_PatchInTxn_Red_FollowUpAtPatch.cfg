\* run-all: PatchInTxn.tla RED
\* lens registered before commit, a discard leaves it (INV_NoTraceAfterRollback)
\* RED: the follow-up work runs when the patch runs. A lens the patch carried is
\* registered, or a removed collection forbidden, although the transaction is
\* then discarded, so the discarded patch leaves a trace (INV_NoTraceAfterRollback).
SPECIFICATION Spec
