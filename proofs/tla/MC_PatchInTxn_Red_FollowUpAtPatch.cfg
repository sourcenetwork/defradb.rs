  PublishOnCommit = TRUE
  FollowUpOnCommit = FALSE
  RefreshCatalog = TRUE
  RollBackFailed = TRUE
  RestoreLensStore = TRUE
  AwaitFollowUp = TRUE
  ValidateDefinitions = TRUE
INVARIANT INV_NoTraceAfterRollback
CHECK_DEADLOCK FALSE
