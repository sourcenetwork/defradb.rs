\* run-all: DiskAnnClusterKeys.tla GREEN
\* every node has one record at the key its code names, and every search finds it
\* Both guards on: a node linked again keeps the place its record has (an old-layout node keeps its bare id key), and a lookup by a search or a merge that misses at the cache's key reads its own snapshot's cluster and tries that key. Any mix of nodes starts in the old layout.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Ids = {a, b}
          Clusters = {c1, c2}
          MaxGen = 4
          KeepCluster = TRUE
          Fallback = TRUE
INVARIANT INV_OneRecord
INVARIANT INV_FindsRecord
