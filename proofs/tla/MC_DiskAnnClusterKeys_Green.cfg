\* run-all: DiskAnnClusterKeys.tla GREEN
\* every node has one record at the key its code names, and every search finds it
\* Both guards on: a node linked again keeps its stored cluster, and a search that misses at the cache's key reads its own snapshot's cluster and tries that key.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Ids = {a, b}
          Clusters = {c1, c2}
          MaxGen = 4
          KeepCluster = TRUE
          Fallback = TRUE
INVARIANT INV_OneRecord
INVARIANT INV_FindsRecord
