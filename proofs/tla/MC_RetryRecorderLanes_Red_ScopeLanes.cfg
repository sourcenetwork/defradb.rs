\* run-all: RetryRecorderLanes.tla RED
\* RED: the lane is chosen per record, as hashing by the whole scope would,
\* so p1's two records can wait in both lanes. Both lanes take them at once and
\* p1 has two transactions in flight, which conflict with each other
\* (INV_OnePeerAtATime).
SPECIFICATION Spec
CONSTANT LaneByPeer = FALSE
CONSTANT OneTxnPerPeer = TRUE
CONSTANT AnswerAfterCommit = TRUE
CONSTANT SinglesOnFail = TRUE
INVARIANT TypeOK
INVARIANT INV_OnePeerAtATime
INVARIANT INV_PeerOrder
INVARIANT INV_AnsweredOnlyWhenDurable
INVARIANT INV_FailureCostsOnlyItsRecord
CHECK_DEADLOCK FALSE
