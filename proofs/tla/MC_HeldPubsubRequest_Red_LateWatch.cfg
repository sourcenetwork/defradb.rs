\* RED: the wake-up is armed after the first publish, so a peer that subscribes in between
\* wakes nothing and never gets the request. Fails Delivered.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  HoldOnRefusal = TRUE
  ResendOnJoin = TRUE
  WatchBeforePublish = FALSE
  DedupeReplies = TRUE
INVARIANT TypeOK
INVARIANT Delivered
INVARIANT OneReplyEach
INVARIANT RefusedOnlyUnsent
