\* run-all: StrictAccessRead.tla GREEN
\* GREEN: no read reveals a row; a strict read answers completely or fails
\* on a check that had no answer after the provider waits, naming nothing,
\* never on a denial, and leaves its transaction usable; a default read never
\* fails on a check.
SPECIFICATION Spec
CONSTANT Bug = "none"
INVARIANT TypeOK
INVARIANT INV_NeverRevealed
INVARIANT INV_StrictComplete
INVARIANT INV_DenialNeverErrors
INVARIANT INV_LateWaited
INVARIANT INV_NamesNothing
INVARIANT INV_TxnUsable
INVARIANT INV_FailedReturnsNothing
INVARIANT INV_DefaultNeverFails
CHECK_DEADLOCK FALSE
