\* GREEN: the design. Two peers write three edits between them across "a",
\* "a.b" and "c": plain values, {}, [] and deletes, swapped in every order the
\* causal buffer allows. Ties are broken by the CID and an update beats a
\* concurrent delete. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Peers      = {p1, p2}
  MaxBlocks  = 3
  UseCid     = TRUE
  DeleteWins = FALSE
INVARIANT TypeOK
INVARIANT INV_Converge
INVARIANT INV_MatchesReplay
INVARIANT INV_DisjointKept
INVARIANT INV_SamePathLww
INVARIANT INV_UpdateWins
INVARIANT INV_TypeClash
INVARIANT INV_ConflictsAreLosers
