\* run-all: HistoryRetention.tla GREEN
\* #559: a history prune keeps the window, every head and every owned block, reclaims superseded field heads, a replayed pruned commit stays applied, and a version read past a prune fails
\* Every guard on: heads, field heads, kept composites' field links, owned blocks and the top N heights stay; a field block nothing keeps goes, even one an earlier prune kept as a head; a pruned composite sent again is recognised as applied and taken by the next prune; a version read that meets a pruned block fails instead of returning a partial document; c2 is pruned.
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Keep"
  FieldMode = "Keep"
  LinkMode = "Keep"
  ScanMode = "Validated"
  MarkerMode = "Keep"
  WindowMode = "Exact"
  ReclaimMode = "Scan"
  ReadMode = "Refuse"
  MaxPrunes = 2
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned INV_Reclaimed INV_KeptLinksStored INV_NoPartialRead
CHECK_DEADLOCK FALSE
