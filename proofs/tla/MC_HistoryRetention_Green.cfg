\* run-all: HistoryRetention.tla GREEN
\* #559: a history prune keeps the window, every head and every owned block, and a replayed pruned commit stays applied
\* Every guard on: heads, field heads, owned blocks and the top N heights stay; a pruned composite sent again is recognised as applied; c2 is pruned.
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Keep"
  FieldMode = "Keep"
  ScanMode = "Validated"
  MarkerMode = "Keep"
  WindowMode = "Exact"
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned
CHECK_DEADLOCK FALSE
