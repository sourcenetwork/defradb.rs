\* run-all: ClientUniqueAdmission.tla RED
\* nil checked as a value (INV_NilNotRefused)
\* RED: nil is checked like any other value. The second writer of nil finds
\* the first one's entry and is refused, though any number of documents may
\* hold nil (INV_NilNotRefused).
SPECIFICATION Spec
CONSTANTS
  Clients = {1, 2}
  Values = {"nil"}
  Mode = "Explicit"
  Indexed = TRUE
  EntryValidated = TRUE
  ScanDecides = FALSE
  LoserLeaves = FALSE
  RerunReuses = FALSE
  NilChecked = TRUE
  MaxAttempts = 3
INVARIANT INV_NilNotRefused
CHECK_DEADLOCK FALSE
