\* run-all: ProllySync.tla RED
\* The bug: a pull that changes the puller keeps the "caught up" claims other
\* nodes made against it. Node 2 catches up with node 1, node 3 writes, node 1
\* pulls that write, and node 2 still claims it holds all of node 1, though it
\* lacks the new version. PulledHolds fails.
SPECIFICATION Spec
CONSTANTS
  MaxVersion = 3
  Filter = TRUE
  FreshRoot = TRUE
  FetchChanged = TRUE
  InvalidateOnMerge = FALSE
INVARIANT PulledHolds
CHECK_DEADLOCK FALSE
