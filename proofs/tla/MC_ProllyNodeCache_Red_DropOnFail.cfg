\* a failed write drops its nodes (GetFinds)
\* The bug: a failed write drops the nodes it took. They were put, nothing
\* stored them, and a read of one finds nothing. GetFinds fails.
SPECIFICATION Spec
CONSTANTS
  ReadPending = TRUE
  Evict = TRUE
  SkipHuge = TRUE
  KeepOnFail = FALSE
  FlushFirst = TRUE
  RefuseAfterFail = TRUE
INVARIANT GetFinds
CHECK_DEADLOCK FALSE
