\* run-all: FollowDeploymentRecovery.tla GREEN
\* the same with pages of one record
\* GREEN: as Green, with pages of one record: three pages per pass, and an
\* empty ledger tail never counted as complete early. Every property holds.
SPECIFICATION Spec
CONSTANTS
  Records       = 3
  Revoked       = {2, 3}
  PageSize      = 1
  MaxTakeovers  = 2
  MaxCrashes    = 1
  Gate          = TRUE
  HandOver      = TRUE
  OweFirst      = TRUE
  EndFromLedger = TRUE
  SaysDone      = TRUE
  TermFence     = TRUE
  SharedFence   = TRUE
INVARIANT TypeOK
INVARIANT INV_NothingLost
INVARIANT INV_TheirsNotLost
INVARIANT INV_RevocationDenies
PROPERTY LIVE_RecoveryEnds
