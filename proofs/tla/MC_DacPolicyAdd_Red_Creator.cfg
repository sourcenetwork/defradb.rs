\* RED: the creator check is left out, as the CLI's Vera path once did by
\* sending an empty creator. A policy is created with no one acting in the
\* request (INV_NoPolicyWithoutCreator).
SPECIFICATION Spec
CONSTANTS
  Enforced = {"nac", "acp", "data", "valid", "mirror"}
  CreatorFirst = FALSE
INVARIANT INV_NoPolicyWithoutCreator
CHECK_DEADLOCK FALSE
