\* run-all: EmbeddedVeraSwitch.tla GREEN
\* switches, restarts, calls, watches and the stop share the hosted Vera node; nothing outlives the stop
\* GREEN: the code as written. A watch lets go of the slot when a writer
\* asks, a stop that reaches its deadline withdraws its ask and leaves a
\* reaper, a stop drops a switch or restart where it stands and then waits
\* for the node directory to be released, a hung launch ends at the start
\* deadline, a switch that left the node halted empties the slot and a
\* restart starts it again, a switch records the device its node runs as,
\* and a closed link stays closed.
\* Every invariant and property holds.
SPECIFICATION Spec
CONSTANTS
  EvictWatch     = TRUE
  AskWithdraws   = TRUE
  AbortOnStop    = TRUE
  SwitchDeadline = TRUE
  ClearsHalted   = TRUE
  RecordsTarget  = TRUE
  ReportFails    = FALSE
  ObservesCommit = TRUE
  Restarts       = TRUE
  LinkShuts      = TRUE
  Reaps          = TRUE
  WaitsRelease   = TRUE
INVARIANT TypeOK
INVARIANT INV_ClosedAfterStop
INVARIANT INV_NoStartAfterStop
INVARIANT INV_SlotRuns
INVARIANT INV_StoppedMeansEnded
INVARIANT INV_DeviceNamesNode
PROPERTY LIVE_NoNodeAfterStop
PROPERTY LIVE_DropStops
PROPERTY LIVE_SwitchEnds
PROPERTY LIVE_WatchWakes
PROPERTY LIVE_StopReturns
PROPERTY LIVE_Recovers
CHECK_DEADLOCK FALSE
