\* run-all: FilteredChunkPush.tla RED
\* the replay sends a chunk whose article was not queued (INV_ChunkOnlyWithItsArticle)
\* RED: the bug plants a replay that sends a matching chunk whether or not its
\* article was queued. The article's heads can't be read, so the replay never
\* sends it, and the receiver holds its chunk alone (INV_ChunkOnlyWithItsArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  NewMatches = {a1}
  Unreadable = {a1}
  StaleMarkers = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = TRUE
  ReplayNeedsArticle = FALSE
  ReplayDefersChunk = TRUE
  ReplayChunksOnRefilter = TRUE
INVARIANT INV_ChunkOnlyWithItsArticle
CHECK_DEADLOCK FALSE
