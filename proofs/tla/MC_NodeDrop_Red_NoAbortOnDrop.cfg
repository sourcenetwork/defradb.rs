\* RED: the shutdown set has no drop that aborts its tasks. A node dropped
\* without shutdown leaves every task running on its pool, each holding the
\* database open forever. Must fail LIVE_DroppedNodeReleasesPool.
SPECIFICATION Spec
CONSTANTS
  SweepInSet  = TRUE
  AbortOnDrop = FALSE
  DropAwaits  = FALSE
PROPERTY LIVE_DroppedNodeReleasesPool
CHECK_DEADLOCK FALSE
