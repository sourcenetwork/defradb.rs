\* RED (guard: Err(current) => seen = current): a lost swap goes round with
\* the mark it saw before instead of the one the swap found. The mark only
\* grows, so it never holds that old value again, and every later swap loses:
\* the close spins forever and the store never finishes closing. One read,
\* one export, one count. Must fail LIVE_EveryCallEnds.
SPECIFICATION Spec
CONSTANTS
  NS           = 1
  NR           = 1
  MaxCount     = 1
  Forward      = TRUE
  ClaimByCas   = TRUE
  Retry        = TRUE
  Refresh      = FALSE
  PublishFirst = TRUE
  HoldStats    = TRUE
  OnlyGrow     = TRUE
  OwnStats     = TRUE
  StopFirst    = TRUE
INVARIANT TypeOK
PROPERTY LIVE_EveryCallEnds
CHECK_DEADLOCK FALSE
