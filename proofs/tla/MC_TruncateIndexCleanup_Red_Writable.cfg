\* run-all: TruncateIndexCleanup.tla RED
\* only writable indexes cleaned: a failed build keeps entries (INV_NoEntryForTruncatedDoc)
\* RED: the cleanup cleans only the indexes that still take writes, leaving
\* out one whose build failed. That build committed a page before it failed,
\* so its entries for the deleted documents outlive the truncate
\* (INV_NoEntryForTruncatedDoc).
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  OldIndexes = {1}
  NewIndexes = {2}
  Source = "InTxn"
  Which = "Writable"
  BackfillRead = "Validated"
  Boundary = "Index"
INVARIANT INV_NoEntryForTruncatedDoc
CHECK_DEADLOCK FALSE
