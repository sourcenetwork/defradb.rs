\* Every guard in place: the provider honours the cut and the receiver doubles
\* it each round. History sent back stays within twice what was missing, the
\* rounds stay logarithmic, and every block arrives.
SPECIFICATION Spec
CONSTANTS
  N = 24
  InitCut = 2
  Cap = 16
  MaxRounds = 4
  Bug = "none"
INVARIANTS INV_TypeOK INV_HoldsHistory INV_HistoryNotResent INV_RoundsLogarithmic
PROPERTY LIVE_Completes
CHECK_DEADLOCK FALSE
