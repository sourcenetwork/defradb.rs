\* RED (h), a caller contract broken: a Hold is given back twice. Pool A holds
\* CPU 0 alone and gives it back twice, so its counter ends one below the
\* number of pools holding CPU 0: below zero when A was alone there (a u32
\* wraps in the Rust), or zero while a pool sharing CPU 0 still runs there,
\* so the next claim alone takes that pool's CPU. Must fail INV_CountExact.
\* Two CPUs, two pools living once each, one claim alone before sharing:
\* small, and still every interleaving of the scenario above.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 1
  Edges            = {}
  Attempts         = 1
  AtomicTake       = TRUE
  RollBack         = TRUE
  InsertAfterWin   = TRUE
  ShareCounts      = TRUE
  AttemptCap       = TRUE
  KeepWhileRunning = TRUE
  ReleaseOnce      = FALSE
  RunOnHeld        = TRUE
  ReleaseAtEnd     = TRUE
INVARIANT TypeOK
INVARIANT INV_CountExact
CHECK_DEADLOCK FALSE
