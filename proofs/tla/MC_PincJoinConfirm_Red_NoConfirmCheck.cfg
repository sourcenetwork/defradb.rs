\* run-all: PincJoinConfirm.tla RED
\* RED: the old code. A subscribe waits only when its join is new to pinc.
\* A publish holds the topic joined, the hub has not answered yet, and the
\* engine subscribes: the join is not new, so it answers "subscribed" at
\* once, and a message published then misses the node. Must fail
\* INV_OkOnlyWhenHeld.
SPECIFICATION Spec
CONSTANTS
  Calls            = {c1, c2}
  MaxUnsub         = 1
  MaxHold          = 1
  MaxLost          = 0
  ConfirmCheck     = FALSE
  StillJoined      = TRUE
  Recheck          = TRUE
  Rollback         = TRUE
  ClearOnLeave     = TRUE
  HubTagsLists     = TRUE
  RejoinAfterDrain = TRUE
INVARIANT TypeOK
INVARIANT INV_OkOnlyWhenHeld
CHECK_DEADLOCK FALSE
