\* run-all: ParentChunks.tla GREEN
\* #2241: text, missing and unused chunks in the parent's transaction, cascade delete
\* GREEN: the hook writes the text, its missing chunks and the deletes of
\* unused ones in the parent's own transaction, a delete deletes the chunks
\* with it, and stale commits abort.
\* Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Writers = {w1, w2}
  MaxOps = 2
  Validate = TRUE
  SameTxn = TRUE
  Cascade = TRUE
  Lookup = TRUE
  Prune = TRUE
INVARIANT TypeOK
INVARIANT INV_TextChunksExist
INVARIANT INV_NoChunkOfDeletedParent
INVARIANT INV_ValidWritesSucceed
INVARIANT INV_OnlyTextChunks
CHECK_DEADLOCK FALSE
