\* run-all: VerifiedRead.tla RED
\* a read decided at a head older than the bound (INV_NeverFromStale)
\* RED: the client decides from its newest revision however old it is: a
\* read asked while no block finalized for longer than the bound is
\* answered at the stale head. Must fail INV_NeverFromStale.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 2
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = TRUE
  MaxBusy     = 1
  RetryBusy   = TRUE
  Patience    = 8
  MaxTook     = 2
  PauseMin    = 1
  PauseMax    = 2
  CountTook   = TRUE
  CheckDrawn  = TRUE
  MaxStale    = 1
  CheckFresh  = FALSE
  WaitFresh   = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverFromStale
