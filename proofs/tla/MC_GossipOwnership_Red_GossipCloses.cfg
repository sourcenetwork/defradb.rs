\* run-all: MC_GossipOwnership_Common.tla RED
\* forgetting a peer closes the shared connection (INV_GossipNeverClosesShared)
\* RED: forgetting a peer closes the connection instead of dropping
\* gossip's sender. Sync and every other protocol on that connection lose
\* it too. Expect INV_GossipNeverClosesShared to be violated.
SPECIFICATION Spec
CONSTANTS
  Peers <- mcPeers
  Revocable <- mcRevocable
  Healthy = "h"
  Legacy = {}
  MaxDrops = 1
  MaxForgets = 1
  ForgetBound = "Bounded"
  PathMode = "SharedMux"
  RecheckMode = "Recheck"
  ForgetMode = "CloseConnection"
  LegacyMode = "Answer"
INVARIANT INV_TypeOK
INVARIANT INV_GossipNeverClosesShared
