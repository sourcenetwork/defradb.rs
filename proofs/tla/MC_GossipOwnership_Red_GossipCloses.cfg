\* RED: forgetting a peer closes the connection instead of dropping
\* gossip's sender. Sync and every other protocol on that connection lose
\* it too. Expect INV_GossipNeverClosesShared to be violated.
SPECIFICATION Spec
CONSTANTS
  Peers <- mcPeers
  Revocable <- mcRevocable
  Healthy = "h"
  MaxDrops = 1
  PathMode = "SharedMux"
  RecheckMode = "Recheck"
  ForgetMode = "CloseConnection"
INVARIANT INV_TypeOK
INVARIANT INV_GossipNeverClosesShared
