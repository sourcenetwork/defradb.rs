\* RED: a merge skips owing because a record already stands. The rebuild
\* that walked before the merge then clears that record, leaving the merged
\* raw entry answering queries: INV_IndexMatchesReads fails.
SPECIFICATION Spec
CONSTANTS
  Gate = "owed"
  OweOnSchemaChange = TRUE
  OweOnMerge = TRUE
  SkipIfOwed = TRUE
  ClearChecksToken = TRUE
  ScanRechecksOwed = TRUE
  MaxSteps = 6
INVARIANT TypeOK INV_IndexMatchesReads INV_SettledIndexAnswers INV_ScanMatchesReads
CHECK_DEADLOCK FALSE
