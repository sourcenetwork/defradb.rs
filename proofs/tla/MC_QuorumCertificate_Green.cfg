\* GREEN: Quorum 2F + 1 = 3, one vote per honest validator, act only on a certificate. One certificate at most, one actor at most, and an uncontended slot commits even when the cheater never votes.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Honest <- mcHonest
  Cheaters <- mcCheaters
  Contenders <- mcContenders
  Quorum = 3
  VoteOnce = TRUE
  ActOnCert = TRUE
INVARIANT TypeOK
INVARIANT INV_OneCertificate
INVARIANT INV_OneActs
PROPERTY PROP_UncontendedCommits
