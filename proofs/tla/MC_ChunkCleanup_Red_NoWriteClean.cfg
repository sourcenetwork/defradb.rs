\* run-all: ChunkCleanup.tla RED
\* an edit only adds chunks (INV_StoredIsSplit)
\* RED: the bug plants an edit that only adds chunks. The chunk the old text
\* used and the new one does not stays live, so storage grows with every edit
\* (INV_StoredIsSplit).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CleanWrites = FALSE
  CleanMerges = TRUE
  DropStale = TRUE
  DeleteGuard = TRUE
  NextGen = TRUE
INVARIANT INV_StoredIsSplit
CHECK_DEADLOCK FALSE
