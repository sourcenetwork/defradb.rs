\* run-all: CommitOutcome.tla RED
\* the registry retains aborted for a failure that may have landed (INV_AbortedMeansNothingLanded)
\* RED: the answer says indeterminate but the registry retains aborted, as the old lifecycle did on every error. A client that lost the answer asks for the outcome, hears aborted, and runs again a write that is on disk. Fails INV_AbortedMeansNothingLanded.
SPECIFICATION Spec
CONSTANT ClassifyFailure = TRUE
CONSTANT RetainFailure = FALSE
CONSTANT NotFoundSaysUnknown = TRUE
CONSTANT ReportRefusal = TRUE
CONSTANT LostReplyUnknown = TRUE
INVARIANT INV_AbortedMeansNothingLanded
CHECK_DEADLOCK FALSE
