\* run-all: ChunkFollow.tla RED
\* doc sync without the chunks with vectors (INV_ChunksFollowParent)
\* RED: the bug plants a document sync that answers with the article's heads
\* only, while its chunks carry vectors. The peer's merge makes none of them,
\* so the synced article is live there without its chunks (INV_ChunksFollowParent).
SPECIFICATION Spec
CONSTANTS
  Articles = {pub, priv}
  Matching = {pub}
  ChunkRule = "parent"
  SyncRule = "none"
  DeletesFollow = TRUE
  Reconcile = TRUE
  Cascade = TRUE
  Embedded = TRUE
  KeepWaiting = TRUE
INVARIANT INV_ChunksFollowParent
CHECK_DEADLOCK FALSE
