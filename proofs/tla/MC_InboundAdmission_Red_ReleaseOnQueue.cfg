\* RED: the lease is dropped when the body is queued, not when it is handled.
\* Queued bodies stop counting, a third bulk body gets in, and memory goes over
\* the bulk budget. Expect INV_ResidentWithinBudget to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  ConnOf <- mcConnOf
  ClassOf <- mcClassOf
  LaneOf <- mcLaneOf
  Classes <- mcClasses
  Lanes <- mcLanes
  Healthy = "h1"
  Stalls <- mcStalls
  StuckClasses <- mcStuckClasses
  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "PerClass"
  ShareMode = "PerConnection"
  DrainMode = "PerLane"
  LeaseMode = "UntilQueued"
  ReadMode = "AdmitFirst"
  DeadlineMode = "Deadline"
  ReadDeadlineMode = "Deadline"
INVARIANT INV_TypeOK
INVARIANT INV_ResidentWithinBudget
