\* GREEN: the dispatch rules of MC_SyncOwnership_Green_Dispatch, with the
\* provider of d1 never serving a fetch: it answers busy or stalls every
\* time. d1's attempts only fail; its head is kept (no acknowledged head
\* leaves while nobody else owns it) but is promised no merge, and d2's head,
\* sharing the one fetch slot, still merges.
SPECIFICATION WFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1, d2}
  Cols           = {}
  MaxV           = 1
  Cap            = 2
  FetchCap       = 1
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MaxAttempts    = 3
  AttemptMode    = "PerAttempt"
  RearmMode      = "AttemptEnd"
  ExpiryMode     = "AckRetained"
  Dead           = {d1}
  Trickle        = {}
  CutoffMode     = "Quantum"
  SharedPeer     = {}
  PeerPermits    = 1
  MaxPulls       = 0
  PermitMode     = "WithSlot"
  DispatchPath   = "OwnLane"
  HandlerSend    = "TryThenClock"
  LaneTurns      = "Bounded"
  Storm          = FALSE
  FifoCap        = 1
INVARIANT INV_DispatchTypeOK
INVARIANT INV_DueOrBackoff
INVARIANT INV_ObligationConservation
INVARIANT INV_SingleFlight
INVARIANT INV_FetchOwnersBounded
PROPERTY ACT_AttemptsStartInDueOrder
PROPERTY ACT_EndedAttemptQueuesBehind
PROPERTY ACT_AckedRootLeavesOwned
PROPERTY LIVE_AckedRootMerged
