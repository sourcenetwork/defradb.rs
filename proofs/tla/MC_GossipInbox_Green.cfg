\* GREEN: control input has its own lane and never waits; what peers send
\* is dropped when its lane is full. However much peers send and however
\* slow the consumer, the endpoint loop always hands the request on and
\* replies, so every request is answered.
SPECIFICATION Spec
CONSTANTS
  Cap = 2
  EventCap = 1
  MaxRecv = 4
  MaxCmds = 2
  InboxMode = "Lanes"
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
PROPERTY LIVE_RequestAnswered
