\* run-all: FilteredChunkPush.tla RED
\* a chunk retry sends the chunk alone (INV_ChunkOnlyWithItsArticle)
\* RED: the bug plants a chunk retry that sends the chunk without its article,
\* for an article forwarded here that no push ever sent. The receiver holds the
\* chunk and not its article (INV_ChunkOnlyWithItsArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  NewMatches = {a1}
  Unreadable = {}
  StaleMarkers = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = FALSE
  RetryEnds = TRUE
  RetryNeedsReadableArticle = TRUE
  ReplayNeedsArticle = TRUE
  ReplayDefersChunk = TRUE
  ReplayChunksOnRefilter = TRUE
INVARIANT INV_ChunkOnlyWithItsArticle
CHECK_DEADLOCK FALSE
