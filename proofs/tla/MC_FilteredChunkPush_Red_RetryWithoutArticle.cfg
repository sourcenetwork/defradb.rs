\* RED: the bug plants a chunk retry that sends the chunk alone. A chunk's
\* marker is left from before the filter; the article is written here before
\* the replicator is added, so no live push sends it; the retry then sends only
\* the chunk, and the receiver holds a chunk whose article it never got
\* (INV_ChunkOnlyWithItsArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  StaleMarkers = {a1, a2}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = FALSE
  RetryEnds = TRUE
  ReplayAddsParent = TRUE
  ReplayNeedsArticle = TRUE
INVARIANT INV_ChunkOnlyWithItsArticle
CHECK_DEADLOCK FALSE
