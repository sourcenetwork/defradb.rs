\* RED: the bug plants a chunk retry that sends the chunk alone. A chunk's
\* marker is left from before the filter; its article arrives from another
\* node, which is never forwarded to a filtered peer; the retry then sends the
\* chunk, and the receiver holds a chunk whose article it never got
\* (INV_ChunkOnlyWithItsArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  StaleMarkers = {a1, a2}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = FALSE
  RetryEnds = TRUE
INVARIANT INV_ChunkOnlyWithItsArticle
CHECK_DEADLOCK FALSE
