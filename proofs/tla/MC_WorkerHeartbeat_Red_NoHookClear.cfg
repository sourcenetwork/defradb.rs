\* RED: a hook poll does not take its own mark off as it returns. The
\* monitor marks a slow hook poll and rests; the hook returns and the idle
\* worker stays marked, routed around for good. Must fail INV_NotLeftStuck.
SPECIFICATION Spec
CONSTANTS
  Limit          = 1
  MaxTime        = 5
  MaxPolls       = 3
  HookBeat       = TRUE
  MarkHoldsStart = TRUE
  HookClears     = FALSE
  Recheck        = TRUE
INVARIANT TypeOK
INVARIANT INV_NotLeftStuck
