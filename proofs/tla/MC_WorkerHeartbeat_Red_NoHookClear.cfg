\* run-all: WorkerHeartbeat.tla RED
\* the hook poll's mark is never taken off: the worker is routed around for a poll that is over (INV_NotLeftStuck)
\* RED: the worker never takes a hook poll's mark off. The monitor marks a
\* slow hook poll; the next task poll replaces it on the heartbeat, the
\* worker's look leaves the mark up, and the worker is routed around for a
\* poll that is over. Must fail INV_NotLeftStuck.
SPECIFICATION Spec
SYMMETRY MonSymmetry
CONSTANTS
  Limit          = 1
  MaxTime        = 6
  MaxPolls       = 4
  Watchers       = {m1, m2}
  HookBeat       = TRUE
  MarkNamesPoll  = TRUE
  HookClears     = FALSE
  Recheck        = TRUE
  MarkKeepsLive  = TRUE
  ClaimMax       = TRUE
INVARIANT TypeOK
INVARIANT INV_NotLeftStuck
