\* RED: the decision cache is keyed by the revision alone, not by the checked
\* term. A takeover voids the grant and the revocation; the revocation is
\* replayed, the grant is owed again and confirmed after it. The chain is as
\* high again, and the answer cached at that height on the void chain is
\* served. Must fail INV_NoVoidDecision.
SPECIFICATION Spec
CONSTANTS
  Keep         = 2
  MaxTakeovers = 1
  Gate         = TRUE
  CacheByTerm  = FALSE
  Restage      = TRUE
  Taint        = TRUE
  CheckWindow  = TRUE
  MaxCrashes   = 1
  GateDelivery = TRUE
  Mark         = TRUE
  KeepBatch    = TRUE
INVARIANT TypeOK
INVARIANT INV_NoVoidDecision
