\* RED: the node stops checking tags. Peer b's stream u1, whose tag nobody
\* registered, is read as if it were a protocol request. Expect
\* INV_OnlyRegisteredServed to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  Registered <- mcRegistered
  Stuck <- mcStuck
  Share = 1
  TagMode = "Any"
  LeaseMode = "ReleaseOnHandoff"
  DeadlineMode = "Deadline"
  RevokeMode = "Close"
  ShutdownMode = "Abort"
INVARIANT INV_TypeOK
INVARIANT INV_OnlyRegisteredServed
