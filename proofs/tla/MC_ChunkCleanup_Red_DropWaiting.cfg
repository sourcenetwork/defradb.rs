\* run-all: ChunkCleanup.tla RED
\* a merge deletes a chunk whose commit has not merged here (INV_NoResurrect)
\* RED: the bug plants rules that treat a chunk naming a commit not merged here
\* like any other. A peer gets the writer's chunk before the article's commit
\* that made it, deletes it at an earlier commit that does not use it, and
\* the merge of the commit then needs that deleted document again
\* (INV_NoResurrect).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 2
  CleanWrites = TRUE
  CleanMerges = TRUE
  DropStale = TRUE
  DeleteGuard = TRUE
  Ids = "source"
  Reanchor = TRUE
  KeepWaiting = FALSE
INVARIANT INV_NoResurrect
CHECK_DEADLOCK FALSE
