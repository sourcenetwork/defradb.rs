\* RED (n): make_default answers "yes" whenever it finds a running registered
\* pool, without comparing it with its own (Arc::ptr_eq, default.rs:92,
\* removed). p1 registers and runs; p2's make_default finds p1 running, leaves
\* the slot alone and still answers "yes": p2 believes it is the default while
\* every call is answered p1. Two pools are the smallest instance with a second
\* registration. Must fail INV_MakeDefaultTellsTruth.
SPECIFICATION Spec
CONSTANTS
  NP                 = 2
  NC                 = 1
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = FALSE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_MakeDefaultTellsTruth
CHECK_DEADLOCK FALSE
