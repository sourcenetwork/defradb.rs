\* GREEN: each parent has two children and asks for one, so the limit binds:
\* each parent's scan stops after its first child, both pages are exact, and
\* when the scan stops the second parent still holds the page it was owed.
SPECIFICATION FairSpec
CONSTANTS
  Mode        = "PerParent"
  StopAtLimit = TRUE
  Limit       = 1
  Parents     = {"a", "b"}
  ChildrenOfA = {1, 2}
  ChildrenOfB = {3, 4}
INVARIANT TypeOK
PROPERTY LIVE_EveryParentCompletesOrderedPage
INVARIANT INV_PageIsOrderedPrefix
INVARIANT INV_PageWithinLimit
INVARIANT INV_SecondParentKeepsPage
CHECK_DEADLOCK FALSE
