\* GREEN: each parent owns its bound. The scan runs until both pages are full
\* (Limit = 2, two children each), and when it stops the second parent holds
\* both of its children.
SPECIFICATION FairSpec
CONSTANTS
  Mode        = "PerParent"
  Limit       = 2
  Parents     = {"a", "b"}
  ChildrenOfA = {1, 2}
  ChildrenOfB = {3, 4}
INVARIANT TypeOK
INVARIANT INV_SecondParentKeepsPage
INVARIANT INV_PageWithinLimit
PROPERTY LIVE_EveryParentPage
CHECK_DEADLOCK FALSE
