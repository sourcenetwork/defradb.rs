\* a batch the create refuses for a taken ID loses the documents before it (INV_KeepsPrefix)
\* RED: a create the database refuses fails the import as a whole. The file
\* gives its two documents no ID and the same content, so the same new ID,
\* as testo's two Johns: gathered as one batch, the create refuses the
\* second and saves neither, though the first comes before it. No alias is
\* held, so only the create's own refusal stops it. Must fail
\* INV_KeepsPrefix.
SPECIFICATION Spec
CONSTANTS
  Files <- ContentFiles
  OwnMutator          = FALSE
  KeepSigningChoice   = TRUE
  AliasInTxn          = TRUE
  CheckBeforeCreate   = TRUE
  FfiOwnPath          = TRUE
  KeepCaller          = TRUE
  HoldImport          = TRUE
  DetachedImport      = TRUE
  AnonAsCreate        = TRUE
  AdapterTakesHost    = TRUE
  DriverOnCaller      = TRUE
  FlushOnPendingAlias = TRUE
  OneByOneOnRefusal   = FALSE
  RegisterEachOnRefusal = TRUE
  RequireNode         = TRUE
  ImportRouteOnEdge   = TRUE
INVARIANT INV_KeepsPrefix
CHECK_DEADLOCK FALSE
