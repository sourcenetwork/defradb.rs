\* RED: the bug that was on main. The stream carries only blocks that
\* finalize after the subscription. A fresh deployment's first block
\* finalized before it, nothing else comes until the heartbeat, and the
\* drained light client still has no head. Must fail INV_Current.
SPECIFICATION Spec
CONSTANTS
  MaxHeight      = 3
  HeadFirst      = FALSE
  FreshHead      = TRUE
  SubscribeFirst = TRUE
  Verify         = TRUE
INVARIANT TypeOK
INVARIANT INV_Current
