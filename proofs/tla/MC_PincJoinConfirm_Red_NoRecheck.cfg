\* RED: a wait that runs out does not look at the confirmed set again. The
\* event is read and wakes the subscribe, but its timer wins the race: it
\* fails although the node knows the hub holds it. Must fail
\* INV_FailOnlyUnconfirmed.
SPECIFICATION Spec
CONSTANTS
  Calls            = {c1}
  MaxUnsub         = 1
  MaxHold          = 0
  MaxLost          = 0
  ConfirmCheck     = TRUE
  StillJoined      = TRUE
  Recheck          = FALSE
  Rollback         = TRUE
  ClearOnLeave     = TRUE
  HubTagsLists     = TRUE
  RejoinAfterDrain = TRUE
INVARIANT TypeOK
INVARIANT INV_FailOnlyUnconfirmed
CHECK_DEADLOCK FALSE
