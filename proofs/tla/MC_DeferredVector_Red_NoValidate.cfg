\* run-all: DeferredVector.tla RED
\* the drain deletes an entry rewritten after it read it
\* Plants a drain whose read of an entry is not validated at commit. A write
\* replaces the entry between the drain's read and its commit; the drain
\* applies the old vector and deletes the new entry, so the graph keeps a stale
\* vector with nothing pending: INV_GraphSettled fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {n1, n2}
          Drains = {d1, d2}
          MaxWrites = 3
          MaxCrashes = 1
          ValidateRead = FALSE
          Supersede = TRUE
          MergePending = TRUE
          DropStale = TRUE
          AskOnCommit = TRUE
          SettleAtOpen = TRUE
INVARIANT INV_GraphSettled
