\* RED (i): a failed start keeps the turn (the permit is not given back on the
\* error path, once_cell.rs:142-144, 148). c1's start fails and c1 returns its
\* error; c2 waits for the turn forever, and the cell stays empty: every later
\* call off a worker hangs. Two callers and no registrable pool. Must fail
\* LIVE_EveryCallReturns.
SPECIFICATION Spec
CONSTANTS
  NP                 = 0
  NC                 = 2
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = FALSE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
PROPERTY LIVE_EveryCallReturns
CHECK_DEADLOCK FALSE
