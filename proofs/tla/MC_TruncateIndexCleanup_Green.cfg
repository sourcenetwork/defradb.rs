\* #3172: the cleanup reads the definition after the chunks and cleans every declared index, one prefix each
\* GREEN: the cleanup reads the definition in its own transaction after the
\* chunks, cleans every declared index (a failed build's too) one prefix at a
\* time, and every backfill page reads its documents as validated reads. An
\* index created at any point of the truncate, or whose build fails, keeps no
\* entry for a deleted document, and the other collection is untouched.
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  OldIndexes = {1}
  NewIndexes = {2}
  Source = "InTxn"
  Which = "Declared"
  BackfillRead = "Validated"
  Boundary = "Index"
INVARIANT TypeOK
INVARIANT INV_NoEntryForTruncatedDoc
INVARIANT INV_OtherCollectionIntact
PROPERTY LIVE_TruncateFinishes
CHECK_DEADLOCK FALSE
