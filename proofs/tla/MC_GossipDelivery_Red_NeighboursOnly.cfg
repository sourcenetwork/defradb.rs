\* RED: the direct push goes only to gossip's neighbours. A small update
\* reaches far through near, but the huge one, pushed to near alone, never
\* reaches far, a subscriber connected to the publisher. Expect
\* INV_NoSilentLoss to be violated.
SPECIFICATION Spec
CONSTANTS
  FrameLimit = 13
  TopicLen = 3
  Overhead = 2
  Size <- MCSize
  Control <- MCControl
  LimitMatched = TRUE
  Fallback = TRUE
  PushConnected = FALSE
  SkipOversize = TRUE
  ReportLoss = TRUE
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
INVARIANT INV_NoSilentLoss
INVARIANT INV_BroadcastFits
