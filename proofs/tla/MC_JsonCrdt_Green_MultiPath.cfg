\* GREEN, multi-path: blocks edit several paths at once.
\* The design. Two peers write two blocks between them, each editing any
\* settled mix of "a", "a.b" and "c" ({} at "a" with 1 at "a.b", a delete of
\* "a" with a set of "a.b", ...), in every order the causal buffer allows.
\* Same blocks give the same JSON and conflicts, one block at a time equals
\* reading from scratch, and every write lands as its writer read it.
SPECIFICATION Spec
CONSTANTS
  Peers            = {p1, p2}
  MaxBlocks        = 2
  UseCid           = TRUE
  DeleteWins       = FALSE
  DeleteImpliesMap = FALSE
  SharedIds        = FALSE
  MultiPath        = TRUE
  Settle           = TRUE
  ReadAs           = "design"
  Anchor           = TRUE
SYMMETRY PeerSymmetry
INVARIANT TypeOK
INVARIANT INV_Converge
INVARIANT INV_MatchesReplay
INVARIANT INV_ConflictsAreLosers
INVARIANT INV_WriteLandsAsRead
