\* run-all: PostCommitFence.tla RED
\* post-commit work ignores another outstanding fence (INV_WaitsForEveryOtherFence)
\* RED: the post-commit read waits for its own commit but not for commit 2's
\* fence. It snapshots before commit 2 lands, and the snapshot misses a commit
\* every later reader must see.
SPECIFICATION Spec
CONSTANTS
  WaitOthers = FALSE
INVARIANT INV_WaitsForEveryOtherFence
CHECK_DEADLOCK FALSE
