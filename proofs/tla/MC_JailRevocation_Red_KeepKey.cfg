\* RED: a writer restored from a backup keeps its old key. Its new block and the one it forgot are two blocks by one key, so nodes hold a fork proof against an honest key (INV_NoWrongfulRevocation).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  Peers <- mcPeers
  CheaterKeys <- mcOneCheaterKey
  HonestKey <- mcHonestKey
  RestoreKey <- mcRestoreKey
  WriterHome <- mcWriterHome
  Budget <- mcBudget
  CheckMembership = TRUE
  CheckEvidence = TRUE
  RetryOnAdmission = TRUE
  RotateOnRestore = FALSE
  Restores = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWrongfulRevocation
