\* run-all: DocSyncCompletion.tla RED
\* RED: the code before the reply handler reported held documents. The peer answers for an asked document with heads the node has already merged, so nothing is fetched and nothing merges, and no report of it ever comes. Every answer is handled and every report read, yet the sync keeps waiting until its timeouts (INV_NoWaitOnceEveryAnswerHandled).
SPECIFICATION Spec
CONSTANTS
  Docs         = {d1, d2, d3}
  Peers        = {p1}
  MaxReports   = 4
  CountReports = FALSE
  FilterAsked  = TRUE
  HeldDocs     = {d1}
  ReportHeld   = FALSE
INVARIANT TypeOK
INVARIANT INV_CompleteMeansEveryDocMerged
INVARIANT INV_DoneOnceEveryDocReported
INVARIANT INV_NoWaitOnceEveryAnswerHandled
CHECK_DEADLOCK FALSE
