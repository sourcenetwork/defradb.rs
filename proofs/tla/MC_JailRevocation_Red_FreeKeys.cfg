\* RED: nodes merge from any key, admitted or not. The cheater writes with both k1 and k2 though the admin admits only one, so a free key gets in (INV_CheaterWithinBudget).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  Peers <- mcPeers
  CheaterKeys <- mcCheaterKeys
  HonestKey <- mcHonestKey
  WriterHome <- mcWriterHome
  Budget <- mcBudget
  CheckMembership = FALSE
  CheckEvidence = TRUE
  RetryOnAdmission = TRUE
INVARIANT TypeOK
INVARIANT INV_CheaterWithinBudget
