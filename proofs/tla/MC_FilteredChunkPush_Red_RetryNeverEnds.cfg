\* RED: the bug plants a chunk retry that fails and keeps its marker while the
\* article is not here. The article never arrives, so the retry runs forever,
\* holding the peer's backoff up and marking it inactive (LIVE_RetriesEnd).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  StaleMarkers = {a1, a2}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  RetrySendsArticle = TRUE
  RetryEnds = FALSE
  ReplayAddsParent = TRUE
  ReplayNeedsArticle = TRUE
PROPERTY LIVE_RetriesEnd
CHECK_DEADLOCK FALSE
