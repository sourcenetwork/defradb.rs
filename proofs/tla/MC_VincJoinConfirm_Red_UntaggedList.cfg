\* RED (vinc today, #483): a list counts for any join. The hub answers the
\* first join, the engine unsubscribes and subscribes again, and the old list
\* arrives after the new join: vinc takes it as the new join's, and the
\* subscribe answers "subscribed" before the hub took the new subscribe.
\* Must fail INV_OkOnlyWhenHeld.
SPECIFICATION Spec
CONSTANTS
  Calls            = {c1, c2}
  MaxUnsub         = 1
  MaxHold          = 0
  MaxLost          = 0
  ConfirmCheck     = TRUE
  StillJoined      = TRUE
  Recheck          = TRUE
  Rollback         = TRUE
  ClearOnLeave     = TRUE
  HubTagsLists     = FALSE
  RejoinAfterDrain = TRUE
INVARIANT TypeOK
INVARIANT INV_OkOnlyWhenHeld
CHECK_DEADLOCK FALSE
