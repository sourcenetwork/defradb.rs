\* Bug: a replay from the old install writes through create_replicator after a Replace, so it
\* flips the replacement's row to inactive, a row it does not own (ACT_NoStaleFlip).
SPECIFICATION Spec
CONSTANT MarkerMode = "replay"
CONSTANT Stale = "retry"
CONSTANT ReplayMode = "create"
PROPERTY ACT_NoStaleFlip
CHECK_DEADLOCK FALSE
