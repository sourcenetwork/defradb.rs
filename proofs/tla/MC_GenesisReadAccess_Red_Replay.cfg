\* Plants the bug: the initial reader is granted on every arrival, not only at the
\* first registration. The owner revokes it, the genesis arrives again, and the
\* revoked reader is back: INV_RevocationStands fails.
SPECIFICATION Spec
CONSTANT Bug = "replay"
INVARIANT INV_SignedOnly
INVARIANT INV_OptedIn
INVARIANT INV_RevocationStands
CHECK_DEADLOCK FALSE
