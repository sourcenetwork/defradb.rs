\* Bug planted: sending a stored block again marks it whatever it was. b merges, a peer sends it again, and it is marked again though merged: INV_MergedUnmarked fails.
SPECIFICATION Spec
CONSTANTS
  MaxActs = 2
  ReadMode = "Validated"
  OwnerMode = "Checked"
  RefreshMode = "Blind"
  LegacyMode = "Skip"
  SigMarkMode = "Clear"
  SigOwnerMode = "Owned"
INVARIANTS TypeOK INV_NoMergedLoss INV_NoOwnedLoss INV_MergedUnmarked INV_SigOwned INV_LegacyKept
PROPERTY PROP_Reclaims
CHECK_DEADLOCK FALSE
