\* RED: the bug plants a retry that clears the marker of a chunk whose article
\* has not arrived yet. The replay left the chunk owed, its article arrives
\* later, and the receiver never gets the chunk (INV_SettledHasMatchingChunks).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = TRUE
  TxnCarriesArticle = TRUE
  KeepWaiting = FALSE
INVARIANT INV_SettledHasMatchingChunks
CHECK_DEADLOCK FALSE
