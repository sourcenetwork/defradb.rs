\* run-all: UpdateJournalRetention.tla RED
\* RED: a truncate slice starts at any kept row instead of the oldest one.
\* It drops a row above one that is still kept, leaving a hole in the middle
\* of the journal, so the dropped rows are no longer one run from cursor 1.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS MaxRows = 3 Slice = 1 Limit = 2 Truncators = {t1} Blocks = {b1, b2} MaxLives = 2 Mode = "anywhere"
INVARIANT INV_Prefix
