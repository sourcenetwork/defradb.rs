\* RED: delete wins. A delete of "a" stays in the race against the map that
\* a concurrent edit of "a.b" implies. Alice deletes "a" while Bob sets
\* "a.b"; when Alice's delete has the higher priority or CID, "a" reads as
\* gone and Bob's edit vanishes although Alice never saw it. Must fail
\* INV_UpdateWins.
SPECIFICATION Spec
CONSTANTS
  Peers            = {p1, p2}
  MaxBlocks        = 3
  UseCid           = TRUE
  DeleteWins       = TRUE
  DeleteImpliesMap = FALSE
INVARIANT TypeOK
INVARIANT INV_UpdateWins
