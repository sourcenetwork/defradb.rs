\* RED: the live permission check is left out, as the HTTP disable route
\* did. A caller without the permission reads the status, turns NAC off, or
\* gives or takes a relation (INV_NoStatusWithoutPermission,
\* INV_NoDisableWithoutPermission, INV_NoGrantUnlessAllChecksPass).
SPECIFICATION Spec
CONSTANTS
  Enforced = {"configured", "already", "stored", "acp", "identity", "relation", "target"}
  LiveReEnable = FALSE
  StartReEnables = FALSE
  AlreadyFirst = FALSE
  SplitScope = FALSE
  OutsideGuard = FALSE
  NoRetry = FALSE
INVARIANT INV_NoStatusWithoutPermission INV_NoDisableWithoutPermission INV_NoGrantUnlessAllChecksPass
CHECK_DEADLOCK FALSE
