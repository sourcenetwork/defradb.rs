\* Plants F5: a failed marker registration ends the fan-out, and every peer
\* not registered yet loses its intent. The failed peer's own intent is kept
\* here, so only the abort is planted. h commits yb, which fans out to a and
\* b; the registration for a fails and b's intent for yb is dropped: yb is
\* merged on h and owed to b by nobody. INV_ObligationOwned fails.
SPECIFICATION Spec
CONSTANTS
  Nodes <- eNodes
  Repl <- eRepl
  Heads <- eHeads
  Author <- eAuthor
  Parent <- eParent
  Prio <- ePrio
  KeyOrder <- eKeyOrder
  Base <- eBase
  Fresh <- eFresh
  Backlogs <- eBacklogs
  Trickle <- eTrickle
  Dead <- eDead
  PullPeer <- ePullPeer
  PullAt <- ePullAt
  Storm <- eStorm
  Crashable <- eCrashable
  ConnectedAtStart <- eConnectedAtStart
  K = 1
  Permits = 1
  PeerPermits = 1
  MemCap = 3
  PeerQuota = 3
  DurCap = 3
  MaxCrash = 1
  MaxRegFail = 1
  MaxDisc = 0
  MaxCont = 0
  CoverRule = "Ancestry"
  ShutdownOrder = "DrainFirst"
  ForwardMode = "BeforeMark"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Kept"
  FanoutMode = "AbortOnFirstFail"
  SlotBeforePermit = FALSE
  DispatchPath = "Direct"
  ConnMode = "Served"
INVARIANT INV_TypeOK
INVARIANT INV_Bounded
INVARIANT INV_ObligationOwned
INVARIANT INV_ReverseBorrowServed
CHECK_DEADLOCK FALSE
