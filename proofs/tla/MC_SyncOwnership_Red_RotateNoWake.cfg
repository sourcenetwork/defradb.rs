\* run-all: MC_SyncOwnership_Memory.tla RED
\* a root gives its entry up and the sweep sleeps until its tick beside the place (INV_FreedPlaceArmed)
\* RED (#2307): Green_Memory, without the pull, with the rotation's wake left
\* out (PendingDagLease::finish_attempt before the fix). d1's provider never
\* serves and it holds the map's one place after the restart. Once it had its
\* dispatches it gives the place up to d2, which waits on its durable record,
\* but nothing wakes the sweep: the place stands empty, with d2 waiting for it,
\* until the sweep's next tick, a whole minute in the code. After a write burst
\* every place can go this way, one after another, and the replicas take an
\* hour to converge. Fails INV_FreedPlaceArmed.
SPECIFICATION MFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs             = {d1, d2}
  Cols             = {}
  MaxV             = 1
  Cap              = 2
  FetchCap         = 1
  SenderMode       = "MarkerRederive"
  RegisterMode     = "Durable"
  FlightMode       = "SingleFlight"
  AckGuardMode     = "HeadCurrent"
  ServeMode        = "DurableDerived"
  ProviderMode     = "OriginBound"
  OriginAuthMode   = "TransportBound"
  FetchMode        = "RootThenSelective"
  StreamMode       = "DrainResponse"
  CompletionMode   = "LatchedDrain"
  PendingMode      = "ScopeCurrent"
  MergeMode        = "SerializedBatch"
  MemCap           = 1
  RotateAfter      = 1
  Dead             = {d1}
  PullScopes       = {}
  OverflowMode     = "Rotate"
  ContinuationMode = "EndOnStop"
  AdmissionMode    = "TwoTier"
  PeerScopes       = {{d1}, {d2}}
  DurableQuota     = 1
  WakeMode         = "NoRotateWake"
INVARIANT INV_MemoryTypeOK
INVARIANT INV_FreedPlaceArmed
