\* GREEN: the real code. Three documents, two of whose writes also write NAC
\* tuples, written in any order around a savepoint that may be rolled back:
\* the commit rebuilds the edge snapshot whenever a NAC write survived, and
\* never for a transaction whose surviving writes touched no NAC tuple.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2, d3}
  NacDocs = {d1, d2}
  Bug = "None"
INVARIANT TypeOK
INVARIANT INV_RebuiltAfterNacWrite
INVARIANT INV_NoRebuildWithoutNacWrite
CHECK_DEADLOCK FALSE
