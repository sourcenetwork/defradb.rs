\* RED: P2P shuts down while a transactional write's marker registration is
\* still pending, as Node::shutdown stopped P2P before it drained requests.
\* P2P's shutdown refuses or aborts the coordinator task, the dropped task
\* returns the commit call, and the writer is told the write committed
\* although no marker owes its head: a document created once is never
\* replicated. Must fail ACT_AckedWriteOwned.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Docs           = {d1}
  Cols           = {}
  MaxV           = 2
  Cap            = 2
  FetchCap       = 1
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MarkerHandoff  <- HandoffUndrained
PROPERTY ACT_AckedWriteOwned
