\* run-all: FilteredChunkPushRecord.tla RED
\* a removal writes collections the disk holds no filter for (INV_NothingUnmatched)
\* RED: the bug plants a removal that writes to disk the collections it read
\* from memory. A removal of the article reads the disk without it, the add
\* puts it back with its filter, and a later removal writes the article and
\* its chunk collection with the disk's empty filter. After a restart the
\* unmatched article and its chunk reach the receiver (INV_NothingUnmatched).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  MaxRestarts = 2
  LookupCanFail = TRUE
  CanCorrupt = TRUE
  AddPairs = TRUE
  RemoveTakesChunks = TRUE
  KeepStoredPair = TRUE
  PersistOnlyNarrows = FALSE
  PersistInOneTxn = TRUE
  BadRecordFailsClosed = TRUE
INVARIANT INV_NothingUnmatched
CHECK_DEADLOCK FALSE
