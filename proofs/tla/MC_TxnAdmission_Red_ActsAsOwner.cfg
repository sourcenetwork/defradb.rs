\* RED: a request's work runs as the identity that began the transaction
\* instead of its own. On the FFI, a request acting as bob reaches a
\* transaction alice began, and access control judges it as alice. Must fail
\* INV_ActsAsCaller.
SPECIFICATION Spec
CONSTANTS
  EmbedderMode  = TRUE
  IdentityKey   = TRUE
  ActsAsRequest = FALSE
INVARIANT INV_ActsAsCaller
CHECK_DEADLOCK FALSE
