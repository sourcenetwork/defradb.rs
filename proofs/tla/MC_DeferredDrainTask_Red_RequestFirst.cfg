\* RED: a stored request wins over a due sweep. The hot index stores a wake during
\* every pass, the task always takes it, and the quiet index waits for the sweep
\* forever (PROP_QuietSettles).
SPECIFICATION Spec
CONSTANTS
  Poison = 1
  Hot = 2
  Quiet = 3
  Interval = 2
  Isolate = "On"
  KeepFailed = "On"
  Requeue = "On"
  PurgeRequests = "On"
  SweepTimer = "Fixed"
  SweepFirst = "Off"
PROPERTY PROP_QuietSettles
CHECK_DEADLOCK FALSE
