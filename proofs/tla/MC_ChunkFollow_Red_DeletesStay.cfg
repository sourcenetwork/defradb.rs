\* RED: the bug plants an edit whose chunk delete is never pushed, with no merge
\* cleanup to make up for it. The peer got the chunk with the article, the
\* article's edit arrives, and the chunk it stopped using stays live
\* (INV_DroppedChunksGo).
SPECIFICATION Spec
CONSTANTS
  Articles = {pub}
  Matching = {pub}
  ChunkRule = "parent"
  SyncFollows = TRUE
  DeletesFollow = FALSE
  Reconcile = FALSE
INVARIANT INV_DroppedChunksGo
CHECK_DEADLOCK FALSE
