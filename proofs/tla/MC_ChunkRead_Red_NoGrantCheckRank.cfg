\* RED: the bug plants a check that never asks whether the reader may read the article, as in
\* MC_ChunkRead_Red_NoGrantCheck, and checks only the ranking. The owner revokes the reader's access, and a ranking of the article,
\* which has read rules and so is never routed, still scores it (INV_RankedIsBestListed).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = TRUE
  CheckGranted = FALSE
  CheckListed = TRUE
  RouteChecksList = TRUE
  RouteOnlyUnruled = TRUE
INVARIANT INV_RankedIsBestListed
CHECK_DEADLOCK FALSE
