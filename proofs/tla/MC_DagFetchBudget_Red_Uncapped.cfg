\* Every fast refusal is free, with no per-attempt allowance. A provider set
\* that refuses every batch then costs batches x providers refusals, which
\* outgrows the bound and fails INV_WaitBounded.
INIT Init
NEXT Next
CONSTANTS Batches = 6
          Providers = 2
          Window = 3
          Fast = 1
          MaxFree = 2
          SlowMode = "Stall"
          CapMode = "Uncapped"
          CheckMode = "Check"
INVARIANT INV_TypeOK
INVARIANT INV_WaitBounded
CHECK_DEADLOCK FALSE
