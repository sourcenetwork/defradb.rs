\* run-all: ClientUniqueAdmission.tla GREEN
\* nil is never refused over nil, only over a non-nil value its filter read
\* GREEN: the race under a unique index where a client may write nil. Nil is
\* never checked (its entry key carries the DocID) and a filter for nil is a
\* prefix scan that decides nothing, so a writer of nil is never refused over
\* nil; it can lose its commit only over the "v" its filter read (the known
\* defect), while two writers of "v" still race. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Clients = {1, 2}
  Values = {"nil", "v"}
  Mode = "Explicit"
  Indexed = TRUE
  EntryValidated = TRUE
  ScanDecides = FALSE
  FilterValidated = FALSE
  LoserLeaves = FALSE
  RerunReuses = FALSE
  NilChecked = FALSE
  MaxAttempts = 3
INVARIANT TypeOK
INVARIANT INV_AtMostOnePerNonNilValue
INVARIANT INV_LoserLeavesNothing
INVARIANT INV_LoserRefusedTyped
INVARIANT INV_NoIndexNotRefused
INVARIANT INV_NilNotRefused
INVARIANT INV_RefusedOnlyOverItsOwnValue
CHECK_DEADLOCK FALSE
