\* run-all: ClientUniqueAdmission.tla RED
\* the entry check is not validated: two documents hold the value (INV_AtMostOnePerNonNilValue)
\* RED: the unique entry check is a read that is not validated at commit (a
\* snapshot read, or a read with no parts). Both clients see no entry, both
\* commit, and two documents hold "v" (INV_AtMostOnePerNonNilValue).
SPECIFICATION Spec
CONSTANTS
  Clients = {1, 2}
  Values = {"v"}
  Mode = "Explicit"
  Indexed = TRUE
  EntryValidated = FALSE
  ScanDecides = FALSE
  LoserLeaves = FALSE
  RerunReuses = FALSE
  NilChecked = FALSE
  MaxAttempts = 3
INVARIANT INV_AtMostOnePerNonNilValue
CHECK_DEADLOCK FALSE
