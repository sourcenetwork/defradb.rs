\* RED: each wait gets a time limit of its own, as a new sleep per read would,
\* instead of one deadline from the start. A client sends an SSL request, a
\* GSS request and a startup, each just before its own limit runs out: the
\* startup goes on past the limit counted from the start. Must fail
\* INV_StartupWithinDeadline.
SPECIFICATION Spec
CONSTANTS
  Limit              = 2
  MaxTime            = 4
  MaxMsgs            = 3
  PreMsgs            = {"ssl", "gss", "did"}
  PostMsgs           = {"pwOk"}
  SimpleCopy         = FALSE
  ExtendedCopy       = FALSE
  StartupErrorsFatal = TRUE
  DeadlineAtAccept   = TRUE
  SslArmed           = TRUE
  StartupArmed       = TRUE
  OneDeadline        = FALSE
  StartupOnly        = TRUE
  WaitForSync        = TRUE
  SyncOnly           = TRUE
  SyncResumes        = TRUE
  CopyFlagFromState  = TRUE
  CopyDoneLeaves     = TRUE
  CloseOnEnd         = TRUE
  StopOnClose        = TRUE
INVARIANT TypeOK
INVARIANT INV_StartupWithinDeadline
CHECK_DEADLOCK FALSE
