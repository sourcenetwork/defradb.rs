\* run-all: StorePurge.tla GREEN
\* defradb start wipes only after the Vera stop and the close succeeded
\* GREEN: the `defradb start` path, in development mode or not, on both
\* store kinds, with and without an embedded Vera node. The run loop wipes
\* only after the Vera node stopped and the database closed; outside
\* development mode the purge is refused and nothing stops.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Cli"}
  Stores   = {"Persistent", "Memory"}
  Veras    = {"None", "Embedded"}
  Developments = {TRUE, FALSE}
  Handlers = {TRUE}
  HeldElsewhere = {FALSE}
  OtherCallers  = {FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
  SignerHeld               = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWipeWhileOpen
INVARIANT INV_NoOpenBeforeWipe
INVARIANT INV_NothingSurvives
INVARIANT INV_KeyringKept
INVARIANT INV_SignerSurvivesRestart
INVARIANT INV_RefusedPurgeTouchesNothing
INVARIANT INV_PurgeOnlyInDevelopment
INVARIANT INV_OnePurgePerRun
INVARIANT INV_NoRestartAfterFailedTeardown
PROPERTY LIVE_PurgeServesAgain
CHECK_DEADLOCK FALSE
