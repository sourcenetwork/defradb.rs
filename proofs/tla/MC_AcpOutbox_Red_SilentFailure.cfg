\* RED: a submission of the registration that fails leaves nothing in its
\* record. The document is created here with a delegation; the provider is
\* away when the commit's submission runs. The commit stands, the
\* registration stays owed, and nothing says why. Must fail
\* INV_FailureReported.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"node"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 1
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node", "deleg"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = FALSE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = FALSE
  Note                     = TRUE
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT INV_FailureReported
CHECK_DEADLOCK FALSE
