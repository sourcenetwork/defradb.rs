\* run-all: ChunkRead.tla RED
\* a chunk that arrived first is served as public (INV_ServedIsReadable)
\* RED: the bug plants a block owner lookup that trusts the chunk's parent link
\* without checking the article has arrived. The chunk arrives first, the unknown
\* article counts as public, and a peer gets the private text (INV_ServedIsReadable).
SPECIFICATION Spec
