  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = FALSE
  CheckGranted = TRUE
  CheckCut = TRUE
  CheckResolved = TRUE
  CheckOwnApp = TRUE
  CheckDelegationScope = TRUE
INVARIANT INV_ServedIsReadable
CHECK_DEADLOCK FALSE
