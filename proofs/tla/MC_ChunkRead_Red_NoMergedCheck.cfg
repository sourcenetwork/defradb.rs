  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = TRUE
  CheckMerged = FALSE
INVARIANT INV_ServedIsReadable
CHECK_DEADLOCK FALSE
