\* RED: a read asks the registration still owed to the creator before the
\* owed archive. The owner creates the document, deletes it before the
\* deployment confirms the registration, and reads it again: the owed
\* registration lets its creator in, though the document is deleted.
\* Must fail INV_DeletedGrantsNothing.
SPECIFICATION Spec
CONSTANTS
  CheckOwner  = TRUE
  Drop        = TRUE
  VeraRefuses = TRUE
  Overlay     = TRUE
  HistoryActorOnly = TRUE
  First       = "owedRegistration"
INVARIANT TypeOK
INVARIANT INV_DeletedGrantsNothing
