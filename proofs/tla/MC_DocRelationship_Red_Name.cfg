\* run-all: DocRelationship.tla RED
\* The core skips the name check: a relationship changes although that check fails (INV_NoChangeUnlessAllChecksPass)
\* RED: the core no longer checks that a collection is named, so a request naming none goes on to change one.
\* Both ways in forward to it, so both make the change.
SPECIFICATION Spec
CONSTANTS
  Skipped = {"name"}
  Swapped = TRUE
  ServerCopy = FALSE
  EventFirst = FALSE
  TxnSwapped = FALSE
INVARIANT INV_NoChangeUnlessAllChecksPass
CHECK_DEADLOCK FALSE
