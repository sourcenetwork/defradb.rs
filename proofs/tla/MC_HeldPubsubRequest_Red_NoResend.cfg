\* RED: the request is sent once and never again, so a peer that subscribes after the first
\* publish never gets it. Fails Delivered.
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  HoldOnRefusal = TRUE
  ResendOnJoin = FALSE
  WatchBeforePublish = TRUE
  DedupeReplies = TRUE
  StopAtDeadline = TRUE
INVARIANT TypeOK
INVARIANT Delivered
INVARIANT OneReplyEach
INVARIANT RefusedOnlyUnsent
INVARIANT NoResendAfterDeadline
