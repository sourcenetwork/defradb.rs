\* run-all: TxnOutcomeQuery.tla GREEN
\* a lost commit answer is queryable only by its owner, under its start token, until the idle age
SPECIFICATION Spec
CONSTANTS
    Idle = 2
    QueryWorks = TRUE
    CheckToken = TRUE
    CheckOwner = TRUE
    BrokenStart = FALSE
    LeaksOwner = FALSE
    ConsumesOnRead = FALSE
    PollsOnce = FALSE
    EvictsLive = FALSE
    Cap = 2

INVARIANT
    INV_Agreement
    INV_Foreign
    INV_StartToken
    INV_FinalAnswer
    INV_Bounded
    INV_OwnerSettled

PROPERTY
    LIVE_QuestionAnswered
CHECK_DEADLOCK FALSE
