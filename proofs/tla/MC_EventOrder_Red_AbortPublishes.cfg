\* RED: an aborted commit keeps its events and goes out at its floor, so
\* events of a commit that never happened are published (INV_OnlyCommitted).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Txns = {t1}
  MaxReceipt = 1
  Mode = "abort_publishes"
INVARIANT TypeOK
INVARIANT INV_OnlyCommitted
