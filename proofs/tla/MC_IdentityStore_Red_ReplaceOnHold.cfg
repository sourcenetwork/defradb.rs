\* RED: a hold with another signer replaces the stored one instead of being
\* refused, as hold_identity did. Holder a registers the DID with its signer;
\* holder b registers it again with its own, and the store now signs a's
\* requests through b's. Once b is freed its host may free that context, and
\* a still signs through it. Must fail INV_OwnSigner.
SPECIFICATION Spec
CONSTANTS
  Holders         = {a, b}
  PinSig          = a
  NoSigner        = none
  MaxSlots        = 2
  AtomicSwap      = TRUE
  CountHolds      = TRUE
  ClearKeepsSlots = TRUE
  ClearKeepsHeld  = TRUE
  RetainNeedsKey  = TRUE
  RefuseOther     = FALSE
  PinRefusesHeld  = TRUE
INVARIANT INV_OwnSigner
CHECK_DEADLOCK FALSE
