\* run-all: DocSyncCompletion.tla RED
\* RED: the old merge handler reported a terminally refused composite without
\* merging it. The sync reads that report and completes with the asked document
\* still unmerged (INV_CompleteMeansEveryDocMerged).
SPECIFICATION RejectSpec
CONSTANTS
  Docs         = {d1, d2}
  Peers        = {p1}
  MaxReports   = 3
  CountReports = FALSE
  FilterAsked  = TRUE
  HeldDocs     = {}
  ReportHeld   = TRUE
INVARIANT TypeOK
INVARIANT INV_CompleteMeansEveryDocMerged
CHECK_DEADLOCK FALSE
