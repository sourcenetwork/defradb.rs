\* RED (d): get reads the started cell before the slot (default.rs:105-108
\* reversed). c1 asks with nothing registered and starts s1; p1 then registers
\* and runs; c2 asks and is answered s1 at once. Once a started pool exists the
\* node's own pool is never the default again. One pool and two callers: one
\* caller to fill the cell, one to ask after the registration. Must fail
\* INV_RegisteredWins.
SPECIFICATION Spec
CONSTANTS
  NP                 = 1
  NC                 = 2
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = FALSE
  WeakSlot           = TRUE
  WorkerRefused      = TRUE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_RegisteredWins
CHECK_DEADLOCK FALSE
