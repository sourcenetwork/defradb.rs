\* RED: the deletes are blind, so a conflict never stops them. An update that
\* lands between the attempt's read and its commit keeps its blocks and heads
\* after the document is gone (INV_NoOrphans).
SPECIFICATION Spec
CONSTANTS
  Listed = {"d1", "d2"}
  Fresh = {"f1"}
  MaxAttempts = 2
  Enforced = {"perdoc", "keepfresh"}
INVARIANT INV_NoOrphans
CHECK_DEADLOCK FALSE
