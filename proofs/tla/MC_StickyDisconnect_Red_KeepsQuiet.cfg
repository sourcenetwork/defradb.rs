\* RED: the explicit dial forgets to lift the quiet (Command::Dial and
\* Node::allow without removing the peer). After DisconnectPeers then
\* ConnectPeers, the node keeps the peer quiet, so once that link drops peer
\* exchange never mends it. Must fail UnquietOnConnect.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = TRUE
  QuietUnlinked = TRUE
  RemoteQuiet = TRUE
  Unquiet = FALSE
  OnlyDiscoveryChecked = TRUE
  RecheckQuiet = TRUE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT UnquietOnConnect
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
