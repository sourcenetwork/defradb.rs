\* RED: a chunk delete merges once the text no longer uses the chunk, but the
\* bug plants edits and merges that never make a deleted chunk again. A later
\* edit uses the chunk again, and readers miss it (INV_ListedChunksStay).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CutText = TRUE
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = TRUE
  DeleteRule = "text"
  GenesisFirst = TRUE
  Regenerate = FALSE
  Rebuild = TRUE
  SameIds = TRUE
INVARIANT INV_ListedChunksStay
CHECK_DEADLOCK FALSE
