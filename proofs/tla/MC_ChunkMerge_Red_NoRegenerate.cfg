\* run-all: ChunkMerge.tla RED
\* a text that uses a deleted chunk again never makes it again (INV_UsedChunksStay)
\* RED: a chunk delete merges once the text no longer uses the chunk, but the
\* bug plants edits and merges that never make a deleted chunk again. A peer
\* deletes a chunk the text does not use, a later edit uses it again, and
\* readers miss it (INV_UsedChunksStay).
SPECIFICATION Spec
CONSTANTS
  Peers = {p1, p2}
  MaxEdits = 1
  CheckHash = TRUE
  Immutable = TRUE
  Deletes = TRUE
  DeleteRule = "text"
  GenesisFirst = TRUE
  Regenerate = FALSE
  Rebuild = TRUE
  SameIds = TRUE
  Encrypt = FALSE
  Ship = TRUE
INVARIANT INV_UsedChunksStay
CHECK_DEADLOCK FALSE
