\* run-all: RetryRecorderLanes.tla GREEN
\* GREEN: the code. A record goes to its peer's lane, a lane applies each
\* peer's records as one transaction per round, and senders are answered once
\* their transaction commits.
SPECIFICATION Spec
CONSTANT LaneByPeer = TRUE
CONSTANT OneTxnPerPeer = TRUE
CONSTANT AnswerAfterCommit = TRUE
CONSTANT SinglesOnFail = TRUE
INVARIANT TypeOK
INVARIANT INV_OnePeerAtATime
INVARIANT INV_PeerOrder
INVARIANT INV_AnsweredOnlyWhenDurable
INVARIANT INV_FailureCostsOnlyItsRecord
PROPERTY LIVE_EveryRecordAnswered
CHECK_DEADLOCK FALSE
