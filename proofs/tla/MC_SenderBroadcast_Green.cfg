\* GREEN (the fix): a committed write waits for room in the pending set,
\* its window runs holding no slot, and the slot is taken only to publish.
\* A deadline that passes reports the write. Nothing is forgotten, the set
\* stays in its budget, and every committed write is published or reported.
SPECIFICATION Spec
CONSTANTS
  Writes <- mcWrites
  Room = 2
  Slots = 1
  Shed = FALSE
  ReportExpiry = TRUE
  SlotAfterWindow = TRUE
  BoundRoom = TRUE
CHECK_DEADLOCK TRUE
INVARIANT TypeOK
INVARIANT INV_CommittedIsOwnedOrReported
INVARIANT INV_PendingBounded
INVARIANT INV_WindowHoldsNoSlot
PROPERTY LIVE_AllSettled
