\* RED: refusals are written durably, but the sweep never moves a durable
\* record into a free slot. The record is kept forever and never merged.
\* Expect LIVE_AllMerged to be violated. Deadlock checking is off so the
\* named property, not the stuck state, is what fails.
SPECIFICATION FairSpec
CONSTANTS
  Docs <- mcDocs
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  MemCap = 1
  MaxCrashes = 1
  PeerCap = 3
  TotalCap = 3
  Mode = "Durable"
  Promote = FALSE
  Lane = "Wait"
CHECK_DEADLOCK FALSE
INVARIANT INV_TypeOK
PROPERTY LIVE_AllMerged
