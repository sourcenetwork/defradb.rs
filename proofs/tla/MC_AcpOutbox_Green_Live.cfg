\* GREEN: the design, with what is promised to happen. The provider comes
\* back, sends land, lookups are answered and fresh authority is supplied. Two
\* changes on a named identity, both actors, a delegation that expires once,
\* one crash. Every committed change ends settled, or parked as refused or as
\* awaiting authority.
SPECIFICATION SpecLive
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"node", "deleg"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 1
  MaxExpiries              = 1
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
INVARIANT TypeOK
PROPERTY LIVE_Drains
CHECK_DEADLOCK FALSE
