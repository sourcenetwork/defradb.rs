\* RED: a purge owes the quiet index without asking for a drain, so its work
\* has no request (INV_OwedKept).
SPECIFICATION Spec
CONSTANTS
  Poison = 1
  Hot = 2
  Quiet = 3
  Interval = 2
  Isolate = "On"
  KeepFailed = "On"
  Requeue = "On"
  PurgeRequests = "Off"
  SweepTimer = "Fixed"
  SweepFirst = "On"
INVARIANT INV_OwedKept
CHECK_DEADLOCK FALSE
