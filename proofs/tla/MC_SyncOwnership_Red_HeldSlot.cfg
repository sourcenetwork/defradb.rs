\* RED (the old rule): a fetch keeps its slot through all of its
\* attempts and the backoff sleeps between them. With every slot held by such
\* a fetch, a head acknowledged meanwhile waits; when the holder's attempt
\* fails it retries in place, ahead of the waiting head, and
\* INV_ReadyRootsServedInOrder fails.
SPECIFICATION WSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs           = {d1, d2}
  Cols           = {}
  MaxV           = 1
  Cap            = 2
  FetchCap       = 1
  SenderMode     = "MarkerRederive"
  RegisterMode   = "Durable"
  FlightMode     = "SingleFlight"
  AckGuardMode   = "HeadCurrent"
  ServeMode      = "DurableDerived"
  ProviderMode   = "OriginBound"
  OriginAuthMode = "TransportBound"
  FetchMode      = "RootThenSelective"
  StreamMode     = "DrainResponse"
  CompletionMode = "LatchedDrain"
  PendingMode    = "ScopeCurrent"
  MergeMode      = "SerializedBatch"
  MaxAttempts    = 3
  AttemptMode    = "WholeTask"
  RearmMode      = "AttemptEnd"
  ExpiryMode     = "AckRetained"
  Dead           = {}
INVARIANT INV_DispatchTypeOK
INVARIANT INV_ReadyRootsServedInOrder
