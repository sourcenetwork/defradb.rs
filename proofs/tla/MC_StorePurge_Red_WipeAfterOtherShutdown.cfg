\* run-all: StorePurge.tla RED
\* shutdown_and_wipe wipes after the application's own shutdown left the store open (INV_NoWipeWhileOpen)
\* RED: the application shut the node down itself and its database close
\* failed; shutdown_and_wipe goes on as if its own shutdown had worked and
\* wipes a store that is still open. Must fail INV_NoWipeWhileOpen.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Developments = {TRUE}
  Handlers = {TRUE}
  HeldElsewhere = {FALSE}
  OtherCallers  = {TRUE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = FALSE
  SignerHeld               = TRUE
INVARIANT INV_NoWipeWhileOpen
CHECK_DEADLOCK FALSE
