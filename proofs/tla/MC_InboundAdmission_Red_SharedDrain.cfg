  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "PerClass"
  ShareMode = "PerConnection"
  DrainMode = "Shared"
  LeaseMode = "UntilHandled"
  ReadMode = "AdmitFirst"
