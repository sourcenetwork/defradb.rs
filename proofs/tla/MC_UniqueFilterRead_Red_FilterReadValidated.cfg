\* The bug from issue 3287: the query's lookup of alice is checked at commit.
\* T only adds bob, yet W adding alice aborts T's commit, so
\* INV_FilterReadDecidesNothing fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANT ValidateFilterRead = TRUE
CONSTANT ValidateOwnEntry = TRUE
CONSTANT Writes = {"bob"}
INVARIANT INV_FilterReadDecidesNothing
