\* RED: the swarm answers Disconnect as soon as it asks libp2p to close, as
\* the code did before. The caller is told it is done while both connections
\* are still open, and an ActivePeers right after still lists the peer
\* (INV_AnsweredMeansClosed).
SPECIFICATION Spec
CONSTANTS
  Conns = 2
  Bug   = "EarlyAck"
INVARIANT TypeOK
INVARIANT INV_AnsweredMeansClosed
CHECK_DEADLOCK FALSE
