\* RED: an expect adds to an expired entry instead of starting again. A
\* request's window closes before its reply, a new request revives the entry
\* with a count of two, and both the late reply and the new one are admitted:
\* the second while nothing is owed (INV_NoUnsolicitedAdmitted).
SPECIFICATION Spec
CONSTANTS
  MaxReq = 3
  MatchMode = "Match"
  TakeMode = "Decrement"
  PruneMode = "ExpiredSerial"
  SendMode = "ExpectFirst"
  ExpiredMode = "Carry"
INVARIANT INV_NoUnsolicitedAdmitted
