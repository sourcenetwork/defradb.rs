\* RED: a merged update gets no journal row, so a reader of the journal never
\* sees it (EventuallyObserved).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Updates = {u1, u2}
  Merged = {u2}
  Cap = 1
  MaxCrashes = 1
  Channel = "coalescing"
  Mode = "journal_skips_merge"
INVARIANT TypeOK
PROPERTY EventuallyObserved
