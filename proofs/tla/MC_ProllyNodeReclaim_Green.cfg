\* a sweep racing a publication never deletes a node the live root names (SweepKeepsLiveRoots)
\* Every guard is on. The sweep reads the root in its delete transaction, a
\* root published before its commit re-runs it, and the writer publishes a
\* root together with its nodes. No live node is ever missing.
SPECIFICATION Spec
CONSTANTS
  RootsInTxn = TRUE
  ValidateRoots = TRUE
  PublishWithNodes = TRUE
  OnlyDeleteUnmarked = TRUE
INVARIANT TypeHolds
INVARIANT SweepKeepsLiveRoots
CHECK_DEADLOCK FALSE
