\* GREEN: as Green, but the chain finalizes as many blocks as the read may
\* ask, so a block can overtake every ask, and the node can answer busy to
\* every busy ask. Such a read ends in the refusal or the busy answer, only
\* after its last ask of that kind, and never accepts a stale answer.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 4
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = TRUE
  BusyAttempts = 3
  MaxBusy     = 3
  RetryBusy   = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverStale
INVARIANT INV_FailsOnlyWhenEveryAskOvertaken
INVARIANT INV_AttemptsBounded
