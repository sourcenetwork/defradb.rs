\* GREEN: as Green, but the chain finalizes as many blocks as the read may
\* ask, so a block can overtake every ask. Such a read ends in the refusal,
\* only after its last ask, and never accepts a stale answer.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 4
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverStale
INVARIANT INV_FailsOnlyWhenEveryAskOvertaken
INVARIANT INV_AttemptsBounded
