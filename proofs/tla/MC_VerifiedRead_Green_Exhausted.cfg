\* run-all: VerifiedRead.tla GREEN
\* a block overtakes every ask: the refusal returns only after the last one
\* GREEN: as Green, but the chain finalizes as many blocks as the read may
\* ask, so a block can overtake every ask, and the node can answer busy
\* often enough to spend the patience, on the quick path (requests of 1 step,
\* about seven asks) and the slow one (requests of 2 steps, about four asks).
\* Such a read ends in the refusal only after its last ask, or in the busy
\* answer only once even the longest pause would end past its patience, and
\* never asks past the patience nor accepts a stale answer.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 4
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = TRUE
  MaxBusy     = 8
  RetryBusy   = TRUE
  Patience    = 15
  MaxTook     = 2
  PauseMin    = 1
  PauseMax    = 2
  CountTook   = TRUE
  CheckDrawn  = TRUE
  MaxStale    = 0
  CheckFresh  = TRUE
  WaitFresh   = TRUE
INVARIANT TypeOK
INVARIANT INV_NeverStale
INVARIANT INV_FailsOnlyWhenEveryAskOvertaken
INVARIANT INV_AttemptsBounded
