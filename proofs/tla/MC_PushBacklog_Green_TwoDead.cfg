\* GREEN (audit F24): two dead peers and one healthy peer, two workers, PerPeerCap 1.
\* Before their first timeouts the dead peers can hold both workers. After it each is
\* parked and the two share one peer's cap, so a worker always remains for the healthy
\* peer; a dead peer's queued jobs go to the retry ledger once one of its probes times
\* out too.
\* All bounds hold and the healthy peer's jobs leave the queue, under scheduler-only
\* fairness.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcTwoDeadPeers
  SlowPeers <- mcTwoDeadSlowPeers
  Weight <- mcTwoDeadWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Release"
  HandleMode = "FixedWorkers"
  FairnessMode = "PerPeerCap"
  ParkMode = "ParkUnreachable"
INVARIANT INV_TypeOK
INVARIANT INV_QueueBounded
INVARIANT INV_PermitConservation
INVARIANT INV_HandlesBounded
INVARIANT INV_NoSilentLoss
INVARIANT INV_PeerLeavesAWorker
INVARIANT INV_UnreachableLeaveAWorker
PROPERTY ACT_DemoteAfterFailedProbe
PROPERTY LIVE_HealthyProgress
