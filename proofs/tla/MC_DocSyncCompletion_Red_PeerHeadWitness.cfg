\* run-all: DocSyncCompletion.tla RED
\* RED, a witness and not a bug: the fix completes once every asked document merged, even while a second peer's different head of one of them is still on its way. The sync asks for documents, not for heads; it cannot know which heads its peers hold (INV_EveryPeersHeadMerged).
SPECIFICATION Spec
CONSTANTS
  Docs         = {d1, d2, d3}
  Peers        = {p1, p2}
  MaxReports   = 4
  CountReports = FALSE
  FilterAsked  = TRUE
INVARIANT TypeOK
INVARIANT INV_EveryPeersHeadMerged
CHECK_DEADLOCK FALSE
