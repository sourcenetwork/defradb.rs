\* RED (b): a claim alone that finds a CPU held returns None without giving
\* back the CPUs it already took. Pool A holds CPU 1; pool B claims CPUs 0 and
\* 1, takes CPU 0, loses on CPU 1 and fails while CPU 0 stays counted for
\* nobody: B holds nothing, yet CPU 0 reads held for as long as the process
\* lives. Must fail INV_AllOrNothing.
\* Two CPUs, two pools living once each, one claim alone before sharing:
\* small, and still every interleaving of the scenario above.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 1
  Attempts         = 1
  AtomicTake       = TRUE
  RollBack         = FALSE
  InsertAfterWin   = TRUE
  ShareCounts      = TRUE
  AttemptCap       = TRUE
  KeepWhileRunning = TRUE
  ReleaseOnce      = TRUE
  RunOnHeld        = TRUE
  ReleaseAtEnd     = TRUE
INVARIANT TypeOK
INVARIANT INV_AllOrNothing
CHECK_DEADLOCK FALSE
