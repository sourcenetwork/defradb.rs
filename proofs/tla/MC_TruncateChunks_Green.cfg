\* GREEN: truncate empties the chunks first and a purge removes the chunks of
\* the articles it purges. A create racing with truncate leaves at worst chunks
\* no live article lists. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  ChunksFirst = TRUE
  PurgeCascades = TRUE
INVARIANT TypeOK
INVARIANT INV_LiveParentHasChunks
INVARIANT INV_PurgedHaveNoChunks
CHECK_DEADLOCK FALSE
