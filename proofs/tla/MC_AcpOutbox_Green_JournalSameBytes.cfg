\* run-all: AcpOutbox.tla GREEN
\* requests with the same bytes: a note counts only from the mark's sequence floor on, so every settled change took effect
\* GREEN: as MC_AcpOutbox_Red_JournalNoFloor, with a note found by digest
\* taken only when its request was signed after the change's mark was
\* stored. A request with the same bytes resolved earlier decides nothing:
\* the third change is sent, and every settled change took effect.
SPECIFICATION Spec
