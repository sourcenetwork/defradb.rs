\* run-all: OwnerTransfer.tla RED
\* a grant the owner commits before a concurrent transfer that took its place first is refused after the transfer lands (INV_EarlierUnderOwner)
\* RED: no commit conflict. The creator stages a transfer in a transaction
\* of its own and, concurrently, a grant in another; the transfer takes the
\* earlier place in the queue, the grant commits first, then the transfer.
\* The queue sends the transfer first, the deployment names the new owner,
\* and the grant the creator committed while it still owned the object is
\* refused. Must fail INV_EarlierUnderOwner.
SPECIFICATION Spec
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = TRUE
  CommitConflict = FALSE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {}
  MaxFails       = 2
  MaxCrashes     = 1
  MaxLapses      = 1
  MaxAborts      = 1
  OwnTransfer    = TRUE
INVARIANT INV_EarlierUnderOwner
CHECK_DEADLOCK FALSE
