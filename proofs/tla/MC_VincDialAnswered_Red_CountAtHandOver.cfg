\* RED: the code before the answered check. A dial counts the target as
\* connected when vinc hands it over, before the target answers. The target
\* stops, the retry pass dials, the dial is handed over at once, and the owed
\* document is pushed into a connection nobody answers. Must fail
\* INV_NoPushUnanswered.
SPECIFICATION Spec
CONSTANTS
  N               = 2
  MaxLives        = 3
  CountAtHandOver = TRUE
CONSTRAINT StateBound
INVARIANT TypeOK
INVARIANT INV_NoPushUnanswered
CHECK_DEADLOCK FALSE
