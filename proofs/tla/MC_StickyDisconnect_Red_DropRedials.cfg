\* RED witness: a real drop is not a deliberate close. With the guards on,
\* discovery still reconnects a pair whose link dropped, as before the fix.
\* Must fail NoRedialAfterDrop; passing would mean the guards also stopped
\* honest reconnects.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = TRUE
  QuietUnlinked = TRUE
  RemoteQuiet = TRUE
  Unquiet = TRUE
  OnlyDiscoveryChecked = TRUE
  RecheckQuiet = TRUE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT NoRedialAfterDrop
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
