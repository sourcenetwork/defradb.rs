\* RED: check, then spawn. The winner reads is_closed(), finds the edge
\* open, and spawns; the edge closes in between, the spawn is refused, and the
\* drain is dropped. The task in the tracked set is never joined nor aborted.
\* Must fail INV_NoLeak.
SPECIFICATION Spec
CONSTANTS
  Callers          = {"c1"}
  Tasks            = {"t1"}
  Late             = {}
  CanKill          = FALSE
  SwapFlag         = TRUE
  AtomicSpawn      = FALSE
  RunRefused       = TRUE
  DrainOwnsSender  = TRUE
  WaitForPruners   = TRUE
  PrunerChecksFlag = TRUE
  RecheckAfterPush = TRUE
  AbortAtDeadline  = TRUE
INVARIANT TypeOK
INVARIANT INV_NoLeak
CHECK_DEADLOCK FALSE
