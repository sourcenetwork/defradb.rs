\* GREEN: add a view naming a transform while the lens is being added and
\* the permission changes. NAC and the lens config are read in the view's
\* transaction, so they decide at its commit. Every invariant holds.
SPECIFICATION Spec
CONSTANTS
  CheckEmpty = TRUE
  CheckLens = TRUE
  StoreTransform = TRUE
  LensAt = "txn"
  NacAt = "txn"
  MaxEnv = 2
INVARIANT TypeOK INV_NoEmptyTransform INV_StoredTransformExists INV_StoredIsAccepted INV_NoViewWithoutPermission INV_NoValidRejected
CHECK_DEADLOCK FALSE
