\* RED: the request's room is held until the handler returns, as in the first
\* draft. s1 drops its request and hangs, still holding peer a's whole share,
\* so s2 is turned away busy. Expect INV_RoomIsTheRequest to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  Registered <- mcRegistered
  Stuck <- mcStuck
  Share = 1
  TagMode = "Check"
  LeaseMode = "UntilReturn"
  DeadlineMode = "Deadline"
  RevokeMode = "Close"
  ShutdownMode = "Abort"
INVARIANT INV_TypeOK
INVARIANT INV_RoomIsTheRequest
