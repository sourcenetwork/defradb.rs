\* The bug: the sweep reads the root in its transaction, but the read is not
\* validated. The writer publishes the new root after that read and before the
\* commit. Nothing refuses the commit, so it deletes "back", which the new
\* root names. SweepKeepsLiveRoots fails.
SPECIFICATION Spec
CONSTANTS
  RootsInTxn = TRUE
  ValidateRoots = FALSE
  PublishWithNodes = TRUE
  OnlyDeleteUnmarked = TRUE
INVARIANT TypeHolds
INVARIANT SweepKeepsLiveRoots
CHECK_DEADLOCK FALSE
