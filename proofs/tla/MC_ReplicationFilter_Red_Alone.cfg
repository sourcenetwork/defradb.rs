\* Bug planted: a later commit of a refused document is judged on its own
\* fields. r is refused, but r2 sets only fields the filter keeps, so it
\* merges and stores a partial document: INV_RefusedNothingStored fails.
SPECIFICATION Spec
CONSTANTS
  Branchable = FALSE
  AskMode = "BeforePersist"
  BatchMode = "PerEvent"
  FinalMode = "Terminal"
  ScopeMode = "SkipBranchable"
  FollowMode = "Alone"
INVARIANTS INV_RefusedNothingStored INV_KeptMerged INV_MergedOnce INV_BranchableUnfiltered
CHECK_DEADLOCK FALSE
