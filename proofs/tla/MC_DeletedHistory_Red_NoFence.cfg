\* RED: a deleted document's DocID can be added again while its history and
\* object are still there. The new document takes the old reader grant, and
\* that reader reads it. Must fail INV_NoUnintendedRead.
SPECIFICATION Spec
CONSTANTS
  KeepOnDelete   = TRUE
  ReleaseOnPurge = TRUE
  FenceRecreate  = FALSE
INVARIANT TypeOK
INVARIANT INV_NoUnintendedRead
