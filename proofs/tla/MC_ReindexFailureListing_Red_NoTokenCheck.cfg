\* run-all: ReindexFailureListing.tla RED
\* a stopped rebuild writes its failure onto a newer record (INV_FailureIsCurrent)
\* RED: the failure is written whatever token the record has. A rebuild of the
\* first reindex is still running when a schema change owes a second one; the
\* old rebuild then stops on a clash and marks the second reindex failed,
\* although no rebuild of it has run: INV_FailureIsCurrent fails.
SPECIFICATION Spec
CONSTANTS
  MaxTokens = 3
  NoTokenCheck = TRUE
  KeepFailureOnOwe = FALSE
  NoFinishTokenCheck = FALSE
  KeepProgressOnStop = FALSE
  KeepFailureOnRetry = FALSE
  WritersIgnoreFailure = FALSE
INVARIANT TypeOK INV_FailureIsCurrent INV_SettledNotFailed INV_FailedRefusesNoWrite INV_SettledIsExact
CHECK_DEADLOCK FALSE
