\* messaging.rs returns Err("timeout waiting for response") after 30s.  Treating
\* that as definite non-delivery clears the scope marker, so a request lost on
\* the wire is never rederived and the head is dropped by both ends.
\* Expect: INV_NoLostUpdate VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  MaxHead <- mcMaxHead
  MaxLoss <- mcMaxLoss
  LinkMode     = "Reorder"
  DupMode      = "Dedup"
  ReplyMode    = "NewStream"
  RouteMode    = "Routable"
  TimeoutMode  = "Definite"
  RegisterMode = "HeadCurrent"
INVARIANT INV_TypeOK
INVARIANT INV_NoLostUpdate
