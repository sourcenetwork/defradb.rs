  Backlogs <- rBacklogs
  Trickle <- rTrickle
  Dead <- rDead
  PullPeer <- rPullPeer
  PullAt <- rPullAt
  Storm <- rStorm
  Crashable <- rCrashable
  ConnectedAtStart <- rConnectedAtStart
  K = 1
  Permits = 2
  PeerPermits = 1
  MemCap = 2
  PeerQuota = 1
  DurCap = 3
  MaxCrash = 0
  MaxRegFail = 0
  MaxDisc = 1
  MaxCont = 2
  CoverRule = "Ancestry"
  ShutdownOrder = "DrainFirst"
  ForwardMode = "BeforeMark"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Kept"
