\* The target contract on the receiver shape, with main's #2548 receiver
\* rules: a slot is released after every attempt, a productive attempt is
\* cut by its quantum, the sweep rotates past roots that gave their place
\* up, acknowledged roots never expire and local continuations end. On top
\* of them a root with a free permit is dispatched before one without
\* (main takes the slot first, F8) and the clock does not dispatch through
\* the merge channel (main does, F9). However the trickle root, the dead
\* root, a dropped connection, pull fetches, storms and continuations
\* interleave, x is merged on h, every root stays owed, and every bound
\* holds. One of the two global permits is out of the one pull fetch's
\* reach; the code's limiter keeps none (see
\* MC_P2PDelivery_Finding_AdvisoryPermits.cfg).
SPECIFICATION Spec
CONSTANTS
  Nodes <- rNodes
  Repl <- rRepl
  Heads <- rHeads
