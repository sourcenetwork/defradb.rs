\* RED (audit F24, the code before the fix): a send timeout frees the worker and
\* nothing else. Each dead peer stays under its own cap of 1, but after their sends
\* time out both take the freed workers straight back, so the two of them hold the
\* whole pool again for another timeout, and again after that, while the healthy
\* peer waits.
\* Expect: INV_UnreachableLeaveAWorker VIOLATED.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Peers <- mcTwoDeadPeers
  SlowPeers <- mcTwoDeadSlowPeers
  Weight <- mcTwoDeadWeight
  MaxArrivals <- mcMaxArrivals
  QueueCap <- mcQueueCap
  ByteCap <- mcByteCap
  Workers <- mcWorkers
  PerPeerCap <- mcPerPeerCap
  MaxGlitches <- mcMaxGlitches
  AdmissionMode = "BoundedQueue"
  ReleaseMode = "Release"
  HandleMode = "FixedWorkers"
  FairnessMode = "PerPeerCap"
  ParkMode = "RetryUnreachable"
INVARIANT INV_TypeOK
INVARIANT INV_UnreachableLeaveAWorker
