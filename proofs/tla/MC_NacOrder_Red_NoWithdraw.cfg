\* RED: whoever asked for a revoke drops it after its commit and before the
\* edge's snapshot is swapped, and nothing withdraws the snapshot. The swap
\* was dropped with the revoke, so the old copy stays in place: a caller who
\* starts after the drop is still let through by the edge on the grants it
\* lost (INV_EdgeSeesReturnedRevoke). Its write is still refused inside the
\* transaction, so INV_NoEffectWithoutPermission holds.
SPECIFICATION Spec
CONSTANTS
  a = a
  b = b
  c = c
  anon = anon
  node = node
  Bug = "NoWithdraw"
INVARIANT TypeOK
INVARIANT INV_NoEffectWithoutPermission
INVARIANT INV_EdgeSeesReturnedRevoke
CHECK_DEADLOCK FALSE
