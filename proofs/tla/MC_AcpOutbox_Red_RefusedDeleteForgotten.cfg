\* RED: a refused delete stops denying. An actor without authority deletes a
\* tuple the provider holds, the provider refuses, and the node honours the
\* access again though the delete committed here. Must fail
\* INV_RevokedAtCommit.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"node"}
  Preexisting              = TRUE
  InitTuples               = {"g"}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = FALSE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
INVARIANT INV_RevokedAtCommit
CHECK_DEADLOCK FALSE
