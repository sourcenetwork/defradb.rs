\* run-all: AddView.tla RED
\* Materialized views are built before the create is known to have landed: a failed create leaves built views (INV_BuiltOnlyCreated)
\* RED: the build runs as the create starts instead of after its commit.
\* When the create fails, rows are built for views that do not exist.
SPECIFICATION Spec
CONSTANTS
  Views = {"a", "b"}
  CoreChecks = {"nac", "sdl", "one", "cid", "chunk", "downsample", "policy", "identity"}
  ServerChecks = {"nac", "sdl", "one", "cid", "chunk", "downsample", "policy", "identity"}
  DocumentAcp = {"node", "server"}
  CreateMode = "Atomic"
  BuildFirst = TRUE
INVARIANT INV_BuiltOnlyCreated
CHECK_DEADLOCK FALSE
