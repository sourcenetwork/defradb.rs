\* run-all: IndexCachePublication.tla RED
\* a backfill's reload is dropped and nothing else publishes it (INV_CacheMatchesStore)
\* RED: creates wait for their publication, but a settled backfill still
\* reaches the cache only through a reload, which is dropped whenever any
\* other publication runs between its epoch read and its publish. The
\* unrelated change lands there, the reload is dropped, and the cache keeps
\* the index as building for good.
SPECIFICATION Spec
CONSTANTS
  PublishMode = "Wait"
  SettleMode = "Reload"
  StatusRead = "Incremental"
INVARIANT INV_CacheMatchesStore
CHECK_DEADLOCK FALSE
