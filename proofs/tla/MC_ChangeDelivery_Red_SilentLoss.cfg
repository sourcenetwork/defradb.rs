\* run-all: ChangeDelivery.tla RED
\* a drop nobody counts (INV_LossCounted)
\* RED: a full queue drops a notice and nothing counts it, so the reader has
\* no way to learn it missed one (INV_LossCounted).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Updates = {u1, u2}
  Merged = {u2}
  Cap = 1
  MaxCrashes = 1
  Hideable = {}
  Channel = "closing"
  Mode = "silent_loss"
INVARIANT TypeOK
INVARIANT INV_LossCounted
