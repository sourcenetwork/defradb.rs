\* GREEN: the deleter's scans are validated. A write to the books after its
\* scan aborts the delete, so every committed delete holds for the books as
\* they stand at its commit, and an abort always has a write behind it.
SPECIFICATION Spec
CONSTANTS
  Books = {"b1", "b2"}
  Validated = TRUE
INVARIANT TypeOK
INVARIANT INV_DecisionHoldsAtCommit
INVARIANT INV_AbortOnlyOnRangeWrite
CHECK_DEADLOCK FALSE
