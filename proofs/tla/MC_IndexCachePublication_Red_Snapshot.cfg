\* run-all: IndexCachePublication.tla RED
\* a publication carries statuses it read without validating them (INV_CacheMatchesStore)
\* RED: each publishing transaction reads the other index's status in a
\* plain scan. Two backfills settle at once: the second read the first
\* index's status before the first committed, does not conflict, and its
\* publication, which runs last, puts the first index back as building.
SPECIFICATION Spec
CONSTANTS
  PublishMode = "Wait"
  SettleMode = "Commit"
  StatusRead = "Snapshot"
INVARIANT INV_CacheMatchesStore
CHECK_DEADLOCK FALSE
