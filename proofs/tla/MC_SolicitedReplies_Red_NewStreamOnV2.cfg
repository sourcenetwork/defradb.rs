\* RED: the peer answers a 0.2 request on a new stream, as on 0.1, while
\* admission refuses every reply stream on 0.2. The owed reply is refused and
\* its requester times out (INV_SolicitedAdmitted).
SPECIFICATION Spec
CONSTANTS
  MaxReq = 3
  MatchMode = "Match"
  TakeMode = "Decrement"
  PruneMode = "ExpiredSerial"
  SendMode = "ExpectFirst"
  ExpiredMode = "Reset"
  Mux = "V2"
  ReplyMode = "NewStream"
  RespMode = "Refuse"
INVARIANT INV_SolicitedAdmitted
