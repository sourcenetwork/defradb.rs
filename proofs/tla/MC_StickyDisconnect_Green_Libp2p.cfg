\* GREEN: libp2p as written. A hang-up quiets the peer for this node's
\* Kademlia, and the close carries no reason, so the peer forgets. Lists
\* arrive in any order around the hang-up, links drop, and nodes connect
\* explicitly twice. The node that hung up never dials the peer
\* back through discovery, an explicit connect lifts the quiet, and other
\* protocols still dial a quiet peer.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2, n3}
  LocalQuiet = TRUE
  QuietUnlinked = TRUE
  RemoteQuiet = FALSE
  Unquiet = TRUE
  OnlyDiscoveryChecked = TRUE
  RecheckQuiet = TRUE
  MaxConnects = 2
INVARIANT TypeOK
INVARIANT NoLocalRedial
INVARIANT UnquietOnConnect
INVARIANT RequestsStillDial
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
