\* RED: the bug plants a decision that lets a chunk through when its
\* article's document is not at hand, as for a chunk forwarded or retried
\* before its article arrived. A chunk of a refused article is sent
\* (INV_NoChunkOfUnmatchedArticle).
SPECIFICATION Spec
CONSTANTS
  Articles = {a1, a2}
  Matches = {a1}
  ShipChunks = TRUE
  MarkChunksFiltered = TRUE
  DecideByArticle = TRUE
  RequireArticle = FALSE
  TxnCarriesArticle = TRUE
INVARIANT INV_NoChunkOfUnmatchedArticle
CHECK_DEADLOCK FALSE
