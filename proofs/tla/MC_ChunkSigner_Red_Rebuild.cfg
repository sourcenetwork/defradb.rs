\* run-all: ChunkSigner.tla RED
\* R builds a protected article's chunk next to the signed copy (INV_EachChunkOnce)
\* RED: the bug plants a merge that still builds the chunks of a protected
\* article itself. The chunk R builds is unsigned, Alice's copy is signed, so
\* their IDs differ and R holds Alice's chunk as two documents
\* (INV_EachChunkOnce).
SPECIFICATION Spec
CONSTANTS
  CheckParent = TRUE
  Sign = TRUE
  WaitForParent = TRUE
  Provider = "Local"
  Rebuild = TRUE
  MaxFlips = 0
INVARIANT INV_EachChunkOnce
CHECK_DEADLOCK FALSE
