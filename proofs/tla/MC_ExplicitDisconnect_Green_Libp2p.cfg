\* run-all: ExplicitDisconnect.tla GREEN
\* Kademlia excludes a deliberately disconnected peer; marked inbound dials are refused
\* GREEN: the real libp2p path. A deliberate disconnect survives Kademlia
\* discovery. Unmarked incoming dials work; marked incoming dials are refused.
SPECIFICATION Spec
CONSTANTS
  Nodes = {"a", "b", "c"}
  Half = "Libp2p"
  Bug = "None"
INVARIANT TypeOK
INVARIANT INV_NoRedialAfterDeliberateClose
INVARIANT INV_RemoteExplicitDialAccepted
INVARIANT INV_MarkedInboundRefused
CHECK_DEADLOCK FALSE
