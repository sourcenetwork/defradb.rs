\* run-all: LensWithVersion.tla GREEN
\* GREEN: each commit holds its compiled copy from just before it lands, owes
\* the lens before it lets go, and a failed commit lets go of its own hold
\* only; the registration clears the owed entry only after the lens is in
\* the store.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANT Mode = "safe"
INVARIANT TypeOK INV_VisibleLensKnown INV_NoMissingTransform INV_FailedCommitLetsGo INV_OwedOnlyCommitted
