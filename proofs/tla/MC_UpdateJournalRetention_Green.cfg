\* run-all: UpdateJournalRetention.tla GREEN
\* GREEN: two truncates run at once, each slice starts at the oldest kept row,
\* and the reader is told what it lost whenever its next row is gone.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS MaxRows = 4 Slice = 1 Limit = 2 Truncators = {t1, t2} Mode = "safe"
INVARIANTS INV_Prefix INV_NoCorrupt INV_NoSilentGap INV_ToldOnlyDropped
