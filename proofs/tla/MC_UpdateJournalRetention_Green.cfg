\* run-all: UpdateJournalRetention.tla GREEN
\* GREEN: two truncates run at once, each slice starts at the oldest kept row,
\* and the reader is told what it lost whenever its next row is gone. The
\* document is created again after a truncate and rewrites its old blocks,
\* which add rows again because its new life names a new once key.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS MaxRows = 4 Slice = 1 Limit = 2 Truncators = {t1, t2} Blocks = {b1, b2} MaxLives = 2 Mode = "safe"
INVARIANTS INV_Prefix INV_NoCorrupt INV_NoSilentGap INV_ToldOnlyDropped INV_EveryWriteHasRow
