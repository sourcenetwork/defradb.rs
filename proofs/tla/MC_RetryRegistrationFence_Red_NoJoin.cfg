\* run-all: RetryRegistrationFence.tla RED
\* RED: the write queues its pushes without waiting for every registration
\* to finish. It is then done while a listed peer is still undecided, so that
\* peer's marker may land with no push queued for it (INV_FanOutPeerLocal).
SPECIFICATION Spec
CONSTANT Peers = {"p1", "p2"}
CONSTANT Background = 1
CONSTANT MaxEpoch = 2
CONSTANT Faults = FALSE
CONSTANT CheckEpoch = TRUE
CONSTANT CheckOrder = TRUE
CONSTANT KeepFallbackFence = TRUE
CONSTANT FanOut = "NoJoin"
INVARIANT TypeOK
INVARIANT INV_FanOutPeerLocal
CHECK_DEADLOCK FALSE
