\* RED: a start key is checked against the store as a keyring is, as the
\* FFI's keyring mapping did. A plain start puts a key in the store; the next
\* start hands in a start key and is refused because the store holds a
\* plaintext key (PlaintextPeerKey). Must fail INV_StartKeyStarts.
SPECIFICATION Spec
CONSTANTS
  Keys                = {k1, k2}
  None                = none
  MaxStarts           = 4
  StartKeyUnchecked   = FALSE
  StartKeyNotRecorded = TRUE
INVARIANT INV_StartKeyStarts
CHECK_DEADLOCK FALSE
