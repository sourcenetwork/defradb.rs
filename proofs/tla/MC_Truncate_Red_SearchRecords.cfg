\* run-all: Truncate.tla RED
\* #2728: /se/ prefix delete left out: an encrypted search still finds truncated documents (INV_UnfilteredClearsSearchRecords)
\* RED: the `/se/` prefix delete is left out, as before #2728. Truncating a
\* collection with an encrypted index removes its documents but keeps their
\* search records, so an encrypted search still finds them
\* (INV_UnfilteredClearsSearchRecords).
SPECIFICATION Spec
CONSTANTS
  Docs = {"a", "b"}
  Enforced = {"nac", "chunk", "allowbranchable", "txn", "shape", "viewcache", "sesamespace", "metaerror"}
INVARIANT INV_UnfilteredClearsSearchRecords
CHECK_DEADLOCK FALSE
