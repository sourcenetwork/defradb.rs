\* Every guard in place: the first check runs before the head is stored, a
\* fetched CAR is checked before import, the merge checks as a backstop, and
\* a check that cannot see the deciding value lets the document go on.
INIT Init
NEXT Next
CONSTANT Bug = "none"
INVARIANTS INV_ArrivalRefusalStoresNothing INV_FetchRefusalImportsNothing INV_RefusedNeverMerged INV_KeptIsKept
CHECK_DEADLOCK FALSE
