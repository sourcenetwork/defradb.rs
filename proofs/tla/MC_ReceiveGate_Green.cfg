NEXT Next
CONSTANT Bug = "none"
INVARIANTS INV_ArrivalRefusalStoresNothing INV_FetchRefusalImportsNothing INV_HeightRefusalWalksNothing INV_HeightAskedOnce INV_RefusedNeverMerged INV_KeptIsKept
