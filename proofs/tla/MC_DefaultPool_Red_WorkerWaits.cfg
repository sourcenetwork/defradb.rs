\* RED (p): block_on does not refuse a worker thread (completion.rs:278-279
\* removed), so a worker that finds the cell empty waits for the turn like a
\* plain thread. c2, on a worker, asks with nothing started and goes to wait
\* for the turn: while another caller's start runs, the worker thread is
\* parked and every task on its core stalls (and its own start can only be
\* refused, start.rs:58-60). No registrable pool; two callers so one can be a
\* worker. Must fail INV_WorkerNeverWaits.
SPECIFICATION Spec
CONSTANTS
  NP                 = 0
  NC                 = 2
  CheckClosing       = TRUE
  RegisterChecks     = TRUE
  RegisterCas        = TRUE
  AnswerCompares     = TRUE
  RetryOnMoved       = TRUE
  RegisteredFirst    = TRUE
  WeakSlot           = TRUE
  WorkerRefused      = FALSE
  FastPathFirst      = TRUE
  InitTurn           = TRUE
  Recheck            = TRUE
  FailReleases       = TRUE
  PublishCas         = TRUE
  StopShutsFirst     = TRUE
  StartedKept        = TRUE
  RegisterOwnRunning = TRUE
INVARIANT TypeOK
INVARIANT INV_WorkerNeverWaits
CHECK_DEADLOCK FALSE
