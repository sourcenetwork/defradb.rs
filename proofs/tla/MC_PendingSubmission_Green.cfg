\* GREEN: the code as written. A send that timed out is sent again, a failure
\* that may pass does not end the loop, the journal keeps the request past a
\* deadline, and the node spends a sequence once. The request takes effect at
\* most once, a confirmation has an effect behind it, the loop gives up only at
\* its deadline or on a failure that cannot pass, the journal keeps the request
\* either way, and a call that nothing cuts short confirms. The node may drop
\* an admitted request and calls may fail, twice in all.
SPECIFICATION Spec
CONSTANTS
  Resends          = TRUE
  KeepsTrying      = TRUE
  RetainsOnTimeout = TRUE
  NodeDedupes      = TRUE
  Disturbances     = 2
INVARIANT TypeOK
INVARIANT INV_AtMostOneEffect
INVARIANT INV_ConfirmedHasEffect
INVARIANT INV_NoEarlyGiveUp
INVARIANT INV_RetainedUntilConfirmed
PROPERTY LIVE_UndisturbedCallConfirms
CHECK_DEADLOCK FALSE
