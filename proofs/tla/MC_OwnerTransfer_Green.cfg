\* run-all: OwnerTransfer.tla GREEN
\* a transfer goes after its registration and its object's earlier changes, denies its old owner from its commit, grants nothing early, takes effect once, and every change is decided
\* GREEN, safety: the creator creates a document, grants "g" and transfers it to "n"
\* in one transaction; a later grant to "x" may follow. Nothing is sent
\* before the registration, the transfer waits for the grant and the later
\* grant for the transfer, the old owner is denied from the commit, the new
\* owner reads only once the deployment names it, a crash or an outage
\* changes none of it.
SPECIFICATION Spec
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = TRUE
  CommitConflict = TRUE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {}
  MaxFails       = 2
  MaxCrashes     = 1
  MaxLapses      = 1
  MaxAborts      = 1
  OwnTransfer    = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWidening
INVARIANT INV_EarlierUnderOwner
INVARIANT INV_LaterAfterTransfer
INVARIANT INV_QueueFollowsCommits
INVARIANT INV_RegistrationFirst
INVARIANT INV_TransferOnce
INVARIANT INV_RefusedTookNoEffect
INVARIANT INV_FailureReported
CHECK_DEADLOCK FALSE
