\* run-all: ParentChunks.tla RED
\* an update keeps the chunks its new text does not use (INV_OnlyTextChunks)
\* RED: the bug plants an update that only creates the new text's chunks and
\* keeps the old ones. After an edit the article still holds a chunk its text
\* no longer uses, so storage grows with every edit (INV_OnlyTextChunks).
SPECIFICATION Spec
CONSTANTS
  Writers = {w1, w2}
  MaxOps = 2
  Validate = TRUE
  SameTxn = TRUE
  Cascade = TRUE
  Lookup = TRUE
  Prune = FALSE
INVARIANT INV_OnlyTextChunks
CHECK_DEADLOCK FALSE
