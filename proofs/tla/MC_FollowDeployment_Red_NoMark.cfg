\* run-all: FollowDeployment.tla RED
\* replay start not written down: a refused replay cut short is held and its revocation forgotten (INV_RevocationDenies)
\* RED: the place a replay starts is not written down. The revocation, confirmed
\* on a void block, is sent again and refused, and the node stops before it
\* records that. The refused request is held now, so the next check finds
\* nothing missing, and the grant before it allows what the node revoked.
\* Must fail INV_RevocationDenies.
SPECIFICATION Spec
CONSTANTS
  Keep         = 2
  MaxTakeovers = 2
  Gate         = TRUE
  CacheByTerm  = TRUE
  Restage      = TRUE
  Taint        = TRUE
  CheckWindow  = TRUE
  MaxCrashes   = 1
  GateDelivery = TRUE
  Mark = FALSE
  KeepBatch    = TRUE
INVARIANT TypeOK
INVARIANT INV_RevocationDenies
