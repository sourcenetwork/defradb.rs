\* RED: the bug plants one remembered decision shared by every query instead
\* of a fresh one per query. A query decides the article is readable, the owner
\* revokes access or deletes the article, and the next query reuses the old
\* decision and shows the chunks (INV_ShownIsLiveAndReadable).
SPECIFICATION Spec
CONSTANTS
  MaxEdits = 1
  CheckDeleted = TRUE
  CheckHash = TRUE
  MemoPerQuery = FALSE
  CheckMerged = TRUE
INVARIANT INV_ShownIsLiveAndReadable
CHECK_DEADLOCK FALSE
