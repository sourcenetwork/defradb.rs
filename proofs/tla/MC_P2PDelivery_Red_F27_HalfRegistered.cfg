\* Plants F27, main's connection rule (the gents rc1 pin, b50c667e9,
\* already adopts every connection): a connection one side dials for its
\* own request is served only to that side, and the side that accepted it
\* caches it for its own requests. a holds a marker for ya when h dials
\* {a, h}: a pushes ya on the cached connection and h never answers.
\* INV_ReverseBorrowServed fails. In the code the request times out after
\* 30 s and the connection is retired (RetireTimedOut), so this is a stall
\* per hit, not a lost head; LIVE_HeadDelivered is not checked here.
SPECIFICATION Spec
CONSTANTS
  Nodes <- eNodes
  Repl <- eRepl
  Heads <- eHeads
  Author <- eAuthor
  Parent <- eParent
  Prio <- ePrio
  KeyOrder <- eKeyOrder
  Base <- eBase
  Fresh <- eFresh
  Backlogs <- eBacklogs
  Trickle <- eTrickle
  Dead <- eDead
  PullPeer <- ePullPeer
  PullAt <- ePullAt
  Storm <- eStorm
  Crashable <- eCrashable
  ConnectedAtStart <- eConnectedAtStart
  K = 1
  Permits = 1
  PeerPermits = 1
  MemCap = 3
  PeerQuota = 3
  DurCap = 3
  MaxCrash = 1
  MaxRegFail = 1
  MaxDisc = 0
  MaxCont = 0
  CoverRule = "Ancestry"
  MarkerMode = "Durable"
  ForwardMode = "WithMerge"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Kept"
  FanoutMode = "PerPeer"
  SlotBeforePermit = FALSE
  DispatchPath = "Direct"
  ConnMode = "HalfRegistered"
INVARIANT INV_TypeOK
INVARIANT INV_Bounded
INVARIANT INV_ObligationOwned
INVARIANT INV_ReverseBorrowServed
CHECK_DEADLOCK FALSE
