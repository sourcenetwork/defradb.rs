\* RED: a restart with the enable option re-enables a disabled NAC; must fail
\* INV_ReEnableNeedsPersistedAdmin.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Owner <- mcOwner
  Admins0 <- mcAdmins0
  NonAdmins <- mcNonAdmins
  MaxMutations <- mcMaxMutations
  Mode = "BugStartReEnables"
INVARIANT TypeOK
INVARIANT INV_NoNonAdminMutatesAdminSet
INVARIANT INV_NoWriteWhileDisabled
INVARIANT INV_DisabledPersistsAcrossRestart
INVARIANT INV_ReEnableNeedsPersistedAdmin
