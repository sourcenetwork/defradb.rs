\* Bug: a temporary receiver pause raises the stop flag, so a hint that only asks the sender to wait ends the whole call (INV_PauseNotTerminal).
SPECIFICATION Spec
CONSTANTS
  Bug = "pause-stop"
  N = 3
  Cap = 2
INVARIANTS TypeOK INV_Independent INV_HintOwner INV_Drained INV_ScheduleBound INV_SendBound INV_StallBound INV_CompletionTruth INV_PauseNotTerminal
CHECK_DEADLOCK FALSE
