\* one list per creator, a refused list sent again one at a time, held objects never sent again
\* GREEN: three documents, two by creator a and one by b; the second is one
\* the provider refuses, one answer may be lost, and another settler may
\* register one owed document at any moment. The settler asks first, sends
\* one list per creator, asks again before it reports a refusal and sends a
\* refused list's members alone first to last: every invariant holds.
SPECIFICATION Spec
CONSTANTS
  Obj          = {1, 2, 3}
  ByB          = {3}
  Bad          = {2}
  Elsewhere    = {}
  MaxLoss      = 1
  MaxOther     = 1
  Recheck      = TRUE
  AskOnRefusal = TRUE
  Fallback     = TRUE
  PerCreator   = TRUE
  InOrder      = TRUE
INVARIANT TypeOK
INVARIANT INV_ClearedOnlyHeld
INVARIANT INV_OwnerIsCreator
INVARIANT INV_RefusedOnlyIfBad
INVARIANT INV_NoResendOfKnownHeld
INVARIANT INV_HeldNotFailed
INVARIANT INV_Order
