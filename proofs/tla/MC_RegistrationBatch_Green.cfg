\* GREEN: three documents, two by creator a and one by b; the second is
\* one the provider refuses, and one answer may be lost. The settler asks
\* the provider first, sends one list per creator, sends a refused list's
\* members alone first to last: every record is cleared only once its
\* object is held for its creator, only the refused one is parked, and no
\* request carries an object already held.
SPECIFICATION Spec
CONSTANTS
  Obj        = {1, 2, 3}
  ByB        = {3}
  Bad        = {2}
  MaxLoss    = 1
  Recheck    = TRUE
  Fallback   = TRUE
  PerCreator = TRUE
  InOrder    = TRUE
INVARIANT TypeOK
INVARIANT INV_ClearedOnlyHeld
INVARIANT INV_OwnerIsCreator
INVARIANT INV_RefusedOnlyIfBad
INVARIANT INV_NoResendOfHeld
INVARIANT INV_Order
