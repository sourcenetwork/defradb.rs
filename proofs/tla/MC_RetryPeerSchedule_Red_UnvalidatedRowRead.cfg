\* run-all: RetryPeerSchedule.tla RED
\* The bug: the row point read (peerstore.rs:569,
\* RegisterScopeMarkerAttempt's txn.get(&id_key)) is a plain read that
\* validates nothing, as if it had moved to get_parts(key, &[]). The
\* registration of scope 2 begins, sees the row, and so writes only its
\* marker. The acknowledgement of scope 1 commits first and deletes the row.
\* Nothing the registration validated moved, so it commits too: scope 2's
\* marker is durable with no schedule row, and INV_EveryMarkerScheduled is
\* violated.
SPECIFICATION Spec
CONSTANT ValidateEmptyScan = TRUE
CONSTANT ValidateRowRead = FALSE
INVARIANT TypeOK
INVARIANT INV_EveryMarkerScheduled
CHECK_DEADLOCK FALSE
