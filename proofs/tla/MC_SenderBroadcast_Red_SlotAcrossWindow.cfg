\* RED: the announcement takes its publish slot before the coalescing window
\* and holds it through the wait. Every slot then sits idle for a window per
\* write, which capped gossip near 128 writes a second.
\* Expect INV_WindowHoldsNoSlot to be violated.
SPECIFICATION Spec
CONSTANTS
  Writes <- mcWrites
  Room = 2
  Slots = 1
  Shed = FALSE
  ReportExpiry = TRUE
  SlotAfterWindow = FALSE
  BoundRoom = TRUE
CHECK_DEADLOCK TRUE
INVARIANT TypeOK
INVARIANT INV_WindowHoldsNoSlot
