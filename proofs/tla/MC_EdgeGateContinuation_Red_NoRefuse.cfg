\* run-all: EdgeGateContinuation.tla RED
\* new top-level work admitted while draining: the drain never ends (LIVE_DrainEndsOnceRetriesStop)
\* RED: new top-level work is never refused once the gate closes (Gate::admit ignores `closed`). Two newcomers take turns, one arriving while the other runs, so the count never reaches zero and the drain never says drained although no refused caller retries (LIVE_DrainEndsOnceRetriesStop). INV_NothingAfterDrain is left out here: a newcomer admitted after a drain that did end breaks it as well, and this configuration names the drain that never ends.
SPECIFICATION Spec
CONSTANTS
  Seal     = TRUE
  Cas      = TRUE
  Continue = TRUE
  Refuse   = FALSE
  Deadline = FALSE
INVARIANT TypeOK
INVARIANT INV_InFlightContinues
INVARIANT INV_NoContinuationWhenIdle
PROPERTY LIVE_DrainEndsOnceRetriesStop
CHECK_DEADLOCK FALSE
