\* GREEN: two clients race for the same status change while an admin gives or
\* takes a permission. The guard, the check and the write share one
\* transaction, and a lost commit decides again: a revocation that commits
\* first denies, one client wins, and the other hears "already".
SPECIFICATION RaceSpec
CONSTANTS
  Enforced = {"configured", "already", "nac", "stored", "acp", "identity", "relation", "target"}
  LiveReEnable = FALSE
  StartReEnables = FALSE
  AlreadyFirst = FALSE
  SplitScope = FALSE
  OutsideGuard = FALSE
  NoRetry = FALSE
  RelOutsideGuard = FALSE
INVARIANT RaceTypeOK INV_RaceNoChangeWithoutPermission INV_RaceOneWinner INV_RaceLoserHearsAlready
CHECK_DEADLOCK FALSE
