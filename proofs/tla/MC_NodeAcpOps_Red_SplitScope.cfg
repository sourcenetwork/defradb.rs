\* RED: the permission is read in a transaction of its own, before the write,
\* as disable_nac_as did when it checked access and then called the manager.
\* A client checks, an admin revokes its permission and commits, and the
\* client's write still commits, because nothing in it read the permission
\* (INV_RaceNoChangeWithoutPermission).
SPECIFICATION RaceSpec
CONSTANTS
  Enforced = {"configured", "already", "nac", "stored", "acp", "identity", "relation", "target"}
  LiveReEnable = FALSE
  StartReEnables = FALSE
  AlreadyFirst = FALSE
  SplitScope = TRUE
  OutsideGuard = FALSE
  NoRetry = FALSE
  RelOutsideGuard = FALSE
INVARIANT INV_RaceNoChangeWithoutPermission
CHECK_DEADLOCK FALSE
