\* run-all: DeferredIndex.tla RED
\* a drop truncates the whole backlog in one transaction (INV_CleanupBounded)
\* RED: the drop truncates everything left of the log in one transaction. With
\* more entries owed than a page holds, that one transaction grows with the backlog
\* (INV_CleanupBounded).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "WriteConflict"
  Drop = "On"
  Cleanup = "Whole"
  Page = 1
  Poisoned = {}
  Carry = "Tail"
  Fixed = "Never"
  MinPlan = 1
  MaxPlan = 2
  Growth = "Capped"
  FullCarry = "Carry"
INVARIANT INV_CleanupBounded
CHECK_DEADLOCK FALSE
