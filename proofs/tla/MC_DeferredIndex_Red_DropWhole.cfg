\* RED: the drop truncates everything left of the log in one transaction. With
\* more entries owed than a page holds, that one transaction grows with the backlog
\* (INV_CleanupBounded).
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "Validated"
  Drop = "On"
  Cleanup = "Whole"
  Page = 1
INVARIANT INV_CleanupBounded
CHECK_DEADLOCK FALSE
