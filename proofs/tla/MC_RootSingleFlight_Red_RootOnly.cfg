\* RED: the claim is keyed by the root alone. A trusted reply waits behind a
\* plain peer's fetch, whose merge rejects what only the replicator may
\* replay, and nothing fetches it under its trust (INV_NoReplyLost).
SPECIFICATION Spec
CONSTANTS
  R = 4
  GuardMode = "Claim"
  ReleaseMode = "Drop"
  KeyMode = "Root"
INVARIANT INV_NoReplyLost
CHECK_DEADLOCK FALSE
