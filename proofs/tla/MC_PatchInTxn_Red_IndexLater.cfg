\* RED: the one-to-one unique index a patch owes another collection is built
\* after the patch commits, in a second transaction of its own. Between the two
\* commits everyone sees the patch without the index, so two documents can claim
\* the same one-to-one partner; if the second commit fails, the index is never
\* built and the client was already told the patch succeeded
\* (INV_IndexLandsWithPatch).
SPECIFICATION Spec
CONSTANTS
  ReadThroughTxn = TRUE
  WriteThroughTxn = TRUE
  FinishOnCommit = TRUE
  RetryHides = FALSE
  Savepoint = TRUE
  RefreshCatalog = TRUE
  NacInTxn = TRUE
  IndexInTxn = FALSE
INVARIANT INV_IndexLandsWithPatch
CHECK_DEADLOCK FALSE
