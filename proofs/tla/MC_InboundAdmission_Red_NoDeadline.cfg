\* RED: waiting for budget has no deadline. The third bulk stream waits for
\* stuck handlers forever. Expect LIVE_WaitEnds to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  ConnOf <- mcConnOf
  PeerOf <- mcPeerOf
  ClassOf <- mcClassOf
  LaneOf <- mcLaneOf
  Classes <- mcClasses
  Lanes <- mcLanes
  Healthy = "h1"
  Stalls <- mcStalls
  Trickles <- mcTrickles
  StuckClasses <- mcStuckClasses
  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "PerClass"
  ShareMode = "PerPeer"
  DrainMode = "PerLane"
  LeaseMode = "UntilHandled"
  ReadMode = "AdmitFirst"
  DeadlineMode = "None"
  ReadDeadlineMode = "Deadline"
INVARIANT INV_TypeOK
PROPERTY LIVE_WaitEnds
