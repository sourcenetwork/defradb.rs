\* RED: waiting for budget has no deadline. The third bulk stream waits for
\* stuck handlers forever. Expect LIVE_WaitEnds to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  PeerOf <- mcPeerOf
  ClassOf <- mcClassOf
  Classes <- mcClasses
  Healthy = "h1"
  Stalls <- mcStalls
  StuckClasses <- mcStuckClasses
  Budget <- mcBudget
  Share = 1
  Slots <- mcSlots
  BudgetMode = "PerClass"
  ShareMode = "PerPeer"
  DrainMode = "PerClass"
  LeaseMode = "UntilHandled"
  ReadMode = "AdmitFirst"
  DeadlineMode = "None"
INVARIANT INV_TypeOK
PROPERTY LIVE_WaitEnds
