\* run-all: UpdateJournalRetention.tla RED
\* RED: a reader whose next row was dropped is handed the rows that are left,
\* as if nothing was missing. Its cursor moves past the dropped rows and it is
\* never told it lost them.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS MaxRows = 3 Slice = 2 Limit = 2 Truncators = {t1} Blocks = {b1, b2} MaxLives = 2 Mode = "skip"
INVARIANT INV_NoSilentGap
