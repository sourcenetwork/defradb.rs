\* RED: the in-flight mark does not survive a crash. A change lands, the node
\* crashes before it asked for the receipt, and after the restart the record
\* reads as never sent: it is sent again and takes effect twice. Must fail
\* INV_AtMostOneEffect.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c"}
  Auths                    = {"node"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = FALSE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"node"}
  RegRetry                 = "recorded"
  ReauthChecked            = TRUE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = FALSE
  Note                     = TRUE
  Floor                    = TRUE
  Captured                 = TRUE
  Remote                   = FALSE
  ActorFromCredential      = TRUE
  RemoteCheck              = TRUE
  RemoteAuthority          = TRUE
  HeldKeys                 = {}
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT INV_AtMostOneEffect
CHECK_DEADLOCK FALSE
