\* GREEN: A writes four blocks; B lacks the type until it is built again with
\* it. B never merges a custom part without the type, each custom part merges
\* once, the counter beside it counts each block once, and once B has the
\* type and has merged what it parked, B ends up equal to A.
SPECIFICATION FairSpec
CONSTANTS
  MaxBlocks = 4
  MaxVal    = 3
  Mode      = "Park"
INVARIANT TypeOK
INVARIANT INV_NoBlindMerge
INVARIANT INV_MergeOnce
INVARIANT INV_OtherFieldsExact
INVARIANT INV_ConvergeWhenDone
PROPERTY LIVE_Converge
CHECK_DEADLOCK FALSE
