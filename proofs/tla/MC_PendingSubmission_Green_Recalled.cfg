\* GREEN: the code as written, for a caller that keeps calling. Calls end at
\* their deadline or on a failure that cannot pass, the node drops an admitted
\* request, twice in all, and the request is still confirmed: the journal
\* keeps it and each new call sends it again.
SPECIFICATION SpecRecalled
CONSTANTS
  Resends          = TRUE
  KeepsTrying      = TRUE
  RetainsOnTimeout = TRUE
  NodeDedupes      = TRUE
  Disturbances     = 2
INVARIANT TypeOK
INVARIANT INV_AtMostOneEffect
INVARIANT INV_RetainedUntilConfirmed
PROPERTY LIVE_RecalledConfirms
CHECK_DEADLOCK FALSE
