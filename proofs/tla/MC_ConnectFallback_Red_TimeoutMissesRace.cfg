\* RED: the connect timeout covers only the name lookup, not the attempts. A
\* hanging race goes on past the limit. Must fail INV_WithinLimit.
SPECIFICATION Spec
CONSTANTS
  D              = 1
  CT             = 2
  MaxTime        = 3
  HasFallback    = TRUE
  MayHang        = TRUE
  Limited        = TRUE
  DelayFallback  = TRUE
  StartOnFailure = TRUE
  AwaitOther     = TRUE
  KeepLastError  = TRUE
  DropLosers     = TRUE
  TimeoutAll     = FALSE
INVARIANT TypeOK
INVARIANT INV_WithinLimit
CHECK_DEADLOCK FALSE
