\* GREEN: parent "a" has exactly the limit of children and parent "b" has
\* fewer, so "a" fills a full page and "b" takes every child it has.
SPECIFICATION FairSpec
CONSTANTS
  Mode        = "PerParent"
  StopAtLimit = TRUE
  Limit       = 2
  Parents     = {"a", "b"}
  ChildrenOfA = {1, 2}
  ChildrenOfB = {3}
INVARIANT TypeOK
PROPERTY LIVE_EveryParentCompletesOrderedPage
INVARIANT INV_PageIsOrderedPrefix
INVARIANT INV_PageWithinLimit
CHECK_DEADLOCK FALSE
