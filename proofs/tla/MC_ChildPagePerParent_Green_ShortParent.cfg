\* run-all: ChildPagePerParent.tla GREEN
\* a parent with fewer children than the limit takes them all
\* GREEN: parent "a" has exactly the limit of children and parent "b" has
\* fewer, so "a" fills a full page and "b" takes every child it has, which
\* is the whole page it is owed when the scan stops.
SPECIFICATION FairSpec
CONSTANTS
  Mode        = "PerParent"
  StopAtLimit = TRUE
  Limit       = 2
  Parents     = {"a", "b"}
  ChildrenOfA = {1, 2}
  ChildrenOfB = {3}
INVARIANT TypeOK
PROPERTY LIVE_EveryParentCompletesOrderedPage
INVARIANT INV_PageIsOrderedPrefix
INVARIANT INV_PageWithinLimit
INVARIANT INV_SecondParentKeepsPage
CHECK_DEADLOCK FALSE
