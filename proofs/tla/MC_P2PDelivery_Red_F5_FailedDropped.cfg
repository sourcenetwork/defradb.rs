\* Plants the other half of F5: a failed marker registration's own intent
\* is dropped, as on main, where the error is logged and nobody retries.
\* The fan-out does not abort here. a commits ya and its one registration,
\* for h, fails: ya is merged on a and owed to h by nobody.
\* INV_ObligationOwned fails.
SPECIFICATION Spec
CONSTANTS
  Nodes <- eNodes
  Repl <- eRepl
  Heads <- eHeads
  Author <- eAuthor
  Parent <- eParent
  Prio <- ePrio
  KeyOrder <- eKeyOrder
  Base <- eBase
  Fresh <- eFresh
  Backlogs <- eBacklogs
  Trickle <- eTrickle
  Dead <- eDead
  PullPeer <- ePullPeer
  PullAt <- ePullAt
  Storm <- eStorm
  Crashable <- eCrashable
  ConnectedAtStart <- eConnectedAtStart
  K = 1
  Permits = 1
  PeerPermits = 1
  MemCap = 3
  PeerQuota = 3
  DurCap = 3
  MaxCrash = 1
  MaxRegFail = 1
  MaxDisc = 0
  MaxCont = 0
  CoverRule = "Ancestry"
  ShutdownOrder = "DrainFirst"
  ForwardMode = "BeforeMark"
  StartupOrder = "RestoreFirst"
  FailedIntent = "Dropped"
  FanoutMode = "PerPeer"
  SlotBeforePermit = FALSE
  DispatchPath = "Direct"
