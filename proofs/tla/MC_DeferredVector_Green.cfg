\* run-all: DeferredVector.tla GREEN
\* every write is searchable at once and the graph converges
\* Every guard on: writes defer or go inline freely, the drain validates what
\* it reads, an inline write supersedes the pending entry, a search merges the
\* pending entries and drops stale graph hits, every deferred commit asks for a
\* drain, and a node that opens drains what is pending. Every search sees each
\* latest vector, and once writes stop the graph holds them all.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {n1, n2}
          Drains = {d1, d2}
          MaxWrites = 3
          MaxCrashes = 1
          ValidateRead = TRUE
          Supersede = TRUE
          MergePending = TRUE
          DropStale = TRUE
          AskOnCommit = TRUE
          SettleAtOpen = TRUE
INVARIANT INV_TypeOK
INVARIANT INV_SearchSeesLatest
INVARIANT INV_PendingIsLatest
INVARIANT INV_GraphSettled
PROPERTY PROP_Converges
