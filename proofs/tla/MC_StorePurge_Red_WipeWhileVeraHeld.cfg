\* run-all: StorePurge.tla RED
\* the Vera directories are removed while it runs (INV_NoWipeWhileOpen)
\* RED: the wipe runs before the Vera node is stopped, so its directories
\* are removed while it still writes them. Must fail INV_NoWipeWhileOpen.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"Embedded"}
  Developments = {TRUE}
  Handlers = {TRUE}
  HeldElsewhere = {FALSE}
  OtherCallers  = {FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = FALSE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
  SignerHeld               = TRUE
INVARIANT INV_NoWipeWhileOpen
CHECK_DEADLOCK FALSE
