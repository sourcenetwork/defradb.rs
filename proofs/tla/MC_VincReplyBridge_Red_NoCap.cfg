\* RED: a request is held whatever the table holds. Two requests arrive and
\* both are held in a table of one: memory grows with whatever a peer sends.
\* Must fail INV_Bounded.
SPECIFICATION Spec
CONSTANTS
  N              = 2
  Cap            = 1
  D              = 1
  Lossy          = FALSE
  DeadlinePasses = FALSE
  TakeOnce       = TRUE
  DropReset      = TRUE
  SweepGuard     = TRUE
  CapGuard       = FALSE
INVARIANT TypeOK
INVARIANT INV_Bounded
CHECK_DEADLOCK FALSE
