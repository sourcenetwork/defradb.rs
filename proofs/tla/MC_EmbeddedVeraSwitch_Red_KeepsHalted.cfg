\* run-all: EmbeddedVeraSwitch.tla RED
\* a failed launch leaves the halted node in the slot (INV_SlotRuns)
\* RED: a switch whose launch failed leaves the halted node in the slot (no
\* settle). Nobody writes the slot, yet it holds a node that runs no more: a
\* stop reports it panicked, term and export answer for it, and a watch
\* waits on it for good. Fails INV_SlotRuns.
SPECIFICATION Spec
CONSTANTS
  EvictWatch     = TRUE
  AskWithdraws   = TRUE
  AbortOnStop    = TRUE
  SwitchDeadline = TRUE
  ClearsHalted   = FALSE
  RecordsTarget  = TRUE
  ReportFails    = FALSE
  ObservesCommit = TRUE
  Restarts       = TRUE
  LinkShuts      = TRUE
  Reaps          = TRUE
  WaitsRelease   = TRUE
INVARIANT TypeOK
INVARIANT INV_ClosedAfterStop
INVARIANT INV_NoStartAfterStop
INVARIANT INV_SlotRuns
INVARIANT INV_StoppedMeansEnded
INVARIANT INV_DeviceNamesNode
PROPERTY LIVE_NoNodeAfterStop
PROPERTY LIVE_DropStops
PROPERTY LIVE_SwitchEnds
PROPERTY LIVE_WatchWakes
PROPERTY LIVE_StopReturns
PROPERTY LIVE_Recovers
CHECK_DEADLOCK FALSE
