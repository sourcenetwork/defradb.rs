\* RED (the rule before): d1 and d2 came from one peer, whose quota is one
\* entry after the restart; d3 from another. d1 and d3 never serve, and the
\* key order is d3, d1, d2. Each place goes to its own root, from the place
\* after the one the sweep admitted at last: the sweep passes d2 while d1
\* holds the peer's place, then admits d3, which gives its entry up and comes
\* back. Whenever d1 gives the peer's place up, the sweep starts after d3 and
\* admits d1 again ahead of d2, for ever. d2 is never fetched although its
\* provider serves: LIVE_DurableRootMerged fails.
SPECIFICATION MFairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
  Docs             = {d1, d2, d3}
  Cols             = {}
  MaxV             = 1
  Cap              = 3
  FetchCap         = 1
  SenderMode       = "MarkerRederive"
  RegisterMode     = "Durable"
  FlightMode       = "SingleFlight"
  AckGuardMode     = "HeadCurrent"
  ServeMode        = "DurableDerived"
  ProviderMode     = "OriginBound"
  OriginAuthMode   = "TransportBound"
  FetchMode        = "RootThenSelective"
  StreamMode       = "DrainResponse"
  CompletionMode   = "LatchedDrain"
  PendingMode      = "ScopeCurrent"
  MergeMode        = "SerializedBatch"
  MemCap           = 2
  RotateAfter      = 1
  Dead             = {d1, d3}
  PullScopes       = {}
  PeerScopes       = {{d1, d2}, {d3}}
  DurableQuota     = 3
  AdmissionMode    = "TwoTier"
  OverflowMode     = "PassOver"
  ContinuationMode = "EndOnStop"
INVARIANT INV_MemoryTypeOK
PROPERTY LIVE_DurableRootMerged
