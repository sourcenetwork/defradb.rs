\* GREEN: the code as written, for a name with addresses of one family only:
\* its attempt alone, under the connect timeout. Every invariant and the
\* liveness property must hold.
SPECIFICATION Spec
CONSTANTS
  D              = 1
  CT             = 2
  MaxTime        = 3
  HasFallback    = FALSE
  MayHang        = TRUE
  Limited        = TRUE
  DelayFallback  = TRUE
  StartOnFailure = TRUE
  AwaitOther     = TRUE
  KeepLastError  = TRUE
  DropLosers     = TRUE
  TimeoutAll     = TRUE
INVARIANT TypeOK
INVARIANT INV_OneSocket
INVARIANT INV_FallbackWaits
INVARIANT INV_NeverIdle
INVARIANT INV_ErrorOnlyWhenAllFail
INVARIANT INV_LastError
INVARIANT INV_WithinLimit
PROPERTY LIVE_Ends
CHECK_DEADLOCK FALSE
