\* run-all: OwedParts.tla GREEN
\* owed counts in a staged and a settled part: a settle aborts no stager or decision, no decision commits past an unseen delete
\* GREEN: the design. A settle merges into the settled part only; a stager
\* and a decider read the staged part only, validated at commit. Up to four
\* writes commit, in any order with the two readers, which retry when
\* refused. No decision commits past a delete it did not see, no settle
\* makes a reader fail its commit, and nothing more is settled than staged.
SPECIFICATION Spec
CONSTANTS
  MaxWrites     = 4
  SettleParts   = {"settled"}
  ReadParts     = {"staged"}
  SettleGuarded = TRUE
INVARIANT TypeOK
INVARIANT INV_NoMissedRevoke
INVARIANT INV_SettleAbortsNobody
INVARIANT INV_OwedNotNegative
CHECK_DEADLOCK FALSE
