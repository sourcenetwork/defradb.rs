\* RED (a): the claim alone looks at a CPU's counter and adds one to it in two
\* separate steps instead of one compare-and-swap. Two pools both claim CPU 0
\* alone, both look and see 0, then both add one: both hold CPU 0 alone, and
\* both would put their threads on it. Must fail INV_AloneTakesDisjoint.
\* Two CPUs, two pools living once each, one claim alone before sharing:
\* small, and still every interleaving of the scenario above.
SPECIFICATION Spec
CONSTANTS
  NCpu             = 2
  NPool            = 2
  Lives            = 1
  Edges            = {}
  Attempts         = 1
  AtomicTake       = FALSE
  RollBack         = TRUE
  InsertAfterWin   = TRUE
  ShareCounts      = TRUE
  AttemptCap       = TRUE
  KeepWhileRunning = TRUE
  ReleaseOnce      = TRUE
  RunOnHeld        = TRUE
  ReleaseAtEnd     = TRUE
INVARIANT TypeOK
INVARIANT INV_AloneTakesDisjoint
CHECK_DEADLOCK FALSE
