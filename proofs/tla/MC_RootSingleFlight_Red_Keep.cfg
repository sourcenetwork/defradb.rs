\* run-all: RootSingleFlight.tla RED
\* a failed fetch keeps its claim: the next reply starts nothing (INV_NoReplyLost)
\* RED: a failed fetch keeps its claim. The next reply starts nothing
\* while nothing fetches the root (INV_NoReplyLost).
SPECIFICATION Spec
CONSTANTS
  R = 4
  GuardMode = "Claim"
  ReleaseMode = "Keep"
  KeyMode = "RootTrust"
INVARIANT INV_NoReplyLost
CHECK_DEADLOCK FALSE
