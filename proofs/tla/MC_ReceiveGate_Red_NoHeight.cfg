\* Plants a node that, with no CAR served, walks a document without checking
\* the height block it fetched alone: a document refused by that block has
\* all its blocks fetched, and the merge refuses it too late.
\* INV_HeightRefusalWalksNothing fails.
INIT Init
NEXT Next
CONSTANT Bug = "noheight"
INVARIANT INV_HeightRefusalWalksNothing
CHECK_DEADLOCK FALSE
