\* RED: the share is checked against the hub's view of its durable records, and the store
\* writes the record without counting the peer's. The view learns of a commit only when the
\* store's receipt-ordered events go out, so two pushes of the peer both pass the check
\* before it shows either record, and both are registered: the peer holds two records with a
\* share of one. INV_PeerQuota is violated at the second registration.
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
CONSTANTS
  Heads     <- mcHeads
  Parent    <- mcNoParents
  Prio      <- mcFlatPrio
  ScopeOf   <- mcOwnScope
  Cap       <- mcShareCap
  Quota     <- mcQuota
  ReplyMode = "NackOnFull"
  CoverRule = "Parent"
  GuardMode = "Committed"
  QuotaMode = "View"
INVARIANT INV_TypeOK
INVARIANT INV_SuccessImpliesRegisteredOrMerged
INVARIANT INV_NackImpliesUnregistered
INVARIANT INV_PeerQuota
