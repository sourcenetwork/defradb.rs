\* GREEN: two documents, a build held at a shut gate, a close while it
\* waits, and a reopen. The gate wait also ends when the database closes,
\* the stopped build keeps its record in progress, and the reopen returns
\* before the node resumes the build as its own task, so every close
\* finishes and the build is built in the end.
SPECIFICATION Spec
CONSTANTS
  Docs = 2
  RaceMode = "Race"
  StopMode = "Leave"
  ResumeMode = "Resume"
  OpenMode = "Background"
INVARIANT INV_TypeOK INV_BuiltOnlyWhenIndexed
PROPERTY LIVE_CloseFinishes LIVE_BuildFinishes
CHECK_DEADLOCK FALSE
