\* GREEN: two documents, a build held at a shut gate, a close while it
\* waits, and a reopen. The gate wait also ends when the database closes,
\* the stopped build keeps its record in progress, and the reopen resumes it
\* and waits for it, so every close finishes and the build is built in the
\* end, unless the reopen waits on a resumed build held at the shut gate
\* (the #2760 state, which LIVE_BuildFinishes names).
SPECIFICATION Spec
CONSTANTS
  Docs = 2
  RaceMode = "Race"
  StopMode = "Leave"
  ResumeMode = "Resume"
INVARIANT INV_TypeOK INV_BuiltOnlyWhenIndexed
PROPERTY LIVE_CloseFinishes LIVE_BuildFinishes
CHECK_DEADLOCK FALSE
