\* run-all: OwnerTransfer.tla RED
\* a later grant is decided before the owed transfer it follows (INV_LaterAfterTransfer)
\* RED: no object order. The new owner stages a grant while the deployment
\* cannot be asked, after the transfer, and the grant goes first: the
\* deployment decides it while the transfer is still owed, and refuses it,
\* the new owner not being the owner yet. Must fail INV_LaterAfterTransfer.
SPECIFICATION Spec
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = FALSE
  CommitConflict = TRUE
  DenyFromCommit = TRUE
  ProviderGrants = TRUE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {}
  MaxFails       = 2
  MaxCrashes     = 1
  MaxLapses      = 1
  MaxAborts      = 1
  OwnTransfer    = TRUE
INVARIANT INV_LaterAfterTransfer
CHECK_DEADLOCK FALSE
