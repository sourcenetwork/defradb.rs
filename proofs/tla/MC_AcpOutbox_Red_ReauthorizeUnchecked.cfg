\* RED: a fresh credential for the parked registration is taken from anyone.
\* The create recorded no authority, so its registration waits. Another
\* identity hands the node its own delegation; the node sends the
\* registration under it, the provider registers that signer as the owner,
\* and the creator still reads the document here. Must fail INV_NoWidening.
SPECIFICATION Spec
CONSTANTS
  MaxChanges               = 2
  Subjects                 = {"g"}
  Actors                   = {"c", "m"}
  Auths                    = {"node"}
  Preexisting              = FALSE
  InitTuples               = {}
  MaxCrashes               = 1
  MaxExpiries              = 0
  TxnOwnsOwed              = TRUE
  DenyRule                 = "AnyOwedDelete"
  RefusedDeleteDenies      = TRUE
  OwedAdds                 = "CreatorExplicit"
  RegFirst                 = TRUE
  InOrder                  = TRUE
  ParkedBlocks             = TRUE
  DrainPastRefused         = TRUE
  Marker                   = TRUE
  CheckedDeletes           = TRUE
  DropUnchecked            = TRUE
  UncheckedYields          = "drop"
  AssumeReceiptRetrievable = TRUE
  AssumeUncontested        = TRUE
  AssumeOwnerStays         = TRUE
  AssumeNoTransferWhileOwed = TRUE
  RegAuths                 = {"none"}
  RegRetry                 = "recorded"
  ReauthChecked            = FALSE
  ReportFailures           = TRUE
  AbandonStates            = "refused"
  AbandonBy                = "actor"
  Journaled                = FALSE
  Note                     = TRUE
  Floor                    = TRUE
  Captured                 = TRUE
  Remote                   = FALSE
  ActorFromCredential      = TRUE
  RemoteCheck              = TRUE
  RemoteAuthority          = TRUE
  HeldKeys                 = {}
  MaxBatch                 = 1
  Isolate                  = TRUE
INVARIANT INV_NoWidening
CHECK_DEADLOCK FALSE
