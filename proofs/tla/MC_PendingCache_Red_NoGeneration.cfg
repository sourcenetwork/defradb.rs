\* Plants the bug of using a cache of any generation: a search older than a merge uses a cache loaded after it, misses what the merge linked, and INV_NoHiddenPending fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {a, b}
          Readers = {r1, r2}
          MaxCommits = 3
          GenerationCheck = FALSE
          OwnAppendsRead = TRUE
          TruncateThroughLinked = TRUE
INVARIANT INV_NoHiddenPending
INVARIANT INV_CacheCovers
INVARIANT INV_NoLostVector
SYMMETRY Symmetry
