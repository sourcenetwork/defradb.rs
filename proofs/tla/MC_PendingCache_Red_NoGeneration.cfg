\* Plants the bug of using a cache of another generation: a search older than a merge uses a cache loaded after it, which lacks what the merge linked, and INV_NoHiddenPending fails.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {a, b}
          Readers = {r1, r2}
          MaxCommits = 3
          GenerationCheck = FALSE
          LoadedAtCheck = TRUE
          DeletesAppend = TRUE
          EntriesCarryCode = TRUE
          OwnWritesScan = TRUE
INVARIANT INV_NoHiddenPending
INVARIANT INV_CacheCovers
SYMMETRY Symmetry
