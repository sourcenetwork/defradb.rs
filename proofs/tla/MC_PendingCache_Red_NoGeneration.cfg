\* Plants the bug of using a cache of any generation. A search newer than a merge reads a cache loaded before it and scores a vector by an entry the merge already truncated, so INV_ScoresLatest fails; a search older than a merge would also miss what the merge linked (INV_NoHiddenPending).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {a, b}
          Readers = {r1, r2}
          MaxCommits = 3
          MaxOwn = 2
          GenerationCheck = FALSE
          OwnAppendsRead = TRUE
          TruncateThroughLinked = TRUE
          LatestOnly = TRUE
          HeadCut = TRUE
          HeadAwareMarks = TRUE
          GapCheck = TRUE
          Evictions = FALSE
INVARIANT INV_NoHiddenPending
INVARIANT INV_CacheCovers
INVARIANT INV_NoLostVector
INVARIANT INV_ScoresLatest
SYMMETRY Symmetry
