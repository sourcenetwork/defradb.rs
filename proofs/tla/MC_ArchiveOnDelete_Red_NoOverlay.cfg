\* run-all: ArchiveOnDelete.tla RED
\* an owed archive denies nobody: the reader is allowed on the deleted document (INV_DeletedGrantsNothing)
\* RED: an owed archive denies nobody. Between the delete's commit and the
\* archive's settlement the deployment still holds the reader's grant, and
\* the reader is allowed on the deleted document. Must fail
\* INV_DeletedGrantsNothing.
SPECIFICATION Spec
CONSTANTS
  CheckPermission  = TRUE
  ArchiveAsOwner   = TRUE
  Drop             = TRUE
  VeraRefuses      = TRUE
  Overlay          = FALSE
  HistoryActorOnly = TRUE
  SpareOnlyDeleter = TRUE
  ArchiveUncounted = TRUE
  ArchiveOffNode   = TRUE
  ArchiveOffTxn    = TRUE
  First            = "archive"
INVARIANT TypeOK
INVARIANT INV_DeletedGrantsNothing
