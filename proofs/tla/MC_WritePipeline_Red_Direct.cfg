\* RED: a missing key is minted on the spot instead of ending the attempt,
\* as an engine-retried batch create did for an unprepared document before
\* the pipeline. The KMS is called while the attempt runs (INV_NoMintInAttempt).
SPECIFICATION Spec
CONSTANTS
  Fields = {"a", "b"}
  MaxAttempts = 4
  StoreMode = "AfterCompute"
  IdMode = "Once"
  KeySource = "Direct"
INVARIANT INV_NoMintInAttempt
CHECK_DEADLOCK FALSE
