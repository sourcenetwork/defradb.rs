\* run-all: OwnerTransfer.tla RED
\* the new owner reads before the deployment names it (INV_NoWidening)
\* RED: an owed transfer lets its new owner in at once. The new owner reads
\* the document while the deployment still names the creator and lets the
\* new owner in nowhere. Must fail INV_NoWidening.
SPECIFICATION Spec
CONSTANTS
  RegFirst       = TRUE
  ObjectOrder    = TRUE
  CommitConflict = TRUE
  DenyFromCommit = TRUE
  ProviderGrants = FALSE
  Marker         = TRUE
  OwnerConfirms  = TRUE
  KeepRefused    = TRUE
  BoundedRetries = TRUE
  Poisoned       = {}
  MaxFails       = 2
  MaxCrashes     = 1
  MaxLapses      = 1
  MaxAborts      = 1
  OwnTransfer    = TRUE
INVARIANT INV_NoWidening
CHECK_DEADLOCK FALSE
