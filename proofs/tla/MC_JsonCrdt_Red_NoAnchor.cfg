\* RED: a delete below a map held up only by sets below it goes out bare.
\* Alice sets "a.b" to 1 as a path edit, so "a" is a map only because of it.
\* She then deletes "a.b" and reads {"a": {}}, but nothing anchors "a": with
\* its only set gone, "a" vanishes and the field reads {}. Must fail
\* INV_WriteLandsAsRead.
SPECIFICATION Spec
CONSTANTS
  Peers            = {p1, p2}
  MaxBlocks        = 2
  UseCid           = TRUE
  DeleteWins       = FALSE
  DeleteImpliesMap = FALSE
  SharedIds        = FALSE
  MultiPath        = TRUE
  Settle           = TRUE
  ReadAs           = "design"
  Anchor           = FALSE
INVARIANT TypeOK
INVARIANT INV_WriteLandsAsRead
