\* RED: the drain waits with no deadline. A request that hangs forever keeps
\* the drain waiting forever, and shutdown never returns. Must fail
\* LIVE_ShutdownTerminates.
SPECIFICATION Spec
CONSTANTS
  RedriveInSet    = TRUE
  AwaitServices   = TRUE
  DrainDeadline   = FALSE
  SlotKeepsHandle = TRUE
PROPERTY LIVE_ShutdownTerminates
CHECK_DEADLOCK FALSE
