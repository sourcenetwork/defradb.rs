\* Plants the bug of a search that skips an entry for any superseded marker, even one an update from its future set: an older search loses the entry that is newest for it, so it scores the wrong entries (INV_ScoresLatest, checked first) and here the vector is hidden outright too.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS Nodes = {a, b}
          Readers = {r1, r2}
          MaxCommits = 3
          MaxOwn = 2
          GenerationCheck = TRUE
          OwnAppendsRead = TRUE
          TruncateThroughLinked = TRUE
          LatestOnly = TRUE
          HeadCut = TRUE
          HeadAwareMarks = FALSE
          GapCheck = TRUE
          Evictions = FALSE
INVARIANT INV_ScoresLatest
INVARIANT INV_NoHiddenPending
INVARIANT INV_CacheCovers
INVARIANT INV_NoLostVector
SYMMETRY Symmetry
