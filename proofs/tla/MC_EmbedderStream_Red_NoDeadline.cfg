\* RED: handlers get no deadline. s1 hangs, and unless someone revokes peer a or
\* shuts the node down it serves forever. Expect LIVE_HandlerEnds to be violated.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Streams <- mcStreams
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  Registered <- mcRegistered
  Stuck <- mcStuck
  Share = 1
  TagMode = "Check"
  LeaseMode = "WithRequest"
  DeadlineMode = "None"
  RevokeMode = "Close"
  ShutdownMode = "Abort"
INVARIANT INV_TypeOK
PROPERTY LIVE_HandlerEnds
