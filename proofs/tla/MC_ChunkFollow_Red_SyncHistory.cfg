\* run-all: ChunkFollow.tla RED
\* doc sync sends the old texts' chunks too (INV_SyncSendsCurrentChunks)
\* RED: the bug plants a document sync that sends every chunk the article
\* ever stored, the old text's ones too. After an edit, a sync answers with a
\* chunk the current text no longer uses, so one reply grows with the
\* article's history (INV_SyncSendsCurrentChunks).
SPECIFICATION Spec
CONSTANTS
  Articles = {pub, priv}
  Matching = {pub}
  ChunkRule = "parent"
  SyncRule = "history"
  DeletesFollow = TRUE
  Reconcile = TRUE
  Cascade = TRUE
  Embedded = FALSE
  KeepWaiting = TRUE
INVARIANT INV_SyncSendsCurrentChunks
CHECK_DEADLOCK FALSE
