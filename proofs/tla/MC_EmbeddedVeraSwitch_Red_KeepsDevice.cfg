\* run-all: EmbeddedVeraSwitch.tla RED
\* a switch that succeeded keeps the old device in the slot (INV_DeviceNamesNode)
\* RED: a switch whose new node runs leaves the device the slot recorded
\* as it was (settle records the device only for a node that no longer
\* runs). After a follow the slot still says active, so is_active answers
\* with the old role, and a later complete_switch or restart(None) starts
\* the node in it. Fails INV_DeviceNamesNode.
SPECIFICATION Spec
CONSTANTS
  EvictWatch     = TRUE
  AskWithdraws   = TRUE
  AbortOnStop    = TRUE
  SwitchDeadline = TRUE
  ClearsHalted   = TRUE
  RecordsTarget  = FALSE
  Restarts       = TRUE
  LinkShuts      = TRUE
  Reaps          = TRUE
  WaitsRelease   = TRUE
INVARIANT TypeOK
INVARIANT INV_ClosedAfterStop
INVARIANT INV_NoStartAfterStop
INVARIANT INV_SlotRuns
INVARIANT INV_StoppedMeansEnded
INVARIANT INV_DeviceNamesNode
PROPERTY LIVE_NoNodeAfterStop
PROPERTY LIVE_DropStops
PROPERTY LIVE_SwitchEnds
PROPERTY LIVE_WatchWakes
PROPERTY LIVE_StopReturns
PROPERTY LIVE_Recovers
CHECK_DEADLOCK FALSE
