\* run-all: ChunkFollow.tla RED
\* a merge deletes a chunk of a version it has not merged (INV_ChunksFollowParent)
\* RED: the bug plants a merge that deletes every chunk its text does not use,
\* even one whose version has not merged here. A chunk with a vector arrives
\* before its edit, the merge of the older text deletes it, and the merge of
\* the edit can't make it again, so the article misses it (INV_ChunksFollowParent).
SPECIFICATION Spec
CONSTANTS
  Articles = {pub, priv}
  Matching = {pub}
  ChunkRule = "parent"
  SyncRule = "current"
  DeletesFollow = TRUE
  Reconcile = TRUE
  Cascade = TRUE
  Embedded = TRUE
  KeepWaiting = FALSE
INVARIANT INV_ChunksFollowParent
CHECK_DEADLOCK FALSE
