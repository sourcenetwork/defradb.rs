\* RED: the drop does not retire its index's id, so an index created while
\* the drop still deletes entries, or before a restart resumes a failed
\* drop, gets the same id and shares its keys. The drop's pages delete the
\* new index's entries, and queries through it miss documents
\* (INV_NewIndexIntact).
SPECIFICATION Spec
CONSTANTS
  Docs = {1, 2}
  RecordMode = "Clear"
  FailMode = "Checked"
  EntryMode = "AfterDefinition"
  ResumeMode = "Resume"
  IdMode = "Reuse"
INVARIANT INV_NewIndexIntact
CHECK_DEADLOCK FALSE
