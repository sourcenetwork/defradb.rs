\* run-all: MC_Conv_NoHeadRediscovery.tla RED
\* convergence fails when nothing owes the heads (no on-connect rediscovery)
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Nodes <- mcNodes
  Blocks <- mcBlocks
  Parents <- mcParents
  Heads <- mcHeads
  InitialConnected <- mcInitialConnected
  Creator = "n1"
  Replicated = FALSE
  AllowRestart = FALSE
INVARIANT TypeOK
INVARIANT INV_DurableMerge
PROPERTY CONV_EventualConnectivity
