\* #3268: subscribe, then read from the cursor on every wake: once, in order, eventually (SSE)
\* GREEN: the closing channel (SSE): a local write and a merge, a full queue,
\* a re-merged block, a crash and hidden rows; every update is observed once,
\* in order, or skipped while hidden, and no hidden row is shown.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Updates = {u1, u2, u3}
  Merged = {u2}
  Cap = 1
  MaxCrashes = 1
  Hideable = {u1, u2}
  Channel = "closing"
  Mode = "safe"
INVARIANT TypeOK
INVARIANT INV_ExactlyOnce
INVARIANT INV_CommitOrder
INVARIANT INV_HiddenNotShown
INVARIANT INV_LossCounted
PROPERTY EventuallyObserved
