\* RED: a busy read is asked again with no patience at all. A node that
\* stays busy keeps the read asking without end; here eight busy answers
\* carry its asks past the patience of 15 steps. Must fail
\* INV_AttemptsBounded.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 0
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = FALSE
  MaxBusy     = 8
  RetryBusy   = TRUE
  Patience    = 15
  MaxTook     = 2
  PauseMin    = 1
  PauseMax    = 2
  CountTook   = TRUE
  CheckDrawn  = TRUE
INVARIANT TypeOK
INVARIANT INV_AttemptsBounded
