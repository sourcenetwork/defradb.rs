\* RED: a busy read is asked again without a cap. A node that stays busy
\* keeps the read asking without end; here four busy answers push it to a
\* fourth busy ask past the cap of three. Must fail INV_AttemptsBounded.
SPECIFICATION Spec
CONSTANTS
  Attempts    = 4
  MaxAdvances = 0
  CheckRoot   = TRUE
  Retry       = TRUE
  Capped      = FALSE
  BusyAttempts = 3
  MaxBusy     = 4
  RetryBusy   = TRUE
INVARIANT TypeOK
INVARIANT INV_AttemptsBounded
