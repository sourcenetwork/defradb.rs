\* RED: the fallback starts at once, beside the preferred family, instead of
\* after the delay. A host that answers on both families gets two connects for
\* every one it needs. Must fail INV_FallbackWaits.
SPECIFICATION Spec
CONSTANTS
  D              = 1
  CT             = 3
  MaxTime        = 3
  HasFallback    = TRUE
  MayHang        = TRUE
  Limited        = TRUE
  DelayFallback  = FALSE
  StartOnFailure = TRUE
  AwaitOther     = TRUE
  KeepLastError  = TRUE
  DropLosers     = TRUE
  TimeoutAll     = TRUE
INVARIANT TypeOK
INVARIANT INV_FallbackWaits
CHECK_DEADLOCK FALSE
