\* run-all: ChangeDelivery.tla RED
\* the gate shows a deleted or unreadable document's row (INV_HiddenNotShown)
\* RED: the gate shows every row, so a row whose document was deleted, or
\* that the reader may not read, is handed to the reader (INV_HiddenNotShown).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Updates = {u1, u2}
  Merged = {u2}
  Cap = 1
  MaxCrashes = 0
  Hideable = {u1}
  Channel = "coalescing"
  Mode = "gate_off"
INVARIANT TypeOK
INVARIANT INV_HiddenNotShown
