\* RED: the bug plants a write that creates every chunk of its text without
\* looking up the ones the article already has. When the peer's chunks arrive
\* before the article, the local create of the same article writes a chunk
\* that exists and is refused (INV_ValidWritesSucceed).
SPECIFICATION Spec
CONSTANTS
  Writers = {w1, w2}
  MaxOps = 2
  Validate = TRUE
  SameTxn = TRUE
  Cascade = TRUE
  CreateListBlock = TRUE
  Lookup = FALSE
INVARIANT INV_ValidWritesSucceed
CHECK_DEADLOCK FALSE
