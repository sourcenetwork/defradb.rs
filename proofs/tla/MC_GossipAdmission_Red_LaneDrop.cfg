\* RED (main): every admission worker and every refusal worker is busy, and
\* the dispatcher drops the gossip head on the spot, telling nobody. The peer
\* never says it again, so the document is lost for good with no event.
\* Expect INV_HeardIsOwnedOrReported to be violated.
SPECIFICATION FairSpec
CONSTANTS
  Docs <- mcDocs
  Peers <- mcPeers
  PeerOf <- mcPeerOf
  MemCap = 1
  MaxCrashes = 1
  PeerCap = 3
  TotalCap = 3
  Mode = "Durable"
  Promote = TRUE
  Lane = "Drop"
CHECK_DEADLOCK TRUE
INVARIANT INV_TypeOK
INVARIANT INV_HeardIsOwnedOrReported
