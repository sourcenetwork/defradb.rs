\* RED: a dropped token sends nothing, and no deadline passes in the run.
\* The engine gives up on a request, its stream stays in the table and the
\* peer waits on it forever. Must fail LIVE_NoLeak.
SPECIFICATION Spec
CONSTANTS
  N              = 1
  Cap            = 1
  D              = 1
  Lossy          = FALSE
  DeadlinePasses = FALSE
  TakeOnce       = TRUE
  DropReset      = FALSE
  SweepGuard     = TRUE
  CapGuard       = TRUE
INVARIANT TypeOK
PROPERTY LIVE_NoLeak
CHECK_DEADLOCK FALSE
