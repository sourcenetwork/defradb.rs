\* RED: a send that timed out is taken as sent. When it never reached the
\* node, the loop waits for a receipt that cannot come. Must fail
\* LIVE_UndisturbedCallConfirms.
SPECIFICATION Spec
CONSTANTS
  Resends          = FALSE
  KeepsTrying      = TRUE
  RetainsOnTimeout = TRUE
  NodeDedupes      = TRUE
  Disturbances     = 0
PROPERTY LIVE_UndisturbedCallConfirms
CHECK_DEADLOCK FALSE
