\* RED: a send that timed out is taken as sent. When it never reached the
\* node, the loop waits for a receipt that cannot come. Must fail
\* LIVE_ConfirmsUnlessDeadline.
SPECIFICATION Spec
CONSTANTS
  Resends          = FALSE
  KeepsTrying      = TRUE
  RetainsOnTimeout = TRUE
  NodeDedupes      = TRUE
PROPERTY LIVE_ConfirmsUnlessDeadline
CHECK_DEADLOCK FALSE
