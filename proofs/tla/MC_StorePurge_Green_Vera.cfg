\* run-all: StorePurge.tla GREEN
\* the wipe waits for the embedded Vera node to stop and removes its directories
\* GREEN: an embedded node on a persistent store with an embedded Vera node.
\* The wipe waits for the Vera stop and the close, and removes the Vera
\* directories.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded"}
  Stores   = {"Persistent"}
  Veras    = {"Embedded"}
  Developments = {TRUE}
  Handlers = {TRUE}
  HeldElsewhere = {TRUE, FALSE}
  OtherCallers  = {TRUE, FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = TRUE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
  SignerHeld               = TRUE
INVARIANT TypeOK
INVARIANT INV_NoWipeWhileOpen
INVARIANT INV_NoOpenBeforeWipe
INVARIANT INV_NothingSurvives
INVARIANT INV_KeyringKept
INVARIANT INV_SignerSurvivesRestart
INVARIANT INV_RefusedPurgeTouchesNothing
INVARIANT INV_PurgeOnlyInDevelopment
INVARIANT INV_OnePurgePerRun
INVARIANT INV_NoRestartAfterFailedTeardown
PROPERTY LIVE_PurgeServesAgain
CHECK_DEADLOCK FALSE
