\* run-all: StorePurge.tla RED
\* the keyring is in the removal set (INV_KeyringKept)
\* RED: the keyring path is in the removal set, so the purge loses the
\* node identity and the keyring-held peer key. Must fail INV_KeyringKept.
SPECIFICATION Spec
CONSTANTS
  Paths    = {"Embedded", "Cli"}
  Stores   = {"Persistent"}
  Veras    = {"None"}
  Developments = {TRUE}
  Handlers = {TRUE}
  HeldElsewhere = {FALSE}
  OtherCallers  = {FALSE}
  WipeAfterClose           = TRUE
  WaitVera                 = TRUE
  OpenAfterWipe            = TRUE
  ShutdownOutsideRequest   = TRUE
  DevelopmentChecked       = TRUE
  HandlerChecked           = TRUE
  GateOnce                 = TRUE
  NoRestartAfterFailedWipe = TRUE
  KeyringExcluded          = FALSE
  MemoryRemovesOwnedDirs   = TRUE
  CliChecksVeraStop        = TRUE
  CliChecksClose           = TRUE
  LastHandleChecked        = TRUE
  ShutdownOnce             = TRUE
  SignerHeld               = TRUE
INVARIANT INV_KeyringKept
CHECK_DEADLOCK FALSE
