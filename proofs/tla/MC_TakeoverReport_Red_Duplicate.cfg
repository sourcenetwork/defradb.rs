\* RED: every call that finds work publishes, not only the one that checks the
\* term. The outbox is not there yet, a later call delivers, and it reports the
\* same term a second time. Must fail INV_PublishedOnce.
SPECIFICATION Spec
CONSTANTS
    Submissions = {1, 2}
    MaxTerm = 2
    MaxFaults = 1
    Publish = TRUE
    AfterAll = TRUE
    Once = FALSE
    KeepOwed = TRUE
    CutOfTerm = TRUE
    NameUnrestorable = TRUE
    NameClosed = TRUE
    Recorded = TRUE
INVARIANT
    TypeOK
    INV_PublishedOnce
