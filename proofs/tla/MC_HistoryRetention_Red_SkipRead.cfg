\* run-all: HistoryRetention.tla RED
\* #559: a version read skips a pruned block and returns a partial document (INV_NoPartialRead)
\* Bug planted: a version read treats a block a prune deleted as the start of history. After the first prune, a read at c3 walks to c2, finds it gone and skips it, so the name value only c1 linked is lost from the rebuilt document: INV_NoPartialRead fails.
SPECIFICATION Spec
CONSTANTS
  MaxDepth = 2
  MaxActs = 2
  HeadMode = "Keep"
  FieldMode = "Keep"
  LinkMode = "Keep"
  ScanMode = "Validated"
  MarkerMode = "Keep"
  WindowMode = "Exact"
  ReclaimMode = "Scan"
  ReadMode = "Skip"
  MaxPrunes = 2
INVARIANTS TypeOK INV_HeadsStored INV_FieldHeadsStored INV_OwnedStored INV_WindowKept INV_NoStaleHead INV_Pruned INV_Reclaimed INV_KeptLinksStored INV_NoPartialRead
CHECK_DEADLOCK FALSE
