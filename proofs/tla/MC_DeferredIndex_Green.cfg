\* GREEN: two documents, two drains, plain increments and deletes, one explicit
\* transaction and one crash. Reads check owed documents live, the transaction counts
\* its own appends as owed, drains validate the position record and truncate only
\* through the head they planned. Every read is exact, inside the transaction too,
\* and the stored entries always match the position records.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a, b}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  Truncate = "Planned"
INVARIANT INV_TypeOK INV_ReadExact INV_TxReadExact INV_RecordMatchesIndex INV_SettledIndexExact
CHECK_DEADLOCK FALSE
