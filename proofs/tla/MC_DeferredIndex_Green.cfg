\* GREEN: two documents, two drains, plain increments and deletes, one explicit
\* transaction and one crash. Reads check owed documents live, the transaction counts
\* its own appends as owed, drains validate the position record and truncate only
\* through the head they planned, and the transaction reads the position records
\* without validating them. Every read is exact, inside the transaction too, the
\* stored entries always match the position records, and no drain aborts the
\* transaction.
SPECIFICATION Spec
CONSTANTS
  Docs = {d1, d2}
  Drains = {a, b}
  MaxSteps = 3
  Overlay = "On"
  OwnAppends = "On"
  RecordRead = "Validated"
  TxRecordRead = "Unvalidated"
  Truncate = "Planned"
  Reindex = "Off"
  WalkRecord = "Delete"
  WalkCheck = "Validated"
  Drop = "Off"
  Cleanup = "Paged"
  Page = 1
INVARIANT INV_TypeOK INV_ReadExact INV_TxReadExact INV_RecordMatchesIndex INV_SettledIndexExact INV_TxNotAbortedByDrain
CHECK_DEADLOCK FALSE
