\* RED: every write that has room runs as its own spawned task. The writes
\* waiting out their coalescing windows then each hold a task handle, so the
\* handles the coordinator retains grow with the writes in flight, and each
\* new spawn scans them all to prune the finished ones (#1099).
\* Expect INV_TasksBounded to be violated.
SPECIFICATION Spec
CONSTANTS
  Writes <- mcWrites
  Room = 2
  Slots = 1
  Shed = FALSE
  ReportExpiry = TRUE
  SlotAfterWindow = TRUE
  BoundRoom = TRUE
  OneLane = FALSE
CHECK_DEADLOCK TRUE
INVARIANT TypeOK
INVARIANT INV_TasksBounded
