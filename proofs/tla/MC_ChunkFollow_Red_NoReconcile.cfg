\* run-all: ChunkFollow.tla RED
\* a merged edit deletes nothing (INV_DroppedChunksGo)
\* RED: the bug plants a merge of an edit that deletes nothing. The peer syncs
\* an article the filter does not match, the source edits it, and the next
\* sync brings the edit but not the chunk's delete, so the chunk the edit
\* stopped using stays live (INV_DroppedChunksGo).
SPECIFICATION Spec
CONSTANTS
  Articles = {pub, priv}
  Matching = {pub}
  ChunkRule = "parent"
  SyncRule = "current"
  DeletesFollow = TRUE
  Reconcile = FALSE
  Cascade = TRUE
INVARIANT INV_DroppedChunksGo
CHECK_DEADLOCK FALSE
