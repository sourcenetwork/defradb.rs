\* run-all: DeferredDrainTask.tla RED
\* the note that a batch asked outlives its attempt, so a later commit never asks (INV_OwedKept)
\* RED: the note that a batch already asked outlives its attempt, as if one
\* manager served two transactions. An attempt asks; the next one owes, sees
\* the stale note, never asks, and commits work nobody asked for (INV_OwedKept).
SPECIFICATION Spec
CONSTANTS
  Poison = 1
  Hot = 2
  Quiet = 3
  Interval = 2
  Isolate = "On"
  KeepFailed = "On"
  Requeue = "On"
  PurgeRequests = "On"
  SweepTimer = "Fixed"
  SweepFirst = "On"
  AskOnce = "Shared"
INVARIANT INV_OwedKept
CHECK_DEADLOCK FALSE
