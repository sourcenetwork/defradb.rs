[package]
name = "conformance"
version = "0.1.0"
edition = "2021"
description = "Binds the proofs/tla and proofs/lean models to the real defradb.rs binary"
license = "Apache-2.0 OR MIT"
publish = false
autotests = false

[lib]
bench = false
path = "src/lib.rs"

[[test]]
name = "lean_conformance"
path = "tests/lean_conformance.rs"

[[test]]
name = "tla_conformance"
path = "tests/tla_conformance.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror.workspace = true

[dev-dependencies]
# The estimator constants `tests/lean_conformance.rs` binds to the Lean contract.
p2p = { path = "../crates/p2p" }
defra-harness = { git = "https://github.com/sourcenetwork/backbone.git", rev = "e8fc9b75fbadba355d08120c527f27ca9429ed57" }
edge = { path = "../crates/edge" }
nuclei.workspace = true

[lints]
workspace = true
