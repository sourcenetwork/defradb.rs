[package]
name = "conformance"
version = "0.1.0"
edition = "2021"
description = "Binds the proofs/tla and proofs/lean models to the real defradb.rs binary"
license = "Apache-2.0 OR MIT"
publish = false
autotests = false

[lib]
bench = false
path = "src/lib.rs"

[[test]]
name = "lean_conformance"
path = "tests/lean_conformance.rs"

[[test]]
name = "tla_conformance"
path = "tests/tla_conformance.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror.workspace = true

[dev-dependencies]
# The estimator constants `tests/lean_conformance.rs` binds to the Lean contract.
p2p = { path = "../crates/database/p2p" }
# The refusal messages and codes `lean_refusal_vocab_matches_rust` binds to UniqueRefusal.lean.
query = { path = "../crates/engine/query" }
storage = { path = "../crates/engine/storage" }
defra-harness = { git = "https://github.com/sourcenetwork/backbone.git", rev = "3421379115d69fd8bed8536943d5397ac6eb5ace" }
edge = { path = "../crates/foundation/edge" }
nuclei.workspace = true

[lints]
workspace = true
