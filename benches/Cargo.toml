[package]
name = "benches"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# regolith is the only backend, so there is no per-backend feature to pass
# through and no target that has to gate on one.
[dependencies]
criterion.workspace = true
db = { path = "../crates/database/db" }
document = { path = "../crates/building-blocks/document" }
storage = { path = "../crates/engine/storage" }
query = { path = "../crates/engine/query" }
defra-core = { path = "../crates/foundation/defra-core" }
schema = { path = "../crates/foundation/schema" }
nuclei.workspace = true
mimalloc.workspace = true
cid.workspace = true

[[bin]]
name = "cid-ablation"
path = "cid_ablation.rs"

[[bin]]
name = "cid-criterion"
path = "cid_criterion.rs"
