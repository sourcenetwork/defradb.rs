[package]
name = "p2p"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-agnostic P2P sync for DefraDB: messages, the sync coordinator and the transport trait PINC implements"

[lib]
bench = false

[dependencies]
# Internal crates
defra-core = { path = "../../foundation/defra-core" }
document = { path = "../../building-blocks/document" }
crypto = { path = "../../foundation/crypto" }
blockstore = { path = "../../engine/blockstore" }
datastore = { path = "../../engine/datastore" }
storage = { path = "../../engine/storage" }
identity = { path = "../../building-blocks/identity" }
acp = { path = "../../engine/acp" }
kms = { path = "../../database/kms", optional = true }
# The network runtime: every network task, sleep and deadline of this layer
# goes through it (`network`).
edge = { path = "../../foundation/edge" }
# Whether a caller is a worker of the data path's pool, which has no reactor.
workers = { path = "../../foundation/workers" }

# Lock-free shared state (see the workspace manifest).
kovan = { workspace = true }
kovan-map = { workspace = true }
kovan-queue = { workspace = true }
kovan-channel = { workspace = true }
# regolith::sync: waits that are part of the meaning, never a lock.
regolith = { workspace = true }

# Async
async-trait = { workspace = true }
futures = { workspace = true }
# Tasks and timers on the browser's event loop.
n0-future.workspace = true
futures-lite.workspace = true
# std::time::Instant and SystemTime panic in a browser. This is std verbatim
# off-wasm, so native timing behavior is untouched.
web-time.workspace = true

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
serde_bytes = { workspace = true }
postcard = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# UUID for message IDs
uuid = { workspace = true }

# IPLD
cid = { workspace = true }
multihash-codetable = { workspace = true }
ipld-core = { workspace = true }
serde_ipld_dagcbor = { workspace = true }

# Errors
thiserror = { workspace = true }
tracing = { workspace = true }

# Bytes
bytes = { workspace = true }

# Hashing
rapidhash = { workspace = true }

# Varint encoding for CARv1 format
unsigned-varint = "0.8"

[features]
default = []
# Log abstract delivery events for trace validation against
# proofs/tla/P2PDelivery.tla (`model_trace`). Off in every shipped build.
model-trace = []
# The KMS pubsub-RPC layer (crate::kms + crate::pubsub_rpc + the coordinator's
# KMS transport slot). Transport-generic.
kms = ["dep:kms"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nuclei = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
edge = { path = "../../foundation/edge", features = ["testing"] }
mantra-macros = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[package.metadata.cargo-machete]
ignored = []

[lints]
workspace = true
