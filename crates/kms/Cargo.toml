[package]
name = "kms"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Key Management Service for DefraDB — DEK generation, wrapping, distribution under NAC/DAC"

# Tracks Go DefraDB's `internal/kms/` package and the NAC-aware fix from
# Go PR #4778 (commit 1fab9fb3). Design doc: defradb.rs issue #976.
#
# Implementation lands across milestones M1–M7 on separate branches.
# This crate is a stub at design time.

[package.metadata.cargo-machete]
ignored = ["orbis", "vera"]

[features]
default = []
# Threshold (Orbis) backend. M6.
threshold = ["dep:orbis"]
# Vera-attested release policy. M4.
vera = ["dep:vera"]
sourcehub = ["vera"]

[lib]
bench = false

[dependencies]
bytes.workspace = true
regolith.workspace = true
ciborium.workspace = true
defra-core = { path = "../defra-core" }
crypto = { path = "../crypto" }
acp = { path = "../acp" }
identity = { path = "../identity" }

# Optional backends — feature-gated until the corresponding milestone lands.
orbis = { path = "../orbis", optional = true }
vera = { path = "../vera", optional = true }

# Peer key requests: single-flight per CID, one request per batch, a
# deadline, retries and metrics.
inputs = { path = "../inputs" }
# The network runtime peer requests run on.
edge = { path = "../edge" }
# Every transport's replies to one request, read together.
futures.workspace = true
async-trait.workspace = true
kovan.workspace = true
kovan-map.workspace = true
rapidhash.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes = "0.11"
base64 = "0.23"
zeroize = "1.8"
rand = { workspace = true }
uuid = { workspace = true }
cid = { workspace = true }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
# The KMS's bounded channels, on every target.
async-channel = "2"

[dev-dependencies]
workers = { path = "../workers" }
kovan-queue.workspace = true

[lints]
workspace = true
