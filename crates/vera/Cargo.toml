[package]
name = "vera"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Vera ACP client for DefraDB"

[lib]
bench = false

[dependencies]

# The network runtime the clients' connections and the providers' tasks run on.
edge = { path = "../edge" }

# Cosmos SDK transaction building and signing
cosmrs = "0.22"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
async-trait.workspace = true

# Error handling
thiserror.workspace = true

# Cryptography (the actor keys a delegation is signed with)
k256.workspace = true
p256 = { version = "0.14", features = ["ecdsa"] }
ed25519-dalek.workspace = true
hex.workspace = true

# Internal crates
acp = { path = "../acp" }
zanzibar = { path = "../zanzibar" }
identity = { path = "../identity" }
defra-core = { path = "../defra-core" }
crypto = { path = "../crypto" }
keyring = { path = "../keyring" }
events = { path = "../events" }
tempfile = "3"
vera-client = "0.1.2"
vera-domain = "0.1.2"
vera-modules = "0.1.2"
commonware-codec = "=2026.10.0"

# Lock-free shared state
kovan.workspace = true
kovan-map.workspace = true
kovan-queue.workspace = true

# Remote decisions: single-flight, a deadline, retries, an in-flight cap,
# metrics; the byte-bounded registration cache.
inputs = { path = "../inputs" }

# Logging
tracing.workspace = true
sha2.workspace = true

# Hashing
rapidhash.workspace = true
regolith.workspace = true

# Base64 for bearer token
base64.workspace = true

# ACP call encoding and identifiers
alloy-sol-types.workspace = true
alloy-primitives.workspace = true
bs58.workspace = true

# Authenticated ACP records and permission evaluation
acp-light-client = { git = "https://github.com/sourcenetwork/backbone.git", rev = "502e60487f585a8303afa4998b07806aab69922c" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# HTTP for REST/LCD and CometBFT JSON-RPC, and the gRPC channel, on nuclei
# sockets; the browser's fetch on wasm32 (below).
net = { path = "../net" }
futures.workspace = true
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
# The Cosmos event stream: a WebSocket over a futures-io stream (net::connect).
async-tungstenite = "0.35.0"
nuclei.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2"] }
n0-future.workspace = true

[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
edge = { path = "../edge", features = ["testing"] }
# Tests run with ordered JSON maps: bytes built from a map in any order but the sorted one then differ from the
# pinned ones, so a signed or hashed encoding that depends on this feature fails here and not only in a wider build.
serde_json = { workspace = true, features = ["preserve_order"] }
kovan-queue.workspace = true
# vera.rs's own token verifier, which the tokens built here must pass.
vera-crypto = "0.1.2"

[lints]
workspace = true
