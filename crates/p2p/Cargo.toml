[package]
name = "p2p"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "P2P networking for DefraDB using libp2p"

[lib]
bench = false

[dependencies]
# Internal crates
defra-core = { path = "../defra-core" }
document = { path = "../document" }
crypto = { path = "../crypto" }
blockstore = { path = "../blockstore" }
storage = { path = "../storage" }
identity = { path = "../identity" }
acp = { path = "../acp" }
kms = { path = "../kms", optional = true }
kovan-map = { version = "0.1.20", optional = true }

# libp2p transport
libp2p = { workspace = true, features = ["tcp", "noise", "yamux", "identify", "request-response", "macros", "tokio", "gossipsub", "kad", "relay", "dns", "quic", "websocket", "memory-connection-limits"], optional = true }
iroh-bitswap = { workspace = true, optional = true }
libp2p-stream = { workspace = true, optional = true }
multiaddr = { workspace = true, optional = true }

# Async
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
async-trait = { workspace = true }
futures = { workspace = true }
# Spawning that resolves to tokio natively and to wasm-bindgen-futures in a
# browser, behind one JoinHandle surface. iroh already builds on it.
n0-future.workspace = true
# std::time::Instant and SystemTime panic in a browser. This is std verbatim
# off-wasm, so native timing behavior is untouched.
web-time.workspace = true

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
serde_bytes = { workspace = true }
postcard = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# UUID for message IDs
uuid = { workspace = true }

# IPLD
cid = { workspace = true }
multihash-codetable = { workspace = true }
ipld-core = { workspace = true }
serde_ipld_dagcbor = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rlimit = { version = "0.9", optional = true }
sysinfo = { version = "0.33", optional = true }

# Bytes
bytes = { workspace = true }

# Hashing
rapidhash = { workspace = true }

# Varint encoding for CARv1 format
unsigned-varint = "0.8"

# Synchronization (non-poisoning locks)
parking_lot = { workspace = true }
lru = { workspace = true, optional = true }

# Iroh transport (optional)
iroh = { workspace = true, optional = true }
iroh-gossip = { workspace = true, optional = true }
iroh-tickets = { workspace = true, optional = true }
iroh-relay = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rand = { version = "0.9", optional = true }
blake3 = { version = "1", optional = true }

[features]
default = []
test-utils = ["libp2p-transport"]
libp2p-transport = [
    "dep:iroh-bitswap",
    "kms",
    "dep:libp2p",
    "dep:libp2p-stream",
    "dep:multiaddr",
    "dep:rlimit",
    "dep:sysinfo",
]
# The KMS pubsub-RPC layer (crate::kms + crate::pubsub_rpc + the coordinator's
# KMS transport slot). Transport-generic; implied by libp2p-transport and
# opt-in for iroh-only builds.
kms = ["dep:kms", "dep:kovan-map"]
iroh-transport = ["dep:iroh", "dep:iroh-gossip", "dep:iroh-tickets", "dep:noq", "dep:rand", "dep:blake3", "dep:lru"]
# Host an iroh relay server next to the endpoint. Pulls in the relay's HTTP,
# WebSocket, and TLS stack, so it stays out of plain iroh builds.
iroh-relay-server = ["iroh-transport", "dep:iroh-relay", "dep:rustls"]

# iroh links noq only off-wasm, so the feature pin preserving its bloom token
# log and ring provider belongs here, not in the shared dependency list. tokio's
# fs driver has no wasm implementation and only the secret-key loader wants it.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
noq = { version = "1.1", features = ["bloom", "rustls-ring"], optional = true }
tokio = { workspace = true, features = ["fs"] }

# rand reaches getrandom 0.3, which refuses to build for the browser without an
# explicit backend. The matching --cfg lives in .cargo/config.toml.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[package.metadata.cargo-machete]
ignored = ["getrandom", "multiaddr", "noq", "rand"]

[lints]
workspace = true
