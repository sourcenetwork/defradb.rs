[package]
name = "defra-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable embedded DefraDB node builder"

[[bin]]
name = "coding-session-bench"
path = "src/bin/coding-session-bench.rs"
test = false

[features]
default = ["native", "vera", "wasmtime-runtime"]
http = ["dep:defra-http", "dep:axum"]
# The managed P2P system (transport kind, push options, KMS) without a transport:
# what FFI needs on a node with no network. Every transport feature implies it.
managed-p2p = ["dep:defra-http", "dep:defra-p2p-adapter", "dep:kms", "dep:blockstore"]
# Iroh/QUIC. Implies native. Does not enable libp2p.
p2p = [
    "native",
    "managed-p2p",
    "dep:p2p",
    "dep:replication-filter",
    "p2p/iroh-transport",
    "p2p/kms",
    "defra-p2p-adapter/iroh",
    "defra-p2p-adapter/kms",
    "defra-p2p-adapter/native",
]
# The iroh transport under its former `embedded` name.
iroh = ["p2p"]
# libp2p transport. Off by default: the default node's graph has no libp2p.
libp2p = [
    "native",
    "managed-p2p",
    "dep:libp2p",
    "dep:p2p",
    "dep:replication-filter",
    "db/p2p",
    "p2p?/libp2p-transport",
    "defra-p2p-adapter/libp2p",
    "defra-p2p-adapter/native",
]
# Opt in only when the application uses the OS keyring backend.
system-keyring = ["keyring/system"]
# Native host (event channel). Default-on.
native = ["db/native", "defra-p2p-adapter?/native"]
# Vera / vera.rs on-chain document ACP. Default-on; omit for local-only ACP.
vera = ["dep:vera"]
sourcehub = ["vera"]
# Lens WASM execution. Default-on; without it set_migration fails explicitly.
wasmtime-runtime = [
    "db/wasmtime-runtime",
    
    "lens/wasmtime-runtime",
    "defra-p2p-adapter?/wasmtime-runtime",
]
# Compile in OpenTelemetry exporter support. Mirrors the CLI's `otel` feature
# and the underlying `telemetry/otlp` gate. Off by default — embedded users
# who want OTel must opt in.
otel = ["telemetry/otlp"]

[lib]
bench = false

[dependencies]
rapidhash.workspace = true
kovan-queue.workspace = true
regolith.workspace = true
crypto = { path = "../crypto" }
hex.workspace = true
keyring = { path = "../keyring", default-features = false }
zeroize = "1"
crdt = { path = "../crdt" }
db = { path = "../db", default-features = false }
storage = { path = "../storage" }
query = { path = "../query" }
events = { path = "../events" }
acp = { path = "../acp" }
zanzibar = { path = "../zanzibar" }
vera = { path = "../vera", optional = true }
identity = { path = "../identity" }
defra-core = { path = "../defra-core" }
edge = { path = "../edge" }
# The worker pool the node's data path runs on.
workers = { path = "../workers" }
schema = { path = "../schema" }
lens = { path = "../lens", default-features = false }
tracing.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
axum = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Optional — HTTP server and the P2P operations trait
defra-http = { path = "../http", optional = true }

# Optional — P2P replication (IROH transport)
p2p = { path = "../p2p", optional = true }
defra-p2p-adapter = { workspace = true, optional = true, default-features = false }
kms = { path = "../kms", optional = true }
blockstore = { path = "../blockstore", optional = true }
replication-filter = { path = "../replication-filter", optional = true }
libp2p = { workspace = true, optional = true }

# Optional — OpenTelemetry exporter (see the `otel` feature)
telemetry = { path = "../telemetry", default-features = false }

# The process allocator of the `coding-session-bench` binary; the library sets
# none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
document = { path = "../document" }
defra-core = { path = "../defra-core", features = ["ambient"] }
edge = { path = "../edge", features = ["testing"] }
axum.workspace = true
# The mock embedding server binds its listener through the HTTP crate.
defra-http = { path = "../http" }
defra-p2p-adapter = { path = "../p2p-adapter", default-features = false }
futures.workspace = true
kovan.workspace = true
crypto = { path = "../crypto" }
tempfile = "3"
cid.workspace = true
base64 = { workspace = true }
zstd = "0.13"
tar = "0.4"

[lints]
workspace = true
