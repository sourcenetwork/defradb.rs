[package]
name = "schema"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["serde_ipld_dagcbor"]

[lib]
bench = false

[dependencies]
defra-core = { path = "../../foundation/defra-core" }
thiserror.workspace = true
serde.workspace = true
# `JsonSchema` for the descriptions the HTTP API serves. A foundation crate, so
# no runtime; the derive keeps ~18 mirrors out of `defra-http` that would
# otherwise duplicate this tree.
schemars = "1"
serde_json.workspace = true
serde_ipld_dagcbor.workspace = true
cid.workspace = true
multihash.workspace = true
rapidhash.workspace = true
sha2.workspace = true
tracing.workspace = true

[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
