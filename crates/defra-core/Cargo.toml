[package]
name = "defra-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["tracing"]

[lib]
bench = false

[features]
# Test-only: keeps the thread-local request state tests set the old way and
# lets a call that arrives without a RequestContext run in it. Enable it from
# dev-dependencies only, never from a production dependency.
ambient = ["dep:tokio"]

[dependencies]
# Error handling
thiserror.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
ciborium.workspace = true
uuid.workspace = true
multibase = "0.9"

# IPLD
cid.workspace = true
multihash.workspace = true
serde_ipld_dagcbor.workspace = true
ipld-core.workspace = true

# Hashing
rapidhash.workspace = true

# Lock-free shared state
kovan-map.workspace = true
kovan-queue.workspace = true

# Cryptography (for CID generation)
sha2.workspace = true
rand.workspace = true
zeroize = { version = "1.8", features = ["derive"] }

# Async
async-trait.workspace = true
regolith.workspace = true
bytes.workspace = true

# Logging
tracing.workspace = true

# The task-locals the test-only `ambient` feature keeps (see src/ambient.rs).
# Not needed on wasm, which is single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
futures.workspace = true
workers = { path = "../workers" }
multihash-codetable.workspace = true
proptest.workspace = true

[lints]
workspace = true
