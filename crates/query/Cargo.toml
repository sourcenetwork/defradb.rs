[package]
name = "query"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
bench = false

[dependencies]
# Query deadlines on the worker pool's deadline queue.
workers = { path = "../workers" }
bytes.workspace = true
web-time.workspace = true

# Hashing
rapidhash.workspace = true

# Lock-free shared state
kovan.workspace = true
kovan-map.workspace = true
kovan-queue.workspace = true
regolith.workspace = true
# Input-wait metrics share the remote-input histogram and stopwatch.
inputs = { path = "../inputs" }

# Internal crates
cursor = { path = "../cursor" }
defra-core = { path = "../defra-core" }
document = { path = "../document" }
crdt = { path = "../crdt" }
storage = { path = "../storage" }
schema = { path = "../schema" }
identity = { path = "../identity" }
acp = { path = "../acp" }
lens = { path = "../lens", default-features = false }

# Async runtime
async-trait.workspace = true
futures.workspace = true
sync_wrapper = "1"

# Serialization
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true

# Error handling
thiserror.workspace = true

base64.workspace = true

# Content addressing
cid.workspace = true
sha2.workspace = true

# Logging
tracing.workspace = true

# Full-text search
bm25.workspace = true

# GraphQL parsing
graphql-parser.workspace = true

# Regex (SDL preprocessing)
regex = "1"

# GraphQL introspection execution
async-graphql = "7"

# Time handling (for DateTime parsing in mutations)
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
defra-core = { path = "../defra-core", features = ["ambient"] }

[lints]
workspace = true
