[package]
name = "bitswap"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bitswap block exchange, wire-compatible with Go DefraDB"

[lib]
bench = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
asynchronous-codec = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
cid = { workspace = true }
futures = { workspace = true }
keyed_priority_queue = "0.4"
kovan-channel = { workspace = true }
libp2p = { workspace = true }
multihash = { workspace = true }
multihash-codetable = { workspace = true }
prost = { workspace = true }
rapidhash = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
unsigned-varint = { version = "0.8", features = ["asynchronous_codec"] }

[dev-dependencies]
hex = { workspace = true }
libp2p = { workspace = true, features = ["tokio", "macros"] }
libp2p-stream = { workspace = true }
multistream-select = "0.13"
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "io-util", "time", "test-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
