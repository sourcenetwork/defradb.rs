[package]
name = "bitswap"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bitswap block exchange, wire-compatible with Go DefraDB"

[lib]
bench = false

[lints]
workspace = true

[dependencies]
asynchronous-codec = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
cid = { workspace = true }
futures = { workspace = true }
keyed_priority_queue = "0.4"
kovan-channel = { workspace = true }
libp2p = { workspace = true }
multihash = { workspace = true }
multihash-codetable = { workspace = true }
nuclei = { workspace = true }
prost = { workspace = true }
rapidhash = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unsigned-varint = { version = "0.8", features = ["asynchronous_codec"] }

[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
hex = { workspace = true }
libp2p = { workspace = true, features = ["macros"] }
# Test swarms on nuclei sockets.
net = { path = "../net", features = ["libp2p"] }
libp2p-stream = { workspace = true }
multistream-select = "0.13"
serde_json = { workspace = true }
sha2 = { workspace = true }
