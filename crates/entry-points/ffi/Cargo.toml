[package]
name = "ffi"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FFI bindings for DefraDB Rust implementation"

[package.metadata.cargo-machete]
ignored = ["cid", "serde_bytes", "serde_ipld_dagcbor", "serde_yaml", "sha2", "thiserror"]

[lib]
bench = false
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native", "wasmtime-runtime", "libp2p"]
native = ["db/native", "defra-node/native"]
iroh = ["defra-node/p2p", "p2p/iroh-transport"]
libp2p = ["db/p2p", "p2p/libp2p-transport", "defra-node/libp2p"]
wasmtime-runtime = [
    "db/wasmtime-runtime",
    
    
    "defra-node/wasmtime-runtime",
    "lens/wasmtime-runtime",
]
profiling = ["dep:tracing-chrome", "dep:tracing-subscriber"]

[dependencies]
rapidhash.workspace = true
# The network runtime network calls block their C caller's thread on.
edge = { path = "../../foundation/edge" }
# The worker pool the node's data path runs on.
workers = { path = "../../foundation/workers" }

# Serialization
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true
serde_yaml = "0.9"
serde_ipld_dagcbor.workspace = true
serde_bytes.workspace = true

# Memory zeroization for sensitive key material
zeroize = "1"

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-chrome = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"], optional = true }

# Lock-free shared state
regolith.workspace = true
kovan.workspace = true
kovan-channel.workspace = true
kovan-map.workspace = true
kovan-queue.workspace = true

# Cryptographic hashing
sha2.workspace = true
hex.workspace = true
base64.workspace = true

# Internal crates
crypto = { path = "../../foundation/crypto" }
db = { path = "../../database/db", default-features = false }
defra-core = { path = "../../foundation/defra-core" }
defra-version = { path = "../../foundation/defra-version" }
defra-p2p-adapter = { path = "../../surfaces/p2p-adapter", default-features = false }
document = { path = "../../building-blocks/document" }
events = { path = "../../foundation/events" }
storage = { path = "../../engine/storage" }
query = { path = "../../engine/query" }
schema = { path = "../../foundation/schema" }
identity = { path = "../../building-blocks/identity" }
keyring = { path = "../../foundation/keyring", default-features = false }
acp = { path = "../../engine/acp" }
lens = { path = "../../foundation/lens", default-features = false }
p2p = { path = "../../database/p2p" }
blockstore = { path = "../../engine/blockstore" }
defra-node = { path = "../../entry-points/defra-node", default-features = false, features = ["managed-p2p"] }

# IPLD
cid.workspace = true

[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
defra-core = { path = "../../foundation/defra-core", features = ["ambient"] }
futures-lite.workspace = true
mantra-macros = "0.9"
tempfile = "3.17"

[lints]
workspace = true
