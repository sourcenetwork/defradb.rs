"""
include_guard = "DEFRA_H"
# The extern "C" guards that give C++ callers the unmangled symbols the
# library exports. `just check-c-api` fails on any exported function without
# C linkage in C++.
cpp_compat = true
documentation = true
documentation_style = "c"

[export]
include = [
    "DefraKeyringGetCallback",
    "DefraKeyringSetCallback",
    "DefraRemoteSignAsyncCallback",
    "DefraRemoteSignCallback",
    "DefraReplicationFilterCallback",
    "DefraResultCallback",
    "DefraResult",
    "DefraNewIdentityResult",
    "DefraNewNodeResult",
    "DefraNewTxnResult",
    "NodeInitOptions",
]

[export.rename]
"NodeInitOptions" = "DefraNodeInitOptions"

[fn]
rename_args = "SnakeCase"

[struct]
# The Rust field names are already snake_case. Renaming to SnakeCase would
# also strip the leading underscore that marks a _reserved field as not for
# callers.
rename_fields = "None"

[enum]
rename_variants = "ScreamingSnakeCase"
