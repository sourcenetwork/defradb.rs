# cbindgen configuration for the C API.
# Generate the header with: just build-ffi-header

language = "C"
header = """
/*
 * DefraDB C API - generated header.
 *
 * The functions cover the calls of Go DefraDB's cbindings (libdefradb.h),
 * named defra_<noun>_<verb>. Names and types are prefixed and
 * DefraNodeInitOptions adds fields after Go's, so this header is not a
 * drop-in for libdefradb.h. A call that works on a store takes a handle
 * naming a node or one of its transactions. Each call that can grow takes
 * its options as a struct, by value, whose zero value is every default; the
 * caller's identity (0 for none) is one of its fields. Fields are only ever
 * appended, so code built against an older header keeps working. A field
 * whose name starts with _reserved fills what would be padding: leave it
 * zero; it never becomes a field. Free every result a call returns with its
 * free function: defra_result_free, or
 * defra_new_<kind>_result_free.
 */
"""
# Every call that takes options is exported as defra_<name>_sized(...,
# opts, opts_size); these wrappers are the API callers use, passing the
# options by value. The library reads the caller's opts_size bytes, so a
# struct that grows keeps working with older callers. The ffi test
# api::header_tests checks them against the _sized calls and, when they
# drift, prints the wrappers to paste here.
trailer = """
