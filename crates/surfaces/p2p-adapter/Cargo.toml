[package]
name = "defra-p2p-adapter"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DefraDB P2P adapters for HTTP-facing operations"

[package.metadata.cargo-machete]
ignored = ["hex", "serde"]

[lib]
bench = false

[dependencies]
acp = { path = "../../engine/acp" }
blockstore = { path = "../../engine/blockstore" }
db = { path = "../../database/db", default-features = false }
defra-core = { path = "../../foundation/defra-core" }
document = { path = "../../building-blocks/document" }
events = { path = "../../foundation/events" }
identity = { path = "../../building-blocks/identity" }
lens = { path = "../../foundation/lens", default-features = false }
p2p = { path = "../../database/p2p", default-features = false }
kms = { path = "../../database/kms", optional = true }
# The network runtime the peer runs on.
edge = { path = "../../foundation/edge" }
query = { path = "../../engine/query" }
replication-filter = { path = "../../database/replication-filter" }
schema = { path = "../../foundation/schema" }
storage = { path = "../../engine/storage" }
workers = { path = "../../foundation/workers" }

async-trait.workspace = true
bytes.workspace = true
chrono = { version = "0.4", features = ["serde"] }
cid.workspace = true
hex.workspace = true
kovan.workspace = true
regolith.workspace = true
kovan-map.workspace = true
kovan-queue.workspace = true
futures-lite.workspace = true
rapidhash.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_ipld_dagcbor.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
web-time.workspace = true
zeroize = "1"
nuclei.workspace = true
# The transport the peer runs on.
defra-pinc = { path = "../../database/pinc", optional = true }

[dev-dependencies]
edge = { path = "../../foundation/edge", features = ["testing"] }
crypto = { path = "../../foundation/crypto" }
data-encoding = "2"
futures.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = ["native", "wasmtime-runtime", "pinc"]
native = ["db/native"]
wasmtime-runtime = ["db/wasmtime-runtime", "lens/wasmtime-runtime"]
# Encryption key distribution over the peer's raw topics, and the pubsub_rpc
# services that come with it.
kms = ["dep:kms", "p2p/kms"]
# The pinc peer: the transport, its adapter and its restore.
pinc = ["native", "kms", "dep:defra-pinc"]

[lints]
workspace = true
