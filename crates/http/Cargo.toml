[package]
name = "defra-http"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["futures", "hyper"]

[features]
default = ["server"]
# The axum server, its handlers, and middleware. Without it only the operation
# traits and their wire types remain, which is what a browser peer's P2P
# adapter implements; none of the server stack builds for wasm32.
server = [
    "dep:async-stream",
    "dep:axum",
    "dep:edge",
    "dep:net",
    "dep:nuclei",
    "dep:hyper",
    "dep:rustls",
    "dep:telemetry",
    "dep:tower",
    "dep:tower-http",
    "dep:workers",
]
test-utils = ["server"]

[lib]
bench = false

[dependencies]
# Internal crates
query = { path = "../query" }
identity = { path = "../identity" }
schema = { path = "../schema" }
acp = { path = "../acp" }
events = { path = "../events" }
defra-core = { path = "../defra-core" }
defra-version = { path = "../defra-version" }
crypto = { path = "../crypto" }
lens = { path = "../lens", default-features = false }
db = { path = "../db", default-features = false }

# Encoding
hex = "0.4"
base64.workspace = true
cid.workspace = true

# Async runtime: requests run on the network runtime the server is given.
edge = { path = "../edge", optional = true }
# The worker pool the data-path routes run on.
workers = { path = "../workers", optional = true }
async-trait.workspace = true
futures.workspace = true
async-stream = { version = "0.3", optional = true }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Hashing
rapidhash.workspace = true

# Lock-free shared state
kovan.workspace = true
kovan-map.workspace = true
kovan-queue.workspace = true

# HTTP server
axum = { workspace = true, optional = true }
rustls = { workspace = true, features = ["ring", "std", "tls12"], optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true
telemetry = { path = "../telemetry", optional = true }

# Retry jitter

# db's native runtime is the only one it builds with off-wasm, server or not.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The server's sockets, accept loop and TLS.
net = { path = "../net", optional = true }
nuclei = { workspace = true, optional = true }
db = { path = "../db", default-features = false, features = ["native"] }

[dev-dependencies]
regolith.workspace = true
defra-core = { path = "../defra-core", features = ["ambient"] }
edge = { path = "../edge", features = ["testing"] }
tower = { workspace = true, features = ["util"] }
urlencoding = "2.1"
crypto = { path = "../crypto" }

# Enable test-utils feature for integration tests
defra-http = { path = ".", features = ["test-utils"] }
storage = { path = "../storage" }

[lints]
workspace = true
