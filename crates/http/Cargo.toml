[package]
name = "defra-http"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["futures", "hyper"]

[features]
default = ["server"]
# The axum server, its handlers, and middleware. Without it only the operation
# traits and their wire types remain, which is what a browser peer's P2P
# adapter implements; none of the server stack builds for wasm32.
server = [
    "dep:async-stream",
    "dep:axum",
    "dep:axum-server",
    "dep:hyper",
    "dep:rand",
    "dep:rustls",
    "dep:telemetry",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tower",
    "dep:tower-http",
]
test-utils = ["server"]

[lib]
bench = false

[dependencies]
# Internal crates
query = { path = "../query" }
identity = { path = "../identity" }
schema = { path = "../schema" }
acp = { path = "../acp" }
events = { path = "../events" }
defra-core = { path = "../defra-core" }
defra-version = { path = "../defra-version" }
crypto = { path = "../crypto" }
lens = { path = "../lens", default-features = false }
db = { path = "../db", default-features = false }

# Encoding
hex = "0.4"
base64.workspace = true
cid.workspace = true

# Async runtime
tokio = { workspace = true, features = ["rt", "net", "time"], optional = true }
tokio-stream = { workspace = true, optional = true }
async-trait.workspace = true
futures.workspace = true
async-stream = { version = "0.3", optional = true }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Hashing
rapidhash.workspace = true

# HTTP server
axum = { workspace = true, optional = true }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true
telemetry = { path = "../telemetry", optional = true }

# Retry jitter
rand = { workspace = true, optional = true }

# db's native runtime is the only one it builds with off-wasm, server or not.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
db = { path = "../db", default-features = false, features = ["native"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "test-util"] }
tower = { workspace = true, features = ["util"] }
urlencoding = "2.1"
crypto = { path = "../crypto" }

# Enable test-utils feature for integration tests
defra-http = { path = ".", features = ["test-utils"] }
storage = { path = "../storage" }

[lints]
workspace = true
