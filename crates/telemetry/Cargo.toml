[package]
name = "telemetry"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Compile in the OTLP exporters. Mirrors Go DefraDB's
# `//go:build telemetry` tag — opt-in at compile time. When this feature is on,
# runtime behavior is default-on (Go parity); use `--no-telemetry` to disable
# at runtime.
otlp = [
    "dep:kovan",
    "dep:net",
    "dep:edge",
    "dep:opentelemetry-http",
    "dep:async-trait",
    "dep:tracing-subscriber",
    "dep:thiserror",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "opentelemetry_sdk/trace",
    "opentelemetry_sdk/metrics",
    "opentelemetry-otlp/trace",
    "opentelemetry-otlp/metrics",
    # `internal-logs` is a default feature of both crates that
    # `default-features = false` (below) turns off. Without it the SDK's
    # `otel_error!` / `otel_warn!` macros compile to no-ops, so exporter
    # failures emit no `tracing` events at all — which would make the
    # OtelDedupFilter dead code AND hide every "collector unreachable"
    # error. The whole point of #977 is to surface (and dedup) those, so
    # it must stay on.
    "opentelemetry_sdk/internal-logs",
    "opentelemetry-otlp/internal-logs",
]
[lib]
bench = false

[dependencies]
kovan = { workspace = true, optional = true }
rapidhash.workspace = true
regolith.workspace = true
# OTLP exports go out on nuclei sockets (`src/transport.rs`), as tasks of
# the on-demand network runtime.
net = { path = "../net", optional = true }
edge = { path = "../edge", optional = true }
opentelemetry-http = { version = "0.32", default-features = false, optional = true }
async-trait = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["registry", "std"], optional = true }
thiserror = { workspace = true, optional = true }

opentelemetry = { version = "0.32", features = ["metrics"], optional = true }
# `experimental_async_runtime` (not `rt-tokio`) is all that's needed: the
# batch processors run on dedicated `std::thread` workers, and no tokio
# runtime is touched.
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["experimental_async_runtime"], optional = true }
# OTLP over HTTP/proto, mirroring Go DefraDB's `otlptracehttp.New`. Default
# endpoint is http://localhost:4318, the same default as the Go upstream. The
# HTTP client is ours (`src/transport.rs`).
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto"], optional = true }
# Provides the `SCHEMA_URL` constant for the resource's schema declaration,
# matching Go's `resource.WithSchemaURL(semconv.SchemaURL)`.
opentelemetry-semantic-conventions = { version = "0.33", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[lints]
workspace = true
