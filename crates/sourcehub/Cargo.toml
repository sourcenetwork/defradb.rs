[package]
name = "sourcehub"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SourceHub ACP client for DefraDB"

[lib]
bench = false

[dependencies]
# HTTP client for REST/LCD and CometBFT JSON-RPC
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }

# Cosmos SDK transaction building and signing
cosmrs = "0.22"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
tokio = { workspace = true, features = ["rt", "sync", "time", "io-util"] }
async-trait.workspace = true

# Error handling
thiserror.workspace = true

# Cryptography (secp256k1 signing key)
k256.workspace = true
hex.workspace = true

# Internal crates
acp = { path = "../acp" }
zanzibar = { path = "../zanzibar" }
identity = { path = "../identity" }
defra-core = { path = "../defra-core" }
crypto = { path = "../crypto" }
keyring = { path = "../keyring" }
events = { path = "../events" }
rand.workspace = true
tempfile = "3"
hub-client = { git = "https://github.com/sourcenetwork/hub.rs", rev = "f7748e7a5c9b680588087df768143ee831dad563" }
hub-domain = { git = "https://github.com/sourcenetwork/hub.rs", rev = "f7748e7a5c9b680588087df768143ee831dad563" }
hub-modules = { git = "https://github.com/sourcenetwork/hub.rs", rev = "f7748e7a5c9b680588087df768143ee831dad563" }
commonware-codec = "2026.9.0"

# Logging
tracing.workspace = true
sha2.workspace = true

# Base64 for bearer token
base64.workspace = true

# ACP call encoding and identifiers
alloy-sol-types.workspace = true
alloy-primitives.workspace = true
bs58.workspace = true

# Authenticated ACP records and permission evaluation
acp-light-client = { git = "https://github.com/sourcenetwork/backbone.git", rev = "1138242237211467a2a00c67b40c1f0e3b72bfea" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures.workspace = true
prost.workspace = true
tokio-tungstenite = { version = "0.26.2", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net"] }

[lints]
workspace = true
