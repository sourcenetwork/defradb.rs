[package]
name = "vera-delegation"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Vera delegations and the policy commands they are bound to, without the provider"

[lib]
bench = false

[features]
# Signers that record what they are asked and answer as told, for tests of
# code that takes a `DelegationSigner`.
testing = ["dep:regolith"]

[dependencies]
# `DelegationAudience` and the clock skew allowance every delegation is set back by.
acp = { path = "../acp" }
# The relationship subjects a policy command names.
zanzibar = { path = "../zanzibar" }
# `did:key` encoding of the actor keys.
crypto = { path = "../crypto" }
# `MaybeBoxFuture` and `MaybeSendSync`, the signer's thread bounds.
defra-core = { path = "../defra-core" }

# vera.rs's token claims, its typed policy commands and their relationship types.
vera-crypto = "0.1.2"
vera-modules = "0.1.2"
vera-acp = "0.1.2"

# The actor keys a delegation is signed with.
k256.workspace = true
p256 = { version = "0.14", features = ["ecdsa"] }
ed25519-dalek.workspace = true
sha2.workspace = true

# The ACP call a command is submitted in.
alloy-sol-types.workspace = true
alloy-primitives.workspace = true

serde.workspace = true
serde_json.workspace = true
base64.workspace = true
bs58.workspace = true
hex.workspace = true
thiserror.workspace = true

regolith = { workspace = true, optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
# Tests run with ordered JSON maps: bytes built from a map in any order but the sorted one then differ from the
# pinned ones, so a signed or hashed encoding that depends on this feature fails here and not only in a wider build.
serde_json = { workspace = true, features = ["preserve_order"] }
identity = { path = "../identity" }
nuclei.workspace = true
regolith.workspace = true

[lints]
workspace = true
