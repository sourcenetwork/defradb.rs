[package]
name = "crdt"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["serde_json", "thiserror"]

[lib]
bench = false

[features]
# Spans that were `level = "trace"` / `level = "debug"` under `tracing`,
# i.e. compiled out in production. `fastrace` has no per-callsite level
# filter, so they are feature-gated to keep the default build quiet.
verbose-spans = []

[dependencies]
bytes.workspace = true
defra-core = { path = "../defra-core" }
storage = { path = "../storage" }
rapidhash.workspace = true

# Async
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true
tracing.workspace = true
fastrace.workspace = true

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
