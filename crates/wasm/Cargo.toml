[package]
name = "defra-wasm"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DefraDB browser client - WASM build for browser-based applications"

[package.metadata.cargo-machete]
ignored = ["async-trait", "getrandom", "sha2"]

[lib]
bench = false
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = { workspace = true }
# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Serialization for JS interop
serde-wasm-bindgen = "0.6"
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Async (minimal features for WASM)
futures.workspace = true
async-trait.workspace = true

# Debugging
console_error_panic_hook = { version = "0.1", optional = true }

# Cryptography (for hashing schema IDs)
sha2.workspace = true

# Encoding
hex.workspace = true

# WASM random number generation
getrandom = { version = "0.2", features = ["js"] }

# Internal crates - use db crate which provides everything
# `wasm-rules`: a governed collection is judged here by the same rule
# module a relay runs, on wasmi.
db = { path = "../db", default-features = false, features = ["wasm-rules"] }
blockstore = { path = "../blockstore" }
serde_bytes.workspace = true
n0-future.workspace = true
storage = { path = "../storage", default-features = false, features = ["wasm"] }
schema = { path = "../schema" }
document = { path = "../document" }
query = { path = "../query" }
defra-core = { path = "../defra-core" }
crypto = { path = "../crypto" }
identity = { path = "../identity" }
zeroize = "1.8"
events = { path = "../events", features = ["channel"] }
# The browser is a P2P peer over a relay-only iroh endpoint, running the same
# coordinator, replication stack, and document ACP a native node does.
acp = { path = "../acp", default-features = false }
defra-p2p-adapter = { path = "../p2p-adapter", default-features = false, features = ["iroh"] }
p2p = { path = "../p2p", default-features = false, features = ["iroh-transport"] }
iroh.workspace = true
hkdf = "0.12"

# IPLD
cid.workspace = true

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Rule-module guests for the governance tests, assembled in the test.
wat = "1"
# The relay end-to-end test drives a native node's HTTP API with fetch and
# waits on replication with browser timers.
web-sys = { version = "0.3", features = ["Headers", "Request", "RequestInit", "Response", "Window"] }
gloo-timers = { version = "0.3", features = ["futures"] }
# The browser benchmark reports through the same contract the native suite
# does, so the two describe a measurement identically.
defra-perf = { path = "../../tools/perf" }

# Built only for tools/browser-p2p-e2e.sh, which supplies the node it talks to.
# Behind a feature so a plain `--tests` run cannot report it as passing.
[[test]]
name = "p2p_relay"
path = "tests/p2p_relay/main.rs"
required-features = ["relay-e2e"]

[features]
# The shipped browser artifact depends on this default. Building with
# --no-default-features drops the panic hook, turning browser panics into
# silent aborts.
default = ["debug"]
# Enable console_error_panic_hook for better error messages in debug builds
debug = ["dep:console_error_panic_hook"]
# The browser-to-node relay test; see tools/browser-p2p-e2e.sh.
relay-e2e = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd"]

[lints]
workspace = true
