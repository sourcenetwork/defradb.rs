[package]
name = "db"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DefraDB database and collection management"

[package.metadata.cargo-machete]
ignored = ["bytes", "libp2p", "multihash", "p2p", "rand", "serde", "serde_bytes", "serde_cbor", "zeroize"]

[features]
default = ["p2p", "native", "wasmtime-runtime"]
p2p = ["dep:libp2p", "p2p/libp2p-transport"]
native = ["events/channel", "acp/native"]
wasmtime-runtime = ["lens/wasmtime-runtime"]

[lib]
bench = false

[dependencies]
web-time.workspace = true
# Async runtime
async-trait.workspace = true
n0-future.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
ciborium.workspace = true
chrono = { version = "0.4", features = ["serde"] }

# Bytes (zero-copy block data on hot path)
bytes.workspace = true

# Memory zeroization for sensitive key material
zeroize = "1"

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# IPLD
cid.workspace = true
multihash.workspace = true

# Hashing
sha2.workspace = true
rapidhash.workspace = true

# Lock-free shared state
kovan.workspace = true
kovan-map.workspace = true
kovan-queue.workspace = true
regolith.workspace = true
# The worker pool: periodic and detached jobs, deadlines.
workers = { path = "../workers" }

# Random number generation (for Counter CRDT nonces)
rand.workspace = true

# Encoding
base64.workspace = true
hex.workspace = true

libp2p = { workspace = true, optional = true }

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }

# Internal crates
storage = { path = "../storage" }
datastore = { path = "../datastore" }
schema = { path = "../schema" }
document = { path = "../document" }
query = { path = "../query" }
blockstore = { path = "../blockstore" }
crypto = { path = "../crypto" }
defra-core = { path = "../defra-core" }
kms = { path = "../kms" }
# Remote signatures and embeddings: single-flight, waves, deadlines, retries.
inputs = { path = "../inputs" }
# The network runtime those round trips run on.
edge = { path = "../edge" }
identity = { path = "../identity" }
acp = { path = "../acp", default-features = false }
client = { path = "../client" }
crdt = { path = "../crdt" }
events = { path = "../events", default-features = false }
lens = { path = "../lens", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
p2p = { path = "../p2p", default-features = false }

# A browser peer replicates over the relay-only iroh transport; libp2p has no
# browser build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
p2p = { path = "../p2p", default-features = false, features = ["iroh-transport"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
defra-core = { path = "../defra-core", features = ["ambient"] }
# The test network runtime the P2P push tests wait on.
edge = { path = "../edge", features = ["testing"] }
proptest.workspace = true
blst = "0.3"
getrandom = "0.2"
tempfile = "3"
ed25519-dalek.workspace = true

[lints]
workspace = true
