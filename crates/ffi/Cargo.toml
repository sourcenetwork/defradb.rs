[package]
name = "ffi"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "FFI bindings for DefraDB Rust implementation"

[package.metadata.cargo-machete]
ignored = ["cid", "serde_bytes", "serde_ipld_dagcbor", "serde_yaml", "sha2", "thiserror"]

[lib]
bench = false
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["native", "wasmtime-runtime", "vera", "libp2p"]
native = ["db/native", "defra-node/native"]
iroh = ["defra-node/p2p", "p2p/iroh-transport"]
libp2p = ["db/p2p", "p2p/libp2p-transport", "defra-node/libp2p"]
vera = ["dep:vera", "defra-node/vera"]
sourcehub = ["vera"]
wasmtime-runtime = [
    "db/wasmtime-runtime",
    
    
    "defra-node/wasmtime-runtime",
    "lens/wasmtime-runtime",
]
profiling = ["dep:tracing-chrome", "dep:tracing-subscriber"]

[dependencies]
rapidhash.workspace = true
# The network runtime network calls block their C caller's thread on.
edge = { path = "../edge" }
# The worker pool the node's data path runs on.
workers = { path = "../workers" }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
serde_ipld_dagcbor.workspace = true
serde_bytes.workspace = true
base64.workspace = true

# Memory zeroization for sensitive key material
zeroize = "1"

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-chrome = { version = "0.7", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"], optional = true }

# Lock-free shared state
regolith.workspace = true
kovan.workspace = true
kovan-channel.workspace = true
kovan-map.workspace = true
kovan-queue.workspace = true

# Cryptographic hashing
sha2.workspace = true
hex.workspace = true

# Internal crates
crypto = { path = "../crypto" }
db = { path = "../db", default-features = false }
defra-core = { path = "../defra-core" }
defra-p2p-adapter = { path = "../p2p-adapter", default-features = false }
document = { path = "../document" }
events = { path = "../events" }
storage = { path = "../storage" }
query = { path = "../query" }
schema = { path = "../schema" }
identity = { path = "../identity" }
acp = { path = "../acp" }
vera = { path = "../vera", optional = true }
lens = { path = "../lens", default-features = false }
p2p = { path = "../p2p" }
blockstore = { path = "../blockstore" }
defra-node = { path = "../defra-node", default-features = false, features = ["managed-p2p"] }

# IPLD
cid.workspace = true

[build-dependencies]
cbindgen = "0.29"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
defra-core = { path = "../defra-core", features = ["ambient"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3.17"

[lints]
workspace = true
