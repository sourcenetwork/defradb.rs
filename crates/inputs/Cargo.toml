[package]
name = "inputs"
description = "Remote inputs (KMS keys, signatures, ACP decisions, embeddings): single-flight, batching, a byte-bounded cache, deadlines, retries and metrics"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
bench = false

[dependencies]
# `MaybeSend`, `MaybeSendSync` and `MaybeBoxFuture`: one service type for
# native and wasm.
defra-core = { path = "../defra-core" }
# Flights wait on `regolith::sync::Event`; the in-flight cap is a
# `regolith::sync::Semaphore`; the flight, lane and cache maps are its
# `HopscotchMap`, the queues its `SegQueue`.
regolith.workspace = true
# The clock retries and deadlines read: a regolith `Env`'s where the node has one.
workers = { path = "../workers" }
rapidhash.workspace = true
tracing.workspace = true
# The network runtime round trips run on, through its `Edge` handle.
edge = { path = "../edge" }
# The combinators a wait races with.
futures-lite.workspace = true
# Embedding request bodies and answers.
serde_json.workspace = true
# One Ollama wave's texts, in flight together.
futures.workspace = true
# `EmbeddingCallError`.
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The runtime's clock, which a paused-time test moves, and embedding
# request deadlines.
nuclei.workspace = true
# Embedding requests on nuclei sockets.
net = { path = "../net" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's clock, and embedding request deadlines.
n0-future.workspace = true
# Embedding requests through the browser's fetch.
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2"] }

[lints]
workspace = true
