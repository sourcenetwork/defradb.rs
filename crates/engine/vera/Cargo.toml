[package]
name = "vera"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Vera ACP client for DefraDB"

[lib]
bench = false

[dependencies]

# The network runtime the clients' connections and the providers' tasks run on.
edge = { path = "../../foundation/edge" }

# Cosmos SDK transaction building and signing
cosmrs = "0.22"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
async-trait.workspace = true

# Error handling
thiserror.workspace = true

hex.workspace = true

# Internal crates
acp = { path = "../../engine/acp" }
zanzibar = { path = "../../building-blocks/zanzibar" }
identity = { path = "../../building-blocks/identity" }
defra-core = { path = "../../foundation/defra-core" }
crypto = { path = "../../foundation/crypto" }
keyring = { path = "../../foundation/keyring", default-features = false }
# Delegation minting, the signers and the typed policy commands it digests.
vera-delegation = { path = "../../engine/vera-delegation" }
events = { path = "../../foundation/events" }
tempfile = "3"
vera-client = "0.2.0"
vera-domain = "0.2.0"
vera-modules = "0.2.0"
vera-permission = "0.2.0"
# The relationship subject type of the commands read back from a signed request.
vera-acp = "0.2.0"
# vera.rs's own token verifier: for a caller's delegation, and for the tokens built here in tests.
vera-crypto = "0.2.0"
commonware-codec = "=2026.10.0"

# Lock-free shared state
kovan.workspace = true
kovan-map.workspace = true
kovan-queue.workspace = true

# Remote decisions: single-flight, a deadline, retries, an in-flight cap,
# metrics; the byte-bounded registration cache.
inputs = { path = "../../building-blocks/inputs" }

# Logging
tracing.workspace = true

# Hashing
rapidhash.workspace = true
regolith.workspace = true

# Base64 for bearer token
base64.workspace = true

# ACP call encoding and identifiers
alloy-sol-types.workspace = true
alloy-primitives.workspace = true

# Authenticated ACP records and permission evaluation
acp-light-client = { git = "https://github.com/sourcenetwork/backbone.git", rev = "571ddf742cb17b1f95c171054bf7209e5f57e017" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# HTTP for REST/LCD and CometBFT JSON-RPC, and the gRPC channel, on nuclei
# sockets; the browser's fetch on wasm32 (below).
net = { path = "../../building-blocks/net" }
futures.workspace = true
prost.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
# The Cosmos event stream: a WebSocket over a futures-io stream (net::connect).
async-tungstenite = "0.35.0"
nuclei.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2"] }
n0-future.workspace = true

[dev-dependencies]
edge = { path = "../../foundation/edge", features = ["testing"] }
# The recording signer the provider's signer tests sign through.
vera-delegation = { path = "../../engine/vera-delegation", features = ["testing"] }
# Tests run with ordered JSON maps: bytes built from a map in any order but the sorted one then differ from the
# pinned ones, so a signed or hashed encoding that depends on this feature fails here and not only in a wider build.
serde_json = { workspace = true, features = ["preserve_order"] }
kovan-queue.workspace = true

[lints]
workspace = true
