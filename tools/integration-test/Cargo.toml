[dependencies]
vera-harness = { git = "https://github.com/sourcenetwork/vera.rs", rev = "982a617e7626a855bc9edce63d85385f74824129" }
commonware-codec = "2026.9.0"
defra-harness = { git = "https://github.com/sourcenetwork/backbone.git", rev = "60bc10e91827b153ec8ed87361f695814ec486e7" }
document = { path = "../../crates/document" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }
serde_json = "1.0"
futures = "0.3"
paste = "1.0"
ctor = "0.2"
chrono = { version = "0.4" }
defra-node = { path = "../../crates/defra-node", features = ["http", "libp2p"] }
db = { path = "../../crates/db" }
ciborium = { workspace = true }
events = { path = "../../crates/events" }
async-channel = "2"
cli = { path = "../../crates/cli" }
query = { path = "../../crates/query" }
schema = { path = "../../crates/schema" }
defra-core = { path = "../../crates/defra-core" }
serde.workspace = true
tempfile = "3.17"
thiserror.workspace = true
workers = { path = "../../crates/workers" }
edge = { path = "../../crates/edge" }
testo = { git = "https://github.com/sourcenetwork/testo.rs", rev = "79d83b0adedf00f85f9fd9aecc6fd009ed41332a" }
kovan.workspace = true
regolith.workspace = true
rapidhash.workspace = true
cid = { workspace = true }
base64 = "0.23"

[features]
generator = ["serde_json/preserve_order"]

[[bin]]
name = "gen_scenarios"
path = "src/bin/gen_scenarios/main.rs"
required-features = ["generator"]

[dev-dependencies]
mantra-macros = "0.9"
keyring = { path = "../../crates/keyring" }
vera-client = { git = "https://github.com/sourcenetwork/vera.rs", rev = "982a617e7626a855bc9edce63d85385f74824129" }
vera-domain = { git = "https://github.com/sourcenetwork/vera.rs", rev = "982a617e7626a855bc9edce63d85385f74824129" }
vera-modules = { git = "https://github.com/sourcenetwork/vera.rs", rev = "982a617e7626a855bc9edce63d85385f74824129" }
alloy-sol-types.workspace = true
acp = { path = "../../crates/acp" }
vera = { path = "../../crates/vera" }
libc = "0.2"
identity = { path = "../../crates/identity" }
crypto = { path = "../../crates/crypto" }
p2p = { path = "../../crates/p2p", features = ["iroh-transport"] }
hex = "0.4"
ciborium = { workspace = true }
serial_test = "3"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
mach2 = "0.4"

[[test]]
name = "acp_replay_outage_repro"
path = "tests/acp_replay_outage_repro.rs"

