[package]
name = "integration-test"
version = "0.1.0"
edition = "2021"
description = "Integration test harness for defradb"
license = "Apache-2.0 OR MIT"
autotests = false

[[test]]
name = "testo"
path = "tests/testo/main.rs"

[[test]]
name = "legacy"
path = "tests/legacy/main.rs"

[[test]]
name = "verars"
path = "tests/verars/main.rs"

[dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
vera-harness = { git = "https://github.com/sourcenetwork/vera.rs", rev = "523de40514848e9f0349f3bf7d5a0e9d161402c9" }
commonware-codec = "=2026.10.0"
defra-harness = { git = "https://github.com/sourcenetwork/backbone.git", rev = "330e38f184215f40a2bc926480b542bb75051b6d" }
crypto = { path = "../../crates/crypto" }
document = { path = "../../crates/document" }
edge = { path = "../../crates/edge", features = ["testing"] }
nuclei.workspace = true
net = { path = "../../crates/net" }
serde_json = "1.0"
futures.workspace = true
paste = "1.0"
ctor = "0.2"
chrono = { version = "0.4" }
defra-node = { path = "../../crates/defra-node", features = ["http", "libp2p"] }
events = { path = "../../crates/events" }
async-channel = "2"
cli = { path = "../../crates/cli" }
query = { path = "../../crates/query" }
schema = { path = "../../crates/schema" }
db = { path = "../../crates/db" }
defra-core = { path = "../../crates/defra-core" }
serde.workspace = true
tempfile = "3.17"
thiserror.workspace = true
workers = { path = "../../crates/workers" }
testo = { git = "https://github.com/sourcenetwork/testo.rs", rev = "79d83b0adedf00f85f9fd9aecc6fd009ed41332a" }
kovan.workspace = true
regolith.workspace = true
rapidhash.workspace = true
cid = { workspace = true }
base64 = "0.23"
hex = "0.4"
identity = { path = "../../crates/identity" }

[features]
generator = ["serde_json/preserve_order"]

[[bin]]
name = "gen_scenarios"
path = "src/bin/gen_scenarios/main.rs"
required-features = ["generator"]

[dev-dependencies]
mantra-macros = "0.9"
keyring = { path = "../../crates/keyring" }
vera-client = { git = "https://github.com/sourcenetwork/vera.rs", rev = "523de40514848e9f0349f3bf7d5a0e9d161402c9" }
vera-domain = { git = "https://github.com/sourcenetwork/vera.rs", rev = "523de40514848e9f0349f3bf7d5a0e9d161402c9" }
vera-modules = { git = "https://github.com/sourcenetwork/vera.rs", rev = "523de40514848e9f0349f3bf7d5a0e9d161402c9" }
alloy-sol-types.workspace = true
acp = { path = "../../crates/acp" }
vera = { path = "../../crates/vera" }
libc = "0.2"
p2p = { path = "../../crates/p2p", features = ["iroh-transport"] }
ciborium = { workspace = true }
serial_test = "3"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
mach2 = "0.4"

