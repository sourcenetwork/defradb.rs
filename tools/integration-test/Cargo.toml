[package]
name = "integration-test"
version = "0.1.0"
edition = "2021"
description = "Integration test harness for defradb"
license = "Apache-2.0 OR MIT"
autotests = false

[[test]]
name = "testo"
path = "tests/testo/main.rs"

[[test]]
name = "legacy"
path = "tests/legacy/main.rs"

[[test]]
name = "verars"
path = "tests/verars/main.rs"

[dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
commonware-codec = "=2026.10.0"
defra-harness = { git = "https://github.com/sourcenetwork/backbone.git", rev = "7993ba38d889d16503f7a6ec9c33ef91375e4c0e" }
crypto = { path = "../../crates/foundation/crypto" }
document = { path = "../../crates/building-blocks/document" }
blockstore = { path = "../../crates/engine/blockstore" }
edge = { path = "../../crates/foundation/edge", features = ["testing"] }
nuclei.workspace = true
net = { path = "../../crates/building-blocks/net" }
serde_json = "1.0"
graphql-parser.workspace = true
futures.workspace = true
paste = "1.0"
ctor = "1.0"
chrono = { version = "0.4" }
defra-node = { path = "../../crates/entry-points/defra-node", features = ["http", "libp2p", "p2p"] }
# Embedder stream protocols: the testo actions register and open them on iroh nodes.
p2p = { path = "../../crates/database/p2p", features = ["iroh-transport"] }
async-trait = { workspace = true }
events = { path = "../../crates/foundation/events" }
async-channel = "2"
cli = { path = "../../crates/entry-points/cli" }
clap = "4.5"
query = { path = "../../crates/engine/query" }
schema = { path = "../../crates/foundation/schema" }
defra-core = { path = "../../crates/foundation/defra-core" }
defra-version = { path = "../../crates/foundation/defra-version" }
serde.workspace = true
tempfile = "3.17"
thiserror.workspace = true
workers = { path = "../../crates/foundation/workers" }
testo = { git = "https://github.com/sourcenetwork/testo.rs", rev = "dc53fa515d5c39511845407dcd42a7650c07f66c" }
kovan.workspace = true
regolith.workspace = true
rapidhash.workspace = true
cid = { workspace = true }
base64 = "0.23"
hex = "0.4"
# Holds a stopped Go node's P2P port with SO_REUSEPORT until it restarts.
socket2 = { version = "0.6", features = ["all"] }
identity = { path = "../../crates/building-blocks/identity" }

[features]
generator = ["serde_json/preserve_order"]

[[bin]]
name = "gen_scenarios"
path = "src/bin/gen_scenarios/main.rs"
required-features = ["generator"]

[dev-dependencies]
query = { path = "../../crates/engine/query", features = ["testing"] }
vera-harness = { git = "https://github.com/sourcenetwork/vera.rs", rev = "177783a896068e26d4223c0a0835199870f88d3c" }
mantra-macros = "0.9"
keyring = { path = "../../crates/foundation/keyring" }
vera-client = "0.1.2"
vera-domain = "0.1.2"
vera-modules = "0.1.2"
alloy-sol-types.workspace = true
acp = { path = "../../crates/engine/acp" }
vera = { path = "../../crates/engine/vera" }
# The Vera node the in-process provider tests host themselves.
vera-embedded = { path = "../../crates/engine/vera-embedded", features = ["node"] }
libc = "0.2"
ciborium = { workspace = true }
serial_test = "4"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
mach2 = "0.6"

