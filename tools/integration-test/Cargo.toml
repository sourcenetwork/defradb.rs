[dependencies]
vera-harness = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2" }
commonware-codec = "2026.9.0"
defra-harness = { git = "https://github.com/sourcenetwork/backbone.git", rev = "a5a005e64b23110c604ec8b86784bbdb825432de" }
document = { path = "../../crates/document" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "system-proxy",
    "rustls-tls-native-roots",
] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3"
paste = "1.0"
ctor = "0.2"
chrono = { version = "0.4", features = ["serde"] }
kovan.workspace = true

[dev-dependencies]
keyring = { path = "../../crates/keyring" }
vera-client = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2" }
vera-domain = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2" }
vera-modules = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2" }
alloy-sol-types.workspace = true
acp = { path = "../../crates/acp" }
vera = { path = "../../crates/vera" }
tempfile = "3.17"
libc = "0.2"
identity = { path = "../../crates/identity" }
crypto = { path = "../../crates/crypto" }
p2p = { path = "../../crates/p2p", features = ["iroh-transport"] }
base64 = "0.22"
hex = "0.4"
cid = { workspace = true }
defra-core = { path = "../../crates/defra-core" }
ciborium = { workspace = true }
serial_test = "3"

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
mach2 = "0.4"

[[test]]
name = "acp_replay_outage_repro"
path = "tests/acp_replay_outage_repro.rs"

[[test]]
name = "acp_replay_outage_cross_runtime"
path = "tests/acp_replay_outage_cross_runtime.rs"
